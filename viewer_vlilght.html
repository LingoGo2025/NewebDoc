<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YouTube 訂閱">
<title>YouTube</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff0000'/%3E%3Cpolygon points='13,9 13,23 24,16' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="ati">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #ff0000; --dark: #0f0f0f; --card: #1a1a1a;
    --border: #333; --text: #f1f1f1; --muted: #aaa; --radius: 8px;
    --sidebar-w: 220px;
    --header-h: 49px;
  }
  body {
    background: var(--dark); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; display: flex; flex-direction: column; min-height: 100vh;
    overscroll-behavior-y: contain;
  }

  /* ── Pull-to-refresh 指示條 ── */
  #ptr-bar {
    position: fixed; top: var(--header-h); left: 0; right: 0;
    height: 0; overflow: hidden;
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    z-index: 45; pointer-events: none;
    transition: height .15s ease;
  }
  #ptr-bar .ptr-icon { color: #555; transition: color .2s; will-change: transform; }
  #ptr-bar.ptr-ready  .ptr-icon { color: var(--red); }
  #ptr-bar.ptr-loading .ptr-icon { color: var(--red); animation: spin .7s linear infinite; }

  /* ── Header ── */
  header {
    background: #111; border-bottom: 2px solid var(--red);
    padding: 0 16px; height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 50;
  }
  header svg { flex-shrink: 0; }
  header h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }

  /* ── 重新整理按鈕 ── */
  #reload-btn {
    flex-shrink: 0;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 6px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s, transform .3s;
  }
  #reload-btn:hover { color: var(--text); }
  #reload-btn.spinning svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 漢堡按鈕（手機才顯示）── */
  #menu-btn {
    display: none; flex-shrink: 0;
    background: none; border: none; color: var(--text);
    cursor: pointer; padding: 6px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  #menu-btn svg { display: block; }

  /* ── 手機 Drawer ── */
  #drawer-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 60;
    opacity: 0; transition: opacity .25s;
  }
  #drawer-overlay.open { opacity: 1; }

  #drawer {
    position: fixed; top: 0; left: 0;
    width: 70vw; max-width: 420px; height: 100dvh;
    background: #111; border-right: 1px solid var(--border);
    z-index: 70;
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform .25s ease;
    padding-top: var(--header-h);
    overscroll-behavior: contain;
  }
  #drawer.open { transform: translateX(0); }
  #drawer::-webkit-scrollbar { width: 4px; }
  #drawer::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; }

  /* ── Sidebar（桌機）── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: #111; border-right: 1px solid var(--border);
    position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow-y: auto; padding: 8px 0; z-index: 10; flex-shrink: 0;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  /* ── 頻道清單項目（sidebar & drawer 共用）── */
  .ch-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .1s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .ch-item:hover { background: #1c1c1c; }
  .ch-item:active { background: #222; }
  .ch-item.active { background: #1e1e1e; border-left-color: var(--red); }

  .ch-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #ccc;
    flex-shrink: 0; text-transform: uppercase;
  }
  .ch-item.active .ch-avatar { background: #4a1010; color: var(--red); }

  .ch-info { overflow: hidden; }
  .ch-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-count { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

  /* ── Main ── */
  main { flex: 1; padding: 16px; overflow: hidden; min-width: 0; }

  .channel-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .channel-heading h2 { font-size: 1rem; font-weight: 700; }
  .channel-heading a { color: var(--muted); font-size: 12px; text-decoration: none; }
  .channel-heading a:hover { color: var(--text); }

  /* ── 頁籤 ── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    margin-bottom: 16px; gap: 0;
  }
  .tab-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 20px; font-size: 13px; font-weight: 600;
    background: none; border: none; color: var(--muted);
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--red); }
  .tab-count {
    font-size: 11px; font-weight: 400; color: #666;
    background: #222; border-radius: 10px;
    padding: 1px 7px;
  }
  .tab-btn.active .tab-count { color: var(--muted); background: #2a2a2a; }

  /* ── 影片格（桌機格狀 & 手機 Shorts tab）── */
  #grid.grid-mode { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  #grid.list-mode, #grid.all-mode { display: block; }

  .video-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; border: 1px solid var(--border);
    transition: transform .15s, box-shadow .15s;
  }
  .video-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.5); border-color: #555; }

  .thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #000; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s; }
  .video-card:hover .thumb-wrap img { opacity: .8; }

  .play-btn {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s;
  }
  .video-card:hover .play-btn { opacity: 1; }
  @media (hover: none) {
    .play-btn { opacity: 1; }
    .play-btn span { background: rgba(0,0,0,.38); }
  }
  .play-btn span {
    background: rgba(0,0,0,.75); border: 2px solid #fff; border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }

  .video-card.is-short .thumb-wrap { aspect-ratio: 9/16; max-height: 320px; }

  .video-info { padding: 10px 12px 12px; }
  .video-channel { font-size: 11px; color: #666; margin-bottom: 4px; }
  .video-channel a { color: #666; text-decoration: none; }
  .video-channel a:hover { color: var(--muted); }
  .video-title {
    font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .video-title a { color: var(--text); text-decoration: none; }
  .video-title a:hover { color: var(--red); }
  .video-meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }

  /* ── 手機全寬影片卡（影片 tab / 全部 tab）── */
  .vf-card { margin-bottom: 22px; }
  .vf-card .thumb-wrap {
    border-radius: var(--radius); aspect-ratio: 16/9;
    overflow: hidden; background: #000; position: relative;
  }
  .vf-card .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vf-card .play-btn { opacity: 1; }
  .vf-card .play-btn span { background: rgba(0,0,0,.35); border-color: rgba(255,255,255,.85); }
  .vf-row { display: flex; gap: 10px; padding: 10px 2px 0; align-items: flex-start; }
  .vf-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #ccc; flex-shrink: 0; text-transform: uppercase;
  }
  .vf-body { flex: 1; min-width: 0; }
  .vf-title {
    font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vf-title a { color: inherit; text-decoration: none; }
  .vf-meta { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* ── Shorts 區段標頭（全部 tab）── */
  .shorts-hd {
    display: flex; align-items: center; gap: 7px;
    font-size: 16px; font-weight: 700; color: var(--text);
    margin: 16px 0 10px;
  }

  /* ── Short 小卡（2欄）── */
  .sc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .sc-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; border: 1px solid var(--border);
  }
  .sc-card .thumb-wrap { aspect-ratio: 9/16; }
  .sc-card .play-btn { opacity: 1; }
  .sc-card .play-btn span { width: 36px; height: 36px; font-size: 13px; background: rgba(0,0,0,.35); border-color: rgba(255,255,255,.8); }
  .sc-info { padding: 7px 8px 9px; }
  .sc-title {
    font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--text); margin-bottom: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sc-title a { color: inherit; text-decoration: none; }
  .sc-meta { font-size: 11px; color: var(--muted); }

  .loading { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 15px; }
  .error   { text-align: center; padding: 40px 24px; color: #e08080; background: #3a1a1a; border-radius: var(--radius); }
  .empty   { text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px; }

  footer { text-align: center; padding: 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }

  /* ── 平板（641–900px）── */
  @media (max-width: 900px) and (min-width: 641px) {
    :root { --sidebar-w: 176px; }
    .ch-name { font-size: 12px; }
    .ch-count { font-size: 10px; }
  }

  /* ── 手機（≤640px）── */
  @media (max-width: 640px) {
    :root { --header-h: 46px; }
    #menu-btn { display: flex; }
    #sidebar { display: none; }
    main { padding: 12px 10px; }
    #grid.grid-mode { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .video-info { padding: 8px 8px 10px; }
    .video-title { font-size: 12px; }
    .video-meta { font-size: 10px; }
    .tab-btn { padding: 8px 12px; font-size: 12px; }
  }

  /* ── 超小螢幕（≤360px）── */
  @media (max-width: 360px) {
    .video-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <!-- 漢堡按鈕（手機才顯示）-->
  <button id="menu-btn" onclick="openDrawer()" aria-label="頻道清單">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect y="3"  width="20" height="2" rx="1" fill="currentColor"/>
      <rect y="9"  width="20" height="2" rx="1" fill="currentColor"/>
      <rect y="15" width="20" height="2" rx="1" fill="currentColor"/>
    </svg>
  </button>
  <svg width="30" height="21" viewBox="0 0 30 21" fill="none">
    <rect x="1" y="1" width="28" height="19" rx="5" fill="#ff0000" stroke="white" stroke-width="2"/>
    <polygon points="12,6 12,15 21,10.5" fill="white"/>
  </svg>
  <h1>YouTube</h1>
  <span class="meta" id="meta">載入中...</span>
  <button id="reload-btn" onclick="reloadData()" aria-label="重新整理">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M15.5 9A6.5 6.5 0 1 1 9 2.5c1.8 0 3.4.73 4.6 1.9L11.5 6.5H16V2l-1.7 1.7A8 8 0 1 0 17 9h-1.5z" fill="currentColor"/>
    </svg>
  </button>
</header>

<!-- Pull-to-refresh 指示條 -->
<div id="ptr-bar">
  <svg class="ptr-icon" width="22" height="22" viewBox="0 0 18 18" fill="none">
    <path d="M15.5 9A6.5 6.5 0 1 1 9 2.5c1.8 0 3.4.73 4.6 1.9L11.5 6.5H16V2l-1.7 1.7A8 8 0 1 0 17 9h-1.5z" fill="currentColor"/>
  </svg>
</div>

<!-- 手機 Drawer -->
<div id="drawer-overlay" onclick="closeDrawer()"></div>
<nav id="drawer">
  <div style="padding:20px;font-size:12px;color:var(--muted)">載入頻道...</div>
</nav>

<div class="layout">
  <!-- 桌機 Sidebar -->
  <nav id="sidebar">
    <div style="padding:20px;font-size:12px;color:var(--muted)">載入頻道...</div>
  </nav>

  <main>
    <div class="channel-heading" id="ch-heading" style="display:none"></div>

    <!-- 頁籤：全部 / 影片 / Shorts -->
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab-btn"        data-tab="all"    onclick="selectTab('all')">
        全部 <span class="tab-count" id="count-all">0</span>
      </button>
      <button class="tab-btn active" data-tab="video"  onclick="selectTab('video')">
        影片 <span class="tab-count" id="count-video">0</span>
      </button>
      <button class="tab-btn"        data-tab="shorts" onclick="selectTab('shorts')">
        Shorts <span class="tab-count" id="count-shorts">0</span>
      </button>
    </div>

    <div class="loading" id="loading">載入影片資料中...</div>
    <div id="grid" style="display:none"></div>
    <div class="error" id="error" style="display:none"></div>
    <div class="empty" id="empty" style="display:none"></div>
  </main>
</div>

<footer id="footer"></footer>

<script>
  // ── Apple Touch Icon（用 canvas 產生 180×180 PNG）──
  (function() {
    var c = document.createElement('canvas');
    c.width = c.height = 180;
    var ctx = c.getContext('2d');
    var r = 38;
    // 白色外框
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(180-r, 0);
    ctx.quadraticCurveTo(180, 0, 180, r); ctx.lineTo(180, 180-r);
    ctx.quadraticCurveTo(180, 180, 180-r, 180); ctx.lineTo(r, 180);
    ctx.quadraticCurveTo(0, 180, 0, 180-r); ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath(); ctx.fill();
    // 紅色主體（內縮 9px）
    var s = 9, ri = 28;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.moveTo(s+ri, s); ctx.lineTo(180-s-ri, s);
    ctx.quadraticCurveTo(180-s, s, 180-s, s+ri); ctx.lineTo(180-s, 180-s-ri);
    ctx.quadraticCurveTo(180-s, 180-s, 180-s-ri, 180-s); ctx.lineTo(s+ri, 180-s);
    ctx.quadraticCurveTo(s, 180-s, s, 180-s-ri); ctx.lineTo(s, s+ri);
    ctx.quadraticCurveTo(s, s, s+ri, s); ctx.closePath(); ctx.fill();
    // 白色播放三角
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(66, 54); ctx.lineTo(66, 126); ctx.lineTo(132, 90);
    ctx.closePath();
    ctx.fill();
    document.getElementById('ati').href = c.toDataURL('image/png');
  })();

  var DATA_URL = 'https://lingogo2025.github.io/NewebDoc/data/all_videos.json';

  var allVideos  = [];
  var channelMap = {};
  var channels   = [];
  var activeId   = '__all__';
  var activeTab  = 'video';

  // ── 工具 ──
  function isShort(v) { return v.link.indexOf('/shorts/') !== -1; }

  function timeAgo(dateStr) {
    var diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
    if (diff < 60)       return diff + ' 秒前';
    if (diff < 3600)     return Math.floor(diff / 60) + ' 分鐘前';
    if (diff < 86400)    return Math.floor(diff / 3600) + ' 小時前';
    if (diff < 2592000)  return Math.floor(diff / 86400) + ' 天前';
    if (diff < 31536000) return Math.floor(diff / 2592000) + ' 個月前';
    return Math.floor(diff / 31536000) + ' 年前';
  }

  function formatViews(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000)    return (n / 1000).toFixed(1) + 'K';
    return n.toString();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function avatarChar(name) {
    return (name || '?').replace(/\s/g,'').charAt(0);
  }

  function openVideo(videoId, youtubeUrl) {
    var appUrl = 'videolite://www.youtube.com/watch?v=' + videoId;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(youtubeUrl).catch(function(){});
    }
    location.href = appUrl;
  }

  // ── 手勢滑動開關 Drawer ──
  (function() {
    var startX = 0, startY = 0, drawerOpen = false;
    var EDGE = 40;    // 從左緣幾 px 內開始才算
    var MIN_X = 60;   // 最小水平位移（px）
    var MAX_RATIO = 1.5; // 水平位移 / 垂直位移 要夠大才算橫滑

    document.addEventListener('touchstart', function(e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      drawerOpen = document.getElementById('drawer').classList.contains('open');
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      // 在 drawer 內部滑動不觸發關閉
      if (e.target.closest('#drawer')) return;

      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dy) * MAX_RATIO > Math.abs(dx)) return; // 縱向滑動忽略

      if (!drawerOpen && startX <= EDGE && dx >= MIN_X) {
        openDrawer();
      } else if (drawerOpen && dx <= -MIN_X) {
        closeDrawer();
      }
    }, { passive: true });
  })();

  // ── Drawer 開關 ──
  function openDrawer() {
    var overlay = document.getElementById('drawer-overlay');
    var drawer  = document.getElementById('drawer');
    overlay.style.display = 'block';
    // 強制 reflow 再加 open，讓 transition 生效
    overlay.offsetHeight;
    overlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    var overlay = document.getElementById('drawer-overlay');
    var drawer  = document.getElementById('drawer');
    overlay.classList.remove('open');
    drawer.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function() { overlay.style.display = 'none'; }, 260);
  }

  function isMobile() { return window.innerWidth <= 640; }

  // ── 桌機格狀卡片 ──
  function renderCard(v) {
    var onclick = 'openVideo(' + JSON.stringify(v.id) + ',' + JSON.stringify(v.link) + ');return false;';
    var cls     = 'video-card' + (isShort(v) ? ' is-short' : '');
    return '<div class="' + cls + '">'
      + '<a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">'
      + '<div class="thumb-wrap"><img src="' + escHtml(v.thumbnail) + '" alt="' + escHtml(v.title) + '" loading="lazy">'
      + '<div class="play-btn"><span>▶</span></div></div></a>'
      + '<div class="video-info">'
      + '<div class="video-channel"><a href="https://www.youtube.com/channel/' + escHtml(v.channel_id) + '" target="_blank" rel="noopener">' + escHtml(v.channel_name) + '</a></div>'
      + '<div class="video-title"><a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">' + escHtml(v.title) + '</a></div>'
      + '<div class="video-meta">'
      + (v.published ? '<span>🕐 ' + timeAgo(v.published) + '</span>' : '')
      + (v.view_count > 0 ? '<span>👁 ' + formatViews(v.view_count) + '</span>' : '')
      + '</div></div></div>';
  }

  // ── 手機全寬影片卡 ──
  function renderFullCard(v) {
    var onclick = 'openVideo(' + JSON.stringify(v.id) + ',' + JSON.stringify(v.link) + ');return false;';
    var meta = [];
    if (v.channel_name) meta.push(escHtml(v.channel_name));
    if (v.view_count > 0) meta.push(formatViews(v.view_count) + ' 次觀看');
    if (v.published)    meta.push(timeAgo(v.published));
    return '<div class="vf-card">'
      + '<a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">'
      + '<div class="thumb-wrap"><img src="' + escHtml(v.thumbnail) + '" alt="' + escHtml(v.title) + '" loading="lazy">'
      + '<div class="play-btn"><span>▶</span></div></div></a>'
      + '<div class="vf-row"><div class="vf-avatar">' + escHtml(avatarChar(v.channel_name)) + '</div>'
      + '<div class="vf-body">'
      + '<div class="vf-title"><a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">' + escHtml(v.title) + '</a></div>'
      + '<div class="vf-meta">' + meta.join(' · ') + '</div>'
      + '</div></div></div>';
  }

  // ── 手機 Short 小卡 ──
  function renderShortCard(v) {
    var onclick = 'openVideo(' + JSON.stringify(v.id) + ',' + JSON.stringify(v.link) + ');return false;';
    return '<div class="sc-card">'
      + '<a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">'
      + '<div class="thumb-wrap"><img src="' + escHtml(v.thumbnail) + '" alt="' + escHtml(v.title) + '" loading="lazy">'
      + '<div class="play-btn"><span>▶</span></div></div></a>'
      + '<div class="sc-info">'
      + '<div class="sc-title"><a href="' + escHtml(v.link) + '" onclick="' + escHtml(onclick) + '">' + escHtml(v.title) + '</a></div>'
      + '<div class="sc-meta">'
      + (v.view_count > 0 ? formatViews(v.view_count) + ' 次' : '')
      + (v.published ? (v.view_count > 0 ? ' · ' : '') + timeAgo(v.published) : '')
      + '</div></div></div>';
  }

  // ── 全部 tab：交錯排列（每3支影片搭配4支 Shorts）──
  function buildAllBlocks(videos) {
    var vids  = videos.filter(function(v) { return !isShort(v); });
    var shrts = videos.filter(isShort);
    var blocks = [], vi = 0, si = 0;
    while (vi < vids.length || si < shrts.length) {
      for (var i = 0; i < 3 && vi < vids.length; i++) blocks.push({ t: 'v', d: vids[vi++] });
      if (si < shrts.length) {
        var g = [];
        for (var j = 0; j < 4 && si < shrts.length; j++) g.push(shrts[si++]);
        blocks.push({ t: 's', d: g });
      }
    }
    return blocks;
  }

  // ── 更新頁籤數量 ──
  function updateTabCounts(base) {
    var nVid = base.filter(function(v) { return !isShort(v); }).length;
    var nShr = base.filter(isShort).length;
    document.getElementById('count-all').textContent    = base.length;
    document.getElementById('count-video').textContent  = nVid;
    document.getElementById('count-shorts').textContent = nShr;
  }

  // ── 重新渲染格子 ──
  function renderGrid() {
    var base  = (activeId === '__all__') ? allVideos : (channelMap[activeId] ? channelMap[activeId].videos : []);
    var grid  = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var html  = '';
    var count = 0;
    var mob   = isMobile();

    if (activeTab === 'all') {
      count = base.length;
      if (mob) {
        grid.className = 'all-mode';
        html = buildAllBlocks(base).map(function(b) {
          if (b.t === 'v') return renderFullCard(b.d);
          return '<div class="shorts-hd"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9.5 1L3.5 9h5L6.5 15 13 7H8L9.5 1z" fill="#ff0000"/></svg>Shorts</div>'
            + '<div class="sc-grid">' + b.d.map(renderShortCard).join('') + '</div>';
        }).join('');
      } else {
        grid.className = 'grid-mode';
        html = base.map(renderCard).join('');
      }
      document.getElementById('meta').textContent = count + ' 支影片';

    } else if (activeTab === 'video') {
      var vids = base.filter(function(v) { return !isShort(v); });
      count = vids.length;
      if (mob) {
        grid.className = 'list-mode';
        html = vids.map(renderFullCard).join('');
      } else {
        grid.className = 'grid-mode';
        html = vids.map(renderCard).join('');
      }
      document.getElementById('meta').textContent = count + ' 支影片';

    } else {
      var shrts = base.filter(isShort);
      count = shrts.length;
      if (mob) {
        grid.className = 'all-mode';
        html = '<div class="sc-grid">' + shrts.map(renderShortCard).join('') + '</div>';
      } else {
        grid.className = 'grid-mode';
        html = shrts.map(renderCard).join('');
      }
      document.getElementById('meta').textContent = count + ' 支 Shorts';
    }

    if (count === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
      empty.textContent = { all: '沒有影片資料', video: '此頻道目前沒有影片', shorts: '此頻道沒有 Shorts' }[activeTab];
    } else {
      grid.style.display = (grid.className === 'grid-mode') ? 'grid' : 'block';
      empty.style.display = 'none';
      grid.innerHTML = html;
    }
  }

  // ── 切換頁籤 ──
  function selectTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(el) {
      el.classList.toggle('active', el.dataset.tab === tab);
    });
    renderGrid();
  }

  // ── 切換頻道 ──
  function selectChannel(id) {
    activeId  = id;
    activeTab = 'video';

    // 高亮 sidebar 與 drawer 中的項目
    document.querySelectorAll('.ch-item').forEach(function(el) {
      el.classList.toggle('active', el.dataset.id === id);
    });

    // 頁籤重設
    document.querySelectorAll('.tab-btn').forEach(function(el) {
      el.classList.toggle('active', el.dataset.tab === 'video');
    });

    // 頻道標題
    var heading = document.getElementById('ch-heading');
    if (id === '__all__') {
      heading.style.display = 'none';
    } else {
      var ch = channelMap[id];
      heading.style.display = 'flex';
      heading.innerHTML = '<h2>' + escHtml(ch.name) + '</h2>'
        + '<a href="https://www.youtube.com/channel/' + escHtml(id) + '" target="_blank" rel="noopener">前往頻道 ↗</a>';
    }

    var base = (id === '__all__') ? allVideos : (channelMap[id] ? channelMap[id].videos : []);
    updateTabCounts(base);
    renderGrid();
    closeDrawer();

    // 捲回頂端
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── 渲染頻道清單（sidebar + drawer 同步）──
  function renderChannelList() {
    var html = '';

    html += '<div class="ch-item active" data-id="__all__" onclick="selectChannel(\'__all__\')">'
      + '<div class="ch-avatar">全</div>'
      + '<div class="ch-info"><div class="ch-name">全部頻道</div>'
      + '<div class="ch-count">' + allVideos.length + ' 支影片</div></div></div>'
      + '<hr class="sidebar-divider">';

    channels.forEach(function(ch) {
      var count = channelMap[ch.id] ? channelMap[ch.id].videos.length : 0;
      html += '<div class="ch-item" data-id="' + escHtml(ch.id) + '" onclick="selectChannel(\'' + escHtml(ch.id) + '\')">'
        + '<div class="ch-avatar">' + escHtml(avatarChar(ch.name)) + '</div>'
        + '<div class="ch-info"><div class="ch-name">' + escHtml(ch.name) + '</div>'
        + '<div class="ch-count">' + count + ' 支影片</div></div></div>';
    });

    document.getElementById('sidebar').innerHTML = html;
    document.getElementById('drawer').innerHTML  = html;
  }

  // ── 重新整理 ──
  function reloadData(onDone) {
    var btn = document.getElementById('reload-btn');
    btn.classList.add('spinning');
    allVideos = []; channelMap = {}; channels = [];
    activeId = '__all__'; activeTab = 'video';
    document.getElementById('grid').style.display        = 'none';
    document.getElementById('grid').innerHTML            = '';
    document.getElementById('empty').style.display       = 'none';
    document.getElementById('error').style.display       = 'none';
    document.getElementById('loading').style.display     = '';
    document.getElementById('tabs').style.display        = 'none';
    document.getElementById('ch-heading').style.display  = 'none';
    loadData().finally(function() {
      btn.classList.remove('spinning');
      if (onDone) onDone();
    });
  }

  // ── Pull-to-refresh 手勢 ──
  (function() {
    var startY    = 0;
    var pulling   = false;
    var triggered = false;
    var BAR_MAX   = 54;   // 指示條最大高度（px）
    var THRESHOLD = 72;   // 觸發更新所需的下拉距離（px）

    function bar()  { return document.getElementById('ptr-bar'); }
    function icon() { return bar().querySelector('.ptr-icon'); }

    function reset() {
      var b = bar();
      b.style.transition = 'height .2s ease';
      b.style.height     = '0';
      b.classList.remove('ptr-ready', 'ptr-loading');
      icon().style.transform = '';
      pulling = triggered = false;
    }

    document.addEventListener('touchstart', function(e) {
      if (window.scrollY > 0) return;
      if (document.getElementById('drawer').classList.contains('open')) return;
      startY    = e.touches[0].clientY;
      pulling   = true;
      triggered = false;
      bar().style.transition = 'none'; // 拖拉時不要 transition
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!pulling) return;
      if (window.scrollY > 0) { pulling = false; return; }

      var dy = e.touches[0].clientY - startY;
      if (dy <= 0) return;

      // 阻力效果：拉越多，增量越小
      var h        = Math.min(dy * 0.45, BAR_MAX);
      var progress = Math.min(dy / THRESHOLD, 1);

      bar().style.height = h + 'px';
      icon().style.transform = 'rotate(' + (progress * 180) + 'deg)';
      bar().classList.toggle('ptr-ready', progress >= 1);
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      if (!pulling) return;
      pulling = false;

      var dy = e.changedTouches[0].clientY - startY;
      if (dy >= THRESHOLD && !triggered) {
        triggered = true;
        bar().style.transition = 'none';
        bar().style.height     = BAR_MAX + 'px';
        bar().classList.remove('ptr-ready');
        bar().classList.add('ptr-loading');
        icon().style.transform = '';
        reloadData(reset);
      } else {
        reset();
      }
    }, { passive: true });
  })();

  // ── 主程式 ──
  function loadData() { return fetch(DATA_URL + '?t=' + Date.now())
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      document.getElementById('loading').style.display = 'none';

      allVideos = data.videos || [];
      allVideos.sort(function(a, b) {
        return new Date(b.published) - new Date(a.published);
      });

      var seen = {};
      allVideos.forEach(function(v) {
        if (!seen[v.channel_id]) {
          seen[v.channel_id] = true;
          channels.push({ id: v.channel_id, name: v.channel_name });
          channelMap[v.channel_id] = { name: v.channel_name, videos: [] };
        }
        channelMap[v.channel_id].videos.push(v);
      });
      channels.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-TW'); });

      document.getElementById('footer').textContent = '資料更新時間：' + (data.generated_at || '未知');
      document.getElementById('tabs').style.display = '';

      renderChannelList();
      updateTabCounts(allVideos);
      renderGrid();
    })
    .catch(function(e) {
      document.getElementById('loading').style.display = 'none';
      var err = document.getElementById('error');
      err.style.display = 'block';
      err.textContent = '無法載入資料：' + e.message;
    });
  }

  loadData();
</script>
