<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開啟影片...</title>
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: -apple-system, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .wrap { padding: 32px; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  p { color: #aaa; font-size: 14px; margin: 8px 0; }
  a { color: #ff0000; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">▶</div>
  <p>正在開啟 Tube PiP...</p>
  <p style="font-size:12px;margin-top:16px">若未自動開啟，<a id="yt-link" href="https://www.youtube.com">點此改用 YouTube 開啟</a></p>
</div>
<script>
  const params     = new URLSearchParams(location.search);
  const videoId    = (params.get('v') || '').replace(/[^a-zA-Z0-9_-]/g, '');
  const youtubeUrl = 'https://www.youtube.com/watch?v=' + videoId;
  const appUrl     = 'tubepip://www.youtube.com/watch?v=' + videoId;

  document.getElementById('yt-link').href = youtubeUrl;

  if (videoId) {
    window.location.href = appUrl;
    setTimeout(function () {
      window.location.href = youtubeUrl;
    }, 2000);
  } else {
    window.location.href = youtubeUrl;
  }
</script>
</body>
</html>
