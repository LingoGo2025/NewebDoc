<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開啟影片...</title>
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: -apple-system, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .wrap   { padding: 32px; max-width: 320px; }
  .icon   { font-size: 48px; margin-bottom: 20px; }
  .status { font-size: 15px; font-weight: 600; margin-bottom: 8px; min-height: 24px; }
  .hint   { color: #aaa; font-size: 13px; line-height: 1.6; min-height: 40px; }
  .btn    { display: inline-block; margin-top: 24px; padding: 14px 28px; background: #ff0000;
            color: #fff; border-radius: 8px; text-decoration: none; font-size: 15px; font-weight: 700; }
  .yt-link { display: block; margin-top: 16px; color: #555; font-size: 12px; text-decoration: none; }
  .yt-link:hover { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">▶</div>
  <div class="status" id="status">準備開啟影片</div>
  <div class="hint"   id="hint">點下方按鈕開啟 Tube PiP</div>
  <a id="app-btn" href="#"></a>
  <a id="yt-link" href="#" class="yt-link">改用 YouTube 開啟</a>
</div>
<script>
  var params     = new URLSearchParams(location.search);
  var videoId    = (params.get('v') || '').replace(/[^a-zA-Z0-9_-]/g, '');
  var youtubeUrl = 'https://www.youtube.com/watch?v=' + videoId;
  var appUrl     = 'tubepip://www.youtube.com/watch?v=' + videoId;

  var statusEl = document.getElementById('status');
  var hintEl   = document.getElementById('hint');
  var appBtn   = document.getElementById('app-btn');
  var ytLink   = document.getElementById('yt-link');

  if (!videoId) {
    location.href = 'https://www.youtube.com';
  }

  // 按鈕永遠先顯示
  appBtn.href        = appUrl;
  appBtn.textContent = '開啟 Tube PiP';
  ytLink.href        = youtubeUrl;

  // 嘗試複製到剪貼簿，成功才更新狀態
  function tryCopy() {
    // 方法一：Clipboard API（需 HTTPS 或 localhost）
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(youtubeUrl).then(function () {
          statusEl.textContent = '✅ 已複製 YouTube 連結';
          hintEl.textContent   = '開啟 App 後貼上即可播放';
        }).catch(function () {
          tryCopyLegacy();
        });
        return;
      } catch (e) { /* fall through */ }
    }
    tryCopyLegacy();
  }

  // 方法二：execCommand（舊版/HTTP fallback）
  function tryCopyLegacy() {
    try {
      var ta = document.createElement('textarea');
      ta.value = youtubeUrl;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) {
        statusEl.textContent = '✅ 已複製 YouTube 連結';
        hintEl.textContent   = '開啟 App 後貼上即可播放';
      }
    } catch (e) { /* 複製失敗，維持預設文字 */ }
  }

  tryCopy();
</script>
</body>
</html>
