ndomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo , MerchantOrderNo,RandomNum, TotalAmt不含在此API回應欄位中，需讓程式 InvoiceNumber（收據號碼）於資料庫中來取得這4個欄位資料。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"IS10001","reason":"收據號碼未填寫"},{"code":"IS10002","reason":"收據防偽隨機碼未填寫"},{"code":"IS10003","reason":"DisplayFlag 有誤"},{"code":"BS10015","reason":"折讓單號未填寫"},{"code":"BS10016","reason":"作廢單號未填寫"},{"code":"BS10017","reason":"查無折讓單資料"},{"code":"BS10018","reason":"查無作廢單資料"}],"versions":[]},

ata to the e-receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The e-receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit for each field is character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\", and fields must not contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparation","desc":"<p>(Must be completed, otherwise the program will fail)<\/p><p><br><\/p><p>1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Login to the test backend → Basic Data → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Login to the production backend → Basic Data → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Channel: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be set.<\/p><p>- Required Information: Server's public IP address (not internal IP, can be found at https://ifconfig.me)<\/p><p>- Effective Time: Typically 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely separate systems, and data is not shared. It is crucial to confirm that the integration URL has been switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common Error Signals for \"Forgot Pre-integration Steps\"<\/p><p>- `KEY10001 Not a Travel Agency API Integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data Decryption Error` → HashKey / HashIV is incorrect or still using sample values<\/p><p>- `KEY10009 Cannot retrieve travel agency's unified invoice number data` → MerchantID is incorrect or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Inquiry Process"}]},"apis":[{"name":"Single Invoice Receipt Allowance Inquiry API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Merchant Unified Invoice Number","example":"54352706","must_return":false,"note":"Merchant's unified invoice number.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Search Type","example":"2","must_return":false,"note":"2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Concatenated string fields encrypted with AES256, field descriptions are as follows:","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Contained Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"1.1","must_return":false,"note":"Fixed at 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., the number of seconds elapsed since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Invoice Number","example":"T13671005","must_return":false,"note":"The invoice number for this inquiry.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"Allowance Number","example":"722545","must_return":false,"note":"System serial number returned by the system when the allowance was issued.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If the inquiry is successful, return SUCCESS.\n2. If the inquiry fails, return the error code.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Allowance inquiry successful","must_return":true,"note":"Text description of the return status.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"722545","must_return":false,"note":"System serial number when the allowance was issued.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Invoice Number","example":"T13671003","must_return":false,"note":"Invoice number for which the allowance was performed.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Merchant Order Number","example":"O_6588415","must_return":false,"note":"The custom order number provided when issuing the receipt for this allowance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"The buyer's email address for that invoice when the invoice was issued.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceType","required":"","type":"int(1)","label":"Allowance Type","example":"1","must_return":false,"note":"0 = Allowance pending confirmation. After the buyer confirms the allowance, initiate confirmation with the platform.\n1 = Immediate allowance.","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"","type":"int(1)","label":"Allowance Status","example":"1","must_return":false,"note":"Status of the allowance.\n0 = Allowance not confirmed\n1 = Allowance confirmed\n2 = Allowance cancelled","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"AllowanceCreateTime","required":"","type":"datetime","label":"Allowance Creation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"Time when the allowance was issued, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceDate","required":"","type":"datetime","label":"Allowance Confirmation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"Time when the allowance was officially issued, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"Allowance Item Details","example":"","must_return":false,"note":"Item details at the time of invoice issuance (JSON format).\nItemNum = Item Serial Number\nItemName = Item Name\nItemCount = Quantity\nItemWord = Unit\nItemPrice = Unit Price\nItemAmount = Subtotal","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceTotalAmt","required":"","type":"int(8)","label":"Allowance Amount","example":"655","must_return":false,"note":"The amount of allowance issued this time.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Invoice Amount After Allowance","example":"522","must_return":false,"note":"The remaining amount of this invoice after the allowance is confirmed.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Clerk Name","example":"Ding Xiao Yu","must_return":false,"note":"Name of the person who issued the allowance.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify the legitimacy of the returned data. This parameter can be compared during integration to check if it was returned by the platform. Refer to \"SHA256 Encryption Explanation\" for verification methods. Returns empty if issuance fails.\n\nCheckCode = Hash value calculated according to SHA256 signature specifications using InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. These 4 fields need to be obtained from the database using the InvoiceNumber (Invoice Number).","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Always returns ##. Users receiving data as a String must also check for EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API Integration IP"},{"code":"KEY10002","reason":"Data Decryption Error"},{"code":"KEY10003","reason":"Invalid Version"},{"code":"KEY10004","reason":"Incomplete Data"},{"code":"KEY10006","reason":"Travel Agency Not Activated for E-receipts"},{"code":"KEY10007","reason":"Page Session Exceeded 30 Minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency's unified invoice number data"},{"code":"KEY10010","reason":"Merchant Unified Invoice Number is Blank"},{"code":"KEY10011","reason":"PostData_ Field is Blank"},{"code":"KEY10012","reason":"Data Transmission Error"},{"code":"KEY10013","reason":"Data is Blank"},{"code":"KEY10014","reason":"Timeout. Usually refers to I/O timeout."},{"code":"KEY10015","reason":"Invoice Amount Format Error"},{"code":"KEY10016","reason":"Travel Agency Not Subscribed to Value-Added Mailing Service"},{"code":"KEY10017","reason":"Insufficient Quota for Value-Added Mailing Service"},{"code":"KEY10018","reason":"Issuer Field Not Filled"},{"code":"KEY10019","reason":"Travel Agency Account Suspended"},{"code":"NOR10001","reason":"Network Connection Anomaly"},{"code":"IS10001","reason":"Invoice Number Not Filled"},{"code":"IS10002","reason":"Invoice Security Random Code Not Filled"},{"code":"IS10003","reason":"Invalid DisplayFlag"},{"code":"BS10015","reason":"Allowance Number Not Filled"},{"code":"BS10016","reason":"Voided Order Number Not Filled"},{"code":"BS10017","reason":"No Allowance Data Found"},{"code":"BS10018","reason":"No Voided Order Data Found"}],"versions":[]},

-bold text-cyan-700\">&amp;<\/span>記号でクエリ文字列 (Query String) 形式に結合する必要があります。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<span class=\"font-bold text-cyan-700\">JSON<\/span>オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このブロックのフィールドは、<span class=\"font-bold text-cyan-700\">{format}<\/span>形式で結合されます。","msg_req_security":"データセキュリティ：送信前に<span class=\"font-bold\">{group_type}<\/span>処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、店舗指定の<span class=\"font-bold text-green-700\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムから<span class=\"font-bold text-green-700\">{method}<\/span>方式で同期して<span class=\"font-bold text-green-700\">{location}<\/span>に返送されます。","msg_res_format_qs":"返送されるフィールドは、<span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span>記号でクエリ文字列 (Query String) 形式に結合されます。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返送されるフィールドは、<span class=\"font-bold text-cyan-700\">JSON<\/span>オブジェクト内に配置して送信されます。","msg_res_format_other":"返送されるフィールドは、<span class=\"font-bold text-cyan-700\">{format}<\/span>形式で結合されます。","msg_res_security":"復号化検証：受信後、特定のデータに対して<span class=\"font-bold\">{group_type}<\/span>処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前の結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_query-single-receipt-allowance-api/fc_2.png"},"meta":{"title":"単一レシート控除データ照会API","subtitle":"レシート控除データ照会","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子レシート発行控除データ後、本APIを通じてレシート控除のパラメータ、進捗、およびステータスを照会できます。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式でレシートデータを電子レシートプラットフォームに送信して発行します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームは、フォーマットされた文字列を返します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。漢字、英字、数字、記号はすべて1文字としてカウントします。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの文字（U+0026）を含んではなりません。<\/span><\/p>"},{"id":"section-2","title":"接続前の準備作業","desc":"<p>（先に完了してください、完了しないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリアバックエンドにログイン → 基本資料 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリアバックエンドにログイン → 基本資料 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーサービスセンター（FAX / Email）に送信<\/p><p>- 最大10個のIPを設定可能<\/p><p>- 提供が必要なもの：サーバーの外部IP（内部IPではなく、https://ifconfig.me で照会可能）<\/p><p>- 発効時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。上线前に必ず接続URLを本番エリアURLに切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備作業を忘れた」エラー信号<\/p><p>- `KEY10001 旅行会社API接続IPではありません` → IPホワイトリストが未設定または間違っている<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが正しくないか、またはサンプルの値のまま<\/p><p>- `KEY10009 旅行会社統一編号のデータが取得できません` → MerchantIDが間違っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"控除伝票照会フロー"}]},"apis":[{"name":"単一レシート控除データ照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"POSTパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索タイプ","example":"2","must_return":false,"note":"2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256で暗号化します。フィールドの説明は以下の表を参照してください。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.1","must_return":false,"note":"固定値 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）、つまり1970-01-01 00:00:00 UTCからの経過秒数です。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在時刻のタイムスタンプを指定することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"レシート番号","example":"T13671005","must_return":false,"note":"今回の照会対象レシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"控除番号","example":"722545","must_return":false,"note":"控除伝票発行時にシステムから返却されたシステム連番。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 照会成功の場合は SUCCESS を返却します。\n2. 照会失敗の場合はエラーコードを返却します。","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"控除伝票の照会に成功しました","must_return":true,"note":"今回の返却ステータスに関するテキストメッセージ","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"控除連番","example":"722545","must_return":false,"note":"控除発行時のシステム連番","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13671003","must_return":false,"note":"控除処理の対象となったレシート番号","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム注文番号","example":"O_6588415","must_return":false,"note":"今回の控除発行レシートで、レシート発行時に指定されたカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"購入者メールアドレス","example":"abc@gmail.com","must_return":false,"note":"レシート発行時に、そのレシートの購入者のメールアドレス。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceType","required":"","type":"int(1)","label":"控除タイプ","example":"1","must_return":false,"note":"0=発行待ち控除。購入者が控除を確認後、プラットフォームに確認発行を依頼します。\n1=即時控除。","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"","type":"int(1)","label":"控除ステータス","example":"1","must_return":false,"note":"この控除伝票のステータス。\n0=未確認控除\n1=確認済控除\n2=取消済控除","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"AllowanceCreateTime","required":"","type":"datetime","label":"控除作成日時","example":"2014-09-25 12:12:12","must_return":false,"note":"この控除伝票の発行日時。例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceDate","required":"","type":"datetime","label":"確認控除日時","example":"2014-09-25 12:12:12","must_return":false,"note":"この控除伝票が確定した発行日時。例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"控除商品詳細","example":"","must_return":false,"note":"このレシート発行時の商品情報 (JSON形式)。\nItemNum = 品番\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceTotalAmt","required":"","type":"int(8)","label":"控除金額","example":"655","must_return":false,"note":"今回の控除発行金額","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"控除後レシート残額","example":"522","must_return":false,"note":"控除確認後、このレシートの残りの金額。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"控除伝票発行担当者の氏名。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回のデータ返却の正当性を検証するために使用します。接続時にこのパラメータデータと比較して、プラットフォームからの返却であるかを確認できます。検証方法については「SHA256暗号化説明」を参照してください。発行失敗の場合は空値を返却します。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名仕様に従って計算して得られるハッシュ値\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt はこのAPIの応答フィールドには含まれていません。プログラムはデータベースからこれらの4つのフィールドのデータを取得する必要があります (レシート番号を使用して)。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列終了記号","example":"##","must_return":true,"note":"固定値 ## を返却します。String方式でデータを受け取るユーザーは、EndStr=## を追加で判断し、データの完全な送信を確保する必要があります。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API接続IPではありません。"},{"code":"KEY10002","reason":"データ復号化エラー。"},{"code":"KEY10003","reason":"バージョンエラー。"},{"code":"KEY10004","reason":"データが不十分です。"},{"code":"KEY10006","reason":"旅行会社が電子レシート申請・有効化されていません。"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えました。"},{"code":"KEY10009","reason":"旅行会社統一編番号のデータが取得できません。"},{"code":"KEY10010","reason":"旅行会社統一編番号が空白です。"},{"code":"KEY10011","reason":"PostData_フィールドが空白です。"},{"code":"KEY10012","reason":"データ送信エラー。"},{"code":"KEY10013","reason":"データが空白です。"},{"code":"KEY10014","reason":"TimeOut。通常、I/O上のタイムアウトを指します。"},{"code":"KEY10015","reason":"レシート金額の形式エラー。"},{"code":"KEY10016","reason":"旅行会社が郵便印刷付加価値サービスを申請していません。"},{"code":"KEY10017","reason":"郵便印刷付加価値サービスの利用可能数が不足しています。"},{"code":"KEY10018","reason":"発行者フィールドが未入力です。"},{"code":"KEY10019","reason":"旅行会社は利用停止処分を受けています。"},{"code":"NOR10001","reason":"ネットワーク接続異常。"},{"code":"IS10001","reason":"レシート番号が未入力です。"},{"code":"IS10002","reason":"レシート偽造防止ランダムコードが未入力です。"},{"code":"IS10003","reason":"DisplayFlagが不正です。"},{"code":"BS10015","reason":"控除伝票番号が未入力です。"},{"code":"BS10016","reason":"作廢伝票番号が未入力です。"},{"code":"BS10017","reason":"控除伝票データが見つかりません。"},{"code":"BS10018","reason":"作廢伝票データが見つかりません。"}],"versions":[]},

mono font-bold text-cyan-700\">&amp;<\/span>記号でクエリ文字列（Query String）形式に結合する必要があります。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<span class=\"font-bold text-cyan-700\">JSON<\/span>オブジェクト内に配置して転送する必要があります。","msg_req_format_other":"このブロックのフィールドは、<span class=\"font-bold text-cyan-700\">{format}<\/span>形式で結合されます。","msg_req_security":"データセキュリティ：転送前に<span class=\"font-bold\">{group_type}<\/span>処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、店舗指定の<span class=\"font-bold text-green-700\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムから<span class=\"font-bold text-green-700\">{method}<\/span>形式で<span class=\"font-bold text-green-700\">{location}<\/span>に同期して返信されます。","msg_res_format_qs":"返信されるフィールドは、<span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span>記号でクエリ文字列（Query String）形式に結合されます。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは、<span class=\"font-bold text-cyan-700\">JSON<\/span>オブジェクト内に配置して転送されます。","msg_res_format_other":"返信されるフィールドは、<span class=\"font-bold text-cyan-700\">{format}<\/span>形式で結合されます。","msg_res_security":"復号化検証：受信後、特定のデータに対して<span class=\"font-bold\">{group_type}<\/span>処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_query-single-receipt-allowance-api/fc_3.png"},"meta":{"title":"単筆照会レシート控除データAPI","subtitle":"レシート控除データの照会","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子レシート発行控除データ後、本APIでレシート控除のパラメータ、進捗、状態を照会できます。<\/span><\/p>"},{"id":"section-1","title":"データ交換方法","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」形式でレシートデータを電子レシートプラットフォームに送信し、発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームはフォーマットされた文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中国語、英語、数字、記号はすべて1文字としてカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの記号（U+0026）を含んではいけません。<\/span><\/p>"},{"id":"section-2","title":"接続前の準備作業","desc":"<p>（先に完了してください、完了しないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリアバックエンドにログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリアバックエンドにログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後、カスタマーサービスセンター（FAX / Email）へ送信<\/p><p>- 最大10個のIPを設定可能<\/p><p>- 提供が必要なもの：サーバーの対外IP（内部IPではない、https://ifconfig.me で確認可能）<\/p><p>- 発効時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>-テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番稼働前に、必ず接続URLを本番エリアのURLに切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備作業を忘れた」エラー信号<\/p><p>- `KEY10001 非旅行会社 API接続IP` → IPホワイトリストが設定されていないか、間違っている<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが正しくないか、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社統一編番号のデータが取得できない` → MerchantIDが間違っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"控除単の照会プロセス"}]},"apis":[{"name":"単筆照会レシート控除データAPI","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索種類","example":"2","must_return":false,"note":"2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256暗号化、フィールド説明は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.1","must_return":false,"note":"固定で 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）、すなわち1970-01-01 00:00:00 UTCからの経過秒数\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200、現在の時間を入力することを推奨します","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"レシート番号","example":"T13671005","must_return":false,"note":"今回の照会レシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"廃止伝票番号","example":"722545","must_return":false,"note":"控除伝票発行時にシステムが返したシステム連番。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム返信メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返信ステータス","example":"SUCCESS","must_return":true,"note":"1.照会成功の場合は SUCCESS を返信\n2.照会失敗の場合はエラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返信メッセージ","example":"控除伝票の照会に成功しました","must_return":true,"note":"テキスト、今回の返信ステータスメッセージ","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"控除連番","example":"722545","must_return":false,"note":"控除発行時のシステム連番","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13671003","must_return":false,"note":"控除実行レシート番号","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"O_6588415","must_return":false,"note":"今回のレシート発行時に提供されたカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"購入者Email","example":"abc@gmail.com","must_return":false,"note":"レシート発行時の、そのレシートの購入者メールアドレス。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceType","required":"","type":"int(1)","label":"控除方式","example":"1","must_return":false,"note":"0=発行待ち控除。購入者が控除確認後、プラットフォームに確認待ち控除を起動。\n1=即時控除。","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"","type":"int(1)","label":"控除ステータス","example":"1","must_return":false,"note":"その控除伝票のステータス。\n0=未確認控除\n1=確認済控除\n2=取消控除","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"AllowanceCreateTime","required":"","type":"datetime","label":"控除作成日時","example":"2014-09-25 12:12:12","must_return":false,"note":"その控除伝票の発行日時、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceDate","required":"","type":"datetime","label":"確認控除日時","example":"2014-09-25 12:12:12","must_return":false,"note":"その控除伝票の確定発行日時、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"控除商品","example":"","must_return":false,"note":"そのレシート発行時の商品情報（JSON形式）。\nItemNum = 品番\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceTotalAmt","required":"","type":"int(8)","label":"控除金額","example":"655","must_return":false,"note":"今回の控除発行金額","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"控除後レシート残高","example":"522","must_return":false,"note":"控除確認後、このレシートの残りの金額。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"控除伝票発行担当者名。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回のデータ返信の正当性を確認するためのコード。接続時にこのパラメータデータを比較して、プラットフォームからの返信であることを検証できます。検証方法については「SHA256暗号化説明」を参照してください。発行失敗の場合は空値を返します。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt をSHA256署名規格に従って計算したハッシュ値\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt はこのAPI応答フィールドには含まれていません。プログラムはデータベースからInvoiceNumber（レシート番号）を使用してこれら4つのフィールドデータを取得する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列終了","example":"##","must_return":true,"note":"固定で ## を返します。String形式でデータを受信するユーザーは、EndStr=## を追加で判定し、データ伝送の完全性を保証する必要があります。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行会社 API接続IP"},{"code":"KEY10002","reason":"データ復号化エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データが不足しています"},{"code":"KEY10006","reason":"旅行会社が電子レシート発行サービスを申請・有効化していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えています"},{"code":"KEY10009","reason":"旅行会社統一編番号のデータが取得できません"},{"code":"KEY10010","reason":"旅行会社統一編番号が空白です"},{"code":"KEY10011","reason":"PostData_フィールドが空白です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空白です"},{"code":"KEY10014","reason":"TimeOut。通常、I/Oにおけるタイムアウトを指します"},{"code":"KEY10015","reason":"レシート金額形式エラー"},{"code":"KEY10016","reason":"旅行会社が郵便印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵便印刷付加価値サービス利用可能数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが入力されていません"},{"code":"KEY10019","reason":"旅行会社が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"IS10001","reason":"レシート番号が入力されていません"},{"code":"IS10002","reason":"レシート偽造防止ランダムコードが入力されていません"},{"code":"IS10003","reason":"DisplayFlagが不正です"},{"code":"BS10015","reason":"控除伝票番号が入力されていません"},{"code":"BS10016","reason":"廃止伝票番号が入力されていません"},{"code":"BS10017","reason":"控除伝票データが見つかりません"},{"code":"BS10018","reason":"廃止伝票データが見つかりません"}],"versions":[]},

as i ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt för överföring.","msg_req_format_other":"Fälten i det här blocket kombineras enligt formatet <span class=\"font-bold text-cyan-700\">{format}<\/span>.","msg_req_security":"Datasäkerhet: Före överföring måste <span class=\"font-bold\">{group_type}<\/span>-behandling utföras.","msg_res_info_webhook":"Det här resultatet kommer att pushas av systemet asynkront till butikens specificerade <span class=\"font-bold text-green-700\">Webhook<\/span>-mottagningsadress.","msg_res_info_sync":"Det här resultatet kommer att returneras synkront av systemet med metoden <span class=\"font-bold text-green-700\">{method}<\/span> till <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras med symbolen <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> till ett frågesträngsformat (Query String), till exempel <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten kommer att placeras i ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt för överföring.","msg_res_format_other":"De returnerade fälten kombineras enligt formatet <span class=\"font-bold text-cyan-700\">{format}<\/span>.","msg_res_security":"Verifiera dekryptering: Efter mottagning måste specifik data genomgå <span class=\"font-bold\">{group_type}<\/span>-behandling.","lbl_sha_pre_hash":"Sträng före kryptering (String to Hash)","ph_sha_pre_hash":"Efter att ha tryckt på kodningsknappen visas den faktiska fullständiga strängen som krypterades här...","flowchart_0_url":"assets/flowcharts_query-single-receipt-allowance-api/fc_4.png"},"meta":{"title":"API för att hämta data om enskilda kvittoavdrag","subtitle":"Hämta data om kvittoavdrag","version":"","sections":[{"id":"section-0","title":"Syfte med anslutning","desc":"<p><span style=\"color: rgb(0, 0, 0);\">Efter att ett elektroniskt kvitto har utfärdat avdragsdata kan detta API användas för att hämta parametrar, status och framsteg för kvittoavdrag.<\/span><\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittoinformation till den elektroniska kvittoplattformen för utfärdande med metoden \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Enheterna för beräkning av varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten är åtskilda av \"&amp;\" som skiljetecken, och varje fält får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelser före anslutning","desc":"<p>(Måste göras först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på bakgrunden i testområdet → Grundläggande information → Inställningar för API-anslutning → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på bakgrunden i produktionsområdet → Grundläggande information → Inställningar för API-anslutning → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlista<\/p><p>- Ansökningsfönster: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det sedan till kundtjänstcentret (fax / e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP-adress (inte intern IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Giltighetstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöadresser<\/p><p>-Testmiljö och produktionsmiljö är helt olika enheter, och data är inte gemensam. Innan driftsättning måste du bekräfta att anslutningsadressen har bytts till produktionsmiljöns adress.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden för \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte resebyråns API-anslutnings-IP` → IP-vitlistan har inte ställts in eller är felaktig<\/p><p>- `KEY10002 Data-dekryptering misslyckades` → HashKey / HashIV är felaktig eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns enhetliga organisationsnummer` → MerchantID felaktig eller inte aktiverad<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för att hämta avdragsorder"}]},"apis":[{"name":"API för att hämta data om enskilda kvittoavdrag","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns enhetliga organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns enhetliga organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Sökningstyp","example":"2","must_return":false,"note":"2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Kombination av strängfält som AES256-krypterats, fältbeskrivning enligt nedanstående tabell","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält som ingår i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Anslutningsprogramversion","example":"1.1","must_return":false,"note":"Ständigt med 1.1","enum_va         const globalCodeExamples = {"PHP":"<?php\n\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct\n * credentials for the target environment before use.\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code\n * will block and display an error if placeholders are detected.\n */\n\n// API Endpoints\ndefine('API_ENDPOINT_PRODUCTION', 'https://api.travelinvoice.com.tw/invoice_search');\ndefine('API_ENDPOINT_TEST', 'https://capi.travelinvoice.com.tw/invoice_search');\n\n// Environment selection\ndefine('IS_TEST_ENVIRONMENT', true); // Set to false for production\n\n// Credentials - Replace with your actual values\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');     // 32 bytes — used for AES-256 encryption\ndefine('AES_IV', 'YOUR_AES_IV_HERE');       // 16 bytes — used for AES-256 encryption\ndefine('HASH_KEY', 'YOUR_HASH_KEY_HERE');   // Used for SHA256 signature verification (usually same as AES_KEY)\ndefine('HASH_IV', 'YOUR_HASH_IV_HERE');     // Used for SHA256 signature verification (usually same as AES_IV)\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE'); // Your Merchant ID (旅行社統一編號)\n\n// --- Placeholder Validation ---\n$placeholders = [];\nif (AES_KEY === 'YOUR_AES_KEY_HERE') $placeholders[] = 'AES_KEY';\nif (AES_IV === 'YOUR_AES_IV_HERE') $placeholders[] = 'AES_IV';\nif (HASH_KEY === 'YOUR_HASH_KEY_HERE') $placeholders[] = 'HASH_KEY';\nif (HASH_IV === 'YOUR_HASH_IV_HERE') $placeholders[] = 'HASH_IV';\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE') $placeholders[] = 'MERCHANT_ID';\n\nif (!empty($placeholders)) {\n    echo '<div style=\"color: red; border: 1px solid red; padding: 10px; margin: 20px;\">';\n    echo '<h3>Error: Placeholder Credentials Detected!<\/h3>';\n    echo '<p>Please replace the following placeholder constants with your actual credentials before running:<\/p>';\n    echo '<ul>';\n    foreach ($placeholders as $placeholder) {\n        echo \"<li><strong>{$placeholder}<\/strong><\/li>\";\n    }\n    echo '<\/ul>';\n    echo '<p>The script will terminate until all placeholders are replaced.<\/p>';\n    echo '<\/div>';\n    exit();\n}\n\n// Check key and IV lengths\nif (strlen(AES_KEY) !== 32) {\n    die('<div style=\"color: red;\">Error: AES_KEY must be 32 bytes long. Current length: ' . strlen(AES_KEY) . '<\/div>');\n}\nif (strlen(AES_IV) !== 16) {\n    die('<div style=\"color: red;\">Error: AES_IV must be 16 bytes long. Current length: ' . strlen(AES_IV) . '<\/div>');\n}\nif (strlen(HASH_KEY) !== 32) {\n    die('<div style=\"color: red;\">Error: HASH_KEY must be 32 bytes long. Current length: ' . strlen(HASH_KEY) . '<\/div>');\n}\nif (strlen(HASH_IV) !== 16) {\n    die('<div style=\"color: red;\">Error: HASH_IV must be 16 bytes long. Current length: ' . strlen(HASH_IV) . '<\/div>');\n}\n\n/**\n * Encrypts data using AES-256-CBC with custom 32-byte block PKCS7 padding.\n *\n * @param string $plaintext The data to encrypt (UTF-8 encoded).\n * @param string $key The 32-byte encryption key.\n * @param string $iv The 16-byte initialization vector.\n * @return string The ciphertext in hexadecimal format.\n * @throws Exception If encryption fails.\n */\nfunction encryptAes256(string $plaintext, string $key, string $iv): string\n{\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $block_size = 32; // Custom block size for padding\n    $paddingLen = $block_size - (strlen($plaintext) % $block_size);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encrypted = openssl_encrypt(\n        $paddedPlaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, // OPENSSL_ZERO_PADDING disables built-in padding\n        $iv\n    );\n\n    if ($encrypted === false) {\n        throw new Exception('AES encryption failed: ' . openssl_error_string());\n    }\n\n    return strtoupper(bin2hex($encrypted));\n}\n\n/**\n * Verifies the SHA256 signature of the API response.\n *\n * The InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt fields are used for verification.\n * Note: InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not returned by this specific API endpoint.\n * They must be retrieved from your database based on the InvoiceNumber or AllowanceNo from the request.\n * For demonstration purposes, placeholder values or values from the original transaction are used here.\n *\n * @param array $responseParams An associative array of relevant parameters from the API response.\n * @param string $hashKey The SHA256 key.\n * @param string $hashIv The SHA256 IV.\n * @param string $expectedCheckCode The CheckCode received from the API response.\n * @return bool True if the signature is valid, false otherwise.\n */\nfunction verifySha256Signature(array $responseParams, string $hashKey, string $hashIv, string $expectedCheckCode): bool\n{\n    // These fields are required for SHA256 signature verification but are not\n    // returned in the response of this specific \"query allowance\" API.\n    // In a real application, these values would be retrieved from your database\n    // using the InvoiceNumber or AllowanceNo present in the response or the original request.\n    // For this example, we're using placeholder values.\n    $invoiceTransNo = isset($responseParams['InvoiceTransNo']) ? $responseParams['InvoiceTransNo'] : 'YOUR_ORIGINAL_INVOICE_TRANS_NO';\n    $merchantID = isset($responseParams['MerchantID']) ? $responseParams['MerchantID'] : MERCHANT_ID; // MerchantID is usually constant\n    $merchantOrderNo = isset($responseParams['MerchantOrderNo']) ? $responseParams['MerchantOrderNo'] : 'YOUR_ORIGINAL_MERCHANT_ORDER_NO';\n    $randomNum = isset($responseParams['RandomNum']) ? $responseParams['RandomNum'] : 'YOUR_ORIGINAL_RANDOM_NUM';\n    $totalAmt = isset($responseParams['TotalAmt']) ? $responseParams['TotalAmt'] : 'YOUR_ORIGINAL_TOTAL_AMT';\n\n    // 1. Collect all participating field values and sort alphabetically by English name.\n    // The spec provides the exact sorted order needed for combination.\n    $paramsForSignature = [\n        'InvoiceTransNo'  => $invoiceTransNo,\n        'MerchantID'      => $merchantID,\n        'MerchantOrderNo' => $merchantOrderNo,\n        'RandomNum'       => $randomNum,\n        'TotalAmt'        => $totalAmt,\n    ];\n\n    // 2. Construct the signature string.\n    // Format: HashIV={IV值}&Field1={Value1}&Field2={Value2}&HashKey={Key值}\n    // Fields must be in A->Z alphabetical order after HashIV and before HashKey.\n    $signatureString = 'HashIV=' . $hashIv;\n    $signatureString .= '&InvoiceTransNo=' . $paramsForSignature['InvoiceTransNo'];\n    $signatureString .= '&MerchantID=' . $paramsForSignature['MerchantID'];\n    $signatureString .= '&MerchantOrderNo=' . $paramsForSignature['MerchantOrderNo'];\n    $signatureString .= '&RandomNum=' . $paramsForSignature['RandomNum'];\n    $signatureString .= '&TotalAmt=' . $paramsForSignature['TotalAmt'];\n    $signatureString .= '&HashKey=' . $hashKey;\n\n    // 3. Perform SHA256 calculation and convert to uppercase hexadecimal.\n    $calculatedCheckCode = strtoupper(hash('sha256', $signatureString));\n\n    // 4. Compare with the received CheckCode using a timing-safe function.\n    return hash_equals($expectedCheckCode, $calculatedCheckCode);\n}\n\n/**\n * Calls the \"Query Receipt Allowance Data\" API.\n *\n * @param array $requestData The data for the PostD                ];\n\n                echo '<div class=\"response-section\">';\n                echo '<h2>API 請求<\/h2>';\n                echo '<h3>PostData_內含欄位 (明文)<\/h3>';\n                echo '<pre>' . htmlspecialchars(http_build_query($requestParams)) . '<\/pre>';\n                echo '<h3>完整請求參數 (POST Body)<\/h3>';\n                echo '<pre>' . htmlspecialchars(http_build_query([\n                    'MerchantID_' => MERCHANT_ID,\n                    'SearchType_' => 2,\n                    'PostData_'   => '...[AES-256 encrypted hex string]...'\n                ])) . '<\/pre>';\n\n                try {\n                    $apiResponse = callTravelInvoiceApi($requestParams);\n\n                    echo '<h2>API 回應<\/h2>';\n                    echo '<h3>原始 JSON 回應<\/h3>';\n                    echo '<pre>' . htmlspecialchars(json_encode($apiResponse, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE)) . '<\/pre>';\n\n                    $status = $apiResponse['Status'] ?? 'UNKNOWN';\n                    $message = $apiResponse['Message'] ?? 'No message from API.';\n                    $endStr = $apiResponse['EndStr'] ?? '';\n                    $checkCode = $apiResponse['CheckCode'] ?? '';\n\n                    echo '<p>回傳狀態: <span class=\"' . ($status === 'SUCCESS' ? 'success' : 'error') . '\">' . htmlspecialchars($status) . '<\/span><\/p>';\n                    echo '<p>回傳訊息: ' . htmlspecialchars($message) . '<\/p>';\n\n                    if ($endStr !== '##') {\n                        echo '<p class=\"warning\">警告: 回應字串結尾 EndStr 不為 \"##\"，資料可能不完整。<\/p>';\n                    }\n\n                    if ($status === 'SUCCESS') {\n                        // For SHA256 verification, we need original transaction details\n                        // that are NOT part of this API's response.\n                        // These would typically be retrieved from your database based on the\n                        // InvoiceNumber or AllowanceNo that you just queried.\n i>折讓方式 (AllowanceType): ' . htmlspecialchars($apiResponse['AllowanceType'] ?? 'N/A') . '<\/li>';\n                        echo '<li>折讓狀態 (AllowanceStatus): ' . htmlspecialchars($apiResponse['AllowanceStatus'] ?? 'N/A') . '<\/li>';\n                        echo '<li>折讓建立日期 (AllowanceCreateTime): ' . htmlspecialchars($apiResponse['AllowanceCreateTime'] ?? 'N/A') . '<\/li>';\n                        echo '<li>確認折讓日期 (AllowanceDate): ' . htmlspecialchars($apiResponse['AllowanceDate'] ?? 'N/A') . '<\/li>';\n                        echo '<li>折讓金額 (AllowanceTotalAmt): ' . htmlspecialchars($apiResponse['AllowanceTotalAmt'] ?? 'N/A') . '<\/li>';\n                        echo '<li>折讓後剩餘收據金額 (RemainAmt): ' . htmlspecialchars($apiResponse['RemainAmt'] ?? 'N/A') . '<\/li>';\n                        echo '<li>經手人 (SellerName): ' . htmlspecialchars($apiResponse['SellerName'] ?? 'N/A') . '<\/li>';\n                        echo '<\/ul>';\n\n                        if (isset($apiResponse['ItemDetail']) && !empty($apiResponse['ItemDetail'])) {\n                            echo '<h4>折讓商品 (ItemDetail):<\/h4>';\n                            $itemDetails = json_decode($apiResponse['ItemDetail'], true);\n                            if (json_last_error() === JSON_ERROR_NONE) {\n                                echo '<pre>' . htmlspecialchars(json_encode($itemDetails, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE)) . '<\/pre>';\n                            } else {\n                                echo '<p class=\"warning\">無法解析 ItemDetail JSON: ' . htmlspecialchars($apiResponse['ItemDetail']) . '<\/p>';\n                            }\n                        }\n                    } else {\n                        echo '<p class=\"error\">API 查詢失敗。錯誤代碼: ' . htmlspecialchars($status) . ' (' . htmlspecialchars($message) . ')<\/p>';\n                    }\n                } catch (Exception $e) {\n                    echo '<h2 class=\"error\">API 呼叫失敗<\/h2>';\n                    echo '<pre>' . htm         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

        function initScrollSpy() {

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

                shaBlock.classList.remove('hidden');

                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }

                            let sortedCols = columns.slice().sort();

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
