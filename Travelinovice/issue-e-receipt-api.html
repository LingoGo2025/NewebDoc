<span style=\"color: rgb(0, 0, 0);\">4. 電子收據平台回應格式化的字串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"收據計算方式檢核","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.電子收據平台系統僅檢核「商品小計=商品數量 X 商品單價」及「收據金額= 銷售額」。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.收據計算方式，請串接人員務必與公司財會人員進行確認，收據資料關係到公司稅務，請謹慎處理。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"開立收據流程-預約開立","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.當收據開立方式為預約自動開立收據時，收據資料僅暫存於平台，系統於設預計開 立日期自動執行開立收據。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.於預計開立日期前欲提前開立，則可執行「觸發開立收據」，觸發後會立即開出收據。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3.預約開立收據於預約到期日當天 0 時 0 分後，不可取消或執行觸發。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.開立收據後，屆當期上傳排程日(每單月一日)，平台將會把開立資料上傳至「財政 部電子發票整合服務平台」。<\/span><\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]},{"id":"section-5","icon":"fas fa-info-circle","markerColor":"bg-blue-600","title":"上傳開立收據至財政部","desc":"<p><span style=\"color: rgb(0, 0, 0);\">開立收據後，屆當期上傳排程日(每單月一日)，平台將會把開立資料上傳至 「財政部電子發票整合服務平台」<\/span><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立收據流程_立即開立"},{"id":"flowchart-1","title":"開立收據流程_預約開立"}]},"apis":[{"name":"開立電子收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.1","must_return":false,"note":"固定帶 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"自訂編號","example":"O_201406010001","must_return":false,"note":"1.旅行社自訂訂單編號，限英、數字、”_ ”格式。\n2.可用於與營業人內部系統對應使用，可填入訂單流水號、帳務編號等等，","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"開立收據方式","example":"1","must_return":false,"note":"1=即時開立收據\n2=預約自動開立收據(須指定預計開立日期)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"預計開立日期","example":"2030-10-05","must_return":false,"note":"1.當開立收據方式為預約自動開立收據時(Status=2)，此參數為必填。\n2.格式為 YYYY-MM-DD。","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"預計開立日期延長日","example":"2","must_return":false,"note":"1.當預計開立日期有值時，此參數才有作用。\n2.純數字。\n3.數字表延後開立日期的日數。如 2 代表延後開立日期兩天。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"收據種類","example":"B2B","must_return":false,"note":"B2B=買受人為營利事業單位(有統編)。\nB2C=買受人為個人。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"買受人名稱","example":"藍新科技","must_return":false,"note":"買受人名稱，個人姓名或營利事業單位名稱。當收據種類為 B2B，則此欄位為必填。\nCategory=B2B 時必填","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"買受人統一編號","example":"54352706","must_return":false,"note":"1.買受人(營利事業單位)統編，純數字。\n2.買受人為個人時，則不須填寫。\n3.當收據種類為 B2B，則此欄位為必填。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"買受人地址","example":"台北市南港區南港路二段97號","must_return":false,"note":"買受人的聯絡地址。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"買受人電子信箱","example":"abc@gmail.com","must_return":false,"note":"1.買受人的電子信箱。當收據開立時，寄送收據相關查詢資訊。\n2.若需帶入多個信箱，請以逗號分隔","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"買受人手機","example":"0922123456","must_return":false,"note":"買受人的手機號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務203","must_return":false,"note":"開立收據人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"收據金額","example":"1200","must_return":false,"note":"1.純數字，為收據總金額。\n2.銷售額計算方式，請務必與公司財會人員進行確認。\n3.收據總金額需為商品小計的總和。","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"收據通知信語系","example":"0","must_return":false,"note":"如有買受人電子信箱，將寄送收據開立通知信。若未帶此參數，系統預設參數值為 0(使用中文通知信)。\n0=中文通知信\n1=英文通知信","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"1.多項商品時，商品名稱以 | 分隔。\n2.全部商品名稱總字數最多 280 個字。\n3.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n4.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"商品數量","example":"1|10","must_return":false,"note":"1.多項商品時，商品數量以 |分隔。商品數量需為數字。例：ItemCount =”1|2”\n2.每個商品數量最多為 5 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"商品單位","example":"個|本","must_return":false,"note":"1.內容如：個、件、本、張…..。\n2.多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3.每個商品單位最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"商品單價","example":"200|100","must_return":false,"note":"1.多項商品時，商品單價以 | 分隔。純數字。例：ItemPrice =”200|100”\n2.每個商品單價不能超過 8 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"商品小計","example":"200|1000","must_return":false,"note":"1.每個小記為純數字。\n2.計算方式為：數量 * 單價 = 小計。平台將會檢查計算結果。\n3.多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4.每個商品小計金額計算後不能超過 8位數。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"團名","example":"北海道五日|北海道五日","must_return":false,"note":"1.該張收據的團名\n2.全型/半型中文、英數、符號與空格，都算一個字\n3.不接受斷行，與下列特殊符號 : 雙引號 \" | 單引號 ' | 連結符號 & | 與< >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"團號","example":"X0323|X0323","must_return":false,"note":"1.該張收據的團號\n2.全型/半型中文、英數、符號與空格，都算一個字\n3.不接受斷行，與下列特殊符號 : 雙引號 \" | 單引號 ' | 連結符號 & | 與< >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"預計出團日","example":"2014-10-05","must_return":false,"note":"1.格式為 YYYY-MM-DD。例：2014-10-05\n2.預計出團日不得晚於該收據實際開立日期的兩年後。\n3.出團日當天會寄發出團申報提醒通知至指定信箱(請至 會員專區>電子收據>電子收據通知設定功能，填寫欲收信信箱)","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申報註記","example":"0","must_return":false,"note":"0=未申報\n1=已申報\n留空或無傳送此參數表示未申報。","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"備註","example":"此張收據為北海道專案團","must_return":false,"note":"1.收據備註。\n2.字串支援換行符號（16 進制：0x0A 或0x0D 0x0A）。字串中插入換行符號於列印收據時將會自動換行。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.開立收據成功，則回傳 SUCCESS\n2.開立收據失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"O_201406010001","must_return":false,"note":"旅行社於開立收據時提供的自訂編號","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"收據金額","example":"20532","must_return":false,"note":"此次開立收據的金額","enum_values":"","  or the encrypted string format","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production Environment)","req_url_test":"URL (Test Environment)","th_param":"Parameter Name","th_name":"Chinese Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rules","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the merchant to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters according to the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hex<\/span><br>Key / IV: Please use the merchant's own Hash Key and Hash IV.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase) to obtain the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum via SHA256 hashing, which can be used to verify the integrity of request parameters or return values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by English name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Concatenate HashIV and HashKey to the beginning and end of the sorted string respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search codes...","th_err_code":"Error Code","th_err_reason":"Error Reason / Note","example_title":"Sample Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code sample available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modification Date","th_ver_desc":"Change Description","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definitions","doc_desc_title":"Documentation","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transmission Location","lbl_belong_to":"Belong To","msg_req_info":"This request must be initiated by the merchant. Please package the parameters and transmit them using the <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> method at <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>.","msg_req_format_qs":"The fields in this section must be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this section must be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_req_format_other":"The fields in this section are combined using the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_req_security":"Data Security: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant in an asynchronous manner.","msg_res_info_sync":"This result will be synchronously returned by the system via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields are combined using the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data after receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After pressing the hash button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_2.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_3.png"},"meta":{"title":"Electronic Receipt Issuance API","subtitle":"Issue immediate or scheduled receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide a mechanism for members of travel associations to issue electronic receipts via program integration and upload them to the \"Ministry of Finance E-Invoice Platform\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide media reporting mechanisms; travel agencies should handle related matters independently. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Please contact the customer service center to apply for IP settings before integration. You can set up to 10 IP addresses.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field is calculated by characters. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\"; this character (U+0026) must not appear within any field.<\/span><\/p>"},{"id":"section-2","title":"Receipt Calculation Verification","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The electronic receipt platform system only verifies \"Item Subtotal = Item Quantity X Item Unit Price\" and \"Receipt Amount = Total Sales\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. For receipt calculation methods, please ensure to confirm with your company's accounting department. Receipt data relates to company taxation, so please handle it with caution.<\/span><\/p>"},{"id":"section-3","title":"Receipt Issuance Process - Scheduled Issuance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. When the issuance method is scheduled automatic issuance, the receipt data is only temporarily stored on the platform, and the system automatically executes issuance on the scheduled date. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. If you wish to issue earlier than the scheduled date, you can execute \"Trigger Receipt Issuance\", which will issue the receipt immediately.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Once the scheduled issuance date reaches 0:00 AM on the due date, it cannot be canceled or manually triggered.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. After issuance, the platform will upload the data to the \"Ministry of Finance E-Invoice Platform\" on the scheduled upload date (the first day of each odd month).<\/span><\/p>"},{"id":"section-4","title":"Pre-integration Requirements","desc":"<p>(Please complete these, otherwise the program will definitely fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application method: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Must provide: Server's public IP (not intranet IP, check at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely different; data is not shared. Before going live, ensure that the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Steps\" Errors<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still default values<\/p><p>- `KEY10009 Cannot retrieve travel agency UBN data` → MerchantID incorrect or not enabled<\/p><p><br><\/p>"},{"id":"section-5","title":"Upload Receipts to the Ministry of Finance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After issuance, the platform will upload the data to the \"Ministry of Finance E-Invoice Platform\" on the scheduled upload date (the first day of each odd month).<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Issuance Process_Immediate"},{"id":"flowchart-1","title":"Receipt Issuance Process_Scheduled"}]},"apis":[{"name":"Electronic Receipt Issuance API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":false,"note":"Travel agency Uniform Business Number (UBN).","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Perform AES256 encryption after combining string fields; field descriptions are in the table below","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.1","must_return":false,"note":"Fixed value: 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"TimeStamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds) since 1970-01-01 00:00:00 UTC\nExample: 2014-05-15 15:00:00 timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Order Number","example":"O_201406010001","must_return":false,"note":"1. Merchant's custom order number, limited to English, numbers, and \"_\" format.\n2. Used for reconciliation with internal systems, can be an order serial number, accounting number, etc.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Issuance Method","example":"1","must_return":false,"note":"1=Immediate issuance\n2=Scheduled issuance (requires specified date)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"Scheduled Date","example":"2030-10-05","must_return":false,"note":"1. Required when issuance method is scheduled (Status=2).\n2. Format: YYYY-MM-DD.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"Extension Days","example":"2","must_return":false,"note":"1. Effective only when there is a value for Scheduled Date.\n2. Pure number.\n3. Represents the number of days to postpone. E.g., 2 means postpone by 2 days.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"B2B=Buyer is a business entity (has UBN).\nB2C=Buyer is an individual.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"Buyer Name","example":"AllPay","must_return":false,"note":"Buyer name, individual name or business entity name. Required when receipt category is B2B.\nRequired when Category=B2B","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. Buyer (business entity) UBN, numbers only.\n2. Not required for individuals.\n3. Required when receipt category is B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"Buyer contact address.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"1. Buyer email for sending receipt information.\n2. Separate multiple emails with commas.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"Buyer mobile phone number.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Operator Name","example":"Sales203","must_return":false,"note":"Name of the person issuing the receipt. For records only, not system-validated. If left blank, issuance fails.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Receipt Amount","example":"1200","must_return":false,"note":"1. Pure number, total amount.\n2. Confirm sales calculation with accounting.\n3. Must match the sum of item subtotals.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"Notification Language","example":"0","must_return":false,"note":"If an email is provided, a notification will be sent. Default is 0 (Chinese).\n0=Chinese\n1=English","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Abstract (Item Name)","example":"Item1|Item2","must_return":false,"note":"1. Separate multiple items with |.\n2. Max 280 characters for all items.\n3. Max 160 characters for a single item (Chinese/English/numbers count as 1).\n4. Max 7 items, capacity decreases as names get longer.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Item Quantity","example":"1|10","must_return":false,"note":"1. Separate multiple quantities with |. E.g., ItemCount =”1|2”\n2. Max 5 digits per quantity.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Item Unit","example":"Pc|Book","must_return":false,"note":"1. Examples: Pc, Unit, Book, etc.\n2. Separate multiple units with |. E.g., ItemUnit =”Pc|Book”\n3. Max 2 characters per unit.","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Item Unit Price","example":"200|100","must_return":false,"note":"1. Separate multiple prices with |. E.g., ItemPrice =”200|100”\n2. Max 8 digits per price.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Item Subtotal","example":"200|1000","must_return":false,"note":"1. Pure number.\n2. Formula: Quantity * Unit Price = Subtotal. System validates this.\n3. Separate multiple subtotals with |. E.g., ItemAmt =”200|200”\n4. Max 8 digits per subtotal.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5D|Hokkaido 5D","must_return":false,"note":"1. Tour name for the receipt.\n2. Full-width/half-width Chinese, numbers, symbols, and spaces each count as 1 character.\n3. No line breaks allowed. Forbidden symbols: \" | ' | & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour No","example":"X0323|X0323","must_return":false,"note":"1. Tour number for the receipt.\n2. Same character counting rules as TourName.\n3. No line breaks, forbidden symbols: \" | ' | & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Tour Date","example":"2014-10-05","must_return":false,"note":"1. Format: YYYY-MM-DD. E.g.: 2014-10-05\n2. Must not be later than 2 years from actual issuance date.\n3. A declaration reminder will be sent to the specified email on this date.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Declaration Flag","example":"0","must_return":false,"note":"0=Not declared\n1=Declared\nBlank/null means not declared.","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Note","example":"This receipt is for the Hokkaido project","must_return":false,"note":"1. Receipt note.\n2. Supports line breaks (Hex: 0x0A or 0x0D 0x0A).","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Response Status","example":"SUCCESS","must_return":true,"note":"1. SUCCESS on success\n2. Error code on failure","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Response Message","example":"Success","must_return":true,"note":"Text description of the status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Agency Code","example":"54352706","must_return":false,"note":"Travel agency UBN","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order No","example":"O_201406010001","must_return":false,"note":"Order number provided by the merchant","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"20532","must_return":false,"note":"Total amount of the issued receipt","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"1. Receipt number for this issuance\n2. Empty for scheduled issuance","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Issuance Serial No","example":"193060","must_return":false,"note":"1. Unique serial number.\n2. Required for triggering or canceling scheduled issuance.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Anti-counterfeit Code","example":"85767715","must_return":false,"note":"1. 8-digit random code.\n2. Empty for scheduled issuance","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Issuance Time","example":"2014-09-25 12:12:12","must_return":false,"note":"Time of issuance, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"Remaining Count","example":"2003","must_return":false,"note":"Remaining available invoice serials.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used for validation. Please check against the platform response method: \"SHA256 Encryption Description\". Returns blank on failure.\n\nCheckCode = Hash result calculated using SHA256 spec on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"Display URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. Complete URL (including https://)\n2. Direct link to receipt without manual input of date, random code, etc.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users using string parsing should check for EndStr=## to ensure integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not enabled electronic receipts"},{"code":"KEY10007","reason":"Page idle for over 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency UBN data"},{"code":"KEY10010","reason":"Travel agency UBN is empty"},{"code":"KEY10011","reason":"PostData_ field is empty"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is empty"},{"code":"KEY10014","reason":"TimeOut. Usually I/O time out"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"No mail printing service applied"},{"code":"KEY10017","reason":"Insufficient mail printing service quota"},{"code":"KEY10018","reason":"Operator field not filled"},{"code":"KEY10019","reason":"Travel agency account suspended"},{"code":"NOR10001","reason":"Network connection abnormal"},{"code":"INV10003","reason":"Product information format error or missing data"},{"code":"INV10004","reason":"Item subtotal calculation error"},{"code":"INV10012","reason":"Receipt amount validation error"},{"code":"INV10013","reason":"Incomplete receipt fields or format error"},{"code":"INV10014","reason":"Custom order number format error"},{"code":"INV10016","reason":"Duplicate custom order number"},{"code":"INV20001","reason":"No available invoice serials"},{"code":"INV20002","reason":"Failed to retrieve invoice serials"},{"code":"INV20003","reason":"Invoice serials exhausted"},{"code":"INV20004","reason":"Receipt issuance failed"},{"code":"INV20005","reason":"Failed to write to receipt item table"},{"code":"INV20006","reason":"No receipt data found"},{"code":"INV20007","reason":"Scheduled issuance date passed; cannot cancel reservation"},{"code":"INV20008","reason":"Failed to cancel scheduled issuance"},{"code":"INV20010","reason":"Scheduled date is empty"},{"code":"INV20011","reason":"Scheduled date format incorrect"},{"code":"INV20012","reason":"Scheduled date cannot be earlier than today"},{"code":"INV20013","reason":"Extension day format incorrect"},{"code":"INV20014","reason":"UBN input error"},{"code":"INV20015","reason":"Buyer UBN not filled"},{"code":"INV20016","reason":"Buyer name not filled"},{"code":"INV20018","reason":"Estimated tour date format incorrect"},{"code":"INV20100","reason":"Data write anomaly"},{"code":"INV70001","reason":"Field data format error"}],"versions":[]},

ep2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex（16進数）<\/span><br>Key / IV：ベンダー固有のHash KeyとHash IVを使用してください。","enc_step3_title":"16進数(Hex)への変換","enc_step3_desc":"暗号化されたバイナリデータ (Raw Data) をHex文字列(小文字)に変換したものが、暗号化文字列となります。","enc_sha_title":"SHA256チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256ハッシュを通じてチェックサムを生成し、リクエストパラメータや返却値の完全性を検証するために使用します。","enc_sha_step1_title":"パラメータのソートと結合","enc_sha_step1_desc":"指定されたパラメータを英語名順(A-Z)にソートし、クエリ文字列(key1=val1&key2=val2...)に結合します。","enc_sha_step2_title":"IVとKeyの連結","enc_sha_step2_desc":"ソート後の文字列の前後にそれぞれHashIVとHashKeyを連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256暗号化と大文字変換","enc_sha_step3_desc":"連結された文字列をSHA256で暗号化し、結果を<strong>大文字<\/strong>に変換します。","res_title":"返却パラメータ (Response)","err_title":"エラーコード一覧","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー理由 / 備考","example_title":"サンプルコード","lbl_method":"メソッド","lbl_encrypted_tag":"AES-256-CBC暗号化","lbl_api_index":"API","msg_no_params":"定義されたパラメータなし","msg_code_unavailable":"// サンプルコードはまだありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"更新日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API基本情報","field_def_title":"APIフィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"実行タイプ","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null許容","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"伝送場所","lbl_belong_to":"所属","msg_req_info":"本リクエストはストア側から実行する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span>メソッドを使用し、パラメータをパッキングして<span class=\\\"font-bold text-blue-700\\\">{location}<\/span>に送信してください。","msg_req_format_qs":"このセクションのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号を使用してクエリ文字列(Query String)形式で結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このセクションのフィールドは<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクトに格納して送信する必要があります。","msg_req_format_other":"このセクションのフィールドは<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_req_security":"データセキュリティ：伝送前に<span class=\\\"font-bold\\\">{group_type}<\/span>処理を完了してください。","msg_res_info_webhook":"この結果は、システムから非同期形式でストアが指定した<span class=\\\"font-bold text-green-700\\\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムから<span class=\\\"font-bold text-green-700\\\">{method}<\/span>メソッドを使用して<span class=\\\"font-bold text-green-700\\\">{location}<\/span>に同期返却されます。","msg_res_format_qs":"返却されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号を使用してクエリ文字列(Query String)形式で結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクトに格納されて送信されます。","msg_res_format_other":"返却されるフィールドは<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_res_security":"検証・復号化：受信後、特定のデータに対して<span class=\\\"font-bold\\\">{group_type}<\/span>処理を行ってください。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュ計算ボタンを押すと、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_4.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_5.png"},"meta":{"title":"電子レシート発行API","subtitle":"即時または予約レシートの発行","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 各旅行業協会の会員がプログラム接続を通じて電子レシートを発行し、「財政部電子レシート統合サービスプラットフォーム」へアップロードするメカニズムを提供します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 本プラットフォームはメディア申告に関連するメカニズムや作業を提供していません。旅行会社自身で関連手続きを行ってください。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 接続前にカスタマーサービスセンターへ連絡し、IP設定を申請してください。設定可能なIP数は最大10個です。<\/span><\/p>"},{"id":"section-1","title":"データ交換方法","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式でレシートデータを電子レシートプラットフォームへ送信して発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Typeはapplication/x-www-form-urlencodedです。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式はUTF-8です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームはフォーマットされた文字列を返却します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。全角、半角、数字、記号すべてを1文字としてカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"レシート計算方式の検証","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 電子レシートプラットフォームシステムは、「商品小計=商品数量×商品単価」および「レシート金額=販売額」のみを検証します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. レシートの計算方式については、接続担当者が会社の経理担当者と必ず確認してください。レシートデータは会社の税務に関わるため、慎重に処理してください。<\/span><\/p>"},{"id":"section-3","title":"レシート発行フロー - 予約発行","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. レシート発行方式が自動予約発行の場合、レシートデータはプラットフォームに一時保存され、設定された予定発行日にシステムが自動的にレシートを発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 予定発行日より前に発行したい場合は、「トリガー発行」を実行することで即時に発行されます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 予約発行レシートは、予約期日の当日0時0分以降、キャンセルやトリガー実行はできません。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 発行後、当期のアップロードスケジュール日（隔月の1日）に、プラットフォームが発行データを「財政部電子レシート統合サービスプラットフォーム」へアップロードします。<\/span><\/p>"},{"id":"section-4","title":"接続前の準備作業","desc":"<p>（先に完了させてください。そうでない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIVの取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし記入後、カスタマーサービスセンターへ送信（FAX / Email）<\/p><p>- 最大10個のIPを設定可能<\/p><p>- 必要情報：サーバーの外部IP（イントラネットIP不可、https://ifconfig.me で確認可能）<\/p><p>- 反映時間：通常1-2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番稼働前に必ず接続URLが本番用URLに切り替わっていることを確認してください。<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラーシグナル<\/p><p>- `KEY10001 旅行会社API接続IPではありません` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが不正、またはサンプルの値のまま<\/p><p>- `KEY10009 旅行会社の統一編番号データが取得できません` → MerchantIDの誤りまたは未有効化<\/p><p><br><\/p>"},{"id":"section-5","title":"電子レシートの財政部へのアップロード","desc":"<p><span style=\"color: rgb(0, 0, 0);\">レシート発行後、当期のアップロードスケジュール日（隔月の1日）に、プラットフォームが発行データを「財政部電子レシート統合サービスプラットフォーム」へアップロードします。<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"レシート発行フロー_即時発行"},{"id":"flowchart-1","title":"レシート発行フロー_予約発行"}]},"apis":[{"name":"電子レシート発行API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Postパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合後、AES256で暗号化します。フィールド説明は下表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内包フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.1","must_return":false,"note":"固定で1.1を送信","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTCからの経過秒数\n例：2014-05-15 15:00:00の時刻は1400137200。現在時刻の入力を推奨\n例：2014-05-15 15:00:00の時刻は1400137200。現在時刻の入力を推奨","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"カスタム番号","example":"O_201406010001","must_return":false,"note":"1. 旅行会社独自の注文番号。英数字および\"_\"形式に限定。\n2. 事業者内部システムとの照合に使用可能。注文連番や会計番号などを入力可能。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"レシート発行方式","example":"1","must_return":false,"note":"1 = 即時レシート発行\n2 = 自動予約レシート発行（予定発行日の指定が必要）","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"予定発行日","example":"2030-10-05","must_return":false,"note":"1. 発行方式が自動予約発行の場合(Status=2)、このパラメータは必須。\n2. 形式はYYYY-MM-DD。","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"予定発行日の延長日数","example":"2","must_return":false,"note":"1. 予定発行日に値がある場合のみ有効。\n2. 数値のみ。\n3. 数値は発行を遅らせる日数を表す。例：2は発行日を2日遅らせることを意味する。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"レシート種別","example":"B2B","must_return":false,"note":"B2B = 購入者が営利事業体（統一編番号あり）。\nB2C = 購入者が個人。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"購入者名","example":"藍新科技","must_return":false,"note":"購入者名。個人名または営利事業体名。レシート種別がB2Bの場合、このフィールドは必須。\nCategory=B2Bの場合必須","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"購入者統一編番号","example":"54352706","must_return":false,"note":"1. 購入者（営利事業体）の統一編番号。数値のみ。\n2. 購入者が個人の場合、入力不要。\n3. レシート種別がB2Bの場合、このフィールドは必須。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"購入者住所","example":"台北市南港区南港路二段97号","must_return":false,"note":"購入者の連絡先住所。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"購入者メールアドレス","example":"abc@gmail.com","must_return":false,"note":"1. 購入者のメールアドレス。レシート発行時、レシート関連照会情報を送信。\n2. 複数のメールアドレスを指定する場合、カンマで区切ってください","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"購入者携帯電話","example":"0922123456","must_return":false,"note":"購入者の携帯電話番号。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"担当者名","example":"業務203","must_return":false,"note":"レシート発行担当者名。記録用、システム検証なし。未入力の場合発行失敗となり、システムがエラーコードを返却します。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"レシート金額","example":"1200","must_return":false,"note":"1. 数値のみ。レシート総額。\n2. 販売額の計算方式については、必ず会社の経理担当者と確認してください。\n3. レシート総額は商品小計の合計である必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"レシート通知メール言語","example":"0","must_return":false,"note":"購入者のメールアドレスがある場合、レシート発行通知メールが送信されます。このパラメータがない場合、システムはデフォルト値0(中国語通知メール)を使用します。\n0 = 中国語通知メール\n1 = 英語通知メール","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名）","example":"商品一|商品二","must_return":false,"note":"1. 複数商品の場合は | で区切ってください。\n2. すべての商品名の合計文字数は最大280文字。\n3. 単一品名の最大文字数は160文字。全角・半角・数値記号すべてを1文字としてカウント\n4. 単一レシートで最大7品目まで。品名が40文字を超えるごとに、入力可能な品目数が減ります。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"商品数量","example":"1|10","must_return":false,"note":"1. 複数商品の場合は | で区切ってください。数量は数値である必要があります。例：ItemCount =”1|2”\n2. 各商品数量は最大5桁。","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"商品単位","example":"個|本","must_return":false,"note":"1. 内容例：個、件、本、枚など。\n2. 複数商品の場合は | で区切ってください。例：ItemUnit =”個|本”\n3. 各商品単位は最大2文字。例：ItemUnit =”個|キロ”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"商品単価","example":"200|100","must_return":false,"note":"1. 複数商品の場合は | で区切ってください。数値のみ。例：ItemPrice =”200|100”\n2. 各商品単価は最大8桁。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"商品小計","example":"200|1000","must_return":false,"note":"1. 各小計は数値のみ。\n2. 計算式：数量 * 単価 = 小計。プラットフォームが計算結果を検証します。\n3. 複数商品の場合は | で区切ってください。例：ItemAmt =”200|200”\n4. 各商品小計金額は計算後、最大8桁まで。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"ツアー名","example":"北海道五日|北海道五日","must_return":false,"note":"1. 当該レシートのツアー名\n2. 全角/半角、英数字、記号、スペースはすべて1文字としてカウント\n3. 改行は不可。以下の特殊記号も不可 : ダブルクォーテーション \" | シングルクォーテーション ' | 接続記号 & | および < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"ツアー番号","example":"X0323|X0323","must_return":false,"note":"1. 当該レシートのツアー番号\n2. 全角/半角、英数字、記号、スペースはすべて1文字としてカウント\n3. 改行は不可。以下の特殊記号も不可 : ダブルクォーテーション \" | シングルクォーテーション ' | 接続記号 & | および < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"予定出発日","example":"2014-10-05","must_return":false,"note":"1. 形式はYYYY-MM-DD。例：2014-10-05\n2. 予定出発日は、当該レシートの実際発行日の2年後を超えてはなりません。\n3. 出発日当日に出発申告のリマインダーメールが指定アドレスへ送信されます（会員エリア > 電子レシート > 電子レシート通知設定機能で、受信アドレスを設定してください）","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申告フラグ","example":"0","must_return":false,"note":"0 = 未申告\n1 = 申告済み\n空欄またはこのパラメータを送信しない場合、未申告とみなされます。","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"備考","example":"このレシートは北海道プロジェクトツアーのものです","must_return":false,"note":"1. レシート備考。\n2. 文字列は改行コード（16進数：0x0A または0x0D 0x0A）をサポート。文字列中に改行コードを挿入すると、レシート印刷時に自動改行されます。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム返却メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. レシート発行成功時、SUCCESSを返却\n2. レシート発行失敗時、エラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の返却ステータス説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"54352706","must_return":false,"note":"旅行会社統一編番号","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"O_201406010001","must_return":false,"note":"レシート発行時に旅行会社が提供したカスタム番号","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"レシート金額","example":"20532","must_return":false,"note":"今回のレシート発行金額","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13671008","must_return":false,"note":"1. 今回発行したレシート番号\n2. 予約発行の場合は空値","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"発行連番","example":"193060","must_return":false,"note":"1. 今回のレシート発行連番。\n2. 予約発行のトリガー実行やキャンセル時に必須のパラメータ。","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"レシート偽造防止乱数","example":"85767715","must_return":false,"note":"1. 今回のレシート発行で生成された8桁の偽造防止乱数。\n2. 予約発行の場合は空値","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"レシート発行時間","example":"2014-09-25 12:12:12","must_return":false,"note":"CreateTime レシート発行時間 DateTime 今回のレシート発行時間。例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"残り枚数","example":"2003","must_return":false,"note":"旅行会社の残り使用可能字軌数。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回返却されたデータの正当性を確認するために使用。接続時にこのパラメータ値を比較して、プラットフォームから返却されたものか確認してください。確認方法は「SHA256暗号化説明」を参照してください。発行失敗時は空値が返却されます。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt をSHA256署名仕様に従って計算したハッシュ値","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"データ展示URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. このフィールドは完全なURL（https://を含む）です。\n2. このURLから直接公式サイトに接続してレシート情報を取得可能。発行日や乱数などの情報は入力不要です。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定で##を返却。String方式でデータを受信するユーザーは、EndStr=##であることを確認し、データが完全に伝送されたことを確認する必要があります。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API接続IPではありません"},{"code":"KEY10002","reason":"データ復号化エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行会社が電子レシートを有効化していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超過しました"},{"code":"KEY10009","reason":"旅行会社の統一編番号データが取得できません"},{"code":"KEY10010","reason":"旅行会社統一編番号が空欄です"},{"code":"KEY10011","reason":"PostData_フィールドが空欄です"},{"code":"KEY10012","reason":"データ伝送エラー"},{"code":"KEY10013","reason":"データが空欄です"},{"code":"KEY10014","reason":"TimeOut。通常はI/Oタイムアウトを指します"},{"code":"KEY10015","reason":"レシート金額形式エラー"},{"code":"KEY10016","reason":"旅行会社が郵送印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷付加価値サービスの利用可能回数が不足しています"},{"code":"KEY10018","reason":"担当者フィールドが未入力です"},{"code":"KEY10019","reason":"旅行会社が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV10003","reason":"商品情報形式エラーまたはデータ不足"},{"code":"INV10004","reason":"商品情報の商品小計計算エラー"},{"code":"INV10012","reason":"レシート金額検証エラー"},{"code":"INV10013","reason":"レシートフィールドのデータ不備または形式エラー"},{"code":"INV10014","reason":"カスタム番号形式エラー"},{"code":"INV10016","reason":"カスタム番号が重複しています"},{"code":"INV20001","reason":"利用可能な字軌なし"},{"code":"INV20002","reason":"字軌の取得失敗"},{"code":"INV20003","reason":"字軌の使用完了"},{"code":"INV20004","reason":"レシート発行失敗"},{"code":"INV20005","reason":"レシート商品テーブルへの書き込み失敗"},{"code":"INV20006","reason":"レシートデータなし"},{"code":"INV20007","reason":"システム日が予約発行日を過ぎたため、予約取り消し不可"},{"code":"INV20008","reason":"予約発行の取り消し失敗"},{"code":"INV20010","reason":"予約発行日が空欄です"},{"code":"INV20011","reason":"予約発行日の形式が不正です"},{"code":"INV20012","reason":"予約発行日はシステム日より前に設定できません"},{"code":"INV20013","reason":"予定発行日の延長日形式が不正です"},{"code":"INV20014","reason":"統一編番号の入力エラー"},{"code":"INV20015","reason":"購入者統一編番号が未入力です"},{"code":"INV20016","reason":"購入者名が未入力です"},{"code":"INV20018","reason":"予定出発日の形式が不正です"},{"code":"INV20100","reason":"データ書き込み時に異常発生"},{"code":"INV70001","reason":"フィールドデータ形式エラー"}],"versions":[]},

y2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체에 해당하는 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수 변환 (Hex)","enc_step3_desc":"암호화된 이진 데이터(Raw Data)를 Hex String(소문자)으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 체크섬 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 체크섬을 생성하며, 요청 파라미터나 반환값의 무결성을 검증하는 데 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z)순으로 정렬하고 Query String (key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고, 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 아직 제공된 예제 코드가 없습니다","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전","th_ver_date":"수정일","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"흐름도","lbl_launch_type":"실행 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전달 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점 측에서 실행해야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식을 사용하여 파라미터를 패키징한 후 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>에 전달하십시오.","msg_req_format_qs":"이 영역의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합하여 Query String 형식으로 만들어야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 넣어 전달해야 합니다.","msg_req_format_other":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"이 결과는 시스템이 비동기 방식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 능동적으로 푸시합니다.","msg_res_info_sync":"이 결과는 시스템이 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식을 통해 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에서 동기식으로 반환합니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합하여 Query String 형식으로 전달됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 넣어 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면, 실제 암호화된 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_6.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_7.png"},"meta":{"title":"전자 영수증 발행 API","subtitle":"즉시 또는 예약 영수증 발행","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 각 여행업협회 산하 회원이 API 연동 방식을 통해 전자 영수증을 발행하고 '재정부 전자세금계산서 통합 서비스 플랫폼'에 업로드하는 메커니즘을 제공합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 본 플랫폼은 매체 신고 관련 메커니즘이나 작업을 제공하지 않으므로, 여행사는 관련 사항을 직접 처리해야 합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 총 10개입니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식을 사용하여 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 필드 내용 내에는 해당 기호(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"영수증 계산 방식 검증","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 전자 영수증 플랫폼 시스템은 '상품 소계 = 상품 수량 X 상품 단가' 및 '영수증 금액 = 판매액'만을 검증합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 영수증 계산 방식은 연동 담당자가 반드시 회사 재무 담당자와 확인해야 합니다. 영수증 데이터는 회사 세무와 관련이 있으므로 신중하게 처리하십시오.<\/span><\/p>"},{"id":"section-3","title":"영수증 발행 프로세스 - 예약 발행","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 영수증 발행 방식이 예약 자동 발행일 경우, 영수증 데이터는 플랫폼에 임시 저장되며 시스템이 설정된 발행 예정일에 자동으로 영수증을 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 발행 예정일 전에 미리 발행하고자 하는 경우, '영수증 발행 트리거'를 실행하면 즉시 발행됩니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 예약 발행 영수증은 예약 만료일 당일 0시 0분 이후에는 취소하거나 트리거를 실행할 수 없습니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 영수증 발행 후, 당기 업로드 예정일(매 홀수 월 1일)이 되면 플랫폼이 발행 데이터를 '재정부 전자세금계산서 통합 서비스 플랫폼'으로 업로드합니다.<\/span><\/p>"},{"id":"section-4","title":"연동 사전 작업","desc":"<p>(반드시 먼저 완료하십시오. 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 관리자 페이지 로그인 → 기본 자료 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 구역 관리자 페이지 로그인 → 기본 자료 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청서를 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제출 정보: 서버 대외 IP (내부망 IP 아님, https://ifconfig.me 에서 조회 가능)<\/p><p>- 적용 시간: 보통 영업일 기준 1-2일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이므로 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL이 운영 구역 URL로 변경되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 자주 발생하는 '사전 작업 누락' 오류 메시지<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못 설정<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 부정확하거나 예제 값을 그대로 사용 중<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터 조회 불가` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"},{"id":"section-5","title":"재정부로 영수증 발행 데이터 업로드","desc":"<p><span style=\"color: rgb(0, 0, 0);\">영수증 발행 후, 당기 업로드 예정일(매 홀수 월 1일)이 되면 플랫폼이 발행 데이터를 '재정부 전자세금계산서 통합 서비스 플랫폼'으로 업로드합니다.<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 발행 프로세스_즉시 발행"},{"id":"flowchart-1","title":"영수증 발행 프로세스_예약 발행"}]},"apis":[{"name":"전자 영수증 발행 API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_내부 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.1","must_return":false,"note":"1.1 고정","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초\n예: 2014-05-15 15:00:00 시간의 타임스탬프는 1400137200이며, 현재 시간을 넣는 것을 권장합니다.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"1. 여행사 사용자 정의 주문 번호, 영문, 숫자, '_ ' 형식만 허용.\n2. 영업자 내부 시스템 대응용으로 사용 가능, 주문 일련번호, 회계 번호 등을 입력 가능.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"영수증 발행 방식","example":"1","must_return":false,"note":"1=즉시 발행\n2=예약 자동 발행(발행 예정일 지정 필수)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"발행 예정일","example":"2030-10-05","must_return":false,"note":"1. 영수증 발행 방식이 예약 자동 발행(Status=2)인 경우 필수 입력.\n2. YYYY-MM-DD 형식.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"발행 예정일 연장일","example":"2","must_return":false,"note":"1. 발행 예정일에 값이 있을 때만 유효.\n2. 숫자만 입력.\n3. 숫자는 발행 예정일을 미루는 일수를 의미. 예: 2는 2일 연기.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"영수증 종류","example":"B2B","must_return":false,"note":"B2B=매수인이 영리 사업 단위(사업자번호 있음).\nB2C=매수인이 개인.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"매수인 명칭","example":"뉴텍(NewebTech)","must_return":false,"note":"매수인 명칭, 개인 성명 또는 영리 사업 단위 명칭. 영수증 종류가 B2B인 경우 필수 입력.\nCategory=B2B 시 필수","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"매수인 사업자등록번호","example":"54352706","must_return":false,"note":"1. 매수인(영리 사업 단위) 사업자번호, 숫자만 입력.\n2. 매수인이 개인인 경우 입력 불필요.\n3. 영수증 종류가 B2B인 경우 필수 입력.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"매수인 주소","example":"타이베이시 난강구 난강로 2단 97호","must_return":false,"note":"매수인의 연락 주소.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"매수인 이메일","example":"abc@gmail.com","must_return":false,"note":"1. 매수인의 이메일. 영수증 발행 시 관련 조회 정보가 발송됨.\n2. 여러 개의 이메일 입력 시 쉼표로 구분.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"매수인 휴대폰","example":"0922123456","must_return":false,"note":"매수인의 휴대폰 번호.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"담당자 명칭","example":"업무203","must_return":false,"note":"영수증 발행 담당자 명칭. 기록용이며 시스템 검증 없음. 미입력 시 발행 실패하며 시스템이 오류 코드를 반환함.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"영수증 금액","example":"1200","must_return":false,"note":"1. 숫자만 입력, 영수증 총액.\n2. 판매액 계산 방식은 반드시 회사 재무 담당자와 확인하십시오.\n3. 영수증 총액은 상품 소계의 합계와 일치해야 함.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"영수증 안내 메일 언어","example":"0","must_return":false,"note":"매수인 이메일이 있을 경우 발행 안내 메일이 발송됨. 미지정 시 시스템 기본값 0(한글 안내 메일) 적용.\n0=한글 안내 메일\n1=영문 안내 메일","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"요약 (상품명)","example":"상품1|상품2","must_return":false,"note":"1. 여러 상품일 경우 '|'로 구분.\n2. 모든 상품명 총 글자 수 최대 280자.\n3. 단일 품목명 최대 160자, 한글, 영문, 숫자, 기호 모두 1글자로 계산.\n4. 단일 영수증 최대 7개 품목 허용, 품목명이 40자를 넘을 때마다 허용 품목 개수 감소.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"상품 수량","example":"1|10","must_return":false,"note":"1. 여러 상품일 경우 '|'로 구분. 수량은 숫자여야 함. 예: ItemCount =\"1|2\"\n2. 각 상품 수량 최대 5자리.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"상품 단위","example":"개|본","must_return":false,"note":"1. 내용 예: 개, 건, 본, 장 등.\n2. 여러 상품일 경우 '|'로 구분. 예: ItemUnit =\"개|본\"\n3. 각 상품 단위 최대 2글자. 예: ItemUnit =\"개|kg\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"상품 단가","example":"200|100","must_return":false,"note":"1. 여러 상품일 경우 '|'로 구분. 숫자만 입력. 예: ItemPrice =\"200|100\"\n2. 각 상품 단가 최대 8자리.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"상품 소계","example":"200|1000","must_return":false,"note":"1. 각 소계는 숫자만 입력.\n2. 계산 방식: 수량 * 단가 = 소계. 플랫폼에서 계산 결과 검증함.\n3. 여러 상품일 경우 '|'로 구분. 예: ItemAmt =\"200|200\"\n4. 각 상품 소계는 계산 후 최대 8자리.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"투어 명칭","example":"홋카이도 5일|홋카이도 5일","must_return":false,"note":"1. 해당 영수증의 투어 명칭\n2. 전각/반각 한글, 영문, 숫자, 기호, 공백 모두 1글자로 계산\n3. 줄바꿈 불가, 다음 특수 기호 포함 불가: 큰따옴표 \" | 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"투어 번호","example":"X0323|X0323","must_return":false,"note":"1. 해당 영수증의 투어 번호\n2. 전각/반각 한글, 영문, 숫자, 기호, 공백 모두 1글자로 계산\n3. 줄바꿈 불가, 다음 특수 기호 포함 불가: 큰따옴표 \" | 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"예상 출국일","example":"2014-10-05","must_return":false,"note":"1. 형식 YYYY-MM-DD. 예: 2014-10-05\n2. 예상 출국일은 실제 영수증 발행일로부터 2년 이후일 수 없음.\n3. 출국일 당일에 출국 신고 안내 메일이 지정된 이메일로 발송됨 (회원전용 > 전자 영수증 > 전자 영수증 알림 설정에서 수신 이메일 작성 필요)","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 비고","example":"0","must_return":false,"note":"0=미신고\n1=신고 완료\n비워두거나 파라미터 미전송 시 미신고로 간주.","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"이 영수증은 홋카이도 프로젝트 팀 용도","must_return":false,"note":"1. 영수증 비고.\n2. 줄바꿈 문자 지원 (16진수: 0x0A 또는 0x0D 0x0A). 문자열 내 줄바꿈 삽입 시 영수증 출력 시 자동으로 줄바꿈됨.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 발행 성공 시 SUCCESS 반환\n2. 발행 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자등록번호","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"영수증 발행 시 제공한 사용자 정의 번호","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"영수증 금액","example":"20532","must_return":false,"note":"이번에 발행된 영수증 금액","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"1. 이번에 발행된 영수증 번호\n2. 예약 발행 시 공백","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"발행 일련번호","example":"193060","must_return":false,"note":"1. 이번 영수증 발행의 일련번호.\n2. 트리거 또는 예약 발행 취소 시 필수 파라미터.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"영수증 위변조 방지 랜덤 코드","example":"85767715","must_return":false,"note":"1. 이번 발행 시 생성된 8자리 위변조 방지 랜덤 코드.\n2. 예약 발행 시 공백","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"영수증 발행 시간","example":"2014-09-25 12:12:12","must_return":false,"note":"CreateTime 영수증 발행 시간 DateTime 이번 발행 시점, 예: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"잔여 매수","example":"2003","must_return":false,"note":"여행사가 사용 가능한 자구(字軌) 수량.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크코드","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"데이터 반환의 유효성을 검사하는 코드. 연동 시 이 파라미터 값을 비교하여 플랫폼에서 보낸 데이터인지 검증 가능. 검증 방법은 'SHA256 암호화 설명' 참조. 발행 실패 시 공백 반환.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"데이터 전시 URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. 전체 URL (https:// 포함)\n2. 해당 URL 접속 시 발행 일자, 랜덤 코드 등을 입력할 필요 없이 즉시 영수증 데이터를 조회 가능.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 종료","example":"##","must_return":true,"note":"## 고정 반환. String 방식으로 데이터를 수신하는 사용자는 EndStr=##를 추가로 판단하여 데이터 전달의 완결성을 확보해야 함.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사 전자 영수증 활성화 미신청"},{"code":"KEY10007","reason":"페이지 30분 이상 정지"},{"code":"KEY10009","reason":"여행사 사업자등록번호 데이터 조회 불가"},{"code":"KEY10010","reason":"여행사 사업자등록번호 공백"},{"code":"KEY10011","reason":"PostData_ 필드 공백"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터 공백"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사 우편 인쇄 부가 서비스 미신청"},{"code":"KEY10017","reason":"우편 인쇄 부가 서비스 잔여 수량 부족"},{"code":"KEY10018","reason":"발행인 필드 미입력"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV10003","reason":"상품 정보 형식 오류 또는 데이터 부족"},{"code":"INV10004","reason":"상품 정보 상품 소계 계산 오류"},{"code":"INV10012","reason":"영수증 금액 검증 오류"},{"code":"INV10013","reason":"영수증 필드 데이터 불완전 또는 형식 오류"},{"code":"INV10014","reason":"사용자 정의 번호 형식 오류"},{"code":"INV10016","reason":"사용자 정의 번호 중복"},{"code":"INV20001","reason":"사용 가능한 자구(字軌) 없음"},{"code":"INV20002","reason":"자구(字軌) 획득 실패"},{"code":"INV20003","reason":"자구(字軌) 모두 사용됨"},{"code":"INV20004","reason":"영수증 발행 실패"},{"code":"INV20005","reason":"영수증 상품 테이블 기록 실패"},{"code":"INV20006","reason":"영수증 데이터 없음"},{"code":"INV20007","reason":"시스템 일자가 예약 발행일을 지나 예약 발행 취소 불가"},{"code":"INV20008","reason":"예약 발행 취소 실패"},{"code":"INV20010","reason":"예약 발행일 공백"},{"code":"INV20011","reason":"예약 발행일 형식 오류"},{"code":"INV20012","reason":"예약 발행일은 시스템 일자보다 이전일 수 없음"},{"code":"INV20013","reason":"발행 예정일 연장일 형식 오류"},{"code":"INV20014","reason":"사업자등록번호 입력 오류"},{"code":"INV20015","reason":"매수인 사업자번호 미입력"},{"code":"INV20016","reason":"매수인 명칭 미입력"},{"code":"INV20018","reason":"예상 출국일 형식 오류"},{"code":"INV20100","reason":"데이터 기록 중 이상 발생"},{"code":"INV70001","reason":"필드 데이터 형식 오류"}],"versions":[]},
