pan>-formatet.","msg_req_security":"Datasäkerhet: <span class=\"font-bold\">{group_type}<\/span>-bearbetning krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att pushas asynkront av systemet till den <span class=\"font-bold text-green-700\">Webhook<\/span>-mottagningsadress som angetts av butiken.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet via <span class=\"font-bold text-green-700\">{method}<\/span> till <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras till ett Query String-format med <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span>-symbolen, till exempel <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten kommer att skickas inuti ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt.","msg_res_format_other":"De returnerade fälten använder <span class=\"font-bold text-cyan-700\">{format}<\/span>-formatet.","msg_res_security":"Verifiering och dekryptering: <span class=\"font-bold\">{group_type}<\/span>-bearbetning krävs för specifik data efter mottagning.","lbl_sha_pre_hash":"Kombinerad sträng före kryptering (String to Hash)","ph_sha_pre_hash":"När du tryckt på knappen visas här den fullständiga strängen som faktiskt krypteras...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_8.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_9.png"},"meta":{"title":"API för utfärdande av elektroniska kvitton","subtitle":"Utfärdande av omedelbara eller schemalagda kvitton","version":"","sections":[{"id":"section-0","title":"Syfte med integrering","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Tillhandahåller en mekanism för medlemmar i olika resebyråorganisationer att utfärda elektroniska kvitton via API-integrering och ladda upp dem till \"Ministry of Finance E-Invoice Integration Service Platform\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Denna plattform tillhandahåller inte mekanismer för mediebaserad rapportering; resebyråer ansvarar för att hantera dessa frågor själva. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Innan integrering, vänligen kontakta kundtjänst för att ansöka om IP-inställningar. Högst 10 IP-adresser kan konfigureras.<\/span><\/p>"},{"id":"section-1","title":"Dataväxlingsmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvittoinformation till den elektroniska kvittoplattformen via \"HTTP POST\" för utfärdande. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&\" används som separator mellan fält, och detta tecken får inte finnas inuti fälten (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Verifiering av kvittoberäkning","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Den elektroniska kvittoplattformen kontrollerar endast \"Varusubtotal = Antal varor X Pris per vara\" och \"Kvittobelopp = Försäljningsbelopp\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Integrerande personal bör bekräfta kvittoberäkningsmetoden med företagets ekonomiavdelning, då kvittoinformationen rör företagets skattefrågor. Vänligen hantera med försiktighet.<\/span><\/p>"},{"id":"section-3","title":"Flöde för kvittoutfärdande - schemalagd utfärdande","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. När kvittot utfärdas via schemalagd automatisk utfärdande, lagras kvittoinformationen endast tillfälligt på plattformen, och systemet utfärdar kvittot automatiskt på det förväntade datumet. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Om du vill utfärda kvittot tidigare än det förväntade datumet kan du köra \"Utlös kvittoutfärdande\", vilket utfärdar kvittot omedelbart.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Efter kl. 00:00 på det schemalagda förfallodatumet kan utfärdandet inte längre avbrytas eller utlösas.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Efter utfärdande kommer plattformen att ladda upp data till \"Ministry of Finance E-Invoice Integration Service Platform\" på schemalagd datum (första dagen i varje udda månad).<\/span><\/p>"},{"id":"section-4","title":"Förberedelser inför integrering","desc":"<p>(Vänligen slutför, annars kommer programmet definitivt att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testbackoffice → Grundinformation → API-integreringsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsbackoffice → Grundinformation → API-integreringsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Högst 10 IP-adresser kan konfigureras<\/p><p>- Måste tillhandahålla: Serverns externa IP (ej internt nätverks-IP, kan sökas via https://ifconfig.me)<\/p><p>- Aktiveringstid: Normalt 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt separata enheter, data delas inte. Innan driftsättning, se till att integrerings-URL:en har växlats till produktionsmiljöns URL<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid \"glömd förberedelse\"<\/p><p>- `KEY10001 Inte en IP för resebyrås API-integrering` → IP-vitlistning ej inställd eller felaktigt inställd<\/p><p>- `KEY10002 Fel vid datadekryptering` → HashKey / HashIV är inkorrekt eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns skatte-ID` → MerchantID är fel eller ej aktiverat<\/p><p><br><\/p>"},{"id":"section-5","title":"Ladda upp utfärdade kvitton till finansdepartementet","desc":"<p><span style=\"color: rgb(0, 0, 0);\">Efter att kvittot utfärdats kommer plattformen att ladda upp data till \"Ministry of Finance E-Invoice Integration Service Platform\" på schemalagd datum (första dagen i varje udda månad).<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för kvittoutfärdande_Omedelbar utfärdande"},{"id":"flowchart-1","title":"Flöde för kvittoutfärdande_Schemalagd utfärdande"}]},"apis":[{"name":"API för utfärdande av elektroniska kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns skatte-ID","example":"54352706","must_return":false,"note":"Resebyråns skatte-ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfält kombineras och krypteras med AES256. Se tabellen nedan för fältbeskrivningar","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integreringsversion","example":"1.1","must_return":false,"note":"Fast värde 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder från 1970-01-01 00:00:00 UTC till nu\nExempel: För 2014-05-15 15:00:00 är tidsstämpeln 1400137200. Det rekommenderas att använda aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Anpassat ordernummer","example":"O_201406010001","must_return":false,"note":"1. Resebyråns eget ordernummer, begränsat till engelska bokstäver, siffror och \"_\"-format.\n2. Kan användas för matchning med interna affärssystem, kan fyllas i med ordernummer, bokföringsnummer, etc.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Metod för kvittoutfärdande","example":"1","must_return":false,"note":"1=Omedelbar utfärdande\n2=Schemalagd automatisk utfärdande (förväntat datum för utfärdande måste anges)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"Förväntat datum för utfärdande","example":"2030-10-05","must_return":false,"note":"1. Obligatorisk vid schemalagd utfärdande (Status=2).\n2. Format YYYY-MM-DD.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"Förlängningsdagar för utfärdande","example":"2","must_return":false,"note":"1. Fungerar endast om \"Förväntat datum för utfärdande\" är angivet.\n2. Endast siffror.\n3. Anger antalet dagar för att skjuta upp utfärdandet. T.ex. 2 betyder att utfärdandet skjuts upp två dagar.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"Kvittotyp","example":"B2B","must_return":false,"note":"B2B=Köparen är en juridisk person (har skatte-ID).\nB2C=Köparen är en privatperson.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"Köparens namn","example":"BlueNewTech","must_return":false,"note":"Köparens namn, privatperson eller juridisk person. Obligatorisk när k have the correct byte lengths as specified by the API.\nif (strlen(AES_KEY) !== 32) {\n    die('<div style=\"color: red; font-weight: bold; padding: 20px; border: 1px solid red; background-color: #ffe0e0;\">\n            ERROR: AES_KEY must be 32 bytes long. Current length: ' . strlen(AES_KEY) . '.\n          <\/div>');\n}\nif (strlen(AES_IV) !== 16) {\n    die('<div style=\"color: red; font-weight: bold; padding: 20px; border: 1px solid red; background-color: #ffe0e0;\">\n            ERROR: AES_IV must be 16 bytes long. Current length: ' . strlen(AES_IV) . '.\n          <\/div>');\n}\n\n/**\n * Applies non-standard PKCS7 padding (Block Size 32) to the plaintext.\n *\n * NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n * Each padding byte value equals paddingLen.\n * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n * to prevent the library from applying its own PKCS7 padding.\n *\n * @param string $plaintext The string to be padded.\n * @return string The padded string.\n */\nfunction pkcs7_pad_32_bytes(string $plaintext): string\n{\n    $block_size = 32;\n    $padding_len = $block_size - (strlen($plaintext) % $block_size);\n    // If plaintext length is an exact multiple of block_size, a full block of padding is added.\n    if ($padding_len === 0) {\n        $padding_len = $block_size;\n    }\n    return $plaintext . str_repeat(chr($padding_len), $padding_len);\n}\n\n/**\n * Encrypts a plaintext string using AES-256-CBC with manual PKCS7 padding (Block Size 32).\n *\n * @param string $plaintext The data to encrypt (UTF-8 encoded).\n * @param string $key The secret key (32 bytes).\n * @param string $iv The initialization vector (16 bytes).\n * @return string The ciphertext in uppercase hexadecimal format.\n * @throws Exception If encryption fails.\n */\nfunction aes_encrypt_pkcs7_32_hex(string $plaintext, string $key, string $iv): string\n{\n    $padded_plaintext = pkcs7_pad_32_bytes($plaintext);\n\n    // OPENSSL_RAW_DATA ensures output is raw bytes.\n    // OPENSSL_ZERO_PADDING is used because padding is handled manually by pkcs7_pad_32_bytes.\n    $ciphertext = openssl_encrypt(\n        $padded_plaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n        $iv\n    );\n\n    if ($ciphertext === false) {\n        throw new Exception('AES encryption failed: ' . openssl_error_string());\n    }\n\n    return strtoupper(bin2hex($ciphertext));\n}\n\n/**\n * Generates a SHA256 signature for response verification.\n *\n * @param array $response_fields An associative array of fields from the API response.\n * @param string $hash_key The HashKey value (e.g., AES_KEY).\n * @param string $hash_iv The HashIV value (e.g., AES_IV).\n * @return string The SHA256 signature in uppercase hexadecimal format.\n */\nfunction generateSha256SignatureForVerification(array $response_fields, string $hash_key, string $hash_iv): string\n{\n    // Fields participating in the signature, sorted alphabetically.\n    $signature_fields = [\n        'InvoiceTransNo',\n        'MerchantID',\n        'MerchantOrderNo',\n        'RandomNum',\n        'TotalAmt',\n    ];\n\n    // Start with HashIV.\n    $string_to_hash = 'HashIV=' . $hash_iv;\n\n    // Append sorted fields and their values using null coalescing for safety.\n    foreach ($signature_fields as $field_name) {\n        $string_to_hash .= '&' . $field_name . '=' . ($response_fields[$field_name] ?? '');\n    }\n\n    // End with HashKey.\n    $string_to_hash .= '&HashKey=' . $hash_key;\n\n    return strtoupper(hash('sha256', $string_to_hash));\n}\n\n\n// Handle POST request from the form\n$api_response_data = null;\n$error_message = null;\n\nif ($_SERVER['REQUEST_METHOD']      'TourDate'         => $_POST['TourDate'] ?? '', // Optional\n            'TaxNoted'         => $_POST['TaxNoted'] ?? '0', // Optional, default 0\n            'Comment'          => $_POST['Comment'] ?? '', // Optional\n        ];\n\n        // Basic validation for explicitly required fields from the specification.\n        $required_fields_check = [\n            'MerchantOrderNo', 'Status', 'Category', 'BuyerEmail', 'SellerName',\n            'TotalAmt', 'ItemName', 'ItemCount', 'ItemUnit', 'ItemPrice', 'ItemAmt'\n        ];\n        foreach ($required_fields_check as $field) {\n            if (empty($post_data_fields[$field])) {\n                throw new Exception(\"Missing required field for PostData_: \" . $field);\n            }\n        }\n\n        // Conditional required fields validation.\n        if (isset($post_data_fields['Status']) && (string)$post_data_fields['Status'] === '2' && empty($post_data_fields['CreateStatusTime'])) {\n            throw new Exception(\"CreateStatusTime is required when Status is 2 (預約自動開立收據)\");\n        }\n        if (isset($post_data_fields['Category']) && (string)$post_data_fields['Category'] === 'B2B') {\n            if (empty($post_data_fields['BuyerName'])) {\n                throw new Exception(\"BuyerName is required when Category is B2B\");\n            }\n            if (empty($post_data_fields['BuyerUBN'])) {\n                throw new Exception(\"BuyerUBN is required when Category is B2B\");\n            }\n        }\n        \n        // Ensure integer fields are cast to int.\n        $int_fields = ['Status', 'TotalAmt', 'CreateStatusadd', 'EmailLang', 'TaxNoted'];\n        foreach ($int_fields as $field) {\n            if (isset($post_data_fields[$field]) && is_numeric($post_data_fields[$field])) {\n                $post_data_fields[$field] = (int)$post_data_fields[$field];\n            }\n        }\n        \n        // Assemble PostData_ string in key=value&key=value format.\n        $post_data_query_string_parts = [];\n        foreach ($post_data_fields as $key => $value) {\n            // Values should not be URL encoded for encryption, direct concatenation.\n            $post_data_query_string_parts[] = $key . '=' . $value;\n        }\n        $post_data_raw_string = implode('&', $post_data_query_string_parts);\n\n        // 2. Encrypt PostData_ string.\n        $encrypted_post_data = aes_encrypt_pkcs7_32_hex($post_data_raw_string, AES_KEY, AES_IV);\n\n        // 3. Prepare main POST parameters for the API request.\n        $main_post_params = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_'   => $encrypted_post_data,\n        ];\n\n        // Initialize cURL session.\n        $ch = curl_init();\n        if ($ch === false) {\n            throw new Exception('Failed to initialize cURL session.');\n        }\n\n        $api_endpoint = IS_TEST_ENVIRONMENT ? API_ENDPOINT_TEST : API_ENDPOINT_PRODUCTION;\n\n        // Set cURL options.\n        curl_setopt($ch, CURLOPT_URL, $api_endpoint);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($main_post_params)); // Encoded as application/x-www-form-urlencoded.\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true); // Return the response as a string.\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30); // Set a timeout for the API request.\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n\n        // Execute cURL request.\n        $response = curl_exec($ch);\n        $http_code = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n\n        // Check for cURL errors.\n        if (curl_errno($ch)) {\n            throw new Exception('cURL error: ' . curl_error($ch));\n        }\n\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted.\n\n        // Handle empty response.\n        if ($response === false) {\n             throw new Exception('Empty response received         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

                var currentId = '';

                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }

                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);

                    i++;

                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }

        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateChildTablesHtml(children, ui, isResponse, depth) {
            if (!children || children.length === 0) return '';
            var html = '';
            var lblGroupType = ui.lbl_group_type || "加密方式 (Group Type)";
            var lblLocation = ui.lbl_location || "傳遞位置 (Location)";
            var lblBelongTo = ui.lbl_belong_to || "隸屬";
            var lblFieldComboFormat = ui.lbl_field_combo_format || "欄位組合格式";
            var thExample = ui.th_example || (currentLang === 'zh-TW' ? '範例' : 'Example');
            
            children.forEach(function(childTable) {
                var childBadges = [];
                if (childTable.group_type) childBadges.push('<span class="font-mono font-bold text-purple-700 text-xs bg-purple-100 border border-purple-200 px-2 py-0.5 rounded ml-2" title="' + lblGroupType + '"><i class="fas fa-shield-alt mr-1"></i>' + childTable.group_type + '</span>');
                if (childTable.param_location) childBadges.push('<span class="font-mono font-bold text-orange-700 text-xs bg-orange-100 border border-orange-200 px-2 py-0.5 rounded ml-2" title="' + lblLocation + '"><i class="fas fa-map-marker-alt mr-1"></i>' + childTable.param_location + '</span>');
                if (childTable.from_field) childBadges.push('<span class="font-mono font-bold text-teal-700 text-xs bg-teal-100 border border-teal-200 px-2 py-0.5 rounded ml-2" title="' + lblBelongTo + '"><i class="fas fa-level-down-alt mr-1"></i>' + lblBelongTo + ': ' + childTable.from_field + '</span>');
                if (childTable.field_combination_format) {
                    var resChildFcfIcon = childTable.field_combination_format.toUpperCase() === 'JSON' ? 'fa-brackets-curly' : 'fa-link';
                    childBadges.push('<span class="font-mono font-bold text-cyan-700 text-xs bg-cyan-100 border border-cyan-200 px-2 py-0.5 rounded ml-2" title="' + lblFieldComboFormat + '"><i class="fas ' + resChildFcfIcon + ' mr-1"></i>' + childTable.field_combination_format + '</span>');
                }
                
                var childBadgesHtml = childBadges.join('');
                var childInfoText = '';
                var resChildInfoParts = [];
                if (childTable.field_combination_format) {
                    var resCFcf = childTable.field_combination_format;
                    var resCFcfText = '';
                    if (resCFcf.toUpperCase() === 'STRING') {
                        resCFcfText = getMsg(ui, isResponse ? 'msg_res_format_qs' : 'msg_req_format_qs', '本區塊欄位需以 <span class="font-mono font-bold text-cyan-700">&amp;</span> 符號組合為查詢字串 (Query String) 格式。');
                    } else if (resCFcf.toUpperCase() === 'JSON') {
                        resCFcfText = getMsg(ui, isResponse ? 'msg_res_format_json' : 'msg_req_format_json', '本區塊欄位需放置於 <span class="font-bold text-cyan-700">JSON</span> 物件中傳遞。');
                    } else {
                        resCFcfText = getMsg(ui, isResponse ? 'msg_res_format_other' : 'msg_req_format_other', '本區塊欄位採用 <span class="font-bold text-cyan-700">{format}</span> 格式組合。', {format: resCFcf});
                    }
                    resChildInfoParts.push('<div class="flex items-start gap-3"><i class="fas fa-puzzle-piece text-cyan-500 mt-0.5"></i><div class="text-xs text-slate-600 leading-relaxed">' + lblFieldComboFormat + '：' + resCFcfText + '</div></div>');
                }
                if (childTable.group_type && childTable.group_type !== '無加密') {
                    resChildInfoParts.push('<div class="flex items-start gap-3"><i class="fas fa-shield-alt text-purple-500 mt-0.5"></i><div class="text-xs text-slate-600 leading-relaxed">' + getMsg(ui, isResponse ? 'msg_res_security' : 'msg_req_security', '資料安全：本區塊需完成 <span class="font-bold text-purple-700">{group_type}</span> 處理。', {group_type: childTable.group_type}) + '</div></div>');
                }
                if (resChildInfoParts.length > 0) {
                    childInfoText = '<div class="px-4 py-2 bg-slate-50 border-b border-slate-200 space-y-1.5">' + resChildInfoParts.join('') + '</div>';
                }

                var depthClass = '';
                if (depth === 1) depthClass = 'ml-6 md:ml-12';
                else if (depth === 2) depthClass = 'ml-12 md:ml-24';
                else if (depth === 3) depthClass = 'ml-16 md:ml-32';
                else depthClass = 'ml-20 md:ml-40';

                var marginClass = (childTable.children && childTable.children.length > 0) ? 'mb-2' : 'mb-6';

                html += '<div class="' + depthClass + ' ' + marginClass + ' relative">';
                html += '<div class="absolute -left-4 md:-left-8 top-[-8px] w-4 md:w-8 h-10 border-b-2 border-l-2 border-slate-300 rounded-bl-xl z-0"></div>';
                html += '<div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm relative z-10">';
                html += '<div class="p-3 bg-slate-100 border-b flex items-center flex-wrap gap-2"><span class="text-sm font-bold text-slate-700"><i class="fas fa-stream text-slate-400 mr-2"></i>' + childTable.title + '</span>' + childBadgesHtml + '</div>';
                html += childInfoText;
                html += '<div class="overflow-x-auto"><table class="w-full min-w-[800px] text-sm params-table table-fixed"><thead class="bg-slate-50 border-b"><tr>' +
                            '<th class="px-6 py-4 text-left w-[20%]">' + ui.th_param + '</th><th class="px-6 py-4 text-left w-[15%]">' + ui.th_name + '</th>' +
                            '<th class="px-6 py-4 text-center w-[8%]">' + (isResponse ? (ui.th_must_return || '必回傳') : ui.th_required) + '</th><th class="px-6 py-4 text-left w-[12%]">' + ui.th_type + '</th>' +
                            '<th class="px-6 py-4 text-left w-[15%]">' + thExample + '</th><th class="px-6 py-4 text-left w-[30%]">' + ui.th_note + '</th>' +
                            '</tr></thead><tbody class="divide-y divide-slate-100">' + (isResponse ? generateResponseRows(childTable.params, ui) : generateTableRows(childTable.params, ui)) + '</tbody></table></div></div></div>';
                
                if (childTable.children && childTable.children.length > 0) {
                    html += generateChildTablesHtml(childTable.children, ui, isResponse, depth + 1);
                }
            });
            return html;
        }

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-words">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-words">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function generateResponseRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');
                
                var mustReturnHtml = (item.must_return === 'V' || item.must_return === true || item.must_return === 'true' || item.must_return === '是' || item.must_return === '1') ? '<span class="text-green-600 font-bold text-lg">✓</span>' : '<span class="text-slate-300">-</span>';

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-words">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-slate-700 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + mustReturnHtml + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-words">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function renderErrorTable(dataArray, targetId) {
            document.getElementById(targetId).innerHTML = dataArray.map(function(item) {
                return '<tr class="align-middle"><td class="px-6 py-2 font-bold text-red-600 font-mono text-left">' + item.code + '</td><td class="px-6 py-2 text-sm text-slate-700 text-left">' + item.reason + '</td></tr>';
            }).join('');
        }

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);
            window.history.replaceState({}, document.title, url);

            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
        }

        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden');

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }

                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
