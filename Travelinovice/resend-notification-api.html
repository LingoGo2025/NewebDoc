串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"通知信補發呼叫流程圖"}]},"apis":[{"name":"補發通知信API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"發信類型","example":"1","must_return":false,"note":"依據所需發信的類型，給予對應參數。\n1=開立信\n2=折讓\n3=作廢","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次查詢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"折讓、作廢流水號","example":"8952","must_return":false,"note":"此次補發信的折讓單號或作廢單號。若MailType 為 2 或 3 才需傳入","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"收件人 Email","example":"abc@gmail.com","must_return":false,"note":"此次補發信的 Mail 信箱，可用半型逗號區隔多信箱。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.補發信成功，則回傳 SUCCESS\n2.補發信失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":true,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822B ormat.","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Chinese Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Notes","enc_title":"Encryption Rules","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Uses the provided Hash Key and Hash IV from the vendor to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption/Decryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Use the vendor's assigned Hash Key and Hash IV.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) to a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generates a checksum using SHA256 hashing, which can be used to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by English name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Concatenate the HashIV and HashKey to the front and back of the sorted string respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error Codes","err_search_ph":"Search Code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Notes","example_title":"Sample Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"Parameters not defined","msg_code_unavailable":"// No sample code available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modification Date","th_ver_desc":"Changes","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definition","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transmission Location","lbl_belong_to":"Belongs To","msg_req_info":"This request must be initiated by the merchant. Use the <span class=\"font-bold text-blue-700\">{method}<\/span> method to package parameters and send them in the <span class=\"font-bold text-blue-700\">{location}<\/span>.","msg_req_format_qs":"The fields in this block must be combined with the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this block must be placed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object for transmission.","msg_req_format_other":"The fields in this block are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_req_security":"Data Security: Before transmission, <span class=\"font-bold\">{group_type}<\/span> processing must be completed.","msg_res_info_webhook":"This result will be pushed asynchronously by the system to the merchant's designated <span class=\"font-bold text-green-700\">Webhook<\/span> receiving URL.","msg_res_info_sync":"This result will be returned synchronously by the system using the <span class=\"font-bold text-green-700\">{method}<\/span> method to the <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined with the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: Upon receipt, specific data must undergo <span class=\"font-bold\">{group_type}<\/span> processing.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After clicking the encrypt button, the complete string that was actually encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_1.png"},"meta":{"title":"Resend Notification API","subtitle":"Resend Receipt Issuance, Void Invoice, or Credit Memo","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide members of the Travel Commercial Guild with the ability to resend notifications via API integration.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This API distinguishes between resending receipt issuance, void invoices, or credit memos by MailType and requires specifying the target EAMIL address to achieve the notification resend purpose.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. This platform does not provide related mechanisms or operations for media reporting. Travel agencies should handle such matters themselves.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies will send receipt data to the e-receipt platform for issuance via \"HTTP POST\".<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The e-receipt platform will respond with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field's calculation unit is characters. Chinese, English, numbers, and symbols all count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\". This character (U+0026) must not be present within any field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparation","desc":"<p>(Must be completed first, otherwise the program will fail)<\/p><p><br><\/p><p>1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Channel: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be set.<\/p><p>- Required Information: Server's external IP address (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Activation Time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely separate systems with no data sharing. It is crucial to confirm that the integration URL has been switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common Error Signals for \"Forgetting Pre-integration Tasks\"<\/p><p>- `KEY10001 Not a Travel Agency API Integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data Decryption Error` → Incorrect HashKey / HashIV or still using example values<\/p><p>- `KEY10009 Cannot retrieve travel agency unified number data` → Incorrect or inactive MerchantID<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Notification Resend Call Flowchart"}]},"apis":[{"name":"Resend Notification API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Merchant Unified Number","example":"54352706","must_return":false,"note":"Merchant's unified number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String fields combined and encrypted with AES256. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"1.0","must_return":false,"note":"Fixed value of 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), representing the number of seconds from 1970-01-01 00:00:00 UTC to the current time.\nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Mail Type","example":"1","must_return":false,"note":"Provide the corresponding parameter based on the type of mail to be resent.\n1 = Issuance Receipt\n2 = Credit Memo\n3 = Void Invoice","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this query.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Credit Memo/Void Invoice Serial Number","example":"8952","must_return":false,"note":"The serial number for the credit memo or void invoice for this resend. Required only if MailType is 2 or 3.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Recipient Email","example":"abc@gmail.com","must_return":false,"note":"The email address for this resend. Multiple email addresses can be separated by a half-width comma.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Response Status","example":"SUCCESS","must_return":true,"note":"1. If the resend is successful, return SUCCESS.\n2. If the resend fails, return the error code.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Response Message","example":"Success","must_return":true,"note":"Text describing the status of this response.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Merchant Unified Number","example":"54352706","must_return":true,"note":"Merchant's unified number.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Used to verify the legitimacy of the returned data. You can compare this parameter during integration to check if it was returned by the platform. Refer to \"SHA256 Encryption Explanation\" for verification methods. Not returned if the request fails.\n\nCheckCode = Hashed value calculated according to SHA256 signature specifications using InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. The program needs to save the InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt returned during receipt issuance for later CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Returns '##' fixed. Users receiving data via String must\nadditionally check for EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API Integration IP"},{"code":"KEY10002","reason":"Data Decryption Error"},{"code":"KEY10003","reason":"Version Error"},{"code":"KEY10004","reason":"Incomplete Data"},{"code":"KEY10006","reason":"Travel Agency Not Enabled for E-Receipt"},{"code":"KEY10007","reason":"Page Session Exceeded 30 Minutes"},{"code":"KEY10009","reason":"Cannot Retrieve Travel Agency Unified Number Data"},{"code":"KEY10010","reason":"Empty Merchant Unified Number"},{"code":"KEY10011","reason":"Empty PostData_ Field"},{"code":"KEY10012","reason":"Data Transmission Error"},{"code":"KEY10013","reason":"Empty Data"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeouts."},{"code":"KEY10015","reason":"Invalid Receipt Amount Format"},{"code":"KEY10016","reason":"Travel Agency Not Subscribed to Premium Mailing Service"},{"code":"KEY10017","reason":"Insufficient Premium Mailing Service Credits"},{"code":"KEY10018","reason":"Issuer Field Not Filled"},{"code":"KEY10019","reason":"Travel Agency Account Suspended"},{"code":"NOR10001","reason":"Network Connection Anomaly"},{"code":"INV70001","reason":"Invalid Field Data Format"},{"code":"SM10001","reason":"Invalid Mail Type (Please check MailType field)"},{"code":"SM10002","reason":"Invalid Notification Email (Please check BuyerEmail field)"},{"code":"BS10006","reason":"Receipt Data Not Found"},{"code":"BS10015","reason":"Credit Memo Number Not Filled"},{"code":"BS10016","reason":"Void Invoice Number Not Filled"},{"code":"BS10017","reason":"Credit Memo Data Not Found"},{"code":"BS10018","reason":"Void Invoice Data Not Found"}],"versions":[]},

"AES暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：提供されたHash KeyとHash IVを使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化されたバイナリデータ (Raw Data) をHex String (小文字) に変換します。これが暗号化文字列となります。","enc_sha_title":"SHA256 チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256ハッシュでチェックサムを生成し、リクエストパラメータまたは返却値の完全性を検証するために使用できます。","enc_sha_step1_title":"パラメータの並べ替えと結合","enc_sha_step1_desc":"指定されたパラメータをアルファベット順 (A-Z) に並べ替え、Query String (key1=val1&key2=val2...) として結合します。","enc_sha_step2_title":"IVとKeyの連結","enc_sha_step2_desc":"並べ替えられた文字列の前後に、それぞれHashIVとHashKeyを連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 暗号化と大文字への変換","enc_sha_step3_desc":"連結された文字列に対してSHA256暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"返却パラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータが定義されていません","msg_code_unavailable":"// サンプルコードはまだありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"更新日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API 基本情報","field_def_title":"API フィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"起動形式","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null許容","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"転送位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは店舗側から起動する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span>方式でパラメータをパッケージ化し、<span class=\\\"font-bold text-blue-700\\\">{location}<\/span>に配置して転送してください。","msg_req_format_qs":"このブロックのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号でクエリ文字列 (Query String) 形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクト内に配置して転送する必要があります。","msg_req_format_other":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_req_security":"データセキュリティ：転送前に<span class=\\\"font-bold\\\">{group_type}<\/span>処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、店舗指定の<span class=\\\"font-bold text-green-700\\\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムから<span class=\\\"font-bold text-green-700\\\">{method}<\/span>方式で<span class=\\\"font-bold text-green-700\\\">{location}<\/span>に同期して返却されます。","msg_res_format_qs":"返却されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号でクエリ文字列 (Query String) 形式に結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクト内に配置して転送されます。","msg_res_format_other":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_res_security":"復号検証：受信後、特定データに対して<span class=\\\"font-bold\\\">{group_type}<\/span>処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前の結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_2.png"},"meta":{"title":"再発行通知メールAPI","subtitle":"領収書発行、無効証、または値引証の再発行","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行業商業同業組合傘下の会員が、プログラム連携を通じて通知メールの再発行を行えるようにする。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. このAPIは、メールタイプ(MailType)によって、領収書発行、値引証、または無効証の再発行を区別し、再発行したいEAMILメールを指定して通知メールの再発行目的を達成する。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 本プラットフォームは、メディア申告に関するメカニズムや作業を提供しない。旅行代理店は、関連作業を各自で行うこと。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行代理店は、「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行する。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームは、フォーマット化された文字列を応答する。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字。中国語、英語、数字、記号すべて1文字とみなす。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」で連結する。各フィールド内にこの文字 (U+0026) を含めることはできない。<\/span><\/p>"},{"id":"section-2","title":"連携前の準備作業","desc":"<p>（先に完了してください。完了しないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリアバックエンドにログイン → 基本情報 → API連携設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリアバックエンドにログイン → 基本情報 → API連携設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトで申請フォームをダウンロードし、記入後、カスタマーサービスセンター（FAX / Email）に送信<\/p><p>- 最大10個のIPを設定可能<\/p><p>- 提供必須：サーバーの外部IP（内部IPではない、https://ifconfig.me で確認可能）<\/p><p>- 発効時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>-テスト環境と本番環境は完全に異なる設備であり、データは共有されません。稼働前に、連携URLが本番環境URLに切り替わっていることを必ず確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備作業を忘れた」エラー信号<\/p><p>- `KEY10001 非旅行代理店API連携IP` → IPホワイトリストが未設定または間違っている<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIVが不正またはまだサンプル値である<\/p><p>- `KEY10009 旅行代理店統一番号のデータが取得できない` → MerchantIDが間違っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"通知メール再発行呼び出しフローチャート"}]},"apis":[{"name":"再発行通知メールAPI","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Postパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行代理店統一番号","example":"54352706","must_return":false,"note":"旅行代理店の統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256で暗号化します。フィールド説明は以下の表を参照してください。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"固定で1.0を指定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）、すなわち1970-01-01 00:00:00 UTCからの秒数\n例：2014-05-15 15:00:00 この時間のタイムスタンプは1400137200です。現在の時間を指定することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"発信タイプ","example":"1","must_return":false,"note":"必要な発信タイプに応じて、対応するパラメータを指定します。\n1=発行メール\n2=値引\n3=無効","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回のクエリの領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"値引、無効伝票番号","example":"8952","must_return":false,"note":"今回の再発行メールの値引伝票番号または無効伝票番号。MailTypeが2または3の場合のみ必要です。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"受信者Email","example":"abc@gmail.com","must_return":false,"note":"今回の再発行メールのMailアドレス。半角カンマで区切って複数指定可能です。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1.再発行メールが成功した場合、SUCCESSを返却します。\n2.再発行メールが失敗した場合、エラーコードを返却します。","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の返却ステータスメッセージ","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行代理店統一番号","example":"54352706","must_return":true,"note":"旅行代理店の統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"今回のデータ返却の正当性を検証するために使用します。連携時にこのパラメータデータを比較して、プラットフォームから返却されたものであることを確認できます。検証方法については「SHA256暗号化説明」を参照してください。発行失敗の場合は返却されません。\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmtをSHA256署名仕様に従って計算されたハッシュ値\n\nInvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmtは、このAPIの応答フィールドには含まれていません。領収書発行時に返却されたInvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmtをプログラムで別途保存し、CheckCode検証に使用する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列の末尾","example":"##","must_return":true,"note":"固定で ## を返却します。String方式でデータを受け取るユーザーは、\nEndStr=## であることを確認して、データ伝送の完全性を確保する必要があります。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行代理店API連携IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データが不足しています"},{"code":"KEY10006","reason":"旅行代理店が電子領収書を申請・有効化していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えました"},{"code":"KEY10009","reason":"旅行代理店統一番号のデータが取得できません"},{"code":"KEY10010","reason":"旅行代理店統一番号が空白"},{"code":"KEY10011","reason":"PostData_フィールドが空白"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空白"},{"code":"KEY10014","reason":"TimeOut。一般的にI/Oのタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行代理店が郵送印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷付加価値サービスの利用可能数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが入力されていません"},{"code":"KEY10019","reason":"旅行代理店が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV70001","reason":"フィールドデータ形式エラー"},{"code":"SM10001","reason":"発信種別エラー（MailTypeフィールドを確認してください）"},{"code":"SM10002","reason":"通知メールアドレスエラー（BuyerEmailフィールドを確認してください）"},{"code":"BS10006","reason":"領収書データが見つかりません"},{"code":"BS10015","reason":"値引伝票番号が入力されていません"},{"code":"BS10016","reason":"無効伝票番号が入力されていません"},{"code":"BS10017","reason":"値引伝票データが見つかりません"},{"code":"BS10018","reason":"無効伝票データが見つかりません"}],"versions":[]},

q_format_qs":"이 블록의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합하여 쿼리 문자열(Query String) 형식으로 만들어야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 블록의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 넣어 전달해야 합니다.","msg_req_format_other":"이 블록의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합합니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"이 결과는 시스템에서 비동기 방식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 푸시됩니다.","msg_res_info_sync":"이 결과는 시스템에서 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>으로 동기 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합하여 쿼리 문자열(Query String) 형식으로 전달됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 넣어 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합합니다.","msg_res_security":"해독 검증: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 여기에 실제 암호화된 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_3.png"},"meta":{"title":"재발행 알림 메일 API","subtitle":"영수증 발행, 취소 또는 환불 단어 재발행","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행업계 협회 회원들에게 프로그램 연동 방식을 통해 알림 메일 재발행 기능을 제공합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 이 API는 발신 유형(MailType)으로 영수증 발행, 취소 단어 또는 환불 단어 재발행을 구분하며, 알림 메일 재발행을 위해 대상 이메일 주소를 지정해야 합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 본 플랫폼은 미디어 신고 관련 메커니즘이나 작업을 제공하지 않으므로, 여행사는 관련 작업을 자체적으로 진행해야 합니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 포맷팅된 문자열을 응답합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 하나의 문자로 간주합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드는 '&amp;'로 연결하며, 각 필드 내에는 이 문자를 포함할 수 없습니다(U+0026).<\/span><\/p>"},{"id":"section-2","title":"연동 사전 작업","desc":"<p>(먼저 완료해야 하며, 그렇지 않으면 프로그램이 반드시 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 공식 환경: 공식 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청 양식을 다운로드하여 작성한 후, 고객센터(팩스/이메일)로 전송<\/p><p>- 최대 10개 IP 설정 가능<\/p><p>- 제공 필수: 서버 외부 IP (내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 효력 발생 시간: 일반적으로 1-2 영업일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 공식 환경은 완전히 다른 장비이며, 데이터가 공유되지 않습니다. 상용화 전에 반드시 연동 URL을 공식 구역 URL로 전환했는지 확인해야 합니다.<\/p><p><br><\/p><p>4. 일반적인 '사전 작업 누락' 오류 신호<\/p><p>- `KEY10001 비 여행사 API 연동 IP` → IP 화이트리스트 미설정 또는 잘못 설정<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV 부정확 또는 여전히 예제 값<\/p><p>- `KEY10009 여행사 통합 번호 데이터 조회 불가` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"알림 메일 재발행 호출 순서도"}]},"apis":[{"name":"재발행 알림 메일 API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 통합 번호","example":"54352706","must_return":false,"note":"여행사 통합 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화된 데이터","example":"","must_return":false,"note":"문자열 필드를 조합하여 AES256 암호화, 필드 설명은 아래 표와 같습니다.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프 (초), 1970-01-01 00:00:00 UTC부터의 초 수\n예: 2014-05-15 15:00:00 의 타임스탬프는 1400137200 입니다. 현재 시간을 권장합니다.","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"발신 유형","example":"1","must_return":false,"note":"요청 발신 유형에 따라 해당 파라미터를 부여합니다.\n1=발행 메일\n2=환불\n3=취소","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번 조회할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"환불, 취소 일련 번호","example":"8952","must_return":false,"note":"이번 재발행 메일의 환불 단어 번호 또는 취소 단어 번호. MailType이 2 또는 3인 경우에만 입력해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"수신자 이메일","example":"abc@gmail.com","must_return":false,"note":"이번 재발행 메일의 메일 주소. 반점(,)으로 구분하여 여러 이메일 주소를 입력할 수 있습니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 재발행 메일 성공 시 SUCCESS 반환\n2. 재발행 메일 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 통합 번호","example":"54352706","must_return":true,"note":"여행사 통합 번호.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크 코드","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"이번 데이터 반환의 합법성을 확인하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환된 것인지 검증할 수 있습니다. 검증 방법은 'SHA256 암호화 설명'을 참조하십시오. 발동 실패 시 반환되지 않습니다.\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt를 SHA256 서명 규격에 따라 계산된 해시 값\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt는 이 API 응답 필드에 포함되지 않으므로, 영수증 발행 시 반환된 InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt를 프로그램 자체적으로 보관하여 향후 CheckCode 검증에 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정 반환 값 ##. String 방식으로 데이터를 수신하는 사용자는 EndStr=##인지 추가로 판단하여 데이터 전송이 완전한지 확인해야 합니다.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"비 여행사 API 연동 IP"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불충분"},{"code":"KEY10006","reason":"여행사 전자 영수증 미신청/미활성화"},{"code":"KEY10007","reason":"페이지 접속 시간 초과 (30분)"},{"code":"KEY10009","reason":"여행사 통합 번호 데이터 조회 불가"},{"code":"KEY10010","reason":"여행사 통합 번호 공백"},{"code":"KEY10011","reason":"PostData_ 필드 공백"},{"code": eddelandetyp (MailType) och kräver att den relevanta EAMIL-adressen anges för att slutföra återsändningen av meddelanden. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Denna plattform tillhandahåller inte några mekanismer eller procedurer för medieinlämning. Resebyråer bör hantera dessa uppgifter själva.<\/span><\/p>"},{"id":"section-1","title":"Datasändningsmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvittodata till e-kvittoplattformen för utfärdande via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. E-kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Enheter för varje fält beräknas i tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&amp;\" används som skiljetecken mellan varje fält, och detta tecken (U+0026) får inte förekomma inom ett fält.<\/span><\/p>"},{"id":"section-2","title":"Förberedelsearbete före integration","desc":"<p>(Måste slutföras först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlista<\/p><p>- Ansökningskontakt: Ladda ner ansökningsformuläret från webbplatsen, fyll i det och skicka det till kundtjänst (fax / e-post)<\/p><p>- Maximalt 10 IP-adresser kan ställas in<\/p><p>- Kräver: Serverns externa IP-adress (inte intern IP, kan kontrolleras på https://ifconfig.me)<\/p><p>- Ikraftträdande: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöadresser<\/p><p>- Test- och produktionsmiljöerna är helt olika enheter och data är inte delad. Bekräfta att integrationsadressen har bytts till produktionsmiljöns adress före driftsättning.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden för \"Glömt förberedelsearbetet\"<\/p><p>- `KEY10001 Icke resebyråns API-integrations-IP` → IP-vitlistan är inte inställd eller felaktigt inställd<\/p><p>- `KEY10002 Data dekrypteringsfel` → HashKey / HashIV är felaktig eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kunde inte hämta resebyråns organisationsnummer` → MerchantID felaktig eller inte aktiverad<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för anrop för att skicka om meddelanden"}]},"apis":[{"name":"API för att skicka om meddelanden","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Kombinerad sträng fält krypterad med AES256, fältbeskrivning enligt tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Versionsnummer för integration","example":"1.0","must_return":false,"note":"Fastställs till 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antalet sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: Tiden för 2014-05-15 15:00:00, tidsstämpeln är 1400137200, rekommenderas att använda aktuell tid","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Meddelandetyp","example":"1","must_return":false,"note":"Ange motsvarande parameter baserat på typen av meddelande som ska skickas.\n1=Utfärdandemeddelande\n2=Kreditnota\n3=Makulering","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonummer för denna förfrågan.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Kreditnota/makuleringslöpandenummer","example":"8952","must_return":false,"note":"Löpandenummer för kreditnota eller makulering för denna återsändning. Krävs om MailType är 2 eller 3.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Mottagarens e-postadress","example":"abc@gmail.com","must_return":false,"note":"E-postadress för återsändning av detta meddelande, kan vara separerad med semikolon för flera adresser.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemets svar","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Om återsändningen av meddelandet lyckades, returneras SUCCESS\n2. Om återsändningen av meddelandet misslyckades, returneras felkoden","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Lyckades","must_return":true,"note":"Text, förklaring av returstatus","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":true,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Används för att kontrollera datans legitimitet vid retur, kan jämföras vid integration för att verifiera att den kommer från plattformen. Se \"SHA256-krypteringsbeskrivning\" för verifieringsmetod. Returneras inte om anropet misslyckas.\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt beräknat enligt SHA256-signaturspecifikationen.\n\nInvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt ingår inte i detta API-svarsfält. Programvaran måste själv spara InvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt som returnerades vid utfärdandet av kvittot för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängslut","example":"##","must_return":true,"note":"Returneras alltid som ##, användare som tar emot data som sträng måste\nextra kontrollera EndStr=## för att säkerställa fullständig dataöverföring.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Icke resebyråns API-integrations-IP"},{"code":"KEY10002","reason":"Data dekrypteringsfel"},{"code":"KEY10003","reason":"Felaktig version"},{"code":"KEY10004","reason":"Ofullständig data"},{"code":"KEY10006","reason":"Resebyrån har inte aktiverat e-kvitton"},{"code":"KEY10007","reason":"Sidan har varit öppen i över 30 minuter"},{"code":"KEY10009","reason":"Kunde inte hämta resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer är tomt"},{"code":"KEY10011","reason":"PostData_-fält är tomt"},{"code":"KEY10012","reason":"Dataöverföringsfel"},{"code":"KEY10013","reason":"Data är tom"},{"code":"KEY10014","reason":"Timeout. Vanligtvis hänvisar till I/O timeout"},{"code":"KEY10015","reason":"Felaktigt format för kvittobelopp"},{"code":"KEY10016","reason":"Resebyrån har inte aktiverat postutskriftstjänsten"},{"code":"KEY10017","reason":"Otillräckligt antal användningar av postutskriftstjänsten"},{"code":"KEY10018","reason":"Utfärdare fältet är tomt"},{"code":"KEY10019","reason":"Resebyrån har blivit avstängd"},{"code":"NOR10001","reason":"Nätverksanslutningsfel"},{"code":"INV70001","reason":"Felaktigt format på fältdata"},{"code":"SM10001","reason":"Felaktig meddelandetyp (kontrollera MailType-fältet)"},{"code":"SM10002","reason":"Felaktig e-postadress för meddelande (kontrollera BuyerEmail-fältet)"},{"code":"BS10006","reason":"Inget kvitto hittades"},{"code":"BS10015","reason":"Kreditnotanummer saknas"},{"code":"BS10016","reason":"Makuleringsnummer saknas"},{"code":"BS10017","reason":"Ingen kreditnota hittades"},{"code":"BS10018","reason":"Ingen makuleringsfaktura hittades"}],"versions":[]},

        const globalCodeExamples = {"PHP":"<?php\n\n// IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use.\n// Replace all placeholder constants (e.g. YOUR_MERCHANT_ID_HERE) with real values before running this code — the code will block and display an error if placeholders are detected.\n\n// Placeholder constants for API credentials and pre-saved data.\n// Replace 'YOUR_MERCHANT_ID_HERE' with your actual Merchant ID.\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — The key length is 32 bytes for AES-256. This key is used for AES-256 encryption and for SHA256 signature verification.\n// Replace 'YOUR_HASH_KEY_HERE' with your actual Hash Key.\ndefine('HASH_KEY', 'YOUR_HASH_KEY_HERE');\n\n// 16 bytes — The IV length is 16 bytes because AES block size is fixed at 16 bytes. This IV is used for AES-256 encryption and for SHA256 signature verification.\n// Replace 'YOUR_HASH_IV_HERE' with your actual Hash IV.\ndefine('HASH_IV', 'YOUR_HASH_IV_HERE');\n\n// Pre-saved data from the original invoice creation API call, needed for CheckCode verification in the response.\n// These values are not returned by this API and must be stored from a prior API call (e.g., invoice creation).\n// Replace these with actual values saved from a successful invoice creation.\ndefine('PRE_SAVED_INVOICE_TRANS_NO', 'YOUR_PRE_SAVED_INVOICE_TRANS_NO_HERE');\ndefine('PRE_SAVED_MERCHANT_ORDER_NO', 'YOUR_PRE_SAVED_MERCHANT_ORDER_NO_HERE');\ndefine('PRE_SAVED_RANDOM_NUM', 'YOUR_PRE_SAVED_RANDOM_NUM_HERE');\ndefine('PRE_SAVED_TOTAL_AMT', 'YOUR_PRE_SAVED_TOTAL_AMT_HERE');\n\n/**\n * Checks if any placeholder constants are still in use and displays an error if so.\n * The script will terminate if placeholders are detected, preventing API calls with invalid credentials.\n *\n * @return void\n */\nfunction checkPlaceholderConstants(): void\n{\n    $placeholders = [\n        'MERCHANT_ID' => 'YOUR_MERCHANT_ID_HERE',\n        'HASH_KEY' => 'YOUR_HASH_KEY_HERE',\n        'HASH_IV' => 'YOUR_HASH_IV_HERE',\n        'PRE_SAVED_INVOICE_TRANS_NO' => 'YOUR_PRE_SAVED_INVOICE_TRANS_NO_HERE',\n        'PRE_SAVED_MERCHANT_ORDER_NO' => 'YOUR_PRE_SAVED_MERCHANT_ORDER_NO_HERE',\n        'PRE_SAVED_RANDOM_NUM' => 'YOUR_PRE_SAVED_RANDOM_NUM_HERE',\n        'PRE_SAVED_TOTAL_AMT' => 'YOUR_PRE_SAVED_TOTAL_AMT_HERE',\n    ];\n\n    $errors = [];\n    foreach ($placeholders as $name => $value) {\n        if (defined($name) && constant($name) === $value) {\n            $errors[] = $name;\n        }\n    }\n\n    if (!empty($errors)) {\n        echo '<div style=\"color: red; border: 1px solid red; padding: 10px; margin-bottom: 20px;\">';\n        echo '<strong>CONFIGURATION ERROR:<\/strong> Please replace the following placeholder constants with your actual credentials/values before running the code:<br>';\n        echo '<ul>';\n        foreach ($errors as $error) {\n            echo '<li>' . htmlspecialchars($error) . '<\/li>';\n        }\n        echo '<\/ul>';\n        echo '<\/div>';\n        exit;\n    }\n}\n\ncheckPlaceholderConstants();\n\n/**\n * Encrypts a plaintext string using AES-256-CBC with non-standard PKCS7 padding (32-byte block size).\n * The output is a hexadecimal string.\n *\n * @param string $plaintext The string to encrypt.\n * @param string $key The 32-byte AES key.\n * @param string $iv The 16-byte AES IV.\n * @return string The ciphertext in hexadecimal format.\n * @throws Exception If encryption fails due to invalid keys/IVs or openssl_encrypt issues.\n */\nfunction aesEncrypt(string $plaintext, string $key, string $iv): string\n{\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $block_size = 32;\n    $plaintext_len = strlen($plaintext);\n    // Calculate padding length. If plaintext_len is a multiple of block_size, padding_len will be block_size.\n    $padding_len = $block_size - ($plaintext_len % $block_size);\n    $padded_plaintext = $plaintext . str_repeat(chr($padding_len), $padding_len);\n\n    $ciphertext = openssl_encrypt(\n        $padded_plaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, // OPENSSL_RAW_DATA returns raw binary, OPENSSL_ZERO_PADDING disables built-in padding\n        $iv\n    );\n\n    if ($ciphertext === false) {\n        throw new Exception('AES encryption failed. Check key, IV, or plaintext for valid format/encoding.');\n    }\n\n    return bin2hex($ciphertext);\n}\n\n/**\n * @param array $responseParams The parsed API response parameters.\n * @param string $merchantId The Merchant ID.\n * @param string $invoiceTransNo Pre-saved Invoice Transaction Number.\n * @param string $merchantOrderNo Pre-saved Merchant Order Number.\n * @param string $randomNum Pre-saved Random Number.\n * @param string $totalAmt Pre-saved Total Amount.\n * @param string $hashKey The Hash Key.\n * @param string $hashIv The Hash IV.\n * @return bool True if the CheckCode is valid, false otherwise.\n * @docblock-purpose Verification (Verifies the integrity of the API response CheckCode)\n */\nfunction verifySha256Signature(\n    array $responseParams,\n    string $merchantId,\n    string $invoiceTransNo,\n    string $merchantOrderNo,\n    string $randomNum,\n    string $totalAmt,\n    string $hashKey,\n    string $hashIv\n): bool {\n    // Collect all fields for signing, including the pre-saved ones.\n    $signatureFields = [\n        'InvoiceTransNo' => $invoiceTransNo,\n        'MerchantID' => $merchantId,\n        'MerchantOrderNo' => $merchantOrderNo,\n        'RandomNum' => $randomNum,\n        'TotalAmt' => $totalAmt,\n    ];\n\n    // Sort fields by English name A -> Z\n    ksort($signatureFields);\n\n    // Build the string: HashIV={IV値}&Field1={Val1}&...&HashKey={Key値}\n    // No URL encoding on values for signature string construction as per specification.\n    $signString = 'HashIV=' . $hashIv;\n    foreach ($signatureFields as $key => $value) {\n        $signString .= '&' . $key . '=' . $value;\n    }\n    $signString .= '&HashKey=' . $hashKey;\n\n    $calculatedCheckCode = strtoupper(hash('sha256', $signString));\n\n    // Retrieve the CheckCode from the response using null coalescing for safety.\n    $receivedCheckCode = $responseParams['CheckCode'] ?? '';\n\n    // Use timing-safe comparison to prevent timing attacks.\n    return hash_equals($calculatedCheckCode, $receivedCheckCode);\n}\n\n// API endpoint (using the test environment URL as per specification)\n$apiEndpoint = 'https://capi.travelinvoice.com.tw/notification_resend';\n\n$responseMessage = '';\n$responseStatus = '';\n$responseDetails = [];\n\n// Handle form submission\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        // Retrieve and sanitize input from the form\n        $mailType = (int) ($_POST['mailType'] ?? 0);\n        $invoiceNumber = trim($_POST['invoiceNumber'] ?? '');\n        $systemCorrespondNo = trim($_POST['systemCorrespondNo'] ?? '');\n        $buyerEmail = trim($_POST['buyerEmail'] ?? '');\n\n        // Validate required input fields\n        if (empty($invoiceNumber)) {\n            throw new Exception('Invoice Number is required.');\n        }\n        if (empty($buyerEmail)) {\n            throw new Exception('Recipient Email is required.');\n        }\n        if (!in_array($mailType, [1, 2, 3])) {\n            throw new Exception('Invalid Mail Type selected. Please choose 1, 2, or 3.');\n        }\n\n        // Validate SystemCorrespondNo based on MailType\n        if (($mailType === 2 || $mailType === 3) && empty($systemCorrespondNo)) {\n            throw new Exception('System Correspond No. is required for Mail Type \"Allowance\" (2) or \"Void\" (3).');\n        }\n\n        // Prepare the internal PostData_내含欄位 array\n        $postDataInner = [\n            'Version' => '1.0',\n            'TimeStamp' => strval(time()), // Unix timestamp in seconds\n            'MailType' => strval($mailType),\n            'InvoiceNumber' => $invoiceNumber,\n            'BuyerEmail' => $buyerEmail,\n        ];\n\n        // Conditionally add SystemCorrespondNo if provided\n        if (!empty($systemCorrespondNo)) {\n            $postDataInner['SystemCorrespondNo'] = $systemCorrespondNo;\n        }\n\n        // Manually build the querystring for PostData_inner (plaintext before encryption)\n        // Values are not URL-encoded for this internal string construction as per spec\n        $postDataInnerString = '';\n        $isFirstParam = true;\n        foreach ($postDataInner as $key => $value) {\n            if (!$isFirstParam) {\n                $postDataInnerString .= '&';\n            }\n            $postDataInnerString .= $key . '=' . $value;\n            $isFirstParam = false;\n        }\n\n        // Encrypt the PostData_innerString\n        $encryptedPostData = aesEncrypt($postDataInnerString, HASH_KEY, HASH_IV);\n\n        // Prepare the final POST body parameters\n        $postFields = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData,\n        ];\n\n        // Manually build the final POST body as application/x-www-form-urlencoded\n        // Values for the top-level POST fields *are* URL-encoded for HTTP transmission.\n        $postBody = '';\n        $isFirstParam = true;\n        foreach ($postFields as $key => $value) {\n            if (!$isFirstParam) {\n                $postBody .= '&';\n            }\n            $postBody .= $key . '      // Extract response parameters using null coalescing for safety\n        $responseStatus = $parsedResponse['Status'] ?? 'UNKNOWN';\n        $responseMessage = $parsedResponse['Message'] ?? 'No message provided.';\n        $merchantIDFromResponse = $parsedResponse['MerchantID'] ?? '';\n        $endStr = $parsedResponse['EndStr'] ?? '';\n        $checkCode = $parsedResponse['CheckCode'] ?? '';\n\n        $responseDetails = [\n            'Status' => $responseStatus,\n            'Message' => $responseMessage,\n            'MerchantID' => $merchantIDFromResponse,\n            'CheckCode' => $checkCode,\n            'EndStr' => $endStr,\n        ];\n\n        // Validate EndStr to ensure full data transmission\n        if ($endStr !== '##') {\n            throw new Exception('Response integrity error: EndStr is not \"##\". Received: \"' . htmlspecialchars($endStr) . '\".');\n        }\n\n        // Verify CheckCode if the API call was successful and CheckCode is present\n        if ($responseStatus === 'SUCCESS') {\n            if (!empty($checkCode)) {\n                $isCheckCodeValid = verifySha256Signature(\n                    $parsedResponse,\n                    MERCHANT_ID,\n                    PRE_SAVED_INVOICE_TRANS_NO,\n                    PRE_SAVED_MERCHANT_ORDER_NO,\n                    PRE_SAVED_RANDOM_NUM,\n                    PRE_SAVED_TOTAL_AMT,\n                    HASH_KEY,\n                    HASH_IV\n                );\n\n                if (!$isCheckCodeValid) {\n                    throw new Exception('CheckCode verification failed. The response data may have been tampered with or pre-saved values are incorrect.');\n                }\n                $responseDetails['CheckCodeVerification'] = 'SUCCESS';\n            } else {\n                $responseDetails['CheckCodeVerification'] = 'SKIPPED (No CheckCode provided in a successful response from the server, which is unexpected).';\n            }\n        } else {\n            // CheckCode         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);

            applyTranslations(targetLang);
