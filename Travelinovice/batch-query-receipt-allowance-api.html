ault_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間\n注意：此時間戳記需保留，作為回傳時，組合CheckCodeSearch時所需TimeStamp就是此值","enum_values":"","default_value":"","nullable":false},{"name":"AllowFrom","required":"","type":"int(1)","label":"折讓單來源","example":"0","must_return":false,"note":"0＝API 建立\n1＝官網操作建立","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"折讓單狀態","example":"0","must_return":false,"note":"0＝未確認折讓單\n1＝已確認折讓單\n2=取消之未確認折讓單","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"經辦人名稱","example":"丁小雨","must_return":false,"note":"可過濾特定經辦人開立之折讓單。為精確比對，需輸入完整無誤之經辦人名稱，方可進行比對。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671005","must_return":false,"note":"要查詢的收據號碼","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"查詢起始日期","example":"2016-09-25","must_return":false,"note":"1.格式為 YYYY-MM-DD。查詢區間起始（折讓單建立時間）例：2016-09-25\n2.若已帶入收據號碼參數，查詢起始日期與查詢結束日期建議留空，查詢時將不考慮查詢區間。\n3.若已帶入收據號碼參數，同時也填入查詢起始日期與查詢結束日期，將僅查\n詢所設定時間區間內的資料。.\n4.若有填入查詢起始日期，則查詢結束日期為必填。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"查詢結束日期","example":"2016-09-25","must_return":false,"note":"1.格式為 YYYY-MM-DD。查詢區間結束（收據開立時間）\n例：2016-02-25\n2.查詢日期區間最長為 90 天，系統會抓取當前日曆天進行天數計算。例 : 若查詢起始日期為 09-01，最長可接受之查詢結束日期為 11-29\n3.若已帶入收據號碼參數，查詢起始日期與查詢結束日期建議留空，查詢時將\n不考慮查詢區間。\n4.若已帶入收據號碼參數，同時也填入查詢起始日期與查詢結束日期，將僅查詢\n所設定時間區間內的資料。\n5.若有輸入查詢結束日期，則查詢起始日期為必填。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.查詢成功，則回傳 SUCCESS\n2.查詢失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"查詢折讓資料成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":true,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"回傳的收據資料","example":"","must_return":true,"note":"內容為 JSON 格式字串。查詢失敗此欄位回傳空值","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"檢查碼","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。\n\nCheckCodeSearch = 將MerchantID,StartDate,EndDate,TimeStamp 依 SHA256 簽章規格計算所得之雜湊值\n\n用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCodeSearch = 將MerchantID,StartDate,EndDate,TimeStamp依 SHA256 簽章規格計算所得之雜湊值\n\n特別注意事項：\n1.TimeStamp 為本次查詢送出之時間戳記。\n2.StartDate、EndDate需去除分隔號才能送入加密，格式為YYYYMMDD(去除分隔號)，如：20260503\n\n加密前應該組合成以下這種字串後才壓碼並轉大寫\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice內含欄位","group_type":"無加密","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"AllowanceNo","required":"","type":"string(20)","label":"折讓流水號","example":"1229","must_return":false,"note":"折讓單開立時產生的系統流水號。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671005","must_return":false,"note":"折讓單所屬收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"買受人電子信箱","example":"abc@gmail.com","must_return":false,"note":"於開立折讓單時，該張折讓單的買受人電子信箱。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"折讓金額","example":"500","must_return":false,"note":"純數字，為折讓單金額。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"折讓單建立日期","example":"2014-09-25 12:12:12","must_return":false,"note":"該張折讓單建立時間，例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"折讓狀態","example":"1","must_return":false,"note":"該張折讓單之狀態。\n0=未確認折讓\n1=已確認折讓\n2=取消折讓","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"退票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"車票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手續費\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"該張折讓單開立時的商品資訊(JSON 格式)。\nItemNum = 品項序號\nItemName = 商品名稱\nItemCount = 數量\nItemWord = 單位\nItemPrice = 單價\nItemAmount = 小計\n\n注意事項：\n欄位的值為 JSON 格式字串，請對此欄位值再進行一次 JSON 解析，方可取得商品明細陣列。","enum_values":"","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"KEY10020","reason":"SearchType_欄位空白"},{"code":"KEY10021","reason":"ReturnType_欄位空白"},{"code":"INV20014","reason":"統一編號格式有誤"},{"code":"INV70001","reason":"欄位資料格式錯誤"},{"code":"WEB1002","reason":"日期格式有誤"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"BS10001","reason":"查詢區間錯誤"},{"code":"BS10002","reason":"收據來源錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10003","reason":"收據狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10004","reason":"收據種類錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10005","reason":"取得查詢收據資料失敗（請多嘗試幾次，若一直出現此錯誤請聯繫客服）"},{"code":"BS10006","reason":"查無收據資料"},{"code":"BS10007","reason":"折讓狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10008","reason":"搜尋種類錯誤"},{"code":"BS10009","reason":"折讓單來源錯誤"},{"code":"BS10010","reason":"折讓單狀態錯誤"},{"code":"BS10011","reason":"作廢單來源錯誤"},{"code":"BS10012","reason":"作廢單狀態錯誤"},{"code":"BS10013","reason":"日期區間有誤（最多查詢 90 日資料）"},{"code":"BS10014","reason":"日期區間有誤（起始日期不得大於結束日期）"}],"versions":[]},

y the system asynchronously to the <span class=\"font-bold text-green-700\">Webhook<\/span> URL specified by the merchant.","msg_res_info_sync":"This result will be synchronously returned by the system via the <span class=\"font-bold text-green-700\">{method}<\/span> method at <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"Returned fields will be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be placed in a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_res_format_other":"Returned fields are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: <span class=\"font-bold\">{group_type}<\/span> processing is required for specific data after receipt.","lbl_sha_pre_hash":"String to Hash (Pre-hash)","ph_sha_pre_hash":"After pressing the hash button, the actual string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_batch-query-receipt-allowance-api/fc_1.png"},"meta":{"title":"Batch Inquiry for Invoice Allowance Data API","subtitle":"Batch Inquiry for Allowance Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After an electronic receipt is issued, use the time interval and electronic receipt allowance data parameters to query allowance data and status within the set period.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit receipt data to the electronic receipt platform via \"HTTP POST\" for issuance.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is characters. Chinese, English, numbers, and symbols all count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected by \"&\", and no field may contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Steps","desc":"<p>(Please complete first, otherwise the program will definitely fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Testing environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download the application form from the official website, fill it out, and send it to the Customer Service Center (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server external IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different equipment; data is not shared. Before going live, ensure that the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot to Perform Pre-integration\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still example values<\/p><p>- `KEY10009 Cannot retrieve travel agency tax ID data` → MerchantID incorrect or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Batch Allowance Data Inquiry Flowchart"}]},"apis":[{"name":"Batch Inquiry for Invoice Allowance Data API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel Agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Search Type","example":"2","must_return":false,"note":"Fixed as 2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String fields are combined and then AES256 encrypted. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"2.0","must_return":false,"note":"Fixed as 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds from 1970-01-01 00:00:00 UTC to now.\nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.\nNote: This timestamp must be kept, as it is required when calculating CheckCodeSearch for the return value.","enum_values":"","default_value":"","nullable":false},{"name":"AllowFrom","required":"","type":"int(1)","label":"Allowance Source","example":"0","must_return":false,"note":"0=API Created\n1=Official Website Created","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"Allowance Status","example":"0","must_return":false,"note":"0=Unconfirmed Allowance\n1=Confirmed Allowance\n2=Cancelled Unconfirmed Allowance","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Operator Name","example":"Ding Xiaoyu","must_return":false,"note":"Can filter allowances issued by a specific operator. For precise matching, the exact full operator name must be entered.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671005","must_return":false,"note":"Receipt number to query","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"Query Start Date","example":"2016-09-25","must_return":false,"note":"1. Format YYYY-MM-DD. Start of query interval (allowance creation time), e.g.: 2016-09-25\n2. If the receipt number parameter is included, query start and end dates should be left blank; the query will not consider the interval.\n3. If receipt number is included, and start/end dates are also filled, it will only query data within the set interval.\n4. If query start date is filled, query end date is required.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"Query End Date","example":"2016-09-25","must_return":false,"note":"1. Format YYYY-MM-DD. End of query interval (receipt issuance time), e.g.: 2016-02-25\n2. The maximum query interval is 90 days. The system will calculate days based on the current calendar. E.g.: If start date is 09-01, max end date is 11-29.\n3. If receipt number is included, query start and end dates should be left blank; the query will not consider the interval.\n4. If receipt number is included, and start/end dates are also filled, it will only query data within the set interval.\n5. If query end date is filled, query start date is required.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If query is successful, returns SUCCESS\n2. If query fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Allowance data query successful","must_return":true,"note":"Text explanation of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":true,"note":"Travel Agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"Returned Receipt Data","example":"","must_return":true,"note":"Content is a JSON formatted string. If the query fails, this field returns null.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"Checksum","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"Used to check the legitimacy of this data return. During integration, you can compare this parameter to verify it was returned by the platform. For verification methods, please refer to \"SHA256 Encryption Explanation\".\n\nCheckCodeSearch = Hash value calculated by applying SHA256 signature spec to MerchantID, StartDate, EndDate, TimeStamp.\n\nUsed to verify legitimacy. Refer to \"SHA256 Encryption Explanation\". If issuance fails, returns null.\n\nCheckCodeSearch = Hash value calculated by applying SHA256 signature spec to MerchantID, StartDate, EndDate, TimeStamp.\n\nSpecial Notes:\n1. TimeStamp is the timestamp sent with this query.\n2. StartDate and EndDate must have delimiters removed before encryption, format YYYYMMDD, e.g.: 20260503\n\nBefore hashing and converting to uppercase, the string should be combined as follows:\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice Fields","group_type":"No Encryption","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"1229","must_return":false,"note":"System serial number generated when the allowance is issued.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671005","must_return":false,"note":"Receipt number associated with the allowance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"Buyer email for that allowance when issued.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Allowance Amount","example":"500","must_return":false,"note":"Digits only, allowance amount.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Allowance Creation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"Creation time of the allowance, e.g.: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"Allowance Status","example":"1","must_return":false,"note":"Status of the allowance.\n0=Unconfirmed\n1=Confirmed\n2=Cancelled","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"Product Details","example":"[{\"ItemNum\":1,\"ItemName\":\"Ticket Refund\",\"ItemCount\":\"1\",\"ItemWord\":\"pcs\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"Train Ticket\",\"ItemCount\":\"1\",\"ItemWord\":\"pcs\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"Service Fee\",\"ItemCount\":\"1\",\"ItemWord\":\"item\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"Product information when the allowance was issued (JSON format).\nItemNum = Item Serial Number\nItemName = Product Name\nItemCount = Quantity\nItemWord = Unit\nItemPrice = Unit Price\nItemAmount = Subtotal\n\nNote:\nThe field value is a JSON string. Please parse this field value again as JSON to obtain the product detail array.","enum_values":"","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency not enabled for electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency tax ID data"},{"code":"KEY10010","reason":"Travel agency tax ID empty"},{"code":"KEY10011","reason":"PostData_ field empty"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data empty"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency did not apply for postal printing value-added service"},{"code":"KEY10017","reason":"Postal printing value-added service quota insufficient"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency account suspended"},{"code":"KEY10020","reason":"SearchType_ field empty"},{"code":"KEY10021","reason":"ReturnType_ field empty"},{"code":"INV20014","reason":"Tax ID format incorrect"},{"code":"INV70001","reason":"Field data format error"},{"code":"WEB1002","reason":"Date format incorrect"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"BS10001","reason":"Query interval error"},{"code":"BS10002","reason":"Receipt source error (please check the receipt source parameter used)"},{"code":"BS10003","reason":"Receipt status error (please check the receipt source parameter used)"},{"code":"BS10004","reason":"Receipt type error (please check the receipt source parameter used)"},{"code":"BS10005","reason":"Failed to retrieve receipt data (please try again; if this error persists, please contact customer support)"},{"code":"BS10006","reason":"No receipt data found"},{"code":"BS10007","reason":"Allowance status error (please check the receipt source parameter used)"},{"code":"BS10008","reason":"Search type error"},{"code":"BS10009","reason":"Allowance source error"},{"code":"BS10010","reason":"Allowance status error"},{"code":"BS10011","reason":"Voided bill source error"},{"code":"BS10012","reason":"Voided bill status error"},{"code":"BS10013","reason":"Date interval error (maximum 90 days data query)"},{"code":"BS10014","reason":"Date interval error (start date cannot be later than end date)"}],"versions":[]},

\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して伝送してください。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：伝送前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムから非同期形式で、商店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにプッシュされます。","msg_res_info_sync":"この結果はシステムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期して返されます。","msg_res_format_qs":"返されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して伝送されます。","msg_res_format_other":"返されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前の結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_batch-query-receipt-allowance-api/fc_2.png"},"meta":{"title":"領収書値引きデータ一括照会API","subtitle":"値引きデータ一括照会","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子領収書発行後、期間および電子領収書の詳細データパラメータを使用して、指定期間内の値引きデータ照会および状態確認を行います。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信し発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマット化された文字列を返します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。全角、半角、数字、記号すべてを1文字として扱います。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"接続前の準備","desc":"<p>（必ず完了してください。完了しない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後、カスタマーサービスセンター（FAX / Email）に送信<\/p><p>- 最大10グループのIP設定が可能<\/p><p>- 提供が必要なもの：サーバーの外部IP（内部ネットワークIP不可、https://ifconfig.me で確認可能）<\/p><p>- 有効化までの時間：通常1～2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。リリース前に必ず接続URLを本番環境用URLに切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「準備不足」によるエラー信号<\/p><p>- `KEY10001 旅行会社API接続IPではありません` → IPホワイトリストが未設定、または設定間違い<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が不正確、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社の統一統一番号データが取得できません` → MerchantIDが間違い、または有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"値引きデータ一括照会呼び出しフローチャート"}]},"apis":[{"name":"領収書値引きデータ一括照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Postパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一統一番号","example":"54352706","must_return":false,"note":"旅行会社統一統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索種別","example":"2","must_return":false,"note":"固定で2を入力","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後にAES256で暗号化。詳細は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"2.0","must_return":false,"note":"固定で2.0を入力","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200。現在の時間を入力することを推奨。\n注意：このタイムスタンプは保持する必要があり、戻り時にCheckCodeSearchを組み合わせる際に必要なTimeStampは本値となります。","enum_values":"","default_value":"","nullable":false},{"name":"AllowFrom","required":"","type":"int(1)","label":"値引き伝票ソース","example":"0","must_return":false,"note":"0＝API作成\n1＝公式サイト操作作成","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"値引き伝票ステータス","example":"0","must_return":false,"note":"0＝未確認値引き伝票\n1＝確認済み値引き伝票\n2=キャンセルされた未確認値引き伝票","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"特定の担当者が発行した値引き伝票をフィルタリング可能。正確に一致させるため、正確な担当者名を入力する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671005","must_return":false,"note":"照会したい領収書番号","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"照会開始日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。照会期間開始（値引き伝票作成時間）例：2016-09-25\n2.領収書番号パラメータを入力済の場合、照会開始日と照会終了日は空欄にすることを推奨します。照会時に期間は考慮されません。\n3.領収書番号パラメータを入力し、かつ照会開始日・終了日も入力した場合、設定された期間内のデータのみが照会されます。\n4.照会開始日を入力した場合、照会終了日は必須です。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"照会終了日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。照会期間終了（領収書発行時間）\n例：2016-02-25\n2.照会期間は最大90日です。システムは現在の日付から計算します。例：開始日が09-01の場合、許容される最長の照会終了日は11-29です。\n3.領収書番号パラメータを入力済の場合、照会開始日と照会終了日は空欄にすることを推奨します。照会時に期間は考慮されません。\n4.領収書番号パラメータを入力し、かつ照会開始日・終了日も入力した場合、設定された期間内のデータのみが照会されます。\n5.照会終了日を入力した場合、照会開始日は必須です。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"応答ステータス","example":"SUCCESS","must_return":true,"note":"1.照会成功の場合、SUCCESSを返します\n2.照会失敗の場合、エラーコードを返します","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"応答メッセージ","example":"値引きデータ照会成功","must_return":true,"note":"今回の応答ステータスに関するテキスト説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社統一統一番号","example":"54352706","must_return":true,"note":"旅行会社統一統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"返される領収書データ","example":"","must_return":true,"note":"内容はJSON形式の文字列です。照会失敗時は空値を返します","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"チェックサム","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"データの正当性を確認するために使用します。接続時にこのパラメータを比較し、プラットフォームからのデータであるか検証してください。検証方法は「SHA256暗号化説明」を参照してください。\n\nCheckCodeSearch = MerchantID,StartDate,EndDate,TimeStamp を SHA256 署名仕様に従って計算したハッシュ値\n\n発行失敗時は空値を返します。\n\nCheckCodeSearch = MerchantID,StartDate,EndDate,TimeStamp を SHA256 署名仕様に従って計算したハッシュ値\n\n特別注意事項：\n1.TimeStamp は今回送信したタイムスタンプです。\n2.StartDate、EndDate は区切り文字を除去して暗号化に入力してください。形式は YYYYMMDD です（例：20260503）。\n\n暗号化前に以下の文字列形式に結合してからハッシュ化し、大文字に変換してください\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoiceに含まれるフィールド","group_type":"暗号化なし","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"AllowanceNo","required":"","type":"string(20)","label":"値引きシリアル番号","example":"1229","must_return":false,"note":"値引き伝票発行時に生成されるシステムシリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671005","must_return":false,"note":"値引き伝票が属する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"購入者メールアドレス","example":"abc@gmail.com","must_return":false,"note":"値引き伝票発行時の購入者のメールアドレス。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"値引き金額","example":"500","must_return":false,"note":"純粋な数値。値引き伝票の金額。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"値引き伝票作成日","example":"2014-09-25 12:12:12","must_return":false,"note":"当該値引き伝票の作成時間、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"値引きステータス","example":"1","must_return":false,"note":"当該値引き伝票のステータス。\n0=値引き未確認\n1=値引き確認済み\n2=値引きキャンセル","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"払い戻し\",\"ItemCount\":\"1\",\"ItemWord\":\"枚\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"乗車券\",\"ItemCount\":\"1\",\"ItemWord\":\"枚\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手数料\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"当該値引き伝票発行時の商品情報(JSON形式)。\nItemNum = 商品シリアル番号\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計\n\n注意事項：\nこのフィールドの値はJSON形式の文字列です。この値を再度JSON解析することで商品明細配列を取得できます。","enum_values":"","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API接続IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不完全"},{"code":"KEY10006","reason":"旅行会社は電子領収書を有効化していません"},{"code":"KEY10007","reason":"ページで30分以上放置されました"},{"code":"KEY10009","reason":"旅行会社統一統一番号のデータが取得できません"},{"code":"KEY10010","reason":"旅行会社統一統一番号が空欄です"},{"code":"KEY10011","reason":"PostData_フィールドが空欄です"},{"code":"KEY10012","reason":"データ伝送エラー"},{"code":"KEY10013","reason":"データが空欄です"},{"code":"KEY10014","reason":"タイムアウト。通常はI/Oタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行会社は郵便印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵便印刷付加価値サービスの利用可能数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未記入です"},{"code":"KEY10019","reason":"旅行会社の権限が停止されています"},{"code":"KEY10020","reason":"SearchType_フィールドが空欄です"},{"code":"KEY10021","reason":"ReturnType_フィールドが空欄です"},{"code":"INV20014","reason":"統一統一番号の形式エラー"},{"code":"INV70001","reason":"フィールドデータ形式エラー"},{"code":"WEB1002","reason":"日付形式エラー"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"BS10001","reason":"照会期間エラー"},{"code":"BS10002","reason":"領収書ソースエラー（入力した領収書ソースパラメータを確認してください）"},{"code":"BS10003","reason":"領収書ステータスエラー（入力した領収書ソースパラメータを確認してください）"},{"code":"BS10004","reason":"領収書種別エラー（入力した領収書ソースパラメータを確認してください）"},{"code":"BS10005","reason":"照会領収書データ取得失敗（何度か再試行してください。エラーが続く場合はカスタマーサービスへ連絡してください）"},{"code":"BS10006","reason":"領収書データが見つかりません"},{"code":"BS10007","reason":"値引きステータスエラー（入力した領収書ソースパラメータを確認してください）"},{"code":"BS10008","reason":"検索種別エラー"},{"code":"BS10009","reason":"値引き伝票ソースエ rmat_qs":"이 구역의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 Query String 형식으로 결합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 구역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 배치하여 전달해야 합니다.","msg_req_format_other":"이 구역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 결합됩니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"이 결과는 시스템이 비동기 방식으로 상점에서 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 전송합니다.","msg_res_info_sync":"이 결과는 시스템이 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기 반환합니다.","msg_res_format_qs":"반환된 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 Query String 형식으로 결합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 배치되어 전달됩니다.","msg_res_format_other":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 결합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 결합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 실제 암호화된 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_batch-query-receipt-allowance-api/fc_3.png"},"meta":{"title":"영수증 에누리 내역 일괄 조회 API","subtitle":"에누리 내역 일괄 조회","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">전자영수증 발행 후, 기간 및 전자영수증의 에누리 내역 파라미터를 통해 설정된 기간 내의 에누리 내역 조회 및 상태를 확인합니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자영수증 플랫폼은 포맷된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 중문, 영문, 숫자, 기호 모두 1자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 필드 내에 해당 기호(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"연동 전 필수 작업","desc":"<p>(미완료 시 프로그램 실행이 실패할 수 있음)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 환경 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 환경 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청서를 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필요 정보: 서버 외부 IP (내부망 IP 제외, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1~2 영업일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 설비이며 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL을 운영 환경 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '필수 작업 미수행' 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터를 찾을 수 없음` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"에누리 내역 일괄 조회 호출 흐름도"}]},"apis":[{"name":"영수증 에누리 내역 일괄 조회 API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"검색 종류","example":"2","must_return":false,"note":"2로 고정","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 결합 후 AES256 암호화, 필드 설명은 하단 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"2.0","must_return":false,"note":"2.0으로 고정","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00은 1400137200, 현재 시간 입력 권장\n주의: 이 타임스탬프는 보관해야 하며, 반환 시 CheckCodeSearch 결합에 필요한 TimeStamp 값이 됩니다.","enum_values":"","default_value":"","nullable":false},{"name":"AllowFrom","required":"","type":"int(1)","label":"에누리 내역 출처","example":"0","must_return":false,"note":"0=API 생성\n1=공식 웹사이트 운영 생성","enum_values":"0,1","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"에누리 내역 상태","example":"0","must_return":false,"note":"0=미확인 에누리 내역\n1=확인 완료 에누리 내역\n2=취소된 미확인 에누리 내역","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"담당자 이름","example":"丁小雨","must_return":false,"note":"특정 담당자가 생성한 에누리 내역을 필터링할 수 있습니다. 정확한 비교를 위해 담당자 이름을 완전하게 입력해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671005","must_return":false,"note":"조회할 영수증 번호","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"조회 시작 날짜","example":"2016-09-25","must_return":false,"note":"1. 형식: YYYY-MM-DD. 조회 구간 시작 (에누리 내역 생성 시간), 예: 2016-09-25\n2. 영수증 번호 파라미터를 입력한 경우, 조회 시작 및 종료 날짜는 공란으로 두는 것을 권장하며, 조회 시 구간은 고려하지 않습니다.\n3. 영수증 번호 파라미터와 조회 시작/종료 날짜를 모두 입력한 경우, 설정된 기간 내의 데이터만 조회합니다.\n4. 조회 시작 날짜를 입력한 경우, 조회 종료 날짜는 필수 입력 항목입니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"조회 종료 날짜","example":"2016-09-25","must_return":false,"note":"1. 형식: YYYY-MM-DD. 조회 구간 종료 (영수증 발행 시간), 예: 2016-02-25\n2. 조회 기간은 최대 90일이며, 시스템이 현재 달력을 기준으로 일수를 계산합니다. 예: 시작 날짜가 09-01인 경우, 최대 조회 종료 날짜는 11-29입니다.\n3. 영수증 번호 파라미터를 입력한 경우, 조회 시작 및 종료 날짜는 공란으로 두는 것을 권장하며 조회 시 구간은 고려하지 않습니다.\n4. 영수증 번호 파라미터와 조회 시작/종료 날짜를 모두 입력한 경우, 설정된 기간 내의 데이터만 조회합니다.\n5. 조회 종료 날짜를 입력한 경우, 조회 시작 날짜는 필수 입력 항목입니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 조회 성공 시 SUCCESS 반환\n2. 조회 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"에누리 내역 조회 성공","must_return":true,"note":"텍스트, 이번 반환 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":true,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"반환 영수증 데이터","example":"","must_return":true,"note":"내용은 JSON 형식 문자열. 조회 실패 시 이 필드는 빈 값 반환","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"검사 코드","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"이번 데이터 반환의 적법성을 검사하는 용도이며, 연동 시 이 파라미터를 비교하여 플랫폼에서 반환된 데이터인지 검증하십시오. 검증 방법은 'SHA256 암호화 설명'을 참조하십시오.\n\nCheckCodeSearch = MerchantID,StartDate,EndDate,TimeStamp를 SHA256 서명 규격에 따라 계산한 해시값\n\n발행 실패 시 빈 값을 반환합니다.\n\n특별 주의사항:\n1. TimeStamp는 이번 조회 시 전송한 타임스탬프입니다.\n2. StartDate, EndDate는 구분자(하이픈 등)를 제거해야 암호화할 수 있으며, 형식은 YYYYMMDD입니다(예: 20260503).\n\n암호화 전 아래와 같은 문자열로 조합한 후 암호화하고 대문자로 변환해야 합니다.\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice 포함 필드","group_type":"암호화 없음","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"AllowanceNo","required":"","type":"string(20)","label":"에누리 일련번호","example":"1229","must_return":false,"note":"에누리 내역 발행 시 생성되는 시스템 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671005","must_return":false,"note":"에누리 내역이 속한 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"구매자 이메일","example":"abc@gmail.com","must_return":false,"note":"에누리 내역 발행 시 해당 내역의 구매자 이메일.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"에누리 금액","example":"500","must_return":false,"note":"순수 숫자, 에누리 내역 금액.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"에누리 내역 생성 날짜","example":"2014-09-25 12:12:12","must_return":false,"note":"해당 에누리 내역의 생성 시간, 예: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"에누리 상태","example":"1","must_return":false,"note":"해당 에누리 내역의 상태.\n0=미확인 에누리\n1=확인 완료 에누리\n2=취소된 에누리","enum_values":"","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"상품 명세","example":"[{\"ItemNum\":1,\"ItemName\":\"환불\",\"ItemCount\":\"1\",\"ItemWord\":\"장\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"승차권\",\"ItemCount\":\"1\",\"ItemWord\":\"장\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"수수료\",\"ItemCount\":\"1\",\"ItemWord\":\"건\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"해당 에누리 내역 발행 시의 상품 정보(JSON 형식).\nItemNum = 품목 일련번호\nItemName = 상품 이름\nItemCount = 수량\nItemWord = 단위\nItemPrice = 단가\nItemAmount = 소계\n\n주의사항:\n필드 값은 JSON 형식 문자열이므로, 상품 명세 배열을 얻으려면 이 값을 한 번 더 JSON 파싱하십시오.","enum_values":"","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사 전자영수증 사용 미신청"},{"code":"KEY10007","reason":"페이지 30분 이상 정지"},{"code":"KEY10009","reason":"여행사 사업자등록번호 데이터를 찾을 수 없음"},{"code":"KEY10010","reason":"여행사 사업자등록번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사 우편 출력 부가 서비스 미신청"},{"code":"KEY10017","reason":"우편 출력 부가 서비스 이용 가능 횟수 부족"},{"code":"KEY10018","reason":"발행자 필드 미입력"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"KEY10020","reason":"SearchType_ 필드 공란"},{"code":"KEY10021","reason":"ReturnType_ 필드 공란"},{"code":"INV20014","reason":"사업자등록번호 형식 오류"},{"code":"INV70001","reason":"필드 데이터 형식 오류"},{"code":"WEB1002","reason":"날짜 형식 오류"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"BS10001","reason":"조회 구간 오류"},{"code":"BS10002","reason":"영수증 출처 오류 (입력한 영수증 출처 파라미터를 확인하십시오)"},{"code":"BS10003","reason":"영수증 상태 오류 (입력한 영수증 출처 파라미터를 확인하십시오)"},{"code":"BS10004","reason":"영수증 종류 오류 (입력한 영수증 출처 파라미터를 확인하십시오)"},{"code":"BS10005","reason":"영수증 데이터 조회 실패 (재시도 하시고, 지속될 경우 고객센터로 연락하십시오)"},{"code":"BS10006","reason":"영수증 데이터 없음"},{"code":"BS10007","reason":"에누리 상태 오류 (입력한 영수증 출처 파라미터를 확인하십시오)"},{"code":"BS10008","reason":"검색 종류 오류"},{"code":"BS10009","reason":"에누리 내역 출처 오류"},{"code":"BS10010","reason":"에누리 내역 상태 오류"},{"code":"BS10011","reason":"폐기 내역 출처 오류"},{"code":"BS10012","reason":"폐기 내역 상태 오류"},{"code":"BS10013","reason":"날짜 구간 오류 (최대 90일 데이터만 조회 가능)"},{"code":"BS10014","reason":"날짜 구간 오류 (시작 날짜가 종료 날짜보다 클 수 없음)"}],"versions":[]},

ype}<\/span>-bearbetning krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att pushas asynkront av systemet till den <span class=\"font-bold text-green-700\">Webhook<\/span>-URL som butiken angett.","msg_res_info_sync":"Detta resultat returneras synkront av systemet via <span class=\"font-bold text-green-700\">{method}<\/span>-metoden i <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kombineras till en frågesträng (Query String) med <span class=\"font-mono font-bold text-cyan-700\">&<\/span>-symbolen, till exempel <span class=\"font-mono text-cyan-700\">key1=val1&key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten placeras i ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt för överföring.","msg_res_format_other":"De returnerade fälten kombineras med <span class=\"font-bold text-cyan-700\">{format}<\/span>-format.","msg_res_security":"Verifiering och dekryptering: <span class=\"font-bold\">{group_type}<\/span>-bearbetning krävs för specifik data vid mottagande.","lbl_sha_pre_hash":"Sträng före hashning (String to Hash)","ph_sha_pre_hash":"När du trycker på hash-knappen visas här den fullständiga strängen som faktiskt krypteras...","flowchart_0_url":"assets/flowcharts_batch-query-receipt-allowance-api/fc_4.png"},"meta":{"title":"API för batchfrågor om kvittoavdrag","subtitle":"Batchfrågor om avdragsdata","version":"","sections":[{"id":"section-0","title":"Syfte med integrationen","desc":"<p><span style=\"color: rgb(0, 0, 0);\">Efter att ett elektroniskt kvitto har utfärdats kan du använda tidsintervall och parametrar för kvittoavdrag för att fråga efter avdragsdata och status inom den angivna perioden.<\/span><\/p>"},{"id":"section-1","title":"Datoutbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittoinformation via \"HTTP POST\" till den elektroniska kvitto-plattformen för utfärdande.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvitto-plattformen returnerar en formaterad sträng.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Enheten för varje fält beräknas i tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&\"-tecknet, och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa steg, annars kommer integrationen att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på backend för test → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på backend för produktion → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner formuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Maximalt 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns publika IP (inte intern IP, kontrollera på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt separata enheter, data delas inte. Innan driftsättning måste du säkerställa att integrations-URL:en har växlats till produktions-URL:en.<\/p><p><br><\/p><p>4. Vanliga fel på grund av \"glömda förberedelser\"<\/p><p>- `KEY10001 Ej godkänd IP för resebyråns API-integration` → IP-vitlista inte inställd eller felaktigt inställd<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktiga eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller ej aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för batchfråga om avdragsnota"}]},"apis":[{"name":"API för batchfrågor om kvittoavdrag","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Söktyp","example":"2","must_return":false,"note":"Sätts fast till 2","enum_values":"2","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Fältkombination följt av AES256-kryptering, se fältbeskrivning i tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-version","example":"2.0","must_return":false,"note":"Sätts fast till 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), antalet sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: 2014-05-15 15:00:00 motsvarar tidsstämpeln 1400137200, vi rekommenderar aktuell tid\nObs: Denna tidsstämpel måste sparas, då den krävs för att beräkna CheckCodeSearch vid retur","enum_values":"","default_value":"","null                             var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }

                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }

                    let desc = ui['enc_sha_step' + i + '_desc'] || '';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-words">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-words">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function generateResponseRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);
            window.history.replaceState({}, document.title, url);

            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
        }

        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">

                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }

                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
