        const globalCodeExamples = {"PHP":"<?php\n\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use.\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected.\n */\n\n// API Endpoints\ndefine('API_ENDPOINT_PROD', 'https://api.travelinvoice.com.tw/invoice_searchall');\ndefine('API_ENDPOINT_TEST', 'https://capi.travelinvoice.com.tw/invoice_searchall');\n\n// --- API Credentials (Replace with your actual values) ---\n// 32 bytes — used for both AES-256 encryption (as key) and SHA256 signature (as HashKey).\ndefine('AES_KEY_HASH_KEY', 'YOUR_AES_KEY_HASH_KEY_HERE_32_BYTES'); // e.g., 'abcdefghijklmnopqrstuvwxyz123456'\n\n// 16 bytes — used for both AES-256 encryption (as IV) and SHA256 signature (as HashIV).\ndefine('AES_IV_HASH_IV', 'YOUR_AES_IV_HASH_IV_HERE_16_BYTES'); // e.g., '1234567890123456'\n\n// Your Merchant ID / 旅行社統一編號\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE'); // e.g., '54352706'\n\n// --- Placeholder Check ---\nif (AES_KEY_HASH_KEY === 'YOUR_AES_KEY_HASH_KEY_HERE_32_BYTES' ||\n    AES_IV_HASH_IV === 'YOUR_AES_IV_HASH_IV_HERE_16_BYTES' ||\n    MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE') {\n    echo '<div style=\"color: red; font-weight: bold; padding: 20px; border: 1px solid red; margin: 10px;\">';\n    echo 'ERROR: Please replace all placeholder constants (AES_KEY_HASH_KEY, AES_IV_HASH_IV, MERCHANT_ID) with your actual API credentials before running this code.';\n    echo '<\/div>';\n    exit;\n}\n\n// Ensure keys and IVs are of correct lengths\nif (strlen(AES_KEY_HASH_KEY) !== 32 || strlen(AES_IV_HASH_IV) !== 16) {\n    echo '<div style=\"color: red; font-weight: bold; padding: 20px; border: 1px solid red; margin: 10px;\">';\n    echo 'ERROR: AES_KEY_HASH_KEY must be 32 bytes and AES_IV_HASH_IV must be 16 bytes.';\n    echo '<\/div>';\n    exit;\n}\n\n/**\n * Encrypts plaintext using AES-256-CBC with non-standard PKCS7 (32-byte block size) padding.\n *\n * @param string $plaintext The data to encrypt (UTF-8 encoded).\n * @param string $key The 32-byte AES encryption key.\n * @param string $iv The 16-byte AES initialization vector.\n * @return string The ciphertext in hexadecimal format.\n * @throws Exception If encryption fails.\n */\nfunction encrypt_aes256_cbc_pkcs7_b32(string $plaintext, string $key, string $iv): string\n{\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $block_size = 32;\n    $padding_len = $block_size - (strlen($plaintext) % $block_size);\n    $padded_plaintext = $plaintext . str_repeat(chr($padding_len), $padding_len);\n\n    $encrypted = openssl_encrypt($padded_plaintext, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n\n    if ($encrypted === false) {\n        throw new Exception('AES encryption failed: ' . openssl_error_string());\n    }\n\n    return strtoupper(bin2hex($encrypted));\n}\n\n/**\n * Calculates the SHA256 signature for response verification.\n * This function is used to verify the CheckCodeSearch field in the API response.\n *\n * @param string $merchantId The MerchantID from the original request.\n * @param string $requestStartDate The StartDate from the original request (YYYY-MM-DD format).\n * @param string $requestEndDate The EndDate from the original request (YYYY-MM-DD format).\n * @param string $requestTimeStamp The TimeStamp from the original request.\n * @param string $hashKey The HashKey (32 bytes).\n * @param string $hashIv The HashIV (16 bytes).\n * @return string The calculated SHA256 hash in uppercase hexadecimal format.\n */\nfunction calculate_response_signature_for_verification(\n    string $merchantId,\n    string $requestStartDate,\n    string $requestEndDate,\n    string $requestTimeStamp,\n    string $hashKey,\n    string $hashIv\n): string {\n    // Dates for signature must be in YYYYMMDD format (without separators)\n    $formattedStartDate = str_replace('-', '', $requestStartDate);\n    $formattedEndDate = str_replace('-', '', $requestEndDate);\n\n    // Build the string according to the SHA256 signature specification (A-Z alphabetical order of field names)\n    $signatureString = 'HashIV=' . $hashIv .\n                       '&EndDate=' . $formattedEndDate .\n                       '&MerchantID=' . $merchantId .\n                       '&StartDate=' . $formattedStartDate .\n                       '&TimeStamp=' . $requestTimeStamp .\n                       '&HashKey=' . $hashKey;\n\n    return strtoupper(hash('sha256', $signatureString));\n}\n\n$response_message = '';\n$response_data = null;\n$error_message = '';\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action']) && $_POST['action'] === 'search') {\n    try {\n        $merchantId_ = MERCHANT_ID;\n        $searchType_ = 4; // 固定帶4\n\n        // PostData_內含欄位\n        $version = '2.0';\n        $timeStamp = (string)time(); // Unix epoch seconds\n        $merchantOrderNo = $_POST['merchantOrderNo'] ?? '';\n        $startDate = $_POST['startDate'] ?? '';\n        $endDate = $_POST['endDate'] ?? '';\n\n        // Validate MerchantOrderNo if present, or if both dates are missing.\n        if (empty($merchantOrderNo) && (empty($startDate) || empty($endDate))) {\n            throw new Exception('Please provide a Merchant Order No. OR both Start Date and End Date.');\n        }\n\n        // Validate date range if both dates are provided\n        if (!empty($startDate) && !empty($endDate)) {\n            $startDateTime = new DateTime($startDate);\n            $endDateTime = new DateTime($endDate);\n\n            if ($startDateTime > $endDateTime) {\n                throw new Exception('Start Date cannot be greater than End Date.');\n            }\n\n            $interval = $startDateTime->diff($endDateTime);\n            if ($interval->days > 90) {\n                throw new Exception('Date range cannot exceed 90 days.');\n            }\n        } elseif (!empty($startDate) xor !empty($endDate)) {\n            // If one date is provided, the other is required\n            throw new Exception('Both Start Date and End Date are required if one is provided.');\n        }\n\n        // Construct PostData_内含欄位 as querystring\n        $postDataInnerFields = [\n            'Version' => $version,\n            'TimeStamp' => $timeStamp,\n            'MerchantOrderNo' => $merchantOrderNo,\n        ];\n\n        // Add optional fields if they are not empty\n        if (!empty($startDate)) {\n            $postDataInnerFields['StartDate'] = $startDate;\n        }\n        if (!empty($endDate)) {\n            $postDataInnerFields['EndDate'] = $endDate;\n        }\n\n        // Add other optional fields with default values or empty if not provided by user.\n        // For this example, we only include the essential ones and the user-provided dates.\n        // For a full implementation, you would allow user input for InvoiceFrom, InvoiceStatus, etc.\n        $postDataInnerFields['InvoiceFrom'] = $_POST['invoiceFrom'] ?? '';\n        $postDataInnerFields['InvoiceStatus'] = $_POST['invoiceStatus'] ?? '';\n        $postDataInnerFields['AllowStatus'] = $_POST['allowStatus'] ?? '';\n        $postDataInnerFields['Category'] = $_POST['category'] ?? '';\n        $postDataInnerFields['SellerName'] = $_POST['sellerName'] ?? '';\n\n        // Filter out empty optional fields to prevent `key=` in querystring unless explicitly needed.\n        $filteredPostDataInnerFields = [];\n        foreach ($postDataInnerFields as $key => $value) {\n            if ($value !== '') { // Keep '0' for int fields if it's a valid enum value\n                $filteredPostDataInnerFields[$key] = $value;\n            }\n        }\n\n        $postDataInnerString = http_build_query($filteredPostDataInnerFields, '', '&', PHP_QUERY_RFC3986); // Note: http_build_query is fine here as it's for the encrypted payload, not signature string\n        \n        // Encrypt PostData_\n        $encryptedPostData = encrypt_aes256_cbc_pkcs7_b32($postDataInnerString, AES_KEY_HASH_KEY, AES_IV_HASH_IV);\n\n        // Prepare the final POST data\n        $postFields = http_build_query([\n            'MerchantID_' => $merchantId_,\n            'SearchType_' => $searchType_,\n            'PostData_' => $encryptedPostData,\n        ], '', '&', PHP_QUERY_RFC3986);\n\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_ENDPOINT_TEST); // Use TEST endpoint for demonstration\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, $postFields);\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded',\n        ]);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30); // Set a reasonable timeout\n\n        $api_response = curl_exec($ch);\n        $http_code = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        $curl_error = curl_error($ch);\n\n        if ($api_response === false) {\n            throw new Exception('cURL error: ' . $curl_error);\n        }\n\n        if ($http_code !== 200) {\n            throw new Exception('API request failed with HTTP status code: ' . $http_code . '. Response: ' . $api_response);\n        }\n\n        $response_data = json_decode($api_response, true);\n\n        if (json_last_error() !== JSON_ERROR_NONE) {\n            throw new Exception('Failed to parse JSON response: ' . json_last_error_msg() . '. Raw response: ' . $api_response);\n        }\n\n        $status = $response_data['Status'] ?? 'UNKNOWN';\n        $message = $response_data['Message'] ?? 'No message from API.';\n\n        if ($status === 'SUCCESS') {\n            // Verify the CheckCodeSearch signature\n            $responseMerchantId = $response_data['MerchantID'] ?? '';\n            $checkCodeSearch = $response_data['CheckCodeSearch'] ?? '';\n\n            // Use the original request dates and timestamp for verification\n            $expectedSignature = calculate_response_signature_for_verification(\n                $responseMerchantId,\n                $startDate,       // Original YYYY-MM-DD from request\n                $endDate,         // Original YYYY-MM-DD from request\n                $timeStamp,       // Original TimeStamp from request\n                AES_KEY_HASH_KEY, // HashKey\n                AES_IV_HASH_IV    // HashIV\n            );\n\n            if (!hash_equals($expectedSignature, $checkCodeSearch)) {\n                $response_message = \"SUCCESS, but CheckCodeSearch verification FAILED. Calculated: {$expectedSignature}, Received: {$checkCodeSearch}\";\n            } else {\n                $response_message = \"SUCCESS and CheckCodeSearch verified.\";\n            }\n        } else {\n            $response_message = \"API Error (Status: {$status}): {$message}\";\n            // Log specific error codes from the API spec for better debugging\n            if (isset($response_data['Status'])) {\n                $error_code = $response_data['Status'];\n                // Example of specific error handling\n                if ($error_code === 'KEY10002') {\n                    $response_message .= \" (Data decryption error.)\";\n                } elseif ($error_code === 'BS10006') {\n                    $response_message .= \" (No invoice data found.)\";\n                }\n            }\n        }\n\n    } catch (Exception $e) {\n        $error_message = $e->getMessage();\n    }\n}\n?>\n\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Invoice Search API<\/title>\n    <style>\n        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; background-color: #f4f4f4; color: #333; }\n        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }\n        h1, h2 { color: #0056b3; }\n        label { display: block; margin-bottom: 5px; font-weight: bold; }\n        input[type=\"text\"], input[type=\"date\"], input[type=\"number\"], select {\n            width: calc(100% - 22px);\n            padding: 10px;\n            margin-bottom: 15px;\n            border: 1px solid #ddd;\n            border-radius: 4px;\n        }\n        button {\n            background-color: #007bff;\n            color: white;\n            padding: 10px 20px;\n            border: none;\n            border-radius: 4px;\n            cursor: pointer;\n            font-size: 16px;\n        }\n        button:hover {\n            background-color: #0056b3;\n        }\n        .error { color: red; font-weight: bold; margin-bottom: 15px; }\n        .success { color: green; font-weight: bold; margin-bottom: 15px; }\n        pre { background: #eee; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }\n        .response-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }\n        .form-group { margin-bottom: 15px; }\n    <\/style>\n<\/head>\n<body>\n    <div class=\"container\">\n        <h1>自訂編號查詢電子收據開立資料API<\/h1>\n\n        <?php if ($error_message): ?>\n            <div class=\"error\">Error: <?php echo htmlspecialchars($error_message); ?><\/div>\n        <?php endif; ?>\n        <?php if ($response_message): ceStatus 為 1 時，此參數才列入查詢條件。<\/small>\n            <\/div>\n            <div class=\"form-group\">\n                <label for=\"category\">Category (收據種類):<\/label>\n                <select id=\"category\" name=\"category\">\n                    <option value=\"\" <?php if (($_POST['category'] ?? '') === '') echo 'selected'; ?>>不過濾<\/option>\n                    <option value=\"B2B\" <?php if (($_POST['category'] ?? '') === 'B2B') echo 'selected'; ?>>B2B<\/option>\n                    <option value=\"B2C\" <?php if (($_POST['category'] ?? '') === 'B2C') echo 'selected'; ?>>B2C<\/option>\n                <\/select>\n            <\/div>\n            <div class=\"form-group\">\n                <label for=\"sellerName\">SellerName (經辦人名稱):<\/label>\n                <input type=\"text\" id=\"sellerName\" name=\"sellerName\" value=\"<?php echo htmlspecialchars($_POST['sellerName'] ?? ''); ?>\" placeholder=\"例: 丁小雨\">\n                <small>為精確比對，需輸入完整無誤之經辦人名稱。<\/small>\n            <\/div>\n\n            <button type=\"submit\">查詢收據<\/button>\n        <\/form>\n\n        <?php if ($response_data): ?>\n            <div class=\"response-section\">\n                <h2>API 回應<\/h2>\n                <h3>原始 JSON 回應:<\/h3>\n                <pre><?php echo htmlspecialchars(json_encode($response_data, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE)); ?><\/pre>\n\n                <h3>回傳收據資料 (ReturnInvoice):<\/h3>\n                <?php\n                $returnInvoice = $response_data['ReturnInvoice'] ?? [];\n                if (!empty($returnInvoice)):\n                    foreach ($returnInvoice as $key => $invoice):\n                ?>\n                    <h4>收據 #<?php echo $key + 1; ?><\/h4>\n                    <ul>\n                        <li><strong>InvoiceTransNo (開立流水號):<\/strong> <?php echo htmlspecialchars($invoice['InvoiceTransNo'] ?? 'N/A'); ?><\/li>\n                        <li><strong>MerchantOrderNo (自訂編號):<\/strong> <?php echo htmlspecialchars($invoice['MerchantOrderNo'] ?? 'N/A'); ?><\/li>\n                        <li><strong>InvoiceNumber (收據號碼):<\/strong> <?php echo htmlspecialchars($invoice['InvoiceNumber'] ?? 'N/A'); ?><\/li>\n                        <li><strong>RandomNum (收據防偽隨機碼):<\/strong> <?php echo htmlspecialchars($invoice['RandomNum'] ?? 'N/A'); ?><\/li>\n                        <li><strong>BuyerName (買受人名稱):<\/strong> <?php echo htmlspecialchars($invoice['BuyerName'] ?? 'N/A'); ?><\/li>\n                        <li><strong>BuyerUBN (買受人統一編號):<\/strong> <?php echo htmlspecialchars($invoice['BuyerUBN'] ?? 'N/A'); ?><\/li>\n                        <li><strong>TotalAmt (收據金額):<\/strong> <?php echo htmlspecialchars($invoice['TotalAmt'] ?? 'N/A'); ?><\/li>\n                        <li><strong>CreateTime (開立收據時間):<\/strong> <?php echo htmlspecialchars($invoice['CreateTime'] ?? 'N/A'); ?><\/li>\n                        <li><strong>InvoiceStatus (收據狀態):<\/strong> <?php\n                            $statusMap = [\n                                '0' => '預約開立',\n                                '1' => '已開立',\n                                '2' => '取消預約開立',\n                                '3' => '已作廢'\n                            ];\n                            echo htmlspecialchars($statusMap[$invoice['InvoiceStatus'] ?? ''] ?? ($invoice['InvoiceStatus'] ?? 'N/A'));\n                        ?><\/li>\n                        <li><strong>Category (收據種類):<\/strong> <?php echo htmlspecialchars($invoice['Category'] ?? 'N/A'); ?><\/li>\n                        <li><strong>TourName (團名):<\/strong> <?php echo htmlspecialchars($invoice['TourName'] ?? 'N/A'); ?><\/li>\n                        <li><strong>TourNo (團號):<\/strong> <?php echo htmlspecialchars($invoice['TourNo'] ?? 'N/A'); ?><\/li>\n                        <li><strong>TourDate (預計出團日):<\/strong> <?php echo htmlspecialchars($invoice['TourDate'] ?? 'N/A'); ?><\/li>\n                        <li><strong>TaxNoted (申報註記):<\/strong> <?php echo htmlspecialchars(($invoice['TaxNoted'] ?? '') === '0' ? '未申報' : ( ($invoice['TaxNoted'] ?? '') === '1' ? '已申報' : 'N/A' ) ); ?><\/li>\n                        <li><strong>ItemDetail (商品明細):<\/strong>\n                            <?php\n                            $itemDetail = json_decode($invoice['ItemDetail'] ?? '[]', true);\n                            if (!empty($itemDetail)):\n                                echo '<ul>';\n                                foreach ($itemDetail as $item):\n                                    echo '<li>' . htmlspecialchars(($item['ItemName'] ?? 'N/A')) . ' - ' . htmlspecialchars(($item['ItemCount'] ?? 'N/A')) . htmlspecialchars(($item['ItemWord'] ?? 'N/A')) . ' @ ' . htmlspecialchars(($item['ItemPrice'] ?? 'N/A')) . ' = ' . htmlspecialchars(($item['ItemAmount'] ?? 'N/A')) . '<\/li>';\n                                endforeach;\n                                echo '<\/ul>';\n                            else:\n                                echo 'N/A';\n                            endif;\n                            ?>\n                        <\/li>\n                    <\/ul>\n                <?php\n                    endforeach;\n                else:\n                    echo '<p>查無收據資料。<\/p>';\n                endif;\n                ?>\n            <\/div>\n        <?php endif; ?>\n    <\/div>\n<\/body>\n<\/html>"};

        function getMsg(ui, key, defaultMsg, replacements) {
            var msg = ui[key] || defaultMsg;
            if (replacements) {
                for (var k in replacements) {
                    msg = msg.replace(new RegExp('\\{' + k + '\\}', 'g'), replacements[k]);
                }
            }
            return msg;
        }

        function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

            function onScroll() {

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>

            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden');

        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
