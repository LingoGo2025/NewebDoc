6）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"自訂編號查詢收據資料呼叫流程圖"}]},"apis":[{"name":"自訂編號查詢電子收據開立資料API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"搜尋種類","example":"4","must_return":false,"note":"固定帶4","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"2.0","must_return":false,"note":"固定帶 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"自從 Unix 纪元（格林威治時間 1970 年1 月 1 日 00:00:00）到當前時間的秒數，若以 php 程式語言為例，即為呼叫time()函式所回傳的值。\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間\n注意：此時間戳記需保留，作為回傳時，組合CheckCodeSearch時所需TimeStamp就是此值","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceFrom","required":"","type":"int(1)","label":"收據來源","example":"1","must_return":false,"note":"0＝API 建立\n1＝官網操作建立","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"收據狀態","example":"1","must_return":false,"note":"0＝預約開立\n1＝已開立\n2= 取消預約開立\n3＝已作廢","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"折讓狀態","example":"1","must_return":false,"note":"0=已開立，並且未有折讓\n1=已開立，且有折讓\n當［InvoiceStatus］參數值為 1 時，［AllowStatus］參數才會列入查詢條件。","enum_values":"0,1","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"收據種類","example":"B2B","must_return":false,"note":"該張收據的種類。\nB2B=買受人為營利事業單位(有統編)\nB2C=買受人為個人\n空值表示不過濾","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"經辦人名稱","example":"丁小雨","must_return":false,"note":"可過濾特定經辦人開立之收據。為精確比對，需輸入完整無誤之經辦人名稱，方可進行比對。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"收據自訂編號","example":"O_32546666","must_return":false,"note":"旅行社於開立收據時輸入的自訂編號。","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"","type":"date","label":"查詢起始日期","example":"2016-09-25","must_return":false,"note":"1.格式為 YYYY-MM-DD。查詢區間起始（收據開立時間）例：2016-09-25\n2.若已帶入收據號碼參數，查詢起始日期與查詢結束日期建議留空，查詢時將不考慮查詢區間。\n3.若已帶入收據號碼參數，同時也填入查詢起始日期與查詢結束日期，將僅查詢所設定時間區間內的資料。.\n4.若有填入查詢起始日期，則查詢結束日期為必填。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"","type":"date","label":"查詢結束日期","example":"2016-09-25","must_return":false,"note":"1.格式為 YYYY-MM-DD。查詢區間結束（收據開立時間）例：2016-02-25\n2.查詢日期區間最長為 90 天，系統會抓取當前日曆天進行天數計算。例 : 若查詢起始日期為 2025-09-01，最長可接受之查詢結束日期為 2025-11-29\n3.若已帶入收據號碼參數，查詢起始日期與查詢結束日期建議留空，查詢時將不考慮查詢區間。\n4.若已帶入收據號碼參數，同時也填入查詢起始日期與查詢結束日期，將僅查詢所設定時間區間內的資料。\n5.若有輸入查詢結束日期，則查詢起始日期為必填。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.查詢成功，則回傳 SUCCESS\n2.查詢失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":true,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"回傳的收據資料","example":"","must_return":true,"note":"內容為 JSON 格式字串。查詢失敗此欄位回傳空值","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"檢查碼","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。\n\nCheckCodeSearch = 將MerchantID,StartDate,EndDate,TimeStamp依 SHA256 簽章規格計算所得之雜湊值\n\n特別注意事項：\n1.TimeStamp 為本次查詢送出之時間戳記。\n2.StartDate、EndDate需去除分隔號才能送入加密，格式為YYYYMMDD(去除分隔號)，如：20260503\n\n加密前應該組合成以下這種字串後才壓碼並轉大寫\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef\n","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice內含欄位","group_type":"無加密","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"開立流水號","example":"402832","must_return":false,"note":"收據開立時產生的系統流水號。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"2ss0150413110119XX","must_return":false,"note":"1. 旅行社於開立收據時輸入的自訂編號。\n2. 若自訂編號為重覆多筆，則回傳相對應的收據資料。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13743182","must_return":false,"note":"此次查詢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"收據防偽隨機碼","example":"14673793","must_return":false,"note":"於開立收據時，所產生的 8 碼收據防偽隨機碼。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(60)","label":"買受人名稱","example":"王大","must_return":false,"note":"開立收據時的買受人名稱，個人姓名或營業人名稱。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(10)","label":"買受人統一編號","example":"54352706","must_return":false,"note":"1. 若為 B2B 收據，此欄位為買受人統一編號。\n2. 若為 B2C 收據，此欄位為0。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(200)","label":"買受人地址","example":"台北市南港區南港路二段97號8樓","must_return":false,"note":"於開立收據時，該張收據的買受人地址。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerPhone","required":"","type":"string(15)","label":"買受人手機號碼","example":"0922548754","must_return":false,"note":"於開立收據時，該張收據的買受人手機號碼。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"買受人電子信箱","example":"abc@gmail.com","must_return":false,"note":"於開立收據時，該張收據的買受人電子信箱。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"收據種類","example":"B2B","must_return":false,"note":"收據的收據種類。\nB2B=買受人為營利事業單位(有統編)\nB2C=買受人為個人","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"收據金額","example":"500","must_return":false,"note":"純數字，為收據總金額。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"開立收據時間","example":"2014-09-25 12:12:12","must_return":false,"note":"收據開立時間，例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"收據狀態","example":"1","must_return":false,"note":"收據之收據狀態。\n0＝預約開立\n1＝已開立\n2=取消預約開立\n3＝已作廢","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"退票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"車票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手續費\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"收據開立時的商品資訊(JSON 格式)。\nItemNum = 品項序號\nItemName = 商品名稱\nItemCount = 數量\nItemWord = 單位\nItemPrice = 單價\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"團名","example":"北海道5日遊","must_return":false,"note":"收據的團名","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"團號","example":"B284465","must_return":false,"note":"收據的團號","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"","type":"string(8)","label":"預計出團日","example":"2026-03-22","must_return":false,"note":"收據出團日,出團日當天會發提醒信至指定信箱","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"申報註記","example":"0","must_return":false,"note":"0=未申報\n1=已申報","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"KEY10020","reason":"SearchType_欄位空白"},{"code":"KEY10021","reason":"ReturnType_欄位空白"},{"code":"INV20014","reason":"統一編號格式有誤"},{"code":"INV70001","reason":"欄位資料格式錯誤"},{"code":"WEB1002","reason":"日期格式有誤"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"BS10001","reason":"查詢區間錯誤"},{"code":"BS10002","reason":"收據來源錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10003","reason":"收據狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10004","reason":"收據種類錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10005","reason":"取得查詢收據資料失敗（請多嘗試幾次，若一直出現此錯誤請聯繫客服）"},{"code":"BS10006","reason":"查無收據資料"},{"code":"BS10007","reason":"折讓狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10008","reason":"搜尋種類錯誤"},{"code":"BS10009","reason":"折讓單來源錯誤"},{"code":"BS10010","reason":"折讓單狀態錯誤"},{"code":"BS10011","reason":"作廢單來源錯誤"},{"code":"BS10012","reason":"作廢單狀態錯誤"},{"code":"BS10013","reason":"日期區間有誤（最多查詢 90 日資料）"},{"code":"BS10014","reason":"日期區間有誤（起始日期不得大於結束日期）"}],"versions":[]},

"en": {"languageName":"English","ui":{"head_title":"Custom Number Query Electronic Receipt Issuance Data API","system_name":"","copyright":"","sidebar_brand":"Custom Number Query Electronic Receipt Issuance Data API","nav_tool":"Encryption Test Tool","nav_group_api":"API Specification Details","nav_apis":"API Specifications","nav_encryption":"Encryption Rule Details","nav_errors":"Error Code Table","nav_example":"Sample Code","tool_title":"Encryption Test Tool","tool_intro":"This tool helps you generate encrypted strings or decrypt returned results.","tool_security_warning":"Security Warning: This tool is for integration testing only. To ensure information security, please do not enter your production Hash Key and Hash IV here.","tool_tab_encrypt":"AES Encryption","tool_tab_decrypt":"AES Decryption","tool_tab_sha":"SHA256 Encryption","tool_ph_key":"Example: AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"Example: AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"Request Parameters (Query String)","tool_ph_qs":"Example: TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"Please ensure the string has been processed by http_build_query or urlencode.","tool_note_sha_sort":"The program will automatically sort the fields below by English name (A-Z), combine them, and prepend/append IV/Key.","tool_btn_encrypt":"Execute Encryption to Generate Encrypted String","tool_btn_sha":"Execute SHA256","tool_lbl_hex":"Encryption Result (Hex String)","tool_lbl_enc_hex":"Encrypted String (Hex String)","tool_lbl_sha_res":"SHA256 Result (Uppercase)","tool_ph_enc_hex":"Example: 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"Execute Decryption","tool_lbl_decrypt_res":"Decryption Result (Original Data)","tool_alert_missing_key":"Please enter Hash Key and Hash IV.","tool_alert_missing_data":"Please enter the original string.","tool_alert_encrypt_fail":"Encryption failed: ","tool_alert_missing_hex":"Please enter the encrypted Hex string.","tool_alert_decrypt_fail":"Decryption failed, please check Key/IV or encrypted string format.","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production Environment)","req_url_test":"URL (Test Environment)","th_param":"Parameter Name","th_name":"Chinese Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Notes","enc_title":"Encryption Rule Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Using the Hash Key and Hash IV provided by the vendor, encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Please use the vendor's assigned Hash Key and Hash IV.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum through SHA256 hashing to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by English name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Concatenate the HashIV and HashKey before and after the sorted string respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search Code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Notes","example_title":"Sample Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No sample code available yet","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modification Date","th_ver_desc":"Change Description","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definition","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transmission Location","lbl_belong_to":"Belongs To","msg_req_info":"This request needs to be initiated by the store. Use the <span class=\"font-bold text-blue-700\">{method}<\/span> method to package parameters and place them in <span class=\"font-bold text-blue-700\">{location}<\/span> for transmission.","msg_req_format_qs":"The fields in this block need to be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this block need to be transmitted within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_req_format_other":"The fields in this block are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_req_security":"Data Security: Before transmission, <span class=\"font-bold\">{group_type}<\/span> processing must be completed.","msg_res_info_webhook":"This result will be asynchronously pushed by the system to the store's designated <span class=\"font-bold text-green-700\">Webhook<\/span> receiving URL.","msg_res_info_sync":"This result will be synchronously returned by the system using the <span class=\"font-bold text-green-700\">{method}<\/span> method to <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: Upon reception, specific data needs to undergo <span class=\"font-bold\">{group_type}<\/span> processing.","lbl_sha_pre_hash":"String to Hash (Pre-Encryption Combination)","ph_sha_pre_hash":"After pressing the encrypt button, the complete string that is actually encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_query-e-receipt-by-custom-id-api/fc_1.png"},"meta":{"title":"Custom Number Query Electronic Receipt Issuance Data API","subtitle":"Use custom number to query receipt issuance data","version":"","sections":[{"id":"section-0","title":"Purpose of Integration","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After electronic receipts are issued, query receipt data and status through custom data parameters.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit receipt data to the electronic receipt platform for issuance using \"HTTP POST\".<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Unit of calculation for each field is character. Chinese, English, numbers, and symbols all count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&amp;\" is used as the delimiter between fields, and this character (U+0026) is not allowed within fields.<\/span><\/p>"},{"id":"section-2","title":"Pre-Integration Preparations","desc":"<p>(Must be completed first, otherwise the program will fail)<\/p><p><br><\/p><p>1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Channel: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be configured.<\/p><p>- Required Information: Server's external IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Activation Time: Usually 1-2 business days.<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- Test and production environments are on completely different devices and their data is not shared. Ensure that the integration URL has been switched to the production environment URL before going live.<\/p><p><br><\/p><p>4. Common Error Signals for \"Forgot Pre-Integration Preparations\"<\/p><p>- `KEY10001 Not a Travel Agency API Integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data Decryption Error` → Incorrect HashKey / HashIV or still using sample values<\/p><p>- `KEY10009 Could not retrieve Travel Agency Unified Number data` → MerchantID is incorrect or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Custom Number Receipt Data Query Call Flowchart"}]},"apis":[{"name":"Custom Number Query Electronic Receipt Issuance Data API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Unified Number","example":"54352706","must_return":false,"note":"Travel agency's unified number.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Search Type","example":"4","must_return":false,"note":"Fixed to 4.","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String fields combined and AES256 encrypted. Field description below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"2.0","must_return":false,"note":"Fixed to 2.0.","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Seconds from the Unix Epoch (January 1, 1970, 00:00:00 GMT) to the current time. In PHP, this is the value returned by the time() function.\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.\nNote: This timestamp must be retained as it is required for generating the CheckCodeSearch upon return, which is the same value as this timestamp.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceFrom","required":"","type":"int(1)","label":"Receipt Source","example":"1","must_return":false,"note":"0 = API Created\n1 = Official Website Operation Created","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"0 = Scheduled Issuance\n1 = Issued\n2 = Canceled Scheduled Issuance\n3 = Voided","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"Allowance Status","example":"1","must_return":false,"note":"0 = Issued, with no allowance\n1 = Issued, with allowance\nWhen the [InvoiceStatus] parameter is 1, the [AllowStatus] parameter will be included in the query conditions.","enum_values":"0,1","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"The category of the receipt.\nB2B = Buyer is a business entity (with unified number)\nB2C = Buyer is an individual\nEmpty value means no filtering.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Operator Name","example":"Ding XiaoYu","must_return":false,"note":"Can filter receipts issued by a specific operator. For precise matching, the complete and correct operator name must be entered for comparison.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Receipt Custom Number","example":"O_32546666","must_return":false,"note":"The custom number entered by the travel agency when issuing the receipt.","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"","type":"date","label":"Query Start Date","example":"2016-09-25","must_return":false,"note":"1. Format is YYYY-MM-DD. Query range start (receipt issuance time), e.g., 2016-09-25.\n2. If receipt number parameters are provided, it is recommended to leave the query start date and query end date blank; the query will not consider the date range.\n3. If receipt number parameters are provided, and query start and end dates are also entered, only data within the specified date range will be queried.\n4. If a query start date is entered, the query end date is mandatory.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"","type":"date","label":"Query End Date","example":"2016-09-25","must_return":false,"note":"1. Format is YYYY-MM-DD. Query range end (receipt issuance time), e.g., 2016-02-25.\n2. The maximum query date range is 90 days. The system will calculate the number of days based on the current calendar days. Example: If the query start date is 2025-09-01, the latest acceptable query end date is 2025-11-29.\n3. If receipt number parameters are provided, it is recommended to leave the query start date and query end date blank; the query will not consider the date range.\n4. If receipt number parameters are provided, and query start and end dates are also entered, only data within the specified date range will be queried.\n5. If an end date is entered, the start date is mandatory.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If the query is successful, return SUCCESS.\n2. If the query fails, return the error code.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the current return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Unified Number","example":"54352706","must_return":true,"note":"Travel agency's unified number.","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"Returned Receipt Data","example":"","must_return":true,"note":"Content is a JSON formatted string. Returns null if the query fails.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"Checksum","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"Used to check the legitimacy of the data returned in this response. During integration, you can compare this parameter to verify if it was returned by the platform. Refer to \"SHA256 Encryption Description\" for the verification method.\n\nCheckCodeSearch = Hash value calculated using SHA256 signature specifications for MerchantID, StartDate, EndDate, and TimeStamp.\n\nSpecial Notes:\n1. TimeStamp is the timestamp sent with the current query.\n2. StartDate and EndDate must have delimiters removed before being used for encryption, in the format YYYYMMDD (e.g., 20260503).\n\nBefore encryption, they should be combined into a string like this, then hashed and converted to uppercase:\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within ReturnInvoice","group_type":"No Encryption","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Issuance Serial Number","example":"402832","must_return":false,"note":"System serial number generated upon receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Number","example":"2ss0150413110119XX","must_return":false,"note":"1. The custom number entered by the travel agency when issuing the receipt.\n2. If there are multiple duplicate custom numbers, the corresponding receipt data will be returned.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13743182","must_return":false,"note":"The receipt number for this query.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Receipt Anti-counterfeiting Random Number","example":"14673793","must_return":false,"note":"An 8-digit random number for receipt anti-counterfeiting generated during receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(60)","label":"Buyer Name","example":"Wang Da","must_return":false,"note":"The buyer's name at the time of receipt issuance, either an individual's name or a business entity's name.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(10)","label":"Buyer Unified Number","example":"54352706","must_return":false,"note":"1. If it is a B2B receipt, this field is the buyer's unified number.\n2. If it is a B2C receipt, this field is 0.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(200)","label":"Buyer Address","example":"8F, No. 97, Section 2, Nangang Road, Nangang District, Taipei City","must_return":false,"note":"The buyer's address for that receipt at the time of issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerPhone","required":"","type":"string(15)","label":"Buyer Phone Number","example":"0922548754","must_return":false,"note":"The buyer's phone number for that receipt at the time of issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Buyer Email Address","example":"abc@gmail.com","must_return":false,"note":"The buyer's email address for that receipt at the time of issuance.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"The category of the receipt.\nB2B = Buyer is a business entity (with unified number)\nB2C = Buyer is an individual","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"500","must_return":false,"note":"Purely numerical, representing the total amount of the receipt.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Receipt Issuance Time","example":"2014-09-25 12:12:12","must_return":false,"note":"The time of receipt issuance, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"The status of the receipt.\n0 = Scheduled Issuance\n1 = Issued\n2 = Canceled Scheduled Issuance\n3 = Voided","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"Item Details","example":"[{\"ItemNum\":1,\"ItemName\":\"Refund\",\"ItemCount\":\"1\",\"ItemWord\":\"Ticket\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"Ticket\",\"ItemCount\":\"1\",\"ItemWord\":\"Ticket\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"Service Fee\",\"ItemCount\":\"1\",\"ItemWord\":\"Item\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"Item information at the time of receipt issuance (JSON format).\nItemNum = Item sequence number\nItemName = Item name\nItemCount = Quantity\nItemWord = Unit\nItemPrice = Unit price\nItemAmount = Subtotal","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"Name of the tour for the receipt.","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"Tour Number","example":"B284465","must_return":false,"note":"Tour number for the receipt.","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"","type":"string(8)","label":"Scheduled Departure Date","example":"2026-03-22","must_return":false,"note":"Departure date for the receipt. A reminder email will be sent to the specified email address on the departure date.","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"Tax Declaration Status","example":"0","must_return":false,"note":"0 = Not declared\n1 = Declared","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API Integration IP"},{"code":"KEY10002","reason":"Data Decryption Error"},{"code":"KEY10003","reason":"Invalid Version"},{"code":"KEY10004","reason":"Incomplete Data"},{"code":"KEY10006","reason":"Travel Agency Has Not Enabled Electronic Receipts"},{"code":"KEY10007","reason":"Session Timeout (Over 30 minutes)"},{"code":"KEY10009","reason":"Could Not Retrieve Travel Agency Unified Number Data"},{"code":"KEY10010","reason":"Travel Agency Unified Number is Empty"},{"code":"KEY10011","reason":"PostData_ Field is Empty"},{"code":"KEY10012","reason":"Data Transmission Error"},{"code":"KEY10013","reason":"Data is Empty"},{"code":"KEY10014","reason":"Timeout. Typically refers to I/O timeout."},{"code":"KEY10015","reason":"Receipt Amount Format Error"},{"code":"KEY10016","reason":"Travel Agency Has Not Subscribed to the Value-Added Service for Postal Printing"},{"code":"KEY10017","reason":"Insufficient Available Quota for Value-Added Service for Postal Printing"},{"code":"KEY10018","reason":"Issuer Field is Not Filled"},{"code":"KEY10019","reason":"Travel Agency Account is Suspended"},{"code":"KEY10020","reason":"SearchType_ Field is Empty"},{"code":"KEY10021","reason":"ReturnType_ Field is Empty"},{"code":"INV20014","reason":"Unified Number Format is Incorrect"},{"code":"INV70001","reason":"Field Data Format Error"},{"code":"WEB1002","reason":"Date Format Error"},{"code":"NOR10001","reason":"Network Connection Anomaly"},{"code":"BS10001","reason":"Query Range Error"},{"code":"BS10002","reason":"Receipt Source Error (Please verify the provided receipt source parameter)"},{"code":"BS10003","reason":"Receipt Status Error (Please verify the provided receipt status parameter)"},{"code":"BS10004","reason":"Receipt Category Error (Please verify the provided receipt category parameter)"},{"code":"BS10005","reason":"Failed to retrieve receipt query data (Please try again multiple times. If this error persists, please contact customer service.)"},{"code":"BS10006","reason":"No receipt data found"},{"code":"BS10007","reason":"Allowance Status Error (Please verify the provided allowance status parameter)"},{"code":"BS10008","reason":"Search Type Error"},{"code":"BS10009","reason":"Allowance Order Source Error"},{"code":"BS10010","reason":"Allowance Order Status Error"},{"code":"BS10011","reason":"Void Order Source Error"},{"code":"BS10012","reason":"Void Order Status Error"},{"code":"BS10013","reason":"Date Range Error (Maximum 90 days of data can be queried)"},{"code":"BS10014","reason":"Date Range Error (Start date cannot be later than end date)"}],"versions":[]},

 (key=value&key2=value2...)。","enc_step2_title":"AES 暗復号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード (Padding)：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 十六進数<\/span><br>Key / IV：提供された Hash Key および Hash IV を使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化されたバイナリデータ (Raw Data) を Hex String (小文字) に変換したものが、暗号化文字列です。","enc_sha_title":"SHA256 チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256 ハッシュによってチェックサムを生成し、リクエストパラメータまたは返却値の完全性を検証するために使用できます。","enc_sha_step1_title":"パラメータのソートと結合","enc_sha_step1_desc":"指定されたパラメータを英語名 (A-Z) でソートし、Query String (key1=val1&key2=val2...) に結合します。","enc_sha_step2_title":"IV と Key の連結","enc_sha_step2_desc":"ソートされた文字列の前後に HashIV と HashKey をそれぞれ連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 暗号化と大文字への変換","enc_sha_step3_desc":"連結された文字列に対して SHA256 暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"返却パラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータが未定義です","msg_code_unavailable":"// プログラムサンプルはまだありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"更新日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API基本情報","field_def_title":"APIフィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"起動タイプ","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null可能","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方法","lbl_location":"送信場所","lbl_belong_to":"所属","msg_req_info":"このリクエストは加盟店側から起動する必要があります。 <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 形式で、パラメータをパッケージ化し、<span class=\\\"font-bold text-blue-700\\\">{location}<\/span> に配置して送信してください。","msg_req_format_qs":"このブロックのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号で結合してクエリ文字列 (Query String) 形式にする必要があります。例: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに配置して送信する必要があります。","msg_req_format_other":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムによって非同期で、加盟店指定の <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムによって <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 形式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期して返却されます。","msg_res_format_qs":"返却されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号で結合してクエリ文字列 (Query String) 形式になります。例: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに配置して送信されます。","msg_res_format_other":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"復号化検証：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"ハッシュ前の結合文字列 (String to Hash)","ph_sha_pre_hash":"「ハッシュ」ボタンを押すと、実際にハッシュされる完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_query-e-receipt-by-custom-id-api/fc_2.png"},"meta":{"title":"カスタム番号による電子レシート発行データ照会API","subtitle":"カスタム番号を使用してレシート発行データを照会","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子レシート発行後、カスタムデータパラメータを通じて、その番号のレシートデータを照会およびステータス確認<\/span><\/p>"},{"id":"section-1","title":"データ交換方法","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」形式でレシートデータを電子レシートプラットフォームに送信して発行します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームは、フォーマットされた文字列を応答します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。漢字、英数字、記号はすべて1文字とカウントします。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号とし、各フィールド内にこの記号 (U+0026) を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"連携前の準備作業","desc":"<p>（先に完了してください。完了しないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリアのバックエンドにログイン → 基本情報 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番エリアのバックエンドにログイン → 基本情報 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーサービスセンター（FAX / Email）に送信<\/p><p>- 最大10個のIPアドレスを設定可能<\/p><p>- 提供情報：サーバーの外部IPアドレス（内部IPアドレスではなく、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1～2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番稼働前に、連携URLが本番エリアのURLに切り替わっていることを必ず確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備作業を忘れた」エラー信号<\/p><p>- `KEY10001 非旅行社 API 連携 IP` → IPホワイトリストが未設定または間違っている<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIV が不正確またはまだサンプル値<\/p><p>- `KEY10009 旅行社統一企業番号のデータが取得できない` → MerchantID が間違っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"カスタム番号によるレシートデータ照会呼び出しフローチャート"}]},"apis":[{"name":"カスタム番号による電子レシート発行データ照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一企業番号","example":"54352706","must_return":false,"note":"旅行会社統一企業番号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索タイプ","example":"4","must_return":false,"note":"固定で4","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256暗号化、フィールド説明は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内部フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"2.0","must_return":false,"note":"固定で 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixエポック（協定世界時1970年1月1日 00:00:00）から現在時刻までの秒数。PHP言語の場合、time()関数で返される値です。\n例: 2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在時刻の値を推奨します。\n注意：このタイムスタンプは、返却時に CheckCodeSearch を結合するために必要です。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceFrom","required":"","type":"int(1)","label":"レシートソース","example":"1","must_return":false,"note":"0＝API作成\n1＝公式サイト操作による作成","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"レシートステータス","example":"1","must_return":false,"note":"0＝予約発行\n1＝発行済み\n2=予約発行キャンセル\n3＝無効化済み","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"割引ステータス","example":"1","must_return":false,"note":"0=発行済み、かつ割引なし\n1=発行済み、かつ割引あり\n［InvoiceStatus］パラメータ値が 1 の場合のみ、［AllowStatus］パラメータが検索条件として考慮されます。","enum_values":"0,1","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"レシートタイプ","example":"B2B","must_return":false,"note":"レシートのタイプ。\nB2B=購入者が営利事業体 (法人番号あり)\nB2C=購入者が個人\n空欄の場合はフィルタリングしない","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"特定の担当者が発行したレシートをフィルタリングできます。正確に一致させるためには、担当者名を完全に入力する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"レシートカスタム番号","example":"O_32546666","must_return":false,"note":"旅行会社がレシート発行時に入力したカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"","type":"date","label":"検索開始日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。検索期間の開始（レシート発行時間）。例：2016-09-25\n2.レシート番号パラメータが指定されている場合、検索開始日と検索終了日は空欄を推奨します。検索時には検索期間は考慮されません。\n3.レシート番号パラメータが指定されており、かつ検索開始日と検索終了日も入力されている場合、指定された期間内のデータのみが検索されます。\n4.検索開始日が入力されている場合、検索終了日は必須です。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"","type":"date","label":"検索終了日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。検索期間の終了（レシート発行時間）。例：2016-02-25\n2.検索期間は最長90日です。システムは当日から日数を計算します。例：検索開始日が 2025-09-01 の場合、最大許容検索終了日は 2025-11-29 です。\n3.レシート番号パラメータが指定されている場合、検索開始日と検索終了日は空欄を推奨します。検索時には検索期間は考慮されません。\n4.レシート番号パラメータが指定されており、かつ検索開始日と検索終了日も入力されている場合、指定された期間内のデータのみが検索されます。\n5.検索終了日が入力されている場合、検索開始日は必須です。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1.検索成功の場合は SUCCESS を返却\n2.検索失敗の場合はエラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"この返却ステータスの説明（テキスト）。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社統一企業番号","example":"54352706","must_return":true,"note":"旅行会社統一企業番号。","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"返却レシートデータ","example":"","must_return":true,"note":"JSON形式の文字列です。検索失敗時は空値を返却します。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"チェックコード","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"このデータ返却の正当性を検証するために使用します。連携時にこのパラメータデータを比較して、プラットフォームから返却されたものであるかを確認できます。検証方法については「SHA256暗号化説明」を参照してください。\n\nCheckCodeSearch = MerchantID,StartDate,EndDate,TimeStamp を SHA256 署名仕様に従って計算されたハッシュ値\n\n特別な注意点：\n1. TimeStamp は今回の検索で送信されたタイムスタンプです。\n2. StartDate、EndDate は区切り記号を除去してから暗号化してください。形式は YYYYMMDD (区切り記号なし) です。例: 20260503\n\n暗号化前に、以下の文字列を結合してからハッシュ化し、大文字に変換してください。\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef\n","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice内部フィールド","group_type":"暗号化なし","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"発行連番","example":"402832","must_return":false,"note":"レシート発行時に生成されるシステム連番。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"2ss0150413110119XX","must_return":false,"note":"1. 旅行会社がレシート発行時に入力したカスタム番号。\n2. カスタム番号が複数存在する場合、対応するレシートデータが返却されます。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13743182","must_return":false,"note":"今回の検索対象レシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"レシート偽造防止ランダムコード","example":"14673793","must_return":false,"note":"レシート発行時に生成される8桁のレシート偽造防止ランダムコード。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(60)","label":"購入者名","example":"王大","must_return":false,"note":"レシート発行時の購入者名。個人名または法人名。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(10)","label":"購入者統一企業番号","example":"54352706","must_return":false,"note":"1. B2B レシートの場合、このフィールドは購入者の統一企業番号です。\n2. B2C レシートの場合、このフィールドは0です。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(200)","label":"購入者住所","example":"台北市南港区南港路二段97号8楼","must_return":false,"note":"レシート発行時の、そのレシートの購入者住所。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerPhone","required":"","type":"string(15)","label":"購入者携帯電話番号","example":"0922548754","must_return":false,"note":"レシート発行時の、そのレシートの購入者携帯電話番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"購入者メールアドレス","example":"abc@gmail.com","must_return":false,"note":"レシート発行時の、そのレシートの購入者メールアドレス。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"レシートタイプ","example":"B2B","must_return":false,"note":"レシートのタイプ。\nB2B=購入者が営利事業体 (法人番号あり)\nB2C=購入者が個人","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"レシート金額","example":"500","must_return":false,"note":"純粋な数字で、レシートの総額です。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"レシート発行時間","example":"2014-09-25 12:12:12","must_return":false,"note":"レシート発行時間。例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"レシートステータス","example":"1","must_return":false,"note":"レシートのステータス。\n0＝予約発行\n1＝発行済み\n2=予約発行キャンセル\n3＝無効化済み","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"退票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"車票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手續費\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"レシート発行時の商品情報 (JSON形式)。\nItemNum = 品番\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"ツアー名","example":"北海道5日間ツアー","must_return":false,"note":"レシートのツアー名","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"ツアー番号","example":"B284465","must_return":false,"note":"レシートのツアー番号","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"","type":"string(8)","label":"予定出発日","example":"2026-03-22","must_return":false,"note":"レシートの出発日。出発日当日に指定されたメールアドレスにリマインダーメールが送信されます。","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"申告済マーク","example":"0","must_return":false,"note":"0=未申告\n1=申告済み","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API連携IPではありません。"},{"code":"KEY10002","reason":"データ復号化エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行会社が電子レシート発行を申請・有効化していません。"},{"code":"KEY10007","reason":"30分以上ページに滞在しました。"},{"code":"KEY10009","reason":"旅行会社統一企業番号のデータが取得できません。"},{"code":"KEY10010","reason":"旅行会社統一企業番号が空白です。"},{"code":"KEY10011","reason":"PostData_フィールドが空白です。"},{"code":"KEY10012","reason":"データ伝送エラー"},{"code":"KEY10013","reason":"データが空白です。"},{"code":"KEY10014","reason":"TimeOut。通常、I/O上のタイムアウトを指します。"},{"code":"KEY10015","reason":"レシート金額の形式エラー"},{"code":"KEY10016","reason":"旅行会社が郵送印刷付加価値サービスを申請していません。"},{"code":"KEY1 。","enc_step2_title":"AES暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：提供されたHash KeyとHash IVを使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化されたバイナリデータ (Raw Data) をHex String (小文字) に変換します。これが暗号化文字列となります。","enc_sha_title":"SHA256 チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256ハッシュによりチェックサムを生成し、リクエストパラメータまたは返信値の完全性を検証するために使用できます。","enc_sha_step1_title":"パラメータの並べ替えと結合","enc_sha_step1_desc":"指定されたパラメータを英語名 (A-Z) で並べ替え、Query String (key1=val1&key2=val2...) として結合します。","enc_sha_step2_title":"IVとKeyの連結","enc_sha_step2_desc":"並べ替えられた文字列の前後に、それぞれHashIVとHashKeyを連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256暗号化と大文字への変換","enc_sha_step3_desc":"連結された文字列に対してSHA256暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"返信パラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータが定義されていません。","msg_code_unavailable":"// プログラム例はありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"変更日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API基本情報","field_def_title":"APIフィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"実行形態","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null可能","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"転送位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは店舗側で実行する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span>方式でパラメータをパッケージ化し、<span class=\\\"font-bold text-blue-700\\\">{location}<\/span>に配置して転送してください。","msg_req_format_qs":"このブロックのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号でクエリ文字列（Query String）形式で結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクト内に配置して転送する必要があります。","msg_req_format_other":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_req_security":"データセキュリティ：転送前に<span class=\\\"font-bold\\\">{group_type}<\/span>処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムによって非同期で、店舗指定の<span class=\\\"font-bold text-green-700\\\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムによって<span class=\\\"font-bold text-green-700\\\">{method}<\/span>方式で<span class=\\\"font-bold text-green-700\\\">{location}<\/span>に同期して返信されます。","msg_res_format_qs":"返信されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>記号でクエリ文字列（Query String）形式で結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>オブジェクト内に配置して転送されます。","msg_res_format_other":"返信されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>形式で結合されます。","msg_res_security":"復号化検証：受信後、特定のデータに対して<span class=\\\"font-bold\\\">{group_type}<\/span>処理が必要です。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"エンコードボタンを押すと、実際にエンコードされる完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_query-e-receipt-by-custom-id-api/fc_0.png"},"meta":{"title":"カスタム番号による電子レシート発行データAPI","subtitle":"カスタム番号を使用してレシート発行データを照会","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子レシート発行後、カスタムデータパラメータを使用して、その番号のレシートデータの照会とステータスを確認<\/span><\/p>"},{"id":"section-1","title":"データ交換方法","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式でレシートデータを電子レシートプラットフォームに送信して発行します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームは、フォーマットされた文字列を返信します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。漢字、英字、数字、記号はすべて1文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」で連結され、各フィールド内にこの記号（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"連携前作業","desc":"<p>（先に完了してください。完了しないと、プログラムは必ず失敗します。）<\/p><p><br><\/p><p>1. HashKey / HashIVの取得<\/p><p>- テスト環境：テストエリアバックエンドにログイン → 基本情報 → API連携設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリアバックエンドにログイン → 基本情報 → API連携設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーサービスセンター（FAX / Email）に送信<\/p><p>- 最大10個のIPアドレスを設定可能<\/p><p>- 提供が必要なもの：サーバーの対外IPアドレス（内部IPアドレスではなく、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。上线前に、連携URLを本番環境URLに切り替えることを確認してください。<\/p><p><br><\/p><p>4. よくある「前作業を忘れた」エラー信号<\/p><p>- `KEY10001 非旅行社 API 連携IP` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが正しくない、またはサンプル値のまま<\/p><p>- `KEY10009 旅行社統一編号のデータが取得できない` → MerchantIDが誤っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"カスタム番号によるレシートデータ照会呼び出しフローチャート"}]},"apis":[{"name":"カスタム番号による電子レシート発行データAPI","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編号","example":"54352706","must_return":false,"note":"旅行会社統一編号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索タイプ","example":"4","must_return":false,"note":"固定で4を使用","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256で暗号化。フィールド説明は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"2.0","must_return":false,"note":"固定で 2.0 を使用","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixエポック（グリニッジ標準時 1970年1月1日 00:00:00）から現在時刻までの秒数。PHPなどのプログラミング言語では、time()関数の戻り値として取得できます。\n例: 2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時刻を指定することを推奨します。\n注意: このタイムスタンプは、返信時にCheckCodeSearchを結合するために必要です。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceFrom","required":"","type":"int(1)","label":"レシートソース","example":"1","must_return":false,"note":"0＝API作成\n1＝公式サイト操作で作成","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"レシートステータス","example":"1","must_return":false,"note":"0＝予約発行\n1＝発行済み\n2＝予約発行キャンセル\n3＝無効化済み","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"割引ステータス","example":"1","must_return":false,"note":"0=発行済み、かつ割引なし\n1=発行済み、かつ割引あり\n[InvoiceStatus]パラメータの値が1の場合のみ、[AllowStatus]パラメータが検索条件として考慮されます。","enum_values":"0,1","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"レシートタイプ","example":"B2B","must_return":false,"note":"このレシートのタイプ。\nB2B=購入者が営利法人（統一編号あり）\nB2C=購入者が個人\n空値の場合はフィルタリングしない","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"特定の担当者が発行したレシートをフィルタリングできます。正確な照合のために、完全かつ正確な担当者名を入力してください。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"レシートカスタム番号","example":"O_32546666","must_return":false,"note":"旅行会社がレシート発行時に入力したカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"","type":"date","label":"検索開始日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD です。検索範囲の開始（レシート発行時間）例：2016-09-25\n2.レシート番号パラメータが指定されている場合、検索開始日と検索終了日は空白にしておくことを推奨します。検索時には検索期間は考慮されません。\n3.レシート番号パラメータが指定され、かつ検索開始日と検索終了日も入力されている場合、指定された期間内のデータのみが検索されます。\n4.検索開始日が入力されている場合、検索終了日は必須です。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"","type":"date","label":"検索終了日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD です。検索範囲の終了（レシート発行時間）例：2016-02-25\n2.検索日付範囲は最長90日です。システムは当日のカレンダー日を基準に日数を計算します。例：検索開始日が2025-09-01の場合、受け入れ可能な最長検索終了日は2025-11-29です。\n3.レシート番号パラメータが指定されている場合、検索開始日と検索終了日は空白にしておくことを推奨します。検索時には検索期間は考慮されません。\n4.レシート番号パラメータが指定され、かつ検索開始日と検索終了日も入力されている場合、指定された期間内のデータのみが検索されます。\n5.検索終了日が入力されている場合、検索開始日は必須です。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返信ステータス","example":"SUCCESS","must_return":true,"note":"1.検索成功の場合は SUCCESS を返信します。\n2.検索失敗の場合は、エラーコードを返信します。","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返信メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の返信ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社統一編号","example":"54352706","must_return":true,"note":"旅行会社統一編号。","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"返信レシートデータ","example":"","must_return":true,"note":"内容はJSON形式の文字列です。検索失敗の場合は、このフィールドは空値を返信します。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"チェックコード","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"今回のデータ返信の正当性を確認するためのものです。連携時にこのパラメータデータを比較して、プラットフォームからの返信であることを確認できます。確認方法については「SHA256暗号化説明」を参照してください。\n\nCheckCodeSearch = MerchantID, StartDate, EndDate, TimeStamp を SHA256 署名仕様に従って計算されたハッシュ値\n\n特別な注意事項：\n1. TimeStamp は今回の検索で送信されたタイムスタンプです。\n2. StartDate、EndDate は区切り記号を除去してから暗号化に渡してください。形式は YYYYMMDD (区切り記号除去) です。例：20260503\n\n暗号化前は、以下のような文字列に結合してからエンコードし、大文字に変換する必要があります。\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef\n","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoiceに含まれるフィールド","group_type":"暗号化なし","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"発行通し番号","example":"402832","must_return":false,"note":"レシート発行時に生成されたシステム通し番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"2ss0150413110119XX","must_return":false,"note":"1. 旅行会社がレシート発行時に入力したカスタム番号。\n2. カスタム番号が重複している場合、対応するレシートデータが複数返信されます。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13743182","must_return":false,"note":"今回の検索対象レシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"レシート偽造防止ランダム番号","example":"14673793","must_return":false,"note":"レシート発行時に生成される8桁のレシート偽造防止ランダム番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(60)","label":"購入者名","example":"王大","must_return":false,"note":"レシート発行時の購入者名。個人名または事業者名。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(10)","label":"購入者統一編号","example":"54352706","must_return":false,"note":"1. B2B レシートの場合、このフィールドは購入者の統一編号です。\n2. B2C レシートの場合、このフィールドは 0 です。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(200)","label":"購入者住所","example":"台北市南港区南港路二段97号8楼","must_return":false,"note":"レシート発行時の、当該レシートの購入者住所。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerPhone","required":"","type":"string(15)","label":"購入者携帯電話番号","example":"0922548754","must_return":false,"note":"レシート発行時の、当該レシートの購入者携帯電話番号。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"購入者Eメールアドレス","example":"abc@gmail.com","must_return":false,"note":"レシート発行時の、当該レシートの購入者Eメールアドレス。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"レシートタイプ","example":"B2B","must_return":false,"note":"レシートのレシートタイプ。\nB2B=購入者が営利法人（統一編号あり）\nB2C=購入者が個人","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"レシート金額","example":"500","must_return":false,"note":"純粋な数字で、レシートの合計金額です。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"レシート発行時間","example":"2014-09-25 12:12:12","must_return":false,"note":"レシート発行時間、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"レシートステータス","example":"1","must_return":false,"note":"レシートのレシートステータス。\n0＝予約発行\n1＝発行済み\n2=予約発行キャンセル\n3＝無効化済み","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"退票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"車票\",\"ItemCount\":\"1\",\"ItemWord\":\"張\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手續費\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"レシート発行時の商品情報（JSON形式）。\nItemNum = 品番\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"ツアー名","example":"北海道5日遊","must_return":false,"note":"レシートのツアー名","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"ツアー番号","example":"B284465","must_return":false,"note":"レシートのツアー番号","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"","type":"string(8)","label":"出発予定日","example":"2026-03-22","must_return":false,"note":"レシートの出発日。出発当日、指定されたメールアドレスにリマインダーメールが送信されます。","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"申告記号","example":"0","must_return":false,"note":"0=未申告\n1=申告済み","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API連携IPではありません。"},{"code":"KEY10002","reason":"データ復号化エラー。"},{"code":"KEY10003","reason":"バージョンエラー。"},{"code":"KEY10004","reason":"データが不完全です。"},{"code":"KEY10006","reason":"旅行会社が電子レシートを申請・有効化していません。"},{"code":"KEY10007","reason":"ページ滞留時間が30分を超えました。"},{"code":"KEY10009","reason":"旅行会社統一編号のデータが取得できません。"},{"code":"KEY10010","reason":"旅行会社統一編号が空白です。"},{"code":"KEY10011","reason":"PostData_フィールドが空白です。"},{"code":"KEY10012","reason":"データ転送エラー。"},{"code":"KEY10013","reason":"データが空白です。"},{"code":"KEY10014","reason":"TimeOut。通常、I/O上のタイムアウトを指します。"},{"code":"KEY10015","reason":"レシート金額の形式エラー。"},{"code":"KEY10016","reason":"旅行会社が郵便印刷付加価値サービスを申請していません。"},{"code":"KEY10017","reason":"郵便印刷付加価値サービスの利用 ta-parametrar för att fråga om information och status för kvittot med det numret<\/span><\/p>"},{"id":"section-1","title":"Datasbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittodata till den elektroniska kvittoplattformen för utfärdande med metoden \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Varje fälts beräkningsenhet är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Mellan varje fält används \"&amp;\" som skiljetecken, och varje fält får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedande åtgärder före anslutning","desc":"<p>(Slutför detta först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p>1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på bakgrunden för testmiljön → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på bakgrunden för produktionsmiljön → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlista<\/p><p>- Ansökningsfönster: Ladda ner ansökningsformuläret från den officiella webbplatsen och fyll i det, skicka sedan till kundtjänst (fax / e-post)<\/p><p>- Maximalt 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP-adress (inte intern IP-adress, kan kontrolleras via https://ifconfig.me)<\/p><p>- Effektiviseringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöadresser<\/p><p>-Testmiljö och produktionsmiljö är helt olika enheter, data är inte gemensamma. Kontrollera att anslutningsadressen har bytts till produktionsmiljöns adress innan lansering<\/p><p><br><\/p><p>4. Vanliga felmeddelanden för \"glömda förberedande åtgärder\"<\/p><p>- `KEY10001 Inte resebyråns API-anslutnings-IP` → IP-vitlistan har inte ställts in eller är felaktig<\/p><p>- `KEY10002 Data dekrypteringsfel` → HashKey / HashIV är felaktig eller är fortfarande exempelvärden<\/p><p>- `KEY10009 Kunde inte hämta resebyråns enhetliga organisationsnummer` → MerchantID är felaktig eller inte aktiverad<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för anrop av kvittoinformation med anpassat nummer"}]},"apis":[{"name":"API för att fråga om kvittoutfärgningsinformation med anpassat nummer","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"Sträng","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Söktyp","example":"4","must_return":false,"note":"Ställs alltid till 4","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Kombination av strängfält krypterad med AES256, fältbeskrivning enligt tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES Kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Anslutningsprogramversion","example":"2.0","must_return":false,"note":"Ställs alltid till 2.0","en
