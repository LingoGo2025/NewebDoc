                "desc": "<div class=\"mb-10\"><h3 class=\"text-xl font-bold text-slate-800 mb-4 flex items-center\"><span class=\"bg-slate-200 text-slate-600 px-2 py-1 rounded text-sm mr-2\">7.1</span> 帳號與權限管理</h3><div class=\"grid md:grid-cols-2 gap-6 mb-4\"><div><h4 class=\"font-bold text-slate-700 mb-2\">助理帳號設定</h4><p class=\"text-sm text-slate-600 mb-4\">系統支援新增多達 <strong>30 組助理帳號</strong>，方便大型旅行社分工（如會計、OP、業務分開操作）。</p><h4 class=\"font-bold text-slate-700 mb-2\">群組權限管理</h4><ul class=\"detail-list text-sm text-slate-600\"><li>自訂群組名稱（如：會計組、票務組）。</li><li>細部權限勾選：查詢、下載、新增（開立）、修改、作廢、折讓、基本資料設定。</li></ul></div><div><h4 class=\"font-bold text-slate-700 mb-2\">帳號狀態控制</h4><table class=\"w-full text-sm text-left text-slate-600 border\"><thead class=\"bg-slate-100 font-bold text-slate-700\"><tr><th class=\"p-2 border-b\">功能</th><th class=\"p-2 border-b\">說明</th></tr></thead><tbody><tr><td class=\"p-2 border-b\">停用/啟用</td><td class=\"p-2 border-b\">員工離職可立即停用，復職可重新啟用。</td></tr><tr><td class=\"p-2 border-b\">補發通知</td><td class=\"p-2 border-b\">若員工未收到開通 Email，可一鍵補發。</td></tr><tr><td class=\"p-2 border-b\">編輯/刪除</td><td class=\"p-2 border-b\">隨時調整所屬群組或移除帳號。</td></tr></tbody></table></div></div><div class=\"dual-img-grid\"><div><img src=\"pic/P18.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>1. 基本資料設定：</strong><ol class=\"caption-list\"><li>登入後請先確認公司基本資料。</li><li>地址請務必確認為「稅籍登記資料」之地址。</li><li>上傳公司 Logo (選填)。</li></ol></div></div><div><img src=\"pic/P19.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>2. 助理帳號設定：</strong><ol class=\"caption-list\"><li>點選「權限管理」>「群組設定」新增群組。</li><li>設定該群組之功能權限。</li><li>點選「帳號設定」新增助理帳號並歸屬群組。</li></ol></div></div></div></div><hr class=\"my-8 border-slate-200\"><div class=\"mb-10\"><h3 class=\"text-xl font-bold text-slate-800 mb-4 flex items-center\"><span class=\"bg-slate-200 text-slate-600 px-2 py-1 rounded text-sm mr-2\">7.2</span> 申購與庫存</h3><div class=\"grid md:grid-cols-2 gap-6 mb-4\"><div class=\"bg-slate-50 p-4 rounded-lg\"><h4 class=\"font-bold text-blue-600 mb-2\">線上申購流程</h4><ol class=\"list-decimal pl-5 text-sm text-slate-600 space-y-1\"><li>選擇「申購代轉收據」。</li><li>輸入份數（例如 3 份，每份1000張）。</li><li>系統自動計算總金額。</li><li>選擇付款方式：WebATM 或 ATM轉帳。</li><li>付款成功後，憑證由公會寄送。</li></ol></div><div class=\"bg-slate-50 p-4 rounded-lg\"><h4 class=\"font-bold text-blue-600 mb-2\">代轉號碼庫存特色</h4><ul class=\"detail-list text-sm text-slate-600 space-y-1\"><li><strong>無使用期限：</strong>購買的號碼永久有效。</li><li><strong>先進先出 (FIFO)：</strong>自動取用最早購買的號碼。</li><li><strong>跨年度查詢：</strong>可依年份查詢字軌使用狀況。</li></ul></div></div><div class=\"dual-img-grid\"><div><div class=\"space-y-4\"><img src=\"pic/P20.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><img src=\"pic/P21.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><img src=\"pic/P22.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"></div><div class=\"img-caption\"><strong>1. 申購流程：</strong><ol class=\"caption-list\"><li>點選「申購代轉收據」。</li><li>輸入份數。</li><li>選擇付款方式。</li><li>確認後付款。</li></ol></div></div><div><div class=\"space-y-4\"><img src=\"pic/P23.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><img src=\"pic/P24.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"></div><div class=\"img-caption\"><strong>2. 庫存查詢：</strong><ol class=\"caption-list\"><li>點選「代轉號碼庫存查詢」。</li><li>查詢各年度字軌。</li><li>顯示已用/剩餘。</li></ol></div></div></div></div><hr class=\"my-8 border-slate-200\"><div class=\"mb-10\"><h3 class=\"text-xl font-bold text-slate-800 mb-4 flex items-center\"><span class=\"bg-slate-200 text-slate-600 px-2 py-1 rounded text-sm mr-2\">7.3</span> 開立功能</h3><div class=\"grid md:grid-cols-2 gap-6 mb-4\"><div><h4 class=\"font-bold text-blue-600 mb-2\">單筆開立</h4><p class=\"text-sm text-slate-600 mb-2\">適合散客或筆數較少時使用。需輸入：</p><ul class=\"text-sm text-slate-600 grid grid-cols-2 gap-1\"><li>• 自訂編號</li><li>• 買受人名稱</li><li>• 買受人統編</li><li>• Email</li><li>• 品項明細</li></ul></div><div class=\"bg-yellow-50 p-4 rounded-lg\"><h4 class=\"font-bold text-blue-600 mb-2\">批次上傳規格 (重要)</h4><ul class=\"detail-list text-sm text-slate-700\"><li><strong>格式：</strong>.txt (Unicode編碼)</li><li><strong>檔名：</strong>英數字混合，不可中文。</li><li><strong>大小：</strong>限制 2MB</li><li><strong>防呆：</strong>系統會檢查自訂編號防重複。</li></ul></div></div><div class=\"dual-img-grid\"><div><img src=\"pic/P25.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>1. 單筆開立</strong></div></div><div><img src=\"pic/P26.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>2. 批次開立</strong></div></div></div></div><hr class=\"my-8 border-slate-200\"><div class=\"mb-10\"><h3 class=\"text-xl font-bold text-slate-800 mb-4 flex items-center\"><span class=\"bg-slate-200 text-slate-600 px-2 py-1 rounded text-sm mr-2\">7.4</span> 作廢與折讓</h3><div class=\"bg-red-50 text-red-700 p-3 rounded mb-4 text-sm border border-red-100\">依規範，作廢與折讓皆需經過<strong>「買受人同意」</strong>才算完成程序。</div><div class=\"grid md:grid-cols-2 gap-6 mb-4\"><div class=\"bg-white p-4 rounded-lg border-t-4 border-red-500 shadow-sm\"><h4 class=\"font-bold text-red-600 mb-2\">作廢流程</h4><ol class=\"list-decimal pl-5 text-sm text-slate-600 space-y-1\"><li>發起作廢並填寫原因。</li><li>勾選「需買受人確認」。</li><li>系統發送 Email。</li><li>消費者點擊「確認作廢」。</li></ol></div><div class=\"bg-white p-4 rounded-lg border-t-4 border-green-500 shadow-sm\"><h4 class=\"font-bold text-green-600 mb-2\">折讓流程 (部分退款)</h4><ol class=\"list-decimal pl-5 text-sm text-slate-600 space-y-1\"><li>點選「折讓」輸入金額。</li><li>系統發送 Email。</li><li>消費者點擊「同意」。</li><li>產生折讓證明單。</li></ol></div></div><div class=\"dual-img-grid\"><div><img src=\"pic/P28.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>1. 作廢流程</strong></div></div><div><img src=\"pic/P30.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><div class=\"img-caption\"><strong>2. 折讓流程</strong></div></div></div></div><hr class=\"my-8 border-slate-200\"><div><h3 class=\"text-xl font-bold text-slate-800 mb-4 flex items-center\"><span class=\"bg-slate-200 text-slate-600 px-2 py-1 rounded text-sm mr-2\">7.5</span> 修改與報表</h3><p class=\"text-sm text-slate-600 mb-4\">為符合稅務規範，收據內容修改有嚴格限制：</p><div class=\"grid grid-cols-3 gap-4 mb-6 text-center\"><div class=\"bg-slate-50 p-3 rounded\"><div class=\"font-bold text-slate-800\">期限限制</div><div class=\"text-xs text-slate-500 mt-1\">下個單月 1 號前</div></div><div class=\"bg-slate-50 p-3 rounded\"><div class=\"font-bold text-slate-800\">次數限制</div><div class=\"text-xs text-slate-500 mt-1\">僅限 1 次</div></div><div class=\"bg-slate-50 p-3 rounded\"><div class=\"font-bold text-slate-800\">列印限制</div><div class=\"text-xs text-slate-500 mt-1\">已列印則無法修改</div></div></div><p class=\"text-sm text-slate-600 mb-4\">可依條件篩選，支援<strong>下載 Excel/CSV</strong> 報表，方便對帳。</p><div class=\"dual-img-grid\"><div><div class=\"space-y-4\"><img src=\"pic/P32.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><img src=\"pic/P33.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"></div><div class=\"img-caption\"><strong>1. 查詢與報表</strong></div></div><div><div class=\"space-y-4\"><img src=\"pic/P34.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"><img src=\"pic/P35.png\" class=\"slide-img\" onclick=\"openLightbox(this.src)\"></div><div class=\"img-caption\"><strong>2. 修改限制</strong></div></div></div></div>"

                "desc": "<p class=\"mb-6 text-slate-600 leading-relaxed\">With the development of e-commerce, traditional paper operations have become a burden. Here are three major pain points:</p><div class=\"space-y-6\"><div class=\"flex items-start gap-4\"><div class=\"flex-shrink-0 mt-1 w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl\">💸</div><div><h4 class=\"text-lg font-bold text-slate-800\">High Hardware & Material Costs</h4><p class=\"text-slate-600 mt-1\">Dot matrix printer maintenance (~$13,000/unit) and ribbons (~$110/each). Plus, the high noise level is a disturbance.</p></div></div><div class=\"flex items-start gap-4\"><div class=\"flex-shrink-0 mt-1 w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xl\">📮</div><div><h4 class=\"text-lg font-bold text-slate-800\">Tedious Mailing & Time Costs</h4><p class=\"text-slate-600 mt-1\">Accumulated postage costs are high. Staff spend hours folding, searching, moving, and organizing.</p></div></div><div class=\"flex items-start gap-4\"><div class=\"flex-shrink-0 mt-1 w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xl\">📦</div><div><h4 class=\"text-lg font-bold text-slate-800\">Huge Space & Storage Pressure</h4><p class=\"text-slate-600 mt-1\">Regulations require storing vouchers for 7 years, necessitating warehouse rental. Blank receipt stock also takes up space.</p></div></div></div>"

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');
            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);
                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) { textNodes.push(node); }
                    }
                }
            }
            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            clearAllHighlights();
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            clearAllHighlights();
            var url = new URL(window.location);
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            renderAll();
            injectSearchNavigator();
            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) { highlightKeywordInElement(mainContent, keyword); }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) startIndex = searchMarks.indexOf(firstMarkInTarget);
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() { targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50'); }, 2000);
                }
            }, 300);
        };
    </script>

    <!-- 燈箱 DOM -->
    <div id="lightbox" onclick="closeLightbox()">
        <span id="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Full Screen Image" onclick="event.stopPropagation()">
    </div>

    <!-- Mobile Header -->
    <header class="lg:hidden bg-white shadow-sm p-4 sticky top-0 z-50 flex justify-between items-center border-b border-slate-200">
        <h1 class="text-lg font-bold text-blue-700 flex items-center">
            <i class="fas fa-book mr-2"></i> <span id="mobile-header-title"></span>
        </h1>
        <button id="menu-btn" class="text-slate-600 focus:outline-none hover:text-blue-600 transition" onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')">
            <i class="fas fa-bars text-2xl"></i>
        </button>
    </header>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-xl transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-40 border-r border-slate-200 flex flex-col">
            <div class="p-6 border-b border-slate-100 bg-gradient-to-r from-blue-50 to-white shrink-0">
                <h2 class="text-2xl font-bold text-blue-700" id="sidebar-brand-title" style="letter-spacing:-0.025em;"></h2>
                <p class="text-sm text-slate-500 mt-1 font-medium"><span id="sidebar-subtitle"></span><br><span class="text-xs text-slate-400" id="sidebar-version"></span></p>
            </div>
            
            <div class="flex-1 overflow-y-auto scrollable-area">
                <nav class="p-4 space-y-1">
                    <div id="dynamic-sidebar-links"></div>
                </nav>
            </div>
            
            <div class="p-4 border-t border-slate-200 bg-slate-50 shrink-0 flex flex-col gap-3">
                <div class="relative group w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><i class="fas fa-globe"></i></div>
                    <select id="lang-select" onchange="changeLang(this.value)" class="w-full appearance-none bg-white text-slate-600 font-medium py-2.5 pl-10 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer border border-slate-300 shadow-sm"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500"><i class="fas fa-chevron-up text-xs"></i></div>
                </div>
                <div class="text-center text-xs text-slate-500 mt-2">
                    <div id="meta-system-name" class="font-bold text-slate-600"></div>
                    <div id="meta-copyright" class="mt-1"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72 p-4 lg:p-8 min-w-0 w-full max-w-[1920px] mx-auto">
            <div id="dynamic-content-sections"></div>
        </main>
    </div>

</body>
