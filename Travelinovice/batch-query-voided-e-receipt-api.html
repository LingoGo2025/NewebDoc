26）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"批次查詢作廢單資料呼叫流程圖"}]},"apis":[{"name":"批次查詢電子收據作廢資料API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"搜尋種類","example":"3","must_return":false,"note":"固定帶3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"2.0","must_return":false,"note":"固定帶 2.0","enum_values":"2.0 ble":false},{"name":"CreateTime","required":"","type":"datetime","label":"作廢單建立日期","example":"2014-09-25 12:12:12","must_return":false,"note":"該張作廢單建立時間，例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"作廢單狀態","example":"1","must_return":false,"note":"該張作廢讓單之狀態。\n0=未確認作廢單\n1=已確認作廢單\n2=取消作廢單","enum_values":"0,1,2","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"KEY10020","reason":"SearchType_欄位空白"},{"code":"KEY10021","reason":"ReturnType_欄位空白"},{"code":"INV20014","reason":"統一編號格式有誤"},{"code":"INV70001","reason":"欄位資料格式錯誤"},{"code":"WEB1002","reason":"日期格式有誤"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"BS10001","reason":"查詢區間錯誤"},{"code":"BS10002","reason":"收據來源錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10003","reason":"收據狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10004","reason":"收據種類錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10005","reason":"取得查詢收據資料失敗（請多嘗試幾次，若一直出現此錯誤請聯繫客服）"},{"code":"BS10006","reason":"查無收據資料"},{"code":"BS10007","reason":"折讓狀態錯誤（請確認所帶入的收據來源參數）"},{"code":"BS10008","reason":"搜尋種類錯誤"},{"code":"BS10009","reason":"折讓單來源錯誤"},{"code":"BS10010","reason":"折讓單狀態錯誤"},{"code":"BS10011","reason":"作廢單來源錯誤"},{"code":"BS10012","reason":"作廢單狀態錯誤"},{"code":"BS10013","reason":"日期區間有誤（最多 roup_type}<\/span> processing must be completed before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system in an asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"This result will be synchronously returned by the system via the <span class=\\\"font-bold text-green-700\\\">{method}<\/span> method at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields are combined using the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verify Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be performed on specific data after receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After pressing the generate button, the actual string being hashed will be displayed here...","flowchart_0_url":"assets/flowcharts_batch-query-voided-e-receipt-api/fc_1.png"},"meta":{"title":"Batch Query Electronic Receipt Cancellation Data API","subtitle":"Batch Query Cancellation Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After an electronic receipt is issued, use the time interval and electronic receipt cancellation data parameters to query the cancellation data and status within the set period.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The travel agency sends receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field is calculated in characters. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are separated by \"&amp;\", and this character must not appear within any field (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Pre-Integration Operations","desc":"<p>(Please complete these first, otherwise the program will definitely fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download and fill out the application form from the official website, then send it to the Customer Service Center (Fax / Email)<\/p><p>- A maximum of 10 IP groups can be set<\/p><p>- Must provide: Server public IP (not intranet IP, can be queried at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different devices, data is not shared. Before going live, be sure to confirm that the integration URL has been switched to the production area URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Operations\" error signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Cannot retrieve travel agency Tax ID data` → MerchantID incorrect or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Batch Query Cancellation Data Call Flowchart"}]},"apis":[{"name":"Batch Query Electronic Receipt Cancellation Data API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Search Type","example":"3","must_return":false,"note":"Fixed value 3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String field combination followed by AES256 encryption, field explanations in the table below","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"2.0","must_return":false,"note":"Fixed value 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"TimeStamp","example":"1400137200","must_return":false,"note":"The number of seconds since the Unix Epoch (January 1, 1970 00:00:00 UTC) to the current time. In PHP, this is the value returned by calling the time() function.\nExample: For the time 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.\nNote: This timestamp must be preserved, as it is the value required for the TimeStamp field when composing CheckCodeSearch during the return.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidFrom","required":"","type":"int(1)","label":"Cancellation Source","example":"0","must_return":false,"note":"0=API creation\n1=Official website operation creation","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"Cancellation Status","example":"1","must_return":false,"note":"0=Unconfirmed cancellation\n1=Confirmed cancellation\n2=Cancelled unconfirmed cancellation","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Operator Name","example":"Ding Xiaoyu","must_return":false,"note":"Can filter cancellations created by a specific operator. For precise matching, the complete and correct operator name must be entered.","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"Query Start Date","example":"2016-09-25","must_return":false,"note":"1. Format is YYYY-MM-DD. Query range start (cancellation creation time) example: 2016-09-25\n2. If the receipt number parameter has been provided, it is recommended to leave the start and end dates blank; the query will ignore the range.\n3. If the receipt number parameter has been provided and the start/end dates are also filled, only data within the set time interval will be queried.\n4. If the query start date is filled, the query end date is mandatory.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"Query End Date","example":"2016-09-25","must_return":false,"note":"1. Format is YYYY-MM-DD. Query range end (cancellation creation time) example: 2016-02-25\n2. The maximum query date range is 90 days; the system will calculate based on current calendar days. Example: If the start date is 2025-09-01, the maximum accepted end date is 2025-11-29.\n3. If the receipt number parameter has been provided, it is recommended to leave the start and end dates blank; the query will ignore the range.\n4. If the receipt number parameter has been provided and the start/end dates are also filled, only data within the set time interval will be queried.\n5. If the query end date is filled, the query start date is mandatory.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Query successful, returns SUCCESS\n2. Query failed, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Cancellation data query successful","must_return":true,"note":"Text, description of the response status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":true,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"Checksum","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"Used to check the validity of this data return. During integration, you can compare this parameter to verify if it was returned by the platform. Please refer to \"SHA256 Encryption Description\" for verification methods.\n\nCheckCodeSearch = Hash value calculated using SHA256 signature specification on MerchantID, StartDate, EndDate, TimeStamp.\n\n\nSpecial Notes:\n1. TimeStamp is the timestamp sent for this query.\n2. StartDate and EndDate must have separators removed before encryption, format YYYYMMDD (e.g., 20260503).\n\nBefore encryption, it should be combined into a string like this before hashing and converting to uppercase:\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"Returned Receipt Data","example":"","must_return":true,"note":"Content is a JSON format string. This field returns null if the query fails.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within ReturnInvoice","group_type":"No Encryption","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvalidNo","required":"","type":"string(20)","label":"Cancellation Serial Number","example":"8293","must_return":false,"note":"System serial number generated when the cancellation is created.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671003","must_return":false,"note":"Receipt number associated with the cancellation.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"","type":"string(10)","label":"Cancellation Reason","example":"Order Cancelled","must_return":false,"note":"Reason for cancellation","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Cancellation Creation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"The creation time of this cancellation, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"Cancellation Status","example":"1","must_return":false,"note":"Status of this cancellation.\n0=Unconfirmed cancellation\n1=Confirmed cancellation\n2=Cancelled cancellation","enum_values":"0,1,2","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for electronic receipt enablement"},{"code":"KEY10007","reason":"Page stayed idle for more than 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is empty"},{"code":"KEY10011","reason":"PostData_ field is empty"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is empty"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for postal printing value-added service"},{"code":"KEY10017","reason":"Postal printing value-added service usage insufficient"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency rights suspended"},{"code":"KEY10020","reason":"SearchType_ field is empty"},{"code":"KEY10021","reason":"ReturnType_ field is empty"},{"code":"INV20014","reason":"Tax ID format error"},{"code":"INV70001","reason":"Field data format error"},{"code":"WEB1002","reason":"Date format error"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"BS10001","reason":"Query range error"},{"code":"BS10002","reason":"Receipt source error (please check the receipt source parameter provided)"},{"code":"BS10003","reason":"Receipt status error (please check the receipt source parameter provided)"},{"code":"BS10004","reason":"Receipt type error (please check the receipt source parameter provided)"},{"code":"BS10005","reason":"Failed to retrieve receipt data (please try again; if this error persists, contact customer service)"},{"code":"BS10006","reason":"No receipt data found"},{"code":"BS10007","reason":"Allowance status error (please check the receipt source parameter provided)"},{"code":"BS10008","reason":"Search type error"},{"code":"BS10009","reason":"Allowance source error"},{"code":"BS10010","reason":"Allowance status error"},{"code":"BS10011","reason":"Cancellation source error"},{"code":"BS10012","reason":"Cancellation status error"},{"code":"BS10013","reason":"Date range error (maximum 90 days of data can be queried)"},{"code":"BS10014","reason":"Date range error (start date cannot be later than end date)"}],"versions":[]},

p;<\/span> 記号でクエリ文字列 (Query String) 形式に結合する必要があります。例： <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信してください。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了させる必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、商店指定の <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLへプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期返却されます。","msg_res_format_qs":"返却フィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に結合されます。例： <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却フィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して返却されます。","msg_res_format_other":"返却フィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"圧縮ボタンを押すと、実際に暗号化された完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_batch-query-voided-e-receipt-api/fc_2.png"},"meta":{"title":"電子領収書無効化データ一括照会API","subtitle":"無効化データ一括照会","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子領収書発行後、期間および電子領収書の無効化データパラメータを使用して、設定期間内の無効化データ照会およびステータス確認を行います。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマット化された文字列を応答します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。中・英・数字・記号はすべて1文字とカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にはこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"接続前準備","desc":"<p>（必ず完了してください。完了しない場合、プログラムは失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし記入後、カスタマーセンターへ送信（FAX / Email）<\/p><p>- 最大10グループのIP設定が可能<\/p><p>- 必要事項：サーバーの外部IP（内部IPは不可、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1-2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は全く異なる設備であり、データは共有されません。リリース前に必ず接続URLが本番環境用であることを確認してください。<\/p><p><br><\/p><p>4. 「事前準備忘れ」によるよくあるエラー信号<\/p><p>- `KEY10001 旅行会社のAPI接続IPではありません` → IPホワイトリスト未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が正しくない、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社の統一編号データが取得できません` → MerchantID の誤りまたは未有効化<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"無効化データ一括照会コールフローチャート"}]},"apis":[{"name":"電子領収書無効化データ一括照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編号","example":"54352706","must_return":false,"note":"旅行会社統一編号。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索種類","example":"3","must_return":false,"note":"固定で3を入力","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後にAES256で暗号化。詳細は下表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"2.0","must_return":false,"note":"固定で 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixエポック（グリニッジ標準時 1970年1月1日 00:00:00）からの秒数。PHPの例ではtime()関数が返す値。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200。現在の時間を入力することを推奨。\n注意：このタイムスタンプは保持し、返却時にCheckCodeSearchを生成する際に必要なTimeStampとして使用されます","enum_values":"","default_value":"","nullable":false},{"name":"InvalidFrom","required":"","type":"int(1)","label":"無効化データソース","example":"0","must_return":false,"note":"0＝API作成\n1＝公式サイト操作作成","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"無効化データステータス","example":"1","must_return":false,"note":"0＝未確認の無効化データ\n1＝確認済みの無効化データ\n2＝取り消された未確認無効化データ","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者名","example":"丁小雨","must_return":false,"note":"特定の担当者が発行した無効化データをフィルタリング可能。正確な照合のため、完全で正確な担当者名を入力する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"検索開始日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。照会期間の開始（無効化データの作成時間）。例：2016-09-25\n2.領収書番号パラメータを入力済の場合、開始日と終了日は空欄にすることを推奨します。その場合、期間によるフィルタリングは行われません。\n3.領収書番号を入力し、かつ開始日と終了日も入力した場合、設定期間内のデータのみが照会されます。\n4.検索開始日を入力した場合、検索終了日は必須です。","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"検索終了日","example":"2016-09-25","must_return":false,"note":"1.形式は YYYY-MM-DD。照会期間の終了（無効化データの作成時間）。例：2016-02-25\n2.検索期間は最長90日。システムは現在の日付から計算します。例：開始日が2025-09-01の場合、指定可能な最大終了日は2025-11-29です。\n3.領収書番号パラメータを入力済の場合、開始日と終了日は空欄にすることを推奨します。その場合、期間によるフィルタリングは行われません。\n4.領収書番号を入力し、かつ開始日と終了日も入力した場合、設定期間内のデータのみが照会されます。\n5.検索終了日を入力した場合、検索開始日は必須です。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1.照会成功時は SUCCESS\n2.照会失敗時はエラーコード","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"無効化データの照会成功","must_return":true,"note":"テキスト、今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社統一編号","example":"54352706","must_return":true,"note":"旅行会社統一編号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"チェックサム","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"今回のデータ返却の正当性をチェックするために使用。接続時にこのパラメータを比較して、プラットフォームからの返却かどうかを検証してください。検証方法は「SHA256暗号化説明」を参照してください。\n\nCheckCodeSearch = MerchantID,StartDate,EndDate,TimeStamp を SHA256署名仕様に基づいて算出したハッシュ値\n\n\n特別注意事項：\n1.TimeStamp は今回の照会送信時に使用したタイムスタンプ。\n2.StartDate、EndDate は区切り文字を除去して暗号化に入力すること。形式は YYYYMMDD（区切りなし）、例：20260503\n\n暗号化前に以下の文字列を結合してから、ハッシュ化を行い大文字に変換する\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmnopqrstuvwxyzabcdef","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"返却された領収書データ","example":"","must_return":true,"note":"内容はJSON形式の文字列。照会失敗時は空値","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoiceに含まれるフィールド","group_type":"暗号化なし","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvalidNo","required":"","type":"string(20)","label":"無効化データシリアル番号","example":"8293","must_return":false,"note":"無効化データ発行時に生成されるシステムシリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671003","must_return":false,"note":"無効化データが属する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"","type":"string(10)","label":"無効化理由","example":"注文キャンセル","must_return":false,"note":"無効化理由","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"無効化データ作成日","example":"2014-09-25 12:12:12","must_return":false,"note":"該当無効化データの作成時間。例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"無効化データステータス","example":"1","must_return":false,"note":"該当無効化データのステータス。\n0=未確認の無効化データ\n1=確認済みの無効化データ\n2=無効化を取り消し","enum_values":"0,1,2","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社のAPI接続IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データが不完全です"},{"code":"KEY10006","reason":"旅行会社が電子領収書サービスを有効化していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えました"},{"code":"KEY10009","reason":"旅行会社統一編号のデータが取得できません"},{"code":"KEY10010","reason":"旅行会社統一編号が空欄です"},{"code":"KEY10011","reason":"PostData_フィールドが空欄です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空欄です"},{"code":"KEY10014","reason":"TimeOut。通常は I/O タイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行会社が郵送印刷付加サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷付加サービスの利用可能数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未入力です"},{"code":"KEY10019","reason":"旅行会社が停止措置を受けています"},{"code":"KEY10020","reason":"SearchType_フィールドが空欄です"},{"code":"KEY10021","reason":"ReturnType_フィールドが空欄です"},{"code":"INV20014","reason":"統一編号の形式が誤っています"},{"code":"INV70001","reason":"フィールドデータの形式エラー"},{"code":"WEB1002","reason":"日付形式エラー"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"BS10001","reason":"検索期間エラー"},{"code":"BS10002","reason":"領収書ソースエラー（入力したソースパラメータを確認してください）"},{"code":"BS10003","reason":"領収書ステータスエラー（入力したソースパラメータを確認してください）"},{"code":"BS10004","reason":"領収書種類エラー（入力したソースパラメータを確認してください）"},{"code":"BS10005","reason":"領収書データ取得失敗（何度か試行してください。エラーが続く場合はサポートにお問い合わせください）"},{"code":"BS10006","reason":"該当する領収書データなし"},{"code":"BS10007","reason":"折戻しステータスエラー（入力したソースパラメータを確認してください）"},{"code":"BS10008","reason":"検索種類エラー"},{"code":"BS10009","reason":"折戻し伝票ソースエラー"},{"code":"BS10010","reason":"折戻し伝票ステータスエラー"},{"code":"BS10011","reason":"無効化伝票ソースエラー"},{"code":"BS10012","reason":"無効化伝票ステータスエラー"},{"code":"BS10013","reason":"日付期間エラー（最長90日分のデータ照会が可能）"},{"code":"BS10014","reason":"日付期間エラー（開始日は終了日より大きくすることはできません）"}],"versions":[]},

s":"이 영역의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 구분된 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 포함하여 전송해야 합니다.","msg_req_format_other":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템에서 비동기 방식으로 가맹점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 능동적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템에서 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 구분된 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 포함되어 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 여기에 실제 암호화되는 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_batch-query-voided-e-receipt-api/fc_3.png"},"meta":{"title":"전자 영수증 취소 데이터 일괄 조회 API","subtitle":"취소 데이터 일괄 조회","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">전자 영수증 발행 후, 시간 범위와 전자 영수증 취소 데이터 파라미터를 통해 설정된 기간 내의 취소 데이터 조회 및 상태를 확인할 수 있습니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 포맷팅된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 간주합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드는 '&' 기호로 연결하며, 필드 내용 내에 해당 문자(U+0026)가 포함되어서는 안 됩니다.<\/span><\/p>"},{"id":"section-2","title":"연동 사전 작업","desc":"<p>(반드시 먼저 완료해주십시오. 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청 양식을 다운로드 및 작성 후 고객센터(팩스/이메일)로 전송<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필수 제출: 서버 대외 IP (내부 IP 불가, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1~2 영업일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 분리된 장비이며 데이터가 공유되지 않습니다. 배포 전 연동 URL이 운영 환경 URL로 설정되어 있는지 반드시 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 누락' 오류 메시지<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못된 설정<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 올바르지 않거나 예제값 상태<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터 없음` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"취소 내역 일괄 조회 호출 흐름도"}]},"apis":[{"name":"전자 영수증 취소 데이터 일괄 조회 API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"검색 종류","example":"3","must_return":false,"note":"3으로 고정","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"2.0","must_return":false,"note":"2.0으로 고정","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 시대(그리니치 표준시 1970년 1월 1일 00:00:00)부터 현재까지의 초 단위 시간. PHP 프로그래밍 언어 기준, time() 함수 반환값.\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200, 현재 시간을 입력하는 것을 권장함\n주의: 이 타임스탬프는 반환 시 CheckCodeSearch를 조합할 때 필요하므로 반드시 보관해야 함","enum_values":"","default_value":"","nullable":false},{"name":"InvalidFrom","required":"","type":"int(1)","label":"취소 내역 출처","example":"0","must_return":false,"note":"0＝API 생성\n1＝공식 홈페이지 작업 생성","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"취소 내역 상태","example":"1","must_return":false,"note":"0＝미확인 취소 내역\n1＝확인된 취소 내역\n2=취소된 미확인 취소 내역","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"담당자 이름","example":"丁小雨","must_return":false,"note":"특정 담당자가 발행한 취소 내역 필터링 가능. 정확한 매칭을 위해 담당자 이름을 완전하게 입력해야 함.","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"date","label":"조회 시작일","example":"2016-09-25","must_return":false,"note":"1. 형식: YYYY-MM-DD. 조회 기간 시작 (취소 내역 생성 시간), 예: 2016-09-25\n2. 영수증 번호 파라미터를 이미 입력한 경우, 조회 시작일과 종료일은 공란으로 두는 것을 권장하며 조회 시 기간은 고려되지 않음.\n3. 영수증 번호를 입력함과 동시에 조회 시작일과 종료일을 입력하면, 해당 기간 내의 데이터만 조회됨.\n4. 조회 시작일을 입력한 경우, 조회 종료일은 필수임.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"date","label":"조회 종료일","example":"2016-09-25","must_return":false,"note":"1. 형식: YYYY-MM-DD. 조회 기간 종료 (취소 내역 생성 시간), 예: 2016-02-25\n2. 최대 조회 가능 기간은 90일이며 시스템이 현재 달력을 기준으로 계산함. 예: 시작일이 2025-09-01인 경우, 최대 조회 가능한 종료일은 2025-11-29\n3. 영수증 번호 파라미터를 이미 입력한 경우, 조회 시작일과 종료일은 공란으로 두는 것을 권장하며 조회 시 기간은 고려되지 않음.\n4. 영수증 번호를 입력함과 동시에 조회 시작일과 종료일을 입력하면, 해당 기간 내의 데이터만 조회됨.\n5. 조회 종료일을 입력한 경우, 조회 시작일은 필수임.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 조회 성공 시 SUCCESS 반환\n2. 조회 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"취소 데이터 조회 성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":true,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"체크섬(Checksum)","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"데이터 반환의 적법성을 확인하는 데 사용. 연동 시 이 파라미터 데이터를 플랫폼 반환값과 비교하여 검증할 수 있으며, 검증 방법은 'SHA256 암호화 설명'을 참조.\n\nCheckCodeSearch = MerchantID, StartDate, EndDate, TimeStamp를 SHA256 서명 규격에 따라 계산한 해시값\n\n\n특별 주의사항:\n1. TimeStamp는 이번 조회 시 전송한 타임스탬프.\n2. StartDate, EndDate는 구분자를 제거하고 암호화해야 함. 형식은 YYYYMMDD (예: 20260503)\n\n암호화 전 아래와 같이 문자열을 조합한 후 압축하고 대문자로 변환해야 함\nHashIV=1234567890123456&EndDate=20200515&MerchantID=70565326&StartDate=20200511&TimeStamp=1588320000&HashKey=abcdefghijklmn metod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvitto-data via \"HTTP POST\" till den elektroniska kvitto-plattformen för utfärdande. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvitto-plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&amp;\" används som separator mellan fält, och detta tecken får inte förekomma i fältinnehållet (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelser","desc":"<p>(Vänligen slutför detta, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in i test-backoffice → Grundläggande information → API-integreringsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktions-backoffice → Grundläggande information → API-integreringsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningsväg: Ladda ner formuläret från den officiella webbplatsen, fyll i det och skicka till kundtjänst (Fax / E-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Obligatoriskt: Serverns externa IP (ej internt nätverk, kan sökas via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljö och produktionsmiljö är helt olika enheter, data delas inte. Se till att ändra till produktions-URL innan driftsättning.<\/p><p><br><\/p><p>4. Vanliga felorsaker på grund av \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en IP för resebyråns API-integrering` → IP-vitlistan är inte inställd eller felaktig<\/p><p>- `KEY10002 Fel vid datadekryptering` → HashKey / HashIV är felaktiga eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är fel eller inte aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för anrop om ogiltigförklarade batchkvitton"}]},"apis":[{"name":"API för batchfrågor om ogiltigförklarade elektroniska kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Söktyp","example":"3","must_return":false,"note":"Sätt alltid till 3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Kombinera fältsträngar och utför AES256-kryptering. Se tabellen nedan för fältbeskrivning.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-version","example":"2.0","must_return":false,"note":"Sätt alltid till 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Antal sekunder sedan Unix-epoken (1970-01-01 00:00:00 UTC) till aktuell tid. Om du använder PHP, är detta         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

        function renderEncryptionRules() {

            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }

                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden');

        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden');

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
