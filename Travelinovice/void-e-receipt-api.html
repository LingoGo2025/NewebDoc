an><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"作廢收據規範","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">收據於開立折讓並經確認後，『不』可執行作廢。<\/span><\/p><p>2.預約收據無法作廢，只能發動取消<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">作廢收據後，屆當期上傳排程日(每單月一日)，平台將會把作廢資料上傳至 「財政部電子發票整合服務平台」。<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">收據跨期別後，『不』可執行作廢。（每兩個月為一期別：【1-2】月為一個期別，【3-4】月為一個期別）<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">例如： <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) 【1-2】月此期別開出的收據，需於 3/14(含)前進行作廢，3/15 後將無法 進行作廢。<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) 【3-4】月此期別開出的收據，需於 5/14(含)前進行作廢，5/15 後將無法 進行作廢。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>作廢單：每一次作廢收據，都會有一筆獨立的作廢記錄，稱之為作廢單或是作廢資料<\/p><p>等待作廢：等待消費者同意作廢前，收據仍是有效狀態，此時的作廢單稱為等待作廢<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"收據立即作廢流程"}]},"apis":[{"name":"作廢電子收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","fie 複信箱，平台會進行過濾避免重複發送。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.作廢單開立成功，則回傳 SUCCESS\n2.作廢單開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"作廢單流水號","example":"193060","must_return":false,"note":"此次開立作廢或等待作廢的流水號","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次作廢收據或等待作廢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"作廢收據時間","example":"2015-07-16 17:00:33","must_return":false,"note":"此次作廢收據的時間，例：2015-07-16 17:00:33。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo、RandomNum、TotalAmt、MerchantOrderNo不含在此API回應欄位中，需程式自行保存開立收據時回傳的InvoiceTransNo、RandomNum、TotalAmt、MerchantOrderNo，供日後 CheckCode 驗證使用。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"INV10015","reason":"欄位資料長度有誤"},{"code":"LIB10001","reason":"該收據非開立成功的收據"},{"code":"LIB10002","reason":"經辦名稱未填寫"},{"code":"LIB10004","reason":"確認作廢方式有誤"},{"code":"LIB10005","reason":"收據已作廢過"},{"code":"LIB10006","reason":"觸發作廢狀態有誤"},{"code":"LIB10007","reason":"該張收據已執行過收據折讓，無法作廢"},{"code":"LIB10008","reason":"超過可作廢期限"},{"code":"LIB10009","reason":"無此作廢資料"},{"code":"LIB10010","reason":"該作廢資料已被取消作廢"},{"code":"LIB10011","reason":"該作廢資料狀態為作廢失敗，不可再作廢"}],"versions":[]},

ormat","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Description","th_required":"Required","th_must_return":"Required Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rules","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the provided Hash Key and Hash IV to encrypt or decrypt data via the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters according to the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hex<\/span><br>Key / IV: Please use the merchant's specific Hash Key and Hash IV.","enc_step3_title":"Convert to Hex","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase) to get the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum via SHA256 hash to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Sort and Combine Parameters","enc_sha_step1_desc":"Sort the specified parameters by name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Prepend/Append IV and Key","enc_sha_step2_desc":"Prepend HashIV and append HashKey to the sorted string.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error Code Table","err_search_ph":" sync":"The result will be returned synchronously by the system via <span class=\"font-bold text-green-700\">{method}<\/span> at <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"Returned fields will be combined as a Query String using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be transmitted within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification/Decryption: Specific data must be processed with <span class=\"font-bold\">{group_type}<\/span> upon receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After pressing the encrypt button, the actual string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_void-e-receipt-api/fc_1.png"},"meta":{"title":"Void Electronic Receipt API","subtitle":"Void Issued Electronic Receipt","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact customer support to apply for IP settings. You can set up to 10 IP addresses.<\/span><\/p><p>2. Electronic receipts with an 'Issued' status can be voided.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The travel agency sends receipt data to the electronic receipt platform via 'HTTP POST' for issuance. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field calculation unit is a character. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by '&amp;'. This character (U+0026) must not appear within the fields.<\/span><\/p>"},{"id":"section-2","title":"Void Receipt Regulations","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">Receipts cannot be voided once an allowance has been issued and confirmed.<\/span><\/p><p>2. Pre-ordered receipts cannot be voided; they can only be cancelled.<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">After voiding a receipt, the platform will upload the voided data to the 'Ministry of Finance Electronic Invoice Integration Service Platform' on the scheduled upload day (the 1st of every odd month).<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">Receipts cannot be voided across different periods. (Each period lasts two months: [Jan-Feb] is one period, [Mar-Apr] is another.)<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">e.g.: <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) Receipts issued in the [Jan-Feb] period must be voided by 3/14 (inclusive); they cannot be voided after 3/15.<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) Receipts issued in the [Mar-Apr] period must be voided by 5/14 (inclusive); they cannot be voided after 5/15.<\/span><\/p>"},{"id":"section-3","title":"Term Definitions","desc":"<p>Void Document: Each time a receipt is voided, an independent record is created, called a void document or void data.<\/p><p>Waiting to Void: Before the consumer agrees to the void, the receipt is still valid. The void document at this stage is called 'Waiting to Void'.<\/p>"},{"id":"section-4","title":"Pre-integration Steps","desc":"<p>(Please complete these, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Data → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Data → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Channel: Download the form from the official website, fill it out, and send it to customer support (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server external IP (non-internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- Test and production environments use different equipment. Data is not shared. Please ensure you switch to the production URL before going live.<\/p><p><br><\/p><p>4. Common 'Forgotten Pre-integration' Error Signals<\/p><p>- `KEY10001 Not a registered travel agency API IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still set to sample values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID incorrect or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Immediate Receipt Voiding Process"}]},"apis":[{"name":"Void Electronic Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel Agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String fields are combined and encrypted via AES256. See field description below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields in PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration API Version","example":"1.0","must_return":false,"note":"Fixed as 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds elapsed since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"The receipt number to be voided.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"V","type":"string(10)","label":"Reason for Voiding","example":"Consumer cancelled order","must_return":false,"note":"Reason for voiding","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Operator Name","example":"Sales Window 001","must_return":false,"note":"Name of the person voiding the receipt. For record purposes only, not checked by the system. If left blank, the void cannot be performed and the system will return an error code.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Confirmation Method","example":"1","must_return":false,"note":"0=Wait to void (For cancellation or trigger methods, please refer to 'Manage Waiting to Void Receipt API' documentation)\n1=Immediate void","enum_values":"0,1","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Void Notification Email","example":"abc@gmail.com","must_return":false,"note":"1. Void notification email, the platform defaults to sending it to the buyer.\n2. If multiple buyer emails are needed, please separate them with commas.\n3. This field adds more recipients. If duplicate emails are provided, the platform will filter them to avoid duplicate sending.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If void document is successfully created, returns SUCCESS\n2. If void document creation fails, returns an error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text, description of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel Agency Tax ID","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Void Serial Number","example":"193060","must_return":false,"note":"The serial number of the created void or 'waiting to void' record","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number being voided or waiting to be voided.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Void Time","example":"2015-07-16 17:00:33","must_return":false,"note":"The time the receipt was voided, e.g.: 2015-07-16 17:00:33.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify the legitimacy of this data return. During integration, you can compare this parameter to verify if the data was returned by the platform. For verification methods, please refer to 'SHA256 Encryption Description'. If creation fails, an empty value is returned.\n\nCheckCode = Hash value calculated by signing InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 specs.\n\nInvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo are not included in this API response. Programs must save InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo returned during original receipt creation for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must judge EndStr=## to ensure data completion.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a registered travel agency API IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for Electronic Receipt enabling"},{"code":"KEY10007","reason":"Page idle for over 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection abnormal"},{"code":"INV10015","reason":"Field data length incorrect"},{"code":"LIB10001","reason":"The receipt was not successfully issued"},{"code":"LIB10002","reason":"Operator name not entered"},{"code":"LIB10004","reason":"Incorrect void confirmation method"},{"code":"LIB10005","reason":"Receipt has already been voided"},{"code":"LIB10006","reason":"Incorrect void trigger status"},{"code":"LIB10007","reason":"Receipt has been processed for allowance and cannot be voided"},{"code":"LIB10008","reason":"Void deadline exceeded"},{"code":"LIB10009","reason":"No such void record"},{"code":"LIB10010","reason":"The void record has been cancelled"},{"code":"LIB10011","reason":"Void status is 'Void Failed', cannot be voided again"}],"versions":[]},

yan-700\\\">&amp;<\/span> 記号でQuery String形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内で送信する必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムより非同期で、商店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLへプッシュ通知されます。","msg_res_info_sync":"この結果はシステムより <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期返信されます。","msg_res_format_qs":"返信されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でQuery String形式に結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内で送信されます。","msg_res_format_other":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号化：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行ってください。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"チェックサムボタンを押すと、実際に暗号化された完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_void-e-receipt-api/fc_2.png"},"meta":{"title":"電子領収書無効化API","subtitle":"発行済み電子領収書の無効化","version":"","sections":[{"id":"section-0","title":"接続の目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.接続前にカスタマーセンターへ連絡し、IP設定を申請してください。設定可能なIP数は10件です。<\/span><\/p><p>2.発行済みの電子領収書を無効化できます。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームへ送信し、発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。全角、半角、数字、記号すべてを1文字とカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を区切り文字とし、各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"領収書無効化の規定","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">領収書が割引発行され確認された後、『無効化』は実行できません。<\/span><\/p><p>2.予約領収書は無効化できず、キャンセル操作のみ可能です。<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">領収書を無効化した後、当期のアップロード予定日（隔月1日）に、プラットフォームが無効化データを「財務部電子統一発票統合サービスプラットフォーム」へアップロードします。<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">領収書が期別をまたいだ場合、『無効化』は実行できません。（2ヶ月で1期：【1-2】月が1期、【3-4】月が1期）<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">例： <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) 【1-2】月に発行された領収書は、3/14(当日含む)までに無効化する必要があり、3/15以降は無効化できません。<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) 【3-4】月に発行された領収書は、5/14(当日含む)までに無効化する必要があり、5/15以降は無効化できません。<\/span><\/p>"},{"id":"section-3","title":"用語定義","desc":"<p>無効化伝票：領収書を無効化するたびに、独立した無効化記録が生成されます。これを無効化伝票または無効化データと呼びます。<\/p><p>無効化待ち：消費者の無効化同意を待つ間、領収書は有効状態です。この時の無効化伝票を無効化待ちと呼びます。<\/p>"},{"id":"section-4","title":"接続前の準備","desc":"<p>（必ず完了させてください。そうでない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後にカスタマーセンターへ送信（FAX / Email）<\/p><p>- 最大10件のIPを設定可能<\/p><p>- 提供が必要：サーバーの外部IP（内部IPは不可。https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。リリース前に接続先URLが必ず本番環境のものになっていることを確認してください。<\/p><p><br><\/p><p>4. よくある「前準備忘れ」のエラー信号<\/p><p>- `KEY10001 旅行会社のAPI接続IPではありません` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIV が不正確またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社の統一編番号データが取得できません` → MerchantID が誤っているか無効<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書の即時無効化フロー"}]},"apis":[{"name":"電子領収書無効化API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社の統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合後、AES256で暗号化。フィールド説明は下表を参照。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内のフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"1.0で固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数\n例：2014-05-15 15:00:00 の場合、タイムスタンプは 1400137200。現在時刻の入力推奨。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671009","must_return":false,"note":"無効化する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"V","type":"string(10)","label":"無効化理由","example":"消費者による注文キャンセル","must_return":false,"note":"無効化理由","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"担当者名","example":"営業担当001","must_return":false,"note":"無効化領収書を発行した担当者名。記録用であり、システムによるチェックは行われません。未入力の場合、発行に失敗しエラーコードが返されます。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"無効化方式確認","example":"1","must_return":false,"note":"0=無効化待ち（キャンセルやトリガーについては「無効化待ち領収書管理API」の説明を参照）\n1=即時無効化","enum_values":"0,1","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"無効化通知用メールアドレス","example":"abc@gmail.com","must_return":false,"note":"1.無効化通知はプラットフォームがデフォルトで買受人へ送信します。\n2.複数の買受人に送信する場合、カンマで区切ってください。\n3.このフィールドは追加の宛先用です。重複アドレスが入力された場合、プラットフォームは二重送信を防ぐためフィルタリングを行います。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム返信メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返信状態","example":"SUCCESS","must_return":true,"note":"1.無効化伝票の発行に成功した場合、SUCCESSを返信\n2.無効化伝票の発行に失敗した場合、エラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返信メッセージ","example":"成功","must_return":true,"note":"今回の返信状態に関する説明テキスト","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"54352706","must_return":false,"note":"旅行会社統一編番号","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"無効化伝票連番","example":"193060","must_return":false,"note":"今回の無効化または無効化待ちの連番","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回の無効化または無効化待ちの領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"領収書無効化時間","example":"2015-07-16 17:00:33","must_return":false,"note":"今回の領収書無効化時間。例：2015-07-16 17:00:33","enum_values":"","default_value":"","nullable":false},{"name":"Chec 2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체에 할당된 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 이진 데이터(Raw Data)를 Hex String(소문자)으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 검증 코드 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 검증 코드를 생성하며, 요청 파라미터나 반환 값의 무결성을 검증하는 데 사용됩니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름순(A-Z)으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열의 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"에러 코드표","err_search_ph":"코드 검색...","th_err_code":"에러 코드","th_err_reason":"에러 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 프로그램 예제 없음","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"흐름도","lbl_launch_type":"실행 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전송 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 가맹점 측에서 실행해야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식을 사용하여 파라미터를 패키징한 후 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>을 통해 전송하십시오.","msg_req_format_qs":"이 영역의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 Query String 형식을 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"이 영역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템이 비동기 방식으로 가맹점에서 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 주소로 능동적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템이 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환합니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 Query String 형식을 조합합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합합니다.","msg_res_security":"검증 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 여기에 실제 암호화되는 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_void-e-receipt-api/fc_3.png"},"meta":{"title":"전자 영수증 무효화 API","subtitle":"기발행된 전자 영수증 무효화","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 총 10개입니다.<\/span><\/p><p>2. 발행 완료 상태의 전자 영수증을 무효화할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식을 사용하여 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded 입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8 입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 포맷된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 각 필드 내부에는 이 문자가 포함될 수 없습니다 (U+0026).<\/span><\/p>"},{"id":"section-2","title":"영수증 무효화 규정","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">영수증에 대해 에누리(할인)가 발행되고 확인된 경우, 무효화를 수행할 수 '없습니다'.<\/span><\/p><p>2. 예약 영수증은 무효화할 수 없으며, 취소만 가능합니다.<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">영수증 무효화 후, 해당 기수 업로드 일정일(매 홀수 월 1일)에 플랫폼은 무효화 데이터를 '재정부 전자 세금계산서 통합 서비스 플랫폼'으로 업로드합니다.<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">영수증 기수를 넘기면 무효화를 수행할 수 '없습니다'. (2개월이 한 기수: 【1-2】월이 한 기수, 【3-4】월이 한 기수)<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">예: <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) 【1-2】월 기수에 발행된 영수증은 3/14(포함) 전까지 무효화해야 하며, 3/15 이후에는 무효화할 수 없습니다.<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) 【3-4】월 기수에 발행된 영수증은 5/14(포함) 전까지 무효화해야 하며, 5/15 이후에는 무효화할 수 없습니다.<\/span><\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>무효화 전표: 영수증을 무효화할 때마다 독립적인 무효화 기록이 생성되며, 이를 무효화 전표 또는 무효화 데이터라고 합니다.<\/p><p>무효화 대기: 소비자가 무효화에 동의하기 전까지 영수증은 유효 상태이며, 이 상태의 전표를 무효화 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 전 작업","desc":"<p>（먼저 완료하십시오. 그렇지 않으면 프로그램 실행에 실패합니다）<\/p><p><br><\/p><p> 1. HashKey / HashIV 취득<\/p><p>- 테스트 환경: 테스트 영역 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 영역 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 서식을 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필요 정보: 서버 외부 IP (내부망 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 영업일 기준 1-2일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며, 데이터가 공유되지 않습니다. 운영 전 반드시 연동 URL이 운영 환경 URL로 변경되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 누락' 에러 메시지<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못된 설정<\/p><p>- `KEY10002 데이터 복호화 에러` → HashKey / HashIV가 정확하지 않거나 예제 값인 경우<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 가져올 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 즉시 무효화 프로세스"}]},"apis":[{"name":"전자 영수증 무효화 API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 하단 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200, 현재 시간을 입력하는 것을 권장함","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671009","must_return":false,"note":"무효화할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"V","type":"string(10)","label":"무효화 사유","example":"소비자 주문 취소","must_return":false,"note":"무효화 사유","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"담당자 이름","example":"영업창구001","must_return":false,"note":"무효화 영수증 발행 담당자 이름. 기록용이며 시스템에서 검증하지 않음. 미입력 시 발행 실패 및 에러 코드 반환.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"무효화 확인 방식","example":"1","must_return":false,"note":"0=무효화 대기 (취소 또는 트리거 방식은 '무효화 대기 영수증 관리 API' 설명 참조)\n1=즉시 무효화","enum_values":"0,1","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"무효화 통지 메일 수신 주소","example":"abc@gmail.com","must_return":false,"note":"1. 무효화 통지 메일은 플랫폼에서 기본적으로 구매자에게 발송함\n2. 다수의 구매자 메일 주소를 입력할 경우 콤마로 구분하십시오.\n3. 이 필드는 수신인을 추가할 때 사용하며, 중복된 메일 주소 입력 시 플랫폼에서 중복 발송 방지를 위해 필터링합니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 무효화 전표 발행 성공 시 SUCCESS 반환\n2. 무효화 전표 발행 실패 시 에러 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"반환 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"무효화 전표 일련번호","example":"193060","must_return":false,"note":"이번 무효화 발행 또는 무효화 대기 일련번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 무효화된 또는 무효화 대기 중인 영수 ck använder <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>-formatet.","msg_req_security":"Datasäkerhet: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att skickas asynkront av systemet till den <span class=\\\"font-bold text-green-700\\\">Webhook<\/span>-adress som butiken angett.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> i <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"Returnerade fält kommer att kombineras till ett frågesträngsformat (Query String) med <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>-symbolen, till exempel <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returnerade fält kommer att placeras i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt.","msg_res_format_other":"Returnerade fält använder <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>-formatet.","msg_res_security":"Verifiering och dekryptering: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs för specifik data vid mottagande.","lbl_sha_pre_hash":"Kombinerad sträng före hash (String to Hash)","ph_sha_pre_hash":"När du trycker på hash-knappen visas den faktiska fullständiga strängen som krypteras här...","flowchart_0_url":"assets/flowcharts_void-e-receipt-api/fc_4.png"},"meta":{"title":"API för ogiltigförklarande av elektroniska kvitton","subtitle":"Ogiltigförklara utfärdade elektroniska kvitton","version":"","sections":[{"id":"section-0","title":"Syfte med integrering","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Kontakta kundtjänst för att ansöka om IP-inställningar före integrering. Du kan ställa in upp till 10 IP-adresser.<\/span><\/p><p>2. Möjliggör ogiltigförklarande av elektroniska kvitton med statusen utfärdad.<\/p>"},{"id":"section-1","title":"Dataväxlingsmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvittoinformation till plattformen för elektroniska kvitton via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är ett tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&amp;\", och detta tecken får inte förekomma inuti fälten (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Regler för ogiltigförklarande","desc":"<p>1. <span style=\"color: rgb(0, 0, 0);\">Kvitton kan inte ogiltigförklaras efter att en rabatt (reducering) har bekräftats.<\/span><\/p><p>2. Förbokade kvitton kan inte ogiltigförklaras, endast avbokas.<\/p><p>3. <span style=\"color: rgb(0, 0, 0);\">Efter att ett kvitto har ogiltigförklarats kommer plattformen att ladda upp datan till \"Ministry of Finance E-Invoice Platform\" vid nästa schemalagda uppladdning (den första dagen i varje udda månad).<\/span><\/p><p>4. <span style=\"color: rgb(0, 0, 0);\">Kvitton kan inte ogiltigförklaras efter att perioden har löpt ut. (Varje period är två månader: [1-2] månader är en period, [3-4] månader är en period)<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">Exempel: <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) Kvitton utfärdade under perioden [1-2] månader måste ogiltigförklaras senast den 14/3. Efter den 15/3 går det inte att ogiltigförklara.<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) Kvitton utfärdade under perioden [3-4] månader måste ogiltigförklaras senast den 14/5. Efter den 15/5 går det inte att ogiltigförklara.<\/span><\/p>"},{"id":"section-3","title":"Terminologi","desc":"<p>Ogiltigförklaringsformulär: Varje gång ett kvitto ogiltigförklaras skapas en separat post, kallad ogiltigförklaringsformulär eller ogiltigförklaringsdata.<\/p><p>Väntar på ogiltigförklaring: Innan konsumenten godkänt ogiltigförklarandet är kvittot fortfarande giltigt. Under denna tid kallas formuläret \"väntar på ogiltigförklaring\".<\/p>"},{"id":"section-4","title":"Förberedelser före integrering","desc":"<p>(Vänligen slutför dessa, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in i testportalen → Grundläggande information → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktionsportalen → Grundläggande information → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökan: Ladda ner formuläret från den officiella webbplatsen, fyll i det och skicka till kundtjänst (fax / e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns publika IP (inte intern IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Normalt 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Test- och produktionsmiljöerna är helt separata enheter, datan delas inte. Se till att byta till produktions-URL före driftsättning.<\/p><p><br><\/p><p>4. Vanliga fel på grund av \"missade förberedelser\"<\/p><p>- `KEY10001 Inte ett godkänt IP för resebyråns API` → IP-vitlistning inte inställd eller felaktig<\/p><p>- `KEY10002 Fel vid dekryptering` → HashKey / HashIV är felaktiga eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID felaktigt eller ej aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för omedelbart ogiltigförklarande av kvitto"}]},"apis":[{"name":"API för ogiltigförklarande av elektroniska kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfälten kombineras och krypteras med AES256, se tabellen nedan för fältbeskrivningar","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-version","example":"1.0","must_return":false,"note":"Fast värde 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder från 1970-01-01 00:00:00 UTC till nu. Ex: 2014-05-15 15:00:00 har tidsstämpel 1400137200. Vi rekommenderar att använda aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671009","must_return":false,"note":"Kvittonumret som ska ogiltigförklaras.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"V","type":"string(10)","label":"Orsak till ogiltigförklaring","example":"Konsumenten avbokade","must_return":false,"note":"Orsak till ogiltigförklaring","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handläggarens namn","example":"Affärsavdelning001","must_return":false,"note":"Namnet på personen som utfärdar ogiltigförklarandet. Endast för loggning, systemet validerar ej. Om ej ifyllt misslyckas utfärdandet och systemet returnerar en felkod.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Metod för ogiltigförklaring","example":"1","must_return":false,"note":"0=Väntar på ogiltigförklaring (se API-dokumentation för hantering av väntande kvitton)\n1=Omedelbart ogiltigförklarande","enum_values":"0,1","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"E-post för meddelande om ogiltigförklaring","example":"abc@gmail.com","must_return":false,"note":"1. Meddelande om ogiltigförklaring skickas som standard till köparen.\n2. För flera mottagare, separera med kommatecken.\n3. Detta fält används för att lägga till fler mottagare. Vid dubbletter filtrerar plattformen bort dessa för att undvika dubbla utskick.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. SUCCESS returneras vid lyckad ogiltigförklaring\n2. Felkod returneras vid misslyckad ogiltigförklaring","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Lyckades","must_return":true,"note":"Text, beskrivning av status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyrå-ID","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Löpnummer för ogiltigförklaring","example":"193060","must_return":false,"note":"Löpnummer för detta ogiltigförklarande eller väntande ogiltigförklarande","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret som ogiltigförklarats eller väntar på ogiltigförklaring.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Tid för ogiltigförklaring","example":"2015-07-16 17:00:33","must_return":false,"note":"Tiden då ogiltigförklarandet skedde, t.ex. 2015-07-16 17:00:33.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Används för att kontrollera legitimiteten i returdatan. Vid integrering kan denna parameter jämföras för att bekräfta att svaret kommer från plattformen. Se \"SHA256-krypteringsbeskrivning\" för verifieringsmetod. Returneras tom vid misslyckande.\n\nCheckCode = Hashvärdet beräknat enligt SHA256-signaturspecifikationen för InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo ingår inte i detta API-svar. Programmet måste själv spara dessa värden från när kvittot utfärdades för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängavslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data som en sträng måste kontrollera om EndStr=## för att säkerställa att datan överförts komplett.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Ej godkänt IP för resebyråns API"},{"code":"KEY10002","reason":"Fel vid dekryptering"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Inkomplett data"},{"code":"KEY10006","reason":"Resebyrån har ej ansökt om aktivering av elektroniska kvitton"},{"code":"KEY10007","reason":"Sessionen har varit inaktiv i över 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer saknas"},{"code":"KEY10011","reason":"PostData_-fältet är tomt"},{"code":"KEY10012","reason":"Fel vid dataöverföring"},{"code":"KEY10013","reason":"Tom data"},{"code":"KEY10014","reason":"TimeOut. Syftar vanligtvis på I/O-timeout"},{"code":"KEY10015","reason":"Felaktigt format för kvittobelopp"},{"code":"KEY10019","reason":"Resebyrån har blivit avstängd"},{"code":"NOR10001","reason":"Nätverksfel"},{"code":"INV10015","reason":"Felaktig fältlängd"},{"code":"LIB10001","reason":"Kvittot var inte ett lyckat utfärdat kvitto"},{"code":"LIB10002","reason":"Handläggarens namn saknas"},{"code":"LIB10004","reason":"Felaktig metod för ogiltigförklaring"},{"code":"LIB10005","reason":"Kvittot har redan ogiltigförklarats"},{"code":"LIB10006","reason":"Felaktig triggerstatus för ogiltigförklaring"},{"code":"LIB10007","reason":"Kvittot har redan rabatterats och kan inte ogiltigförklaras"},{"code":"LIB10008","reason":"Ogiltigförklaringsfristen har löpt ut"},{"code":"LIB10009","reason":"Ingen sådan ogiltigförklaringsdata"},{"code":"LIB10010","reason":"Ogiltigförklaringsdatan har redan avbokats"},{"code":"LIB10011","reason":"Ogiltigförklaringsdatan har status som misslyckad och kan ej ogiltigförklaras igen"}],"versions":[]},

        const globalCodeExamples = {"PHP":"<?php\n\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use.\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected.\n */\n\n// --- API Configuration Constants ---\n// This key is 32 bytes (256 bits) long, used for AES-256 encryption and as HashKey for SHA256 signature.\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE_32_BYTES_LONG_'); // Example: '0123456789abcdef0123456789abcdef'\n// This IV is 16 bytes (128 bits) long, used for AES-256 encryption and as HashIV for SHA256 signature. AES block size is always 16 bytes.\ndefine('AES_IV', 'YOUR_AES_IV_HERE_16_BYTES'); // Example: 'fedcba9876543210'\n// Merchant ID (旅行社統一編號), 8 bytes.\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID'); // Example: '54352706'\n\n// API Endpoints\ndefine('API_ENDPOINT_PRODUCTION', 'https://api.travelinvoice.com.tw/invoice_invalid');\ndefine('API_ENDPOINT_TEST', 'https://capi.travelinvoice.com.tw/invoice_invalid');\n\n// --- Placeholder Check ---\nif (AES_KEY === 'YOUR_AES_KEY_HERE_32_BYTES_LONG_' || AES_IV === 'YOUR_AES_IV_HERE_16_BYTES' || MERCHANT_ID === 'YOUR_MERCHANT_ID') {\n    echo '<!DOCTYPE html><html><head><title>Configuration Error<\/title><\/head><body>';\n    echo '<div style=\"color: red; border: 1px solid red; padding: 15px; margin: 20px; font-family: monospace;\">';\n    echo '<strong>ERROR: API Credentials Not Set!<\/strong><br><br>';\n    echo 'Please replace the placeholder values for <code>AES_KEY<\/code>, <code>AES_IV<\/code>, and <code>MERCHANT_ID<\/code> ';\n    echo 'in the PHP script with your actual API credentials before running.<br><br>';\n    echo 'The script has been stopped to prevent API calls with invalid credentials.';\n    echo '<\/div><\/body><\/html>';\n    exit;\n}\n\n// --- AES-256 Encryption Function ---\n/**\n * Encrypts a plaintext string using AES-256-CBC with manual PKCS7 padding (Block Size 32).\n *\n * @param string $plaintext The data to encrypt.\n * @param string $key The 32-byte (256-bit) encryption key.\n * @param string $iv The 16-byte (128-bit) initialization vector.\n * @return string The ciphertext in hexadecimal format.\n * @throws Exception If encryption fails.\n */\nfunction encryptAes(string $plaintext, string $key, string $iv): string\n{\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $block_size = 32;\n    $padding_len = $block_size - (strlen($plaintext) % $block_size);\n    $padded_plaintext = $plaintext . str_repeat(chr($padding_len), $padding_len);\n\n    $ciphertext = openssl_encrypt(\n        $padded_plaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, // OPENSSL_RAW_DATA for raw binary output, OPENSSL_ZERO_PADDING to disable internal padding\n        $iv\n    );\n\n    if ($ciphertext === false) {\n        throw new Exception('AES encryption failed: ' . openssl_error_string());\n    }\n\n    return strtoupper(bin2hex($ciphertext));\n}\n\n// --- SHA256 Signature Verification Function ---\n/**\n * Generates an SHA256 hash string for response CheckCode Verification.\n * The string is constructed from sorted fields, prefixed with HashIV and suffixed with HashKey.\n * This function is used for Verification as the CheckCode is returned by the API to verify the response.\n *\n * @param array $fields An associative array of field names (English) and their values to include in the signature.\n *                      These fields are expected to be saved from a previous API call for verification purposes\n *                      (e.g., original invoice creation response).\n * @param string $hashKey The HashKey (same as AES_KEY) for the signature.\n * @param string $hashIv The HashIV (same as AES_IV) for the signature.\n * @return string The SHA256 hash in uppercase hexadecimal format.\n */\nfunction generateSha256CheckCode(array $fields, string $hashKey, string $hashIv): string\n{\n    // Sort fields alphabetically by key\n    ksort($fields);\n\n    // Construct the string: HashIV={IV值}&Field1={value}&...&HashKey={Key值}\n    // No URL encoding is applied to values during concatenation.\n    $queryString = 'HashIV=' . $hashIv;\n\n    foreach ($fields as $key => $value) {\n        $queryString .= '&' . $key . '=' . $value;\n    }\n\n    $queryString .= '&HashKey=' . $hashKey;\n\n    return strtoupper(hash('sha256', $queryString));\n}\n\n// --- Main Logic for API Request ---\n$apiResponse = null;\n$error = null;\n$httpStatusCode = null;\n$apiTarget = API_ENDPOINT_TEST; // Default to test environment\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    // Determine API endpoint based on user selection\n    $apiTarget = ($_POST['environment'] ?? 'test') === 'production' ? API_ENDPOINT_PRODUCTION : API_ENDPOINT_TEST;\n\n    // --- Prepare PostData_ inner fields ---\n    $postDataFields = [\n        'Version'       => '1.0',\n        'TimeStamp'     => strval(time()), // Unix timestamp in seconds\n        'InvoiceNumber' => $_POST['invoice_number'] ?? '',\n        'InvalidReason' => $_POST['invalid_reason'] ?? '',\n        'SellerName'    => $_POST['seller_name'] ?? '',\n        'Status'        => intval($_POST['status'] ?? 1), // 0=Await Invalidation, 1=Immediate Invalidation\n    ];\n\n    // Conditionally add BuyerEmail if provided\n    if (!empty($_POST['buyer_email'])) {\n        $postDataFields['BuyerEmail'] = $_POST['buyer_email'];\n    }\n\n    // Validate required fields for PostData_\n    $requiredPostDataFields = ['InvoiceNumber', 'InvalidReason', 'SellerName'];\n    foreach ($requiredPostDataFields as $field) {\n        if (empty($postDataFields[$field])) {\n            $error = \"Required field '{$field}' missing in PostData_ content.\";\n            break;\n        }\n    }\n\n    if (!$error) {\n        // Construct PostData_ plaintext string in `key=value&key=value` format\n        // http_build_query is safe here as it's for the internal plaintext string, not the SHA256 signature string.\n        $postDataPlaintext = http_build_query($postDataFields, '', '&', PHP_QUERY_RFC3986);\n\n        try {\n            // Encrypt PostData_\n            $encryptedPostData = encryptAes($postDataPlaintext, AES_KEY, AES_IV);\n\n            // --- Prepare main POST parameters ---\n            // These will be sent as application/x-www-form-urlencoded in the request body.\n            $postParams = [\n                'MerchantID_' => MERCHANT_ID,\n                'PostData_'   => $encryptedPostData,\n            ];\n\n            // --- Initialize cURL ---\n            $ch = curl_init();\n            if ($ch === false) {\n                throw new Exception('Failed to initialize cURL.');\n            }\n\n            curl_setopt($ch, CURLOPT_URL, $apiTarget);\n            curl_setopt($ch, CURLOPT_POST, true);\n            curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($postParams)); // Prepare body as form data\n            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true); // Return response as a string\n            curl_setopt($ch, CURLOPT_HTTPHEADER, [\n                'Content-Type: application/x-www-form-urlencoded',\n            ]);\n            // Optional: uncomment for debugging SSL certificate issues if necessary\n            // curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);\n            // curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, false);\n\n            // --- Execute cURL Request ---\n            $rawResponse = curl_exec($ch);\n            $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n\n            if ($rawResponse === false) {\n                $error = 'cURL Error: ' . curl_error($ch) . ' (Error Code: ' . curl_errno($ch) . ')';\n            } else {\n                // Parse the response string (expected format: key=value&key=value)\n                $apiResponse = [];\n                parse_str($rawResponse, $apiResponse);\n\n                // --- Check for API status and verify CheckCode ---\n                $status = $apiResponse['Status'] ?? 'UNKNOWN';\n                $message = $apiResponse['Message'] ?? 'No message from API.';\n                $endStr = $apiResponse['EndStr'] ?? '';\n\n                // Check for complete response marker\n                if ($endStr !== '##') {\n                    $error = \"Incomplete response received from API (EndStr mismatch). Raw response: \" . htmlspecialchars($rawResponse);\n                } else if ($status === 'SUCCESS') {\n                    // --- CheckCode Verification ---\n                    // IMPORTANT: InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are NOT returned in this API's response.\n                    // These fields must be retrieved from your application's *stored data* (e.g., from the original invoice creation API's response).\n                    // The values here are placeholders. In a real application, replace them with your actual saved data.\n                    $storedOriginalInvoiceData = [\n                        'InvoiceTransNo'    => 'YOUR_SAVED_INVOICE_TRANS_NO', // e.g., '2023102600001' from original invoice creation\n                        'MerchantID'        => MERCHANT_ID, // MerchantID is always used for verification\n                        'MerchantOrderNo'   => 'YOUR_SAVED_MERCHANT_ORDER_NO',   // e.g., 'ORDER12345' from original invoice creation\n                        'RandomNum'         => 'YOUR_SAVED_RANDOM_NUM',       // e.g., '1234567890' from original invoice creation\n                        'TotalAmt'          => 'YOUR_SAVED_TOTAL_AMT',        // e.g., '1000' from original invoice creation\n                    ];\n\n                    $receivedCheckCode = $apiResponse['CheckCode'] ?? '';\n\n                    $expectedCheckCode = generateSha256CheckCode(\n                        $storedOriginalInvoiceData,\n                        AES_KEY, // HashKey for SHA256\n                        AES_IV   // HashIV for SHA256\n                    );\n\n                    // Use hash_equals() for timing-safe comparison to prevent timing attacks.\n                    if (hash_equals($expectedCheckCode, $receivedCheckCode)) {\n                        $apiResponse['CheckCodeStatus'] = 'VALID';\n                    } else {\n                        $apiResponse['CheckCodeStatus'] = 'INVALID (Expected: ' . $expectedCheckCode . ')';\n                        $error = \"CheckCode verification failed. This response might be tampered with or incorrect credentials were used for verification.\";\n                    }\n                } else {\n                    $error = \"API Error (Status: {$status}): {$message}\";\n                }\n            }\n            // curl_close() has no effect in PHP 8.0+ and is intentionally omitted.\n        } catch (Exception $e) {\n            $error = \"Request processing error: \" . $e->getMessage();\n        }\n    }\n}\n?>\n\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Cancel Electronic Invoice API<\/title>\n    <style>\n        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }\n        .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }\n         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }
