<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行業代收轉付電子收據</title>
<link rel="stylesheet" href="assets/intro.css">
</head>
<body>
  <header class="m-header">
    <h1 class="m-title" id="m-title"></h1>
    <button class="m-menu" type="button" aria-label="menu" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </header>

  <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2 class="brand" id="brand-title"></h2>
        <p class="brand-sub"><span id="brand-system"></span></p>
      </div>
      <nav class="sidebar-nav" id="nav-links"></nav>
      <div class="sidebar-foot">
        <div class="lang-wrap">
          <span class="lang-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          </span>
          <select class="lang" id="lang-select" onchange="changeLang(this.value)"></select>
        </div>
        <div class="foot-meta" id="foot-system"></div>
      </div>
    </aside>

    <main class="main">
      <div id="content"></div>
    </main>
  </div>

<script src="assets/intro.js"></script>
</body>
</html>
