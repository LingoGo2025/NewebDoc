(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"變更收據流程"}]},"apis":[{"name":"變更收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","re 收據號碼","example":"T13671008","must_return":false,"note":"此次變更收據的收據號碼","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"買受人名稱","example":"王小一","must_return":false,"note":"開立收據時的買受人名稱，個人姓名或營業人名稱。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"買受人統一編號","example":"54352706","must_return":false,"note":"1.若為 B2B 收據，此欄位為買受人統一編號。\n2.若為 B2C 收據，此欄位為空值。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"買受人電話","example":"0922123456","must_return":false,"note":"買受人的手機號碼。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"買受人地址","example":"台北市南港區南港路二段97號8樓","must_return":false,"note":"買受人的地址。","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"備註","example":"機票","must_return":false,"note":"該張收據的備註。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"團名","example":"北海道5日遊","must_return":false,"note":"該張收據的團名","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"團號","example":"Ba023355","must_return":false,"note":"該張收據的團號","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"預計出團日","example":"2014-10-05","must_return":false,"note":"該張收據出團日,出團日當天會發出出團申報提醒通\n知信至指定信箱","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申報註記","example":"0","must_return":false,"note":"該張收據的申報註記欄位\n0=未申報\n1=已申報","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt不含在此API回應欄位中，需程式自行保存開立收據時回傳的 InvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt，供日後 CheckCode 驗證使用。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"INV20014","reason":"統一編號格式有誤"},{"code":"INV20015","reason":"買受人統編未填寫"},{"code":"INV20016","reason":"買受人名稱未填寫"},{"code":"INV20018","reason":"預約出團日期格式不正確"},{"code":"INV20100","reason":"資料庫發生嚴重錯誤"},{"code":"INV20101","reason":"申報註記錯誤"},{"code":"INV20102","reason":"團名欄位超過字數限制，請縮短字數。"},{"code":"INV20103","reason":"團號欄位超過字數限制，請縮短字數。"},{"code":"INV20104","reason":"團名欄位中有特殊符號，如\"\" ' & < >，請移除。"},{"code":"INV20105","reason":"團號欄位中有特殊符號，如\"\" ' & < >，請移除。"},{"code":"ED10001","reason":"預約出團日期格式不正確"},{"code":"ED10002","reason":"申報註記輸入有誤"},{"code":"ED10006","reason":"預計出團日期不可大於兩年"},{"code":"ED10009","reason":"資料型別錯誤"},{"code":"ED10011","reason":"資料未變更"},{"code":"ED10012","reason":"收據種類為 B2B 時，買受人統編或買受人名稱不可為空"},{"code":"ED10013","reason":"此收據已上傳財政部財資中心！依財政部規定，上傳 完成之收據不得再行變更。"},{"code":"ED10014","reason":"此收據已超過可變更期限！收據可接受變更期限，為每單月一號整合服務平台上傳作業開始前一日的 23 點 59 分 59 秒，超過此期間的收據，因已進入上傳作業階段，無法再行變更。"},{"code":"ED10015","reason":"收據內容已被變更，此項操作依法規僅限進行ㄧ次。 詳細變更資訊請參考上方變更歷程功能。"},{"code":"ED10016","reason":"買受人已列印過此收據！依財政部規定，列印過之收據不得再行變更。"},{"code":"ED10017","reason":"此收據狀態為取消或作廢，不得進行變更"},{"code":"ED10018","reason":"買受人名稱超過字數限制"},{"code":"ED10019","reason":"買受人統編格式錯誤"},{"code":"ED10020","reason":"買受人手機超過字數限制"},{"code":"ED10021","reason":"買受人地址超過字數限制"},{"code":"ED10022","reason":"新增修改歷程記錄失敗"},{"code":"ED10023","reason":"發票種類錯誤"},{"code":"ED10024","reason":"備註超過字數限制"}],"versions":[]},

tle":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Chinese Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Notes","enc_title":"Encryption Rule Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Uses the provided Hash Key and Hash IV to encrypt or decrypt data via the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in the format of <code>http_build_query<\/code> (key=value&key2=value2...).","enc_step2_title":"AES Encryption/Decryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Use the vendor's Hash Key and Hash IV.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generates a checksum via SHA256 hashing, used to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by their English names (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Append IV and Key","enc_sha_step2_desc":"Prepend and append the HashIV and HashKey to the sorted string.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the combined string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error e merchant's specified <span class=\"font-bold text-green-700\">Webhook<\/span> receiving URL.","msg_res_info_sync":"This result will be returned synchronously by the system using the <span class=\"font-bold text-green-700\">{method}<\/span> method to the <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be passed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_res_format_other":"The returned fields are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: Upon receipt, specific data must undergo <span class=\"font-bold\">{group_type}<\/span> processing.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After pressing the encryption button, the actual complete string to be encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_1.png"},"meta":{"title":"Edit Receipt API","subtitle":"Edit Receipt Issuance Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide a mechanism for members of various travel agent associations to electronically edit receipts through program integration.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide mechanisms or operations related to media reporting. Travel agencies should handle these matters themselves.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Before integration, please contact the customer service center to apply for IP settings. The number of settable IPs is: 10.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit receipt data to the electronic receipt platform for issuance via \"HTTP POST\".<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of calculation for each field is a character. Chinese, English, numbers, and symbols all count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\" and must not contain this character (U+0026) within each field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparations","desc":"<p>(Must be completed first, otherwise the program will definitely fail)<\/p><p><br><\/p><p>1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Channel: Download the application form from the official website, fill it out, and send it to the customer service center (fax / email)<\/p><p>- Up to 10 IPs can be set.<\/p><p>- Required Information: Server's external IP address (not an internal IP; can be found at https://ifconfig.me)<\/p><p>- Effective Time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely separate. Data is not shared. Before going live, ensure that the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common Error Codes for \"Forgot Pre-integration Steps\"<\/p><p>- `KEY10001 Not a Travel Agency API Integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data Decryption Error` → HashKey / HashIV is incorrect or still using example values<\/p><p>- `KEY10009 Cannot retrieve travel agency uniform invoice number data` → MerchantID is incorrect or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Edit Receipt Flow"}]},"apis":[{"name":"Edit Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Uniform Invoice Number","example":"54352706","must_return":false,"note":"Travel agency uniform invoice number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Combined string fields encrypted with AES256. Field descriptions are as follows:","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"1.0","must_return":false,"note":"Fixed value of 1.0.","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), representing the number of seconds since 1970-01-01 00:00:00 UTC.<br>Example: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671007","must_return":false,"note":"The receipt number for this credit note issuance.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Type","example":"B2B","must_return":false,"note":"B2B = Buyer is a business entity (Tax ID required).<br>B2C = Buyer is an individual.<br>1. Receipt modification is allowed only once (modifiable fields include: receipt type, buyer name, buyer tax ID).<br>2. Leaving blank or omitting this field means no change.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao Yi","must_return":false,"note":"1. Buyer's name, either an individual's name or a business entity's name.<br>2. Receipt modification is allowed only once (modifiable fields include: receipt type, buyer name, buyer tax ID, buyer phone, buyer address).<br>3. When changing receipt type from B2C to B2B, this is a required field and cannot be empty.<br>4. Leaving blank or omitting this field means no change.<br>5. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer Tax ID","example":"54352706","must_return":false,"note":"1. Buyer's (business entity) tax ID, numeric only.<br>2. If the buyer is an individual, this field is not required.<br>3. Receipt modification is allowed only once (modifiable fields include: receipt type, buyer name, buyer tax ID, buyer phone, buyer address).<br>4. When changing receipt type from B2C to B2B, this is a required field and cannot be empty.<br>5. When changing receipt type from B2B to B2C, the system will clear the existing value.<br>6. Leaving blank or omitting this field means no change.<br>7. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"1. Buyer's mobile phone number.<br>2. Leaving blank or omitting this field means no change.<br>3. Receipt modification is allowed only once (modifiable fields include: receipt type, buyer name, buyer tax ID, buyer phone, buyer address).<br>4. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F, No. 97, Section 2, Nangang Road, Nangang District, Taipei City","must_return":false,"note":"1. Buyer's address.<br>2. Leaving blank or omitting this field means no change.<br>3. Receipt modification is allowed only once (modifiable fields include: receipt type, buyer name, buyer tax ID, buyer phone, buyer address).<br>4. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Remarks","example":"Air ticket","must_return":false,"note":"1. Remarks for this receipt.<br>2. Leaving blank or omitting this field means no change.<br>3. Modifications are not limited.<br>4. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-day tour","must_return":false,"note":"1. Modifications are not limited.<br>2. To clear this field, enter *[clean]*.<br>3. Full-width/half-width Chinese characters, English letters, numbers, symbols, and spaces all count as one character.<br>4. Line breaks and the following special characters are not allowed: double quotes \" | single quotes ' | ampersand & | greater than > | less than <","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"Ba023355","must_return":false,"note":"1. Modifications are not limited.<br>2. To clear this field, enter *[clean]*.<br>3. Line breaks and the following special characters are not allowed: double quotes \" | single quotes ' | ampersand & | greater than > | less than <","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Departure Date","example":"2014-10-05","must_return":false,"note":"1. Format is YYYY-MM-DD. Example: 2014-10-05.<br>2. The estimated departure date cannot be more than two years after the actual receipt issuance date.<br>3. Modifications are not limited.<br>4. To clear this field, enter *[clean]*.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Reporting Mark","example":"0","must_return":false,"note":"0 = Not reported<br>1 = Reported<br>Leaving blank or omitting this parameter means no change.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Response Status","example":"SUCCESS","must_return":true,"note":"1. If receipt modification is successful, return SUCCESS.<br>2. If receipt modification fails, return an error code.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Response Message","example":"Success","must_return":true,"note":"Text message explaining the status of this response.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency uniform invoice number.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this modification.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao Yi","must_return":false,"note":"The buyer's name at the time of receipt issuance, individual name or business name.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer Tax ID","example":"54352706","must_return":false,"note":"1. If it's a B2B receipt, this field is the buyer's tax ID.<br>2. If it's a B2C receipt, this field is empty.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"Buyer's mobile phone number.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F, No. 97, Section 2, Nangang Road, Nangang District, Taipei City","must_return":false,"note":"Buyer's address.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Remarks","example":"Air ticket","must_return":false,"note":"Remarks for this receipt.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-day tour","must_return":false,"note":"Tour name for this receipt.","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"Ba023355","must_return":false,"note":"Tour number for this receipt.","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Departure Date","example":"2014-10-05","must_return":false,"note":"Departure date for this receipt. An email notification will be sent on the departure date.<br>","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Reporting Mark","example":"0","must_return":false,"note":"Reporting mark field for this receipt.<br>0 = Not reported<br>1 = Reported","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify the legitimacy of the returned data. You can compare this parameter during integration to check if it was returned by the platform. Refer to \"SHA256 Encryption Explanation\" for verification methods. Returns empty if issuance fails.<br><br>CheckCode = Hash value calculated using SHA256 signature specifications for InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.<br><br>InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. You need to save the InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt returned during receipt issuance for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Always returns ##. Users receiving data as a String should also check for EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API Integration IP"},{"code":"KEY10002","reason":"Data Decryption Error"},{"code":"KEY10003","reason":"Invalid Version"},{"code":"KEY10004","reason":"Incomplete Data"},{"code":"KEY10006","reason":"Travel agency has not applied for or activated e-receipt services"},{"code":"KEY10007","reason":"Page session exceeded 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency uniform invoice number data"},{"code":"KEY10010","reason":"Travel agency uniform invoice number is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout."},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for postal printing value-added service"},{"code":"KEY10017","reason":"Insufficient postal printing value-added service units available"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency account suspended"},{"code":"NOR10001","reason":"Network connection abnormal"},{"code":"INV20014","reason":"Uniform invoice number format is incorrect"},{"code":"INV20015","reason":"Buyer's uniform invoice number not filled"},{"code":"INV20016","reason":"Buyer's name not filled"},{"code":"INV20018","reason":"Estimated departure date format is incorrect"},{"code":"INV20100","reason":"Severe database error occurred"},{"code":"INV20101","reason":"Reporting mark error"},{"code":"INV20102","reason":"Tour name field exceeds character limit, please shorten.","enum_values":"","default_value":"","nullable":false},{"code":"INV20103","reason":"Tour number field exceeds character limit, please shorten.","enum_values":"","default_value":"","nullable":false},{"code":"INV20104","reason":"Tour name field contains special characters such as \"\" \" & < >, please remove.","enum_values":"","default_value":"","nullable":false},{"code":"INV20105","reason":"Tour number field contains special characters such as \"\" \" & < >, please remove.","enum_values":"","default_value":"","nullable":false},{"code":"ED10001","reason":"Estimated departure date format is incorrect"},{"code":"ED10002","reason":"Reporting mark input error"},{"code":"ED10006","reason":"Estimated departure date cannot be more than two years in the future"},{"code":"ED10009","reason":"Data type error"},{"code":"ED10011","reason":"Data not changed"},{"code":"ED10012","reason":"When receipt type is B2B, buyer's tax ID or buyer's name cannot be empty"},{"code":"ED10013","reason":"This receipt has already been uploaded to the Ministry of Finance's Information Center! According to Ministry of Finance regulations, uploaded receipts cannot be modified. "},{"code":"ED10014","reason":"This receipt has exceeded the modification period! Receipts can be modified until 23:59:59 on the day before the monthly consolidated service platform upload process begins. Receipts beyond this period, as they have entered the upload processing phase, cannot be modified. "},{"code":"ED10015","reason":"The receipt content has already been modified. This operation is limited to one time according to regulations. Please refer to the modification history function above for detailed modification information. "},{"code":"ED10016","reason":"The buyer has already printed this receipt! According to Ministry of Finance regulations, receipts that have been printed cannot be modified. "},{"code":"ED10017","reason":"The status of this receipt is cancelled or voided, and cannot be modified."},{"code":"ED10018","reason":"Buyer name exceeds character limit"},{"code":"ED10019","reason":"Buyer tax ID format error"},{"code":"ED10020","reason":"Buyer mobile number exceeds character limit"},{"code":"ED10021","reason":"Buyer address exceeds character limit"},{"code":"ED10022","reason":"Failed to add/modify historical record"},{"code":"ED10023","reason":"Invoice type error"},{"code":"ED10024","reason":"Remarks exceed character limit"}],"versions":[]},
"ja": {"languageName":"日本語","ui":{"head_title":"領収書変更API","system_name":"","copyright":"","sidebar_brand":"領収書変更API","nav_tool":"暗号化テストツール","nav_group_api":"API仕様詳細","nav_apis":"API仕様","nav_encryption":"暗号化ルール詳細","nav_errors":"エラーコード表","nav_example":"サンプルコード","tool_title":"暗号化テストツール","tool_intro":"このツールは、暗号化文字列の生成や、返信結果の復号化を支援します。","tool_security_warning":"セキュリティ警告：このツールは、API連携テスト専用です。情報セキュリティを確保するため、本番環境のHash KeyとHash IVをここに入力しないでください。","tool_tab_encrypt":"AES暗号化","tool_tab_decrypt":"AES復号化","tool_tab_sha":"SHA256暗号化","tool_ph_key":"例： AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"例： AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"リクエストパラメータ (Query String)","tool_ph_qs":"例： TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"文字列がhttp_build_queryまたはurlencodeで処理されているか確認してください。","tool_note_sha_sort":"プログラムは、以下のフィールドを英文名(A-Z)の順に自動ソートして結合し、IV/Keyを前後に追加します。","tool_btn_encrypt":"暗号化を実行して暗号化文字列を生成","tool_btn_sha":"SHA256を実行","tool_lbl_hex":"暗号化結果 (Hex String)","tool_lbl_enc_hex":"暗号化文字列 (Hex String)","tool_lbl_sha_res":"SHA256結果 (Uppercase)","tool_ph_enc_hex":"例： 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"復号化を実行","tool_lbl_decrypt_res":"復号化結果 (元のデータ)","tool_alert_missing_key":"Hash KeyとHash IVを入力してください。","tool_alert_missing_data":"元の文字列を入力してください。","tool_alert_encrypt_fail":"暗号化に失敗しました: ","tool_alert_missing_hex":"暗号化されたHex文字列を入力してください。","tool_alert_decrypt_fail":"復号化に失敗しました。Key/IVまたは暗号化文字列の形式を確認してください。","req_title":"リクエストパラメータ (Request)","req_api_info":"API情報","req_url_prod":"URL (本番環境)","req_url_test":"URL (テスト環境)","th_param":"パラメータ名","th_name":"中文名称","th_required":"必須","th_must_return":"必須返信","th_type":"型","th_note":"備考","enc_title":"暗号化ルール詳細","enc_aes_title":"AES暗号化・復号化メカニズム","enc_aes_desc":"提供されたHash KeyおよびHash IVを使用し、AESアルゴリズムでデータを暗号化または復号化します。","enc_step1_title":"リクエスト文字列の生成","enc_step1_desc":"すべてのパラメータを<code>http_build_query<\/code>形式で結合します (key=value&key2=value2...)。","enc_step2_title":"AES暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：提供されたHash KeyおよびHash IVを使用してください。","enc_step3_title":"16進数(Hex)への変換","enc_step3_desc":"暗号化されたバイナリデータ(Raw Data)をHex String (小文字)に変換したものが暗号化文字列です。","enc_sha_title":"SHA256チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256ハッシュでチェックサムを生成し、リクエストパラメータまたは返信値の完全性を検証するために使用できます。","enc_sha_step1_title":"パラメータのソートと結合","enc_sha_step1_desc":"指定されたパラメータを英文名(A-Z)でソートし、Query String (key1=val1&key2=val2...)に結合します。","enc_sha_step2_title":"IVとKeyの連結","enc_sha_step2_desc":"ソートされた文字列の前後にHashIVとHashKeyをそれぞれ連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256暗号化と大文字変換","enc_sha_step3_desc":"連結された文字列に対してSHA256暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"返信パラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータが定義されていません","msg_code_unavailable":"// プログラム例はまだありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"更新日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API基本情報","field_def_title":"APIフィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"発動形式","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null可能","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"転送位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは店舗側から発動される必要があり、<code><span class=\"font-bold text-blue-700\">{method}<\/span><\/code>方式でパラメータをパッケージ化し、<code><span class=\"font-bold text-blue-700\">{location}<\/span><\/code>に配置して送信してください。","msg_req_format_qs":"このブロックのフィールドは、<code><span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span><\/code>記号でクエリ文字列(Query String)形式に結合する必要があります。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<code><span class=\"font-bold text-cyan-700\">JSON<\/span><\/code>オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このブロックのフィールドは、<code><span class=\"font-bold text-cyan-700\">{format}<\/span><\/code>形式で結合されます。","msg_req_security":"データセキュリティ：送信前に<code><span class=\"font-bold\">{group_type}<\/span><\/code>処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムによって非同期形式で、店舗指定の<span class=\"font-bold text-green-700\">Webhook<\/span>受信URLにプッシュされます。","msg_res_info_sync":"この結果は、システムによって<code><span class=\"font-bold text-green-700\">{method}<\/span><\/code>方式で<code><span class=\"font-bold text-green-700\">{location}<\/span><\/code>に同期して返信されます。","msg_res_format_qs":"返信されるフィールドは、<code><span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span><\/code>記号でクエリ文字列(Query String)形式に結合されます。例：<span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは、<code><span class=\"font-bold text-cyan-700\">JSON<\/span><\/code>オブジェクト内に配置して送信されます。","msg_res_format_other":"返信されるフィールドは、<code><span class=\"font-bold text-cyan-700\">{format}<\/span><\/code>形式で結合されます。","msg_res_security":"復号化検証：受信後、特定のデータに対して<code><span class=\"font-bold\">{group_type}<\/span><\/code>処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_0.png"},"meta":{"title":"領収書変更API","subtitle":"領収書発行データの変更","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 各旅行業組合傘下の会員が、プログラム連携方式で、領収書変更を行うためのメカニズムを提供します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 本プラットフォームは、メディア申告に関連するメカニズムや作業を提供しません。旅行社は各自で関連事項を行ってください。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 連携前に、カスタマーサービスセンターに連絡してIP設定を申請してください。設定可能なIP数は：10組です。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームは、フォーマット化された文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中国語、英語、数字、記号はすべて1文字とカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"連携前の準備作業","desc":"<p>（事前に完了してください。完了しないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリアのバックエンドにログイン → 基本情報 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番エリアのバックエンドにログイン → 基本情報 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後、カスタマーサービスセンターに送信（FAX / Email）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 提供が必要なもの：サーバーの対外IP（内部IPではない、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>-テスト環境と本番環境は完全に異なる機器であり、データは共有されません。稼働前に、必ず連携URLを本番エリアのURLに切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備作業を忘れた」エラー信号<\/p><p>- <code>KEY10001 旅行会社API連携IPではありません<\/code> → IPホワイトリストが設定されていないか、間違っている<\/p><p>- <code>KEY10002 データ復号化エラー<\/code> → HashKey / HashIV が正しくないか、またはサンプル値のまま<\/p><p>- <code>KEY10009 旅行会社統一編番号のデータが取得できません<\/code> → MerchantIDが間違っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書変更フロー"}]},"apis":[{"name":"領収書変更API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合してAES256で暗号化。フィールド説明は以下の表の通り。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内のフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"固定値 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTCからの秒数です。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時間を入れることを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671007","must_return":false,"note":"今回発行する領収書の番号。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"領収書種類","example":"B2B","must_return":false,"note":"B2B=買受人が営利事業単位(統一編番号必須)。\nB2C=買受人が個人。\n1.領収書変更作業は1回のみ可能です（変更可能なフィールド：領収書種類、買受人名称、買受人統一編番号）。\n2.空欄またはこのフィールドがない場合は、変更なし。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"買受人名称","example":"王小一","must_return":false,"note":"1.買受人の名称（個人名または営利事業単位名）。\n2.領収書変更作業は1回のみ可能です（変更可能なフィールド：領収書種類、買受人名称、買受人統一編番号）。\n3.領収書種類が B2C から B2B に変更される場合、このフィールドは必須で空値であってはなりません。\n4.空欄またはこのフィールドがない場合は、変更なし。\n5.このフィールドをクリアするには *[clean]* と入力してください。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"買受人統一編番号","example":"54352706","must_return":false,"note":"1.買受人（営利事業単位）の統一編番号、数字のみ。\n2.買受人が個人の場合、記入する必 n class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 쿼리 문자열 (Query String) 형식으로 조합해야 합니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 블록의 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 담아 전송해야 합니다.","msg_req_format_other":"이 블록의 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식으로 조합됩니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\"font-bold\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"이 결과는 시스템에서 비동기 방식으로 상점에서 지정한 <span class=\"font-bold text-green-700\">Webhook<\/span> 수신 URL로 푸시됩니다.","msg_res_info_sync":"이 결과는 시스템에서 <span class=\"font-bold text-green-700\">{method}<\/span> 방식으로 <span class=\"font-bold text-green-700\">{location}<\/span>으로 동기식으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 쿼리 문자열 (Query String) 형식으로 조합됩니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 담아 전송됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"복호화 검증: 수신 후 특정 데이터에 대해 <span class=\"font-bold\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 여기에 실제 암호화된 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_0.png"},"meta":{"title":"수정 영수증 API","subtitle":"수정 영수증 발급 데이터","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 각 여행업협회 산하 회원들이 프로그램 연동을 통해 전자 영수증 수정 기능을 이용할 수 있도록 제공합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 본 플랫폼은 미디어 신고 관련 기능 및 작업을 제공하지 않으며, 여행사는 관련 사항을 직접 처리해야 합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 수는 10개입니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발급합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드는 '&amp;'로 연결되며, 각 필드 내에는 이 문자가 포함될 수 없습니다 (U+0026).<\/span><\/p>"},{"id":"section-2","title":"사전 작업","desc":"<p>(먼저 완료해야 합니다. 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 공식 환경: 공식 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청 양식을 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개 IP 설정 가능<\/p><p>- 제공 정보: 서버 외부 IP (내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1-2 영업일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 공식 환경은 완전히 다른 장비이며, 데이터가 공유되지 않으므로, 업로드 전 연동 URL을 공식 구역 URL로 전환했는지 반드시 확인해야 합니다.<\/p><p><br><\/p><p>4. 일반적인 '사전 작업을 잊은' 오류 신호<\/p><p>- `KEY10001 비 여행사 API 연동 IP` → IP 화이트리스트 미설정 또는 잘못 설정<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV 부정확 또는 예제 값 유지<\/p><p>- `KEY10009 여행사 사업자 등록 번호 데이터 조회 불가` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"수정 영수증 흐름"}]},"apis":[{"name":"수정 영수증 API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post 매개변수","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 등록 번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화된 데이터","example":"","must_return":false,"note":"문자열 필드를 조합하여 AES256 암호화, 필드 설명은 아래 표와 같습니다.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"시간 스탬프","example":"1400137200","must_return":false,"note":"Unix 시간 스탬프 (초), 1970-01-01 00:00:00 UTC부터의 초 수\n예: 2014-05-15 15:00:00 시간의 타임스탬프는 1400137200이며, 현재 시간을 입력하는 것이 좋습니다.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671007","must_return":false,"note":"이번에 발행하는 공제 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"영수증 종류","example":"B2B","must_return":false,"note":"B2B = 구매자가 영리 사업체 (사업자 등록 번호 필수).\nB2C = 구매자가 개인.\n1. 영수증 수정 작업은 1회로 제한됩니다 (수정 필드: 영수증 종류, 구매자명, 구매자 사업자 등록 번호)\n2. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"구매자명","example":"왕소일","must_return":false,"note":"1. 구매자명, 개인 이름 또는 영리 사업체명.\n2. 영수증 수정 작업은 1회로 제한됩니다 (수정 필드: 영수증 종류, 구매자명, 구매자 사업자 등록 번호)\n3. 영수증 종류를 B2C에서 B2B로 변경 시, 이 필드는 필수이며 비어 있을 수 없습니다.\n4. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.\n5. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"구매자 사업자 등록 번호","example":"54352706","must_return":false,"note":"1. 구매자 (영리 사업체) 사업자 등록 번호, 숫자만 입력.\n2. 구매자가 개인인 경우, 입력하지 않습니다.\n3. 영수증 수정 작업은 1회로 제한됩니다 (수정 필드: 영수증 종류, 구매자명, 구매자 사업자 등록 번호, 구매자 전화번호, 구매자 주소)\n4. 영수증 종류를 B2C에서 B2B로 변경 시, 이 필드는 필수이며 비어 있을 수 없습니다.\n5. 영수증 종류를 B2B에서 B2C로 변경 시, 시스템에서 기존 값을 삭제합니다.\n6. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.\n7. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"구매자 전화번호","example":"0922123456","must_return":false,"note":"1. 구매자 휴대폰 번호.\n2. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.\n3. 영수증 수정 작업은 1회로 제한됩니다 (수정 필드: 영수증 종류, 구매자명, 구매자 사업자 등록 번호, 구매자 전화번호, 구매자 주소)\n4. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"구매자 주소","example":"타이베이시 남강구 남강로 2단 97호 8층","must_return":false,"note":"1. 구매자 주소.\n2. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.\n3. 영수증 수정 작업은 1회로 제한됩니다 (수정 필드: 영수증 종류, 구매자명, 구매자 사업자 등록 번호, 구매자 전화번호, 구매자 주소)\n4. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"항공권","must_return":false,"note":"1. 해당 영수증의 비고.\n2. 비워두거나 해당 필드가 없으면 데이터 변경이 없는 것으로 간주합니다.\n3. 변경 횟수 제한 없음\n4. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"여행 상품명","example":"홋카이도 5일 여행","must_return":false,"note":"1. 변경 횟수 제한 없음\n2. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.\n3. 전각/반각 한글, 영숫자, 기호 및 공백은 모두 한 문자로 계산됩니다.\n4. 줄 바꿈 및 다음 특수 기호는 허용되지 않습니다: 큰따옴표 \"| 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"여행 상품 번호","example":"Ba023355","must_return":false,"note":"1. 변경 횟수 제한 없음\n2. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.\n3. 줄 바꿈 및 다음 특수 기호는 허용되지 않습니다: 큰따옴표 \"| 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"예정 출발일","example":"2014-10-05","must_return":false,"note":"1. 형식은 YYYY-MM-DD입니다. 예: 2014-10-05\n2. 예정 출발일은 해당 영수증 실제 발행일로부터 2년 후를 초과할 수 없습니다.\n3. 변경 횟수 제한 없음\n4. 이 필드를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 표기","example":"0","must_return":false,"note":"0=미신고\n1=신고\n비워두거나 이 매개변수를 전송하지 않으면 데이터가 변경되지 않습니다.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"응답 상태","example":"SUCCESS","must_return":true,"note":"1. 영수증 수정 성공 시 SUCCESS 반환\n2. 영수증 수정 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"응답 메시지","example":"성공","must_return":true,"note":"문자열, 이번 응답 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 수정된 영수증 번호","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"구매자명","example":"왕소일","must_return":false,"note":"영수증 발행 시 구매자명, 개인 이름 또는 사업자명.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"구매자 사업자 등록 번호","example":"54352706","must_return":false,"note":"1. B2B 영수증인 경우, 이 필드는 구매자 사업자 등록 번호입니다.\n2. B2C 영수증인 경우, 이 필드는 비어 있습니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"구매자 전화번호","example":"0922123456","must_return":false,"note":"구매자 휴대폰 번호.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"구매자 주소","example":"타이베이시 남강구 남강로 2단 97호 8층","must_return":false,"note":"구매자 주소.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"항공권","must_return":false,"note":"해당 영수증의 비고.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"여행 상품명","example":"홋카이도 5일 여행","must_return":false,"note":"해당 영수증의 여행 상품명","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"여행 상품 번호","example":"Ba023355","must_return":false,"note":"해당 영수증의 여행 상품 번호","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"예정 출발일","example":"2014-10-05","must_return":false,"note":"해당 영수증의 출발일. 출발일 당일에 출국 신고 알림 이메일이 지정된 메일로 발송됩니다.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 표기","example":"0","must_return":false,"note":"해당 영수증의 신고 표기 필드\n0=미신고\n1=신고","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"검증 코드","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"이번 데이터 반환의 합법성을 확인하는 데 사용됩니다. 연동 시 이 매개변수 데이터를 비교하여 플랫폼에서 반환된 것인지 확인할 수 있으며, 검증 방법은 \"SHA256 암호화 설명\"을 참조하십시오. 개설 실패 시 빈 값으로 반환됩니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 사양에 따라 계산된 해시 값\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt는 이 API 응답 필드에 포함되지 않으므로, 프로그램에서 직접 영수증 개설 시 반환된 InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt를 보관하여 향후 CheckCode 검증에 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정적으로 ##를 반환합니다. String 방식으로 데이터를 수신하는 사용자는 EndStr=##를 추가로  Denna plattform tillhandahåller inte relaterade mekanismer och operationer för medieinlämning. Resebyråer ska själva hantera relevanta frågor. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kontakta kundtjänstcenter för att ansöka om IP-inställningar före anslutning. Antalet inställbara IP-adresser är: 10.<\/span><\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvittodata till den elektroniska kvittoplattformen för utfärdande via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformat är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Enheten för alla fält är tecken. Kinesiska, engelska, siffror och symboler räknas som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&amp;\" används som skiljetecken mellan fälten, och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelse före anslutning","desc":"<p>(Måste slutföras först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testbakgrunden → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsbakgrunden → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlista<\/p><p>- Ansökningsfönster: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänstcenter (fax / e-post)<\/p><p>- Maximalt 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP-adress (inte intern IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Effekt: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöadresser<\/p><p>-Testmiljön och produktionsmiljön är helt olika enheter, och data är inte gemensam. Före driftsättning måste det bekräftas att anslutningsadressen har ändrats till produktionsmiljöns adress.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden för \"glömde göra förberedelser\"<\/p><p>- `KEY10001 Icke-resebyrå API anslutnings-IP` → IP-vitlistan har inte ställts in eller är felaktig<\/p><p>- `KEY10002 Data dekrypteringsfel` → HashKey / HashIV är felaktigt eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns enhetliga nummer` → MerchantID felaktigt eller inte aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för ändring av kvitto"}]},"apis":[{"name":"Ändra kvitto-API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns enhetliga nummer","example":"54352706","must_return":false,"note":"Resebyråns enhetliga nummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfält kombineras och krypteras med AES256, fältbeskrivning som i tabellen nedan.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-krypterad_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Anslutningsprogramversion","example":"1.0","must_return":false,"note":"Fasta värdet 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;

                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }
