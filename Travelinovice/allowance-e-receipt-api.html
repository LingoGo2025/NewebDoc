;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"折讓收據規範","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">收據於開立作廢並經確認後，『不』可執行折讓。<\/span><\/p><p>2.預約收據無法折讓，只能發動取消<\/p><p>3.折讓<span style=\"color: rgb(0, 0, 0);\">收據後，屆當期上傳排程日(每單月一日)，平台將會把折讓資料上傳至 「財政部電子發票整合服務平台」。<\/span><\/p><p>4.折讓收據無期別限制，只要狀態為已開立就可以開立折讓單<\/p><p>5.一張收據可以開立多張折讓單，但已確認折讓單金額加總不得超過收據總金額。<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>折讓單：每一次折讓收據，都會有一筆獨立的折讓記錄，稱之為折讓單或是折讓資料<\/p><p>等待折讓：等待消費者同意折讓前，折讓單稱為等待折讓<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立折讓流程-立即折讓"}]},"apis":[{"name":"折讓電子收據API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"收據號碼","example":"T13671009","must_return":false,"note":"欲執行折讓之收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"收據自訂編號","example":"Or_5555511","must_return":false,"note":"於開立收據時，收據所屬的自訂編號。（需藉由InvoiceNo取得該收據的MerchantOrderNo）\n注意：這裡是要填寫收據的自訂編號，而不是隨機產一個號碼","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"多項商品時，商品名稱以 | 分隔。例：ItemName=”商品一|商品二\n1.全部商品名稱總字數最多 280 個字。\n2.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n3.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"折讓商品數量","example":"1|1","must_return":false,"note":"1. 商品數量為純數字，每項商品最多 5 位數。\n2. 多項商品時，商品數量以 | 分隔。例：ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"折讓商品單位","example":"個|公斤","must_return":false,"note":"1. 內容如：個、件、本、張…..。\n2. 多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3. 每個商品最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"折讓商品單價","example":"200|100","must_return":false,"note":"1. 單價部分為純數字。\n2. 多項商品時，商品單價以 | 分隔。例：ItemPrice =”200|100”\n3. 每個商品單價金額不能超過 8 位數","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"折讓商品小計","example":"200|200","must_return":false,"note":"1. 小計部分為純數字。\n2. 計算方式為：數量 * 單價 = 小計。平台將會檢查數值是否計算正確。\n3. 多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4. 每個商品小計金額計算後不能超過 8位數","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"折讓總金額","example":"400","must_return":false,"note":"1.此次開立折讓加總金額。總金額不能超過 8 位數。\n2.折讓總金額必須小於等於收據總金額。\n3.折讓總金額需等於全部折讓商品金額總額。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"折讓通知電子信箱","example":"abc@gmail.com","must_return":false,"note":"1. 折讓通知信，平台預設會寄送給買受人\n2. 若需帶入多個買受人信箱，請以逗號分隔。\n3. 此欄位用於新增更多收件人，若帶入重複信箱，平台會進行過濾避免重複發送。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務窗口258","must_return":false,"note":"開立折讓單人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"確認折讓方式","example":"1","must_return":false,"note":"0=開立等待折讓。\n1=立即折讓。","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.折讓單開立成功，則回傳 SUCCESS\n2.折讓單開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"折讓單流水號","example":"193060","must_return":false,"note":"此次開立折讓的系統流水號。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次折讓收據或等待折讓的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"Or_5555511","must_return":false,"note":"此次開立折讓的收據，於開立收據時，提供之自訂編\n號。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"折讓金額","example":"400","must_return":false,"note":"此次開立折讓的金額。","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"折讓後剩餘 收據金額","example":"600","must_return":false,"note":"確認折讓後，此張收據剩餘之收據金額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo , RandomNum, TotalAmt不含在此API回應欄位中，需讓程式由InvoiceNumber（收據號碼）於資料庫中來取得這3個欄位資料。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"ALW10002","reason":"此收據號碼折讓總金額超過開立金額"},{"code":"ALW10003","reason":"開立折讓失敗"},{"code":"ALW10004","reason":"觸發折讓狀態失敗"},{"code":"ALW10005","reason":"已確認折讓，無法再執行取消折讓"},{"code":"ALW10006","reason":"折讓商品名稱總計超過 280 個字"},{"code":"ALW10007","reason":"折讓商品名稱超過 7 個商品"},{"code":"ALW10008","reason":"折讓商品數量非純數字"},{"code":"ALW10009","reason":"折讓商品單位字數超過 2 個字"},{"code":"ALW10010","reason":"折讓商品單價超過 8 位數 or 非純數字"},{"code":"ALW10011","reason":"折讓商品小計超過 8 位數 or 非純數字"},{"code":"ALW10012","reason":"折讓總金額超過 8 位數 or 非純數字"},{"code":"ALW10013","reason":"商品資訊的商品小計計算錯誤"},{"code":"ALW10014","reason":"收據金額驗證錯誤"},{"code":"ALW10015","reason":"觸發折讓狀態錯誤"},{"code":"ALW10016","reason":"確認折讓方式錯誤"},{"code":"ALW10017","reason":"折讓單號錯誤"}],"versions":[]},

meters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production Environment)","req_url_test":"URL (Test Environment)","th_param":"Parameter Name","th_name":"Chinese Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rules Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the provided Hash Key and Hash IV to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters according to <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Please use the Hash Key and Hash IV belonging to the merchant.","enc_step3_title":"Convert to Hexadecimal","enc_step3_desc":"Convert the encrypted binary data (Raw Data) to a Hex String (lowercase).","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum via SHA256 hashing to verify the integrity of request parameters or return values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Prepend HashIV and append HashKey to the sorted string.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search codes...","th_err_code":"Error Code","th_err_reason":"Reason / Note","example_title":"Sample Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code example available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Date","th_ver_desc":"Description","toc_title":"Table of Contents","api_info_title":"Basic API Information","field_def_title":"API Field Definitions","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Location","lbl_belong_to":"Belong To","msg_req_info":"This request must be initiated by the merchant. Please package the parameters and transmit them using the <span class=\"font-bold text-blue-700\">{method}<\/span> method at <span class=\"font-bold text-blue-700\">{location}<\/span>.","msg_req_format_qs":"The fields in this section must be combined as a Query String using the <span class=\"font-mono font-bold text-cyan-700\">&<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this section must be passed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_req_format_other":"The fields in this section are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_req_security":"Data Security: <span class=\"font-bold\">{group_type}<\/span> processing is required before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system asynchronously to the <span class=\"font-bold text-green-700\">Webhook<\/span> URL specified by the merchant.","msg_res_info_sync":"This result will be synchronously returned by the system using the <span class=\"font-bold text-green-700\">{method}<\/span> method at <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined as a Query String using the <span class=\"font-mono font-bold text-cyan-700\">&<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be passed within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_res_format_other":"The returned fields are combined using the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification/Decryption: <span class=\"font-bold\">{group_type}<\/span> processing is required for specific data after receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After pressing the encryption button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_1.png"},"meta":{"title":"Allowance E-Receipt API","subtitle":"Allowance for Issued E-Receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact customer support to apply for IP settings. You can set up to 10 IPs per agency. All APIs share the same 10 IPs.<\/span><\/p><p>2. Allows issuing allowances for e-receipts with 'Issued' status.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The travel agency sends allowance data to the e-receipt platform via 'HTTP POST'.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The e-receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field calculation unit is a character. Chinese, English, numbers, and symbols each count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected by '&', and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Allowance Receipt Specifications","desc":"<p>1. <span style=\"color: rgb(0, 0, 0);\">Once a receipt is voided and confirmed, it 'cannot' be allowed.<\/span><\/p><p>2. Pre-booked receipts cannot be allowed; only cancellations can be triggered.<\/p><p>3. After an <span style=\"color: rgb(0, 0, 0);\">allowance is issued, the platform will upload the data to the 'Ministry of Finance E-Invoice Platform' on the scheduled upload date (the first of every odd month).<\/span><\/p><p>4. There is no time limit for allowance receipts; as long as the status is 'Issued', an allowance note can be created.<\/p><p>5. Multiple allowance notes can be created for a single receipt, but the total amount of confirmed allowance notes cannot exceed the total receipt amount.<\/p>"},{"id":"section-3","title":"Terminology Definitions","desc":"<p>Allowance Note: Each time a receipt is allowed, an independent allowance record is created, called an Allowance Note or allowance data.<\/p><p>Pending Allowance: Before the consumer agrees to the allowance, the allowance note is called 'Pending Allowance'.<\/p>"},{"id":"section-4","title":"Pre-Integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application: Download and fill out the form from the official website and send it to customer support (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Provide: Server external IP (not internal IP, you can check at https://ifconfig.me)<\/p><p>- Activation time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- Test and production environments are completely different; data is not shared. Ensure the URL is switched to the production one before going live.<\/p><p><br><\/p><p>4. Common Errors for 'Missing Pre-integration Tasks'<\/p><p>- `KEY10001 Not a registered agency API IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey/HashIV incorrect or still using sample values<\/p><p>- `KEY10009 Cannot retrieve travel agency Tax ID data` → MerchantID incorrect or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Issuance Process - Immediate Allowance"}]},"apis":[{"name":"Allowance E-Receipt API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel Agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Fields combined and encrypted via AES256; field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC. \nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200; it is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"Receipt number to be allowed.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Receipt ID","example":"Or_5555511","must_return":false,"note":"The custom ID belonging to the receipt when it was created. (Must retrieve via InvoiceNo)\nNote: Fill in the custom ID of the receipt, not a randomly generated number.","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Summary (Product Name)","example":"Product1|Product2","must_return":false,"note":"For multiple items, separate names with |. Example: ItemName=\"Product1|Product2\"\n1. Total characters for all items max 280.\n2. Single item max 160 characters (Chinese, English, numbers, symbols count as 1).\n3. Single receipt max 7 items; for every 40 characters in an item name, allowed item count decreases.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Allowance Item Quantity","example":"1|1","must_return":false,"note":"1. Quantity is purely numeric, max 5 digits per item.\n2. For multiple items, separate by |. Example: ItemCount = \"1|2\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Allowance Item Unit","example":"pc|kg","must_return":false,"note":"1. Content e.g., pc, piece, volume, etc.\n2. Separate by |. Example: ItemUnit = \"pc|piece\"\n3. Max 2 characters per item unit.","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Allowance Item Price","example":"200|100","must_return":false,"note":"1. Price is purely numeric.\n2. Separate by |. Example: ItemPrice = \"200|100\"\n3. Each price cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Allowance Item Subtotal","example":"200|200","must_return":false,"note":"1. Subtotal is purely numeric.\n2. Calculation: Quantity * Price = Subtotal. The platform checks for correct values.\n3. Separate by |. Example: ItemAmt = \"200|200\"\n4. Each subtotal cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Total Allowance Amount","example":"400","must_return":false,"note":"1. Total allowance amount. Cannot exceed 8 digits.\n2. Total allowance amount must be <= total receipt amount.\n3. Total allowance amount must equal the sum of all item allowance amounts.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Notification Email","example":"abc@gmail.com","must_return":false,"note":"1. Allowance notice email is sent to the buyer by default.\n2. Separate multiple emails with commas.\n3. This field adds more recipients. Duplicate emails are filtered.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Operator Name","example":"SalesDept258","must_return":false,"note":"Name of the person creating the allowance note. Purely for records. System does not validate. Failure to fill will result in error.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Confirmation Method","example":"1","must_return":false,"note":"0 = Create and wait for allowance.\n1 = Immediate allowance.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. SUCCESS if created successfully.\n2. Error code if failed.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"193060","must_return":false,"note":"System serial number for this allowance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"Receipt number for the allowance or pending allowance.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom ID","example":"Or_5555511","must_return":false,"note":"Custom ID provided when the receipt was created.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"Allowance Amount","example":"400","must_return":false,"note":"Allowance amount for this transaction.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Receipt Amount","example":"600","must_return":false,"note":"Remaining receipt amount after confirming allowance.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify legitimacy of the response. Refer to 'SHA256 Encryption Details'. Returns empty if failed.\n\nCheckCode = Hash calculated by SHA256 spec on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, RandomNum, TotalAmt are not included in this API response. Your program must retrieve them from the DB using InvoiceNumber.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check for EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a registered agency API IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not enabled E-Receipts"},{"code":"KEY10007","reason":"Session expired (over 30 mins)"},{"code":"KEY10009","reason":"Cannot retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"Timeout. Usually I/O related"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency suspended"},{"code":"NOR10001","reason":"Network connection exception"},{"code":"ALW10002","reason":"Allowance amount exceeds receipt total"},{"code":"ALW10003","reason":"Allowance creation failed"},{"code":"ALW10004","reason":"Failed to trigger allowance status"},{"code":"ALW10005","reason":"Allowance already confirmed, cannot cancel"},{"code":"ALW10006","reason":"Total item names exceed 280 characters"},{"code":"ALW10007","reason":"Exceeds 7 items"},{"code":"ALW10008","reason":"Item quantity is not numeric"},{"code":"ALW10009","reason":"Item unit exceeds 2 characters"},{"code":"ALW10010","reason":"Price exceeds 8 digits or is not numeric"},{"code":"ALW10011","reason":"Subtotal exceeds 8 digits or is not numeric"},{"code":"ALW10012","reason":"Total allowance amount exceeds 8 digits or is not numeric"},{"code":"ALW10013","reason":"Item subtotal calculation error"},{"code":"ALW10014","reason":"Receipt amount verification error"},{"code":"ALW10015","reason":"Allowance trigger status error"},{"code":"ALW10016","reason":"Allowance confirmation method error"},{"code":"ALW10017","reason":"Allowance note number error"}],"versions":[]},

化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力フォーマット：<span class=\"font-bold text-red-600\">Hex (16進数)<\/span><br>Key / IV：ベンダー所定のHash KeyおよびHash IVを使用してください。","enc_step3_title":"16進数(Hex)への変換","enc_step3_desc":"暗号化されたバイナリデータ (Raw Data) をHex String (小文字) に変換したものが暗号化文字列となります。","enc_sha_title":"SHA256チェックサムメカニズム (CheckMacValue)","enc_sha_desc":"SHA256ハッシュでチェックサムを生成し、リクエストパラメータや戻り値の完全性を検証します。","enc_sha_step1_title":"パラメータのソートと組み合わせ","enc_sha_step1_desc":"指定されたパラメータを英名順 (A-Z) に並べ替え、Query String (key1=val1&key2=val2...) を作成します。","enc_sha_step2_title":"IVとKeyの連結","enc_sha_step2_desc":"ソートされた文字列の前後にHashIVとHashKeyをそれぞれ連結します。<br>フォーマット：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256暗号化と大文字変換","enc_sha_step3_desc":"連結後の文字列をSHA256で暗号化し、結果を<strong>大文字<\/strong>に変換します。","res_title":"戻り値パラメータ (Response)","err_title":"エラーコード一覧","err_search_ph":"コード検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"未定義パラメータ","msg_code_unavailable":"// まだサンプルコードはありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"版番号","th_ver_date":"更新日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API基本情報","field_def_title":"APIフィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"起動形態","lbl_field_combo_format":"フィールド組み合わせ形式","lbl_enum_values":"許容値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null許容","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"伝送場所","lbl_belong_to":"所属","msg_req_info":"このリクエストは加盟店側から起動する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 方式でパラメータをパッケージ化し、<span class=\\\"font-bold text-blue-700\\\">{location}<\/span> にて送信してください。","msg_req_format_qs":"このブロックのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でQuery String形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信してください。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わせてください。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムより非同期で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLへプッシュ通知されます。","msg_res_info_sync":"この結果はシステムより <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式にて <span class=\\\"font-bold text-green-700\\\">{location}<\/span> へ同期返信されます。","msg_res_format_qs":"返信されたフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でQuery String形式に結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されたフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信されます。","msg_res_format_other":"返信されたフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証・復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前連結文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_2.png"},"meta":{"title":"電子レシート値引きAPI","subtitle":"発行済み電子レシートの値引き","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.接続前にカスタマーセンターへ連絡し、IP設定の申請を行ってください。設定可能なIP数は10組までです。旅行代理店ごとに10組設定でき、すべてのAPIで共通の10組が使用されます。<\/span><\/p><p>2.ステータスが「発行済み」の電子レシートに対して値引き処理が行えます。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行代理店は「HTTP POST」方式で値引きデータを電子レシートプラットフォームへ送信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子レシートプラットフォームがフォーマットされた文字列で応答します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。日本語、英字、数字、記号すべてを1文字とカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"値引きレシートの規定","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">レシートが発行後に無効化され確認済みとなった場合、値引きは実行「できません」。<\/span><\/p><p>2.予約レシートは値引き不可であり、キャンセルのみ可能です。<\/p><p>3.レシート値引き後、次回のアップロード予定日（奇数月の1日）に、プラットフォームが値引きデータを「財政部電子インボイス統合サービスプラットフォーム」へアップロードします。<\/p><p>4.値引きレシートに期限制限はありません。ステータスが「発行済み」であれば値引き伝票を発行可能です。<\/p><p>5.1枚のレシートに対して複数の値引き伝票を発行できますが、確定した値引き伝票の合計金額がレシートの総額を超えてはなりません。<\/p>"},{"id":"section-3","title":"用語の定義","desc":"<p>値引き伝票：レシートの値引きを行うたびに、独立した値引き記録が作成されます。これを値引き伝票または値引きデータと呼びます。<\/p><p>値引き待ち：消費者の値引き同意を待機している状態の値引き伝票を「値引き待ち」と呼びます。<\/p>"},{"id":"section-4","title":"接続前の準備作業","desc":"<p>（先に完了させてください。さもないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIVの取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後カスタマーセンターへ送信（FAX / Email）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 必要事項：サーバーのグローバルIP（ローカルIPは不可、https://ifconfig.me にて確認可能）<\/p><p>- 有効期間：通常1～2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番環境への移行前に、接続URLを本番環境用へ切り替えたことを必ず確認してください。<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラーシグナル<\/p><p>- `KEY10001 旅行代理店API接続IPではありません` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIVが不正確、またはサンプルの値のまま<\/p><p>- `KEY10009 旅行代理店の統一発票番号（法人番号）データが取得できません` → MerchantIDが誤っている、または有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"値引き発行フロー - 即時値引き"}]},"apis":[{"name":"電子レシート値引きAPI","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Postパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行代理店統一発票番号","example":"54352706","must_return":false,"note":"旅行代理店の統一発票番号（法人番号）。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後にAES256で暗号化。詳細は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内包フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"1.0で固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTCからの経過秒数。\n例：2014-05-15 15:00:00 の場合、タイムスタンプは 1400137200。現在時刻を導入することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"レシート番号","example":"T13671009","must_return":false,"note":"値引きを実行するレシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"レシート独自管理番号","example":"Or_5555511","must_return":false,"note":"レシート発行時に指定した独自管理番号。（InvoiceNoを使用して該当レシートのMerchantOrderNoを取得する必要があります）\n注意：ここはランダムな番号ではなく、レシートの独自管理番号を入力してください。","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名）","example":"商品一|商品二","must_return":false,"note":"複数の商品は | で区切ります。例：ItemName=”商品一|商品二\n1.すべての商品名の合計文字数は最大280文字。\n2.単一品目名は最大160文字まで（日本語、英字、数字、記号を1文字カウント）。\n3.1枚のレシートにつき最大7品目まで。品目名が40文字を超えるごとに、入力可能な品目数が減ります。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"値引き商品数量","example":"1|1","must_return":false,"note":"1. 数量は数字のみ。各商品最大5桁。\n2. 複数の商品は | で区切ります。例：ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"値引き商品単位","example":"個|キログラム","must_return":false,"note":"1. 内容例：個、件、本、枚など。\n2. 複数の商品は | で区切ります。例：ItemUnit =”個|本”\n3. 各商品の単位は最大2文字。例：ItemUnit =”個|キロ”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"値引き商品単価","example":"200|100","must_return":false,"note":"1. 単価は数字のみ。\n2. 複数の商品は | で区切ります。例：ItemPrice =”200|100”\n3. 各商品の単価は8桁以内。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"値引き商品小計","example":"200|200","must_return":false,"note":"1. 小計は数字のみ。\n2. 計算式：数量 * 単価 = 小計。プラットフォームで計算が正しいかチェックされます。\n3. 複数の商品は | で区切ります。例：ItemAmt =”200|200”\n4. 各商品の小計は8桁以内。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"値引き総額","example":"400","must_return":false,"note":"1.今回の値引き総額。8桁以内。\n2.値引き総額はレシート総額以下であること。\n3.値引き総額は全商品値引き金額の合計と等しいこと。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"値引き通知用メールアドレス","example":"abc@gmail.com","must_return":false,"note":"1. 値引き通知メールは、プラットフォームがデフォルトで買受人へ送信します。\n2. 複数の宛先が必要な場合はカンマで区切ってください。\n3. このフィールドは追加の宛先用です。重複アドレスが指定された場合、プラットフォーム側で重複送信を防ぐためにフィルタリングを行います。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"担当者名","example":"営業窓口258","must_return":false,"note":"値引き伝票作成者名。記録用でありシステムチェックはありません。未入力の場合は発行成功せず、システムがエラーコードを返します。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"確認値引き方式","example":"1","must_return":false,"note":"0=発行し値引き待ち。\n1=即時値引き。","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"応答ステータス","example":"SUCCESS","must_return":true,"note":"1.値引き伝票発行成功時、SUCCESSを返信\n2.値引き伝票発行失敗時、エラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"応答メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の応答状態の解説","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行代理店コード","example":"54352706","must_return":false,"note":"旅行代理店の統一発票番号","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"値引き伝票シリアル番号","example":"193060","must_return":false,"note":"今回発行した値引きのシステムシリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"レシート番号","example":"T13671008","must_return":false,"note":"今回値引きした、または値引き待ち状態のレシート番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"独自管理番号","example":"Or_5555511","must_return":false,"note":"今回値引きしたレシートの、発行時に提供された独自管理番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"値引き金額","example":"400","must_return":false,"note":"今回の値引き金額。","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"値引き後のレシート残額","example":"600","must_return":false,"note":"値引き確定後の、当該レシートの残高。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回のデータ返信の妥当性確認用。接続時にこのパラメータを照合し、プラットフォームからの返信か確認してください。確認方法は「SHA256暗号化の説明」を参照。発行失敗時は空値を返信。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt をSHA256署名仕様に基づいて算出されたハッシュ値\n\nInvoiceTransNo, RandomNum, TotalAmt は本APIの応答フィールドに含まれません。InvoiceNumber（レシート番号）を使用してデータベースからこれら3つのフィールドデータを取得するようプログラムしてください。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"##で固定返信。String形式でデータを受信する場合、EndStr=##であることを確認し、データが完全に伝送されたことを保証してください。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行代理店API接続IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行代理店の電子レシート利用が有効化されていません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えました"},{"code":"KEY10009","reason":"旅行代理店の統一発票番号データが取得できません"},{"code":"KEY10010","reason":"旅行代理店の統一発票番号が空です"},{"code":"KEY10011","reason":"PostData_フィールドが空です"},{"code":"KEY10012","reason":"データ伝送エラー"},{"code":"KEY10013","reason":"データが空です"},{"code":"KEY10014","reason":"TimeOut。通常I/Oのタイムアウトを指します"},{"code":"KEY10015","reason":"レシート金額のフォーマットエラー"},{"code":"KEY10019","reason":"旅行代理店が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"ALW10002","reason":"当該レシート番号の値引き総額が発行金額を超えています"},{"code":"ALW10003","reason":"値引き発行失敗"},{"code":"ALW10004","reason":"値引きステータスの起動失敗"},{"code":"ALW10005","reason":"値引き確認済みのため、値引きのキャンセルは実行できません"},{"code":"ALW10006","reason":"値引き商品名の合計が280文字を超えています"},{"code":"ALW10007","reason":"値引き商品名が7品目を超えています"},{"code":"ALW10008","reason":"値引き商品数量が数字のみではありません"},{"code":"ALW10009","reason":"値引き商品単位が2文字を超えています"},{"code":"ALW10010","reason":"値引き商品単価が8桁を超えている、または数字のみではありません"},{"code":"ALW10011","reason":"値引き商品小計が8桁を超えている、または数字のみではありません"},{"code":"ALW10012","reason":"値引き総額が8桁を超えている、または数字のみではありません"},{"code":"ALW10013","reason":"商品情報の商品小計の計算に誤りがあります"},{"code":"ALW10014","reason":"レシート金額の検証エラー"},{"code":"ALW10015","reason":"値引きステータスの起動に誤りがあります"},{"code":"ALW10016","reason":"確認値引き方式に誤りがあります"},{"code":"ALW10017","reason":"値引き伝票番号エラー"}],"versions":[]},
"ko": {"languageName":"한국어","ui":{"head_title":"전자 영수증 차감 API","system_name":"","copyright":"","sidebar_brand":"전자 영수증 차감 API","nav_tool":"암호화 테스트 도구","nav_group_api":"API 규격 상세","nav_apis":"API 규격","nav_encryption":"암호화 규칙 상세","nav_errors":"오류 코드 표","nav_example":"예제 코드","tool_title":"암호화 테스트 도구","tool_intro":"본 도구는 암호화된 문자열을 생성하거나 반환 결과를 복호화하는 데 도움을 줍니다.","tool_security_warning":"보안 경고: 본 도구는 연동 테스트용으로만 사용하십시오. 정보 보안을 위해 실제 환경의 Hash Key와 Hash IV를 여기에 입력하지 마십시오.","tool_tab_encrypt":"AES 암호화","tool_tab_decrypt":"AES 복호화","tool_tab_sha":"SHA256 암호화","tool_ph_key":"예: AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"예: AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"요청 파라미터 (Query String)","tool_ph_qs":"예: TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"문자열이 http_build_query 또는 urlencode 처리를 거쳤는지 확인하십시오","tool_note_sha_sort":"프로그램이 자동으로 하단 필드를 영문 이름순(A-Z)으로 정렬한 뒤 결합하고, 앞뒤로 IV/Key를 붙입니다","tool_btn_encrypt":"암호화 실행 및 문자열 생성","tool_btn_sha":"SHA256 실행","tool_lbl_hex":"암호화 결과 (Hex String)","tool_lbl_enc_hex":"암호화된 문자열 (Hex String)","tool_lbl_sha_res":"SHA256 결과 (대문자)","tool_ph_enc_hex":"예: 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"복호화 실행","tool_lbl_decrypt_res":"복호화 결과 (원본 데이터)","tool_alert_missing_key":"Hash Key와 Hash IV를 입력하십시오","tool_alert_missing_data":"원본 문자열을 입력하십시오","tool_alert_encrypt_fail":"암호화 실패: ","tool_alert_missing_hex":"암호화된 Hex 문자열을 입력하십시오","tool_alert_decrypt_fail":"복호화 실패, Key/IV 또는 암호화 문자열 형식을 확인하십시오","req_title":"요청 파라미터 (Request)","req_api_info":"API 정보","req_url_prod":"URL (운영 환경)","req_url_test":"URL (테스트 환경)","th_param":"파라미터 명","th_name":"명칭","th_required":"필수 여부","th_must_return":"반환 여부","th_type":"타입","th_note":"비고","enc_title":"암호화 규칙 상세","enc_aes_title":"AES 암복호화 메커니즘","enc_aes_desc":"업체에서 제공한 Hash Key와 Hash IV를 사용하여 AES 알고리즘을 통해 데이터를 암호화하거나 복호화합니다.","enc_step1_title":"요청 문자열 생성","enc_step1_desc":"모든 파라미터를 <code>http_build_query<\/code> 형식으로 조합합니다 (key=value&key2=value2...).","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체 소속의 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 이진 데이터(Raw Data)를 Hex String(소문자)으로 변환하면 암호화된 문자열이 됩니다.","enc_sha_title":"SHA256 체크섬 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 체크섬을 생성하며, 요청 파라미터나 반환 값의 무결성을 검증하는 데 사용됩니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z)순으로 정렬하고 Query String으로 조합합니다 (key1=val1&key2=val2...).","enc_sha_step2_title":"IV와 Key 결합","enc_sha_step2_desc":"정렬된 문자열의 앞뒤로 HashIV와 HashKey를 각각 결합합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"결합된 문자열을 SHA256으로 암호화하고, 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드 표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 프로그램 예제 없음","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"흐름도","lbl_launch_type":"발동 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용 여부","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전송 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점 측에서 발동해야 하며, <span class=\"font-bold text-blue-700\">{method}<\/span> 방식을 사용하여 파라미터를 패키징한 후 <span class=\"font-bold text-blue-700\">{location}<\/span> 위치에 전송하십시오.","msg_req_format_qs":"본 구역 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"본 구역 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 배치하여 전송해야 합니다.","msg_req_format_other":"본 구역 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식으로 조합됩니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\"font-bold\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템에서 비동기 방식으로 상점이 지정한 <span class=\"font-bold text-green-700\">Webhook<\/span> 수신 주소로 주도적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템에서 <span class=\"font-bold text-green-700\">{method}<\/span> 방식을 통해 <span class=\"font-bold text-green-700\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 배치되어 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 복호화: 수신 후 특정 데이터에 대해 <span class=\"font-bold\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"해시 버튼을 누르면 여기에 실제 암호화된 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_3.png"},"meta":{"title":"전자 영수증 차감 API","subtitle":"개설된 전자 영수증 차감","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 그룹은 10개입니다. 여행사당 10개의 IP를 설정할 수 있으며, 모든 API에 동일한 10개의 IP가 적용됩니다.<\/span><\/p><p>2. 상태가 '개설됨'인 전자 영수증을 차감 처리할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 \"HTTP POST\" 방식을 통해 차감 데이터를 전자 영수증 플랫폼으로 전송합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열을 응답합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영어, 숫자, 기호 모두 1문자로 계산합니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 \"&\"를 구분자로 사용하며, 필드 내용 내에는 이 기호(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"영수증 차감 규정","desc":"<p>1. <span style=\"color: rgb(0, 0, 0);\">영수증이 개설 후 취소 처리 및 확인된 경우, 차감을 실행할 수 '없'습니다.<\/span><\/p><p>2. 예약 영수증은 차감할 수 없으며, 취소만 가능합니다.<\/p><p>3. 영수증 차감 후, 해당 월 업로드 일정일(매 홀수 월 1일)에 플랫폼이 차감 데이터를 \"재무부 전자 세금계산서 통합 서비스 플랫폼\"에 업로드합니다.<\/p><p>4. 차감 영수증은 기별 제한이 없으며, 상태가 '개설됨'이면 차감 명세서를 발행할 수 있습니다.<\/p><p>5. 영수증 1장당 여러 개의 차감 명세서를 발행할 수 있으나, 이미 확인된 차감 명세서 금액의 합계는 영수증 총액을 초과할 수 없습니다.<\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>차감 명세서: 영수증 차감 시마다 개별 차감 기록이 생성되며, 이를 차감 명세서 또는 차감 데이터라고 합니다.<\/p><p>차감 대기: 소비자가 차감에 동의하기 전 상태의 차감 명세서를 차감 대기 상태라고 합니다.<\/p>"},{"id":"section-4","title":"연동 전 작업","desc":"<p>(반드시 먼저 완료하십시오. 그렇지 않으면 프로그램 실행이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 서버 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 서버 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청서를 다운로드하고 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개 IP 설정 가능<\/p><p>- 필요 정보: 서버 외부 IP (내부 IP가 아닌 것, https://ifconfig.me 에서 조회 가능)<\/p><p>- 적용 시간: 통상 1-2 영업일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 상용화 전 반드시 연동 URL이 운영 환경 URL로 전환되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 \"전 작업 누락\" 오류 코드<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제값임<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터를 가져올 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"차감 개설 절차-즉시 차감"}]},"apis":[{"name":"전자 영수증 차감 API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0으로 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프 (초), 1970-01-01 00:00:00 UTC부터 현재까지의 초\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200, 현재 시간 사용 권장","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671009","must_return":false,"note":"차감을 실행할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"영수증 커스텀 번호","example":"Or_5555511","must_return":false,"note":"영수증 개설 시 할당된 커스텀 번호 (InvoiceNo를 통해 해당 영수증의 MerchantOrderNo 획득 필요)\n주의: 무작위 생성 번호가 아닌 영수증의 커스텀 번호를 입력해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"요약 (상품명)","example":"상품1|상품2","must_return":false,"note":"여러 상품일 경우 |로 구분. 예: ItemName=”상품1|상품2”\n1. 전체 상품명 최대 글자수 280자.\n2. 단일 품목명 최대 160자 (한글, 영문, 숫자, 기호 모두 1자로 계산)\n3. 영수증 1장당 최대 7개 품목, 품목명이 40자를 넘을 때마다 입력 가능 품목 수가 1개씩 줄어듦.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"차감 상품 수량","example":"1|1","must_return":false,"note":"1. 수량은 숫자만 가능, 각 품목당 최대 5자리.\n2. 여러 상품일 경우 |로 구분. 예: ItemCount=”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"차감 상품 단위","example":"개|kg","must_return":false,"note":"1. 내용 예: 개, 건, 권, 장...\n2. 여러 상품일 경우 |로 구분. 예: ItemUnit=”개|권”\n3. 각 상품당 최대 2글자. 예: ItemUnit=”개|kg”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"차감 상품 단가","example":"200|100","must_return":false,"note":"1. 단가는 숫자만 가능.\n2. 여러 상품일 경우 |로 구분. 예: ItemPrice=”200|100”\n3. 각 상품 단가는 8자리수를 초과할 수 없음","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"차감 상품 소계","example":"200|200","must_return":false,"note":"1. 소계는 숫자만 가능.\n2. 계산 방식: 수량 * 단가 = 소계. 플랫폼에서 수치 계산이 정확한지 확인합니다.\n3. 여러 상품일 경우 |로 구분. 예: ItemAmt=”200|200”\n4. 각 상품 소계 금액은 8자리수를 초과할 수 없음","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"차감 총액","example":"400","must_return":false,"note":"1. 금번 차감 합계 금액. 총액은 8자리수를 초과할 수 없음.\n2. 차감 총액은 영수증 총액보다 작거나 같아야 함.\n3. 차감 총액은 모든 차감 상품 금액의 합계와 같아야 함.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"차감 알림 이메일","example":"abc@gmail.com","must_return":false,"note":"1. 차감 알림 메일은 플랫폼에서 기본적으로 매수인에게 발송.\n2. 다수의 매수인에게 발송 시 콤마로 구분.\n3. 이 필드는 추가 수신자용이며, 중복 메일 주소는 플랫폼에서 필터링하여 중복 발송을 방지함.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"담당자 이름","example":"영업담당258","must_return":false,"note":"차감 명세서 발행자 이름. 기록용이며 시스템에서 검증하지 않음. 미입력 시 발행 실패하며 오류 코드가 반환됨.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"차감 확인 방식","example":"1","must_return":false,"note":"0=개설 후 차감 대기.\n1=즉시 차감.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 차감 명세서 발행 성공 시 SUCCESS 반환\n2. 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"금번 반환 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자등록번호","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"차감 명세서 일련번호","example":"193060","must_return":false,"note":"금번 발행된 차감의 시스템 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"금번 차감된 영수증 또는 차감 대기 중인 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"커스텀 번호","example":"Or_5555511","must_return":false,"note":"금번 차감된 영수증의 커스텀 번호.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"차감 금액","example":"400","must_return":false,"note":"금번 발행된 차감 금액.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"차감 후 잔액","example":"600","must_return":false,"note":"차감 확인 후 해당 영수증의 잔액.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크 코드","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"데이터 전달의 합법성을 확인하기 위한 체크 코드. 연동 시 본 파라미터와 비교하여 플랫폼이 반환한 데이터인지 확인하십시오. 검증 방법은 \"SHA256 암호화 설명\"을 참조하십시오. 발행 실패 시 공백 반환.\n\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\nInvoiceTransNo, RandomNum, TotalAmt는 본 API 응답 필드에 포함되지 않으므로, 데이터베이스에서 InvoiceNumber(영수증 번호)를 통해 조회해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 종료","example":"##","must_return":true,"note":"## 고정 반환. String 방식으로 데이터를 수신하는 사용자는 데이터의 완전성을 보장하기 위해 EndStr=##인지 확인해야 함.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사 전자 영수증 사용 신청 안 됨"},{"code":"KEY10007","reason":"페이지 30분 이상 방치됨"},{"code":"KEY10009","reason":"여행사 사업자등록번호 데이터를 가져올 수 없음"},{"code":"KEY10010","reason":"여행사 사업자등록번호 공백"},{"code":"KEY10011","reason":"PostData_ 필드 공백"},{"code":"KEY10012","reason":"데이터 전달 오류"},{"code":"KEY10013","reason":"데이터 공백"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10019","reason":"여행사 서비스 정지 상태"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"ALW10002","reason":"해당 영수증 차감 합계가 발행 금액을 초과함"},{"code":"ALW10003","reason":"차감 발행 실패"},{"code":"ALW10004","reason":"차감 상태 트리거 실패"},{"code":"ALW10005","reason":"이미 확인된 차감으로 취소 불가"},{"code":"ALW10006","reason":"차감 상품명 합계가 280자를 초과함"},{"code":"ALW10007","reason":"차감 상품이 7개를 초과함"},{"code":"ALW10008","reason":"차감 상품 수량이 숫자가 아님"},{"code":"ALW10009","reason":"차감 상품 단위가 2글자를 초과함"},{"code":"ALW10010","reason":"차감 상품 단가가 8자리수를 초과하거나 숫자가 아님"},{"code":"ALW10011","reason":"차감 상품 소계가 8자리수를 초과하거나 숫자가 아님"},{"code":"ALW10012","reason":"차감 총액이 8자리수를 초과하거나 숫자가 아님"},{"code":"ALW10013","reason":"상품 정보의 상품 소계 계산 오류"},{"code":"ALW10014","reason":"영수증 금액 검증 오류"},{"code":"ALW10015","reason":"차감 상태 트리거 오류"},{"code":"ALW10016","reason":"차감 확인 방식 오류"},{"code":"ALW10017","reason":"차감 명세서 번호 오류"}],"versions":[]},

asynkront av systemet till butikens angivna <span class=\"font-bold text-green-700\">Webhook<\/span>-URL.","msg_res_info_sync":"Detta resultat returneras synkront av systemet via <span class=\"font-bold text-green-700\">{method}<\/span> vid <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras till en Query String med <span class=\"font-mono font-bold text-cyan-700\">&<\/span>-symbolen, till exempel <span class=\"font-mono text-cyan-700\">key1=val1&key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten skickas inuti ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt.","msg_res_format_other":"De returnerade fälten använder formatet <span class=\"font-bold text-cyan-700\">{format}<\/span>.","msg_res_security":"Verifiering och dekryptering: <span class=\"font-bold\">{group_type}<\/span>-hantering krävs för specifik data vid mottagande.","lbl_sha_pre_hash":"Sträng före hash (String to Hash)","ph_sha_pre_hash":"Efter att ha tryckt på knappen visas den fullständiga strängen som faktiskt krypteras här...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_4.png"},"meta":{"title":"API för elektroniska kreditnotor","subtitle":"Kreditering av utfärdade elektroniska kvitton","version":"","sections":[{"id":"section-0","title":"Syfte","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Vänligen kontakta kundtjänst innan integration för att ansöka om IP-inställningar. Upp till 10 IP-adresser kan ställas in per resebyrå, och samma 10 IP-adresser används för alla API:er.<\/span><\/p><p>2. Möjliggör kreditering av elektroniska kvitton med status \"Utfärdad\".<\/p>"},{"id":"section-1","title":"Metod för datautbyte","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar krediteringsdata via HTTP POST till plattformen för elektroniska kvitton. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Varje fält beräknas i tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält separeras med \"&\"; detta tecken får inte förekomma inuti fälten (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Specifikationer för kreditnotor","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">När ett kvitto har ogiltigförklarats och bekräftats kan det 'inte' krediteras.<\/span><\/p><p>2. Schemalagda kvitton kan inte krediteras, endast avbokas.<\/p><p>3. Efter kreditering laddar plattformen upp datan till \"Ministry of Finance E-Invoice Integration Platform\" enligt schemat (första dagen i varje udda månad).<\/p><p>4. Det finns ingen tidsbegränsning för att utfärda en kreditnota; så länge kvittot är i status \"Utfärdad\" kan en kreditnota skapas.<\/p><p>5. Ett kvitto kan ha flera kreditnotor, men den totala summan av bekräftade kreditnotor får inte överstiga kvittots totalbelopp.<\/p>"},{"id":"section-3","title":"Definitioner","desc":"<p>Kreditnota: Varje krediteringshändelse genererar en oberoende post som kallas för en kreditnota eller krediteringsdata.<\/p><p>Väntar på kreditering: Innan kunden godkänner krediteringen har kreditnotan status \"Väntar på kreditering\".<\/p>"},{"id":"section-4","title":"Förberedelser före integration","desc":"<p>(Vänligen utför dessa steg, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p>1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in i testmiljöns administratörspanel → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktionsmiljöns administratörspanel → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningssätt: Ladda ner formuläret från hemsidan, fyll i det och skicka till kundtjänst (fax / e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Uppgifter som krävs: Serverns externa IP (inte intranät-IP, kontrollera via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL:er<\/p><p>- Testmiljön och produktionsmiljön är helt separata system; datan delas inte. Säkerställ att du har växlat till produktions-URL före driftsättning.<\/p><p><br><\/p><p>4. Vanliga felkoder vid förberedelsemissar<\/p><p>- `KEY10001 Inte en godkänd IP för resebyråns API-integration` → IP-vitlistning saknas eller är felaktig<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktiga eller är fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är fel eller ej aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för utfärdande av kreditnota - Omedelbar kreditering"}]},"apis":[{"name":"API för elektroniska kreditnotor","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Data kombineras och krypteras med AES256. Se tabellen nedan för fältbeskrivningar.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-version","example":"1.0","must_return":false,"note":"Sätts fast till 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs antal sekunder sedan 1970-01-01 00:00:00 UTC.\nExempel: 2014-05-15 15:00:00 motsvarar 1400137200. Vi rekommenderar aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671009","must_return":false,"note":"Kvittonumret som ska krediteras.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Anpassat ordernummer","example":"Or_5555511","must_return":false,"note":"Det anpassade numret som användes när kvittot utfärdades (måste hämtas via InvoiceNo).\nObs: Här ska det anpassade ordernumret för kvittot anges, inte ett slumpmässigt genererat nummer.","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Beskrivning (Produktnamn)","example":"Produkt1|Produkt2","must_return":false,"note":"För flera produkter, separera namn med |. Exempel: ItemName=”Produkt1|Produkt2”\n1. Max 280 tecken totalt för alla produktnamn.\n2. Max 160 tecken per produktnamn (kinesiska, engelska, siffror och symboler räknas som ett tecken).\n3. Max 7 produkter per kvitto; för varje 40 tecken över en viss gräns minskar antalet tillåtna produkter.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Antal produkter som krediteras","example":"1|1","must_return":false,"note":"1. Endast siffror, max 5 siffror per produkt.\n2. Separera med | vid flera produkter. Exempel: ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Enhet för krediterade produkter","example":"st|kg","must_return":false,"note":"1. Exempel: st, enhet, etc.\n2. Separera med | vid flera produkter. Exempel: ItemUnit =”st|st”\n3. Max 2 tecken per enhet.","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Pris per krediterad produkt","example":"200|100","must_return":false,"note":"1. Endast siffror.\n2. Separera med | vid flera produkter. Exempel: ItemPrice =”200|100”\n3. Priset får inte överstiga 8 siffror per produkt.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Delbelopp per produkt","example":"200|200","must_return":false,"note":"1. Endast siffror.\n2. Beräkning: Antal * Pris = Delbelopp. Plattformen verifierar att beräkningen är korrekt.\n3. Separera med | vid flera produkter. Exempel: ItemAmt =”200|200”\n4. Delbeloppet får inte överstiga 8 siffror per produkt.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Totalt krediteringsbelopp","example":"400","must_return":false,"note":"1. Totalsumma för denna kreditering. Får inte överstiga 8 siffror.\n2. Måste vara mindre än eller lika med kvittots totalbelopp.\n3. Måste vara lika med summan av alla krediterade produkter.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"E-post för meddelande om kreditering","example":"abc@gmail.com","must_return":false,"note":"1. Meddelande om kreditering skickas som standard till köparen.\n2. Separera med komma för flera e-postadresser.\n3. Används för att lägga till fler mottagare; plattformen filtrerar bort dubbletter.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handläggarens namn","example":"Säljare258","must_return":false,"note":"Namnet på personen som utfärdar kreditnotan. Endast för loggning, ingen validering. Om det lämnas tomt kommer utfärdandet att misslyckas och en felkod returneras.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Metod för bekräftelse av kreditering","example":"1","must_return":false,"note":"0=Utfärda och vänta på kreditering.\n1=Omedelbar kreditering.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Vid lyckad kreditering returneras SUCCESS\n2. Vid misslyckad kreditering returneras en felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Lyckades","must_return":true,"note":"Text, beskrivning av status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyrå-ID","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Kreditnotanummer (löpnummer)","example":"193060","must_return":false,"note":"Systemets löpnummer för denna kreditering.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret för det krediterade kvittot.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Anpassat ordernummer","example":"Or_5555511","must_return":false,"note":"Det anpassade numret som gavs vid utfärdandet av kvittot.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"Krediteringsbelopp","example":"400","must_return":false,"note":"Beloppet för denna kreditering.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Återstående kvittobelopp efter kreditering","example":"600","must_return":false,"note":"Återstående belopp på kvittot efter att krediteringen bekräftats.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Används för att kontrollera giltigheten hos det returnerade datat. Kontrollera om det stämmer överens med plattformens svar enligt SHA256-specifikationen. Om utfärdandet misslyckas returneras ett tomt värde.\n\nCheckCode = SHA256-hash av (InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt).\n\nInvoiceTransNo, RandomNum och TotalAmt ingår inte i detta API-svar; programmet måste hämta dessa från databasen baserat på InvoiceNumber.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängavslutare","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data som String måste kontrollera att EndStr=## för att säkerställa att datan är komplett.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en godkänd IP för resebyråns API-integration"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Datat är ofullständigt"},{"code":"KEY10006","reason":"Resebyrån har inte aktiverat tjänsten för elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan
