6）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"自訂編號查詢收據資料呼叫流程圖"}]},"apis":[{"name":"自訂編號查詢電子收據開立資料API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"","type":"int(1)","label":"搜尋種類","example":"4","must_return":false,"note":"固定帶4","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"2.0","must_return":false,"note":"固定帶 2.0","enum_values":"2. 2:12","must_return":false,"note":"收據開立時間，例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"收據狀態","example":"1","must_return":false,"note":"收據之收據狀態。\n0＝預約開立\n1＝已開立\n2=取消預約開立\n3＝已作廢","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\\\"ItemNum\\\":1,\\\"ItemName\\\":\\\"\\\\u6a5f\\\\u7968\\\",\\\"ItemCount\\\":\\\"1\\\",\\\"ItemWord\\\":\\\"\\\\u5f35\\\",\\\"ItemPrice\\\":\\\"2000\\\",\\\"ItemAmount\\\":\\\"2000\\\"}]","must_return":false,"note":"收據開立時的商品資訊(JSON 格式)。\nItemNum = 品項序號\nItemName = 商品名稱\nItemCount = 數量\nItemWord = 單位\nItemPrice = 單價\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"團名","example":"北海道5日遊","must_return":false,"note":"收據的團名","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"團號","example":"B284465","must_return":false,"note":"收據的團號","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"","type":"string(8)","label":"預計出團日","example":"2026-03-22","must_return":false,"note":"收據出團日,出團日當天會發提醒信至指定信箱","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"申報註記","example":"0","must_return":false,"note":"0=未申報\n1=已申報","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY1 he system to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> URL specified by the store.","msg_res_info_sync":"This result will be returned synchronously by the system via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields use <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data after reception.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"The actual string to be encrypted will be displayed here after pressing the hash button...","flowchart_0_url":"assets/flowcharts_query-e-receipt-by-custom-id-api/fc_1.png"},"meta":{"title":"Query Electronic Receipt Issuance Data by Custom Number API","subtitle":"Query receipt issuance data using custom numbers","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After the electronic receipt is issued, use custom data parameters to query the receipt data and status of that specific number.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform via \"HTTP POST\" for issuance. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected with \"&\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Login to Test Admin → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Login to Production Admin → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. IP Whitelist Application<\/p><p>- Process: Download the application form from the official website, fill it out, and send it to the Customer Service Center (Fax / Email)<\/p><p>- Up to 10 IP addresses can be set<\/p><p>- Required: Server outbound IP (not internal IP, can be checked via https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test and production environments are completely different systems; data is not shared. Ensure the connection URL is switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Tasks\" Errors<\/p><p>- `KEY10001 Not a Travel Agency API connection IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using example values<\/p><p>- `KEY10009 Could not retrieve data for the Travel Agency UBN` → MerchantID incorrect or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Custom Number Receipt Query Flowchart"}]},"apis":[{"name":"Query Electronic Receipt Issuance Data by Custom Number API","url_test":"https://capi.travelinvoice.com.tw/invoice_searchall","url_prod":"https://api.travelinvoice.com.tw/invoice_searchall","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":false,"note":"Travel Agency Unified Business Number.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"","type":"int(1)","label":"Search Type","example":"4","must_return":false,"note":"Fixed at 4","enum_values":"4","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"String field combination followed by AES256 encryption. Field details are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"2.0","must_return":false,"note":"Fixed at 2.0","enum_values":"2.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"The number of seconds since the Unix epoch (January 1, 1970 00:00:00 GMT) to the current time. In PHP, this is the value returned by the time() function.\nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceFrom","required":"","type":"int(1)","label":"Receipt Source","example":"1","must_return":false,"note":"0 = API created\n1 = Created via website operation","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"0 = Scheduled\n1 = Issued\n2 = Canceled schedule\n3 = Invalidated","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"AllowStatus","required":"","type":"int(1)","label":"Allowance Status","example":"1","must_return":false,"note":"0 = Issued without allowance\n1 = Issued with allowance\nWhen [InvoiceStatus] is 1, [AllowStatus] will be included in query criteria.","enum_values":"0,1","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Type","example":"B2B","must_return":false,"note":"The type of the receipt.\nB2B = Buyer is a business unit (with UBN)\nB2C = Buyer is an individual\nEmpty value means no filtering","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Operator Name","example":"Ding Xiaoyu","must_return":false,"note":"Can filter invalidated receipts issued by specific operators. Requires complete and accurate name for precise matching.","enum_values":"","default_value":"","nullable":false},{"name":"StartDate","required":"V","type":"datetime","label":"Search Start Date","example":"2016-09-25 00:00:01","must_return":false,"note":"1. Start of search interval (Allowance creation time)\nExample: 2016-09-25\n2. If receipt number is provided, search start and end dates are recommended to be blank; the interval will not be considered.\n3. If both receipt number and dates are provided, only data within the interval will be queried.\n4. If start date is provided, end date is mandatory.","enum_values":"","default_value":"","nullable":false},{"name":"EndDate","required":"V","type":"datetime","label":"Search End Date","example":"2016-09-25 23:59:59","must_return":false,"note":"1. End of search interval (Receipt issuance time)\nExample: 2016-02-25\n2. Max interval is 90 days based on calendar days.\nExample: If start date is 09-01, max end date is 11-29-23:59:59\n3. If receipt number is provided, dates are recommended to be blank.\n4. If both receipt number and dates are provided, only data within the interval will be queried.\n5. If end date is provided, start date is mandatory.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"JSON","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. SUCCESS for successful query\n2. Error code for failed query","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Query allowance data successful","must_return":true,"note":"Text description of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":true,"note":"Travel Agency Unified Business Number.","enum_values":"","default_value":"","nullable":false},{"name":"ReturnInvoice","required":"","type":"array","label":"Returned Receipt Data","example":"","must_return":true,"note":"Content is a JSON format string. Empty if query fails.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCodeSearch","required":"","type":"string(150)","label":"Checksum","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":true,"note":"Used to verify the legality of the returned data. Compare this during integration to ensure it is from the platform. See 'SHA256 Encryption Description'. Empty if issuance fails.\n\nCheckCodeSearch = Hash value calculated from MerchantID, StartDate, EndDate, TimeStamp according to SHA256 specs.\n\nTimeStamp is the timestamp sent in this query.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"ReturnInvoice Internal Fields","group_type":"No Encryption","param_location":"body","from_field":"ReturnInvoice","params":[{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Issuance Serial No.","example":"402832","must_return":false,"note":"System serial number generated during receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Number","example":"2ss0150413110119XX","must_return":false,"note":"1. Custom number entered by the travel agency during issuance.\n2. If multiple records share the same custom number, all corresponding receipt data will be returned.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13743182","must_return":false,"note":"The receipt number of this query.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(4)","label":"Random Security Code","example":"14673793","must_return":false,"note":"The 8-digit random security code generated during receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(60)","label":"Buyer Name","example":"Wang Da","must_return":false,"note":"Buyer name at issuance (individual name or business name).","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(10)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. For B2B receipts, this is the buyer UBN.\n2. For B2C receipts, this is 0.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(200)","label":"Buyer Address","example":"8F, No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"The buyer's address provided at receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerPhone","required":"","type":"string(15)","label":"Buyer Phone","example":"0922548754","must_return":false,"note":"The buyer's mobile number provided at receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"The buyer's email address provided at receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Type","example":"B2B","must_return":false,"note":"The type of receipt.\nB2B = Business unit (with UBN)\nB2C = Individual","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"500","must_return":false,"note":"Numbers only, represents the total receipt amount.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Issuance Time","example":"2014-09-25 12:12:12","must_return":false,"note":"Time of receipt issuance, e.g.: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"The status of the receipt.\n0 = Scheduled\n1 = Issued\n2 = Canceled schedule\n3 = Invalidated","enum_values":"0,1,2,3","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"Product Details","example":"[{\\\"ItemNum\\\":1,\\\"ItemName\\\":\\\"\\\\u6a5f\\\\u7968\\\",\\\"ItemCount\\\":\\\"1\\\",\\\"ItemWord\\\":\\\"\\\\u5f35\\\",\\\"ItemPrice\\\":\\\"2000\\\",\\\"ItemAmount\\\":\\\"2000\\\"}]","must_return":false,"note":"Product info at issuance (JSON format).\nItemNum = Item sequence\nItemName = Product name\nItemCount = Quantity\nItemWord = Unit\nItemPrice = Unit price\nItemAmount = Subtotal","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(200)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"The tour name on the receipt","enum_values":"","default_value":"","nullable":true},{"name":"TourNo","required":"","type":"string(50)","label":"Tour No.","example":"B284465","must_return":false,"note":"The tour number on the receipt","enum_values":"","default_value":"","nullable":true},{"name":"TourDate","required":"V","type":"string(8)","label":"Expected Tour Date","example":"2026-03-22","must_return":false,"note":"Tour departure date; a reminder email will be sent on this date.","enum_values":"","default_value":"","nullable":true},{"name":"TaxNoted","required":"","type":"int(1)","label":"Reporting Mark","example":"0","must_return":false,"note":"0 = Not reported\n1 = Reported","enum_values":"0,1","default_value":"","nullable":false}]}]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API connection IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not activated electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Could not retrieve data for the Travel Agency UBN"},{"code":"KEY10010","reason":"Travel Agency UBN is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency did not apply for postal printing service"},{"code":"KEY10017","reason":"Insufficient postal printing service credits"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"KEY10020","reason":"SearchType_ field is blank"},{"code":"KEY10021","reason":"ReturnType_ field is blank"},{"code":"INV20014","reason":"Unified Business Number format error"},{"code":"INV70001","reason":"Field data format error"},{"code":"WEB1002","reason":"Date format error"},{"code":"NOR10001","reason":"Network connection abnormal"},{"code":"BS10001","reason":"Query interval error"},{"code":"BS10002","reason":"Receipt source error (please check the source parameter)"},{"code":"BS10003","reason":"Receipt status error (please check the status parameter)"},{"code":"BS10004","reason":"Receipt type error (please check the type parameter)"},{"code":"BS10005","reason":"Failed to retrieve receipt data (please try again, contact support if persistent)"},{"code":"BS10006","reason":"No receipt data found"},{"code":"BS10007","reason":"Allowance status error (please check the allowance parameter)"},{"code":"BS10008","reason":"Search type error"},{"code":"BS10009","reason":"Allowance source error"},{"code":"BS10010","reason":"Allowance status error"},{"code":"BS10011","reason":"Invalidation source error"},{"code":"BS10012","reason":"Invalidation status error"},{"code":"BS10013","reason":"Date interval error (max 90 days)"},{"code":"BS10014","reason":"Date interval error (start date cannot be later than end date)"}],"versions":[]},

        const globalToolsConfig = {"sha":{"enabled":true,"params":{"key_label":"HashKey","iv_label":"HashIV","columns":"MerchantID,StartDate,EndDate,TimeStamp","encrypt_order":"前IV後KEY"}},"aes_encrypt":{"enabled":true},"aes_decrypt":{"enabled":true}};
        const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// Define secure credential constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// AES_KEY is 32 bytes (256 bits) — used for both AES-256 encryption and SHA256 signature (HashKey)\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');\n\n// AES_IV is 16 bytes — used for both AES-256 encryption and SHA256 signature (HashIV). \n// IV length is 16 bytes because the AES block size is fixed at 16 bytes.\ndefine('AES_IV', 'YOUR_AES_IV_HERE');\n\n// API Endpoint configuration\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/invoice_searchall'); // Use 'https://api.travelinvoice.com.tw/invoice_searchall' for Production\n\n// Block execution immediately if credentials are still placeholders\n$credentialError = false;\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    $credentialError = true;\n}\n\n/**\n * Verification\n *\n * Verifies the integrity of the API response by matching the received CheckCodeSearch signature.\n *\n * @param string $merchantId\n * @param string $startDate\n * @param string $endDate\n * @param string $timeStamp\n * @param string $hashKey\n * @param string $hashIv\n * @return string\n */\nfunction verifyResponseSignature(string $merchantId, string $startDate, string $endDate, string $timeStamp, string $hashKey, string $hashIv): string {\n    return strtoupper(hash('sha256', 'HashIV=' . $hashIv . '&EndDate=' . $endDate . '&MerchantID=' . $merchantId . '&StartDate=' . $startDate . '&TimeStamp=' . $timeStamp . '&HashKey=' . $hashKey));\n}\n\n$results = null;\n$errorMsg = null;\n$debugData = [];\n\nif (!$credentialError && $_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $startDate = trim($_POST['start_date'] ?? '');\n        $endDate = trim($_POST['end_date'] ?? '');\n        $category = trim($_POST['category'] ?? '');\n        $invoiceStatus = trim($_POST['invoice_status'] ?? '');\n        \n        if (empty($startDate) || empty($endDate)) {\n            throw new Exception('Start Date and End Date are required.');\n        }\n\n        $timeStamp = (string)time();\n\n        // 1. Build plaintext query parameters for PostData_\n        $postDataParams = [\n            'Version' => '2.0',\n            'TimeStamp' => $timeStamp,\n            'StartDate' => $startDate,\n            'EndDate' => $endDate\n        ];\n\n        if ($category !== '') {\n            $postDataParams['Category'] = $category;\n        }\n        if ($invoiceStatus !== '') {\n            $postDataParams['InvoiceStatus'] = (int)$invoiceStatus;\n        }\n\n        $plaintext = http_build_query($postDataParams);\n\n        /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n         * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n         * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n         * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n         * Each padding byte value equals paddingLen.\n         * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n         * to prevent the library from applying its own PKCS7 padding. */\n        $blockSize = 32;\n        $padLength = $blockSize - (strlen($plaintext) % $blockSize);\n        $paddedPlaintext = $plaintext . str_repeat(chr($padLength), $padLength);\n\n        // 2. Encrypt using AES-256-CBC with manually handled padding\n        $encryptedRaw = openssl_encrypt($paddedPlaintext, 'AES-256-CBC', AES_KEY, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, AES_IV);\n        if ($encryptedRaw === false) {\n            $sslError = openssl_error_string();\n            throw new Exception('AES Encryption failed: ' . ($sslError ? $sslError : 'Unknown OpenSSL Error'));\n        }\n        $hexEncrypted = bin2hex($encryptedRaw);\n\n        // 3. Prepare payload for the POST transmission body\n        $postBody = [\n            'MerchantID_' => MERCHANT_ID,\n            'SearchType_' => 4,\n            'PostData_' => $hexEncrypted\n        ];\n\n        $debugData['Payload Sent'] = $postBody;\n        $debugData['Decrypted Payload Query String'] = $plaintext;\n\n        // 4. Send API query via cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($postBody));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n\n        $responseBody = curl_exec($ch);\n        if ($responseBody === false) {\n            throw new Exception('cURL Connection Failed: ' . curl_error($ch));\n        }\n\n        $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpCode !== 200) {\n            throw new Exception('API responded with abnormal HTTP Status Code: ' . $httpCode);\n        }\n\n        $responseJson = json_decode($responseBody, true);\n        if (json_last_error() !== JSON_ERROR_NONE) {\n            throw new Exception('Response parsing failed. Invalid JSON structure.');\n        }\n\n        $debugData['Response Received'] = $responseJson;\n\n        $apiStatus = $responseJson['Status'] ?? '';\n        $apiMessage = $responseJson['Message'] ?? '';\n\n        if ($apiStatus !== 'SUCCESS') {\n            throw new Exception('API Error (' . $apiStatus . '): ' . $apiMessage);\n        }\n\n        // 5. Verification of SHA256 Signature (CheckCodeSearch)\n        $receivedCheckCode = $responseJson['CheckCodeSearch'] ?? '';\n        $expectedCheckCode = verifyResponseSignature(MERCHANT_ID, $startDate, $endDate, $timeStamp, AES_KEY, AES_IV);\n\n        if (empty($receivedCheckCode) || !hash_equals($expectedCheckCode, $receivedCheckCode)) {\n            throw new Exception('Security Alert: CheckCodeSearch signature verification failed! The response may have been tampered with.');\n        }\n\n        // 6. Parse receipt return records\n        $invoicesRaw = $responseJson['ReturnInvoice'] ?? '';\n        $invoicesParsed = [];\n\n        if (!empty($invoicesRaw)) {\n            if (is_string($invoicesRaw)) {\n                $invoicesParsed = json_decode($invoicesRaw, true) ?? [];\n            } else {\n                $invoicesParsed = $invoicesRaw;\n            }\n        }\n\n        $results = [\n            'message' => $apiMessage,\n            'invoices' => $invoicesParsed\n        ];\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Receipt Query Client (Merchant ID query via API)<\/title>\n    <style>\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n            background-color: #f5f7fb;\n            color: #333;\n            margin: 0;\n            padding: 20px;\n        }\n        .container {\n            max-width: 1000px;\n            margin: 0 auto;\n            background: #fff;\n            padding: 30px;\n            border-radius: 8px;\n            box-shadow: 0 4px 6px rgba(0,0,0,0.05);\n        }\n        h1 {\n            font-size: 24px;\n            color: #1a365d;\n            margin-bottom: 25px;\n            border-bottom: 2px solid #edf2f7;\n            padding-bottom: 10px;\n        }\n         function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';
                var sectionBody = '';
                if (sec.desc && sec.desc.trim() !== '') {
                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base whitespace-pre-line mb-6 last:mb-0">' + sec.desc + '</div>';
                }
                if (sec.images && sec.images.length > 0) {
                    sectionBody += '<div class="space-y-8">' + sec.images.map(function(url) {
                        return '<div class="border rounded-lg overflow-hidden cursor-pointer" onclick="openLightbox(\'' + url + '\')"><img src="' + url + '" class="w-full h-auto hover:opacity-90 transition-opacity"></div>';
                    }).join('') + '</div>';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 ' + markerColor + ' mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + sec.title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200">' + sectionBody + '</div></section>';
            });

            if (navContainer) navContainer.innerHTML = navHtml;
            if (contentContainer) {
                contentContainer.innerHTML = contentHtml;
                
                var descImages = contentContainer.querySelectorAll('img');

            var navHtml = '';
            var contentHtml = '';

            flowcharts.forEach(function(fc) {

                var title = fc.title || '流程圖';
                
                // 將 id 的中線轉換為底線，對應 ui 的 key (例如 flowchart-0 -> flowchart_0_url)
                var urlKey = sectionId.replace(/-/g, '_') + '_url';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 bg-indigo-500 mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200 overflow-x-auto text-center"><img src="' + imgUrl + '" alt="' + title + '" class="inline-block max-w-full h-auto cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(\'' + imgUrl + '\')"></div></section>';

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function switchToolTab(tabId, event) {
            document.querySelectorAll('.tool-content').forEach(function(el) { el.classList.add('hidden'); });
            document.querySelectorAll('.tool-tab-btn').forEach(function(el) {
                el.classList.remove('active', 'border-purple-600', 'text-purple-600');
                el.classList.add('border-transparent', 'text-slate-500');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.remove('border-transparent', 'text-slate-500');
                event.currentTarget.classList.add('active', 'border-purple-600', 'text-purple-600');
            }
            var targetContent = document.getElementById(tabId);
            if (targetContent) targetContent.classList.remove('hidden');

            var ui = docConfig[currentLang].ui;
            var lblKey = document.getElementById('lbl-tool-key');
            var lblIv = document.getElementById('lbl-tool-iv');
            if (lblKey && lblIv) {
                if (tabId === 'tool-sha') {
                    var shaConfig = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';
                    lblKey.innerHTML = kLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(Key)</span>';
                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';
                } else {
                    lblKey.innerHTML = ui.tool_lbl_key || 'KEY';
                    lblIv.innerHTML = ui.tool_lbl_iv || 'IV';
                }
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;

            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });

        function changeLang(targetLang) {

            if (searchInput) searchInput.value = '';
            renderAll();

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
