UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The e-receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Calculation unit for each field is characters. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected with \"&\", and fields must not contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Tasks","desc":"<p>(Please complete first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Get HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IP addresses can be set<\/p><p>- Required: Server outbound IP (Not internal IP, check at https://ifconfig.me)<\/p><p>- Effective Time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test environment and production environment are completely different systems; data is not shared. Before going live, ensure the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Tasks\" Error Signals<\/p><p>- `KEY10001 Non-Travel Agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using example values<\/p><p>- `KEY10009 Unable to retrieve data for Travel Agency Tax ID` → MerchantID wrong or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Query Void Receipt Flow"}]},"apis":[{"name":"Single Receipt Void Data Query API","u mber","example":"85512","must_return":false,"note":"The system serial number returned when creating a void receipt","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. SUCCESS if query is successful\n2. Error code if query fails","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Query void receipt successful","must_return":true,"note":"Text, explanation of the return status","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Void Receipt Serial Number","example":"85512","must_return":false,"note":"Serial number of the current void or pending void receipt","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671003","must_return":false,"note":"Receipt number being voided","enum_values":"","default_value":"","nullable":false},{"name":"InvalidType","required":"","type":"int(1)","label":"Void Method","example":"1","must_return":false,"note":"0=Pending void. Initiate confirmation via platform after buyer confirms void.\n1=Immediate void.","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"Void Status","example":"1","must_return":false,"note":"Status of the void allowance.\n0=Unconfirmed void receipt\n1=Confirmed void receipt\n2=Cancelled void receipt","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"invalidComment","required":"","type":"string(10)","label":"Void Reason","example":"Order cancelled","must_return":false,"note":"Void reason","enum_values":"","default_value":"","nullable":false},{"name":"InvalidCreateTime","required":"","type":"datetime","label":"Void Creation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"Time the void receipt was created, e.g., 2014-09-25 12:12:12","enum_values":"","default_value":"","nullable":false},{"name":"InvalidDate","required":"","type":"datetime","label":"Void Confirmation Date","example":"2014-09-25 12:12:12","must_return":false,"note":"Time the void receipt was confirmed, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Handler","example":"Jane Doe","must_return":false,"note":"Name of the person who created the allowance receipt","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify the validity of the data returned. Compare this value to check if it was returned by the platform. For verification methods, refer to \"SHA256 Encryption Description\". Returns empty if creation fails.\n\nCheckCode = Hash value calculated using SHA256 signature specs based on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. Use InvoiceNumber to retrieve these 4 fields from the database.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check for EndStr=## to ensure complete transmission.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Non-Travel Agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for e-receipt enablement"},{"code":"KEY10007","reason":"Page stayed over 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve data for Travel Agency Tax ID"},{"code":"KEY10010","reason":"Travel Agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for mail printing value-added service"},{"code":"KEY10017","reason":"Insufficient available count for mail printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Abnormal network connection"},{"code":"IS10001","reason":"Receipt number not filled"},{"code":"IS10002","reason":"Receipt anti-counterfeiting random code not filled"},{"code":"IS10003","reason":"DisplayFlag error"},{"code":"BS10015","reason":"Allowance number not filled"},{"code":"BS10016","reason":"Void number not filled"},{"code":"BS10017","reason":"Allowance receipt data not found"},{"code":"BS10018","reason":"Void receipt data not found"}],"versions":[]},

        const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature (HashKey)\ndefine('API_KEY', 'YOUR_API_KEY_HERE');\n\n// 16 bytes — used for both AES-256 encryption and SHA256 signature (HashIV)\n// Note: IV is 16 bytes because the underlying block size of AES is fixed at 16 bytes (128 bits), regardless of key length (256 bits)\ndefine('API_IV', 'YOUR_API_IV_HERE');\n\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/invoice_search'); // Defaulting to the testing endpoint\n\n// Safety guard to prevent execution with default placeholder credentials\nif (API_KEY === 'YOUR_API_KEY_HERE' || API_IV === 'YOUR_API_IV_HERE' || MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"padding: 20px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px; font-family: sans-serif; margin: 20px;\">';\n    echo '<strong>Configuration Error:<\/strong> Placeholders detected. You must replace the API_KEY, API_IV, and MERCHANT_ID constant values with your actual credentials before running this script.';\n    echo '<\/div>';\n    exit;\n}\n\n/**\n * Verification (Verification of response signature)\n * Matches the generated CheckCode against the code provided by the API response to verify integrity.\n * Since the parameters (InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt) are not in the response payload,\n * they must be loaded from your local database utilizing the response's InvoiceNumber.\n *\n * @param string $invoiceTransNo\n * @param string $merchantId\n * @param string $merchantOrderNo\n * @param string $randomNum\n * @param string $totalAmt\n * @param string $receivedCheckCode\n * @return bool\n */\nfunction verifyResponseSignature($invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $receivedCheckCode) {\n    $fields = array(\n        'InvoiceTransNo'  => $invoiceTransNo,\n        'MerchantID'      => $merchantId,\n        'MerchantOrderNo' => $merchantOrderNo,\n        'RandomNum'       => $randomNum,\n        'TotalAmt'        => $totalAmt\n    );\n\n    // Sort parameters alphabetically from A to Z\n    ksort($fields);\n\n    // Construct the verification string manually without URL encoding\n    $rawString = 'HashIV=' . API_IV;\n    foreach ($fields as $key => $value) {\n        $rawString .= '&' . $key . '=' . $value;\n    }\n    $rawString .= '&HashKey=' . API_KEY;\n\n    $calculatedHash = strtoupper(hash('sha256', $rawString));\n\n    return hash_equals($calculatedHash, $receivedCheckCode);\n}\n\n/**\n * Parses the raw API query string response.\n *\n * @param string $responseStr\n * @return array\n */\nfunction parseApiResponse($responseStr) {\n    $result = array();\n    $pairs = explode('&', $responseStr);\n    foreach ($pairs as $pair) {\n        $parts = explode('=', $pair, 2);\n        if (count($parts) === 2) {\n            $result[$parts[0]] = urldecode($parts[1]);\n        }\n    }\n    return $result;\n}\n\n$apiResult = null;\n$errorMsg = null;\n$validationResult = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $invoiceNumber = isset($_POST['InvoiceNumber']) ? trim($_POST['InvoiceNumber']) : '';\n        $invalidNo = isset($_POST['InvalidNo']) ? trim($_POST['InvalidNo']) : '';\n\n        if ($invoiceNumber === '' || $invalidNo === '') {\n            throw new Exception('Both Receipt Number (InvoiceNumber) and Invalid Document Number (InvalidNo) are required.');\n        }\n\n        // Construct PostData raw query string parameters\n        $postDataParams = array(\n            'Version'       => '1.1',\n            'TimeStamp'     => (string)time(),\n            'InvoiceNumber' => $invoiceNumber,\n            'InvalidNo'     => $invalidNo\n        );\n\n        $plaintext = 'Version=' . $postDataParams['Version'] .\n                     '&TimeStamp=' . $postDataParams['TimeStamp'] .\n                     '&InvoiceNumber=' . $postDataParams['InvoiceNumber'] .\n                     '&InvalidNo=' . $postDataParams['InvalidNo'];\n\n        /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n         * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n         * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n         * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n         * Each padding byte value equals paddingLen.\n         * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n         * to prevent the library from applying its own PKCS7 padding. */\n        $blockSize = 32;\n        $padSize = $blockSize - (strlen($plaintext) % $blockSize);\n        $paddedPlaintext = $plaintext . str_repeat(chr($padSize), $padSize);\n\n        // Encrypt with raw output enabled and auto-padding disabled\n        $encryptedRaw = openssl_encrypt(\n            $paddedPlaintext,\n            'AES-256-CBC',\n            API_KEY,\n            OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n            API_IV\n        );\n\n        if ($encryptedRaw === false) {\n            throw new Exception('AES Encryption process failed.');\n        }\n\n        $postDataHex = bin2hex($encryptedRaw);\n\n        // Define API payload parameters\n        $payload = array(\n            'MerchantID_' => MERCHANT_ID,\n            'SearchType_' => '3',\n            'PostData_'   => $postDataHex\n        );\n\n        // Initiate raw standard cURL request\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($payload));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, array(\n            'Content-Type: application/x-www-form-urlencoded'\n        ));\n\n        $rawResponse = curl_exec($ch);\n\n        if ($rawResponse === false) {\n            $curlError = curl_error($ch);\n            throw new Exception('Connection to API Endpoint failed: ' . $curlError);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpStatusCode !== 200) {\n            throw new Exception('API Endpoint returned anomalous HTTP status code: ' . $httpStatusCode);\n        }\n\n        // Verify transfer completeness ending with the configured string sentinel '##'\n        if (substr($rawResponse, -2) !== '##') {\n            throw new Exception('Incomplete API response transmission. End sequence sentinel \"##\" missing.');\n        }\n\n        $apiResult = parseApiResponse($rawResponse);\n\n        // Implement validation verification logic if a CheckCode is supplied and local mock db fields are filled\n        $mockTransNo = isset($_POST['MockTransNo']) ? trim($_POST['MockTransNo']) : '';\n        $mockOrderNo = isset($_POST['MockOrderNo']) ? trim($_POST['MockOrderNo']) : '';\n        $mockRandomNum = isset($_POST['MockRandomNum']) ? trim($_POST['MockRandomNum']) : '';\n        $mockTotalAmt = isset($_POST['MockTotalAmt']) ? trim($_POST['MockTotalAmt']) : '';\n        $receivedCheckCode = isset($apiResult['CheckCode']) ? $apiResult['CheckCode'] : '';\n\n        if ($receivedCheckCode !== '' && $mockTransNo !== '' && $mockOrderNo !== '' && $mockRandomNum !== '' && $mockTotalAmt !== '') {\n            $isSignatureValid = verifyResponseSignature(\n                $mockTransNo,\n                MERCHANT_ID,\n                $mockOrderNo,\n                $mockRandomNum,\n                $mockTotalAmt,\n                $receivedCheckCode\n            );\n            $validationResult = $isSignatureValid ? 'VALID' : 'INVALID';\n        }\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Single Receipt Void Query Interface<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }\n        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }\n        h1 { font-size: 24px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; margin-top: 0; color: #1e293b; }\n        h2 { font-size: 18px; color: #475569; margin-top: 25px; }\n        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n        .form-group { margin-bottom: 15px; }\n        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; color: #475569; }\n        input[type=\"text\"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px; }\n        input[type=\"text\"]:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }\n        .btn { display: inline-block; background-color: #2563eb; color: #fff; padding: 12px 24px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background-color 0.2s; }\n        .btn:hover { background-color: #1d4ed8; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }\n        .alert-danger { background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }\n        .alert-success { background-color: #dcfce7; border: 1px solid #86efac; color: #166534; }\n        .alert-warning { background-color: #fef9c3; border: 1px solid #fde047; color: #854d0e; }\n        .response-table { width: 100%; border-collapse: collapse; margin-top: 15px; }\n        .response-table th, .response-table td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }\n        .response-table th { background-color: #f8fafc; font-weight: 600; color: #475569; }\n        .badge { display: inline-block; padding: 4px 8px; font-size: 12px; font-weight: 600; border-radius: 4px; }\n        .badge-success { background-color: #dcfce7; color: #166534; }\n        .badge-danger { background-color: #fee2e2; color: #991b1b; }\n        .section-desc { font-size: 13px; color: #64748b; margin-bottom: 15px; line-height: 1.4; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Single Receipt Void Query Interface<\/h1>\n\n    <?php if ($errorMsg): ?>\n        <div class=\"alert alert-danger\">\n            <strong>Execution Error:<\/strong> <?php echo htmlspecialchars($errorMsg); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form method=\"POST\" action=\"\">\n        <div class=\"form-grid\">\n            <div>\n                <h2>1. API Request Parameters<\/h2>\n                <div class=\"form-group\">\n                    <label for=\"InvoiceNumber\">Receipt Number (InvoiceNumber) <span style=\"color:red\">*<\/span><\/label>\n                    <input type=\"text\" id=\"InvoiceNumber\" name=\"InvoiceNumber\" value=\"<?php echo isset($_POST['InvoiceNumber']) ? htmlspecialchars($_POST['InvoiceNumber']) : 'T13671005'; ?>\" required>\n                <\/div>\n                <div class=\"form-group\">\n                    <label for=\"InvalidNo\">Void Document Number (InvalidNo) <span style=\"color:red\">*<\/span><\/label>\n                    <input type=\"text\" id=\"InvalidNo\" name=\"InvalidNo\" value=\"<?php echo isset($_POST['InvalidNo']) ? htmlspecialchars($_POST['InvalidNo']) : '85512'; ?>\" required>\n                <\/div>\n            <\/div>\n\n            <div>\n                <h2>2. Verification Parameters (From Local Database)<\/h2>\n                <div class=\"section-desc\">\n                    These optional fields mimic parameters fetched from your internal data systems using the query’s receipt number to perform cryptographic validation of the response integrity.\n                <\/div>\n                <div class=\"form-group\">\n                    <label for=\"MockTransNo\">Transaction No. (InvoiceTransNo)<\/label>\n                    <input type=\"text\" id=\"MockTransNo\" name=\"MockTransNo\" value=\"<?php echo isset($_POST['MockTransNo']) ? htmlspecialchars($_POST['MockTransNo']) : ''; ?>\" placeholder=\"e.g. TX12345678\">\n                <\/div>\n                <div class=\"form-group\">\n                    <label for=\"MockOrderNo\">Merchant Order No. (MerchantOrderNo)<\/label>\n                    <input type=\"text\" id=\"MockOrderNo\" name=\"MockOrderNo\" value=\"<?php echo isset($_POST['MockOrderNo']) ? htmlspecialchars($_POST['MockOrderNo']) : ''; ?>\" placeholder=\"e.g. ORD20240925\">\n                <\/div>\n                <div class=\"form-group\">\n                    <label for=\"MockRandomNum\">Random Verification Number (RandomNum)<\/label>\n                    <input type=\"text\" id=\"MockRandomNum\" name=\"MockRandomNum\" value=\"<?php echo isset($_POST['MockRandomNum']) ? htmlspecialchars($_POST['MockRandomNum']) : ''; ?>\" placeholder=\"e.g. 9876\">\n                <\/div>\n                <div class=\"form-group\">\n                    <label for=\"MockTotalAmt\">Total Amount (TotalAmt)<\/label>\n                    <input type=\"text\" id=\"MockTotalAmt\" name=\"MockTotalAmt\" value=\"<?php echo isset($_POST['MockTotalAmt']) ? htmlspecialchars($_POST['MockTotalAmt']) : ''; ?>\" placeholder=\"e.g. 5000\">\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <div style=\"text-align: right; margin-top: 20px;\">\n            <button type=\"submit\" class=\"btn\">Execute Query<\/button>\n        <\/div>\n    <\/form>\n\n    <?php if ($apiResult): ?>\n        <h2>Query Results<\/h2>\n        <table class=\"response-table\">\n            <thead>\n                <tr>\n                    <th style=\"width: 30%;\">Field Name<\/th>\n                    <th>Value<\/th>\n                <\/tr>\n            <\/thead>\n            <tbody>\n                <tr>\n                    <td>Status (Status)<\/td>\n                    <td>\n                        <?php if (($apiResult['Status'] ?? '') === 'SUCCESS'): ?>\n                            <span class=\"badge badge-success\"><?php echo htmlspecialchars($apiResult['Status']); ?><\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($apiResult['Status'] ?? 'UNKNOWN'); ?><\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Return Message (Message)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['Message'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Document Number (InvalidNo)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['InvalidNo'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Receipt Number (InvoiceNumber)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['InvoiceNumber'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Type (InvalidType)<\/td>\n                    <td>\n                        <?php \n                        $type = $apiResult['InvalidType'] ?? null;\n                        if ($type === '0') echo '0 (Waiting for Customer Confirmation)';\n                        elseif ($type === '1') echo '1 (Instant Void)';\n                        else echo htmlspecialchars($type ?? 'N/A');\n                        ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Status (InvalidStatus)<\/td>\n                    <td>\n                        <?php \n                        $status = $apiResult['InvalidStatus'] ?? null;\n                        if ($status === '0') echo '0 (Pending Confirmation)';\n                        elseif ($status === '1') echo '1 (Void Confirmed)';\n                        elseif ($status === '2') echo '2 (Void Cancelled)';\n                        else echo htmlspecialchars($status ?? 'N/A');\n                        ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Reason (invalidComment)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['invalidComment'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Creation Timestamp (InvalidCreateTime)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['InvalidCreateTime'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Execution Date (InvalidDate)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['InvalidDate'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Processor (SellerName)<\/td>\n                    <td><?php echo htmlspecialchars($apiResult['SellerName'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Cryptographic Signature (CheckCode)<\/td>\n                    <td style=\"word-break: break-all; font-family: monospace; font-size: 13px;\">\n                        <?php echo htmlspecialchars($apiResult['CheckCode'] ?? 'N/A'); ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Transmission Sentinel (EndStr)<\/td>\n                    <td><code><?php echo htmlspecialchars($apiResult['EndStr'] ?? 'N/A'); ?><\/code><\/td>\n                <\/tr>\n            <\/tbody>\n        <\/table>\n\n        <?php if ($validationResult): ?>\n            <div style=\"margin-top: 20px;\">\n                <?php if ($validationResult === 'VALID'): ?>\n                    <div class=\"alert alert-success\">\n                        <strong>Integrity Match:<\/strong> Cryptographic verification succeeded. The response signature is genuine and verified against internal metadata.\n                    <\/div>\n                <?php else: ?>\n                    <div class=\"alert alert-danger\">\n                        <strong>Security Alert:<\/strong> Cryptographic validation check failed. The calculated signature does not match the received CheckCode. Ensure the supplied validation fields match the backend record state.\n                    <\/div>\n                <?php endif; ?>\n            <\/div>\n        <?php else: ?>\n            <div class=\"alert alert-warning\" style=\"margin-top: 20px;\">\n                <strong>Signature Validation Bypassed:<\/strong> Optional verification parameters were left empty. Perform these checks to guarantee the end-to-end reliability of transaction states.\n            <\/div>\n        <?php endif; ?>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];
        let currentCodeTab = 'php';

        function getMsg(ui, key, defaultMsg, replacements) {
            var msg = ui[key] || defaultMsg;
            if (replacements) {
                for (var k in replacements) {
                    msg = msg.replace(new RegExp('\\{' + k + '\\}', 'g'), replacements[k]);
                }
            }
            return msg;
        }

        function renderAll() {
            renderMetaInfo();
            renderCustomSections();
            renderFlowcharts();
            renderToolTabs();
            renderEncryptionRules();
            renderSidebarAPIs(docConfig[currentLang].apis);
            renderAPIs(docConfig[currentLang].apis);
            renderErrorTable(docConfig[currentLang].errors, 'error-table-body');
            renderCodeTabs();
            loadCode(currentCodeTab);
            renderVersions();
            initScrollSpy();
        }

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';
                var sectionBody = '';
                if (sec.desc && sec.desc.trim() !== '') {
                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base whitespace-pre-line mb-6 last:mb-0">' + sec.desc + '</div>';
                }
                if (sec.images && sec.images.length > 0) {
                    sectionBody += '<div class="space-y-8">' + sec.images.map(function(url) {
                        return '<div class="border rounded-lg overflow-hidden cursor-pointer" onclick="openLightbox(\'' + url + '\')"><img src="' + url + '" class="w-full h-auto hover:opacity-90 transition-opacity"></div>';
                    }).join('') + '</div>';
                }
                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 ' + markerColor + ' mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + sec.title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200">' + sectionBody + '</div></section>';
            });

            if (navContainer) navContainer.innerHTML = navHtml;
            if (contentContainer) {
                contentContainer.innerHTML = contentHtml;
                
                var descImages = contentContainer.querySelectorAll('img');
                descImages.forEach(function(img) {
                    img.classList.add('cursor-pointer', 'hover:opacity-90', 'transition-opacity');
                    img.onclick = function() {
                        openLightbox(this.src);
                    };
                });
            }
        }

        function renderFlowcharts() {
            var meta = docConfig[currentLang].meta;
            var ui = docConfig[currentLang].ui;
            var flowcharts = meta.flowcharts || [];
            
            if (flowcharts.length === 0) return;

            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            
            var navHtml = '';
            var contentHtml = '';

            flowcharts.forEach(function(fc) {
                var sectionId = fc.id; 
                if (!sectionId) return;
                var title = fc.title || '流程圖';
                
                // 將 id 的中線轉換為底線，對應 ui 的 key (例如 flowchart-0 -> flowchart_0_url)
                var urlKey = sectionId.replace(/-/g, '_') + '_url'; 
                var imgUrl = ui[urlKey];

                if (!imgUrl) return; // 如果 ui 中沒有此網址則跳過

                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="fas fa-project-diagram w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + title + '</span></a>';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 bg-indigo-500 mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200 overflow-x-auto text-center"><img src="' + imgUrl + '" alt="' + title + '" class="inline-block max-w-full h-auto cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(\'' + imgUrl + '\')"></div></section>';
            });

            // 以附加方式將流程圖區域加入現有容器，保留 renderCustomSections 所建立的內容
            if (navContainer && navHtml) navContainer.insertAdjacentHTML('beforeend', navHtml);
            if (contentContainer && contentHtml) contentContainer.insertAdjacentHTML('beforeend', contentHtml);
        }

        function renderToolTabs() {
            var container = document.getElementById('tool-tabs-container');
            var ui = docConfig[currentLang].ui;
            var config = globalToolsConfig;
            var html = '';
            if (config.aes_encrypt && config.aes_encrypt.enabled) {
                html += '<button onclick="switchToolTab(\'tool-aes-encrypt\', event)" class="tool-tab-btn flex-1 py-4 text-sm font-bold text-center hover:bg-slate-50 transition border-b-2 border-transparent text-slate-500"><i class="fas fa-lock mr-2"></i> <span>' + ui.tool_tab_encrypt + '</span></button>';
            }
            if (config.aes_decrypt && config.aes_decrypt.enabled) {
                html += '<button onclick="switchToolTab(\'tool-aes-decrypt\', event)" class="tool-tab-btn flex-1 py-4 text-sm font-bold text-center hover:bg-slate-50 transition border-b-2 border-transparent text-slate-500"><i class="fas fa-unlock mr-2"></i> <span>' + ui.tool_tab_decrypt + '</span></button>';
            }
            if (config.sha && config.sha.enabled) {
                html += '<button onclick="switchToolTab(\'tool-sha\', event)" class="tool-tab-btn flex-1 py-4 text-sm font-bold text-center hover:bg-slate-50 transition border-b-2 border-transparent text-slate-500"><i class="fas fa-fingerprint mr-2"></i> <span>' + ui.tool_tab_sha + '</span></button>';
            }
            if (container) container.innerHTML = html;
            if (config.sha && config.sha.enabled) { renderSHAInputs(); }
            var firstBtn = container ? container.querySelector('.tool-tab-btn') : null;
            if (firstBtn) firstBtn.click();
            var toolSection = document.getElementById('tool');
            if (toolSection) {
                if (html !== '') toolSection.classList.remove('hidden');
                else toolSection.classList.add('hidden');

        function renderSHAInputs() {
            var container = document.getElementById('sha-inputs-area');
            if (!container) return;
            var config = globalToolsConfig.sha.params;
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            var html = '';
            columns.forEach(function(col) {
                html += '<div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">' + col + '</label><input type="text" id="sha_param_' + col + '" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600 bg-white shadow-sm"></div>';
            });
            container.innerHTML = html;
        }

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function switchToolTab(tabId, event) {
            document.querySelectorAll('.tool-content').forEach(function(el) { el.classList.add('hidden'); });
            document.querySelectorAll('.tool-tab-btn').forEach(function(el) {
                el.classList.remove('active', 'border-purple-600', 'text-purple-600');

            if (event && event.currentTarget) {

                event.currentTarget.classList.add('active', 'border-purple-600', 'text-purple-600');

            if (lblKey && lblIv) {

                    var shaConfig = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';
                    lblKey.innerHTML = kLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(Key)</span>';
                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

                                    } else {
                                        resCFcfText = getMsg(ui, 'msg_res_format_other', '本區塊欄位採用 <span class="font-bold text-cyan-700">{format}</span> 格式組合。', {format: resCFcf});

                    });
                    responseHtml += '</div>';
                }
                groupDiv.innerHTML = headerHtml + requestHtml + responseHtml;
                container.appendChild(groupDiv);

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function generateResponseRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');
                
                var mustReturnHtml = (item.must_return === 'V' || item.must_return === true || item.must_return === 'true' || item.must_return === '是' || item.must_return === '1') ? '<span class="text-green-600 font-bold text-lg">✓</span>' : '<span class="text-slate-300">-</span>';

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-slate-700 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + mustReturnHtml + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function renderErrorTable(dataArray, targetId) {
            document.getElementById(targetId).innerHTML = dataArray.map(function(item) {
                return '<tr class="align-middle"><td class="px-6 py-2 font-bold text-red-600 font-mono text-left">' + item.code + '</td><td class="px-6 py-2 text-sm text-slate-700 text-left">' + item.reason + '</td></tr>';
            }).join('');
        }

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
        }

        window.onload = function() {
            initLangDropdown();

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>

                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_qs"></label>
                                <textarea id="encryptInput" rows="5" data-i18n-placeholder="tool_ph_qs" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                                <p class="text-xs text-slate-400 mt-1 text-right" data-i18n="tool_note_urlencode"></p>
                            </div>
                            <button onclick="runEncrypt()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-lock mr-1"></i> <span data-i18n="tool_btn_encrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_hex"></label>
                                <textarea id="encryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Decrypt -->
                        <div id="tool-aes-decrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_enc_hex"></label>
                                <textarea id="decryptInput" rows="4" data-i18n-placeholder="tool_ph_enc_hex" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                            </div>
                            <button onclick="runDecrypt()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-unlock mr-1"></i> <span data-i18n="tool_btn_decrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_decrypt_res"></label>
                                <textarea id="decryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Encryption Rules Section -->
            <section id="encryption" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="enc_title"></h2>
                </div>
                <div id="enc-rule-aes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-lock"></i></span>
                        <span data-i18n="enc_aes_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_aes_desc"></p>
                    <div id="enc-rule-aes-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
                <div id="enc-rule-sha" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-fingerprint"></i></span>
                        <span data-i18n="enc_sha_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_sha_desc"></p>
                    <div id="enc-rule-sha-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
            </section>

            <!-- APIs -->
            <section id="apis" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="nav_apis"></h2>
                </div>
                <div id="api-groups-container"></div>
            </section>

            <!-- Errors -->
            <section id="errors" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="err_title"></h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- Example -->
            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Versions -->
            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
