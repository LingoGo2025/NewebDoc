<span style=\"color: rgb(0, 0, 0);\">4. 電子收據平台回應格式化的字串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"收據計算方式檢核","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.電子收據平台系統僅檢核「商品小計=商品數量 X 商品單價」及「收據金額= 銷售額」。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.收據計算方式，請串接人員務必與公司財會人員進行確認，收據資料關係到公司稅務，請謹慎處理。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"開立收據流程-預約開立","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.當收據開立方式為預約自動開立收據時，收據資料僅暫存於平台，系統於設預計開 立日期自動執行開立收據。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.於預計開立日期前欲提前開立，則可執行「觸發開立收據」，觸發後會立即開出收據。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3.預約開立收據於預約到期日當天 0 時 0 分後，不可取消或執行觸發。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.開立收據後，屆當期上傳排程日(每單月一日)，平台將會把開立資料上傳至「財政 部電子發票整合服務平台」。<\/span><\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]},{"id":"section-5","icon":"fas fa-info-circle","markerColor":"bg-blue-600","title":"開立收據流程-立即開立","desc":"<p><span style=\"color: 計開立日期","example":"2014-10-05","must_return":false,"note":"1.當開立收據方式為預約自動開立收據時(Status=2)，才需要帶此參數。\n2. 格式為 YYYY-MM-DD。","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"預計開立日期延長日","example":"2","must_return":false,"note":"1.當預計開立日期有值時，此參數才有作用。\n2.純數字。\n3.數字表延後開立日期的日數。如 2 代表延後開立日期兩天。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"收據種類","example":"B2B","must_return":false,"note":"B2B=買受人為營利事業單位(有統編)。\nB2C=買受人為個人。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"買受人名稱","example":"藍新科技","must_return":false,"note":"買受人名稱，個人姓名或營利事業單位名稱。當收據種類為 B2B，則此欄位為必填。\nCategory=B2B 時必填","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"買受人統一編號","example":"54352706","must_return":false,"note":"1.買受人(營利事業單位)統編，純數字。\n2.買受人為個人時，則不須填寫。\n3.當收據種類為 B2B，則此欄位為必填。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"買受人地址","example":"台北市南港區南港路二段97號","must_return":false,"note":"買受人的聯絡地址。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"買受人電子信箱","example":"abc@gmail.com","must_return":false,"note":"1.買受人的電子信箱。當收據開立時，寄送收據相關查詢資訊。\n2.若需帶入多個信箱，請以逗號分隔","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"買受人手機","example":"0922123456","must_return":false,"note":"買受人的手機號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務203","must_return":false,"note":"開立收據人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"收據金額","example":"10000","must_return":false,"note":"1.純數字，為收據總金額。\n2.銷售額計算方式，請務必與公司財會人員進行確認。\n3.收據總金額需為商品小計的總和。","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"收據通知信語系","example":"0","must_return":false,"note":"如有買受人電子信箱，將寄送收據開立通知信。若未帶此參數，系統預設參數值為 0(使用中文通知信)。\n0=中文通知信\n1=英文通知信","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"1.多項商品時，商品名稱以 | 分隔。\n2.全部商品名稱總字數最多 280 個字。\n3.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n4.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"商品數量","example":"1|20","must_return":false,"note":"1.多項商品時，商品數量以 |分隔。商品數量需為數字。例：ItemCount =”1|2”\n2.每個商品數量最多為 5 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"商品單位","example":"個|本","must_return":false,"note":"1.內容如：個、件、本、張…..。\n2.多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3.每個商品單位最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"商品單價","example":"200|100","must_return":false,"note":"1.多項商品時，商品單價以 | 分隔。純數字。例：ItemPrice =”200|100”\n2.每個商品單價不能超過 8 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"商品小計","example":"200|200","must_return":false,"note":"1.每個小記為純數字。\n2.計算方式為：數量 * 單價 = 小計。平台將會檢查計算結果。\n3.多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4.每個商品小計金額計算後不能超過 8位數。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"團名","example":"北海道五日|北海道五日","must_return":false,"note":"1.該張收據的團名\n2.全型/半型中文、英數、符號與空格，都算一個字\n3.不接受斷行，與下列特殊符號 : 雙引號 \" | 單引號 ' | 連結符號 & | 與< >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","la <\/span> processing must be completed before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system in asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the store.","msg_res_info_sync":"This result will be synchronously returned by the system via the <span class=\\\"font-bold text-green-700\\\">{method}<\/span> method at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification & Decryption: After receiving, <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be performed on specific data.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After clicking the hash button, the actual full string to be encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_2.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_3.png"},"meta":{"title":"Issue Electronic Receipt API","subtitle":"Issue immediate or scheduled receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide a mechanism for members of various travel industry associations to issue electronic receipts via program integration and upload them to the \"Ministry of Finance Electronic Invoice Integration Service Platform\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide mechanisms and operations related to media reporting. Travel agencies should handle relevant matters themselves. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Please contact the customer service center to apply for IP settings before integration. The number of IPs that can be set is 10.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of calculation for each field is a character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected by \"&amp;\", and no field may contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Receipt Calculation Verification","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The electronic receipt platform system only verifies \"Item Subtotal = Item Quantity X Item Unit Price\" and \"Receipt Amount = Sales Amount\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. For receipt calculation methods, integration personnel must confirm with the company's accounting personnel. Receipt data is related to company taxes; please handle it with caution.<\/span><\/p>"},{"id":"section-3","title":"Receipt Issuance Flow - Immediate Issuance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After the receipt is issued, the platform will upload the issuance data to the \"Ministry of Finance Electronic Invoice Integration Service Platform\" on the current period's upload schedule date (the 1st of every odd-numbered month).<\/span><\/p>"},{"id":"section-4","title":"Receipt Issuance Flow - Scheduled Issuance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. When the receipt issuance method is scheduled automatic issuance, the receipt data is only temporarily stored on the platform, and the system automatically executes the issuance on the set scheduled date. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. If you wish to issue the receipt before the scheduled date, you can execute \"Trigger Receipt Issuance\", which will issue the receipt immediately.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. For scheduled issuance, cancellation or triggering is not allowed after 00:00 on the scheduled expiration date.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. After the receipt is issued, the platform will upload the issuance data to the \"Ministry of Finance Electronic Invoice Integration Service Platform\" on the current period's upload schedule date (the 1st of every odd-numbered month).<\/span><\/p>"},{"id":"section-5","title":"Pre-Integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- A maximum of 10 IPs can be set<\/p><p>- Required: Server external IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different devices; data is not shared. Before going live, ensure that the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Tasks\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still set to example values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID wrong or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Flow_Immediate Issuance"},{"id":"flowchart-1","title":"Receipt Flow_Scheduled Issuance"}]},"apis":[{"name":"Issue Electronic Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency Unified Business Number (Tax ID).","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.1","must_return":false,"note":"Fixed at 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Seconds since the Unix Epoch (January 1 1970 00:00:00 GMT) to the current time. In PHP, this is the value returned by the time() function.\\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Order No","example":"O_201406010001","must_return":false,"note":"1. Travel agency custom order number, limited to English, numbers, and \"_\" format.\\n2. Can be used to correspond with the merchant's internal system, such as order serial numbers, account numbers, etc.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"Issuance Method","example":"1","must_return":false,"note":"1 = Immediate issuance\\n2 = Scheduled automatic issuance (must specify Scheduled Issuance Date)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"Scheduled Issuance Date","example":"2014-10-05","must_return":false,"note":"1. Required only when Status=2 (Scheduled automatic issuance).\\n2. Format: YYYY-MM-DD.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"Scheduled Date Extension","example":"2","must_return":false,"note":"1. Effective only when Scheduled Issuance Date has a value.\\n2. Pure digits.\\n3. Digits represent the number of days to delay issuance. E.g., 2 means delaying the date by two days.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"B2B = Buyer is a business entity (with Tax ID).\\nB2C = Buyer is an individual.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"Buyer Name","example":"Neweb Technologies","must_return":false,"note":"Buyer's name, individual name, or business entity name. Required if Category=B2B.\\nRequired when Category=B2B","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"Buyer Tax ID","example":"54352706","must_return":false,"note":"1. Buyer's (business entity) Tax ID, pure digits.\\n2. Not required when the buyer is an individual.\\n3. Required if Category=B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"No. 97, Section 2, Nangang Road, Nangang District, Taipei City","must_return":false,"note":"Buyer's contact address.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"1. Buyer's email. Used to send receipt query information when issued.\\n2. If multiple emails are needed, please separate them with commas.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"Buyer Mobile","example":"0922123456","must_return":false,"note":"Buyer's mobile phone number.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Operator Name","example":"Sales 203","must_return":false,"note":"Name of the person issuing the receipt. For recording only; system does not verify. If left blank, issuance will fail with an error code.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Receipt Amount","example":"10000","must_return":false,"note":"1. Pure digits, total receipt amount.\\n2. Please confirm the sales amount calculation method with company accounting.\\n3. Total receipt amount must be the sum of item subtotals.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"Notification Language","example":"0","must_return":false,"note":"If a buyer email is provided, a notification will be sent. Default is 0 (Chinese) if not provided.\\n0 = Chinese notification\\n1 = English notification","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Description (Item Name)","example":"Item 1|Item 2","must_return":false,"note":"1. For multiple items, separate with |.\\n2. Total characters for all item names max 280.\\n3. Single item name max 160 characters (each Chinese, English, digit, symbol counts as 1).\\n4. Single receipt max 7 items; for every 40 characters an item name exceeds, the total items allowed decrease by one.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Item Quantity","example":"1|20","must_return":false,"note":"1. For multiple items, separate with |. Must be digits. Example: ItemCount = \"1|2\"\\n2. Each quantity max 5 digits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"Item Unit","example":"pc|vol","must_return":false,"note":"1. Content such as: pc, unit, volume, sheet...\\n2. For multiple items, separate with |. Example: ItemUnit = \"pc|vol\"\\n3. Each unit max 2 characters.","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Item Price","example":"200|100","must_return":false,"note":"1. For multiple items, separate with |. Pure digits. Example: ItemPrice = \"200|100\"\\n2. Each price max 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Item Subtotal","example":"200|200","must_return":false,"note":"1. Each subtotal must be pure digits.\\n2. Calculation: Quantity * Price = Subtotal. The platform will verify this.\\n3. For multiple items, separate with |. Example: ItemAmt = \"200|200\"\\n4. Each calculated subtotal max 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5 Days|Hokkaido 5 Days","must_return":false,"note":"1. Tour name for this receipt.\\n2. Full/half-width Chinese, alphanumeric, symbols, and spaces count as 1 character.\\n3. No line breaks or special characters: double quotes \", single quotes ', &, <, >.","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"X0323|X0323","must_return":false,"note":"1. Tour number for this receipt.\\n2. Full/half-width Chinese, alphanumeric, symbols, and spaces count as 1 character.\\n3. No line breaks or special characters: double quotes \", single quotes ', &, <, >.","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Departure Date","example":"2014-10-05","must_return":false,"note":"1. Format: YYYY-MM-DD. Example: 2014-10-05\\n2. Departure date cannot be more than two years after the actual issuance date.\\n3. A departure reporting reminder will be sent to the specified email on this date (Set in Member Area > Electronic Receipt > Notification Settings).","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Report Remark","example":"0","must_return":false,"note":"0 = Not reported\\n1 = Reported\\nLeave blank or omitted means not reported.","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Remark","example":"This receipt is for the Hokkaido project tour","must_return":false,"note":"1. Receipt remark.\\n2. Supports line breaks (Hex: 0x0A or 0x0D 0x0A). Inserted line breaks will wrap text when printing the receipt.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS if issuance is successful.\\n2. Returns error code if issuance fails.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of this return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Merchant ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order No","example":"O_201406010001","must_return":false,"note":"The custom number provided by the travel agency during issuance.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"20532","must_return":false,"note":"The amount of the issued receipt.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"1. The receipt number for this issuance.\\n2. Null for scheduled issuance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Transaction No","example":"193060","must_return":false,"note":"1. The serial number for this receipt issuance.\\n2. Required parameter for triggering or canceling scheduled issuance.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Random Number","example":"85767715","must_return":false,"note":"1. The 8-digit anti-counterfeit random code generated for this receipt.\\n2. Null for scheduled issuance.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Issuance Time","example":"2014-09-25 12:12:12","must_return":false,"note":"The time this receipt was issued. Example: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"Remaining Count","example":"2003","must_return":false,"note":"The number of remaining available receipt tracks for the travel agency.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check the validity of the returned data. Compare this during integration to verify it was returned by the platform. Refer to \"SHA256 Encryption Description\". Returns null if issuance fails.\\n\\nCheckCode = Hash value calculated from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt per SHA256 signature specs.","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"Display URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. A full URL (including https://).\\n2. This URL can be accessed directly on the website to retrieve receipt data without entering dates or random codes.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"End String","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must check EndStr=## to ensure complete data delivery.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{         function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

            var navContainer = document.getElementById('dynamic-sidebar-links');

            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {

                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';

                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden');

            if (lblKey && lblIv) {

                    var shaConfig = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';
                    lblKey.innerHTML = kLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(Key)</span>';
                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';

                    lblIv.innerHTML = ui.tool_lbl_iv || 'IV';
                }

        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

                        if (hasChildren) {

                                    } else {
                                        resCFcfText = getMsg(ui, 'msg_res_format_other', '本區塊欄位採用 <span class="font-bold text-cyan-700">{format}</span> 格式組合。', {format: resCFcf});

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function generateResponseRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');
                
                var mustReturnHtml = (item.must_return === 'V' || item.must_return === true || item.must_return === 'true' || item.must_return === '是' || item.must_return === '1') ? '<span class="text-green-600 font-bold text-lg">✓</span>' : '<span class="text-slate-300">-</span>';

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-slate-700 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + mustReturnHtml + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function renderErrorTable(dataArray, targetId) {
            document.getElementById(targetId).innerHTML = dataArray.map(function(item) {
                return '<tr class="align-middle"><td class="px-6 py-2 font-bold text-red-600 font-mono text-left">' + item.code + '</td><td class="px-6 py-2 text-sm text-slate-700 text-left">' + item.reason + '</td></tr>';
            }).join('');
        }

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>

        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72 p-4 lg:p-8 min-w-0 w-full max-w-[1920px] mx-auto">
            <div id="dynamic-content-sections"></div>

            <!-- Tools Section -->
            <section id="tool" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-purple-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="tool_title"></h2>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-purple-100 overflow-hidden">
                    <div class="bg-purple-50 p-4 border-b border-purple-100 flex flex-col gap-2">
                        <p class="text-purple-800 text-sm" data-i18n="tool_intro"></p>
                        <div class="bg-red-50 border border-red-200 rounded p-3 flex items-start shadow-sm">
                            <i class="fas fa-shield-alt text-red-500 mt-0.5 mr-2 text-base"></i>
                            <p class="text-red-700 text-sm font-semibold leading-relaxed" data-i18n="tool_security_warning"></p>
                        </div>
                    </div>
                    <div class="flex border-b border-slate-200" id="tool-tabs-container"></div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 pb-6 border-b border-slate-100">
                            <div>
                                <label id="lbl-tool-key" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolKey" data-i18n-placeholder="tool_ph_key" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                            <div>
                                <label id="lbl-tool-iv" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolIv" data-i18n-placeholder="tool_ph_iv" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                        </div>
                        <!-- SHA Tool -->
                        <div id="tool-sha" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-3" data-i18n="tool_lbl_qs"></label>
                                <div id="sha-inputs-area" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200"></div>
                                <p class="text-xs text-slate-400 mt-2 text-right" data-i18n="tool_note_sha_sort"></p>
                            </div>
                            <button onclick="runSHA()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-fingerprint mr-1"></i> <span data-i18n="tool_btn_sha"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_sha_pre_hash"></label>
                                <textarea id="shaPreHashOutput" readonly rows="2" class="w-full p-3 bg-slate-100 text-slate-600 rounded font-mono text-sm border border-slate-200 shadow-inner focus:ring-0 mb-3" data-i18n-placeholder="ph_sha_pre_hash"></textarea>

                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_sha_res"></label>
                                <textarea id="shaOutput" readonly rows="2" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Encrypt -->
                        <div id="tool-aes-encrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_qs"></label>
                                <textarea id="encryptInput" rows="5" data-i18n-placeholder="tool_ph_qs" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                                <p class="text-xs text-slate-400 mt-1 text-right" data-i18n="tool_note_urlencode"></p>
                            </div>
                            <button onclick="runEncrypt()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-lock mr-1"></i> <span data-i18n="tool_btn_encrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_hex"></label>
                                <textarea id="encryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Decrypt -->
                        <div id="tool-aes-decrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_enc_hex"></label>
                                <textarea id="decryptInput" rows="4" data-i18n-placeholder="tool_ph_enc_hex" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                            </div>
                            <button onclick="runDecrypt()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-unlock mr-1"></i> <span data-i18n="tool_btn_decrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_decrypt_res"></label>
                                <textarea id="decryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Encryption Rules Section -->
            <section id="encryption" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="enc_title"></h2>
                </div>
                <div id="enc-rule-aes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-lock"></i></span>
                        <span data-i18n="enc_aes_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_aes_desc"></p>
                    <div id="enc-rule-aes-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
                <div id="enc-rule-sha" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-fingerprint"></i></span>
                        <span data-i18n="enc_sha_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_sha_desc"></p>
                    <div id="enc-rule-sha-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
            </section>

            <!-- APIs -->
            <section id="apis" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="nav_apis"></h2>
                </div>
                <div id="api-groups-container"></div>
            </section>

            <!-- Errors -->
            <section id="errors" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="err_title"></h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- Example -->
            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Versions -->
            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
