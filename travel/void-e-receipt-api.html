an><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"作廢收據規範","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">收據於開立折讓並經確認後，『不』可執行作廢。<\/span><\/p><p>2.預約收據無法作廢，只能發動取消<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">作廢收據後，屆當期上傳排程日(每單月一日)，平台將會把作廢資料上傳至 「財政部電子發票整合服務平台」。<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">收據跨期別後，『不』可執行作廢。（每兩個月為一期別：【1-2】月為一個期別，【3-4】月為一個期別）<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">例如： <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) 【1-2】月此期別開出的收據，需於 3/14(含)前進行作廢，3/15 後將無法 進行作廢。<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) 【3-4】月此期別開出的收據，需於 5/14(含)前進行作廢，5/15 後將無法 進行作廢。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>作廢單：每一次作廢收據，都會有一筆獨立的作廢記錄，稱之為作廢單或是作廢資料<\/p><p>等待作廢：等待消費者同意作廢前，收據仍是有效狀態，此時的作廢單稱為等待作廢<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"收據立即作廢流程"}]},"apis":[{"name":"作廢電子收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","fie  若需帶入多個買受人信箱，請以逗號分隔。\n3. 此欄位用於新增更多收件人，若帶入重複信箱，平台會進行過濾避免重複發送。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.作廢單開立成功，則回傳 SUCCESS\n2.作廢單開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"作廢單流水號","example":"193060","must_return":false,"note":"此次開立作廢或等待作廢的流水號","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次作廢收據或等待作廢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"開立收據時間","example":"2015-07-16 17:00:33","must_return":false,"note":"此次作廢收據的時間，例：2015-07-16 17:00:33。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo ,MerchantOrderNo, RandomNum, TotalAmt不含在此API回應欄位中，需讓程式由InvoiceNumber（收據號碼）於資料庫中來取得這4個欄位資料。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"stri .","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Remarks","enc_title":"Encryption Rules Detail","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the vendor to encrypt or decrypt data via the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Use the Hash Key and Hash IV belonging to the vendor.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a check value via SHA256 hash for verifying the integrity of request parameters or return values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort specified parameters by name (A-Z) and combine into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Append IV and Key","enc_sha_step2_desc":"Prepend HashIV and append HashKey to the sorted string.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the combined string and convert the result to <strong>uppercase<\/strong>.","res_title":"Return Parameters (Response)","err_title":"Error Code Table","err_search_ph":" s=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the store.","msg_res_info_sync":"This result will be synchronously returned by the system via the <span class=\\\"font-bold text-green-700\\\">{method}<\/span> method at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"Returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification & Decryption: Specific data must undergo <span class=\\\"font-bold\\\">{group_type}<\/span> processing after receipt.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After pressing the hash button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_void-e-receipt-api/fc_1.png"},"meta":{"title":"Invalidate Electronic Receipt API","subtitle":"Invalidate an issued electronic receipt","version":"","sections":[{"id":"section-0","title":"Purpose of Integration","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact the customer service center to apply for IP settings. You can set up to 10 IP addresses.<\/span><\/p><p>2. Electronic receipts with an \"Issued\" status can be invalidated.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The travel agency sends receipt data to the electronic receipt platform via \"HTTP POST\" for issuance. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is a character. Chinese characters, English letters, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Invalidation Rules","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">After an allowance is issued and confirmed, the receipt CANNOT be invalidated.<\/span><\/p><p>2. Reserved receipts cannot be invalidated; only cancellation can be initiated.<\/p><p>3.<span style=\"color: rgb(0, 0, 0);\">After invalidating a receipt, the platform will upload the invalidation data to the \"Ministry of Finance E-Invoice Service Platform\" on the upload schedule date of the current period (the 1st day of every odd-numbered month).<\/span><\/p><p>4.<span style=\"color: rgb(0, 0, 0);\">Receipts CANNOT be invalidated across periods. (Each two-month period: [Jan-Feb] is one period, [Mar-Apr] is one period)<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">Example: <\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(1) Receipts issued in the Jan-Feb period must be invalidated by 3/14 (inclusive). Invalidation will not be possible after 3/15.<\/span><\/p><p>\t<span style=\"color: rgb(0, 0, 0);\">(2) Receipts issued in the Mar-Apr period must be invalidated by 5/14 (inclusive). Invalidation will not be possible after 5/15.<\/span><\/p>"},{"id":"section-3","title":"Definitions","desc":"<p>Invalidation Document: Each invalidation of a receipt generates a unique invalidation record, referred to as an invalidation document or invalidation data.<\/p><p>Pending Invalidation: Before the consumer agrees to the invalidation, the receipt remains valid. At this stage, the document is called \"Pending Invalidation\".<\/p>"},{"id":"section-4","title":"Pre-integration Preparation","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IP addresses can be set<\/p><p>- Required Info: Server's outbound IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective Time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments use completely different equipment. Data is not shared. Ensure the URL is switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common Errors from \"Forgetting Pre-integration Preparation\"<\/p><p>- `KEY10001 Not a Travel Agency API Whitelisted IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data Decryption Error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Unable to retrieve data for Travel Agency Tax ID` → MerchantID incorrect or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Immediate Receipt Invalidation Process"}]},"apis":[{"name":"Invalidate Electronic Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_invalid","url_prod":"https://api.travelinvoice.com.tw/invoice_invalid","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are as follows:","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API Version","example":"1.0","must_return":false,"note":"Fixed as 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Number of seconds from the Unix epoch (January 1, 1970 00:00:00 GMT) to the current time. In PHP, this is the value returned by\ntime().\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"Receipt number to be invalidated.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidReason","required":"V","type":"string(10)","label":"Invalidation Reason","example":"Consumer cancelled the order","must_return":false,"note":"Invalidation reason","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handler Name","example":"Sales Window 001","must_return":false,"note":"Name of the person issuing the invalidation. For record only, the system does not validate this. If empty, the issuance will fail and return an error code.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Invalidation Confirmation Method","example":"1","must_return":false,"note":"0=Pending invalidation (refer to \"Manage Pending Invalidation Receipts API\" for cancellation or trigger methods)\n1=Immediate invalidation","enum_values":"0,1","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Invalidation Notification Email","example":"abc@gmail.com","must_return":false,"note":"1. Invalidation notice is sent to the buyer by default.\n2. Separate multiple emails with commas.\n3. Used to add more recipients; duplicates will be filtered.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. SUCCESS if invalidation document created successfully\n2. Error code if invalidation document creation failed","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency tax ID","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Invalidation Serial Number","example":"193060","must_return":false,"note":"Serial number of the invalidation or pending invalidation document.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"Receipt number being invalidated or pending invalidation.","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Receipt Issuance Time","example":"2015-07-16 17:00:33","must_return":false,"note":"Time of invalidation, e.g., 2015-07-16 17:00:33.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check validity of data. Compare this with your calculation to verify it is from the platform. Refer to \"SHA256 Encryption Description\". Returns empty if issuance fails.\n\nCheckCode = SHA256 hash of InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, and TotalAmt are not in this response; retrieve them from your database using InvoiceNumber.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users using String method should check EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not enabled electronic receipts"},{"code":"KEY10007","reason":"Page stayed over 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency tax ID data"},{"code":"KEY10010","reason":"Travel agency tax ID blank"},{"code":"KEY10011","reason":"PostData_ field blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency suspended"},{"code":"NOR10001","reason":"Network connection error"},{"code":"INV10015","reason":"Field length error"},{"code":"LIB10001","reason":"The receipt is not a successfully issued receipt"},{"code":"LIB10002","reason":"Handler name not filled"},{"code":"LIB10004","reason":"Invalidation confirmation method error"},{"code":"LIB10005","reason":"Receipt already invalidated"},{"code":"LIB10006","reason":"Trigger invalidation status error"},{"code":"LIB10007","reason":"An allowance has already been issued for this receipt, it cannot be invalidated"},{"code":"LIB10008","reason":"Past invalidation deadline"},{"code":"LIB10009","reason":"No such invalidation record"},{"code":"LIB10010","reason":"The invalidation record has been cancelled"},{"code":"LIB10011","reason":"The invalidation record status is Failed and cannot be invalidated again"}],"versions":[]},

        const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// Travel Agency Credentials\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('HASH_KEY', 'YOUR_HASH_KEY_HERE');\n\n// 16 bytes — used for both AES-256 IV and SHA256 signature. AES block size is fixed at 16 bytes.\ndefine('HASH_IV', 'YOUR_HASH_IV_HERE');\n\n// API Endpoints\ndefine('API_URL_TEST', 'https://capi.travelinvoice.com.tw/invoice_invalid');\ndefine('API_URL_PRODUCTION', 'https://api.travelinvoice.com.tw/invoice_invalid');\n\n// Safety Shield Check\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || HASH_KEY === 'YOUR_HASH_KEY_HERE' || HASH_IV === 'YOUR_HASH_IV_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"color: #721c24; background-color: #f8d7da; border: 2px solid #f5c6cb; padding: 20px; margin: 30px auto; max-width: 800px; font-weight: bold; font-family: sans-serif; border-radius: 5px;\">';\n    echo '<h3 style=\"margin-top: 0;\">Configuration Error<\/h3>';\n    echo 'CRITICAL: Security placeholders detected. You must replace HASH_KEY, HASH_IV, and MERCHANT_ID with valid travel agency API credentials before running this integration.';\n    echo '<\/div>';\n    exit;\n}\n\n/* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n * Each padding byte value equals paddingLen.\n * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n * to prevent the library from applying its own PKCS7 padding. */\nconst AES_BLOCK_SIZE_32 = 32;\n\n/**\n * Manually pads plaintext to 32-byte block size boundaries.\n *\n * @param string $plaintext\n * @return string\n */\nfunction padPkcs7B32($plaintext) {\n    $len = strlen($plaintext);\n    $padLen = AES_BLOCK_SIZE_32 - ($len % AES_BLOCK_SIZE_32);\n    return $plaintext . str_repeat(chr($padLen), $padLen);\n}\n\n/**\n * Encrypts data using AES-256-CBC with manual 32-byte PKCS7 padding.\n *\n * @param string $plaintext Plaintext query string\n * @param string $key HASH_KEY (32 bytes)\n * @param string $iv HASH_IV (16 bytes)\n * @return string Hexadecimal representation of encrypted data\n * @throws Exception\n */\nfunction encryptAes256Cbc($plaintext, $key, $iv) {\n    $paddedData = padPkcs7B32($plaintext);\n    $encrypted = openssl_encrypt(\n        $paddedData,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n        $iv\n    );\n\n    if ($encrypted === false) {\n        throw new Exception('OpenSSL AES encryption process encountered an internal error.');\n    }\n\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Re-creates the signature to verify the authenticity of the response data from the platform.\n *\n * @param string $iv HashIV (16 bytes)\n * @param string $invoiceTransNo Invoice Transaction Number\n * @param string $merchantId Merchant ID / Travel Agency Tax ID\n * @param string $merchantOrderNo Merchant Order Number\n * @param string $randomNum Random Number\n * @param string $totalAmt Total Amount\n * @param string $key HashKey (32 bytes)\n * @return string Upper-case Hexadecimal SHA-256 Signature\n */\nfunction verifySha256Signature($iv, $invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $key) {\n    $rawString = 'HashIV=' . $iv .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantId .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . $key;\n                 \n    return strtoupper(hash('sha256', $rawString));\n}\n\n// Error Descriptions Mapping\n$errorMapping = [\n    'KEY10001' => 'Non-registered travel agency integration IP address.',\n    'KEY10002' => 'Data decryption failure. Verify your AES Key/IV match the platform settings.',\n    'KEY10003' => 'Invalid interface version specified.',\n    'KEY10004' => 'Incomplete parameter payload.',\n    'KEY10006' => 'Travel agency has not activated digital receipt services.',\n    'KEY10007' => 'Session expired (over 30 minutes idle).',\n    'KEY10009' => 'Unable to locate travel agency record using the provided Tax ID.',\n    'KEY10010' => 'Merchant Tax ID cannot be blank.',\n    'KEY10011' => 'PostData_ parameter payload is empty.',\n    'KEY10012' => 'Data transmission structural failure.',\n    'KEY10013' => 'Null payload received.',\n    'KEY10014' => 'I/O Timeout error on platform operations.',\n    'KEY10015' => 'Amount value violates structural requirements.',\n    'KEY10019' => 'Travel agency authority has been suspended by administrator.',\n    'NOR10001' => 'Network transmission anomaly.',\n    'INV10015' => 'Payload value exceeds permitted attribute length.',\n    'LIB10001' => 'Specified receipt number was not successfully issued previously.',\n    'LIB10002' => 'Handler name field cannot be empty.',\n    'LIB10004' => 'Void processing strategy mode code is invalid.',\n    'LIB10005' => 'Receipt has already been processed as voided.',\n    'LIB10006' => 'Requested void status state machine exception.',\n    'LIB10007' => 'Receipt possesses active credit notes (allowances); void operations blocked.',\n    'LIB10008' => 'Receipt voiding date window has expired.',\n    'LIB10009' => 'No matching receipt found under search terms.',\n    'LIB10010' => 'Void instruction has already been manually cancelled.',\n    'LIB10011' => 'Target receipt void attempt previously failed and cannot be processed again.'\n];\n\n// Execution Results\n$apiResponseRaw = null;\n$parsedResponse = null;\n$executionError = null;\n$signatureVerificationResult = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        // Prepare Payload Fields\n        $version = '1.1';\n        $timestamp = (string)time();\n        $invoiceNumber = isset($_POST['InvoiceNumber']) ? trim($_POST['InvoiceNumber']) : '';\n        $invalidReason = isset($_POST['InvalidReason']) ? trim($_POST['InvalidReason']) : '';\n        $sellerName = isset($_POST['SellerName']) ? trim($_POST['SellerName']) : '';\n        $status = isset($_POST['Status']) ? (int)$_POST['Status'] : 1;\n        $buyerEmail = isset($_POST['BuyerEmail']) ? trim($_POST['BuyerEmail']) : '';\n\n        if (empty($invoiceNumber) || empty($invalidReason) || empty($sellerName)) {\n            throw new Exception('Please fill in all mandatory parameters.');\n        }\n\n        // 1. Build Internal Payload Query String\n        $postDataFields = [\n            'Version' => $version,\n            'TimeStamp' => $timestamp,\n            'InvoiceNumber' => $invoiceNumber,\n            'InvalidReason' => $invalidReason,\n            'SellerName' => $sellerName,\n            'Status' => $status\n        ];\n\n        if ($buyerEmail !== '') {\n            $postDataFields['BuyerEmail'] = $buyerEmail;\n        }\n\n        $plaintextQuery = http_build_query($postDataFields);\n\n        // 2. AES-256-CBC Encrypt Payload with Custom Block Size 32 Padding\n        $encryptedPostData = encryptAes256Cbc($plaintextQuery, HASH_KEY, HASH_IV);\n\n        // 3. Construct Final Request Body\n        $requestBody = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        ];\n\n        // 4. Dispatch cURL Request\n        $targetUrl = API_URL_TEST; // Default to sandbox API\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, $targetUrl);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($requestBody));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n        curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 10);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n\n        $apiResponseRaw = curl_exec($ch);\n\n        if ($apiResponseRaw === false) {\n            $curlError = curl_error($ch);\n            throw new Exception('Network Communication Failure: ' . $curlError);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpStatusCode !== 200) {\n            throw new Exception('Server responded with abnormal status code: ' . $httpStatusCode);\n        }\n\n        // 5. Parse String Response\n        // Platform response is transmitted in a standard string layout, terminating with ##\n        $cleanedResponse = rtrim($apiResponseRaw);\n        if (substr($cleanedResponse, -2) === '##') {\n            $cleanedResponse = substr($cleanedResponse, 0, -2);\n        }\n\n        parse_str($cleanedResponse, $parsedResponse);\n\n        if (!isset($parsedResponse['Status'])) {\n            throw new Exception('Unable to structure platform response into parameter indexes.');\n        }\n\n        // 6. Signature Validation\n        $statusField = $parsedResponse['Status'] ?? '';\n        $checkCodeField = $parsedResponse['CheckCode'] ?? '';\n\n        if ($statusField === 'SUCCESS' && !empty($checkCodeField)) {\n            // Because parameters like 'InvoiceTransNo', 'MerchantOrderNo', 'RandomNum', and 'TotalAmt' \n            // do not reside in the active response stream, travel agencies must query their local records \n            // using the 'InvoiceNumber' returned in the response to fetch these transaction parameters.\n            // \n            // Below, we simulate querying local DB with $parsedResponse['InvoiceNumber']:\n            $dbInvoiceTransNo = 'TX1930602023'; // Mock DB response\n            $dbMerchantOrderNo = 'MOC102484931'; // Mock DB response\n            $dbRandomNum = '8849'; // Mock DB response\n            $dbTotalAmt = '1500'; // Mock DB response\n\n            $computedSignature = verifySha256Signature(\n                HASH_IV,\n                $dbInvoiceTransNo,\n                MERCHANT_ID,\n                $dbMerchantOrderNo,\n                $dbRandomNum,\n                $dbTotalAmt,\n                HASH_KEY\n            );\n\n            if (hash_equals($computedSignature, $checkCodeField)) {\n                $signatureVerificationResult = 'PASSED';\n            } else {\n                $signatureVerificationResult = 'FAILED';\n            }\n        }\n\n    } catch (Exception $e) {\n        $executionError = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>TravelInvoice Void Receipt API Implementation<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; line-height: 1.5; padding: 20px; }\n        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; }\n        h1 { font-size: 24px; color: #1e293b; margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }\n        h2 { font-size: 18px; color: #334155; margin-top: 25px; margin-bottom: 12px; }\n        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }\n        .form-group { display: flex; flex-direction: column; }\n        .form-group.full-width { grid-colum         function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

            if (searchInput) {
                searchInput.addEventListener('input', function(e) {

                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);

            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);

                    i++;

                if (stepsContainer) stepsContainer.innerHTML = stepHtml;

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

                            '<th class="px-6 py-4 text-center w-[8%]">' + (ui.th_must_return || '必回傳') + '</th><th class="px-6 py-4 text-left w-[12%]">' + ui.th_type + '</th>' +

                        if (hasChildren) {
                            resTable.children.forEach(function(childTable) {

                                if (childTable.group_type) childBadges.push('<span class="font-mono font-bold text-purple-700 text-xs bg-purple-100 border border-purple-200 px-2 py-0.5 rounded ml-2" title="' + lblGroupType + '"><i class="fas fa-shield-alt mr-1"></i>' + childTable.group_type + '</span>');
                                if (childTable.param_location) childBadges.push('<span class="font-mono font-bold text-orange-700 text-xs bg-orange-100 border border-orange-200 px-2 py-0.5 rounded ml-2" title="' + lblLocation + '"><i class="fas fa-map-marker-alt mr-1"></i>' + childTable.param_location + '</span>');

                                if (childTable.field_combination_format) {

                                    } else if (resCFcf.toUpperCase() === 'JSON') {
                                        resCFcfText = getMsg(ui, 'msg_res_format_json', '本區塊欄位將放置於 <span class="font-bold text-cyan-700">JSON</span> 物件中傳遞。');
                                    } else {
                                        resCFcfText = getMsg(ui, 'msg_res_format_other', '本區塊欄位採用 <span class="font-bold text-cyan-700">{format}</span> 格式組合。', {format: resCFcf});
                                    }

                                if (childTable.group_type && childTable.group_type !== '無加密') {

                    responseHtml += '</div>';
                }
                groupDiv.innerHTML = headerHtml + requestHtml + responseHtml;

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function generateResponseRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');
                
                var mustReturnHtml = (item.must_return === 'V' || item.must_return === true || item.must_return === 'true' || item.must_return === '是' || item.must_return === '1') ? '<span class="text-green-600 font-bold text-lg">✓</span>' : '<span class="text-slate-300">-</span>';

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-all">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-slate-700 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + mustReturnHtml + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-all">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

        function renderErrorTable(dataArray, targetId) {
            document.getElementById(targetId).innerHTML = dataArray.map(function(item) {
                return '<tr class="align-middle"><td class="px-6 py-2 font-bold text-red-600 font-mono text-left">' + item.code + '</td><td class="px-6 py-2 text-sm text-slate-700 text-left">' + item.reason + '</td></tr>';
            }).join('');
        }

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');
        }

        function applyTranslations(lang) {
            var data = docConfig[lang] ? docConfig[lang].ui : null;
            if (!data) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>

                        <i class="fas fa-lock w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_encryption"></span>
                    </a>
                    <div class="px-4 py-2 text-xs font-bold text-slate-400 uppercase mt-4" data-i18n="nav_group_api" style="letter-spacing:0.05em;"></div>
                    <div id="sidebar-api-list"></div>
                    <a href="#errors" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group mt-4">
                        <i class="fas fa-exclamation-triangle w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_errors"></span>
                    </a>
                    <a href="#example" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group">
                        <i class="fas fa-code w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_example"></span>
                    </a>
                    <a href="#versions" id="nav-versions-link" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group hidden">
                        <i class="fas fa-history w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_versions"></span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 shrink-0 flex flex-col gap-3">
                <div class="relative group w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><i class="fas fa-globe"></i></div>
                    <select id="lang-select" onchange="changeLang(this.value)" class="w-full appearance-none bg-white text-slate-600 font-medium py-2.5 pl-10 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer border border-slate-300 shadow-sm"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500"><i class="fas fa-chevron-up text-xs"></i></div>
                </div>
                <div class="text-center text-xs text-slate-500 mt-2">
                    <div id="meta-system-name" class="font-bold text-slate-600"></div>
                    <div id="meta-copyright" class="mt-1"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72 p-4 lg:p-8 min-w-0 w-full max-w-[1920px] mx-auto">
            <div id="dynamic-content-sections"></div>

            <!-- Tools Section -->
            <section id="tool" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-purple-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="tool_title"></h2>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-purple-100 overflow-hidden">
                    <div class="bg-purple-50 p-4 border-b border-purple-100 flex flex-col gap-2">
                        <p class="text-purple-800 text-sm" data-i18n="tool_intro"></p>
                        <div class="bg-red-50 border border-red-200 rounded p-3 flex items-start shadow-sm">
                            <i class="fas fa-shield-alt text-red-500 mt-0.5 mr-2 text-base"></i>
                            <p class="text-red-700 text-sm font-semibold leading-relaxed" data-i18n="tool_security_warning"></p>
                        </div>
                    </div>
                    <div class="flex border-b border-slate-200" id="tool-tabs-container"></div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 pb-6 border-b border-slate-100">
                            <div>
                                <label id="lbl-tool-key" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolKey" data-i18n-placeholder="tool_ph_key" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                            <div>
                                <label id="lbl-tool-iv" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolIv" data-i18n-placeholder="tool_ph_iv" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                        </div>
                        <!-- SHA Tool -->
                        <div id="tool-sha" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-3" data-i18n="tool_lbl_qs"></label>
                                <div id="sha-inputs-area" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200"></div>
                                <p class="text-xs text-slate-400 mt-2 text-right" data-i18n="tool_note_sha_sort"></p>
                            </div>
                            <button onclick="runSHA()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-fingerprint mr-1"></i> <span data-i18n="tool_btn_sha"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_sha_pre_hash"></label>
                                <textarea id="shaPreHashOutput" readonly rows="2" class="w-full p-3 bg-slate-100 text-slate-600 rounded font-mono text-sm border border-slate-200 shadow-inner focus:ring-0 mb-3" data-i18n-placeholder="ph_sha_pre_hash"></textarea>

                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_sha_res"></label>
                                <textarea id="shaOutput" readonly rows="2" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Encrypt -->
                        <div id="tool-aes-encrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_qs"></label>
                                <textarea id="encryptInput" rows="5" data-i18n-placeholder="tool_ph_qs" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                                <p class="text-xs text-slate-400 mt-1 text-right" data-i18n="tool_note_urlencode"></p>
                            </div>
                            <button onclick="runEncrypt()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-lock mr-1"></i> <span data-i18n="tool_btn_encrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_hex"></label>
                                <textarea id="encryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Decrypt -->
                        <div id="tool-aes-decrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_enc_hex"></label>
                                <textarea id="decryptInput" rows="4" data-i18n-placeholder="tool_ph_enc_hex" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                            </div>
                            <button onclick="runDecrypt()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-unlock mr-1"></i> <span data-i18n="tool_btn_decrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_decrypt_res"></label>
                                <textarea id="decryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Encryption Rules Section -->
            <section id="encryption" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="enc_title"></h2>
                </div>
                <div id="enc-rule-aes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-lock"></i></span>
                        <span data-i18n="enc_aes_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_aes_desc"></p>
                    <div id="enc-rule-aes-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
                <div id="enc-rule-sha" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-fingerprint"></i></span>
                        <span data-i18n="enc_sha_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_sha_desc"></p>
                    <div id="enc-rule-sha-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
            </section>

            <!-- APIs -->
            <section id="apis" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="nav_apis"></h2>
                </div>
                <div id="api-groups-container"></div>
            </section>

            <!-- Errors -->
            <section id="errors" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="err_title"></h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- Example -->
            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Versions -->
            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
