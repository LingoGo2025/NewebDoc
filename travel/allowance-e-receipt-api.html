;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"折讓收據規範","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">收據於開立作廢並經確認後，『不』可執行折讓。<\/span><\/p><p>2.預約收據無法折讓，只能發動取消<\/p><p>3.折讓<span style=\"color: rgb(0, 0, 0);\">收據後，屆當期上傳排程日(每單月一日)，平台將會把折讓資料上傳至 「財政部電子發票整合服務平台」。<\/span><\/p><p>4.折讓收據無期別限制，只要狀態為已開立就可以開立折讓單<\/p><p>5.一張收據可以開立多張折讓單，但已確認折讓單金額加總不得超過收據總金額。<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>折讓單：每一次折讓收據，都會有一筆獨立的折讓記錄，稱之為折讓單或是折讓資料<\/p><p>等待折讓：等待消費者同意折讓前，折讓單稱為等待折讓<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立折讓流程-立即折讓"}]},"apis":[{"name":"折讓電子收據API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"自從 Unix 纪元（格林威治時間 1970 年1 月 1 日 00:00:00）到當前時間的秒數，若以 php 程式語言為例，即為呼叫\ntime()函式所回傳的值。\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"收據號碼","example":"T13671009","must_return":false,"note":"欲執行折讓之收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"自訂編號","example":"Or_5555511","must_return":false,"note":"此次開立折讓的收據，於開立收據時，提供之自訂編號。","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"多項商品時，商品名稱以 | 分隔。例：ItemName=”商品一|商品二\n1.全部商品名稱總字數最多 280 個字。\n2.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n3.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"折讓商品數量","example":"1|1","must_return":false,"note":"1. 商品數量為純數字，每項商品最多 5 位數。\n2. 多項商品時，商品數量以 | 分隔。例：ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"折讓商品單位","example":"個|公斤","must_return":false,"note":"1. 內容如：個、件、本、張…..。\n2. 多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3. 每個商品最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"折讓商品單價","example":"200|100","must_return":false,"note":"1. 單價部分為純數字。\n2. 多項商品時，商品單價以 | 分隔。例：ItemPrice =”200|100”\n3. 每個商品單價金額不能超過 8 位數","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"折讓商品小計","example":"200|200","must_return":false,"note":"1. 小計部分為純數字。\n2. 計算方式為：數量 * 單價 = 小計。平台將會檢查數值是否計算正確。\n3. 多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4. 每個商品小計金額計算後不能超過 8位數","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"折讓總金額","example":"400","must_return":false,"note":"1.此次開立折讓加總金額。總金額不能超過 8 位數。\n2.折讓總金額必須小於等於收據總金額。\n3.折讓總金額需等於全部折讓商品金額總額。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"折讓通知電子信箱","example":"abc@gmail.com","must_return":false,"note":"1. 折讓通知信，平台預設會寄送給買受人\n2. 若需帶入多個買受人信箱，請以逗號分隔。\n3. 此欄位用於新增更多收件人，若帶入重複信箱，平台會進行過濾避免重複發送。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務窗口258","must_return":false,"note":"開立折讓單人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"確認折讓方式","example":"1","must_return":false,"note":"0=開立等待折讓。\n1=立即折讓。","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.作廢單開立成功，則回傳 SUCCESS\n2.作廢單開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"折讓單流水號","example":"193060","must_return":false,"note":"此次開立折讓的系統流水號。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次作廢收據或等待作廢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"Or_5555511","must_return":false,"note":"此次開立折讓的收據，於開立收據時，提供之自訂編\n號。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"折讓金額","example":"400","must_return":false,"note":"此次開立折讓的金額。","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"折讓後剩餘 收據金額","example":"600","must_return":false,"note":"確認折讓後，此張收據剩餘之收據金額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo , RandomNum, TotalAmt不含在此API回應欄位中，需讓程式由InvoiceNumber（收據號碼）於資料庫中來取得這3個欄位資料。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"ALW10002","reason":"此收據號碼折讓總金額超過開立金額"},{"code":"ALW10003","reason":"開立折讓失敗"},{"code":"ALW10004","reason":"觸發折讓狀態失敗"},{"code":"ALW10005","reason":"已確認折讓，無法再執行取消折讓"},{"code":"ALW10006","reason":"折讓商品名稱總計超過 280 個字"},{"code":"ALW10007","reason":"折讓商品名稱超過 7 個商品"},{"code":"ALW10008","reason":"折讓商品數量非純數字"},{"code":"ALW10009","reason":"折讓商品單位字數超過 2 個字"},{"code":"ALW10010","reason":"折讓商品單價超過 8 位數 or 非純數字"},{"code":"ALW10011","reason":"折讓商品小計超過 8 位數 or 非純數字"},{"code":"ALW10012","reason":"折讓總金額超過 8 位數 or 非純數字"},{"code":"ALW10013","reason":"商品資訊的商品小計計算錯誤"},{"code":"ALW10014","reason":"收據金額驗證錯誤"},{"code":"ALW10015","reason":"觸發折讓狀態錯誤"},{"code":"ALW10016","reason":"確認折讓方式錯誤"},{"code":"ALW10017","reason":"折讓單號錯誤"}],"versions":[]},

"en": {"languageName":"English","ui":{"head_title":"Allowance Electronic Receipt API","system_name":"","copyright":"","sidebar_brand":"Allowance Electronic Receipt API","nav_tool":"Encryption Test Tool","nav_group_api":"API Specification Details","nav_apis":"API Specification","nav_encryption":"Encryption Rule Details","nav_errors":"Error Code Table","nav_example":"Example Code","tool_title":"Encryption Test Tool","tool_intro":"This tool helps you generate encrypted strings or decrypt return results.","tool_security_warning":"Security Warning: This tool is for integration testing only. To ensure information security, do not enter your production environment Hash Key and Hash IV here.","tool_tab_encrypt":"AES Encryption","tool_tab_decrypt":"AES Decryption","tool_tab_sha":"SHA256 Encryption","tool_ph_key":"Example: AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"Example: AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"Request Parameters (Query String)","tool_ph_qs":"Example: TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"Please ensure the string has been processed by http_build_query or urlencode","tool_note_sha_sort":"The program will automatically sort the fields below by English name (A-Z), combine them, and concatenate IV/Key at the beginning and end","tool_btn_encrypt":"Execute Encryption to Generate Encrypted String","tool_btn_sha":"Execute SHA256","tool_lbl_hex":"Encryption Result (Hex String)","tool_lbl_enc_hex":"Encrypted String (Hex String)","tool_lbl_sha_res":"SHA256 Result (Uppercase)","tool_ph_enc_hex":"Example: 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"Execute Decryption","tool_lbl_decrypt_res":"Decryption Result (Original Data)","tool_alert_missing_key":"Please enter Hash Key and Hash IV","tool_alert_missing_data":"Please enter the original string","tool_alert_encrypt_fail":"Encryption Failed: ","tool_alert_missing_hex":"Please enter the encrypted Hex string","tool_alert_decrypt_fail":"Decryption failed, please check the Key/IV or encrypted string format","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Testing)","th_param":"Parameter","th_name":"Name","th_required":"Required","th_must_return":"Mandatory Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rule Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the merchant to encrypt or decrypt data through the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal<\/span><br>Key / IV: Please use the Hash Key and Hash IV belonging to the merchant.","enc_step3_title":"Convert to Hexadecimal (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum through SHA256 hashing, which can be used to verify the integrity of request parameters or return values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort specified parameters by English name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Concatenate HashIV and HashKey at the beginning and end of the sorted string respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Return Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Remarks","example_title":"Example Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code example available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modification Date","th_ver_desc":"Changes","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definition","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transfer Location","lbl_belong_to":"Belongs To","msg_req_info":"This request must be initiated by the merchant. Please package the parameters and place them in <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> via <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> for transmission.","msg_req_format_qs":"The fields in this section must be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, for example <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this section must be placed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_req_format_other":"The fields in this section use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_req_security":"Data Security: <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be completed before transmission.","msg_res_info_webhook":"The result will be actively pushed by the system in an asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"The result will be synchronously returned by the system in <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"The returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, for example <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification & Decryption: After receiving, <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be performed on specific data.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After clicking the hash button, the actual full string to be encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_1.png"},"meta":{"title":"Allowance Electronic Receipt API","subtitle":"Issue allowance for issued electronic receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact the customer service center to apply for IP settings. You can set up to 10 IP groups per travel agency. All APIs use the same 10 IP groups.<\/span><\/p><p>2. Electronic receipts with the status 'Issued' can be processed for allowance.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit allowance data to the electronic receipt platform via \"HTTP POST\" for processing. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of calculation for each field is a character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected with \"&amp;\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Allowance Receipt Regulations","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">Allowance \"cannot\" be performed after a receipt has been voided and confirmed.<\/span><\/p><p>2. Appointment receipts cannot be processed for allowance, only cancellation can be initiated.<\/p><p>3. After the <span style=\"color: rgb(0, 0, 0);\">allowance receipt is issued, on the scheduled upload day of the current period (the first day of every odd month), the platform will upload the allowance data to the \"Ministry of Finance Electronic Invoice Integrated Service Platform\".<\/span><\/p><p>4. There is no period restriction for allowance receipts; as long as the status is 'Issued', an allowance note can be issued.<\/p><p>5. Multiple allowance notes can be issued for a single receipt, but the total sum of confirmed allowance notes cannot exceed the total amount of the receipt.<\/p>"},{"id":"section-3","title":"Definitions","desc":"<p>Allowance Note: Every time a receipt is processed for allowance, there will be an independent allowance record, called an allowance note or allowance data.<\/p><p>Awaiting Allowance: Before the consumer agrees to the allowance, the allowance note is called 'Awaiting Allowance'.<\/p>"},{"id":"section-4","title":"Pre-integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Testing Environment: Log in to the testing area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IP groups can be set<\/p><p>- Information needed: Server outbound IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The testing environment and production environment are completely different devices; data is not shared. Before going live, make sure to switch the integration URL to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Tasks\" error signals<\/p><p>- `KEY10001 Not a Travel Agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV is incorrect or still uses example values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID is wrong or not activated<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Issuance Process - Immediate Allowance"}]},"apis":[{"name":"Allowance Electronic Receipt API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are as follows.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed as 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"The number of seconds since the Unix epoch (January 1, 1970, 00:00:00 GMT) to the current time. In PHP, this is the value returned by calling the time() function.\nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"The receipt number for which the allowance is to be executed.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Number","example":"Or_5555511","must_return":false,"note":"The custom number provided at the time the original receipt was issued.","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Description (Item Name)","example":"Item A|Item B","must_return":false,"note":"For multiple items, separate item names with |. Example: ItemName=\"Item A|Item B\"\n1. Total characters for all item names: maximum 280 characters.\n2. A single item name can accept a maximum of 160 characters. Chinese, English, numbers, and symbols all count as one character.\n3. A single receipt can accept a maximum of 7 items. For every 40 characters an item name exceeds, one fewer item can be entered.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Allowance Item Quantity","example":"1|1","must_return":false,"note":"1. Item quantity must be numeric, max 5 digits per item.\n2. For multiple items, separate quantities with |. Example: ItemCount=\"1|2\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Allowance Item Unit","example":"Unit|KG","must_return":false,"note":"1. Contents such as: Unit, Piece, Book, Sheet, etc.\n2. For multiple items, separate units with |. Example: ItemUnit=\"Unit|Book\"\n3. Each item unit max 2 characters. Example: ItemUnit=\"Unit|KG\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Allowance Item Unit Price","example":"200|100","must_return":false,"note":"1. Unit price must be numeric.\n2. For multiple items, separate unit prices with |. Example: ItemPrice=\"200|100\"\n3. Each item unit price amount cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Allowance Item Subtotal","example":"200|200","must_return":false,"note":"1. Subtotal must be numeric.\n2. Calculation: Quantity * Unit Price = Subtotal. The platform will verify if the calculation is correct.\n3. For multiple items, separate subtotals with |. Example: ItemAmt=\"200|200\"\n4. Each item subtotal amount after calculation cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Total Allowance Amount","example":"400","must_return":false,"note":"1. Total sum of the current allowance issuance. Total amount cannot exceed 8 digits.\n2. Total allowance amount must be less than or equal to the total receipt amount.\n3. Total allowance amount must equal the sum of all allowance item amounts.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Allowance Notification Email","example":"abc@gmail.com","must_return":false,"note":"1. The platform defaults to sending the allowance notification email to the buyer.\n2. To include multiple buyer emails, separate them with commas.\n3. This field is for adding more recipients. If duplicate emails are entered, the platform will filter them to avoid duplicate sending.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handler Name","example":"Sales Contact 258","must_return":false,"note":"Name of the person issuing the allowance note. For record-keeping only, no system validation. If empty, issuance will fail and an error code will be returned.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Allowance Confirmation Method","example":"1","must_return":false,"note":"0 = Issue Awaiting Allowance.\n1 = Immediate Allowance.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If allowance note issuance is successful, returns SUCCESS\n2. If allowance note issuance fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the current return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Note Serial Number","example":"193060","must_return":false,"note":"System serial number for the current allowance issuance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number of the current voided receipt or awaiting void receipt.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Number","example":"Or_5555511","must_return":false,"note":"The custom number provided at the time the original receipt was issued.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"Allowance Amount","example":"400","must_return":false,"note":"The amount of the current allowance issuance.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Receipt Amount after Allowance","example":"600","must_return":false,"note":"The remaining amount of this receipt after confirming the allowance.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to verify the legitimacy of the returned data. During integration, this parameter can be compared to verify if it was returned by the platform. For verification methods, refer to \"SHA256 Encryption Instructions\". If issuance fails, a null value is returned.\n\n\nCheckCode = Hash value calculated using SHA256 signature specification based on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, RandomNum, TotalAmt are not included in this API response field. The program must retrieve these 3 fields from the database using the InvoiceNumber (receipt number).","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Always returns ##. Users receiving data via String method must check for EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID blank"},{"code":"KEY10011","reason":"PostData_ field blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Abnormal network connection"},{"code":"ALW10002","reason":"The total allowance amount for this receipt number exceeds the issued amount"},{"code":"ALW10003","reason":"Allowance issuance failed"},{"code":"ALW10004","reason":"Triggering allowance status failed"},{"code":"ALW10005","reason":"Allowance confirmed, cannot cancel         const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE'); // 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('AES_IV', 'YOUR_AES_IV_HERE');   // 16 bytes — IV size is fixed to 16 bytes because AES block size is always 16 bytes (128 bits)\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/allowance_issue'); // Test Environment Endpoint\n\n// Safety check to block execution if placeholder credentials are still present\n$credentialError = false;\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    $credentialError = true;\n}\n\n/**\n * Encrypts the plaintext using AES-256-CBC with custom 32-byte block PKCS7 padding.\n *\n * @param string $plaintext Data string to be encrypted.\n * @param string $key The 32-byte security key.\n * @param string $iv The 16-byte initialization vector.\n * @return string|null Hexadecimal encrypted string or null on failure.\n */\nfunction encryptPayload(string $plaintext, string $key, string $iv): ?string {\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLength = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLength % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encryptedBytes = openssl_encrypt(\n        $paddedPlaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n        $iv\n    );\n\n    if ($encryptedBytes === false) {\n        return null;\n    }\n\n    return bin2hex($encryptedBytes);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Computes and compares the CheckCode signature to verify the integrity and origin of the API response data.\n *\n * @param string $invoiceTransNo Invoice Transaction Number (obtained from local database).\n * @param string $merchantId Travel Agency Unified Business Number.\n * @param string $merchantOrderNo Custom Order Number.\n * @param string $randomNum Random Number associated with the invoice (obtained from local database).\n * @param int $totalAmt Total Invoice/Allowance Amount.\n * @param string $expectedCheckCode The CheckCode signature received or being verified.\n * @param string $key The 32-byte security key used as HashKey.\n * @param string $iv The 16-byte initialization vector used as HashIV.\n * @return bool True if the signature matches, false otherwise.\n */\nfunction verifyResponseSignature(\n    string $invoiceTransNo,\n    string $merchantId,\n    string $merchantOrderNo,\n    string $randomNum,\n    int $totalAmt,\n    string $expectedCheckCode,\n    string $key,\n    string $iv\n): bool {\n    $rawSignatureString = 'HashIV=' . $iv .\n                          '&InvoiceTransNo=' . $invoiceTransNo .\n                          '&MerchantID=' . $merchantId .\n                          '&MerchantOrderNo=' . $merchantOrderNo .\n                          '&RandomNum=' . $randomNum .\n                          '&TotalAmt=' . $totalAmt .\n                          '&HashKey=' . $key;\n\n    $computedHash = strtoupper(hash('sha256', $rawSignatureString));\n    return hash_equals($expectedCheckCode, $computedHash);\n}\n\n// Handle Form Submission and API Request Execution\n$apiResult = null;\n$errorMsg = null;\n$requestPayloadPlain = '';\n$requestPayloadEncrypted = '';\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && !$credentialError) {\n    // Collect and sanitize form inputs\n    $invoiceNo       = trim($_POST['InvoiceNo'] ?? '');\n    $merchantOrderNo = trim($_POST['MerchantOrderNo'] ?? '');\n    $itemName        = trim($_POST['ItemName'] ?? '');\n    $itemCount       = trim($_POST['ItemCount'] ?? '');\n    $itemUnit        = trim($_POST['ItemUnit'] ?? '');\n    $itemPrice       = trim($_POST['ItemPrice'] ?? '');\n    $itemAmt         = trim($_POST['ItemAmt'] ?? '');\n    $totalAmt        = (int)($_POST['TotalAmt'] ?? 0);\n    $buyerEmail      = trim($_POST['BuyerEmail'] ?? '');\n    $sellerName      = trim($_POST['SellerName'] ?? '');\n    $status          = (int)($_POST['Status'] ?? 1);\n\n    // Build the query-string formatted payload\n    $params = [\n        'Version'         => '1.0',\n        'TimeStamp'       => (string)time(),\n        'InvoiceNo'       => $invoiceNo,\n        'MerchantOrderNo' => $merchantOrderNo,\n        'ItemName'        => $itemName,\n        'ItemCount'       => $itemCount,\n        'ItemUnit'        => $itemUnit,\n        'ItemPrice'       => $itemPrice,\n        'ItemAmt'         => $itemAmt,\n        'TotalAmt'        => $totalAmt,\n        'BuyerEmail'      => $buyerEmail,\n        'SellerName'      => $sellerName,\n        'Status'          => $status\n    ];\n\n    $requestPayloadPlain = http_build_query($params);\n    $requestPayloadEncrypted = encryptPayload($requestPayloadPlain, AES_KEY, AES_IV);\n\n    if ($requestPayloadEncrypted === null) {\n        $errorMsg = \"Encryption operation failed. Confirm the configuration and length of the security key and IV.\";\n    } else {\n        // Send request to API via cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n\n        $postFields = http_build_query([\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_'   => $requestPayloadEncrypted\n        ]);\n\n        curl_setopt($ch, CURLOPT_POSTFIELDS, $postFields);\n\n        $response = curl_exec($ch);\n\n        if ($response === false) {\n            $errorMsg = 'Network transfer failed: ' . curl_error($ch);\n        } else {\n            $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n            if ($httpStatusCode !== 200) {\n                $errorMsg = 'API responded with unexpected HTTP Status Code: ' . $httpStatusCode;\n            } else {\n                // Parse the plain string formatted response\n                $responseStr = trim($response);\n                \n                // Validate if response ends with ## as per API specifications\n                if (substr($responseStr, -2) !== '##') {\n                    $errorMsg = \"Malformed response structure detected. End identifier '##' was not found.\";\n                } else {\n                    // Remove trailing ## before parsing parameters\n                    $cleanResponse = substr($responseStr, 0, -2);\n                    parse_str($cleanResponse, $apiResult);\n                }\n            }\n        }\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Allowance Issue API Gateway Test Suite<\/title>\n    <style>\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, \"Se tatus) *<\/label>\n                <select name=\"Status\">\n                    <option value=\"1\">1 = Instant Confirmation (立即折讓)<\/option>\n                    <option value=\"0\">0 = Wait Confirmation (開立等待折讓)<\/option>\n                <\/select>\n            <\/div>\n        <\/div>\n\n        <button type=\"submit\" <?php echo $credentialError ? 'disabled' : ''; ?>>Execute Allowance Request<\/button>\n    <\/form>\n\n    <?php if ($apiResult): ?>\n        <div class=\"debug-panel\">\n            <h3>API Execution Success<\/h3>\n            <p><strong>Endpoint Call Details:<\/strong><\/p>\n            <ul>\n                <li>Target: <?php echo htmlspecialchars(API_URL); ?><\/li>\n                <li>Content-Type: application/x-www-form-urlencoded<\/li>\n            <\/ul>\n\n            <p><strong>Plain Payload (Before Encryption):<\/strong><\/p>\n            <pre style=\"white-space: pre-wrap; word-break: break-all;\"><?php echo htmlspecialchars($requestPayloadPlain); ?><\/pre>\n\n            <p><strong>Encrypted PostData_ Payload (AES-256 Hex):<\/strong><\/p>\n            <pre style=\"white-space: pre-wrap; word-break: break-all;\"><?php echo htmlspecialchars($requestPayloadEncrypted); ?><\/pre>\n\n            <p><strong>Decoded API Response Parameters:<\/strong><\/p>\n            <table class=\"result-table\">\n                <thead>\n                    <tr>\n                        <th>Parameter Key<\/th>\n                        <th>Returned Value<\/th>\n                    <\/tr>\n                <\/thead>\n                <tbody>\n                    <?php foreach ($apiResult as $key => $val): ?>\n                        <tr>\n                            <td><strong><?php echo htmlspecialchars((string)$key); ?><\/strong><\/td>\n                            <td><?php echo htmlspecialchars((string)$val); ?><\/td>\n                        <\/tr>\n                    <?php endforeach; ?>\n                <\/tbody>\n            <\/table>\n\n            <!-- Signature Verification Simulator -->\n            <h3 style=\"margin-top: 30px; color: #3498db;\">Signature (CheckCode) Verification Tool<\/h3>\n            <p>To verify the authenticity of this response, input the required database fields associated with this transaction:<\/p>\n            \n            <form method=\"GET\" action=\"\" id=\"verificationForm\" onsubmit=\"event.preventDefault(); verifyCheckCode();\">\n                <div class=\"grid-2\">\n                    <div class=\"form-group\">\n                        <label style=\"color: #ecf0f1;\">InvoiceTransNo (from DB) *<\/label>\n                        <input type=\"text\" id=\"verify_InvoiceTransNo\" required placeholder=\"e.g. TX1000293\">\n                    <\/div>\n                    <div class=\"form-group\">\n                        <label style=\"color: #ecf0f1;\">RandomNum (from DB) *<\/label>\n                        <input type=\"text\" id=\"verify_RandomNum\" required placeholder=\"e.g. 1234\">\n                    <\/div>\n                <\/div>\n                <button type=\"submit\" style=\"background-color: #2ecc71;\">Validate Response CheckCode<\/button>\n            <\/form>\n\n            <div id=\"verificationResult\" style=\"margin-top: 15px; font-weight: bold; display: none;\"><\/div>\n        <\/div>\n\n        <script>\n            function verifyCheckCode() {\n                const invoiceTransNo = document.getElementById('verify_InvoiceTransNo').value;\n                const randomNum = document.getElementById('verify_RandomNum').value;\n                const merchantId = \"<?php echo htmlspecialchars($apiResult['MerchantID'] ?? ''); ?>\";\n                const merchantOrderNo = \"<?php echo htmlspecialchars($apiResult['MerchantOrderNo'] ?? ''); ?>\";\n                const totalAmt = \"<?php echo htmlspecialchars($apiResult['AllowanceAmt'] ?? '0'); ?>\";\n                const expectedCheckCode = \"<?php echo htmlspecialchars($apiResult['CheckCode'] ?? ''); ?>\";\n                \n                const hashKey = \"<?php echo htmlspecialchars(AES_KEY); ?>\";\n                const hashIv = \"<?php echo htmlspecialchars(AES_IV); ?>\";\n\n                // Build signature verification string: HashIV=...&InvoiceTransNo=...&MerchantID=...&MerchantOrderNo=...&RandomNum=...&TotalAmt=...&HashKey=...\n                const rawString = 'HashIV=' + hashIv +\n                                  '&InvoiceTransNo=' + invoiceTransNo +\n                                  '&MerchantID=' + merchantId +\n                                  '&MerchantOrderNo=' + merchantOrderNo +\n                                  '&RandomNum=' + randomNum +\n                                  '&TotalAmt=' + totalAmt +\n                                  '&HashKey=' + hashKey;\n\n                // Simple Javascript SHA-256 computation to demonstrate verification client-side\n                const textBuffer = new TextEncoder().encode(rawString);\n                crypto.subtle.digest('SHA-256', textBuffer).then(function(hashBuffer) {\n                    const hashArray = Array.from(new Uint8Array(hashBuffer));\n                    const computedHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();\n                    \n                    const resultDiv = document.getElementById('verificationResult');\n                    resultDiv.style.display = 'block';\n                    \n                    if (computedHash === expectedCheckCode.toUpperCase()) {\n                        resultDiv.style.color = '#2ecc71';\n                        resultDiv.innerHTML = '✔ SIGNATURE MATCH: Response verification successful. Integrity confirmed. (CheckCode: ' + computedHash + ')';\n                    } else {\n                        resultDiv.style.color = '#e74c3c';\n                        resultDiv.innerHTML = '❌ SIGNATURE MISMATCH: Generated signature does not match API response CheckCode.<br>Expected: ' + expectedCheckCode + '<br>Computed: ' + computedHash;\n                    }\n                });\n            }\n        <\/script>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {

                var currentId = '';

                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }

                        <i class="fas fa-wrench w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_tool"></span>
                    </a>
                    <a href="#encryption" id="nav-encryption-link" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group mb-4">
                        <i class="fas fa-lock w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_encryption"></span>
                    </a>
                    <div class="px-4 py-2 text-xs font-bold text-slate-400 uppercase mt-4" data-i18n="nav_group_api" style="letter-spacing:0.05em;"></div>
                    <div id="sidebar-api-list"></div>
                    <a href="#errors" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group mt-4">
                        <i class="fas fa-exclamation-triangle w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_errors"></span>
                    </a>
                    <a href="#example" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group">
                        <i class="fas fa-code w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_example"></span>
                    </a>
                    <a href="#versions" id="nav-versions-link" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group hidden">
                        <i class="fas fa-history w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_versions"></span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 shrink-0 flex flex-col gap-3">
                <div class="relative group w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><i class="fas fa-globe"></i></div>
                    <select id="lang-select" onchange="changeLang(this.value)" class="w-full appearance-none bg-white text-slate-600 font-medium py-2.5 pl-10 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer border border-slate-300 shadow-sm"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500"><i class="fas fa-chevron-up text-xs"></i></div>
                </div>
                <div class="text-center text-xs text-slate-500 mt-2">
                    <div id="meta-system-name" class="font-bold text-slate-600"></div>
                    <div id="meta-copyright" class="mt-1"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72 p-4 lg:p-8 min-w-0 w-full max-w-[1920px] mx-auto">
            <div id="dynamic-content-sections"></div>

            <!-- Tools Section -->
            <section id="tool" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-purple-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="tool_title"></h2>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-purple-100 overflow-hidden">
                    <div class="bg-purple-50 p-4 border-b border-purple-100 flex flex-col gap-2">
                        <p class="text-purple-800 text-sm" data-i18n="tool_intro"></p>
                        <div class="bg-red-50 border border-red-200 rounded p-3 flex items-start shadow-sm">
                            <i class="fas fa-shield-alt text-red-500 mt-0.5 mr-2 text-base"></i>
                            <p class="text-red-700 text-sm font-semibold leading-relaxed" data-i18n="tool_security_warning"></p>
                        </div>
                    </div>
                    <div class="flex border-b border-slate-200" id="tool-tabs-container"></div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 pb-6 border-b border-slate-100">
                            <div>
                                <label id="lbl-tool-key" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolKey" data-i18n-placeholder="tool_ph_key" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                            <div>
                                <label id="lbl-tool-iv" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolIv" data-i18n-placeholder="tool_ph_iv" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                        </div>
                        <!-- SHA Tool -->
                        <div id="tool-sha" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-3" data-i18n="tool_lbl_qs"></label>
                                <div id="sha-inputs-area" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200"></div>
                                <p class="text-xs text-slate-400 mt-2 text-right" data-i18n="tool_note_sha_sort"></p>
                            </div>
                            <button onclick="runSHA()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-fingerprint mr-1"></i> <span data-i18n="tool_btn_sha"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_sha_pre_hash"></label>
                                <textarea id="shaPreHashOutput" readonly rows="2" class="w-full p-3 bg-slate-100 text-slate-600 rounded font-mono text-sm border border-slate-200 shadow-inner focus:ring-0 mb-3" data-i18n-placeholder="ph_sha_pre_hash"></textarea>

                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_sha_res"></label>
                                <textarea id="shaOutput" readonly rows="2" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Encrypt -->
                        <div id="tool-aes-encrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_qs"></label>
                                <textarea id="encryptInput" rows="5" data-i18n-placeholder="tool_ph_qs" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                                <p class="text-xs text-slate-400 mt-1 text-right" data-i18n="tool_note_urlencode"></p>
                            </div>
                            <button onclick="runEncrypt()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-lock mr-1"></i> <span data-i18n="tool_btn_encrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_hex"></label>
                                <textarea id="encryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Decrypt -->
                        <div id="tool-aes-decrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_enc_hex"></label>
                                <textarea id="decryptInput" rows="4" data-i18n-placeholder="tool_ph_enc_hex" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                            </div>
                            <button onclick="runDecrypt()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-unlock mr-1"></i> <span data-i18n="tool_btn_decrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_decrypt_res"></label>
                                <textarea id="decryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Encryption Rules Section -->
            <section id="encryption" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="enc_title"></h2>
                </div>
                <div id="enc-rule-aes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-lock"></i></span>
                        <span data-i18n="enc_aes_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_aes_desc"></p>
                    <div id="enc-rule-aes-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
                <div id="enc-rule-sha" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-fingerprint"></i></span>
                        <span data-i18n="enc_sha_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_sha_desc"></p>
                    <div id="enc-rule-sha-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
            </section>

            <!-- APIs -->
            <section id="apis" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="nav_apis"></h2>
                </div>
                <div id="api-groups-container"></div>
            </section>

            <!-- Errors -->
            <section id="errors" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="err_title"></h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- Example -->
            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Versions -->
            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
