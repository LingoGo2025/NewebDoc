(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"變更收據流程"}]},"apis":[{"name":"變更收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","re t the result to <strong>uppercase<\/strong>.","res_title":"Return Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Note","example_title":"Example Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code example available yet","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modification Date","th_ver_desc":"Change Content","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definition","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Is Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transfer Location","lbl_belong_to":"Belongs To","msg_req_info":"This request must be launched by the store. Please pack the parameters and place them in <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> for transmission via <span class=\\\"font-bold text-blue-700\\\">{method}<\/span>.","msg_req_format_qs":"The fields in this block must be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this block must be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_req_format_other":"The fields in this block use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_req_security":"Data Security: <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be completed before transmission.","msg_res_info_webhook":"The system will actively push this result asynchronously to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the store.","msg_res_info_sync":"The system will return this result synchronously in <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification/Decryption: Specific data must undergo <span class=\\\"font-bold\\\">{group_type}<\/span> processing after receipt.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After pressing the signature button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_1.png"},"meta":{"title":"Change Receipt API","subtitle":"Change Receipt Issuance Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. To provide a mechanism for members under various travel industry associations to change electronic receipts via programmatic integration. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide mechanisms or operations related to media reporting; travel agencies should handle such matters themselves. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Before integration, please contact the customer service center to apply for IP settings. The number of IP groups that can be set is: 10 groups.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of measurement for each field is characters. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected using \"&amp;\" as a separator; this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparation","desc":"<p>(Please complete first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- A maximum of 10 IP groups can be set<\/p><p>- Required: Server outbound IP (not intranet IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different systems; data is not shared. Before going live, make sure to switch the integration URL to the production area URL<\/p><p><br><\/p><p>4. Common \"Forgot to do preparation\" error signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV is incorrect or still the example value<\/p><p>- `KEY10009 Unable to retrieve data for the travel agency UBN` → MerchantID is wrong or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Change Receipt Process"}]},"apis":[{"name":"Change Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":false,"note":"Travel agency unified business number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"The string field combination encrypted with AES256. Field descriptions are as follows.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed to 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"The number of seconds from the Unix epoch (January 1, 1970 00:00:00 GMT) to the current time. For example, in PHP, it is the value returned by the time() function.\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671007","must_return":false,"note":"The receipt number for which the allowance is being issued.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"B2B = Buyer is a business entity (UBN required).\nB2C = Buyer is an individual.\n1. Receipt change operations are limited to once (changeable fields include: Receipt Category, Buyer Name, Buyer UBN)\n2. Leaving it blank or omitting this field means the data will not be changed.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao-yi","must_return":false,"note":"1. Buyer name, individual name or business entity name.\n2. Receipt change operations are limited to once (changeable fields include: Receipt Category, Buyer Name, Buyer UBN)\n3. When the receipt category is changed from B2C to B2B, this is a required field and cannot be null.\n4. Leaving it blank or omitting this field means the data will not be changed.\n5. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. Buyer (business entity) UBN, numbers only.\n2. When the buyer is an individual, this does not need to be filled.\n3. Receipt change operations are limited to once (changeable fields include: Receipt Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address)\n4. When the receipt category is changed from B2C to B2B, this is a required field and cannot be null.\n5. When the receipt category is changed from B2B to B2C, the system will clear the original value.\n6. Leaving it blank or omitting this field means the data will not be changed.\n7. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"1. The buyer's mobile phone number.\n2. Leaving it blank or omitting this field means the data will not be changed.\n3. Receipt change operations are limited to once (changeable fields include: Receipt Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address)\n4. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F., No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"1. The buyer's address.\n2. Leaving it blank or omitting this field means the data will not be changed.\n3. Receipt change operations are limited to once (changeable fields include: Receipt Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address)\n4. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Note","example":"Air Ticket","must_return":false,"note":"1. Note for this receipt.\n2. Leaving it blank or omitting this field means the data will not be changed.\n3. Changes are unlimited.\n4. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"1. Changes are unlimited.\n2. To clear this field data, please enter *[clean]*\n3. Full-width/half-width Chinese, alphanumeric characters, symbols, and spaces each count as one character.\n4. Line breaks and the following special characters are not accepted: Double quotes \" | Single quotes ' | Ampersand & | and < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"Ba023355","must_return":false,"note":"1. Changes are unlimited.\n2. To clear this field data, please enter *[clean]*\n3. Line breaks and the following special characters are not accepted: Double quotes \" | Single quotes ' | Ampersand & | and < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Departure Date","example":"2014-10-05","must_return":false,"note":"1. Format is YYYY-MM-DD. Example: 2014-10-05\n2. The estimated departure date must not be more than two years after the actual issuance date of the receipt.\n3. Changes are unlimited.\n4. To clear this field data, please enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Declaration Note","example":"0","must_return":false,"note":"0 = Not declared\n1 = Declared\nLeaving it blank or omitting this parameter means the data will not be changed.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS if receipt issuance is successful.\n2. Returns error code if receipt issuance fails.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text, description of the return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency unified business number","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number issued this time","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao-yi","must_return":false,"note":"Buyer name at the time of receipt issuance, individual name or business name.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. If it's a B2B receipt, this field is the buyer's UBN.\n2. If it's a B2C receipt, this field is null.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"The buyer's mobile phone number.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F., No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"The buyer's address.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Note","example":"Air Ticket","must_return":false,"note":"Note for this receipt.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"Tour name for this receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"Ba023355","must_return":false,"note":"Tour number for this receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Departure Date","example":"2014-10-05","must_return":false,"note":"The departure date for this receipt. A tour declaration reminder notification email will be sent to the designated mailbox on the departure date.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Declaration Note","example":"0","must_return":false,"note":"The declaration note field for this receipt\n0 = Not declared\n1 = Declared","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(50)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check the validity of this data return. During integration, you can compare this parameter data to verify if it was returned by the platform. For verification methods, please refer to \"SHA256 Encryption Instructions\". Returns null if issuance fails.\n\nCheckCode = Hash value calculated from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Always returns ##. Users receiving data via String method must additionally verify EndStr=## to ensure complete data transfer.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve data for the travel agency UBN"},{"code":"KEY10010","reason":"Travel agency UBN is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transfer error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has no application for mail printing value-added service"},{"code":"KEY10017","reason":"Insufficient available quantity for mail printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Abnormal network connection"},{"code":"INV20014","reason":"Incorrect UBN format"},{"code":"INV20015","reason":"Buyer UBN not filled"},{"code":"INV20016","reason":"Buyer name not filled"},{"code":"INV20018","reason":"Incorrect appointment tour date format"},{"code":"INV20100","reason":"Severe database error"},{"code":"INV20101","reason":"Declaration note error"},{"code":"INV20102","reason":"Tour name field exceeds character limit, please shorten."},{"code":"INV20103","reason":"Tour number field exceeds character limit, please shorten."},{"code":"INV20104","reason":"Tour name field contains special symbols such as \"\" ' & < >, please remove."},{"code":"INV20105","reason":"Tour number field contains special symbols such as \"\" ' & < >, please remove."},{"code":"ED10001","reason":"Incorrect appointment tour date format"},{"code":"ED10002","reason":"Incorrect declaration note input"},{"code":"ED10006","reason":"Estimated departure date cannot be greater than two years"},{"code":"ED10009","reason":"Data type error"},{"code":"ED10011","reason":"Data not changed"},{"code":"ED10012","reason":"When the receipt category is B2B, buyer UBN or buyer name cannot be empty"},{"code":"ED10013","reason":"This receipt has been uploaded to the Ministry of Finance Financial Data Center! Accordin         const globalCodeExamples = {"PHP":"<?php\n/*\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_API_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\ndefine('API_KEY', 'YOUR_API_KEY_HERE'); // 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('API_IV', 'YOUR_API_IV_HERE');   // 16 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/invoice_edit'); // Test endpoint\n\n// Credential Verification Guard\n$credentialError = false;\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_API_KEY_HERE' || API_IV === 'YOUR_API_IV_HERE') {\n    $credentialError = true;\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Verifies the SHA256 CheckCode returned from the API response to ensure data integrity.\n * The parameters are concatenated in alphabetical order of their keys, prefixed with HashIV and suffixed with HashKey.\n *\n * @param array $responseFields Parse response key-value pairs\n * @return string The computed SHA256 signature in uppercase hex\n */\nfunction verifyResponseSignature(array $responseFields) {\n    $invoiceTransNo = $responseFields['InvoiceTransNo'] ?? '';\n    $merchantID = $responseFields['MerchantID'] ?? '';\n    $merchantOrderNo = $responseFields['MerchantOrderNo'] ?? '';\n    $randomNum = $responseFields['RandomNum'] ?? '';\n    $totalAmt = $responseFields['TotalAmt'] ?? '';\n\n    // Direct string concatenation without URL encoding to comply with security requirements\n    $rawString = 'HashIV=' . API_IV .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantID .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . API_KEY;\n\n    return strtoupper(hash('sha256', $rawString));\n}\n\n$apiResult = null;\n$errorMsg = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && !$credentialError) {\n    try {\n        // Enforce key and IV lengths based on cryptographic standards\n        if (strlen(API_KEY) !== 32) {\n            throw new Exception(\"AES-256 key size must be exactly 32 bytes.\");\n        }\n        if (strlen(API_IV) !== 16) {\n            throw new Exception(\"AES IV size must be exactly 16 bytes. IV is 16 bytes because the AES native block size is always 16 bytes.\");\n        }\n\n        // Construct PostData plain text parameters\n        $postDataParams = [\n            'Version'          => '1.0', // Required\n            'TimeStamp'        => (string)time(), // Required\n            'InvoiceNumber'    => trim($_POST['InvoiceNumber'] ?? ''), // Required\n            'Category'         => trim($_POST['Category'] ?? ''),\n            'BuyerName'        => trim($_POST['BuyerName'] ?? ''),\n            'BuyerUBN'         => trim($_POST['BuyerUBN'] ?? ''),\n            'BuyerMobilePhone' => trim($_POST['BuyerMobilePhone'] ?? ''),\n            'BuyerAddress'     => trim($_POST['BuyerAddress'] ?? ''),\n            'Comment'          => trim($_POST['Comment'] ?? ''),\n            'TourName'         => trim($_POST['TourName'] ?? ''),\n            'TourNo'           => trim($_POST['TourNo'] ?? ''),\n            'TourDate'         => trim($_POST['TourDate'] ?? ''),\n            'TaxNoted'         => trim($_POST['TaxNoted'] ?? '')\n        ];\n\n        // Filter empty parameters except those required or explicitly set to [clean]\n        $filteredParams = [];\n        foreach ($postDataParams as $key => $val) {\n            if ($val !== '' || $key === 'Version' || $key === 'TimeStamp' || $key === 'InvoiceNumber') {\n                $filteredParams[] = $key . '=' . $val;\n            }\n        }\n        $plaintext = implode('&', $filteredParams);\n\n        /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n         * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n         * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n         * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n         * Each padding byte value equals paddingLen.\n         * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n         * to prevent the library from applying its own PKCS7 padding. */\n        $blockSize = 32;\n        $plaintextLen = strlen($plaintext);\n        $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n        $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n        $encryptedRaw = openssl_encrypt(\n            $paddedPlaintext,\n            'AES-256-CBC',\n            API_KEY,\n            OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n            API_IV\n        );\n\n        if ($encryptedRaw === false) {\n            throw new Exception('AES Encryption process failed.');\n        }\n\n        $encryptedHex = bin2hex($encryptedRaw);\n\n        // Prepare parameters for POST body\n        $postFields = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_'   => $encryptedHex\n        ];\n\n        // Execute request using cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($postFields));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n        $response = curl_exec($ch);\n\n        if ($response === false) {\n            $curlError = curl_error($ch);\n            // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n            throw new Exception('cURL Connection error: ' . $curlError);\n        }\n\n        $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n\n        if ($httpCode !== 200) {\n            throw new Exception('Server responded with HTTP Status Code: ' . $httpCode);\n        }\n\n        // Parse Response Body\n        $responseBody = trim($response);\n        if (substr($responseBody, -2) !== '##') {\n            throw new Exception('Incomplete response received from the gateway.');\n        }\n\n        // Parse key-value query string response\n        parse_str($responseBody, $responseFields);\n\n        // Verify CheckCode if provided in a successful transaction\n        $status = $responseFields['Status'] ?? '';\n        $checkCode = $responseFields['CheckCode'] ?? '';\n\n        if ($status === 'SUCCESS' && $checkCode !== '') {\n            $computedSignature = verifyResponseSignature($responseFields);\n            if (!hash_equals($computedSignature, $checkCode)) {\n                throw new Exception('Response signature verification failed. The signature does not match.');\n            }\n        }\n\n        $apiResult = $responseFields;\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Receipt Modification API Demo<\/title>\n    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css\" rel=\"stylesheet\">\n    <style>\n        body { background-color: #f8f9fa; }\n        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }\n        .alert-danger-custom { background-color: #f8d7da; border-color: #f5c2c7; color: #842029; }\n    <\/style>\n<\/head>\n<body>\n<div class=\"container py-5\">\n    <div class=\"row justify-content-center\">\n        <div class=\"col-lg-10\">\n            <h2 class=\"text-center mb-4 text-primary\">Travel Invoice Modification Service<\/h2>\n\n            <!-- Critical Configuration Guard Alert -->\n            <?php if ($credentialError): ?>\n                <div class=\"alert alert-danger alert-danger-custom p-4 mb-4\" role=\"alert\">\n                    <h4 class=\"alert-heading fw-bold\">Configuration Error detected!<\/h4>\n                    <p class=\"mb-0\">Placeholder credentials detected (<strong>YOUR_MERCHANT_ID_HERE<\/strong>, <strong>YOUR_API_KEY_HERE<\/strong>, or <strong>YOUR_API_IV_HERE<\/strong>). You must configure valid production or testing API credentials in the script header before executing any API calls.<\/p>\n                <\/div>\n            <?php endif; ?>\n\n            <?php if ($errorMsg !== null): ?>\n                <div class=\"alert alert-danger\" role=\"alert\">\n                    <h5 class=\"alert-heading fw-bold\">Exception Encountered<\/h5>\n                    <p class=\"mb-0\"><?php echo htmlspecialchars($errorMsg, ENT_QUOTES, 'UTF-8'); ?><\/p>\n                <\/div>\n            <?php endif; ?>\n\n            <?php if ($apiResult !== null): ?>\n                <div class=\"card mb-4 border-success\">\n                    <div class=\"card-header bg-success text-white fw-bold\">API Transaction Result<\/div>\n                    <div class=\"card-body\">\n                        <div class=\"row\">\n                            <div class=\"col-md-6\">\n                                <p><strong>Status:<\/strong> <span class=\"badge bg-<?php echo ($apiResult['Status'] ?? '') === 'SUCCESS' ? 'success' : 'danger'; ?>\"><?php echo htmlspecialchars($apiResult['Status'] ?? 'UNKNOWN', ENT_QUOTES, 'UTF-8'); ?><\/span><\/p>\n                                <p><strong>Message:<\/strong> <?php echo htmlspecialchars($apiResult['Message']         function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';
                var sectionBody = '';
                if (sec.desc && sec.desc.trim() !== '') {
                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base whitespace-pre-line mb-6 last:mb-0">' + sec.desc + '</div>';
                }
                if (sec.images && sec.images.length > 0) {
                    sectionBody += '<div class="space-y-8">' + sec.images.map(function(url) {
                        return '<div class="border rounded-lg overflow-hidden cursor-pointer" onclick="openLightbox(\'' + url + '\')"><img src="' + url + '" class="w-full h-auto hover:opacity-90 transition-opacity"></div>';
                    }).join('') + '</div>';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 ' + markerColor + ' mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + sec.title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200">' + sectionBody + '</div></section>';
            });

            if (navContainer) navContainer.innerHTML = navHtml;
            if (contentContainer) {
                contentContainer.innerHTML = contentHtml;
                
                var descImages = contentContainer.querySelectorAll('img');
                descImages.forEach(function(img) {
                    img.classList.add('cursor-pointer', 'hover:opacity-90', 'transition-opacity');
                    img.onclick = function() {
                        openLightbox(this.src);
                    };
                });
            }
        }

        function renderFlowcharts() {
            var meta = docConfig[currentLang].meta;
            var ui = docConfig[currentLang].ui;
            var flowcharts = meta.flowcharts || [];
            
            if (flowcharts.length === 0) return;

            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            
            var navHtml = '';
            var contentHtml = '';

            flowcharts.forEach(function(fc) {
                var sectionId = fc.id; 
                if (!sectionId) return;
                var title = fc.title || '流程圖';
                
                // 將 id 的中線轉換為底線，對應 ui 的 key (例如 flowchart-0 -> flowchart_0_url)
                var urlKey = sectionId.replace(/-/g, '_') + '_url'; 
                var imgUrl = ui[urlKey];

                if (!imgUrl) return; // 如果 ui 中沒有此網址則跳過

                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="fas fa-project-diagram w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + title + '</span></a>';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 bg-indigo-500 mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200 overflow-x-auto text-center"><img src="' + imgUrl + '" alt="' + title + '" class="inline-block max-w-full h-auto cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(\'' + imgUrl + '\')"></div></section>';

        }

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';

                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function switchToolTab(tabId, event) {
            document.querySelectorAll('.tool-content').forEach(function(el) { el.classList.add('hidden'); });
            document.querySelectorAll('.tool-tab-btn').forEach(function(el) {
                el.classList.remove('active', 'border-purple-600', 'text-purple-600');
                el.classList.add('border-transparent', 'text-slate-500');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.remove('border-transparent', 'text-slate-500');
                event.currentTarget.classList.add('active', 'border-purple-600', 'text-purple-600');
            }
            var targetContent = document.getElementById(tabId);
            if (targetContent) targetContent.classList.remove('hidden');

            var ui = docConfig[currentLang].ui;
            var lblKey = document.getElementById('lbl-tool-key');
            var lblIv = document.getElementById('lbl-tool-iv');
            if (lblKey && lblIv) {
                if (tabId === 'tool-sha') {
                    var shaConfig = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';
                    lblKey.innerHTML = kLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(Key)</span>';
                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';
                } else {
                    lblKey.innerHTML = ui.tool_lbl_key || 'KEY';
                    lblIv.innerHTML = ui.tool_lbl_iv || 'IV';
                }
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {

            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
