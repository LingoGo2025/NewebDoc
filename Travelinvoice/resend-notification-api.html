串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"通知信補發呼叫流程圖"}]},"apis":[{"name":"補發通知信API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"發信類型","example":"1","must_return":false,"note":"依據所需發信的類型，給予對應參數。\n1=開立信\n2=折讓\n3=作廢","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次查詢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"折讓、作廢流水號","example":"8952","must_return":false,"note":"此次補發信的折讓單號或作廢單號。若MailType 為 2 或 3 才需傳入","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"收件人 Email","example":"abc@gmail.com","must_return":false,"note":"此次補發信的 Mail 信箱，可用半型逗號區隔多信箱。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.查詢成功，則回傳 SUCCESS\n2.查詢失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":true,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA ethod":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code example available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Date","th_ver_desc":"Description","toc_title":"Table of Contents","api_info_title":"Basic API Information","field_def_title":"API Field Definition","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Execution Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Delivery Location","lbl_belong_to":"Belongs To","msg_req_info":"This request must be initiated by the merchant. Please package the parameters and transmit them using the <span class=\"font-bold text-blue-700\">{method}<\/span> method at <span class=\"font-bold text-blue-700\">{location}<\/span>.","msg_req_format_qs":"Fields in this section must be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"Fields in this section must be transmitted within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_req_format_other":"Fields in this section use the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_req_security":"Data Security: <span class=\"font-bold\">{group_type}<\/span> processing is required before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system asynchronously to the <span class=\"font-bold text-green-700\">Webhook<\/span> URL specified by the merchant.","msg_res_info_sync":"This result will be synchronously returned by the system at <span class=\"font-bold text-green-700\">{location}<\/span> using the <span class=\"font-bold text-green-700\">{method}<\/span> method.","msg_res_format_qs":"Returned fields will be combined into a Query String format using the <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> symbol, e.g., <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be transmitted within a <span class=\"font-bold text-cyan-700\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\"font-bold text-cyan-700\">{format}<\/span> format.","msg_res_security":"Verification/Decryption: <span class=\"font-bold\">{group_type}<\/span> processing is required for specific data after receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After pressing the hash button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_1.png"},"meta":{"title":"Resend Notification Letter API","subtitle":"Resend receipt issuance, cancellation, or allowance documents","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Allows members of travel agent associations to resend notification letters via API integration. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This API uses MailType to distinguish whether to resend receipt issuance, cancellation, or allowance documents, and requires specifying the EMAIL address for the notification. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. This platform does not provide media reporting mechanisms; travel agencies must handle such tasks themselves.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field's unit of calculation is by character. Chinese characters, English letters, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\", and fields themselves must not contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Prerequisites","desc":"<p>(Please complete these first, otherwise integration will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test portal → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production portal → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application process: Download and fill out the form from the official website, then send it to customer support (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server's public IP (not internal IP, check at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- Test and production environments are completely separate systems; data is not shared. Ensure you switch to the production URL before going live.<\/p><p><br><\/p><p>4. Common \"Missing Prerequisites\" Error Signals<\/p><p>- `KEY10001 Not a travel agent API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still set to example values<\/p><p>- `KEY10009 Cannot retrieve travel agency tax ID data` → MerchantID incorrect or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Notification Resend Flowchart"}]},"apis":[{"name":"Resend Notification Letter API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Fields are combined and then AES256 encrypted. See table below for field descriptions.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API Version","example":"1.0","must_return":false,"note":"Fixed as 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Time Stamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds) from 1970-01-01 00:00:00 UTC.\ne.g.: 2014-05-15 15:00:00 is 1400137200, it is recommended to use the current time","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Mail Type","example":"1","must_return":false,"note":"Provide parameters based on the required type.\n1=Issuance Letter\n2=Allowance\n3=Cancellation","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this query.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Allowance/Cancellation Serial No","example":"8952","must_return":false,"note":"The allowance or cancellation number for this resend. Required only if MailType is 2 or 3.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Recipient Email","example":"abc@gmail.com","must_return":false,"note":"The email for this resend. Multiple emails can be separated by half-width commas.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Messages","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Query successful, returns SUCCESS\n2. Query failed, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":true,"note":"Travel agency tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Used to verify the validity of the returned data. You can compare this parameter to verify if it was returned by the platform. Please refer to \"SHA256 Encryption Description\" for the verification method. Not returned if the request fails.\n\nCheckCode = Hash of (InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt) calculated per SHA256 specs.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. They must be saved locally when the receipt is initially issued for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String format must verify EndStr=## to ensure data integrity.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agent API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for electronic receipts"},{"code":"KEY10007","reason":"Page idle for over 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency tax ID data"},{"code":"KEY10010","reason":"Travel agency tax ID empty"},{"code":"KEY10011","reason":"PostData_ field empty"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data empty"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O time out"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for postal printing add-on service"},{"code":"KEY10017","reason":"Insufficient postal printing add-on credits"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection exception"},{"code":"INV70001","reason":"Field data format error"},{"code":"SM10001","reason":"Mail type error (please check MailType field)"},{"code":"SM10002","reason":"Notification email error (please check BuyerEmail field)"},{"code":"BS10006","reason":"Receipt data not found"},{"code":"BS10015","reason":"Allowance number empty"},{"code":"BS10016","reason":"Cancellation number empty"},{"code":"BS10017","reason":"Allowance document not found"},{"code":"BS10018","reason":"Cancellation document not found"}],"versions":[]},

t-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内で送信する必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了させる必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、ストアが指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLへプッシュ通知されます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期返信されます。","msg_res_format_qs":"返信されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>","msg_res_format_json":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内で送信されます。","msg_res_format_other":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号化：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押した後、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_2.png"},"meta":{"title":"通知再送信用API","subtitle":"領収書発行、無効化伝票または値引伝票の再送","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行業商業同業組合の会員向けに、プログラム接続による通知メールの再送信機能を提供します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 本APIは送信タイプ(MailType)により、領収書発行、無効化伝票、値引伝票の再送を識別し、再送先のEAMILアドレスを指定することで通知を行います。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 本プラットフォームはメディア申告関連のメカニズムを提供しておりません。旅行代理店自身で対応してください。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行代理店は「HTTP POST」方式で領収書データを電子領収書プラットフォームへ送信し発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列で応答します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中・英・数字・記号はすべて1文字とカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"接続前の準備作業","desc":"<p>（必ず完了させてください。さもないとプログラムが失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーセンターへ送付（FAX / Email）<\/p><p>- 最大10グループのIPを設定可能<\/p><p>- 必要な情報：サーバーの外部IP（内部IPではなく、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番リリース前に必ず接続URLを本番環境用URLに切り替えてください。<\/p><p><br><\/p><p>4. 「準備作業を忘れた」際によくあるエラー信号<\/p><p>- `KEY10001 旅行代理店API接続IPではありません` → IPホワイトリスト未設定または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが不正確、またはサンプル値のまま<\/p><p>- `KEY10009 旅行代理店の統一発票番号のデータ取得不可` → MerchantIDの誤りまたは未有効化<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"通知再送信用コールフローチャート"}]},"apis":[{"name":"通知再送信用API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行代理店統一発票番号","example":"54352706","must_return":false,"note":"旅行代理店の統一発票番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合後、AES256で暗号化。詳細は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"固定値 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）、1970-01-01 00:00:00 UTCから現在までの秒数\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200、現在時刻の代入を推奨","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"送信タイプ","example":"1","must_return":false,"note":"必要な送信タイプに基づきパラメータを指定。\n1=発行メール\n2=値引伝票\n3=無効化伝票","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回照会する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"値引・無効化処理番号","example":"8952","must_return":false,"note":"今回再送する値引伝票番号または無効化伝票番号。MailTypeが2または3の場合のみ必須","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"宛先 Email","example":"abc@gmail.com","must_return":false,"note":"今回再送するメールアドレス。半角カンマで区切ることで複数宛先指定が可能。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返信ステータス","example":"SUCCESS","must_return":true,"note":"1.照会成功時は SUCCESS を返信\n2.照会失敗時はエラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返信メッセージ","example":"成功","must_return":true,"note":"テキスト、今回返信ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行代理店統一発票番号","example":"54352706","must_return":true,"note":"旅行代理店の統一発票番号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"今回のデータ返信の正当性を確認するために使用します。接続時にこのパラメータと照合し、プラットフォームからの返信か確認してください。確認方法は「SHA256暗号化説明」を参照してください。送信失敗時は返信されません。\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt を SHA256 署名仕様で計算したハッシュ値\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt は本APIのレスポンスフィールドには含まれません。領収書発行時に返信された InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt を各自保存し、後の CheckCode 検証に使用してください。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列終了フラグ","example":"##","must_return":true,"note":"固定で ## を返信。String 方式でデータを受信するユーザーは、EndStr=## を判定してデータの完全性を確保してください。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行代理店API接続IPではありません"},{"code":"KEY10002","reason":"データ復号化エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行代理店は電子領収書を有効化していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超過しました"},{"code":"KEY10009","reason":"旅行代理店統一発票番号のデータ取得不可"},{"code":"KEY10010","reason":"旅行代理店統一発票番号が空白"},{"code":"KEY10011","reason":"PostData_フィールドが空白"},{"code":"KEY10012","reason":"データ送信エラー"},{"code":"KEY10013","reason":"データが空白"},{"code":"KEY10014","reason":"TimeOut。通常はI/Oタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額フォーマットエラー"},{"code":"KEY10016","reason":"旅行代理店は郵送プリント付加サービスを申請していません"},{"code":"KEY10017","reason":"郵送プリント付加サービスの利用可能回数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未記入"},{"code":"KEY10019","reason":"旅行代理店は利用停止中です"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV70001","reason":"フィールドデータフォーマットエラー"},{"code":"SM10001","reason":"送信タイプエラー（MailTypeフィールドを確認してください）"},{"code":"SM10002","reason":"通知メールアドレスエラー（BuyerEmailフィールドを確認してください）"},{"code":"BS10006","reason":"領収書データなし"},{"code":"BS10015","reason":"値引伝票番号が未記入"},{"code":"BS10016","reason":"無効化伝票番号が未記入"},{"code":"BS10017","reason":"値引伝票データなし"},{"code":"BS10018","reason":"無効化伝票データなし"}],"versions":[]},

q_format_qs":"본 블록의 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 구분하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"본 블록의 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 포함하여 전달해야 합니다.","msg_req_format_other":"본 블록의 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식을 채택하여 조합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\"font-bold\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템에서 비동기 방식으로 상점에서 지정한 <span class=\"font-bold text-green-700\">Webhook<\/span> 수신 주소로 능동적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템에서 <span class=\"font-bold text-green-700\">{method}<\/span> 방식을 사용하여 <span class=\"font-bold text-green-700\">{location}<\/span>에 동기적으로 응답합니다.","msg_res_format_qs":"응답 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 구분하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"응답 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체 안에 포함하여 전달됩니다.","msg_res_format_other":"응답 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식을 채택하여 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\"font-bold\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 실제 암호화되는 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_3.png"},"meta":{"title":"알림 메일 재발송 API","subtitle":"영수증 발행, 취소서 또는 에누리서 재발송","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행업협회 산하 회원에게 프로그램 연동 방식을 통한 알림 메일 재발송 기능을 제공합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 이 API는 메일 유형(MailType)을 통해 영수증 발행, 취소서, 에누리서 중 무엇을 재발송할지 구분하며, 재발송할 EMAIL 주소를 지정해야 합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 본 플랫폼은 미디어 신고 관련 메커니즘이나 작업을 제공하지 않으며, 여행사는 관련 작업을 직접 수행해야 합니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식을 사용하여 영수증 데이터를 전자 영수증 플랫폼으로 전송합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 간주합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 간은 「&amp;」를 연결 기호로 사용하며, 필드 내부에는 해당 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"연동 사전 작업","desc":"<p>(반드시 먼저 완료하십시오. 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 홈페이지에서 신청서 다운로드 후 작성하여 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제공 항목: 서버 공인 IP (내부 IP 불가, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1~2 영업일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 서비스 오픈 전 반드시 연동 URL을 운영 환경 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 누락' 오류 메시지<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 부정확하거나 여전히 예제값임<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터 없음` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"알림 메일 재발송 호출 플로우차트"}]},"apis":[{"name":"알림 메일 재발송 API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참고","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초\n예: 2014-05-15 15:00:00 시간의 경우 타임스탬프는 1400137200이며, 현재 시간 대입 권장","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"발송 유형","example":"1","must_return":false,"note":"필요한 발송 유형에 따라 대응하는 파라미터 제공.\n1=발행 메일\n2=에누리\n3=취소","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 조회할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"에누리/취소 일련번호","example":"8952","must_return":false,"note":"이번 재발송 메일의 에누리 번호 또는 취소 번호. MailType이 2 또는 3일 경우에만 입력","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"수신자 Email","example":"abc@gmail.com","must_return":false,"note":"이번 재발송 메일의 수신 주소, 반각 쉼표로 구분하여 여러 주소 입력 가능.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"응답 상태","example":"SUCCESS","must_return":true,"note":"1. 조회 성공 시 SUCCESS 반환\n2. 조회 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"응답 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 응답 상태 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":true,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크섬","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"이번 데이터 응답의 적법성을 확인하는 용도. 연동 시 본 파라미터를 비교하여 플랫폼에서 응답한 데이터인지 검증 가능. 검증 방법은 'SHA256 암호화 설명' 참고. 요청 실패 시 응답하지 않음.\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt는 본 API 응답 필드에 포함되지 않으므로, 영수증 발행 시 응답받은 InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt를 프로그램에서 직접 보관해야 나중에 CheckCode 검증에 사용할 수 있음.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정값 ## 반환, String 방식으로 데이터를 수신하는 사용자는 반드시 EndStr=##인지 확인하여 데이터 전달이 완전한지 보장해야 함.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사 전자 영수증 활성화 미신청"},{"code":"KEY10007","reason":"페이지 30분 이상 정지"},{"code":"KEY10009","reason":"여행사 사업자등록번호 데이터 획득 불가"},{"code":"KEY10010","reason":"여행사 사업자등록번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전달 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사 우편 인쇄 부가 서비스 미신청"},{"code":"KEY10017","reason":"우편 인쇄 부가 서비스 잔여량 부족"},{"code":"KEY10018","reason":"발행자 필드 미작성"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV70001","reason":"필드 데이터 형식 오류"},{"code":"SM10001","reason":"발송 유형 오류 (MailType 필드 확인 요망)"},{"code":"SM10002","reason":"알림 메일 주소 오류 (BuyerEmail 필드 확인 요망)"},{"code":"BS10006","reason":"영수증 데이터 없음"},{"code":"BS10015","reason":"에누리 번호 미작성"},{"code":"BS10016","reason":"취소 번호 미작성"},{"code":"BS10017","reason":"에누리 데이터 없음"},{"code":"BS10018","reason":"취소 데이터 없음"}],"versions":[]},

adress för att genomföra återsändningen. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Denna plattform tillhandahåller inte mekanismer för medieanmälan; resebyråer måste hantera detta själva.<\/span><\/p>"},{"id":"section-1","title":"Datoutbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyråer skickar kvittoinformation till den elektroniska kvitto-plattformen via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvitto-plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält separeras av \"&\" som anslutningssymbol. Inget fält får innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedande arbete","desc":"<p>(Vänligen slutför detta först, annars kommer programmet garanterat att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på test-backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktions-backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Kontaktväg: Ladda ner formuläret från webbplatsen, fyll i och skicka till kundtjänst (fax / e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns publika IP (ej internt IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika utrustningar, data delas inte. Innan driftsättning måste du säkerställa att integrations-URL:en har växlats till produktions-URL:en<\/p><p><br><\/p><p>4. Vanliga felorsaker på grund av \"glömt förberedelsearbete\"<\/p><p>- `KEY10001 Inte en IP för resebyrå-API-integration` → IP-vitlistning ej inställd eller felaktigt inställd<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktiga eller är fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är fel eller ej aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för återsändning av meddelanden"}]},"apis":[{"name":"API för återsändning av meddelanden","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Fält kombineras till en sträng och krypteras med AES256, se fältförklaring i tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält inom PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integrationsprogramversion","example":"1.0","must_return":false,"note":"Ska alltid vara 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder från 1970-01-01 00:00:00 UTC till nu. Exempel: För tiden 2014-05-15 15:00:00 är stämpeln 1400137200. Rekommenderas att använda aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Meddelandetyp","example":"1","must_return":false,"note":"Ange motsvarande parameter beroende på önskad meddelandetyp.\n1=Kvitto\n2=Kreditnota\n3=Makulering","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvitto-nummer","example":"T13671008","must_return":false,"note":"Det sökta kvitto-numret.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Löpnummer för kreditnota/makulering","example":"8952","must_return":false,"note":"Kreditnota-nummer eller makuleringsnummer för denna återsändning. Krävs endast om MailType är 2 eller 3","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Mottagarens e-post","example":"abc@gmail.com","must_return":false,"note":"E-postadress för denna återsändning, flera adresser kan separeras med kommatecken.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Om lyckat, returnera SUCCESS\n2. Om misslyckat, returnera felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Lyckades","must_return":true,"note":"Text som förklarar statusen","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":true,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Används för att kontrollera att denna dataretur är legitim. Vid integration kan du jämföra denna parameter för att kontrollera om den kommer från plattformen. Kontrollmetoden finns under \"SHA256-krypteringsförklaring\". Om aktiveringen misslyckades returneras inget.\n\nCheckCode = hashvärde beräknat enligt SHA256-signaturspecifikation för InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt ingår inte i detta API-svarsfält, programmet måste själv spara dessa värden från kvittoutskriften för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängavslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data via String måste kontrollera EndStr=## för att säkerställa att datan är fullständig.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Ej resebyrås API-integrations-IP"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständig data"},{"code":"KEY10006","reason":"Resebyrå har inte ansökt om/aktiverat elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i över 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer saknas"},{"code":"KEY10011","reason":"Fältet PostData_ saknas"},{"code":"KEY10012","reason":"Dataöverföringsfel"},{"code":"KEY10013","reason":"Data saknas"},{"code":"KEY10014","reason":"TimeOut. Avser vanligtvis I/O-timeout"},{"code":"KEY10015","reason":"Felaktigt format på kvittobelopp"},{"code":"KEY10016","reason":"Resebyrå har inte ansökt om tjänsten för utskrift via post"},{"code":"KEY10017","reason":"Otillräcklig kvot för utskrift via post"},{"code":"KEY10018","reason":"Fält för utfärdare ej ifyllt"},{"code":"KEY10019","reason":"Resebyrå avstängd"},{"code":"NOR10001","reason":"Nätverksanslutningsfel"},{"code":"INV70001","reason":"Felaktigt fältformat"},{"code":"SM10001","reason":"Felaktig meddelandetyp (kontrollera fältet MailType)"},{"code":"SM10002","reason":"Felaktig e-postadress (kontrollera fältet BuyerEmail)"},{"code":"BS10006","reason":"Hittade inget kvitto"},{"code":"BS10015","reason":"Kreditnota-nummer ej ifyllt"},{"code":"BS10016","reason":"Makuleringsnummer ej ifyllt"},{"code":"BS10017","reason":"Hittade ingen kreditnota"},{"code":"BS10018","reason":"Hittade ingen makuleringssedel"}],"versions":[]},

        const globalToolsConfig = {"sha":{"enabled":true,"params":{"key_label":"HashKey","iv_label":"HashIV","columns":"InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt","encrypt_order":"前IV後KEY"}},"aes_encrypt":{"enabled":true},"aes_decrypt":{"enabled":true}};
        const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_AES_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature (HashKey)\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');\n\n// 16 bytes — used for both AES-256 IV and SHA256 signature (HashIV). IV is 16 bytes because AES block size is fixed at 16 bytes regardless of key length (128/192/256 bits).\ndefine('AES_IV', 'YOUR_AES_IV_HERE');\n\n// Endpoint Selection (Uncomment the desired environment)\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/notification_resend'); // Sandbox Test Environment\n// define('API_URL', 'https://api.travelinvoice.com.tw/notification_resend'); // Production Environment\n\n// Prevent execution with unconfigured placeholder credentials\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 20px; margin: 30px auto; max-width: 800px; border-radius: 4px; font-family: sans-serif;\">';\n    echo '<h3 style=\"margin-top: 0;\">Configuration Placeholder Detected!<\/h3>';\n    echo '<p>You must replace the placeholder credentials (<strong>MERCHANT_ID<\/strong>, <strong>AES_KEY<\/strong>, and <strong>AES_IV<\/strong>) with actual credentials obtained from the Travel Invoice platform before invoking the API.<\/p>';\n    echo '<\/div>';\n    exit;\n}\n\n/**\n * Encrypts data using AES-256-CBC with custom PKCS7 padding aligned to a 32-byte block size.\n *\n * @param string $plaintext Data to encrypt\n * @param string $key AES encryption key (32 bytes)\n * @param string $iv AES initialization vector (16 bytes)\n * @return string Hexadecimal encoded ciphertext\n * @throws Exception If encryption fails\n */\nfunction encrypt_aes256_cbc_pkcs7_b32(string $plaintext, string $key, string $iv): string {\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLen = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n    $paddedText = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encrypted = openssl_encrypt($paddedText, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed in openssl_encrypt.');\n    }\n\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Verifies the integrity of the response data using SHA256 hashing.\n * Receives parameters originally saved during invoice creation and matches them against\n * the CheckCode returned from the API response.\n *\n * @param string $invoiceTransNo Transaction number of the invoice\n * @param string $merchantId Travel agency VAT number\n * @param string $merchantOrderNo Original merchant order number\n * @param string $randomNum Random verification number\n * @param string $totalAmt Total invoice amount\n * @param string $hashKey Encryption signature key (HashKey)\n * @param string $hashIv Encryption initialization vector (HashIV)\n * @param string $expectedCheckCode Signature from the response\n * @return bool True if signature is valid and authentic, false otherwise\n */\nfunction verify_signature(\n    string $invoiceTransNo,\n    string $merchantId,\n    string $merchantOrderNo,\n    string $randomNum,\n    string $totalAmt,\n    string $hashKey,\n    string $hashIv,\n    string $expectedCheckCode\n): bool {\n    // Construct the verification raw string explicitly without urlencoding\n    $rawString = 'HashIV=' . $hashIv .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantId .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . $hashKey;\n\n    $hashed = strtoupper(hash('sha256', $rawString));\n    return hash_equals($expectedCheckCode, $hashed);\n}\n\n// Variables to keep track of the application state\n$apiResponse = null;\n$parsedResponse = [];\n$signatureVerificationResult = null;\n$executionError = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action']) && $_POST['action'] === 'resend_notification') {\n    try {\n        // Collect and sanitize user inputs\n        $mailType = isset($_POST['mail_type']) ? trim($_POST['mail_type']) : '';\n        $invoiceNumber = isset($_POST['invoice_number']) ? trim($_POST['invoice_number']) : '';\n        $buyerEmail = isset($_POST['buyer_email']) ? trim($_POST['buyer_email']) : '';\n        $systemCorrespondNo = isset($_POST['system_correspond_no']) ? trim($_POST['system_correspond_no']) : '';\n\n        // Validate required request parameters\n        if ($mailType === '' || $invoiceNumber === '' || $buyerEmail === '') {\n            throw new Exception('Please fill in all required fields (Mail Type, Invoice Number, and Recipient Email).');\n        }\n\n        if (($mailType === '2' || $mailType === '3') && $systemCorrespondNo === '') {\n            throw new Exception('System Correspond No is required when Mail Type is Allowances or Voiding.');\n        }\n\n        // Prepare raw query parameters for inner PostData_ envelope\n        $postParams = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'MailType' => (int)$mailType,\n            'InvoiceNumber' => $invoiceNumber,\n            'BuyerEmail' => $buyerEmail\n        ];\n\n        if ($mailType === '2' || $mailType === '3') {\n            $postParams['SystemCorrespondNo'] = $systemCorrespondNo;\n        }\n\n        // Build URL-encoded query string for parameters\n        $plaintextQuery = http_build_query($postParams);\n\n        // Encrypt plain query using customized non-standard AES256 CBC PKCS7-B32 scheme\n        $encryptedPostData = encrypt_aes256_cbc_pkcs7_b32($plaintextQuery, AES_KEY, AES_IV);\n\n        // Prepare outermost payload\n        $requestPayload = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        ];\n\n        // Execute communication via cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($requestPayload));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n        $responseBody = curl_exec($ch);\n\n        if ($responseBody === false) {\n            $curlError = curl_error($ch);\n            throw new Exception('Network communication failure: ' . $curlError);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        // curl_close() is intentionally omitted as it has no operational effect in PHP 8.0+\n\n        if ($httpStatusCode !== 200) {\n            throw new Exception('API responded with unexpected HTTP status code: ' . $httpStatusCode);\n        }\n\n        $apiResponse = $responseBody;\n\n        // Parse response parameters (Form-URLencoded query-string representation)\n        parse_str($apiResponse, $parsedResponse);\n\n        // Verify payload structural integrity check\n        $endStr = $parsedResponse['EndStr'] ?? '';\n        if (substr($endStr, -2) !== '##') {\n            throw new Exception('Data transmission incomplete: EndStr terminating bytes \"##\" were not found.');\n        }\n\n        // Perform signature verification if the user supplied historical transaction fields\n        $verifyInvoiceTransNo = isset($_POST['v_invoice_trans_no']) ? trim($_POST['v_invoice_trans_no']) : '';\n        $verifyMerchantOrderNo = isset($_POST['v_merchant_order_no']) ? trim($_POST['v_merchant_order_no']) : '';\n        $verifyRandomNum = isset($_POST['v_random_num']) ? trim($_POST['v_random_num']) : '';\n        $verifyTotalAmt = isset($_POST['v_total_amt']) ? trim($_POST['v_total_amt']) : '';\n        $expectedCheckCode = $parsedResponse['CheckCode'] ?? '';\n\n        if ($expectedCheckCode !== '' && $verifyInvoiceTransNo !== '' && $verifyMerchantOrderNo !== '' && $verifyRandomNum !== '' && $verifyTotalAmt !== '') {\n            $isSignatureValid = verify_signature(\n                $verifyInvoiceTransNo,\n                MERCHANT_ID,\n                $verifyMerchantOrderNo,\n                $verifyRandomNum,\n                $verifyTotalAmt,\n                AES_KEY,\n                AES_IV,\n                $expectedCheckCode\n            );\n            $signatureVerificationResult = $isSignatureValid ? 'VALID' : 'INVALID';\n        }\n\n    } catch (Exception $e) {\n        $executionError = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Travel Invoice API Integration Tool<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background-color: #f8f9fa; color: #212529; margin: 0; padding: 20px; }\n        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n        h1 { font-size: 24px; margin-bottom: 20px; color: #0d6efd; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }\n        h2 { font-size: 18px; margin-top: 30px; margin-bottom: 15px; color: #495057; }\n        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }\n        .form-group { margin-bottom: 15px; }\n        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #495057; }\n        input[type=\"text\"], select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; }\n        input[type=\"text\"]:focus, select:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25); }\n        .btn { display: inline-block; background-color: #0d6efd; color: #fff; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; text-decoration: none; transition: background-color 0.15s ease-in-out; }\n        .btn:hover { background-color: #0b5ed7; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }\n        .alert-danger { background-color: #f8d7da; border: 1px solid #f5c2c7; color: #842029; }\n        .alert-success { background-color: #d1e7dd; border: 1px solid #badbcc; color: #0f5132; }\n        .alert-info { background-color: #cff4fc; border: 1px solid #b6effb; color: #055160; }\n        .response-box { background-color: #212529; color: #f8f9fa; padding: 15px; border-radius: 4px; font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; margin-top: 10px; }\n        .badge { display: inline-block; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; color: #fff; }\n        .badge-success { background-color: #198754; }\n        .badge-danger { background-color: #dc3545; }\n        .badge-warning { background-color: #ffc107; color: #000; }\n        .card { border: 1px solid #e9ecef; border-radius: 4px; padding: 15px; margin-bottom: 20px; background-color: #fff; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Notification Resend API Gateway<\/h1>\n\n    <?php if ($executionError !== null): ?>\n        <div class=\"alert alert-danger\">\n            <strong>Execution Error:<\/strong> <?php echo htmlspecialchars($executionError); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form action=\"\" method=\"POST\">\n        <input type=\"hidden\" name=\"action\" value=\"resend_notification\">\n\n        <div class=\"grid\">\n            <div>\n                <h2>1. Resend Envelope Parameters (Encrypted Payload)<\/h2>\n                \n                <div class=\"form-group\">\n                    <label for=\"mail_type\">Mail Type (發信類型) *<\/label>\n                    <select id=\"mail_type\" name=\"mail_type\" onchange=\"toggleCorrespondNo(this.value)\">\n                        <option value=\"1\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '1') ? 'selected' : ''; ?>>1 = Invoice Issuance (開立信)<\/option>\n                        <option value=\"2\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '2') ? 'selected' : ''; ?>>2 = Allowance (折讓)<\/option>\n                        <option value=\"3\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '3') ? 'selected' : ''; ?>>3 = Voiding (作廢)<\/option>\n                    <\/select>\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"invoice_number\">Invoice Number (收據號碼) *<\/label>\n                    <input type=\"text\" id=\"invoice_number\" name=\"invoice_number\" placeholder=\"e.g. T13671008\" value=\"<?php echo htmlspecialchars($_POST['invoice_number'] ?? ''); ?>\" required>\n                <\/div>\n\n                <div class=\"form-group\" id=\"correspond_no_group\" style=\"display: <?php echo (isset($_POST['mail_type']) && in_array($_POST['mail_type'], ['2', '3'])) ? 'block' : 'none'; ?>;\">\n                    <label for=\"system_correspond_no\">System Correspond No (折讓、作廢流水號) *<\/label>\n                    <input type=\"text\" id=\"system_correspond_no\" name=\"system_correspond_no\" placeholder=\"e.g. 8952\" value=\"<?php echo htmlspecialchars($_POST['system_correspond_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"buyer_email\">Recipient Email Address (收件人 Email) *<\/label>\n                    <input type=\"text\" id=\"buyer_email\" name=\"buyer_email\" placeholder=\"e.g. client@example.com (separated by commas for multiples)\" value=\"<?php echo htmlspecialchars($_POST['buyer_email'] ?? ''); ?>\" required>\n                <\/div>\n            <\/div>\n\n            <div>\n                <h2>2. Verification Parameters (Optional Response Verification)<\/h2>\n                <p style=\"font-size: 13px; color: #6c757d; margin-top: -5px; margin-bottom: 15px;\">\n                    Provide the original parameters from when the invoice was issued to automatically verify the cryptographic signature returned by the gateway.\n                <\/p>\n\n                <div class=\"form-group\">\n                    <label for=\"v_invoice_trans_no\">Stored Invoice Trans No (InvoiceTransNo)<\/label>\n                    <input type=\"text\" id=\"v_invoice_trans_no\" name=\"v_invoice_trans_no\" placeholder=\"Original Invoice Transaction Number\" value=\"<?php echo htmlspecialchars($_POST['v_invoice_trans_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_merchant_order_no\">Stored Merchant Order No (MerchantOrderNo)<\/label>\n                    <input type=\"text\" id=\"v_merchant_order_no\" name=\"v_merchant_order_no\" placeholder=\"Original Merchant Order Number\" value=\"<?php echo htmlspecialchars($_POST['v_merchant_order_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_random_num\">Stored Random Number (RandomNum)<\/label>\n                    <input type=\"text\" id=\"v_random_num\" name=\"v_random_num\" placeholder=\"Original Random Verification Code\" value=\"<?php echo htmlspecialchars($_POST['v_random_num'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_total_amt\">Stored Total Amount (TotalAmt)<\/label>\n                    <input type=\"text\" id=\"v_total_amt\" name=\"v_total_amt\" placeholder=\"Original Total Invoice Amount\" value=\"<?php echo htmlspecialchars($_POST['v_total_amt'] ?? ''); ?>\">\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <div style=\"text-align: right; margin-top: 20px; border-top: 1px solid #e9ecef; padding-top: 20px;\">\n            <button type=\"submit\" class=\"btn\">Process Resend Request &rarr;<\/button>\n        <\/div>\n    <\/form>\n\n    <?php if ($apiResponse !== null): ?>\n        <h2>3. Transaction Response Summary<\/h2>\n        <div class=\"grid\">\n            <div>\n                <div class=\"card\">\n                    <h3>Status Details<\/h3>\n                    <p><strong>Merchant ID:<\/strong> <?php echo htmlspecialchars($parsedResponse['MerchantID'] ?? ''); ?><\/p>\n                    <p>\n                        <strong>Status Code:<\/strong> \n                        <?php if (($parsedResponse['Status'] ?? '') === 'SUCCESS'): ?>\n                            <span class=\"badge badge-success\">SUCCESS<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($parsedResponse['Status'] ?? 'UNKNOWN'); ?><\/span>\n                        <?php endif; ?>\n                    <\/p>\n                    <p><strong>Status Message:<\/strong> <?php echo htmlspecialchars($parsedResponse['Message'] ?? ''); ?><\/p>\n                    <p><strong>Terminator Integrity Block:<\/strong> <code><?php echo htmlspecialchars($parsedResponse['EndStr'] ?? ''); ?><\/code><\/p>\n                <\/div>\n            <\/div>\n\n            <div>\n                <div class=\"card\">\n                    <h3>Signature Status (CheckCode)<\/h3>\n                    <p><strong>Response CheckCode:<\/strong> <span style=\"font-size: 11px; font-family: monospace; word-break: break-all;\"><?php echo htmlspecialchars($parsedResponse['CheckCode'] ?? 'Not Provided'); ?><\/span><\/p>\n                    <p>\n                        <strong>Signature Verification:<\/strong>\n                        <?php if ($signatureVerificationResult === 'VALID'): ?>\n                            <span class=\"badge badge-success\">VALID SIGNATURE<\/span>\n                        <?php elseif ($signatureVerificationResult === 'INVALID'): ?>\n                            <span class=\"badge badge-danger\">SIGNATURE INVALID<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-warning\">INSUFFICIENT DATA TO VERIFY<\/span>\n                        <?php endif; ?>\n                    <\/p>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <h2>Raw Response Payload from Server<\/h2>\n        <div class=\"response-box\"><?php echo htmlspecialchars($apiResponse); ?><\/div>\n    <?php endif; ?>\n<\/div>\n\n<script>\nfunction toggleCorrespondNo(mailType) {\n    const group = document.getElementById('correspond_no_group');\n    const input = document.getElementById('system_correspond_no');\n    if (mailType === '2' || mailType === '3') {\n        group.style.display = 'block';\n        input.setAttribute('required', 'required');\n    } else {\n        group.style.display = 'none';\n        input.removeAttribute('required');\n    }\n}\n<\/script>\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];

        function renderAll() {

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;

            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';

                let stepsContainer = document.getElementById('enc-rule-aes-steps');

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden');

                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;

            } else { 
                shaBlock.classList.add('hidden');

                section.classList.remove('hidden');

        function switchToolTab(tabId, event) {
            document.querySelectorAll('.tool-content').forEach(function(el) { el.classList.add('hidden'); });
            document.querySelectorAll('.tool-tab-btn').forEach(function(el) {
                el.classList.remove('active', 'border-purple-600', 'text-purple-600');
                el.classList.add('border-transparent', 'text-slate-500');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.remove('border-transparent', 'text-slate-500');
                event.currentTarget.classList.add('active', 'border-purple-600', 'text-purple-600');
            }

            if (lblKey && lblIv) {

                    var shaConfig = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';
                    lblKey.innerHTML = kLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(Key)</span>';
                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateTableRows(dataArray, ui) {

        function initLangDropdown() {

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            
            // 切換語系時同步更新網址列參數
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);
            window.history.replaceState({}, document.title, url);

            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
