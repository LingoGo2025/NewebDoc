串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"通知信補發呼叫流程圖"}]},"apis":[{"name":"補發通知信API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"發信類型","example":"1","must_return":false,"note":"依據所需發信的類型，給予對應參數。\n1=開立信\n2=折讓\n3=作廢","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次查詢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"折讓、作廢流水號","example":"8952","must_return":false,"note":"此次補發信的折讓單號或作廢單號。若MailType 為 2 或 3 才需傳入","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"收件人 Email","example":"abc@gmail.com","must_return":false,"note":"此次補發信的 Mail 信箱，可用半型逗號區隔多信箱。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.查詢成功，則回傳 SUCCESS\n2.查詢失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":true,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076 pan> processing must be completed before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system asynchronously to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"This result will be returned synchronously by the system via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> in <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification/Decryption: Specific data must undergo <span class=\\\"font-bold\\\">{group_type}<\/span> processing after reception.","lbl_sha_pre_hash":"String to Hash (Pre-encryption)","ph_sha_pre_hash":"After clicking the sign button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_1.png"},"meta":{"title":"Notification Resend API","subtitle":"Resend receipt issuance, voiding, or allowance notes","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide members under the Travel Quality Assurance Association with the ability to resend notification emails through programmatic integration. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This API uses the MailType to distinguish whether to resend receipt issuance, voiding, or allowance notes, and requires specifying the target EMAIL address to achieve notification resending. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. This platform does not provide mechanisms or operations for media reporting; travel agencies should conduct related operations themselves.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The travel agency sends receipt data to the electronic receipt platform via \"HTTP POST\" for issuance. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. The encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is characters. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected with \"&amp;\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparation","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the Test Area Backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the Production Area Backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server external IP (not internal IP, check at https://ifconfig.me)<\/p><p>- Effective Time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely different systems; data is not shared. Confirm that the integration URL is switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Preparation\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using sample values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID wrong or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Notification Resend Call Flowchart"}]},"apis":[{"name":"Notification Resend API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC\ne.g.: for 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Mail Type","example":"1","must_return":false,"note":"Provide corresponding parameter based on the required mail type.\n1=Issuance\n2=Allowance\n3=Void","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this query.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Allowance/Void Serial No.","example":"8952","must_return":false,"note":"The allowance number or voiding number for this resend. Required if MailType is 2 or 3.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Recipient Email","example":"abc@gmail.com","must_return":false,"note":"The email address for this resend. Multiple emails can be separated by half-width commas.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If query succeeds, returns SUCCESS\n2. If query fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text, description of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":true,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Used to check the validity of this data return. During integration, you can compare this parameter data to verify if it was returned by the platform. Please refer to \"SHA256 Encryption Description\" for the verification method. Not returned if the initiation fails.\n\nCheckCode = Hash value calculated according to SHA256 signature specification for InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt are not included in this API response. The program must store the InvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt returned during receipt issuance for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check if EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for electronic receipt activation"},{"code":"KEY10007","reason":"Page stayed for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for postal printing value-added service"},{"code":"KEY10017","reason":"Insufficient available count for postal printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"INV70001","reason":"Field data format error"},{"code":"SM10001","reason":"Wrong mail type (please check MailType field)"},{"code":"SM10002","reason":"Wrong notification email (please check BuyerEmail field)"},{"code":"BS10006","reason":"Receipt data not found"},{"code":"BS10015","reason":"Allowance number not filled"},{"code":"BS10016","reason":"Voiding number not filled"},{"code":"BS10017","reason":"Allowance note data not found"},{"code":"BS10018","reason":"Voiding note data not found"}],"versions":[]},

信してください。","msg_req_format_qs":"このブロックのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わせる必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡す必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了させる必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、ショップが指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信 URL にアクティブにプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わされます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前組み合わせ文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_2.png"},"meta":{"title":"通知メール再送API","subtitle":"領収書発行、無効化伝票、または値引き伝票の再送","version":"","sections":[{"id":"section-0","title":"連携の目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行業協会傘下の会員が、プログラム連携を通じて通知メールの再送を行えるようにします。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. この API は送信タイプ (MailType) によって、領収書発行、無効化伝票、または値引き伝票のいずれを再送するかを区別し、再送先のメールアドレスを指定することで通知メールの再送を実現します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 本プラットフォームはメディア申告に関するメカニズムや業務は提供していません。旅行社は各自で関連業務を行ってください。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信し、発行を行います。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字エンコーディングは UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。全角、半角、英数字、記号はいずれも 1 文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. フィールド間は「&amp;」を連結記号として使用し、フィールド内にこの文字 (U+0026) を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"連携前の準備","desc":"<p>（必ず完了させてください。そうしないとプログラムは失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請書をダウンロードして記入後、カスタマーサービスセンターに送信（FAX / メール）<\/p><p>- 最大 10 セットの IP を設定可能<\/p><p>- 提出物：サーバーの外部接続 IP（内部 IP ではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常 1-2 営業日<\/p><p><br><\/p><p>3. 環境 URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共通ではありません。本番稼働前に必ず連携先 URL を本番環境のものに切り替えてください。<\/p><p><br><\/p><p>4. よくある「事前準備忘れ」のエラー信号<\/p><p>- `KEY10001 非旅行社 API 連携 IP` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が正しくない、またはサンプルのまま<\/p><p>- `KEY10009 旅行社法人番号のデータが取得できません` → MerchantID の誤り、または未有効化<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"通知メール再送呼び出しフローチャート"}]},"apis":[{"name":"通知メール再送API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社法人番号","example":"54352706","must_return":false,"note":"旅行社の法人番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを組み合わせた後、AES256 暗号化を行います。フィールドの説明は下表の通りです。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 内包フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"1.0 固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数。\\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時間を設定することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"送信タイプ","example":"1","must_return":false,"note":"送信が必要なタイプに応じて、対応するパラメータを指定します。\\n1=発行通知\\n2=値引き\\n3=無効化","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回照会する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"値引き・無効化シリアル番号","example":"8952","must_return":false,"note":"今回の再送メールの値引き伝票番号または無効化伝票番号。MailType が 2 または 3 の場合のみ送信が必要。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"受信者 Email","example":"abc@gmail.com","must_return":false,"note":"今回の再送メールの宛先。半角カンマで区切ることで複数指定可能。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システムレスポンスメッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 照会成功時は SUCCESS を返却\\n2. 照会失敗時はエラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"今回の返却ステータスの説明（文字列）","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社法人番号","example":"54352706","must_return":true,"note":"旅行社の法人番号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"今回のデータ返却の正当性を確認するために使用します。連携時にこのパラメータを比較することで、プラットフォームから返されたものか検証できます。検証方法は「SHA256暗号化の説明」を参照してください。起動失敗時は返却されません。\\n\\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt を SHA256 署名仕様に基づいて計算したハッシュ値。\\n\\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt はこの API のレスポンスフィールドには含まれません。領収書発行時に返却されたこれらの値をプログラム側で保存し、後日の CheckCode 検証に使用する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列終端","example":"##","must_return":true,"note":"## 固定。String 形式でデータを受信するユーザーは、データの完全性を確保するために EndStr=## を判断する必要があります。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 連携 IP"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行社が電子領収書の利用申請をしていません"},{"code":"KEY10007","reason":"ページ滞在時間が 30 分を超えました"},{"code":"KEY10009","reason":"旅行社法人番号のデータが取得できません"},{"code":"KEY10010","reason":"旅行社法人番号が空白です"},{"code":"KEY10011","reason":"PostData_ フィールドが空白です"},{"code":"KEY10012","reason":"データ伝送エラー"},{"code":"KEY10013","reason":"データが空白です"},{"code":"KEY10014","reason":"TimeOut。通常 I/O 上のタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行社が郵送印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷付加価値サービスの利用可能残数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未記入です"},{"code":"KEY10019","reason":"旅行社のアカウントが停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV70001","reason":"フィールドデータの形式エラー"},{"code":"SM10001","reason":"送信タイプエラー（MailType フィールドを確認してください）"},{"code":"SM10002","reason":"通知先メールアドレスエラー（BuyerEmail フィールドを確認してください）"},{"code":"BS10006","reason":"領収書データが見つかりません"},{"code":"BS10015","reason":"値引き伝票番号が未記入です"},{"code":"BS10016","reason":"無効化伝票番号が未記入です"},{"code":"BS10017","reason":"値引き伝票データが見つかりません"},{"code":"BS10018","reason":"無効化伝票データが見つかりません"}],"versions":[]},

,"msg_req_format_qs":"본 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템에 의해 비동기 형식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"본 결과는 시스템에 의해 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_res_security":"인증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 실제 암호화될 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_resend-notification-api/fc_3.png"},"meta":{"title":"알림 메일 재전송 API","subtitle":"영수증 발행, 취소 전표 또는 할인 전표 재전송","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 관광상업동업공회 산하 회원사에게 프로그램 연동 방식을 통한 알림 메일 재전송 기능을 제공합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 이 API는 메일 유형(MailType)으로 영수증 발행, 취소 전표 또는 할인 전표 재전송을 구분하며, 재전송할 이메일 주소를 지정하여 알림 메일 재전송 목적을 달성합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 본 플랫폼은 매체 신고와 관련된 메커니즘 및 작업을 제공하지 않으므로, 여행사는 직접 관련 작업을 진행하시기 바랍니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 영수증 데이터를 전자영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자(Character)입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이에는 「&amp;」를 연결 기호로 사용하며, 각 필드 내부에는 이 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"연동 전 사전 작업","desc":"<p>(반드시 먼저 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 관리자 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 구역 관리자 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 양식을 다운로드하여 작성 후, 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필요 정보: 서버 외부 IP (내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 영업일 기준 1-2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL을 실제 구역 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔한 「사전 작업 누락」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 가져올 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"알림 메일 재전송 호출 플로우차트"}]},"apis":[{"name":"알림 메일 재전송 API","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화 수행, 필드 설명은 아래 표와 같음","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0으로 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC 이후 경과된 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200입니다. 현재 시간을 입력하는 것을 권장합니다.","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"메일 유형","example":"1","must_return":false,"note":"필요한 메일 발송 유형에 따라 해당 파라미터를 부여합니다.\n1=발행 메일\n2=할인(감액)\n3=취소(무효)","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번 조회 대상 영수증 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"할인/취소 일련번호","example":"8952","must_return":false,"note":"이번 메일 재전송의 할인 전표 번호 또는 취소 전표 번호입니다. MailType이 2 또는 3인 경우에만 전달해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"수신자 이메일","example":"abc@gmail.com","must_return":false,"note":"이번 메일 재전송 대상 이메일 주소입니다. 반각 쉼표로 여러 이메일을 구분할 수 있습니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 조회 성공 시 SUCCESS 반환\n2. 조회 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":true,"note":"여행사 사업자 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크코드","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"이번 데이터 반환의 적법성을 확인하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환한 것인지 검증할 수 있습니다. 검증 방법은 ”SHA256 암호화 설명”을 참조하십시오. 전송 실패 시 반환되지 않습니다.\n\nCheckCode = InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값입니다.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt는 이 API 응답 필드에 포함되지 않으므로, 영수증 발행 시 반환된 해당 값들을 프로그램에서 자체적으로 보관하여 향후 CheckCode 검증 시 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정적으로 ##를 반환합니다. String 방식으로 데이터를 수신하는 사용자는\nEndStr=##인지 추가로 판단하여 데이터 전달의 완결성을 보장해야 합니다.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP가 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사가 전자영수증 사용 신청을 하지 않음"},{"code":"KEY10007","reason":"페이지 체류 시간 30분 초과"},{"code":"KEY10009","reason":"여행사 사업자 번호 데이터를 가져올 수 없음"},{"code":"KEY10010","reason":"여행사 사업자 번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전달 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미함"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사가 우편 인쇄 부가 서비스를 신청하지 않음"},{"code":"KEY10017","reason":"우편 인쇄 부가 서비스 잔여 횟수 부족"},{"code":"KEY10018","reason":"발행인 필드 미작성"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV70001","reason":"필드 데이터 형식 오류"},{"code":"SM10001","reason":"발신 종류 오류 (MailType 필드 확인)"},{"code":"SM10002","reason":"알림 메일 이메일 주소 오류 (BuyerEmail 필드 확인)"},{"code":"BS10006","reason":"영수증 데이터 조회 불가"},{"code":"BS10015","reason":"할인 전표 번호 미작성"},{"code":"BS10016","reason":"취소 전표 번호 미작성"},{"code":"BS10017","reason":"할인 전표 데이터 조회 불가"},{"code":"BS10018","reason":"취소 전표 데이터 조회 불가"}],"versions":[]},

style=\"color: rgb(0, 0, 0);\">2. Detta API använder meddelandetyp (MailType) för att skilja på återutsändning av kvitto, makulering eller kreditnota, och kräver en specifik e-postadress för återutsändningen. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Denna plattform tillhandahåller inte mekanismer för skatterapportering; resebyråer bör hantera detta själva.<\/span><\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittodata till den elektroniska kvittoplattformen via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&\", och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelser för integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testmiljöns backend → Grundläggande info → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsmiljöns backend → Grundläggande info → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökan: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (fax / e-post)<\/p><p>- Max 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP (inte internt nätverks-IP, kan kontrolleras på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika system, data delas inte. Se till att byta till produktionsadressen innan lansering.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en resebyrå-API-integrations-IP` → IP-vitlistning är inte inställd eller felaktig<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktig eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är fel eller inte aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för anrop av återutsändning"}]},"apis":[{"name":"API för återutsändning av meddelanden","url_test":"https://capi.travelinvoice.com.tw/notification_resend","url_prod":"https://api.travelinvoice.com.tw/notification_resend","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfälten kombineras och krypteras med AES256, fältbeskrivningar finns i tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integrationsversion","example":"1.0","must_return":false,"note":"Fast värde 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: För tiden 2014-05-15 15:00:00 är tidsstämpeln 1400137200, det rekommenderas att använda aktuell tid","enum_values":"","default_value":"","nullable":false},{"name":"MailType","required":"V","type":"int(1)","label":"Meddelandetyp","example":"1","must_return":false,"note":"Ange motsvarande parameter baserat på typen av meddelande som ska skickas.\n1=Utfärdande\n2=Kreditnota\n3=Makulering","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret för denna begäran.","enum_values":"","default_value":"","nullable":false},{"name":"SystemCorrespondNo","required":"+","type":"string(20)","label":"Serienummer för kreditnota eller makulering","example":"8952","must_return":false,"note":"Kreditnotans eller makuleringens nummer för denna återutsändning. Krävs endast om MailType är 2 eller 3","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(100)","label":"Mottagarens e-post","example":"abc@gmail.com","must_return":false,"note":"E-postadressen för återutsändningen, använd kommatecken för att separera flera adresser.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"int(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Om sökningen lyckas returneras SUCCESS\n2. Om sökningen misslyckas returneras en felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"成功","must_return":true,"note":"Text, beskrivning av returstatusen","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":true,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"A791D7C1D64093962939B54CC1C07E8109EB8C454E0DC18F822BBA076EB38E66","must_return":false,"note":"Används för att kontrollera giltigheten av de returnerade data. Vid integration kan detta fält jämföras för att verifiera att det kommer från plattformen. Se ”SHA256-krypteringsinstruktioner” för verifieringsmetod. Returneras inte om anropet misslyckas.\n\nCheckCode = Hash-värde beräknat enligt SHA256-signaturspecifikationen för InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt ingår inte i detta API-svar. Programmet måste spara dessa värden från det ursprungliga kvitto-utfärdandet för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data som en sträng bör\nkontrollera EndStr=## för att säkerställa fullständig dataöverföring.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en resebyrå-API-integrations-IP"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständiga data"},{"code":"KEY10006","reason":"Resebyrån har inte ansökt om att aktivera elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer är tomt"},         const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_AES_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature (HashKey)\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');\n\n// 16 bytes — used for both AES-256 IV and SHA256 signature (HashIV). IV is 16 bytes because AES block size is fixed at 16 bytes regardless of key length (128/192/256 bits).\ndefine('AES_IV', 'YOUR_AES_IV_HERE');\n\n// Endpoint Selection (Uncomment the desired environment)\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/notification_resend'); // Sandbox Test Environment\n// define('API_URL', 'https://api.travelinvoice.com.tw/notification_resend'); // Production Environment\n\n// Prevent execution with unconfigured placeholder credentials\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 20px; margin: 30px auto; max-width: 800px; border-radius: 4px; font-family: sans-serif;\">';\n    echo '<h3 style=\"margin-top: 0;\">Configuration Placeholder Detected!<\/h3>';\n    echo '<p>You must replace the placeholder credentials (<strong>MERCHANT_ID<\/strong>, <strong>AES_KEY<\/strong>, and <strong>AES_IV<\/strong>) with actual credentials obtained from the Travel Invoice platform before invoking the API.<\/p>';\n    echo '<\/div>';\n    exit;\n}\n\n/**\n * Encrypts data using AES-256-CBC with custom PKCS7 padding aligned to a 32-byte block size.\n *\n * @param string $plaintext Data to encrypt\n * @param string $key AES encryption key (32 bytes)\n * @param string $iv AES initialization vector (16 bytes)\n * @return string Hexadecimal encoded ciphertext\n * @throws Exception If encryption fails\n */\nfunction encrypt_aes256_cbc_pkcs7_b32(string $plaintext, string $key, string $iv): string {\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLen = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n    $paddedText = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encrypted = openssl_encrypt($paddedText, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed in openssl_encrypt.');\n    }\n\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Verifies the integrity of the response data using SHA256 hashing.\n * Receives parameters originally saved during invoice creation and matches them against\n * the CheckCode returned from the API response.\n *\n * @param string $invoiceTransNo Transaction number of the invoice\n * @param string $merchantId Travel agency VAT number\n * @param string $merchantOrderNo Original merchant order number\n * @param string $randomNum Random verification number\n * @param string $totalAmt Total invoice amount\n * @param string $hashKey Encryption signature key (HashKey)\n * @param string $hashIv Encryption initialization vector (HashIV)\n * @param string $expectedCheckCode Signature from the response\n * @return bool True if signature is valid and authentic, false otherwise\n */\nfunction verify_signature(\n    string $invoiceTransNo,\n    string $merchantId,\n    string $merchantOrderNo,\n    string $randomNum,\n    string $totalAmt,\n    string $hashKey,\n    string $hashIv,\n    string $expectedCheckCode\n): bool {\n    // Construct the verification raw string explicitly without urlencoding\n    $rawString = 'HashIV=' . $hashIv .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantId .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . $hashKey;\n\n    $hashed = strtoupper(hash('sha256', $rawString));\n    return hash_equals($expectedCheckCode, $hashed);\n}\n\n// Variables to keep track of the application state\n$apiResponse = null;\n$parsedResponse = [];\n$signatureVerificationResult = null;\n$executionError = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action']) && $_POST['action'] === 'resend_notification') {\n    try {\n        // Collect and sanitize user inputs\n        $mailType = isset($_POST['mail_type']) ? trim($_POST['mail_type']) : '';\n        $invoiceNumber = isset($_POST['invoice_number']) ? trim($_POST['invoice_number']) : '';\n        $buyerEmail = isset($_POST['buyer_email']) ? trim($_POST['buyer_email']) : '';\n        $systemCorrespondNo = isset($_POST['system_correspond_no']) ? trim($_POST['system_correspond_no']) : '';\n\n        // Validate required request parameters\n        if ($mailType === '' || $invoiceNumber === '' || $buyerEmail === '') {\n            throw new Exception('Please fill in all required fields (Mail Type, Invoice Number, and Recipient Email).');\n        }\n\n        if (($mailType === '2' || $mailType === '3') && $systemCorrespondNo === '') {\n            throw new Exception('System Correspond No is required when Mail Type is Allowances or Voiding.');\n        }\n\n        // Prepare raw query parameters for inner PostData_ envelope\n        $postParams = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'MailType' => (int)$mailType,\n            'InvoiceNumber' => $invoiceNumber,\n            'BuyerEmail' => $buyerEmail\n        ];\n\n        if ($mailType === '2' || $mailType === '3') {\n            $postParams['SystemCorrespondNo'] = $systemCorrespondNo;\n        }\n\n        // Build URL-encoded query string for parameters\n        $plaintextQuery = http_build_query($postParams);\n\n        // Encrypt plain query using customized non-standard AES256 CBC PKCS7-B32 scheme\n        $encryptedPostData = encrypt_aes256_cbc_pkcs7_b32($plaintextQuery, AES_KEY, AES_IV);\n\n        // Prepare outermost payload\n        $requestPayload = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        ];\n\n        // Execute communication via cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($requestPayload));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n        $responseBody = curl_exec($ch);\n\n        if ($responseBody === false) {\n            $curlError = curl_error($ch);\n            throw new Exception('Network communication failure: ' . $curlError);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        // curl_close() is intentionally omitted as it has no operational effect in PHP 8.0+\n\n        if ($httpStatusCode !== 200) {\n            throw new Exception('API responded with unexpected HTTP status code: ' . $httpStatusCode);\n        }\n\n        $apiResponse = $responseBody;\n\n        // Parse response parameters (Form-URLencoded query-string representation)\n        parse_str($apiResponse, $parsedResponse);\n\n        // Verify payload structural integrity check\n        $endStr = $parsedResponse['EndStr'] ?? '';\n        if (substr($endStr, -2) !== '##') {\n            throw new Exception('Data transmission incomplete: EndStr terminating bytes \"##\" were not found.');\n        }\n\n        // Perform signature verification if the user supplied historical transaction fields\n        $verifyInvoiceTransNo = isset($_POST['v_invoice_trans_no']) ? trim($_POST['v_invoice_trans_no']) : '';\n        $verifyMerchantOrderNo = isset($_POST['v_merchant_order_no']) ? trim($_POST['v_merchant_order_no']) : '';\n        $verifyRandomNum = isset($_POST['v_random_num']) ? trim($_POST['v_random_num']) : '';\n        $verifyTotalAmt = isset($_POST['v_total_amt']) ? trim($_POST['v_total_amt']) : '';\n        $expectedCheckCode = $parsedResponse['CheckCode'] ?? '';\n\n        if ($expectedCheckCode !== '' && $verifyInvoiceTransNo !== '' && $verifyMerchantOrderNo !== '' && $verifyRandomNum !== '' && $verifyTotalAmt !== '') {\n            $isSignatureValid = verify_signature(\n                $verifyInvoiceTransNo,\n                MERCHANT_ID,\n                $verifyMerchantOrderNo,\n                $verifyRandomNum,\n                $verifyTotalAmt,\n                AES_KEY,\n                AES_IV,\n                $expectedCheckCode\n            );\n            $signatureVerificationResult = $isSignatureValid ? 'VALID' : 'INVALID';\n        }\n\n    } catch (Exception $e) {\n        $executionError = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Travel Invoice API Integration Tool<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background-color: #f8f9fa; color: #212529; margin: 0; padding: 20px; }\n        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n        h1 { font-size: 24px; margin-bottom: 20px; color: #0d6efd; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }\n        h2 { font-size: 18px; margin-top: 30px; margin-bottom: 15px; color: #495057; }\n        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }\n        .form-group { margin-bottom: 15px; }\n        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #495057; }\n        input[type=\"text\"], select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; }\n        input[type=\"text\"]:focus, select:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25); }\n        .btn { display: inline-block; background-color: #0d6efd; color: #fff; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 4px; cursor: pointer; text-decoration: none; transition: background-color 0.15s ease-in-out; }\n        .btn:hover { background-color: #0b5ed7; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }\n        .alert-danger { background-color: #f8d7da; border: 1px solid #f5c2c7; color: #842029; }\n        .alert-success { background-color: #d1e7dd; border: 1px solid #badbcc; color: #0f5132; }\n        .alert-info { background-color: #cff4fc; border: 1px solid #b6effb; color: #055160; }\n        .response-box { background-color: #212529; color: #f8f9fa; padding: 15px; border-radius: 4px; font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; overflow-x: auto; white-space: pre-wrap; margin-top: 10px; }\n        .badge { display: inline-block; padding: 5px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; color: #fff; }\n        .badge-success { background-color: #198754; }\n        .badge-danger { background-color: #dc3545; }\n        .badge-warning { background-color: #ffc107; color: #000; }\n        .card { border: 1px solid #e9ecef; border-radius: 4px; padding: 15px; margin-bottom: 20px; background-color: #fff; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Notification Resend API Gateway<\/h1>\n\n    <?php if ($executionError !== null): ?>\n        <div class=\"alert alert-danger\">\n            <strong>Execution Error:<\/strong> <?php echo htmlspecialchars($executionError); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form action=\"\" method=\"POST\">\n        <input type=\"hidden\" name=\"action\" value=\"resend_notification\">\n\n        <div class=\"grid\">\n            <div>\n                <h2>1. Resend Envelope Parameters (Encrypted Payload)<\/h2>\n                \n                <div class=\"form-group\">\n                    <label for=\"mail_type\">Mail Type (發信類型) *<\/label>\n                    <select id=\"mail_type\" name=\"mail_type\" onchange=\"toggleCorrespondNo(this.value)\">\n                        <option value=\"1\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '1') ? 'selected' : ''; ?>>1 = Invoice Issuance (開立信)<\/option>\n                        <option value=\"2\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '2') ? 'selected' : ''; ?>>2 = Allowance (折讓)<\/option>\n                        <option value=\"3\" <?php echo (isset($_POST['mail_type']) && $_POST['mail_type'] === '3') ? 'selected' : ''; ?>>3 = Voiding (作廢)<\/option>\n                    <\/select>\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"invoice_number\">Invoice Number (收據號碼) *<\/label>\n                    <input type=\"text\" id=\"invoice_number\" name=\"invoice_number\" placeholder=\"e.g. T13671008\" value=\"<?php echo htmlspecialchars($_POST['invoice_number'] ?? ''); ?>\" required>\n                <\/div>\n\n                <div class=\"form-group\" id=\"correspond_no_group\" style=\"display: <?php echo (isset($_POST['mail_type']) && in_array($_POST['mail_type'], ['2', '3'])) ? 'block' : 'none'; ?>;\">\n                    <label for=\"system_correspond_no\">System Correspond No (折讓、作廢流水號) *<\/label>\n                    <input type=\"text\" id=\"system_correspond_no\" name=\"system_correspond_no\" placeholder=\"e.g. 8952\" value=\"<?php echo htmlspecialchars($_POST['system_correspond_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"buyer_email\">Recipient Email Address (收件人 Email) *<\/label>\n                    <input type=\"text\" id=\"buyer_email\" name=\"buyer_email\" placeholder=\"e.g. client@example.com (separated by commas for multiples)\" value=\"<?php echo htmlspecialchars($_POST['buyer_email'] ?? ''); ?>\" required>\n                <\/div>\n            <\/div>\n\n            <div>\n                <h2>2. Verification Parameters (Optional Response Verification)<\/h2>\n                <p style=\"font-size: 13px; color: #6c757d; margin-top: -5px; margin-bottom: 15px;\">\n                    Provide the original parameters from when the invoice was issued to automatically verify the cryptographic signature returned by the gateway.\n                <\/p>\n\n                <div class=\"form-group\">\n                    <label for=\"v_invoice_trans_no\">Stored Invoice Trans No (InvoiceTransNo)<\/label>\n                    <input type=\"text\" id=\"v_invoice_trans_no\" name=\"v_invoice_trans_no\" placeholder=\"Original Invoice Transaction Number\" value=\"<?php echo htmlspecialchars($_POST['v_invoice_trans_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_merchant_order_no\">Stored Merchant Order No (MerchantOrderNo)<\/label>\n                    <input type=\"text\" id=\"v_merchant_order_no\" name=\"v_merchant_order_no\" placeholder=\"Original Merchant Order Number\" value=\"<?php echo htmlspecialchars($_POST['v_merchant_order_no'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_random_num\">Stored Random Number (RandomNum)<\/label>\n                    <input type=\"text\" id=\"v_random_num\" name=\"v_random_num\" placeholder=\"Original Random Verification Code\" value=\"<?php echo htmlspecialchars($_POST['v_random_num'] ?? ''); ?>\">\n                <\/div>\n\n                <div class=\"form-group\">\n                    <label for=\"v_total_amt\">Stored Total Amount (TotalAmt)<\/label>\n                    <input type=\"text\" id=\"v_total_amt\" name=\"v_total_amt\" placeholder=\"Original Total Invoice Amount\" value=\"<?php echo htmlspecialchars($_POST['v_total_amt'] ?? ''); ?>\">\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <div style=\"text-align: right; margin-top: 20px; border-top: 1px solid #e9ecef; padding-top: 20px;\">\n            <button type=\"submit\" class=\"btn\">Process Resend Request &rarr;<\/button>\n        <\/div>\n    <\/form>\n\n    <?php if ($apiResponse !== null): ?>\n        <h2>3. Transaction Response Summary<\/h2>\n        <div class=\"grid\">\n            <div>\n                <div class=\"card\">\n                    <h3>Status Details<\/h3>\n                    <p><strong>Merchant ID:<\/strong> <?php echo htmlspecialchars($parsedResponse['MerchantID'] ?? ''); ?><\/p>\n                    <p>\n                        <strong>Status Code:<\/strong> \n                        <?php if (($parsedResponse['Status'] ?? '') === 'SUCCESS'): ?>\n                            <span class=\"badge badge-success\">SUCCESS<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($parsedResponse['Status'] ?? 'UNKNOWN'); ?><\/span>\n                        <?php endif; ?>\n                    <\/p>\n                    <p><strong>Status Message:<\/strong> <?php echo htmlspecialchars($parsedResponse['Message'] ?? ''); ?><\/p>\n                    <p><strong>Terminator Integrity Block:<\/strong> <code><?php echo htmlspecialchars($parsedResponse['EndStr'] ?? ''); ?><\/code><\/p>\n                <\/div>\n            <\/div>\n\n            <div>\n                <div class=\"card\">\n                    <h3>Signature Status (CheckCode)<\/h3>\n                    <p><strong>Response CheckCode:<\/strong> <span style=\"font-size: 11px; font-family: monospace; word-break: break-all;\"><?php echo htmlspecialchars($parsedResponse['CheckCode'] ?? 'Not Provided'); ?><\/span><\/p>\n                    <p>\n                        <strong>Signature Verification:<\/strong>\n                        <?php if ($signatureVerificationResult === 'VALID'): ?>\n                            <span class=\"badge badge-success\">VALID SIGNATURE<\/span>\n                        <?php elseif ($signatureVerificationResult === 'INVALID'): ?>\n                            <span class=\"badge badge-danger\">SIGNATURE INVALID<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-warning\">INSUFFICIENT DATA TO VERIFY<\/span>\n                        <?php endif; ?>\n                    <\/p>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <h2>Raw Response Payload from Server<\/h2>\n        <div class=\"response-box\"><?php echo htmlspecialchars($apiResponse); ?><\/div>\n    <?php endif; ?>\n<\/div>\n\n<script>\nfunction toggleCorrespondNo(mailType) {\n    const group = document.getElementById('correspond_no_group');\n    const input = document.getElementById('system_correspond_no');\n    if (mailType === '2' || mailType === '3') {\n        group.style.display = 'block';\n        input.setAttribute('required', 'required');\n    } else {\n        group.style.display = 'none';\n        input.removeAttribute('required');\n    }\n}\n<\/script>\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';

                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

                    lblIv.innerHTML = iLabel + ' <span class="text-[10px] text-slate-400 font-normal ml-1">(IV)</span>';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">

                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
