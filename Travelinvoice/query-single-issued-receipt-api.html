a character. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\", and fields themselves must not contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Prerequisites","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download and fill out the application form on the official website, then send it to the Customer Service Center (Fax / Email)<\/p><p>- A maximum of 10 IPs can be set<\/p><p>- Required: Server public IP (not intranet IP, you can check at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely different; data is not shared. Before going live, ensure the integration URL is switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgotten Prerequisite\" Errors<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Cannot retrieve travel agency ID data` → MerchantID incorrect or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Query Process"}]},"apis":[{"name":"Single Receipt Query API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post Parameters","direction":"send","group_type":"None","param_location":"body","field_combina ,"must_return":true,"note":"1. Query successful, returns SUCCESS\n2. Query failed, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Receipt Query Successful","must_return":true,"note":"Text, description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"70565326","must_return":false,"note":"Travel Agency Uniform Invoice Number","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Issuance Sequence No.","example":"193060","must_return":false,"note":"The sequence number when the receipt was issued","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order No.","example":"202005010000008","must_return":false,"note":"The custom order number entered by the travel agency during issuance","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this query","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Random Security Code","example":"85767715","must_return":false,"note":"The 8-digit random security code generated when the receipt was issued","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"ECPay","must_return":false,"note":"The name of the buyer when the receipt was issued, personal name or business name","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer Tax ID","example":"54352706","must_return":false,"note":"1. For B2B recei "500\"},{\"ItemNum\":3,\"ItemName\":\"Service Fee\",\"ItemCount\":\"1\",\"ItemWord\":\"Item\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"Item information at the time of issuance (JSON format).\nItemNum = Item sequence\nItemName = Item name\nItemCount = Quantity\nItemWord = Unit\nItemPrice = Unit price\nItemAmount = Subtotal","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"Status of the receipt.\n1 = Issued (Receipt number generated)\n2 = Cancelled\n3 = Voided","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"The tour name for the receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"O54555","must_return":false,"note":"The tour number for the receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Departure Date","example":"2014-09-25","must_return":false,"note":"The departure date for this receipt; a departure report reminder email will be sent to the designated email address on the departure date","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Report Note","example":"0","must_return":false,"note":"Report status note for the receipt\n0=Not reported\n1=Reported","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"B6C1ABED0F4EC72E5B69A874A070907DF5E27E0A2F1FF2FC5BE0D1D1C6DD6B51","must_return":false,"note":"Used to verify the legitimacy of the returned data. You can compare this parameter during integration to check if it was returned by the platform. Please refer to \"SHA256 Encryption Instructions\" for verification methods. If issuance failed, it returns empty. CheckCode = Hashed value calculated using SHA256 signing specifications on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check for EndStr=## to ensure data integrity.","enum_values":"","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for electronic receipt enablement"},{"code":"KEY10007","reason":"Page session timed out (30 mins)"},{"code":"KEY10009","reason":"Cannot retrieve travel agency ID data"},{"code":"KEY10010","reason":"Travel agency ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut (I/O timeout)"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for mail printing value-added service"},{"code":"KEY10017","reason":"Insufficient balance for mail printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency suspended"},{"code":"NOR10001","reason":"Network connection error"},{"code":"IS10001","reason":"Receipt number not filled"},{"code":"IS10002","reason":"Random security code not filled"},{"code":"IS10003","reason":"DisplayFlag is invalid"},{"code":"BS10015","reason":"Allowance number not filled"},{"code":"BS10016","reason":"Void number not fi /span> 記号を使用してクエリ文字列 (Query String) 形式に結合する必要があります。例： <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにプッシュされます。","msg_res_info_sync":"この結果はシステムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返信されます。","msg_res_format_qs":"返信されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で結合されます。例： <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置されます。","msg_res_format_other":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号化：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化されたフル文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_query-single-issued-receipt-api/fc_2.png"},"meta":{"title":"単一領収書照会API","subtitle":"領収書データの照会","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子領収書発行後、領収書発行パラメータを通じて単一の領収書データを照会できます<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームがフォーマットされた文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中・英・数字・記号はすべて1文字としてカウントします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、フィールド内にこの記号を含めることはできません（U+0026）。<\/span><\/p>"},{"id":"section-2","title":"接続の前提作業","desc":"<p>（必ず完了させてください。そうでない場合、プログラムは確実に失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリア管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリア管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーサービスセンターへ送信（FAX / Email）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 必要情報：サーバーの外部IP（内部IP不可、https://ifconfig.me で確認可能）<\/p><p>- 有効化までの時間：通常1-2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>-テスト環境と本番環境は完全に別の機器であり、データは共有されません。リリース前に接続先URLが本番環境のURLに切り替わっていることを必ず確認してください<\/p><p><br><\/p><p>4. よくある「前提作業の忘れ」によるエラー信号<\/p><p>- `KEY10001 旅行会社API接続用IPではない` → IPホワイトリスト未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が不正確、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社の統一発行番号のデータが取得できない` → MerchantID が誤り、または有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書照会フロー"}]},"apis":[{"name":"単一領収書照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一発行番号","example":"54352706","must_return":false,"note":"旅行会社統一発行番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを結合後、AES256で暗号化。フィールド詳細は次表参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":" mple":"2014-09-25 12:12:12","must_return":false,"note":"領収書の発行日時、例：2014-09-25 12:12:12","enum_values":"","default_value":"","nullable":false},{"name":"ItemDetail","required":"","type":"text","label":"商品明細","example":"[{\"ItemNum\":1,\"ItemName\":\"チケット払戻\",\"ItemCount\":\"1\",\"ItemWord\":\"枚\",\"ItemPrice\":\"-500\",\"ItemAmount\":\"-500\"},{\"ItemNum\":2,\"ItemName\":\"乗車券\",\"ItemCount\":\"1\",\"ItemWord\":\"枚\",\"ItemPrice\":\"500\",\"ItemAmount\":\"500\"},{\"ItemNum\":3,\"ItemName\":\"手数料\",\"ItemCount\":\"1\",\"ItemWord\":\"件\",\"ItemPrice\":\"20\",\"ItemAmount\":\"20\"}]","must_return":false,"note":"発行時の商品情報(JSON形式)。\nItemNum = 品目連番\nItemName = 商品名\nItemCount = 数量\nItemWord = 単位\nItemPrice = 単価\nItemAmount = 小計","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceStatus","required":"","type":"int(1)","label":"領収書ステータス","example":"1","must_return":false,"note":"該領収書のステータス。\n1 = 発行済 (領収書番号あり)\n2 = 発行取消\n3 = 無効化","enum_values":"1,2,3","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"ツアー名","example":"北海道5日間の旅","must_return":false,"note":"当該領収書のツアー名","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"ツアー番号","example":"O54555","must_return":false,"note":"当該領収書のツアー番号","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"ツアー開始予定日","example":"2014-09-25","must_return":false,"note":"当該領収書のツアー開始日。ツアー当日、指定メールアドレスへ出発申告リマインド通知を送信します","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申告注記","example":"0","must_return":false,"note":"申告注記フィールド\n0=未申告\n1=申告済","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"B6C1ABED0F4EC72E5B69A874A070907DF5E27E0A2F1FF2FC5BE0D1D1C6DD6B51","must_return":false,"note":"データの正当性検証用。接続時にこのパラメータを照合し、プラットフォームからのデータかを msg_req_format_qs":"본 블록의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합된 Query String 형식이어야 하며, 예시는 <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>와 같습니다.","msg_req_format_json":"본 블록의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"본 블록의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템이 비동기 방식으로 가맹점에서 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 능동적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템이 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환합니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합된 Query String 형식이며, 예시는 <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>와 같습니다.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 여기에 실제 암호화되는 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_query-single-issued-receipt-api/fc_3.png"},"meta":{"title":"단건 영수증 발행 데이터 조회 API","subtitle":"영수증 발행 데이터 조회","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">전자 영수증 발행 후, 영수증 발행 파라미터를 통해 단건 영수증 데이터를 조회할 수 있습니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded 입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8 입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 포맷팅된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 1문자로 계산합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 필드 내에는 해당 기호를 포함할 수 없습니다(U+0026).<\/span><\/p>"},{"id":"section-2","title":"연동 전 사전 작업","desc":"<p>(반드시 먼저 완료하십시오, 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 구역 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청서를 다운로드하여 작성 후 고객센터로 전송(팩스 / Email)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제출 필요: 서버 외부 IP(내부망 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1-2 영업일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 설비이므로 데이터가 공유되지 않습니다. 서비스 오픈 전 반드시 연동 URL이 운영 환경 URL로 변경되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 미수행' 에러 신호<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못 설정<\/p><p>- `KEY10002 데이터 복호화 에러` → HashKey / HashIV가 부정확하거나 예제 값이 그대로임<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터 조회 불가` → MerchantID 오류 또는 미활성화<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 조회 절차"}]},"apis":[{"name":"단건 영수증 발행 데이터 조회 API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.1","must_return":false,"note":"고정값 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00 시간의 타임스탬프는 1400137200이며, 현재 시간을 넣는 것을 권장합니다","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671005","must_return":false,"note":"이번 조회할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"V","type":"string(8)","label":"영수증 위조 방지 랜덤 코드","example":"85767715","must_return":false,"note":"영수증 발행 시 반환된 8자리 랜덤 코드 (영수증 조회 시 필수).","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1.조회 성공 시 SUCCESS 반환\n2.조회 실패 시 에러 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"영수증 발행 조회 성공","must_return":true,"note":"문자열, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 사업자등록번호","example":"70565326","must_return":false,"note":"여행사 사업자등록번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":  är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen för elektroniska kvitton svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält separeras med \"&amp;\", och får inte innehålla detta tecken (U+0026) inuti sig själva.<\/span><\/p>"},{"id":"section-2","title":"Förberedelser inför integration","desc":"<p>（Vänligen slutför detta först, annars kommer programmet att misslyckas）<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testportalen → Grundinformation → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsportalen → Grundinformation → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningssätt: Ladda ner formuläret från webbplatsen, fyll i och skicka till kundtjänst (fax/e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Obligatoriskt: Extern IP för servern (ej internt nätverk, kan sökas på https://ifconfig.me)<\/p><p>- Aktiveringstid: Normalt 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Test- och produktionsmiljöer är helt separata enheter. Data delas inte. Kontrollera alltid att URL:en är korrekt inställd på produktionsmiljön innan driftsättning.<\/p><p><br><\/p><p>4. Vanliga felorsaker på grund av missade förberedelser<\/p><p>- `KEY10001 Inte en IP för resebyråns API-integration` → IP-vitlistning ej inställd eller felaktig<\/p><p>- `KEY10002 Fel vid datadekryptering` → HashKey/HashIV är felaktiga eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är fel eller ej aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för kvittosökning"}]},"apis":[{"name":"API för sökni           // Sort fields alphabetically by key\n            ksort($signData);\n\n            // Construct the signing string in the format: HashIV={IV值}&Field1={Val1}&...&HashKey={Key值}\n            $signStringParts = [];\n            foreach ($signData as $key => $value) {\n                // IMPORTANT: Do not URL encode values here. Use direct string concatenation.\n                $signStringParts[] = $key . '=' . $value;\n            }\n\n            $signString = 'HashIV=' . $hashIv . '&' . implode('&', $signStringParts) . '&HashKey=' . $hashKey;\n\n            return strtoupper(hash('sha256', $signString));\n        }\n\n        $result_message = '';\n        $result_type = '';\n        $api_response_data = [];\n\n        if ($_SERVER['REQUEST_METHOD'] === 'POST') {\n            try {\n                $invoiceNumber = $_POST['invoice_number'] ?? '';\n                $randomNum = $_POST['random_num'] ?? '';\n\n                if (empty($invoiceNumber) || empty($randomNum)) {\n                    throw new Exception('Invoice Number and Random Number are required.');\n                }\n\n                // Prepare PostData_내含欄位\n                $postDataPayload = [\n                    'Version'       => '1.1',\n                    'TimeStamp'     => strval(time()), // Unix timestamp in seconds\n                    'InvoiceNumber' => $invoiceNumber,\n                    'RandomNum'     => $randomNum,\n                ];\n\n                // Convert payload to querystring format for AES encryption\n                $postDataString = http_build_query($postDataPayload);\n                if ($postDataString === false) {\n                    throw new Exception('Failed to build PostData_ string.');\n                }\n\n                // AES-256 encryption\n                $encryptedPostData = aes_encrypt_pkcs7_32($postDataString, AES_KEY, AES_IV);\n\n                // Prepare the main POST request parameters\n                $requestBody = [\n                    '        $message = $api_response_data['Message'] ?? 'Unknown error occurred.';\n\n                if ($status === 'SUCCESS') {\n                    // Verify the CheckCode\n                    $receivedCheckCode = $api_response_data['CheckCode'] ?? '';\n                    $calculatedCheckCode = generate_sha256_check_code($api_response_data, HASH_KEY, HASH_IV);\n\n                    if ($receivedCheckCode === '') {\n                        // CheckCode might be empty on failure, but for SUCCESS it should be present.\n                        // If CheckCode is empty even on success, it might indicate an issue with API contract or data.\n                        $result_type = 'warning';\n                        $result_message = 'API call successful, but received an empty CheckCode. Cannot verify integrity.';\n                    } elseif (!hash_equals($calculatedCheckCode, $receivedCheckCode)) {\n                        $result_type = 'error';\n                        $result_message = 'API call successful, but CheckCode verification failed! Possible data tampering.';\n                        $result_message .= '<br>Calculated: ' . $calculatedCheckCode;\n                        $result_message .= '<br>Received: ' . $receivedCheckCode;\n                    } else {\n                        $result_type = 'success';\n                        $result_message = 'Query successful. CheckCode verification passed.';\n                    }\n                } else {\n                    $result_type = 'error';\n                    $result_message = \"API Error: {$status} - {$message}\";\n                    // Additional error details from API response\n                    foreach ($api_response_data as $key => $value) {\n                        if ($key !== 'Status' && $key !== 'Message') {\n                            $result_message .= \"<br>{$key}: \" . htmlspecialchars($value);\n                        }\n                    }\n                }\n\n            } catch (Exc         function normalizeApiData(apis) {
            apis.forEach(function(api) {
                var flatRequests = [];
                var flatResponses = [];
                
                function deepFlatten(items, targetList) {
                    if (!items) return;
                    items.forEach(function(item) {
                        var children = item.children || [];
                        item.children = []; 
                        targetList.push(item);
                        deepFlatten(children, targetList);
                    });
                }
                
                deepFlatten(api.requests, flatRequests);
                deepFlatten(api.responses, flatResponses);
                
                var allTables = flatRequests.concat(flatResponses);
                var parentUsage = new Map();
                
                var finalRequests = [];
                var finalResponses = [];
                
                allTables.forEach(function(item) {
                    var foundParent = null;
                    
                    for (var i = 0; i < allTables.length; i++) {
                        var p = allTables[i];
                        if (p === item) continue;
                        if (!p.params || p.params.length === 0) continue;
                        
                        var matchedParamName = null;
                        
                        if (item.from_field) {
                            var fromFieldStr = item.from_field.replace(/\s+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) { 
                                return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) { 
                                    return (param.name || '').replace(/\s+/g, '').toLowerCase() === fromFieldStr;
                                });
                            }
                            if (matchParam) matchedParamName = matchParam.name;
                        }
                        
                        if (!matchedParamName && item.title) {
                            var titleStr = item.title.replace(/[\s\-_]+/g, '').toLowerCase();
                            var matchParam = p.params.find(function(param) {
                                var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                return pName.length >= 3 && titleStr.indexOf(pName) !== -1 && 
                                       (param.type && param.type.toLowerCase().indexOf('array') !== -1);
                            });
                            if (!matchParam) {
                                matchParam = p.params.find(function(param) {
                                    var pName = (param.name || '').replace(/[\s\-_]+/g, '').toLowerCase();
                                    return pName.length >= 3 && titleStr.indexOf(pName) !== -1;
                                });
                            }
                            if (matchParam) {
                                matchedParamName = matchParam.name;
                                item.from_field = matchParam.name;
                            }
                        }
                        
                        if (matchedParamName) {
                            if (!parentUsage.has(p)) parentUsage.set(p, new Set());
                            if (!parentUsage.get(p).has(matchedParamName)) {
                                foundParent = p;
                                parentUsage.get(p).add(matchedParamName);
                                break;
                            }
                        }
                    }
                    
                    if (foundParent) {
                        foundParent.children.push(item);
                    } else {
                        if (flatRequests.indexOf(item) !== -1) {
                            finalRequests.push(item);
                        } else if (flatResponses.indexOf(item) !== -1) {
                            finalResponses.push(item);
                        }
                    }
                });
                
                api.requests = finalRequests;
                api.responses = finalResponses;
            });
        }

                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }

                    link.classList.remove('sidebar-active');

            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {

                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;

        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
