(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"名詞定義","desc":"<p>預約收據：開立收據時，如將此收據開立設定為預約收據，就表示會在指定日期，將該收據配上收據號碼（收據號碼為系統配發，不能指定）<\/p><p>取消預約收據：在指定日期前，都可以將預約收據取消<\/p><p>提前觸發收據：在指定日期前，可提前將預約收據配上收據號碼（收據號碼為系統配發，不能指定）<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立收據流程-【觸發預約開立】或【取消預約開立】"}]},"apis":[{"name":"觸發或取消預約收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","pa t.","msg_res_info_sync":"The results will be returned synchronously via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"Returned fields will be combined as a Query String using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification & Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data after reception.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"The full string to be encrypted will be displayed here after pressing the hash button...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_1.png"},"meta":{"title":"Trigger or Cancel Scheduled Receipt API","subtitle":"Trigger ahead or cancel scheduled receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact the customer service center to apply for IP settings. You can set up to 10 IP addresses.<\/span><\/p><p>2. Manage already issued scheduled receipts.<\/p><p>3. Trigger issued scheduled receipts early or cancel the scheduled receipt.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Calculation unit for each field is a character. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&amp;\"; this character (U+0026) must not be contained within field values.<\/span><\/p>"},{"id":"section-2","title":"Definitions","desc":"<p>Scheduled Receipt: When issuing a receipt, if it is set as a scheduled receipt, it means the system will assign a receipt number (assigned by the system, cannot be specified) on the designated date.<\/p><p>Cancel Scheduled Receipt: A scheduled receipt can be cancelled at any time before the designated date.<\/p><p>Trigger Receipt Early: Before the designated date, a scheduled receipt can be triggered early to assign a receipt number (assigned by the system, cannot be specified).<\/p>"},{"id":"section-3","title":"Pre-integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Testing Environment: Log in to the test portal → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production portal → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be configured<\/p><p>- Required: Server's outgoing IP (not internal IP, check via https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test and production environments are completely separate; data is not shared. Ensure you switch to the production URL before going live.<\/p><p><br><\/p><p>4. Common Errors for \"Forgetting Pre-integration Tasks\"<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using sample values<\/p><p>- `KEY10009 Unable to retrieve travel agency UBN data` → MerchantID incorrect or not activated<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Issuance Process - [Trigger Scheduled] or [Cancel Scheduled]"}]},"apis":[{"name":"Trigger or Cancel Scheduled Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":false,"note":"Travel Agency Unified Business Number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"The result of AES256 encryption after combining string fields. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"", iceTransNo","required":"","type":"string(20)","label":"Issue Sequence Number","example":"351254","must_return":false,"note":"The sequence number for this receipt issuance or cancellation.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order Number","example":"O_201406010001","must_return":false,"note":"The custom order number provided by the travel agency during issuance.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"20532","must_return":false,"note":"The amount for this receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"The receipt number for this issuance. (Empty for cancellations)","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Anti-counterfeit Random Number","example":"94414538","must_return":false,"note":"The 8-digit random number generated for this receipt. (Empty for cancellations)","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Receipt Issue Time","example":"2014-09-25 12:12:12","must_return":false,"note":"The time the receipt was issued, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"E038CCC4547DAC7E100F720396A43E552288D0CBE6B0B55D75C166CEC2AAD476","must_return":false,"note":"Used to verify the validity of the returned data. You can compare this during integration to ensure it originated from the platform. Refer to \"SHA256 Encryption Details\" for the verification method. Returns empty if issuance fails.\n\nCheckCode = Hash value calculated using SHA256 specs based on InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String Terminator","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check for EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Non-travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency UBN data"},{"code":"KEY10010","reason":"Travel agency UBN is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for mailing print value-added service"},{"code":"KEY10017","reason":"Insufficient balance for mailing print value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"INV10003","reason":"Product information format error or missing data"},{"code":"INV10004","reason":"Product subtotal calculation error in product info"},{"code":"INV10012","reason":"Receipt amount verification error"},{"code":"INV10013","reason":"Receipt field data incomplete or format error"},{"code":"INV10014","reason":"Custom order number format error"},{"code":"INV10016","reason":"Duplicate custom order number an> に配置して送信してください。","msg_req_format_qs":"このブロックのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で組み合わせる必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて送信する必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにアクティブにプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 形式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返されます。","msg_res_format_qs":"返却されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で組み合わされます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて返されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"ハッシュ前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_2.png"},"meta":{"title":"予約領収書の発行トリガーまたはキャンセルAPI","subtitle":"予約領収書の事前発行トリガーまたはキャンセル","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 連携前にカスタマーセンターへ連絡し、IP設定を申請してください。設定可能なIP数は10組です。<\/span><\/p><p>2. すでに発行された予約領収書を管理します。<\/p><p>3. すでに作成された予約を事前に発行（トリガー）またはキャンセルすることができます。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字エンコーディングは UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列で応答します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。全角、半角、英数字、記号はすべて1文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」で連結されます。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"用語定義","desc":"<p>予約領収書：領収書発行時、予約領収書として設定すると、指定された日にその領収書に領収書番号が割り当てられます（番号はシステムで割り当てられ、指定不可）。<\/p><p>予約領収書のキャンセル：指定された日付の前であれば、予約領収書をキャンセルできます。<\/p><p>領収書の事前トリガー：指定された日付の前であれば、予約領収書に領収書番号を事前に割り当てて発行できます（番号はシステムで割り当てられ、指定不可）。<\/p>"},{"id":"section-3","title":"連携前準備","desc":"<p>（必ず完了させてください。そうしないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境の管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境の管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーセンターに送信（FAX / メール）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 提出物：サーバーの外部IP（内部IPではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常1-2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。公開前に必ず連携URLが本番環境のものに切り替わっていることを確認してください。<\/p><p><br><\/p><p>4. よくある「準備忘れ」によるエラーメッセージ<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV が不正確、またはサンプルのまま<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID が誤っているか、有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書発行フロー - 【予約発行のトリガー】または【予約発行のキャンセル】"}]},"apis":[{"name":"予約領収書の発行トリガーまたはキャンセルAPI","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post パラメータ","direction" "desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 영수증 데이터를 전자 영수증 플랫폼에 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 「&amp;」를 연결 기호로 사용하며, 각 필드 내부에는 이 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"용어 정의","desc":"<p>예약 영수증: 영수증 발행 시 해당 영수증 발행을 예약 영수증으로 설정하면, 지정된 날짜에 해당 영수증에 영수증 번호가 부여됨을 의미합니다(영수증 번호는 시스템에서 배정하며 지정할 수 없음).<\/p><p>예약 영수증 취소: 지정된 날짜 전까지는 예약 영수증을 취소할 수 있습니다.<\/p><p>조기 실행 영수증: 지정된 날짜 전이라도 예약 영수증에 영수증 번호를 미리 부여할 수 있습니다(영수증 번호는 시스템에서 배정하며 지정할 수 없음).<\/p>"},{"id":"section-3","title":"연동 전 사전 작업","desc":"<p>(반드시 먼저 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 양식을 다운로드하여 작성 후 고객센터로 전송(팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제공 항목: 서버 외부 IP(내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 1-2 영업일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 오픈 전에 반드시 연동 URL을 실제 구역 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 「사전 작업 누락」 에러 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 샘플 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 가져올 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 발행 프로세스 - 【예약 발행 실행】 또는 【예약 발행 취소】"}]},"apis":[{"name":"예약 영수증 실행 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url type":"int(1)","label":"영수증 상태","example":"1","must_return":false,"note":"1 = 발행 확정.\n2 = 예약 발행 취소.","enum_values":"1,2","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 실행 성공 또는 취소 성공 시 SUCCESS 반환\n2. 발동 실패 시 에러 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"발행 일련번호","example":"351254","must_return":false,"note":"이번 영수증 발행 또는 취소 발행의 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"여행사가 영수증 발행 시 제공한 사용자 정의 번호","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"영수증 금액","example":"20532","must_return":false,"note":"이번에 발행된 영수증의 금액","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671009","must_return":false,"note":"InvoiceNumber 영수증 번호 Varchar(9) 이번에 발행된 영수증의 영수증 번호 (발행 취소 시 빈 값).","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"영수증 위조 방지 랜덤 코드","example":"94414538","must_return":false,"note":"이번 영수증 발행 시 생성된 8자리 위조 방지 랜덤 코드 (발행 취소 시\n빈 값).","enum_values":"","default_value":"","nullable":false} an>-objekt för överföring.","msg_req_format_other":"Fälten i detta block kombineras med formatet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_req_security":"Datasäkerhet: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning måste slutföras före överföring.","msg_res_info_webhook":"Detta resultat kommer att skickas aktivt av systemet i asynkron form till den <span class=\\\"font-bold text-green-700\\\">Webhook<\/span>-adress som butiken angett.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> i <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras med symbolen <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> till ett Query String-format, till exempel <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten kommer att placeras i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt för överföring.","msg_res_format_other":"De returnerade fälten använder formatet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_res_security":"Verifiering och dekryptering: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs för specifik data efter mottagande.","lbl_sha_pre_hash":"Sträng före kryptering (String to Hash)","ph_sha_pre_hash":"Efter att ha klickat på krypteringsknappen visas den faktiska fullständiga strängen som krypteras här...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_4.png"},"meta":{"title":"API för att utlösa eller avbryta bokade kvitton","subtitle":"Utlös i förväg eller avbryt bokade kvitton","version":"","sections":[{"id":"section-0","title":"Syfte med integration","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Kontakta kundtjänst för att ansöka om IP-inställningar före integration. Upp till 10 IP-adresser kan ställas in.<\/span><\/p><p>2. Hantera redan utfärdade bokade kvitton.<\/p><p>3. Möjlighet att utfärda (utlösa) redan bokade kvitton i förväg eller avbryta det bokade kvittot.<\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittodata till plattformen för elektroniska kvitton via \"HTTP POST\" för utfärdande. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen för elektroniska kvitton svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&amp;\", och detta tecken (U+0026) får inte finnas inuti fälten.<\/span><\/p>"},{"id":"section-2","title":"Definitioner","desc":"<p>Bokat kvitto: Vid utfärdande av kvitto, om detta ställs in som ett bokat kvitto, innebär det att kvittot kommer att tilldelas ett kvittonummer på ett angivet datum (kvittonumret tilldelas av systemet och kan inte väljas själv).<\/p><p>Avbryt bokat kvitto: Före det angivna datumet kan det bokade kvittot avbrytas.<\/p><p>Utlös kvitto i förväg: Före det angivna datumet kan ett bokat kvitto tilldelas ett kvittonummer i förväg (kvittonumret tilldelas av systemet och kan inte väljas själv).<\/p>"},{"id":"section-3","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in i testmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktionsmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Maximalt 10 IP-adresser kan ställas in<\/p><p>- Krav: Tillhandahåll serverns externa IP (inte intern IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika miljöer och data delas inte. Se till att växla integrations-URL till produktionsmiljön före driftsättning.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte resebyråns API-integrations-IP` → IP-vitlistning är inte inställd eller är felaktig<\/p><p>- `KEY10002 Fel vid dekryptering av data` → HashKey / HashIV är inkorrekt eller fortfarande ett exempelvärde<\/p><p>- `KEY10009 Kan inte hitta data för resebyråns organisationsnummer` → MerchantID är fel eller inte aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för utfärdande av kvitto - 【Utlös bokning】 eller 【Avbryt bokning】"}]},"apis":[{"name":"API för att utlösa eller avbryta bokade kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"AES256-kryptering utförs efter att strängfälten har kombinerats, fä         const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use\n * Replace all placeholder constants (e.g. YOUR_API_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// Define credential constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption Key and SHA256 signature HashKey\ndefine('API_KEY', 'YOUR_API_KEY_HERE');\n\n// 16 bytes — used for both AES-256 encryption IV and SHA256 signature HashIV.\n// IV length is 16 bytes because AES block size is fixed at 16 bytes.\ndefine('API_IV', 'YOUR_API_IV_HERE');\n\n// Select API Endpoint (Uncomment the desired environment)\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/invoice_touch_issue'); // Test environment\n// define('API_URL', 'https://api.travelinvoice.com.tw/invoice_touch_issue'); // Production environment\n\n// Startup safety check to block execution if credentials are still placeholder values\n$hasPlaceholder = (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_API_KEY_HERE' || API_IV === 'YOUR_API_IV_HERE');\n\n$executionError = null;\n$apiResponseRaw = null;\n$apiResponseParsed = [];\n$isSignatureValid = null;\n\n/**\n * Verification (驗證回應簽章)\n *\n * Validates the authenticity of the response data using SHA256.\n *\n * @param string $invoiceTransNo\n * @param string $merchantID\n * @param string $merchantOrderNo\n * @param string $randomNum\n * @param string $totalAmt\n * @param string $expectedCheckCode\n * @return bool\n */\nfunction verifyResponseSignature($invoiceTransNo, $merchantID, $merchantOrderNo, $randomNum, $totalAmt, $expectedCheckCode) {\n    // Build SHA256 raw string using direct concatenation to avoid unintended URL-encoding.\n    $rawString = 'HashIV=' . API_IV .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantID .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . API_KEY;\n\n    $calculatedHash = strtoupper(hash('sha256', $rawString));\n    return hash_equals($calculatedHash, strtoupper($expectedCheckCode));\n}\n\n// Process the form submission\nif (!$hasPlaceholder && $_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $invoiceID = isset($_POST['InvoiceID']) ? trim($_POST['InvoiceID']) : '';\n        $merchantOrderNo = isset($_POST['MerchantOrderNo']) ? trim($_POST['MerchantOrderNo']) : '';\n        $totalAmt = isset($_POST['TotalAmt']) ? trim($_POST['TotalAmt']) : '';\n        $status = isset($_POST['Status']) ? trim($_POST['Status']) : '1';\n\n        // Validate basic parameters\n        if ($invoiceID === '' || $merchantOrderNo === '' || $totalAmt === '') {\n            throw new Exception('Please fill in all required fields.');\n        }\n\n        // Build AES plaintext query string\n        $plaintextFields = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'InvoiceID' => (string)intval($invoiceID),\n            'MerchantOrderNo' => $merchantOrderNo,\n            'TotalAmt' => (string)intval($totalAmt),\n            'Status' => (string)intval($status)\n        ];\n\n        $plaintextParts = [];\n        foreach ($plaintextFields as $key => $val) {\n            $plaintextParts[] = $key . '=' . $val;\n        }\n        $plaintext = implode('&', $plaintextParts);\n\n        /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n         * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n         * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n         * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n         * Each padding byte value equals paddingLen.\n         * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n         * to prevent the library from applying its own PKCS7 padding. */\n        $blockSize = 32;\n        $padLen = $blockSize - (strlen($plaintext) % $blockSize);\n        $paddedPlaintext = $plaintext . str_repeat(chr($padLen), $padLen);\n\n        // Encrypt using AES-256-CBC with manually padded string\n        $encryptedBytes = openssl_encrypt(\n            $paddedPlaintext,\n            'AES-256-CBC',\n            API_KEY,\n            OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n            API_IV\n        );\n\n        if ($encryptedBytes === false) {\n            throw new Exception('AES encryption process failed.');\n        }\n\n        $encryptedHex = bin2hex($encryptedBytes);\n\n        // Prepare POST request body\n        $postParams = [\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedHex\n        ];\n\n        // Execute HTTP request using cURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($postParams));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYHOST, 2);\n\n        $response = curl_exec($ch);\n\n        if ($response === false) {\n            $errorMsg = curl_error($ch);\n            throw new Exception('Network communication failure: ' . $errorMsg);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpStatusCode !== 200) {\n            throw new Exception('API Server responded with unexpected HTTP Status Code: ' . $httpStatusCode);\n        }\n\n        $apiResponseRaw = $response;\n\n        // Parse response content (URL-encoded plain text string)\n        parse_str($response, $apiResponseParsed);\n\n        // Verify transmission integrity via EndStr flag (using PHP 7.4 safe string ends check)\n        $endStrCheck = $apiResponseParsed['EndStr'] ?? '';\n        $rawResponseEndsCorrectly = (substr(trim($response), -2) === '##');\n        if ($endStrCheck !== '##' && !$rawResponseEndsCorrectly) {\n            throw new Exception('Response warning: Data transmission stream incomplete (missing EndStr indicator).');\n        }\n\n        // Run signature check verification if expected parameters exist\n        if (isset($apiResponseParsed['CheckCode']) && $apiResponseParsed['CheckCode'] !== '') {\n            $isSignatureValid = verifyResponseSignature(\n                $apiResponseParsed['InvoiceTransNo'] ?? '',\n                $apiResponseParsed['MerchantID'] ?? '',\n                $apiResponseParsed['MerchantOrderNo'] ?? '',\n                $apiResponseParsed['RandomNum'] ?? '',\n                $apiResponseParsed['TotalAmt'] ?? '',\n                $apiResponseParsed['CheckCode']\n            );\n        }\n\n    } catch (Exception $e) {\n        $executionError = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Trigger / Cancel Reservation Receipt API - Integration Portal<\/title>\n    <style>\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n            line-height: 1.6;\n            color: #333;\n            background-color: #f8f9fa;\n            margin: 0;\n            padding: 20px;\n        }\n        .container {\n            max-width: 900px;\n            margin: 0 auto;\n            background: #fff;\n            padding: 30px;\n            border-radius: 8px;\n            box-shadow: 0 4px 6px rgba(0,0,0,0.1);\n        }\n        h1 {\n rnally generated tracking parameter';\n                                    break;\n                                case 'TotalAmt':\n                                    echo 'Final settled transactional dollar unit amount';\n                                    break;\n                                case 'InvoiceNumber':\n                                    echo 'Assigned tax invoice sequence serial identifier';\n                                    break;\n                                case 'RandomNum':\n                                    echo 'Security anti-forgery validation random check numeric';\n                                    break;\n                                case 'CheckCode':\n                                    echo 'Cryptographic payload identity proof string';\n                                    break;\n                                default:\n                                    echo 'Response parameter field';\n                            }\n                            ?>\n                        <\/td>\n                    <\/tr>\n                <?php endforeach; ?>\n            <\/tbody>\n        <\/table>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');

            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
