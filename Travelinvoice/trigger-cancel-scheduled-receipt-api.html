ng format","req_title":"Request Parameters","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Testing)","th_param":"Parameter Name","th_name":"Description","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rules","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the merchant to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters according to the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output format: <span class=\"font-bold text-red-600\">Hex<\/span><br>Key / IV: Please use your organization's Hash Key and Hash IV.","enc_step3_title":"Convert to Hex","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase) to get the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Use SHA256 hashing to generate a checksum, which can be used to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters alphabetically (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Append IV and Key","enc_sha_step2_desc":"Append HashIV and HashKey to the front and back of the sorted string, respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the combined string and convert the result to <strong>uppercase<\/strong>.","res_title":"Response Parameters matted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field is calculated by characters. Chinese characters, English letters, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. The \"&amp;\" symbol is used as a connector between fields, and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Term Definitions","desc":"<p>Reservation Receipt: When issuing a receipt, if set as a reservation receipt, it will be assigned a receipt number on the specified date (Receipt numbers are assigned by the system and cannot be specified).<\/p><p>Cancel Reservation Receipt: Reservation receipts can be canceled before the specified date.<\/p><p>Trigger Receipt in Advance: Before the specified date, a reservation receipt can be assigned a receipt number in advance (Receipt numbers are assigned by the system and cannot be specified).<\/p>"},{"id":"section-3","title":"Integration Prerequisites","desc":"<p>(Please complete these, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download the application form from the official website, fill it out, and send it to the Customer Service Center (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server external IP (not internal IP, can be checked via https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different systems; data is not shared. Before going live, ensure the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Prerequisites\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using sample values<\/p><p>- `KEY10009 Cannot retrieve travel agency Tax ID data` → MerchantID incorrect or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Issuance Flow - [Trigger Reservation Issuance] or [Cancel Reservation Issuance]"}]},"apis":[{"name":"Trigger or Cancel Reservation Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency uniform invoice number (Tax ID).","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encrypted string after field combination. See table below for field details.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed as 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), the number of seconds from 1970-01-01 00:00:00 UTC to now\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceID","required":"V","type":"int(20)","label":"Issuance ID","example":"351254","must_return":false,"note":"The issuance ID responded by the system when the receipt was created.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Order No.","example":"O_201406010001","must_return":false,"note":"1. Travel agency custom order number, limited to English, numeric, and “_” format.\n2. Can be used for mapping with the merchant's internal system, such as order ID, accounting number, etc.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Receipt Amount","example":"2542","must_return":false,"note":"The amount for this receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Receipt Status","example":"1","must_return":false,"note":"1 = Confirm issuance.\n2 = Cancel reservation issuance.","enum_values":"1,2","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS upon successful trigger or cancellation.\n2. Returns error code upon failure.","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID","enum_values":"", alue calculated by signing InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String Terminator","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must check if EndStr=## to ensure data transfer integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for e-receipt enablement"},{"code":"KEY10007","reason":"Page session timed out (30 minutes)"},{"code":"KEY10009","reason":"Cannot retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is empty"},{"code":"KEY10011","reason":"PostData_ field is empty"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is empty"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for mail printing value-added service"},{"code":"KEY10017","reason":"Insufficient mail printing value-added service quota"},{"code":"KEY10018","reason":"Issuer field is not filled"},{"code":"KEY10019","reason":"Travel agency account suspended"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"INV10003","reason":"Product information format error or missing data"},{"code":"INV10004","reason":"Product information subtotal calculation error"},{"code":"INV10012","reason":"Receipt amount verification error"},{"code":"INV10013","reason":"Receipt field data incomplete or format error"},{"code":"INV10014","reason":"Custom order number format error"},{"code":"INV10016","reason":"Custom order number duplicated"},{"code":"INV20001","reason":"No available track codes"},{"code":"INV20002","reason":"Failed to retrieve track code"},{"code":"INV20003","reason":"Track code fully utilized"},{"code":"INV20004","reason":"Receipt issuance failed"},{"code":"INV20005","reason":"Failed to write to receipt product table"},{"code":"INV20006","reason":"No receipt data found"},{"code":"INV20007","reason":"System date has reached scheduled issuance date; cannot cancel reservation"},{"code":"INV20008","reason":"Failed to cancel reservation receipt issuance"},{"code":"INV20010","reason":"Scheduled issuance date is empty"},{"code":"INV20011","reason":"Scheduled issuance date format is incorrect"},{"code":"INV20012","reason":"Scheduled issuance date cannot be earlier than the system date"},{"code":"INV20013","reason":"Scheduled issuance extension date format is incorrect"},{"code":"INV20014","reason":"Tax ID input error"},{"code":"INV20015","reason":"Buyer Tax ID not filled"},{"code":"INV20016","reason":"Buyer name not filled"},{"code":"INV20018","reason":"Scheduled tour date format is incorrect"},{"code":"INV20100","reason":"Data writing anomaly"},{"code":"INV70001","reason":"Field data format error"}],"versions":[]},

700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式に連結する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信してください。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わせてください。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理が必要です。","msg_res_info_webhook":"この結果はシステムから非同期で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにプッシュされます。","msg_res_info_sync":"この結果はシステムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期返信されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式に連結されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して返却されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前連結文字列 (String to Hash)","ph_sha_pre_hash":"暗号化ボタン押下後、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_2.png"},"meta":{"title":"予約領収書の発行またはキャンセルAPI","subtitle":"予約領収書の早期発行またはキャンセル","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p>1.既に作成済みの予約領収書を管理します。<\/p><p>2.既に作成済みの予約領収書を早期に発行（トリガー）するか、その予約領収書をキャンセルできます。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返答します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。中国語、英語、数字、記号はすべて1文字とみなされます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を区切り文字とし、フィールド内にはこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"用語定義","desc":"<p>予約領収書：領収書発行時、この領収書を予約領収書として設定すると、指定日に領収書番号が付与されます（領収書番号はシステムが自動採番し、指定はできません）<\/p><p>予約領収書のキャンセル：指定日前であれば、予約領収書をキャンセル可能です<\/p><p>領収書の早期発行：指定日前であれば、予約領収書に早期に領収書番号を付与できます（領収書番号はシステムが自動採番し、指定はできません）<\/p>"},{"id":"section-3","title":"接続前の準備","desc":"<p>（必ず完了させてください。完了していない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストサイト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番サイト管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後カスタマーサービスセンターへ送付（FAX / Email）<\/p><p>- 最大10組のIP設定が可能<\/p><p>- 必要事項：サーバーの外部IP（イントラネットIPではなく、https://ifconfig.me で確認可能）<\/p><p>- 反映時間：通常1〜2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。リリース前に必ず接続URLを本番環境のURLに切り替えたことを確認してください<\/p><p><br><\/p><p>4. よくある「接続前の準備忘れ」によるエラー信号<\/p><p>- `KEY10001 旅行会社API接続IPではありません` → IPホワイトリスト未設定または設定誤り<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が不正確またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社統一コードのデータを取得できません` → MerchantID の誤りまたは未有効化<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書発行フロー - 【予約発行をトリガー】または【予約発行をキャンセル】"}]},"apis":[{"name":"予約領収書の発行またはキャンセルAPI","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一コード","example":"54352706","must_return":false,"note":"旅行会社の統一コード。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを組み合わせた後、AES256で暗号化。フィールド詳細は下記表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"固定値 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）、1970-01-01 00:00:00 UTCからの経過秒数\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200。現在時刻の入力推奨","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceID","required":"V","type":"int(20)","label":"発行シーケンス番号","example":"351254","must_return":false,"note":"領収書発行時にシステムが応答した発行シーケンス番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"カスタム番号","example":"O_201406010001","must_return":false,"note":"1.旅行会社独自の注文番号、英数字および「_」のみ使用可能。\n2.事業者内部システムとの照合に使用可能。注文シーケンス番号や会計番号などを入力","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"領収書金額","example":"2542","must_return":false,"note":"今回の領収書発行金額。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"領収書ステータス","example":"1","must_return":false,"note":"1 = 発行確定。\n2 = 予約発行のキャンセル。","enum_values":"1,2","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1.トリガー成功またはキャンセル成功の場合、SUCCESSを返却\n2.実行失敗の場合、エラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"54352706","must_return":false,"note":"旅行会社統一コード","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"発行シーケンス番号","example":"351254","must_return":false,"note":"今回の領収書発行またはキャンセル発行のシーケンス番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"O_201406010001","must_return":false,"note":"領収書発行時に旅行会社が提供したカスタム番号","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"領収書金額","example":"2542","must_return":false,"note":"今回の領収書発行金額","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671009","must_return":false,"note":"今回の領収書番号。(キャンセル時は空値)","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"領収書偽造防止ランダムコード","example":"94414538","must_return":false,"note":"今回の領収書発行で生成された8桁の偽造防止ランダムコード。(キャンセル時は空値)","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"領収書発行時間","example":"2014-09-25 12:12:12","must_return":false,"note":"今回の領収書発行時間、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"E038CCC4547DAC7E100F720396A43E552288D0CBE6B0B55D75C166CEC2AAD476","must_return":false,"note":"データの整合性を確認するためのチェックコード。接続時にこのパラメータを照合し、プラットフォームからの応答か確認してください。照合方法は「SHA256暗号化説明」を参照してください。発行失敗時は空値。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt をSHA256署名仕様に従って計算したハッシュ値","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定値 ## を返却。String方式でデータ受信するユーザーは、EndStr=## を確認し、データの完全な伝送を確保してください。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API接続IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不完全"},{"code":"KEY10006","reason":"旅行会社が電子領収書の利用申請をしていません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超過しました"},{"code":"KEY10009","reason":"旅行会社統一コードのデータを取得できません"},{"code":"KEY10010","reason":"旅行会社統一コードが未入力です"},{"code":"KEY10011","reason":"PostData_フィールドが未入力です"},{"code":"KEY10012","reason":"データ送信エラー"},{"code":"KEY10013","reason":"データが空です"},{"code":"KEY10014","reason":"TimeOut。通常I/Oタイムアウトを示します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行会社が郵送印刷サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷サービスの使用可能数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未入力です"},{"code":"KEY10019","reason":"旅行会社が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV10003","reason":"商品情報形式エラーまたはデータ不足"},{"code":"INV10004","reason":"商品小計の計算エラー"},{"code":"INV10012","reason":"領収書金額検証エラー"},{"code":"INV10013","reason":"領収書フィールドデータが不足または形式エラー"},{"code":"INV10014","reason":"カスタム番号の形式エラー"},{"code":"INV10016","reason":"カスタム番号の重複"},{"code":"INV20001","reason":"使用可能な字句番号が見つかりません"},{"code":"INV20002","reason":"字句番号の取得失敗"},{"code":"INV20003","reason":"字句番号が使い果たされました"},{"code":"INV20004","reason":"領収書発行失敗"},{"code":"INV20005","reason":"領収書商品テーブルへの書き込み失敗"},{"code":"INV20006","reason":"領収書データが見つかりません"},{"code":"INV20007","reason":"システム日が予定発行日を超えているため、予約発行のキャンセル不可"},{"code":"INV20008","reason":"予約領収書の発行キャンセル失敗"},{"code":"INV20010","reason":"予約発行日が空です"},{"code":"INV20011","reason":"予約発行日の形式が不正確です"},{"code":" g_req_format_qs":"이 구역의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 결합하여 쿼리 문자열(Query String) 형식으로 만들어야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 구역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 넣어 전달해야 합니다.","msg_req_format_other":"이 구역의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 채택하여 결합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"이 결과는 시스템이 비동기 방식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 능동적으로 푸시합니다.","msg_res_info_sync":"이 결과는 시스템이 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식을 사용하여 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>을 통해 동기식으로 반환합니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 결합하여 쿼리 문자열(Query String) 형식으로 구성됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 안에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 채택하여 결합됩니다.","msg_res_security":"검증 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 결합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 여기에 실제 암호화된 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_3.png"},"meta":{"title":"예약 영수증 트리거 또는 취소 API","subtitle":"예약 영수증 사전 트리거 또는 취소","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p>1. 기 발급된 예약 영수증 관리.<\/p><p>2. 이미 발급된 예약을 미리 발급(트리거)하거나 해당 예약 영수증을 취소 가능<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼에 전송하여 발급합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded 입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 포맷된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 1문자로 계산합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 필드 내에는 이 문자를 포함할 수 없습니다 (U+0026).<\/span><\/p>"},{"id":"section-2","title":"용어 정의","desc":"<p>예약 영수증: 영수증 발급 시 예약 영수증으로 설정하면 지정된 날짜에 영수증 번호를 부여합니다 (영수증 번호는 시스템이 배정하며 지정 불가).<\/p><p>예약 영수증 취소: 지정된 날짜 이전에는 예약 영수증을 취소할 수 있습니다.<\/p><p>영수증 사전 트리거: 지정된 날짜 이전이라도 미리 예약 영수증에 영수증 번호를 부여할 수 있습니다 (영수증 번호는 시스템이 배정하며 지정 불가).<\/p>"},{"id":"section-3","title":"연동 사전 작업","desc":"<p>(반드시 먼저 완료하십시오. 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 관리자 페이지 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 경로: 공식 홈페이지에서 신청 서식을 다운로드 및 작성 후 고객센터로 전송 (팩스 / Email)<\/p><p>- 최대 10개 IP 설정 가능<\/p><p>- 제출 항목: 서버 외부 IP (내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 영업일 기준 1~2일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 상용화 전 반드시 연동 URL을 운영 환경 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 누락' 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자등록번호 데이터를 찾을 수 없음` → MerchantID가 잘못되었거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 발급 프로세스 - [예약 발급 트리거] 또는 [예약 발급 취소]"}]},"apis":[{"name":"예약 영수증 트리거 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자등록번호","example":"54352706","must_return":false,"note":"여행사 사업자등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 결합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00 시점의 타임스탬프는 1400137200, 현재 시간 입력 권장","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceID","required":"V","type":"int(20)","label":"발급 일련번호","example":"351254","must_return":false,"note":"영수증 발급 시 시스템이 응답한 발급 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"1. 여행사 자체 주문 번호, 영문, 숫자, '_' 형식으로 제한.\n2. 가맹점 내부 시스템 대응용, 주문 일련번호, 회계 번호 등 입력 가능","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"영수증 금액","example":"2542","must_return":false,"note":"이번 영수증 발급 금액.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"영수증 상태","example":"1","must_return":false,"note":"1 = 발급 확인.\n2 = 예약 발급 취소.","enum_values":"1,2","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location": ample":"E038CCC4547DAC7E100F720396A43E552288D0CBE6B0B55D75C166CEC2AAD476","must_return":false,"note":"데이터 반환의 적법성을 검증하기 위한 코드. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환된 것인지 확인하십시오. 검증 방법은 'SHA256 암호화 설명'을 참조하십시오. 발급 실패 시 빈 값 반환.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정적으로 ## 반환. String 방식으로 데이터를 수신하는 사용자는 EndStr=##을 추가로 판단하여 데이터 전달이 완전한지 확인해야 합니다.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사가 전자 영수증 사용 신청을 하지 않음"},{"code":"KEY10007","reason":"페이지 체류 시간 30분 초과"},{"code":"KEY10009","reason":"여행사 사업자등록번호 데이터를 찾을 수 없음"},{"code":"KEY10010","reason":"여행사 사업자등록번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사가 우편 인쇄 부가서비스를 신청하지 않음"},{"code":"KEY10017","reason":"우편 인쇄 부가서비스 잔여 횟수 부족"},{"code":"KEY10018","reason":"발급자 필드 미작성"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV10003","reason":"상품 정보 형식 오류 또는 데이터 부족"},{"code":"INV10004","reason":"상품 정보의 상품 소계 계산 오류"},{"code":"INV10012","reason":"영수증 금액 검증 오류"},{"code":"INV10013","reason":"영수증 필드 데이터 불완전 또는 형식 오류"},{"code":"INV10014","reason":"사용자 정의 번호 형식 오류"},{"code":"INV10016","reason":"사용자 정의 번호 중복"},{"code":"INV20001","reason":"사용 가능한 자궤(字軌) 없음"},{"code":"INV20002","reason":"자궤 획득 실패"},{"code":"INV20003","reason":"자궤 모두 사용됨"},{"code":"INV20004","reason":"영수증 발급 실패"},{"code":"INV20005","reason":"영수증 상품 테이블 기록 span>-behandling krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att pushas asynkront av systemet till butikens angivna <span class=\"font-bold text-green-700\">Webhook<\/span>-URL.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet via <span class=\"font-bold text-green-700\">{method}<\/span> på <span class=\"font-bold text-green-700\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras till en Query String med <span class=\"font-mono font-bold text-cyan-700\">&<\/span>-symbolen, till exempel <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten kommer att skickas inuti ett <span class=\"font-bold text-cyan-700\">JSON<\/span>-objekt.","msg_res_format_other":"De returnerade fälten använder formatet <span class=\"font-bold text-cyan-700\">{format}<\/span>.","msg_res_security":"Verifiering och dekryptering: <span class=\"font-bold\">{group_type}<\/span>-behandling krävs för specifika data vid mottagande.","lbl_sha_pre_hash":"Sträng före hashning (String to Hash)","ph_sha_pre_hash":"Efter att ha tryckt på hash-knappen visas den fullständiga strängen som faktiskt krypteras här...","flowchart_0_url":"assets/flowcharts_trigger-cancel-scheduled-receipt-api/fc_4.png"},"meta":{"title":"API för att trigga eller avbryta förhandsbokade kvitton","subtitle":"Trigga eller avbryta förhandsbokade kvitton i förväg","version":"","sections":[{"id":"section-0","title":"Syfte med integrationen","desc":"<p>1. Hantera redan skapade förhandsbokade kvitton.<\/p><p>2. Möjlighet att trigga ett förhandsbokat kvitto i förtid eller avbryta det.<\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvitto-data via \"HTTP POST\" till den elektroniska kvitto-plattformen för skapande.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen svarar med en formaterad sträng.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&\"-symbolen, och innehållet i varje fält får inte innehålla denna karaktär (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Definitioner","desc":"<p>Förhandsbokat kvitto: Vid skapande av ett kvitto, om det ställs in som ett förhandsbokat kvitto, innebär det att kvittot får ett kvitto-nummer på ett angivet datum (kvitto-numret tilldelas av systemet och kan inte väljas).<\/p><p>Avbryt förhandsbokat kvitto: Förhandsbokade kvitton kan avbrytas när som helst före det angivna datumet.<\/p><p>Trigga kvitto i förtid: Innan det angivna datumet kan ett förhandsbokat kvitto triggas så att det får ett kvitto-nummer omedelbart (numret tilldelas av systemet och kan inte väljas).<\/p>"},{"id":"section-3","title":"Förberedelser för integration","desc":"<p>(Vänligen slutför dessa steg, annars kommer integrationen inte att fungera)<\/p><p><br><\/p><p>1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in i test-administratörspanelen → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktions-administratörspanelen → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningssätt: Ladda ner formuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (fax / e-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Du måste ange: Serverns externa IP (ej internt nätverk, kontrollera på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljö och produktionsmiljö är helt separata system. Data delas inte. Kontrollera alltid att du har ändrat URL:en till produktionsmiljöns URL före driftsättning.<\/p><p><br><\/p><p>4. Vanliga felorsaker på grund av \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en IP för resebyråns API-integration` → IP-vitlista ej inställd eller felaktig<\/p><p>- `KEY10002 Fel vid dekryptering av data` → Felaktig HashKey / HashIV eller användning av exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → Felaktigt MerchantID eller ej aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för att skapa kvitto - [Trigga förhandsbokning] eller [Avbryta förhandsbokning]"}]},"apis":[{"name":"API för att trigga eller avbryta förhandsbokade kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_touch_issue","requests":[{"title":"POST-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"Sträng","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Kombinera fältsträngarna och kryptera med AES256, se tabellen nedan för fältförklaringar","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält inuti PostData_","group_type":"AES-kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-version","example":"1.0","must_return":false,"note":"Sätts fast till 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"         const globalCodeExamples = {"PHP":"<?php\n/**\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use\n * Replace all placeholder constants (e.g. YOUR_API_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// Define credential constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption Key and SHA256 signature HashKey\ndefine('API_KEY', 'YOUR_API_KEY_HERE');\n\n// 16 bytes — used for both AES-256 encryption IV and SHA256 signature HashIV.\n// IV length is 16 bytes because AES block size is fixed at 16 bytes.\ndefine('API_IV', 'YOUR_API_IV_HERE');\n\n// Select API Endpoint (Uncomment the desired environment)\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/invoice_touch_issue'); // Test environment\n// define('API_URL', 'https://api.travelinvoice.com.tw/invoice_touch_issue'); // Production environment\n\n// Startup safety check to block execution if credentials are still placeholder values\n$hasPlaceholder = (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_API_KEY_HERE' || API_IV === 'YOUR_API_IV_HERE');\n\n$executionError = null;\n$apiResponseRaw = null;\n$apiResponseParsed = [];\n$isSignatureValid = null;\n\n/**\n * Verification (驗證回應簽章)\n *\n * Validates the authenticity of the response data using SHA256.\n *\n * @param string $invoiceTransNo\n * @param string $merchantID\n * @param string $merchantOrderNo\n * @param string $randomNum\n * @param string $totalAmt\n * @param string $expectedCheckCode\n * @return bool\n */\nfunction verifyResponseSignature($invoiceTransNo, $merchantID, $merchantOrderNo, $randomNum, $totalAmt, $expectedCheckCode) {\n    // Build SHA256 raw string using direct concatenation to avoid unintended URL-encoding.\n    $rawString = 'HashIV=' . API_IV .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantID .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . API_KEY;\n\n    $calculatedHash = strtoupper(hash('sha256', $rawString));\n    return hash_equals($calculatedHash, strtoupper($expectedCheckCode));\n}\n\n// Process the form submission\nif (!$hasPlaceholder && $_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $invoiceID = isset($_POST['InvoiceID']) ? trim($_POST['InvoiceID']) : '';\n        $merchantOrderNo = isset($_POST['MerchantOrderNo']) ? trim($_POST['MerchantOrderNo']) : '';\n        $totalAmt = isset($_POST['TotalAmt']) ? trim($_POST['TotalAmt']) : '';\n        $status = isset($_POST['Status']) ? trim($_POST['Status']) : '1';\n\n        // Validate basic parameters\n        if ($invoiceID === '' || $merchantOrderNo === '' || $totalAmt === '') {\n            throw new Exception('Please fill in all required fields.');\n        }\n\n        // Build AES plaintext query string\n        $plaintextFields = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'InvoiceID' => (string)intval($invoiceID),\n            'MerchantOrderNo' => $merchantOrderNo,\n            'TotalAmt' => (string)intval($totalAmt),\n            'Status' => (string)intval($status)\n        ];\n\n        $plaintextParts = [];\n        foreach ($plaintextFields as $key => $val) {\n            $plaintextParts[] = $key . '=' . $val;\n        }\n        $plaintext = implode('&', $plaintextParts);\n\n        /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n         * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n         * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n         * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n in text string)\n        parse_str($response, $apiResponseParsed);\n\n        // Verify transmission integrity via EndStr flag (using PHP 7.4 safe string ends check)\n        $endStrCheck = $apiResponseParsed['EndStr'] ?? '';\n        $rawResponseEndsCorrectly = (substr(trim($response), -2) === '##');\n        if ($endStrCheck !== '##' && !$rawResponseEndsCorrectly) {\n            throw new Exception('Response warning: Data transmission stream incomplete (missing EndStr indicator).');\n        }\n\n        // Run signature check verification if expected parameters exist\n        if (isset($apiResponseParsed['CheckCode']) && $apiResponseParsed['CheckCode'] !== '') {\n            $isSignatureValid = verifyResponseSignature(\n                $apiResponseParsed['InvoiceTransNo'] ?? '',\n                $apiResponseParsed['MerchantID'] ?? '',\n                $apiResponseParsed['MerchantOrderNo'] ?? '',\n                $apiResponseParsed['RandomNum'] ?? '',\n                $apiResponseParsed['TotalAmt'] ?? '',\n                $apiResponseParsed['CheckCode']\n            );\n        }\n\n    } catch (Exception $e) {\n        $executionError = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Trigger / Cancel Reservation Receipt API - Integration Portal<\/title>\n    <style>\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n            line-height: 1.6;\n            color: #333;\n            background-color: #f8f9fa;\n            margin: 0;\n            padding: 20px;\n        }\n        .container {\n            max-width: 900px;\n            margin: 0 auto;\n            background: #fff;\n            padding: 30px;\n            border-radius: 8px;\n            box-shadow: 0 4px 6px rgba(0,0,0,0.1);\n        }\n        h1 {\n rnally generated tracking parameter';\n                                    break;\n                                case 'TotalAmt':\n                                    echo 'Final settled transactional dollar unit amount';\n                                    break;\n                                case 'InvoiceNumber':\n                                    echo 'Assigned tax invoice sequence serial identifier';\n                                    break;\n                                case 'RandomNum':\n                                    echo 'Security anti-forgery validation random check numeric';\n                                    break;\n                                case 'CheckCode':\n                                    echo 'Cryptographic payload identity proof string';\n                                    break;\n                                default:\n                                    echo 'Response parameter field';\n                            }\n                            ?>\n                        <\/td>\n                    <\/tr>\n                <?php endforeach; ?>\n            <\/tbody>\n        <\/table>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {

                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }

                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }

                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden');

        }

                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');

            expandedContent.classList.add('flex');

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
