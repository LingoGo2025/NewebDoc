    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
    tools: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>',
    api: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>',
    install: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
    robot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="4" r="2"></circle><path d="M12 6v5"></path><circle cx="8.5" cy="16" r="1"></circle><circle cx="15.5" cy="16" r="1"></circle></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'
  };

  var currentLang = Object.keys(docConfig)[0];
  var initialParams = new URLSearchParams(window.location.search);
  if (initialParams.has('lang')) {
    var reqLang = initialParams.get('lang');
    currentLang = docConfig[reqLang] ? reqLang : (docConfig['en'] ? 'en' : currentLang);
  } else {
    var navLang = (navigator.language || 'en');
    if (/^zh/i.test(navLang)) { currentLang = docConfig['zh-TW'] ? 'zh-TW' : currentLang; }
    else { var sh = navLang.slice(0, 2).toLowerCase(); if (docConfig[sh]) { currentLang = sh; } else if (docConfig['en']) { currentLang = 'en'; } }
  }

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderAll() {
    renderMetaInfo();
    renderCustomSections();
    initScrollSpy();
    var langMap = { 'zh-TW': 'zh-Hant', 'en': 'en', 'ja': 'ja', 'ko': 'ko' };
    document.documentElement.lang = langMap[currentLang] || 'en';
    var si = document.getElementById('sn-input');
    if (si) { si.placeholder = docConfig[currentLang].ui.search_placeholder; }
  }

  function renderMetaInfo() {
    var meta = docConfig[currentLang].meta;
    var ui = docConfig[currentLang].ui;
    document.getElementById('head-title').textContent = ui.head_title || meta.title;
    document.getElementById('mobile-header-title').textContent = ui.sidebar_brand || meta.title;
    document.getElementById('sidebar-brand-title').textContent = ui.sidebar_brand || meta.title;
    document.getElementById('sidebar-subtitle').textContent = meta.system || '';
    document.getElementById('sidebar-version').textContent = meta.version || '';
    var sysEl = document.getElementById('meta-system-name');
    var cpEl = document.getElementById('meta-copyright');
    if (sysEl) { sysEl.textContent = meta.system || ''; }
    if (cpEl) { cpEl.textContent = meta.copyright || ''; }
  }

  function renderCustomSections() {
    var meta = docConfig[currentLang].meta;
    var ui = docConfig[currentLang].ui;
    var sections = meta.sections || [];

    var navHtml = '<a href="#hero" class="nav-link" data-target="hero" onclick="onNav()"><span class="nav-ico">' + ICONS.download + '</span><span>' + escHtml(ui.download_btn) + '</span></a>';
    var contentHtml = '<section id="hero" class="hero">'
      + '<div class="hero-wm">' + ICONS.robot + '</div>'
      + '<h1>' + escHtml(meta.title) + '</h1>'
      + '<p>' + escHtml(meta.subtitle) + '</p>'
      + '<button class="btn-dl" type="button" onclick="downloadPack()">' + ICONS.download + '<span>' + escHtml(ui.download_btn) + '</span></button>'
      + '<p class="dl-hint">' + escHtml(ui.download_hint) + '</p>'
      + '</section>';

    sections.forEach(function (sec) {
      var iconSvg = ICONS[sec.icon] || ICONS.install;
      navHtml += '<a href="#' + sec.id + '" class="nav-link" data-target="' + sec.id + '" onclick="onNav()"><span class="nav-ico">' + iconSvg + '</span><span>' + escHtml(sec.title) + '</span></a>';
      contentHtml += '<section id="' + sec.id + '" class="card">'
        + '<div class="card-head"><span class="marker" style="background:' + sec.markerColor + '"></span><h2>' + escHtml(sec.title) + '</h2></div>'
        + '<div class="card-body">' + sec.desc + '</div></section>';
    });

    document.getElementById('dynamic-sidebar-links').innerHTML = navHtml;
    document.getElementById('dynamic-content-sections').innerHTML = contentHtml;
  }

  function initScrollSpy() {
    var links = document.querySelectorAll('.nav-link');
    var targets = [];
    links.forEach(function (l) {
      var el = document.getElementById(l.getAttribute('data-target'));
      if (el) { targets.push({ link: l, el: el }); }
    });
    function onScroll() {
      var pos = (window.scrollY || document.documentElement.scrollTop) + 120;
      var currentId = '';
      targets.forEach(function (o) { if (pos >= o.el.offsetTop) { currentId = o.el.id; } });
      links.forEach(function (l) {
        if (l.getAttribute('data-target') === currentId) { l.classList.add('active'); }
        else { l.classList.remove('active'); }
      });
    }
    window.removeEventListener('scroll', onScroll);
    window.addEventListener('scroll', onScroll);
    onScroll();
  }

  function initLangDropdown() {
    var sel = document.getElementById('lang-select');
    sel.innerHTML = '';
    Object.keys(docConfig).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = docConfig[key].languageName;
      if (key === currentLang) { opt.selected = true; }
      sel.appendChild(opt);
    });
  }

  function changeLang(target) {
    if (!docConfig[target]) { return; }
    currentLang = target;
    var url = new URL(window.location);
    url.searchParams.set('lang', target);
    window.history.replaceState({}, '', url);
    clearAllHighlights();
    renderAll();
  }

  function executeCopy(text, btn, defaultLabel, copiedLabel) {
    function done() {
      if (!btn) { return; }
      var span = btn.querySelector('span');
      if (span) {
        span.textContent = copiedLabel;
        setTimeout(function () { span.textContent = defaultLabel; }, 1500);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copyPrompt() {
    var ui = docConfig[currentLang].ui;
    var btn = document.getElementById('btn-copy-prompt');
    executeCopy(ui.prompt_text, btn, ui.copy_prompt_btn, ui.copied);
  }

  function toggleSidebar() {
    var sb = document.getElementById('sidebar');
    var bd = document.getElementById('backdrop');
    var open = sb.classList.toggle('open');
    if (open) { bd.classList.add('show'); } else { bd.classList.remove('show'); }
  }

  function onNav() {
    if (window.innerWidth < 1024) { toggleSidebar(); }
  }

  function downloadPack() {
    var bin = atob(SKILL_ZIP_B64);
    var len = bin.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) { bytes[i] = bin.charCodeAt(i); }
    var blob = new Blob([bytes], { type: 'application/zip' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = ZIP_FILENAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  /* ── 頁面搜尋（比照 AI 介紹頁：highlight + 上一個/下一個 + 計數） ── */
  function clearAllHighlights() {
    searchMarks.forEach(function (m) {
      if (m.parentNode) {
        var textNode = document.createTextNode(m.textContent);
        m.parentNode.replaceChild(textNode, m);
      }
    });
    searchMarks = [];
    currentMarkIndex = -1;
  }

  function highlightKeywordInElement(element, keyword) {
    if (!keyword || !element) { return; }
    var escapeRegExp = function (s) { return s.replace(/[.*+?^(){}|[\]\\$]/g, '\\$&'); };
    var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');
    var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
    var textNodes = [];
    var node;
    while ((node = walker.nextNode())) {
      var parent = node.parentNode;
      if (parent && typeof parent.closest === 'function') {
        var isExcluded = parent.closest('script,style,mark,textarea,input,select') !== null;
        var isHidden = (parent.getClientRects().length === 0);
        if (!isExcluded && !isHidden && node.nodeValue.match(regex)) {
          textNodes.push(node);
        }
      }
    }
    textNodes.forEach(function (n) {
      var fragment = document.createDocumentFragment();
      var parts = n.nodeValue.split(regex);
      var lower = keyword.toLowerCase();
      parts.forEach(function (part) {
        if (part.toLowerCase() === lower) {
          var mark = document.createElement('mark');
          mark.className = 'search-highlight';
          mark.textContent = part;
          fragment.appendChild(mark);
        } else if (part) {
          fragment.appendChild(document.createTextNode(part));
        }
      });
      n.parentNode.replaceChild(fragment, n);
    });
  }

  function injectSearchNavigator() {
    var navHtml = '<div id="search-nav">'
      + '<button class="sn-toggle" id="sn-toggle" type="button" onclick="expandSearch()" title="Search">' + ICONS.search + '</button>'
      + '<div class="sn-panel" id="sn-panel">'
      +   '<span class="sn-ico">' + ICONS.search + '</span>'
      +   '<input type="text" id="sn-input" autocomplete="off">'
      +   '<span id="sn-count">0 / 0</span>'
      +   '<button class="sn-b" type="button" onclick="navigateSearch(-1)" title="Prev">' + ICONS.up + '</button>'
      +   '<button class="sn-b" type="button" onclick="navigateSearch(1)" title="Next">' + ICONS.down + '</button>'
      +   '<button class="sn-b" type="button" onclick="collapseSearch()" title="Close">' + ICONS.close + '</button>'
      + '</div></div>';
    document.body.insertAdjacentHTML('beforeend', navHtml);
    var input = document.getElementById('sn-input');
    input.placeholder = docConfig[currentLang].ui.search_placeholder;
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { executeInlineSearch(e.target.value); }
    });
  }

  function expandSearch() {
    document.getElementById('search-nav').classList.add('open');
    document.getElementById('sn-input').focus();
  }

  function collapseSearch() {
    document.getElementById('search-nav').classList.remove('open');
    clearAllHighlights();
    document.getElementById('sn-input').value = '';
    document.getElementById('sn-count').textContent = '0 / 0';
    var url = new URL(window.location);
    url.searchParams.delete('q');
    window.history.replaceState({}, '', url);
  }

  function executeInlineSearch(keyword) {
    keyword = keyword.trim();
    clearAllHighlights();
    var url = new URL(window.location);
    if (!keyword) {
      url.searchParams.delete('q');
      window.history.replaceState({}, '', url);
      document.getElementById('sn-count').textContent = '0 / 0';
      return;
    }
    url.searchParams.set('q', keyword);
    window.history.replaceState({}, '', url);
    var main = document.querySelector('main');
    if (main) { highlightKeywordInElement(main, keyword); }
    searchMarks = Array.prototype.slice.call(document.querySelectorAll('mark.search-highlight'));
    if (searchMarks.length > 0) { goToSearchMark(0); }
    else { document.getElementById('sn-count').textContent = '0 / 0'; }
  }

  function navigateSearch(direction) {
    if (searchMarks.length === 0) { return; }
    var next = currentMarkIndex + direction;
    if (next >= searchMarks.length) { next = 0; }
    if (next < 0) { next = searchMarks.length - 1; }
    goToSearchMark(next);
  }

  function goToSearchMark(index) {
    if (searchMarks.length === 0) { return; }
    if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
      searchMarks[currentMarkIndex].classList.remove('current');
    }
    currentMarkIndex = index;
    searchMarks[currentMarkIndex].classList.add('current');
    searchMarks[currentMarkIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('sn-count').textContent = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
  }

  initLangDropdown();
  renderAll();
  injectSearchNavigator();
  (function () {
    var params = new URLSearchParams(window.location.search);
    var keyword = params.get('q');
    var hashId = window.location.hash ? window.location.hash.substring(1) : null;
    var targetEl = hashId ? document.getElementById(hashId) : null;
    if (keyword) {
      var main = document.querySelector('main');
      if (main) { highlightKeywordInElement(main, keyword); }
      searchMarks = Array.prototype.slice.call(document.querySelectorAll('mark.search-highlight'));
      document.getElementById('sn-input').value = keyword;
      expandSearch();
    }
    setTimeout(function () {
      if (searchMarks.length > 0) { goToSearchMark(0); }
      else if (targetEl) { targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }, 300);
  })();
</script>
