;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"折讓收據規範","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">收據於開立作廢並經確認後，『不』可執行折讓。<\/span><\/p><p>2.預約收據無法折讓，只能發動取消<\/p><p>3.折讓<span style=\"color: rgb(0, 0, 0);\">收據後，屆當期上傳排程日(每單月一日)，平台將會把折讓資料上傳至 「財政部電子發票整合服務平台」。<\/span><\/p><p>4.折讓收據無期別限制，只要狀態為已開立就可以開立折讓單<\/p><p>5.一張收據可以開立多張折讓單，但已確認折讓單金額加總不得超過收據總金額。<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>折讓單：每一次折讓收據，都會有一筆獨立的折讓記錄，稱之為折讓單或是折讓資料<\/p><p>等待折讓：等待消費者同意折讓前，折讓單稱為等待折讓<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立折讓流程-立即折讓"}]},"apis":[{"name":"折讓電子收據API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"收據號碼","example":"T13671009","must_return":false,"note":"欲執行折讓之收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"收據自訂編號","example":"Or_5555511","must_return":false,"note":"於開立收據時，收據所屬的自訂編號。（需藉由InvoiceNo取得該收據的MerchantOrderNo）\n注意：這裡是要填寫收據的自訂編號，而不是隨機產一個號碼","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"多項商品時，商品名稱以 | 分隔。例：ItemName=”商品一|商品二\n1.全部商品名稱總字數最多 280 個字。\n2.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n3.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"折讓商品數量","example":"1|1","must_return":false,"note":"1. 商品數量為純數字，每項商品最多 5 位數。\n2. 多項商品時，商品數量以 | 分隔。例：ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"折讓商品單位","example":"個|公斤","must_return":false,"note":"1. 內容如：個、件、本、張…..。\n2. 多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3. 每個商品最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"折讓商品單價","example":"200|100","must_return":false,"note":"1. 單價部分為純數字。\n2. 多項商品時，商品單價以 | 分隔。例：ItemPrice =”200|100”\n3. 每個商品單價金額不能超過 8 位數","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"折讓商品小計","example":"200|200","must_return":false,"note":"1. 小計部分為純數字。\n2. 計算方式為：數量 * 單價 = 小計。平台將會檢查數值是否計算正確。\n3. 多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4. 每個商品小計金額計算後不能超過 8位數","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"折讓總金額","example":"400","must_return":false,"note":"1.此次開立折讓加總金額。總金額不能超過 8 位數。\n2.折讓總金額必須小於等於收據總金額。\n3.折讓總金額需等於全部折讓商品金額總額。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"折讓通知電子信箱","example":"abc@gmail.com","must_return":false,"note":"1. 折讓通知信，平台預設會寄送給買受人\n2. 若需帶入多個買受人信箱，請以逗號分隔。\n3. 此欄位用於新增更多收件人，若帶入重複信箱，平台會進行過濾避免重複發送。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務窗口258","must_return":false,"note":"開立折讓單人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"確認折讓方式","example":"1","must_return":false,"note":"0=開立等待折讓。\n1=立即折讓。","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.作廢單開立成功，則回傳 SUCCESS\n2.作廢單開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"折讓單流水號","example":"193060","must_return":false,"note":"此次開立折讓的系統流水號。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次作廢收據或等待作廢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"Or_5555511","must_return":false,"note":"此次開立折讓的收據，於開立收據時，提供之自訂編\n號。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"折讓金額","example":"400","must_return":false,"note":"此次開立折讓的金額。","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"折讓後剩餘 收據金額","example":"600","must_return":false,"note":"確認折讓後，此張收據剩餘之收據金額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo , RandomNum, TotalAmt不含在此API回應欄位中，需讓程式由InvoiceNumber（收據號碼）於資料庫中來取得這3個欄位資料。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"ALW10002","reason":"此收據號碼折讓總金額超過開立金額"},{"code":"ALW10003","reason":"開立折讓失敗"},{"code":"ALW10004","reason":"觸發折讓狀態失敗"},{"code":"ALW10005","reason":"已確認折讓，無法再執行取消折讓"},{"code":"ALW10006","reason":"折讓商品名稱總計超過 280 個字"},{"code":"ALW10007","reason":"折讓商品名稱超過 7 個商品"},{"code":"ALW10008","reason":"折讓商品數量非純數字"},{"code":"ALW10009","reason":"折讓商品單位字數超過 2 個字"},{"code":"ALW10010","reason":"折讓商品單價超過 8 位數 or 非純數字"},{"code":"ALW10011","reason":"折讓商品小計超過 8 位數 or 非純數字"},{"code":"ALW10012","reason":"折讓總金額超過 8 位數 or 非純數字"},{"code":"ALW10013","reason":"商品資訊的商品小計計算錯誤"},{"code":"ALW10014","reason":"收據金額驗證錯誤"},{"code":"ALW10015","reason":"觸發折讓狀態錯誤"},{"code":"ALW10016","reason":"確認折讓方式錯誤"},{"code":"ALW10017","reason":"折讓單號錯誤"}],"versions":[]},

efore transmission.","msg_res_info_webhook":"The system will actively push this result asynchronously to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"The system will return this result synchronously via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> to <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> combination format.","msg_res_security":"Verification & Decryption: After reception, <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be performed on specific data.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After clicking the hash button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_1.png"},"meta":{"title":"Allowance E-Receipt API","subtitle":"Issue Allowance for E-Receipt","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Please contact the customer service center to apply for IP settings before integration. Up to 10 sets of IPs can be configured. Each travel agency can set 10 sets of IPs, which are shared across all APIs.<\/span><\/p><p>2. Allows issuing an allowance for electronic receipts that are in the 'Issued' state.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send allowance data to the electronic receipt platform via 'HTTP POST'.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is characters. Chinese, English, numbers, and symbols each count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by '&amp;'; this character (U+0026) must not be contained within the fields.<\/span><\/p>"},{"id":"section-2","title":"Allowance Receipt Specifications","desc":"<p>1. <span style=\"color: rgb(0, 0, 0);\">Once a receipt has been voided and confirmed, an allowance 'cannot' be executed.<\/span><\/p><p>2. Pre-booked receipts cannot have an allowance issued; they can only be canceled.<\/p><p>3. <span style=\"color: rgb(0, 0, 0);\">After issuing an allowance, the platform will upload the allowance data to the 'Ministry of Finance E-Invoice Integrated Service Platform' on the scheduled upload date (the 1st of every odd month).<\/span><\/p><p>4. There is no period restriction for allowance receipts; as long as the status is 'Issued', an allowance certificate can be issued.<\/p><p>5. Multiple allowance certificates can be issued for a single receipt, but the sum of confirmed allowance amounts must not exceed the total receipt amount.<\/p>"},{"id":"section-3","title":"Terminology Definition","desc":"<p>Allowance Certificate: Every time an allowance is issued for a receipt, an independent allowance record is created, called an allowance certificate or allowance data.<\/p><p>Pending Allowance: Before the consumer agrees to the allowance, the certificate is called a 'Pending Allowance'.<\/p>"},{"id":"section-4","title":"Pre-integration Preparation","desc":"<p>(Please complete these steps first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the Test Backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the Production Backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email).<\/p><p>- A maximum of 10 IP sets can be configured.<\/p><p>- Required: Server outgoing IP (not internal IP, can be checked via https://ifconfig.me).<\/p><p>- Effective Time: Usually 1-2 working days.<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test and production environments are completely different systems; data is not shared. Before going live, ensure the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common 'Forgotten Preparation' Error Signals<\/p><p>- `KEY10001 Not a Travel Agency API Integration IP` → IP whitelist not set or incorrect.<\/p><p>- `KEY10002 Data Decryption Error` → HashKey / HashIV incorrect or still using example values.<\/p><p>- `KEY10009 Unable to retrieve data for the Travel Agency Tax ID` → MerchantID is wrong or not activated.<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Issuance Process - Immediate Allowance"}]},"apis":[{"name":"Allowance E-Receipt API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Merchant Tax ID","example":"54352706","must_return":false,"note":"Travel agency unified business number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are as follows.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), the number of seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671009","must_return":false,"note":"The receipt number for which the allowance is to be executed.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Order Number","example":"Or_5555511","must_return":false,"note":"The custom number assigned to the receipt at the time of issuance. (The MerchantOrderNo of the receipt must be obtained via InvoiceNo)\nNote: Fill in the receipt's custom number here, not a randomly generated number.","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Summary (Product Name)","example":"Item 1|Item 2","must_return":false,"note":"For multiple items, separate product names with |. Example: ItemName=\"Item 1|Item 2\"\n1. Total word count for all item names is 280 characters max.\n2. Single item name accepts up to 160 characters. Traditional Chinese, English, numbers, and symbols each count as one character.\n3. A single receipt accepts up to 7 items. For every 40 characters an item name exceeds, the number of items allowed decreases by one.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Allowance Item Quantity","example":"1|1","must_return":false,"note":"1. Item quantity must be numeric, max 5 digits per item.\n2. For multiple items, separate quantities with |. Example: ItemCount=\"1|2\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Allowance Item Unit","example":"pc|kg","must_return":false,"note":"1. Content such as: pc, unit, book, sheet...\n2. For multiple items, separate units with |. Example: ItemUnit=\"pc|book\"\n3. Each item unit max 2 characters. Example: ItemUnit=\"pc|kg\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Allowance Item Unit Price","example":"200|100","must_return":false,"note":"1. Unit price must be numeric.\n2. For multiple items, separate unit prices with |. Example: ItemPrice=\"200|100\"\n3. Each item unit price cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Allowance Item Subtotal","example":"200|200","must_return":false,"note":"1. Subtotal must be numeric.\n2. Calculation: Quantity * Unit Price = Subtotal. The platform will verify if the calculation is correct.\n3. For multiple items, separate subtotals with |. Example: ItemAmt=\"200|200\"\n4. Each calculated item subtotal cannot exceed 8 digits.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Total Allowance Amount","example":"400","must_return":false,"note":"1. Total combined amount of this allowance issuance. Total amount cannot exceed 8 digits.\n2. Total allowance amount must be less than or equal to the total receipt amount.\n3. Total allowance amount must equal the sum of all allowance item amounts.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"Allowance Notification Email","example":"abc@gmail.com","must_return":false,"note":"1. Allowance notification emails are sent to the buyer by default.\n2. To include multiple buyer emails, separate them with commas.\n3. This field is for adding more recipients. If duplicate emails are provided, the platform will filter them to avoid duplicate sending.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handler Name","example":"Sales Window 258","must_return":false,"note":"Name of the person issuing the allowance. For record-keeping only; system does not verify. If empty, issuance will fail with an error code.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Confirm Allowance Method","example":"1","must_return":false,"note":"0=Issue pending allowance.\n1=Immediate allowance.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If issuance is successful, returns SUCCESS\n2. If issuance fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of this return status.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Merchant Code","example":"54352706","must_return":false,"note":"Travel agency unified business number.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"193060","must_return":false,"note":"System serial number for this allowance issuance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The number of the receipt being voided or pending voidance.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order Number","example":"Or_5555511","must_return":false,"note":"The custom number provided at the time of receipt issuance.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"Allowance Amount","example":"400","must_return":false,"note":"The amount of this allowance.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Receipt Amount","example":"600","must_return":false,"note":"The remaining amount of the receipt after the allowance is confirmed.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check the validity of the returned data. You can compare this parameter to verify if the response is from the platform (refer to 'SHA256 Encryption Description'). Returns empty if issuance fails.\n\nCheckCode = Hash value calculated from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications.\n\nInvoiceTransNo, RandomNum, TotalAmt are not included in this API response. The program must retrieve these 3 fields from the database via InvoiceNumber.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String Terminator","example":"##","must_return":true,"note":"Always returns ##. Users receiving data via String format should check for EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API Integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable e-receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve data for the Travel Agency Tax ID"},{"code":"KEY10010","reason":"Merchant Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency access suspended"},{"code":"NOR10001","reason":"Network connection abnormality"},{"code":"ALW10002","reason":"Total allowance amount for this receipt number exceeds the issued amount"},{"code":"ALW10003","reason":"Allowance issuance failed"},{"code":"ALW10004","reason":"Triggering allowance status failed"},{"code":"ALW10005","reason":"Allowance confirmed; cannot execute cancel allowance"},{"code":"ALW10006","reason":"Total allowance item names exceed 280 characters"},{"code":"ALW10007","reason":"Allowance item names exceed 7 items"},{"code":"ALW10008","reason":"Allowance item quantity is not purely numeric"},{"code":"ALW10009","reason":"Allowance item unit exceeds 2 characters"},{"code":"ALW10010","reason":"Allowance i step2_title":"AES 暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード (Padding)：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：業者の Hash Key と Hash IV を使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化後のバイナリデータ (Raw Data) を Hex String (小文字) に変換したものが暗号化文字列となります。","enc_sha_title":"SHA256 チェックコードメカニズム (CheckMacValue)","enc_sha_desc":"SHA256 ハッシュを通じてチェックコードを生成し、リクエストパラメータまたはレスポンス値の整合性を検証するために使用できます。","enc_sha_step1_title":"パラメータのソートと組み合わせ","enc_sha_step1_desc":"指定されたパラメータを英名順 (A-Z) にソートし、Query String (key1=val1&key2=val2...) として組み合わせます。","enc_sha_step2_title":"IV と Key の連結","enc_sha_step2_desc":"ソートされた文字列の前後にそれぞれ HashIV と HashKey を連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 暗号化と大文字変換","enc_sha_step3_desc":"連結された文字列に対して SHA256 暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"レスポンスパラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"メソッド","lbl_encrypted_tag":"AES-256-CBC 暗号化済み","lbl_api_index":"API","msg_no_params":"パラメータ未定義","msg_code_unavailable":"// プログラムサンプルなし","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン","th_ver_date":"修正日","th_ver_date":"修正日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API 基本情報","field_def_title":"API フィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"起動形態","lbl_field_combo_format":"フィールド組み合わせ形式","lbl_enum_values":"許容値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null 許可","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"送信位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは加盟店側から実行する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 方式で、パラメータをパッケージ化して <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> に配置して送信してください。","msg_req_format_qs":"このセクションのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わせる必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡す必要があります。","msg_req_format_other":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信 URL にアクティブにプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わされます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前組み合わせ文字列 (String to Hash)","ph_sha_pre_hash":"署名ボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_2.png"},"meta":{"title":"割戻電子領収書API","subtitle":"発行済み電子領収書の割戻","version":"","sections":[{"id":"section-0","title":"連携の目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 連携前にカスタマーセンターに連絡して IP 設定を申請してください。設定可能な IP 数は 10 個です。各旅行会社で 10 個の IP を設定でき、すべての API で共通の 10 個となります。<\/span><\/p><p>2. ステータスが発行済みの電子領収書を割戻することができます。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で割戻データを電子領収書プラットフォームに送信して割戻を行います。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字コードは UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。全角、半角英数、記号はすべて 1 文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号として使用します。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"割戻領収書の規定","desc":"<p>1. <span style=\"color: rgb(0, 0, 0);\">領収書の発行が無効化され確認された後は、割戻を実行することは「できません」。<\/span><\/p><p>2. 予約領収書は割戻できず、キャンセルのみ可能です。<\/p><p>3. <span style=\"color: rgb(0, 0, 0);\">領収書の割戻後、該当期のアップロードスケジュール日（奇数月の 1 日）に、プラットフォームは割戻データを「財政部電子発票統合サービスプラットフォーム」にアップロードします。<\/span><\/p><p>4. 割戻領収書に期間の制限はありません。ステータスが発行済みであれば割戻伝票を発行できます。<\/p><p>5. 1枚の領収書に対して複数の割戻伝票を発行できますが、確認済みの割戻伝票の合計金額は領収書の合計金額を超えてはなりません。<\/p>"},{"id":"section-3","title":"用語の定義","desc":"<p>割戻伝票：領収書の割戻ごとに生成される独立した割戻記録。割戻伝票または割戻データと呼びます。<\/p><p>割戻待ち：消費者が割戻に同意する前の段階。割戻伝票は「割戻待ち」と呼ばれます。<\/p>"},{"id":"section-4","title":"連携前の準備作業","desc":"<p>（事前に完了させてください。そうしないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境バックオフィスにログイン → 基本資料 → API 連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境バックオフィスにログイン → 基本資料 → API 連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーセンターに送信（FAX / メール）<\/p><p>- 最大 10 個の IP を設定可能<\/p><p>- 提出物：サーバーの外部公開 IP（内部ネットワーク IP ではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常 1〜2 営業日<\/p><p><br><\/p><p>3. 環境 URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。稼働前に必ず連携 URL を本番用 URL に切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラーメッセージ<\/p><p>- `KEY10001 旅行会社 API 連携 IP ではありません` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が正しくない、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社納税者番号のデータを取得できません` → MerchantID が間違っている、または有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"割戻発行フロー - 即時割戻"}]},"apis":[{"name":"割戻電子領収書API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社納税者番号","example":"54352706","must_return":false,"note":"旅行会社の 8 桁の納税者番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを組み合わせた後、AES256 で暗号化したもの。フィールドの説明は下表の通り。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"1.0 固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時間を設定することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"領収書番号","example":"T13671009","must_return":false,"note":"割戻を実行する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"領収書カスタム番号","example":"Or_5555511","must_return":false,"note":"領収書発行時に設定された領収書のカスタム番号。（InvoiceNo からその領収書の MerchantOrderNo を取得する必要があります）\n注意：ここでは領収書のカスタム番号を入力してください。ランダムな番号を生成しないでください。","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名）","example":"商品1|商品2","must_return":false,"note":"複数の商品がある場合は、商品名を | で区切ります。例：ItemName=”商品1|商品2\n1. すべての商品名の合計文字数は最大 280 文字です。\n2. 1つの品目名は最大 160 文字まで。全角、半角、英数記号すべて 1 文字としてカウントされます。\n3. 1つの領収書に最大 7 品目まで設定可能。品目名が 40 文字を超えるごとに、入力可能な品目数が 1 つ減ります。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"割戻商品数量","example":"1|1","must_return":false,"note":"1. 商品数量は数字のみ。各商品最大 5 桁。\n2. 複数の商品がある場合は、数量を | で区切ります。例：ItemCount =”1|2”","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"割戻商品単位","example":"個|キロ","must_return":false,"note":"1. 内容例：個、件、本、枚など。\n2. 複数の商品がある場合は、単位を | で区切ります。例：ItemUnit =”個|本”\n3. 各商品最大 2 文字。例：ItemUnit =”個|キロ”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"割戻商品単価","example":"200|100","must_return":false,"note":"1. 単価部分は数字のみ。\n2. 複数の商品がある場合は、単価を | で区切ります。例：ItemPrice =”200|100”\n3. 各商品の単価は 8 桁を超えてはいけません。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"割戻商品小計","example":"200|200","must_return":false,"note":"1. 小計部分は数字のみ。\n2. 計算方法：数量 * 単価 = 小計。プラットフォームで計算結果が正しいかチェックします。\n3. 複数の商品がある場合は、小計を | で区切ります。例：ItemAmt =”200|200”\n4. 各商品の小計金額は計算後 8 桁を超えてはいけません。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"割戻合計金額","example":"400","must_return":false,"note":"1. 今回発行する割戻の合計金額。合計金額は 8 桁を超えてはいけません。\n2. 割戻合計金額は領収書合計金額以下である必要があります。\n3. 割戻合計金額は、すべての割戻商品金額の合計と等しくなければなりません。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"割戻通知用メールアドレス","example":"abc@gmail.com","must_return":false,"note":"1. 割戻通知メールは、デフォルトで買受人に送信されます。\n2. 複数の買受人メールアドレスを入力する場合は、カンマで区切ってください。\n3. このフィールドは追加の受信者を追加するために使用されます。重複したアドレスが入力された場合、プラットフォームでフィルタリングされます。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"担当者名","example":"担当窓口258","must_return":false,"note":"割戻伝票を発行した担当者の名前。記録用であり、システムチェックは行いません。未記入の場合は発行に失敗し、エラーコードが返されます。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"割戻確認方法","example":"1","must_return":false,"note":"0 = 割戻待ちとして発行。\n1 = 即時割戻。","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"システムレスポンスメッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 割戻伝票の発行に成功した場合は SUCCESS を返却\n2. 失敗した場合はエラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"文字列、今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"54352706","must_return":false,"note":"旅行会社の 8 桁の納税者番号","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"割戻伝票シリアル番号","example":"193060","must_return":false,"note":"今回発行された割戻のシステムシリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回無効化された、または無効化待ちの領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"Or_5555511","must_return":false,"note":"今回割戻が発行された領収書の、領収書発行時に提供されたカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"割戻金額","example":"400","must_return":false,"note":"今回発行された割戻の金額。","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"割戻後残額","example":"600","must_return":false,"note":"割戻確定後の、この領収書の残額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回のデータ返却の正当性を確認するために使用されます。連携時にこのパラメータを比較して、プラットフォームからの返却であるか検証できます。検証方法は「SHA256暗号化説明」を参照してください。発行失敗時は空値を返します。\n\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名仕様に従って計算したハッシュ値\n\nInvoiceTransNo, RandomNum, TotalAmt はこの API レスポンスフィールドには含まれません。プログラム側で InvoiceNumber（領収書番号）を基にデータベースからこれら 3 つのフィールドデータを取得する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定で ## を返却します。String 形式でデータを受信する場合、データの整合性を確保するために EndStr=## を判断してください。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社 API 連携 IP ではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データが不完全です"},{"code":"KEY10006","reason":"旅行会社が電子領収書の利用申請を行っていません"},{"code":"KEY10007","reason":"ページ滞在時間が 30 分を超えました"},{"code":"KEY10009","reason":"旅行会社納税者番号のデータを取得できません"},{"code":"KEY10010","reason":"旅行会社納税者番号が空です"},{"code":"KEY10011","reason":"PostData_ フィールドが空です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空です"},{"code":"KEY10014","reason":"タイムアウト。一般に I/O 上のタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10019","reason":"旅行会社の権限が停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"ALW10002","reason":"この領収書番号의 割戻合計金額が発行金額を超えています"},{"code":"ALW10003","reason":"割戻の発行に失敗しました"},{"code":"ALW10004","reason":"割戻ステータスのトリガーに失敗しました"},{"code":"ALW10005","reason":"割戻が確定しているため、割戻のキャンセルは実行できません"},{"code":"ALW10006","reason" \/code> 형식(key=value&key2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체 소속의 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수 (Hex) 변환","enc_step3_desc":"암호화된 바이너리 데이터 (Raw Data)를 Hex String (소문자)으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 검증 코드 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 검증 코드를 생성하여 요청 파라미터 또는 반환 값의 무결성을 확인하는 데 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z)순으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열의 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 프로그램 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 아직 프로그램 예제가 없습니다","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"플로우차트","lbl_launch_type":"발동 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전달 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점 측에서 발생시켜야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식으로 파라미터를 패키징하여 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>에 배치해 전송하십시오.","msg_req_format_qs":"본 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합된 Query String 형식이어야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 내에 배치되어 전달되어야 합니다.","msg_req_format_other":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"본 결과는 시스템에서 비동기적으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"본 결과는 시스템에서 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호로 조합된 Query String 형식입니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체 내에 배치되어 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 실제 암호화되는 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_allowance-e-receipt-api/fc_3.png"},"meta":{"title":"매출환입(감액) 전자영수증 API","subtitle":"기발행 전자영수증 매출환입(감액)","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 10개이며, 각 여행사당 10개까지 설정 가능하고 모든 API에 동일한 10개가 적용됩니다.<\/span><\/p><p>2. 발행 완료 상태인 전자영수증에 대해 매출환입(감액)을 수행할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 매출환입 데이터를 전자영수증 플랫폼으로 전송합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자영수증 플랫폼은 정형화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자(Character)입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 「&amp;」로 연결하며, 필드 내용 내에 이 문자(U+0026)가 포함되어서는 안 됩니다.<\/span><\/p>"},{"id":"section-2","title":"매출환입 영수증 규정","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">영수증이 발행 취소되어 확인된 후에는 매출환입을 실행할 수 『없습니다』.<\/span><\/p><p>2. 예약 영수증은 매출환입할 수 없으며 취소만 가능합니다.<\/p><p>3. 매출환입<span style=\"color: rgb(0, 0, 0);\"> 후 해당 기수 업로드 예약일(매 홀수달 1일)에 플랫폼이 매출환입 데이터를 『재정부 전자세금계산서 통합 서비스 플랫폼』으로 업로드합니다.<\/span><\/p><p>4. 매출환입 영수증은 기수 제한이 없으며, 발행 완료 상태이면 매출환입 전표를 발행할 수 있습니다.<\/p><p>5. 영수증 한 장에 대해 여러 개의 매출환입 전표를 발행할 수 있으나, 확인된 매출환입 금액 합계가 영수증 총 금액을 초과할 수 없습니다.<\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>매출환입 전표: 영수증 매출환입 시마다 생성되는 독립적인 환입 기록을 매출환입 전표 또는 매출환입 데이터라고 합니다.<\/p><p>매출환입 대기: 소비자가 매출환입에 동의하기 전까지의 매출환입 전표 상태를 매출환입 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 전 준비 작업","desc":"<p>(반드시 먼저 완료하십시오. 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 운영 환경: 운영 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청서 다운로드 및 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개 IP 설정 가능<\/p><p>- 제공 필요: 서버 공인 IP (내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 1-2 영업일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 설비이며 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL을 운영 구역 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔한 「준비 작업 미비」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트 미설정 또는 오설정<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 올바르지 않거나 예시 값인 경우<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 찾을 수 없음` → MerchantID 오류 또는 미활성<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"매출환입 프로세스 - 즉시 환입"}]},"apis":[{"name":"매출환입(감액) 전자영수증 API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화 처리, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0으로 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC 이후의 경과 초\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 입력하는 것을 권장함","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671009","must_return":false,"note":"매출환입을 수행할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"영수증 사용자 정의 번호","example":"Or_5555511","must_return":false,"note":"영수증 발행 시 해당 영수증에 부여된 사용자 정의 번호. (InvoiceNo를 통해 해당 영수증의 MerchantOrderNo를 획득해야 함)\n주의: 무작위 번호가 아니라 영수증의 사용자 정의 번호를 입력해야 함","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"적요 (상품명)","example":"상품1|상품2","must_return":false,"note":"여러 상품인 경우 | 기호로 구분. 예: ItemName=\"상품1|상품2\"\n1. 전체 상품명 총 글자 수는 최대 280자.\n2. 단일 품목 이름 최대 160자까지 허용되며 한글, 영문, 숫자, 기호 모두 한 문자로 계산됨\n3. 단일 영수증 최대 7개 품목 허용, 품목명이 40자를 초과할 때마다 입력 가능한 품목 수가 하나씩 줄어듦.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"매출환입 상품 수량","example":"1|1","must_return":false,"note":"1. 수량은 숫자만 가능, 품목당 최대 5자리.\n2. 여러 상품인 경우 | 기호로 구분. 예: ItemCount =\"1|2\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"매출환입 상품 단위","example":"개|kg","must_return":false,"note":"1. 내용 예: 개, 건, 권, 매.....\n2. 여러 상품인 경우 | 기호로 구분. 예: ItemUnit =\"개|권\"\n3. 품목당 최대 두 글자. 예: ItemUnit =\"개|kg\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"매출환입 상품 단가","example":"200|100","must_return":false,"note":"1. 단가는 숫자만 가능.\n2. 여러 상품인 경우 | 기호로 구분. 예: ItemPrice =\"200|100\"\n3. 단가 금액은 8자리를 초과할 수 없음","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"매출환입 상품 소계","example":"200|200","must_return":false,"note":"1. 소계는 숫자만 가능.\n2. 계산 방식: 수량 * 단가 = 소계. 플랫폼에서 계산 정확도 검증함.\n3. 여러 상품인 경우 | 기호로 구분. 예: ItemAmt =\"200|200\"\n4. 소계 금액은 8자리를 초과할 수 없음","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"매출환입 총 금액","example":"400","must_return":false,"note":"1. 이번 매출환입 전표의 합계 금액. 8자리를 초과할 수 없음.\n2. 매출환입 총 금액은 영수증 총 금액보다 작거나 같아야 함.\n3. 매출환입 총 금액은 모든 매출환입 상품 금액의 합과 같아야 함.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"매출환입 알림 이메일","example":"abc@gmail.com","must_return":false,"note":"1. 매출환입 알림 이메일은 플랫폼 기본값으로 구매자에게 발송됨\n2. 여러 메일 주소 입력 시 쉼표로 구분.\n3. 추가 수신인용 필드이며, 중복 메일은 플랫폼에서 필터링함 , och alla API:er använder samma 10 grupper.<\/span><\/p><p>2. Elektroniska kvitton med statusen utfärdad kan krediteras.<\/p>"},{"id":"section-1","title":"Metod för datautbyte","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kreditnotadata till plattformen för elektroniska kvitton via \"HTTP POST\" för kreditering. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen för elektroniska kvitton svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&\", och detta tecken (U+0026) får inte förekomma inom fälten.<\/span><\/p>"},{"id":"section-2","title":"Regler för kreditnota","desc":"<p>1.<span style=\"color: rgb(0, 0, 0);\">När ett kvitto har ogiltigförklarats och bekräftats kan en kreditnota 'inte' utfärdas.<\/span><\/p><p>2. Förhandsbokade kvitton kan inte krediteras, de kan endast avbokas.<\/p><p>3. <span style=\"color: rgb(0, 0, 0);\">Efter kreditering av kvitto kommer plattformen att ladda upp kreditnotadata till 'Finansministeriets integrerade tjänsteplattform för elektroniska fakturor' på den schemalagda uppladdningsdagen för den aktuella perioden (den första dagen i varje ojämn månad).<\/span><\/p><p>4. Det finns inga periodbegränsningar för kreditnotor; så länge statusen är utfärdad kan en kreditnota skapas.<\/p><p>5. Ett kvitto kan ha flera kreditnotor, men den totala summan av de bekräftade kreditnotorna får inte överstiga kvittots totalbelopp.<\/p>"},{"id":"section-3","title":"Definition av termer","desc":"<p>Kreditnota: Varje gång ett kvitto krediteras skapas en separat kreditnotapost, kallad kreditnota eller kreditnotadata.<\/p><p>Väntar på kreditering: Innan konsumenten godkänner krediteringen kallas kreditnotan för 'Väntar på kreditering'.<\/p>"},{"id":"section-4","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testmiljöns backend → Grundläggande data → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsmiljöns backend → Grundläggande data → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Maximalt 10 IP-grupper kan ställas in<\/p><p>- Krav: Serverns externa IP (inte internt IP, kan kontrolleras på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika system, data delas inte. Se till att växla integrations-URL till produktionsmiljön före lansering.<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid 'glömda förberedelser'<\/p><p>- `KEY10001 Inte en resebyrå API-integrations-IP` → IP-vitlistning inte inställd eller felaktig<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är inkorrekt eller fortfarande ett exempelvärde<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller inte aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för utfärdande av kreditnota - omedelbar kreditering"}]},"apis":[{"name":"Kreditnota för elektroniskt kvitto API","url_test":"https://capi.travelinvoice.com.tw/allowance_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfält kombineras och AES256-krypteras, fältbeskrivningar enligt tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integrationsversion","example":"1.0","must_return":false,"note":"Fast värde 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: För tiden 2014-05-15 15:00:00 är tidsstämpeln 1400137200, det rekommenderas att använda aktuell tid","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNo","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671009","must_return":false,"note":"Numret på kvittot som ska krediteras.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Anpassat kvittonummer","example":"Or_5555511","must_return":false,"note":"Det anpassade numret som tillhör kvittot när det utfärdades. (Måste hämtas via InvoiceNo)\nObservera: Detta ska vara det anpassade numret för kvittot, inte ett slumpmässigt genererat nummer","enum_values":"","default_value":"","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Beskrivning (Produktnamn)","example":"Produkt1|Produkt2","must_return":false,"note":"Vid flera produkter separeras produktnamnen med |. Exempel: ItemName=\"Produkt1|Produkt2\"\n1. Totalt antal tecken för alla produktnamn får vara högst 280.\n2. Ett enskilt produktnamn kan vara högst 160 tecken, kinesiska, engelska, siffror och symboler räknas alla som ett tecken.\n3. Ett enskilt kvitto kan innehålla högst 7 artiklar; för varje 40 tecken ett produktnamn överskrider, minskar antalet tillåtna artiklar med en.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Antal kreditvaror","example":"1|1","must_return":false,"note":"1. Antalet är endast siffror, max 5 siffror per artikel.\n2. Vid flera produkter separeras antalet med |. Exempel: ItemCount =\"1|2\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(20)","label":"Enhet för kreditvaror","example":"st|kg","must_return":false,"note":"1. Innehåll som: styck, paket, bok, ark.....\n2. Vid flera produkter separeras enheterna med |. Exempel: ItemUnit =\"st|bok\"\n3. Varje produkt max två tecken. Exempel: ItemUnit =\"st|kg\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Enhetspris för kreditvaror","example":"200|100","must_return":false,"note":"1. Prisdelen är endast siffror.\n2. Vid flera produkter separeras enhetspriset med |. Exempel: ItemPrice =\"200|100\"\n3. Varje produkts enhetspris får inte överstiga 8 siffror","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Delsumma för kreditvaror","example":"200|200","must_return":false,"note":"1. Delsumman är endast siffror.\n2. Beräkningsmetod: Antal * Enhetspris = Delsumma. Plattformen kontrollerar om beräkningen är korrekt.\n3. Vid flera produkter separeras delsumman med |. Exempel: ItemAmt =\"200|200\"\n4. Varje produkts delsumma får inte överstiga 8 siffror efter beräkning","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Total kreditnotabelopp","example":"400","must_return":false,"note":"1. Det sammanlagda beloppet för denna kreditnota. Totalbeloppet får inte överstiga 8 siffror.\n2. Det totala kreditnotabeloppet måste vara mindre än eller lika med kvittots totalbelopp.\n3. Det totala kreditnotabeloppet måste motsvara summan av alla kreditartiklars belopp.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"","type":"string(100)","label":"E-post för kreditnotameddelande","example":"abc@gmail.com","must_return":false,"note":"1. Kreditnotameddelandet skickas som standard till köparen av plattformen\n2. Om flera köpar-e-postadresser behöver anges, separera dem med kommatecken.\n3. Detta fält används för att lägga till fler mottagare; om dubbletter anges kommer plattformen att filtrera dem för att undvika dubbelutskick.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handläggarens namn","example":"Säljare 258","must_return":false,"note":"Namnet på personen som utfärdar kreditnotan. Endast för dokumentation, systemet validerar inte detta. Om det lämnas tomt misslyckas utfärdandet och systemet returnerar en felkod.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"V","type":"int(1)","label":"Bekräftelsemetod för kreditering","example":"1","must_return":false,"note":"0=Skapa väntande kreditering.\n1=Omedelbar kreditering.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Om kreditnotan skapades framgångsrikt returneras SUCCESS\n2. Om skapandet misslyckades returneras en felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Framgång","must_return":true,"note":"Text, beskrivning av denna returstatus","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyråkod","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Kreditnotans löpnummer","example":"193060","must_return":false,"note":"Systemets löpnummer för denna kreditnota.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Numret på kvittot som ogiltigförklarats eller väntar på ogiltigförklaring.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Anpassat nummer","example":"Or_5555511","must_return":false,"note":"Det anpassade nummer som angavs för kvittot när det utfärdades.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(8)","label":"Kreditbelopp","example":"400","must_return":false,"note":"Beloppet för denna kreditnota.","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Återstående kvittobelopp efter kreditering","example":"600","must_return":false,"note":"Det återstående beloppet på kvittot efter bekräftad kreditering.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Används för att kontrollera giltigheten av denna datare  med att utfärda kreditnota"},{"code":"ALW10004","reason":"Misslyckades med att aktivera krediteringstatus"},{"code":"ALW10005","reason":"Kreditering har redan bekräftats, kan inte längre avbryta krediteringen"},{"code":"ALW10006","reason":"Det totala antalet tecken i produktnamnen för kreditnotan överstiger 280 tecken"},{"code":"ALW10007","reason":"Fler än 7 produkter i kreditnotan"},{"code":"ALW10008","reason":"Antalet kreditvaror är inte bara siffror"},{"code":"ALW10009","reason":"Enheten för kreditvaror överstiger 2 tecken"},{"code":"ALW10010","reason":"Enhetspriset för kreditvaror överstiger 8 siffror eller är inte bara siffror"},{"code":"ALW10011","reason":"Delsumman för kreditvaror överstiger 8 siffror eller är inte bara siffror"},{"code":"ALW10012","reason":"Totalbeloppet för kreditnotan överstiger 8 siffror eller är inte bara siffror"},{"code":"ALW10013","reason":"Felaktig beräkning av delsumma i produktinformationen"},{"code":"ALW10014","reason":"Verifiering av kvittobelopp misslyckades"},{"code":"ALW10015","reason":"Fel vid aktivering av krediteringstatus"},{"code":"ALW10016","reason":"Felaktig bekräftelsemetod för kreditering"},{"code":"ALW10017","reason":"Felaktigt kreditnotanummer"}],"versions":[]},

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

            if (lblKey && lblIv) {

                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';
            var lblDef = ui.lbl_default_value || '預設值';
            var lblNull = ui.lbl_is_nullable || '可為 Null';
            var lblYes = ui.lbl_yes || '是';

            return dataArray.map(function(item) {
                var extraInfo = [];
                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');
                }
                
                var extraHtml = '';
                if (extraInfo.length > 0) {
                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';
                }

                var noteContent = (item.note || '').replace(/\n/g, '<br>');

                return '<tr class="align-middle">' +
                    '<td class="px-6 py-4 font-mono font-bold text-blue-600 text-left break-words">' + item.name + '</td>' +
                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-left">' + item.type + '</td>' +
                    '<td class="px-6 py-4 font-mono text-xs text-slate-500 text-left break-words">' + (item.example || '') + '</td>' +
                    '<td class="px-6 py-4 text-sm text-slate-600 text-left break-words leading-relaxed">' + noteContent + extraHtml + '</td></tr>';
            }).join('');
        }

                if (item.enum_values) extraInfo.push(lblEnum + ': <span class="font-mono text-blue-600">' + item.enum_values + '</span>');
                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');

                if (extraInfo.length > 0) {

        function renderVersions() {
            var versionsSection = document.getElementById('versions');
            var navLink = document.getElementById('nav-versions-link');
            var tbody = document.getElementById('versions-table-body');
            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];
            if (!versionsSection || !tbody) return;

            var thEls = versionsSection.querySelectorAll('[data-i18n]');
            thEls.forEach(function(el) { el.innerHTML = ui[el.getAttribute('data-i18n')] || ''; });

            if (versions.length === 0) {
                versionsSection.classList.add('hidden');
                if (navLink) navLink.classList.add('hidden');
                return;
            }
            versionsSection.classList.remove('hidden');
            if (navLink) navLink.classList.remove('hidden');

            tbody.innerHTML = versions.map(function(v) {
                return '<tr class="align-middle">' +
                    '<td class="px-6 py-3 font-mono font-bold text-blue-600 text-left whitespace-nowrap">' + (v.version || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-600 text-left whitespace-nowrap">' + (v.date || '') + '</td>' +
                    '<td class="px-6 py-3 text-sm text-slate-700 text-left">' + (v.desc || '') + '</td>' +
                    '</tr>';
            }).join('');

            document.querySelectorAll('[data-i18n]').forEach(function(el) { el.innerHTML = data[el.getAttribute('data-i18n')] || ''; });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.setAttribute('placeholder', data[el.getAttribute('data-i18n-placeholder')] || ''); });

            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            
            // 切換語系時同步更新網址列參數
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);
            window.history.replaceState({}, document.title, url);

            applyTranslations(targetLang);
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) searchInput.value = '';
            renderAll();
