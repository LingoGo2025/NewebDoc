ör batchsökning av ogiltigförklarade elektroniska kvitton","desc":"<p>Detta API kan användas för att söka efter parametrarna, processen och statusen för ogiltigförklarade kvittondata i batch.<\/p>","link":"batch-query-voided-e-receipt-api.html","icon":"fas fa-trash-can"},{"category":"Batchsökning","title":"API för batchsökning av utfärdade elektroniska kvitton med anpassad nummer","desc":"<p>Detta API kan användas för att söka efter parametrarna, processen och statusen för utfärdade elektroniska kvitton med hjälp av resebyråns anpassade nummer. Det är lämpligt för resebyråer med dubbletter av anpassade nummer.<\/p>","link":"query-e-receipt-by-custom-id-api.html","icon":"fas fa-id-card"},{"category":"Övriga dokument","title":"Plattformsintroduktion och funktionsöversikt","desc":"<p>Introduktion till syftet och funktionerna hos plattformen för insamling och vidarebefordran av elektroniska kvitton för resebyråer.<\/p>","link":"introduce.html","icon":"fas fa-circle-info"},{"category":"Övriga dokument","title":"Handbok för batchutfärdande","desc":"<p><span style=\"color: rgb(55, 65, 81);\">För att underlätta resebyråer vid utfärdande av flera elektroniska kvitton för insamling och vidarebefordran kan användare använda .txt-filfunktionen för batchutfärdande av elektroniska kvitton för insamling och vidarebefordran för resebyråer.<\/span><\/p>","link":"batch-issue-guide.html","icon":"fas fa-book"}]},

                subtitleEl.style.display = 'none';

                subtitleEl.innerHTML = subtitleText.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');

            const footerEl = document.getElementById('footer-text');
            if (footerEl) footerEl.textContent = ui.footer_text || '';

            // 全域搜尋列的參數控制
            const searchContainer = document.getElementById('search-bar-container');
            
            // 只要不是明確設定為 false，就預設顯示 (支援沒有這個欄位的狀況)
            if (ui.search_enable !== false) {
                searchContainer.classList.remove('hidden');
                document.getElementById('globalSearchInput').placeholder = ui.search_placeholder || '搜尋...';
                document.getElementById('search-btn-text').textContent = ui.search_btn || '搜尋';
            } else {
                searchContainer.classList.add('hidden');
            }

            // 分類篩選按鈕
            const categoryContainer = document.getElementById('category-container');
            const uniqueCategories = [...new Set((data.cards || []).map(card => card.category))];
            let catHtml = '';

            if (uniqueCategories.length > 1) {
                const allActive = currentCategory === 'all'
                    ? 'bg-blue-600 text-white shadow-md border-blue-600'
                    : 'bg-white text-slate-600 hover:bg-slate-50 border-slate-200 hover:border-slate-300';
                catHtml += '<button onclick="changeCategory(\'all\')" class="px-6 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border ' + allActive + '">' + (ui.category_all || '全部') + '</button>';

                uniqueCategories.forEach(catName => {
                    const active = currentCategory === catName
                        ? 'bg-blue-600 text-white shadow-md border-blue-600'
                        : 'bg-white text-slate-600 hover:bg-slate-50 border-slate-200 hover:border-slate-300';
                    catHtml += '<button onclick="changeCategory(\'' + catName + '\')" class="px-6 py-2.5 rounded-full text-sm font-bold transition-all duration-300 border ' + active + '">' + catName + '</button>';
                });
            }
            categoryContainer.innerHTML = catHtml;

            // 卡片渲染
            const container = document.getElementById('cards-container');
            const cardsData = data.cards || [];
            
            if (cardsData.length === 0) {
                container.className = 'flex justify-center w-full';
                container.innerHTML =
                    '<div class="w-full text-center py-16 text-slate-400 flex flex-col items-center">' +
                    '<i class="fas fa-folder-open text-4xl mb-4 opacity-50"></i><p>尚無相關文件</p></div>';
                return;
            }

            // 輔助函數：建立單張卡片的 HTML
            const createCardHtml = (card) => {
                return '<div onclick="openApiLink(\'' + card.link + '\')" class="api-card bg-white rounded-2xl shadow-sm border border-slate-200 p-8 cursor-pointer relative overflow-hidden group flex flex-col h-full">' +
                '<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">' +
                '<i class="' + card.icon + ' text-9xl text-blue-600"></i></div>' +
                '<div class="icon-wrapper w-14 h-14 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center mb-6 shadow-sm border border-blue-100 shrink-0">' +
                '<i class="' + card.icon + ' text-2xl"></i></div>' +
                '<h3 class="text-xl font-bold text-slate-800 mb-3 group-hover:text-blue-700 transition-colors">' + card.title + '</h3>' +
                '<p class="text-slate-500 text-sm leading-relaxed flex-grow z-10">' + card.desc + '</p>' +
                '<div class="mt-8 flex items-center text-sm font-bold text-blue-600 opacity-0 group-hover:opacity-100 group-hover:translate-x-2 transition-all z-10 shrink-0">' +
                (ui.btn_view || '前往查看') + ' <i class="fas fa-arrow-right ml-2"></i></div>' +
                '</div>';
            };

            // 輔助函數：取得適當的 Grid 樣式
            const getGridClass = (count, isAllView) => {
                if (isAllView) {
                    // 在全部視圖中，統一向左對齊與佈局，避免小數量的卡片置中導致與左側標題不協調
                    return 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 w-full gap-6 lg:gap-8';
                } else {
                    // 單一分類視圖中保留原有的排版，1、2、4張卡片會置中顯示
                    if (count === 1) return 'grid grid-cols-1 max-w-3xl mx-auto gap-6 lg:gap-8 w-full';
                    if (count === 2 || count === 4) return 'grid grid-cols-1 md:grid-cols-2 max-w-5xl mx-auto gap-6 lg:gap-8 w-full';
                    return 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 w-full gap-6 lg:gap-8';
                }
            };

            container.className = 'w-full';

            if (currentCategory === 'all') {
                // "全部" 狀態下，依據類別分群顯示
                let allHtml = '';
                uniqueCategories.forEach((cat, index) => {
                    const groupCards = cardsData.filter(c => c.category === cat);
                    if (groupCards.length > 0) {
                        const gridClass = getGridClass(groupCards.length, true);
                        const mbClass = index === uniqueCategories.length - 1 ? '' : 'mb-12';
                        allHtml += '<div class="' + mbClass + ' w-full">';
                        allHtml += '<h2 class="text-xl font-bold text-slate-800 border-l-4 border-blue-600 pl-3 mb-6">' + cat + '</h2>';
                        allHtml += '<div class="' + gridClass + '">';
                        allHtml += groupCards.map(createCardHtml).join('');
                        allHtml += '</div></div>';
                    }
                });
                container.innerHTML = allHtml;
            } else {
                // "單一分類" 狀態下，維持原始單純顯示與置中排版
                const filteredCards = cardsData.filter(card => card.category === currentCategory);
                const gridClass = getGridClass(filteredCards.length, false);
                let singleHtml = '<div class="' + gridClass + '">';
                singleHtml += filteredCards.map(createCardHtml).join('');
                singleHtml += '</div>';
                container.innerHTML = singleHtml;
            }
        }

        function changeCategory(categoryName) {
            currentCategory = categoryName;
            renderAll();
        }

        // 修改為燈箱開啟模式，並安全組裝語系參數
        function openApiLink(link) {
            if (!link || link === '#') return;
            
            let finalLink = link;
            if (finalLink.includes('lang=')) {
                finalLink = finalLink.replace(/lang=[^&]*/, `lang=${currentLang}`);
            } else {
                finalLink += finalLink.includes('?') ? `&lang=${currentLang}` : `?lang=${currentLang}`;
            }
            
            openLightbox(finalLink);
        }

        // 用於搜尋結果的獨立燈箱開啟，可阻擋事件冒泡
        function openSearchLink(event, link) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!link || link === '#') return;
            openLightbox(link);
        }

        function openLightbox(url) {
            const lightbox = document.getElementById('iframe-lightbox');
            const iframe = document.getElementById('lightbox-iframe');
            
            iframe.onload = null; // 重置 onload 避免舊事件觸發
            iframe.src = url;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            document.body.style.overflow = 'hidden'; // 防止底層滾動

            // 推送一筆明確含有自訂狀態的歷史紀錄，以便精準攔截上一頁事件
            if (!isLightboxOpen) {
                window.history.pushState({ lightbox: 'open' }, '', window.location.href);
                isLightboxOpen = true;
            }
        }

        function closeIframeLightbox(fromPopState = false) {
            if (!isLightboxOpen) return;

            const lightbox = document.getElementById('iframe-lightbox');
            const iframe = document.getElementById('lightbox-iframe');
            
            iframe.onload = null; // 移除監聽，避免清空 src 時觸發錯誤
            iframe.src = '';
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            document.body.style.overflow = ''; // 恢復滾動
            isLightboxOpen = false;

            // 如果不是因為按了瀏覽器的上一頁而關閉的，就要主動退回這筆歷史紀錄
            if (fromPopState !== true) {
                window.history.back();
            }
        }

        // 監聽瀏覽器首頁的上一頁 (popstate) 事件
        window.addEventListener('popstate', function(event) {
            if (isLightboxOpen) {
                // 檢查是否已經退回到沒有 lightbox 狀態的歷史記錄
                // 這樣 iframe 內部點擊錨點所產生的 popstate 就不會誤關閉燈箱
                if (!event.state || event.state.lightbox !== 'open') {
                    // 將 fromPopState 標記為 true，單純關閉燈箱，不再額外觸發 history.back()
                    closeIframeLightbox(true);
                }
            }
        });

        // 初始化語系下拉選單
        function initLangDropdown() {
            const select = document.getElementById('lang-select');
            if (!select) return;
            select.innerHTML = '';
            Object.keys(siteConfig).forEach(langKey => {
                const option = document.createElement('option');
                option.value = langKey;
                option.textContent = siteConfig[langKey].languageName || langKey;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        // 切換語系
        function changeLang(targetLang) {
            if (!siteConfig[targetLang]) return;
            currentLang = targetLang;
            renderAll();
            
            // 如果搜尋框有內容且畫面正停留在搜尋結果，切換語系時自動重新搜尋
            const keyword = document.getElementById('globalSearchInput').value.trim();
            const resultsContainer = document.getElementById('global-search-results');
            if (keyword && !resultsContainer.classList.contains('hidden')) {
                executeGlobalSearch();
            }
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 安全組裝搜尋網址的輔助函數，避免產生兩個問號或重複參數
        function buildSearchLink(baseLink, keyword, hashId = '') {
            let cleanLink = baseLink;
            const hashIndex = baseLink.indexOf('#');
            if (hashIndex !== -1) {
                cleanLink = baseLink.substring(0, hashIndex);
            }
            
            // 安全處理 lang 參數
            if (cleanLink.includes('lang=')) {
                cleanLink = cleanLink.replace(/lang=[^&]*/, `lang=${currentLang}`);
            } else {
                cleanLink += cleanLink.includes('?') ? `&lang=${currentLang}` : `?lang=${currentLang}`;
            }
            
            // 安全處理 q (關鍵字) 參數
            if (keyword) {
                if (cleanLink.includes('q=')) {
                    cleanLink = cleanLink.replace(/q=[^&]*/, `q=${encodeURIComponent(keyword)}`);
                } else {
                    cleanLink += `&q=${encodeURIComponent(keyword)}`;
                }
            }
            
            // 處理錨點
            if (hashId) {
                cleanLink += '#' + hashId;
            }
            return finalLink = cleanLink;
        }

        // ==========================================
        // 搜尋解析策略池 (Strategy Pattern)
        // 系統會依序往下測試，直到找到符合的格式為止
        // ==========================================
        const searchStrategies = [
            {
                name: 'QA_Format', // 策略 1：針對 QA 問答格式
                execute: function(html, keyword, link, cardInfo) {
                    const qaConfigMatch = html.match(/(?:let|const)\s+qaConfig\s*=\s*(\{[\s\S]*?\});/);
                    
                    if (!qaConfigMatch) {
                        return { formatMatched: false, results: null };
                    }

                    let qaItems = [];
                    let pageTitle = cardInfo.cardTitle;
                    
                    try {
                        const pageQaConfig = new Function('return ' + qaConfigMatch[1])();
                        
                        // 嚴格比對：只抓取與首頁相同語系的資料
                        const langData = pageQaConfig[currentLang];
                        
                        if (!langData) {
                            return { formatMatched: true, results: null };
                        }

                        if (langData.ui && langData.ui.title) {
                            pageTitle = langData.ui.title;
                        }

                        if (langData.items) {
                            const items = langData.items;
                            const groups = [];
                            const groupMap = new Map();

                            items.forEach((item) => {
                                if (!groupMap.has(item.tag)) {
                                    const newGroup = { title: item.tag, items: [] };
                                    groups.push(newGroup);
                                    groupMap.set(item.tag, newGroup);
                                }
                                const groupIdx = groups.findIndex(g => g.title === item.tag);
                                const itemIdxInGroup = groupMap.get(item.tag).items.length;
                                const id = `qa-${groupIdx}-${itemIdxInGroup}`;

                                groupMap.get(item.tag).items.push({ ...item, id });
                                
                                const cleanA = item.a ? item.a.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : '';
                                
                                qaItems.push({
                                    tag: item.tag,
                                    q: item.q || '',
                                    a: cleanA,
                                    id: id
                                });
                            });
                        }
                    } catch (e) {
                        return { formatMatched: false, results: null };
                    }

                    if (qaItems.length === 0) return { formatMatched: false, results: null };

                    const lowerKeyword = keyword.toLowerCase();
                    let matchedSnippets = [];

                    qaItems.forEach(item => {
                        const qText = item.q;
                        const aText = item.a;
                        
                        if (qText.toLowerCase().includes(lowerKeyword) || aText.toLowerCase().includes(lowerKeyword)) {
                            let snippet = '';
                            if (aText.toLowerCase().includes(lowerKeyword)) {
                                const idx = aText.toLowerCase().indexOf(lowerKeyword);
                                let start = Math.max(0, idx - 40);
                                let end = Math.min(aText.length, idx + keyword.length + 40);
                                snippet = aText.substring(start, end);
                                if (start > 0) snippet = '...' + snippet;
                                if (end < aText.length) snippet = snippet + '...';
                            } else {
                                snippet = aText.substring(0, 80) + (aText.length > 80 ? '...' : '');
                            }
                            
                            const targetLink = buildSearchLink(link, keyword, item.id);

                            matchedSnippets.push(`
                                <div onclick="openSearchLink(event, '${targetLink}')" class="mb-3 text-sm border border-blue-100 hover:border-blue-300 rounded-lg overflow-hidden shadow-sm hover:shadow-md relative group/item cursor-pointer transition-all">
                                    <div class="bg-blue-50 px-3 py-2 font-bold text-blue-800 border-b border-blue-100 flex gap-2">
                                        <span class="text-blue-500 shrink-0">Q:</span> <span>${highlightText(qText, keyword)}</span>
                                    </div>
                                    <div class="bg-white px-3 py-2.5 text-slate-600 leading-relaxed flex gap-2">
                                        <span class="text-slate-400 font-bold shrink-0">A:</span> <span>${highlightText(snippet, keyword)}</span>
                                    </div>
                                </div>
                            `);
                        }
                    });

                    if (matchedSnippets.length > 0) {
                        return { 
                            formatMatched: true, 
                            results: { 
                                cardTitle: cardInfo.cardTitle, 
                                icon: cardInfo.icon, 
                                link: buildSearchLink(link, keyword), 
                                q: pageTitle, 
                                snippets: matchedSnippets 
                            } 
                        };
                    } else {
                        return { formatMatched: true, results: null }; 
                    }
                }
            },
            {
                name: 'API_Doc_Format', // 策略 2：針對 API 技術文件格式
                execute: function(html, keyword, link, cardInfo) {
                    const docConfigMatch = html.match(/(?:const|let)\s+docConfig\s*=\s*(\{[\s\S]*?\});/);
                    
                    if (!docConfigMatch) {
                        return { formatMatched: false, results: null };
                    }

                    let searchItems = [];
                    let pageTitle = cardInfo.cardTitle;

                    try {
                        const pageDocConfig = new Function('return ' + docConfigMatch[1])();
                        
                        // 嚴格比對：只抓取與首頁相同語系的資料
                        const langData = pageDocConfig[currentLang];
                        
                        if (!langData) {
                            return { formatMatched: true, results: null };
                        }

                        if (langData.meta && langData.meta.title) {
                            pageTitle = langData.meta.title;
                        }

                        // 1. 萃取自訂段落 (Sections)
                        if (langData.meta && langData.meta.sections) {
                            langData.meta.sections.forEach((sec, index) => {
                                const id = sec.id || ('custom-section-' + index);
                                const cleanDesc = sec.desc ? sec.desc.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : '';
                                searchItems.push({ type: '段落', title: sec.title, content: cleanDesc, id: id });
                            });
                        }

                        // 2. 萃取 API 規格 (APIs)
                        if (langData.apis) {
                            langData.apis.forEach((api, index) => {
                                const id = `api-${index}`;
                                let contentArr = [];
                                
                                if (api.requests) {
                                    api.requests.forEach(req => {
                                        contentArr.push(req.title);
                                        if (req.params) req.params.forEach(p => contentArr.push(`${p.name} ${p.label} ${p.note || ''}`));
                                    });
                                }
                                if (api.responses) {
                                    api.responses.forEach(res => {
                                        contentArr.push(res.title);
                                        if (res.params) res.params.forEach(p => contentArr.push(`${p.name} ${p.label} ${p.note || ''}`));
                                    });
                                }
                                const cleanContent = contentArr.join(' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                                searchItems.push({ type: 'API', title: api.name, content: cleanContent, id: id });
                            });
                        }

                        // 3. 萃取錯誤代碼表 (Errors)
                        if (langData.errors) {
                            let contentArr = [];
                            langData.errors.forEach(err => {
                                contentArr.push(`${err.code} ${err.reason}`);
                            });
                            if (contentArr.length > 0) {
                                searchItems.push({ type: '錯誤碼', title: '錯誤代碼表', content: contentArr.join(' '), id: 'errors' });
                            }
                        }

                    } catch (e) {
                        return { formatMatched: false, results: null };
                    }

                    if (searchItems.length === 0) return { formatMatched: false, results: null };

                    const lowerKeyword = keyword.toLowerCase();
                    let matchedSnippets = [];

                    searchItems.forEach(item => {
                        const titleText = item.title || '';
                        const contentText = item.content || '';
                        
                        if (titleText.toLowerCase().includes(lowerKeyword) || contentText.toLowerCase().includes(lowerKeyword)) {
                            let snippet = '';
                            if (contentText.toLowerCase().includes(lowerKeyword)) {
                                const idx = contentText.toLowerCase().indexOf(lowerKeyword);
                                let start = Math.max(0, idx - 40);
                                let end = Math.min(contentText.length, idx + keyword.length + 40);
                                snippet = contentText.substring(start, end);
                                if (start > 0) snippet = '...' + snippet;
                                if (end < contentText.length) snippet = snippet + '...';
                            } else {
                                snippet = contentText.substring(0, 80) + (contentText.length > 80 ? '...' : '');
                            }
                            
                            const targetLink = buildSearchLink(link, keyword, item.id);

                            matchedSnippets.push(`
                                <div onclick="openSearchLink(event, '${targetLink}')" class="mb-3 text-sm border border-emerald-100 hover:border-emerald-300 rounded-lg overflow-hidden shadow-sm hover:shadow-md relative group/item cursor-pointer transition-all">
                                    <div class="bg-emerald-50 px-3 py-2 font-bold text-emerald-800 border-b border-emerald-100 flex gap-2">
                                        <span class="text-emerald-600 shrink-0"><i class="fas fa-bookmark mr-1"></i> ${item.type}:</span> <span>${highlightText(titleText, keyword)}</span>
                                    </div>
                                    <div class="bg-white px-3 py-2.5 text-slate-600 leading-relaxed flex gap-2">
                                        <span class="text-slate-400 font-bold shrink-0"><i class="fas fa-align-left mr-1"></i></span> <span>${highlightText(snippet, keyword)}</span>
                                    </div>
                                </div>
                            `);
                        }
                    });

                    if (matchedSnippets.length > 0) {
                        return { 
                            formatMatched: true, 
                            results: { 
                                cardTitle: cardInfo.cardTitle, 
                                icon: cardInfo.icon, 
                                link: buildSearchLink(link, keyword), 
                                q: pageTitle, 
                                snippets: matchedSnippets 
                            } 
                        };
                    } else {
                        return { formatMatched: true, results: null }; 
                    }
                }
            },
            {
                name: 'Intro_Format', // 策略 3：針對介紹型態格式
                execute: function(html, keyword, link, cardInfo) {
                    if (!html.includes('intro-layout') && !html.includes('intro-article')) {
                        return { formatMatched: false, results: null };
                    }

                    let pageTitle = cardInfo.cardTitle;
                    const titleMatch = html.match(/<div[^>]*class="[^"]*intro-hero[^"]*"[^>]*>[\s\S]*?<h1[^>]*>(.*?)<\/h1>/i);
                    if (titleMatch && titleMatch[1].trim() !== '') {
                        pageTitle = titleMatch[1].replace(/<[^>]+>/g, '').trim();
                    }

                    let contentText = '';
                    const articleMatch = html.match(/<div[^>]*class="[^"]*intro-article[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
                    if (articleMatch) {
                        contentText = articleMatch[1];
                    } else {
                        contentText = html;
                    }

                    let cleanText = contentText
                        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ')
                        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ')
                        .replace(/<[^>]+>/g, ' ')
                        .replace(/\\[nrt]/g, ' ')
                        .replace(/&[a-zA-Z0-9#]+;/gi, ' ')
                        .replace(/\s+/g, ' ')
                        .trim();

                    const searchRegex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
                    let match;
                    let snippets = [];
                    let lastIndex = -1;

                    while ((match = searchRegex.exec(cleanText)) !== null) {
                        if (lastIndex !== -1 && match.index - lastIndex < 80) continue;
                        lastIndex = match.index;

                        let start = Math.max(0, match.index - 40);
                        let end = Math.min(cleanText.length, match.index + keyword.length + 40);
                        let snippet = cleanText.substring(start, end);

                        if (start > 0) snippet = '...' + snippet;
                        if (end < cleanText.length) snippet = snippet + '...';

                        const targetLink = buildSearchLink(link, keyword);

                        snippets.push(`
                            <div onclick="openSearchLink(event, '${targetLink}')" class="mb-3 text-sm border border-amber-100 hover:border-amber-300 rounded-lg overflow-hidden shadow-sm hover:shadow-md relative group/item cursor-pointer transition-all">
                                <div class="bg-amber-50 px-3 py-2 font-bold text-amber-800 border-b border-amber-100 flex gap-2">
                                    <span class="text-amber-600 shrink-0"><i class="fas fa-file-lines mr-1"></i> 內文:</span> <span>${highlightText(pageTitle, keyword)}</span>
                                </div>
                                <div class="bg-white px-3 py-2.5 text-slate-600 leading-relaxed flex gap-2">
                                    <span class="text-slate-400 font-bold shrink-0"><i class="fas fa-align-left mr-1"></i></span> <span>${highlightText(snippet, keyword)}</span>
                                </div>
                            </div>
                        `);

                        if (snippets.length >= 3) break;
                    }

                    if (snippets.length > 0) {
                        return {
                            formatMatched: true,
                            results: {
                                cardTitle: cardInfo.cardTitle,
                                icon: cardInfo.icon,
                                link: buildSearchLink(link, keyword),
                                q: pageTitle,
                                snippets: snippets
                            }
                        };
                    }
                    
                    return { formatMatched: true, results: null };
                }
            },
            {
                name: 'General_Format', // 策略最後一關：通用網頁格式
                execute: function(html, keyword, link, cardInfo) {
                    let cleanText = html
                        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ')
                        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ')
                        .replace(/<[^>]+>/g, ' ')
                        .replace(/\\[nrt]/g, ' ')
                        .replace(/&[a-zA-Z0-9#]+;/gi, ' ')
                        .replace(/\s+/g, ' ')
                        .trim();

                    const searchRegex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
                    let match;
                    let snippets = [];
                    let lastIndex = -1;

                    while ((match = searchRegex.exec(cleanText)) !== null) {
                        if (lastIndex !== -1 && match.index - lastIndex < 80) continue;
                        lastIndex = match.index;

                        let start = Math.max(0, match.index - 40);
                        let end = Math.min(cleanText.length, match.index + keyword.length + 40);
                        let snippet = cleanText.substring(start, end);

                        if (start > 0) snippet = '...' + snippet;
                        if (end < cleanText.length) snippet = snippet + '...';

                        const targetLink = buildSearchLink(link, keyword);

                        snippets.push(`
                            <div onclick="openSearchLink(event, '${targetLink}')" class="text-sm text-slate-600 bg-slate-50 hover:bg-slate-100 p-3.5 rounded-lg border border-slate-100 hover:border-slate-300 leading-relaxed shadow-sm hover:shadow-md mb-2 relative group/item cursor-pointer transition-all">
                                ${highlightText(snippet, keyword)}
                            </div>
                        `);

                        if (snippets.length >= 3) break;
                    }

                    if (snippets.length > 0) {
                        let pageTitle = cardInfo.cardTitle;
                        const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
                        if (titleMatch && titleMatch[1].trim() !== '') {
                            pageTitle = titleMatch[1].trim();
                        }

                        return {
                            formatMatched: true,
                            results: {
                                cardTitle: cardInfo.cardTitle,
                                icon: cardInfo.icon,
                                link: buildSearchLink(link, keyword),
                                q: pageTitle,
                                snippets: snippets
                            }
                        };
                    }
                    
                    return { formatMatched: true, results: null };
                }
            }
        ];

        // ==========================================
        // 全域搜尋主流程
        // ==========================================
        async function executeGlobalSearch() {
            const keyword = document.getElementById('globalSearchInput').value.trim();
            const resultsContainer = document.getElementById('global-search-results');
            const mainContent = document.getElementById('main-content-area');
            const ui = siteConfig[currentLang].ui;

            if (!keyword) {
                resultsContainer.classList.add('hidden');
                mainContent.classList.remove('hidden');
                return;
            }

            mainContent.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            resultsContainer.innerHTML = `<div class="text-center py-16 text-slate-500"><i class="fas fa-spinner fa-spin text-4xl mb-4 text-blue-500"></i><p class="font-bold mt-2">${ui.search_loading || '搜尋中...'}</p></div>`;

            const cards = siteConfig[currentLang].cards || [];
            let allResults = [];
            
            const uniqueLinks = [...new Set(cards.map(c => c.link).filter(l => l && l !== '#'))];

            await Promise.all(uniqueLinks.map(async (link) => {
                if (link.startsWith('http') && !link.includes(window.location.hostname)) {
                    return;
                }

                try {
                    const res = await fetch(link);
                    if (!res.ok) return;
                    const html = await res.text();

                    const linkedCards = cards.filter(c => c.link === link);
                    const cardInfo = {
                        cardTitle: linkedCards.length > 0 ? linkedCards[0].title : '相關文件',
                        icon: linkedCards.length > 0 ? linkedCards[0].icon : 'fas fa-file-alt'
                    };

                    let pageResult = null;
                    
                    for (const strategy of searchStrategies) {
                        try {
                            const outcome = strategy.execute(html, keyword, link, cardInfo);
                            
                            if (outcome.formatMatched) {
                                pageResult = outcome.results;
                                break; 
                            }
                        } catch (err) {
                            console.error(`執行策略 ${strategy.name} 時發生錯誤:`, err);
                        }
                    }

                    if (pageResult) {
                        allResults.push(pageResult);
                    }

                } catch (err) {
                    console.error(`網路請求發生錯誤，目標連結: ${link}`, err);
                }
            }));

            if (allResults.length === 0) {
                let emptyMsg = (ui.search_no_result || '找不到結果').replace('{keyword}', `<span class="text-blue-600 font-bold">${keyword}</span>`);
                resultsContainer.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-5">
                            <i class="fas fa-search-minus text-3xl text-slate-300"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">搜尋完畢</h3>
                        <p class="text-slate-500">${emptyMsg}</p>
                        <button onclick="document.getElementById('globalSearchInput').value=''; executeGlobalSearch();" class="mt-8 px-6 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-lg transition-colors">返回卡片列表</button>
                    </div>
                `;
            } else {
                let countMsg = (ui.search_result_count || '共找到 {count} 筆符合「{keyword}」的頁面').replace('{count}', allResults.length).replace('{keyword}', keyword);
                let html = `
                    <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 class="text-xl font-bold text-slate-800 border-l-4 border-blue-600 pl-3">${countMsg}</h2>
                        <button onclick="document.getElementById('globalSearchInput').value=''; executeGlobalSearch();" class="text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors bg-white border border-slate-200 px-4 py-2 rounded-lg"><i class="fas fa-undo mr-1"></i> 返回列表</button>
                    </div>
                    <div class="grid grid-cols-1 gap-4 max-w-5xl mx-auto w-full">
                `;

                allResults.forEach(res => {
                    html += `
                        <div class="block bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-blue-400 transition-all group relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            
                            <div class="block cursor-pointer" onclick="openSearchLink(event, '${res.link}')">
                                <div class="flex items-center gap-2 mb-4">
                                    <span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded text-xs font-bold flex items-center gap-1.5 border border-blue-100">
                                        <i class="${res.icon}"></i> ${res.cardTitle}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-900 mb-4 group-hover:text-blue-700 transition-colors">${res.q} <i class="fas fa-external-link-alt text-sm ml-1 text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"></i></h3>
                            </div>
                            
                            <div class="space-y-0 mb-1 relative z-10">
                                ${res.snippets.join('')}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                resultsContainer.innerHTML = html;
            }
        }

        function highlightText(text, keyword) {
            if (!keyword) return text;
            const regex = new RegExp(`(${escapeRegExp(keyword)})`, 'gi');
            return text.replace(regex, `<mark class="bg-yellow-200 text-slate-900 rounded px-1 font-bold">$1</mark>`);
        }

        window.onload = function() {
            initLangDropdown();
            renderAll();
        };
    </script>

    <!-- 頂部導覽列 -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                <span class="font-bold text-slate-800 text-base" id="nav-brand"></span>
            </div>
            <!-- 語系下拉選單 -->
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><i class="fas fa-globe"></i></div>
                <select id="lang-select" onchange="changeLang(this.value)" class="appearance-none bg-white hover:bg-slate-50 text-slate-600 font-medium py-2 pl-10 pr-8 rounded-lg text-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer border border-slate-300 shadow-sm"></select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500"><i class="fas fa-chevron-down text-xs"></i></div>
            </div>
        </div>
    </nav>

    <!-- Hero 區塊 -->
    <header class="bg-gradient-to-b from-blue-50 to-slate-50 pt-16 pb-4 md:pt-20 md:pb-6 text-center border-b border-slate-100 relative overflow-hidden shrink-0">
        <i class="fas fa-cloud absolute top-10 left-[10%] text-blue-400/10 text-6xl transform -rotate-12"></i>
        <i class="fas fa-code absolute bottom-10 right-[15%] text-blue-400/10 text-8xl transform rotate-12"></i>
        
        <div class="max-w-4xl mx-auto relative z-10 w-full px-4 sm:px-0">
            <h1 id="hero-title" class="text-4xl md:text-5xl font-extrabold text-blue-800 tracking-tight mb-6 text-center"></h1>
            
            <!-- 調整為卡片式的副標題 -->
            <div id="hero-subtitle" class="mt-6 bg-white/80 backdrop-blur-md border border-white shadow-md rounded-2xl p-6 md:p-8 text-slate-600 text-base md:text-lg leading-relaxed w-full text-left sm:text-center mx-auto"></div>
            
            <!-- 全域搜尋輸入框 -->
            <div id="search-bar-container" class="mt-8 relative w-full hidden shadow-lg rounded-xl mx-auto">
                <i class="fas fa-search absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="globalSearchInput" onkeydown="if(event.key === 'Enter') executeGlobalSearch()" class="w-full pl-14 pr-24 py-4 border-2 border-white rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none text-slate-700 transition-all text-lg" placeholder="">
                <button onclick="executeGlobalSearch()" id="search-btn-text" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg transition-colors font-bold shadow-md">搜尋</button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12 md:pt-10 md:pb-16">
        
        <!-- 預設的卡片列表區 -->
        <div id="main-content-area">
            <div id="category-container" class="flex flex-wrap justify-center gap-3 mb-10 w-full max-w-5xl mx-auto"></div>
            <div id="cards-container"></div>
        </div>

        <!-- 搜尋結果顯示區 -->
        <div id="global-search-results" class="hidden max-w-5xl mx-auto w-full"></div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-8 text-center mt-auto shrink-0">
        <p id="footer-text" class="text-slate-400 text-sm font-medium"></p>
    </footer>

    <!-- 滿版 Iframe 燈箱 -->
    <div id="iframe-lightbox" class="fixed inset-0 z-[100] hidden bg-white flex-col">
        <!-- 操作列 -->
        <div class="h-14 bg-slate-100 border-b border-slate-200 flex items-center px-4 shrink-0 shadow-sm">
            <button onclick="closeIframeLightbox()" class="flex items-center gap-2 text-slate-600 hover:text-blue-600 font-bold transition-colors px-4 py-2 rounded-lg hover:bg-slate-200">
                <i class="fas fa-arrow-left"></i> 返回
            </button>
        </div>
        <!-- Iframe 容器 -->
        <iframe id="lightbox-iframe" class="w-full flex-grow border-0" src=""></iframe>
    </div>
</body>
</html>
