, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"作業規範","desc":"<p>1.已確認的折讓資料無法再一次確認<\/p><p>2.取消待確認折讓資料沒有期限問題<\/p><p><span style=\"color: rgb(0, 0, 0);\">3.當開立等待折讓後，開立的折讓資料，僅記錄於平台且未生效，也未上傳至「財政 部電子發票整合服務平台」，待營業人與買受人確認後再執行確認折讓，確認後屆 當期上傳排程日(每單月一日)，平台將會把折讓資料上傳至「財政部電子發票整合 服務平台」。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.當開立等待折讓單後，若因故需取消等待折讓，營業人可執行取消，此時平台將該 筆等待折讓狀態變更為取消。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>折讓單：每一次折讓收據，都會有一筆獨立的折讓記錄，稱之為折讓單或是折讓資料<\/p><p>等待折讓：等待消費者同意折讓前，收據仍是有效狀態，此時的折讓單稱為等待折讓<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立折讓流程－等待折讓"}]},"apis":[{"name":"觸發或取消待確認折讓資料API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"觸發折讓狀態","example":"1","must_return":false,"note":"1 = 確認折讓。\n2 = 取消折讓。","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"折讓流水號","example":"586","must_return":false,"note":"開立折讓時系統回應的折讓流水號。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.觸發或取消發動成功，則回傳 SUCCESS\n2.觸發或取消發動開立失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"70565326","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"收據號碼","example":"T13671008","must_return":false,"note":"此次作廢收據或等待作廢的收據號碼。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"折讓流水號","example":"585","must_return":false,"note":"此次開立或取消折讓，系統回應的折讓流水號。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"Or_5521142","must_return":false,"note":"此次開立折讓的收據，於開立收據時，提供之自訂編號。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"折讓金額","example":"400","must_return":false,"note":"此次開立折讓的金額","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"折讓後剩餘收據金額","example":"600","must_return":false,"note":"確認折讓後，此張收據剩餘之收據金額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"檢查碼","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo ,RandomNum, TotalAmt不含在此API回應欄位中，需程式自行保存開立收據時回傳的 InvoiceTransNo、RandomNum、TotalAmt，供日後 CheckCode 驗證使用。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"ALW10002","reason":"此收據號碼折讓總金額超過開立金額"},{"code":"ALW10003","reason":"開立折讓失敗"},{"code":"ALW10004","reason":"觸發折讓狀態失敗"},{"code":"ALW10005","reason":"已確認折讓，無法再執行取消折讓"},{"code":"ALW10006","reason":"折讓商品名稱總計超過 280 個字"},{"code":"ALW10007","reason":"折讓商品名稱超過 7 個商品"},{"code":"ALW10008","reason":"折讓商品數量非純數字"},{"code":"ALW10009","reason":"折讓商品單位字數超過 2 個字"},{"code":"ALW10010","reason":"折讓商品單價超過 8 位數 or 非純數字"},{"code":"ALW10011","reason":"折讓商品小計超過 8 位數 or 非純數字"},{"code":"ALW10012","reason":"折讓總金額超過 8 位數 or 非純數字"},{"code":"ALW10013","reason":"商品資訊的商品小計計算錯誤"},{"code":"ALW10014","reason":"收據金額驗證錯誤"},{"code":"ALW10015","reason":"觸發折讓狀態錯誤"},{"code":"ALW10016","reason":"確認折讓方式錯誤"},{"code":"ALW10017","reason":"折讓單號錯誤"}],"versions":[]},

old\\\">{group_type}<\/span> processing must be completed before transmission.","msg_res_info_webhook":"This result will be proactively pushed by the system in asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"This result will be synchronously returned by the system via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format combination.","msg_res_security":"Verification & Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing must be performed on specific data after reception.","lbl_sha_pre_hash":"String to Hash (Pre-encryption)","ph_sha_pre_hash":"After clicking the checksum button, the actual full string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_1.png"},"meta":{"title":"Trigger or Cancel Pending Allowance Data API","subtitle":"Trigger or Cancel Allowance Data","version":"","sections":[{"id":"section-0","title":"Connection Purpose","desc":"<p><span style=\\\"color: rgb(0, 0, 0);\\\">1. Before connecting, please contact the customer service center to apply for IP settings. The number of IPs that can be set is: 10.<\/span><\/p><p>2. Manage pending allowance data, such as directly confirming allowance data or cancelling this pending allowance data.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\\\"color: rgb(0, 0, 0);\\\">1. Travel agencies send allowance receipt data to the electronic receipt platform via \"HTTP POST\" for processing. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">4. The electronic receipt platform responds with formatted strings. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">5. The calculation unit for each field is a character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">6. Fields are connected by \"&\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Operation Standards","desc":"<p>1. Confirmed allowance data cannot be confirmed again.<\/p><p>2. There is no deadline for cancelling pending allowance data.<\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">3. When an 'awaiting allowance' is issued, the allowance data is only recorded on the platform and is not yet effective, nor is it uploaded to the 'Ministry of Finance Electronic Invoice Integration Service Platform'. After the business entity and the buyer confirm, the allowance confirmation is executed. Once confirmed, on the scheduled upload date of the current period (the 1st of every odd month), the platform will upload the allowance data to the 'Ministry of Finance Electronic Invoice Integration Service Platform'. <\/span><\/p><p><span style=\\\"color: rgb(0, 0, 0);\\\">4. After an 'awaiting allowance' slip is issued, if it needs to be cancelled for some reason, the business entity can execute a cancellation, at which time the platform will change the status of that awaiting allowance to cancelled.<\/span><\/p>"},{"id":"section-3","title":"Terminology Definitions","desc":"<p>Allowance Slip: Every allowance receipt has an independent allowance record, called an allowance slip or allowance data.<\/p><p>Awaiting Allowance: Before the consumer agrees to the allowance, the receipt remains in a valid state. The allowance slip at this time is called an awaiting allowance.<\/p>"},{"id":"section-4","title":"Pre-connection Tasks","desc":"<p>(Please complete first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test area backend → Basic Data → API Connection Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production area backend → Basic Data → API Connection Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Maximum of 10 IPs can be set<\/p><p>- Requirements: Provide the server's external IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test and production environments are completely different systems; data is not shared. Before going live, ensure the connection URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common error signals for 'forgetting pre-connection tasks'<\/p><p>- `KEY10001 Not a Travel Agency API connection IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still example values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID wrong or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Issuance Process - Awaiting Allowance"}]},"apis":[{"name":"Trigger or Cancel Pending Allowance Data API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption after combining string fields. Field descriptions are in the table below:","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"Trigger Allowance Status","example":"1","must_return":false,"note":"1 = Confirm allowance.\n2 = Cancel allowance.","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"Allowance Serial Number","example":"586","must_return":false,"note":"The allowance serial number returned by the system when the allowance was issued.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS if trigger or cancel is successful\n2. Returns error code if trigger or cancel fails","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Successful","must_return":true,"note":"Text description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"70565326","must_return":false,"note":"Travel agency Tax ID","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number of the receipt being invalidated or awaiting invalidation.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"585","must_return":false,"note":"The allowance serial number returned by the system for this allowance issuance or cancellation.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Number","example":"Or_5521142","must_return":false,"note":"The custom number provided for the receipt when it was issued for this allowance.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"Allowance Amount","example":"400","must_return":false,"note":"The amount of this allowance","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Receipt Amount After Allowance","example":"600","must_return":false,"note":"The remaining receipt amount of this receipt after confirming the allowance.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Used to check the validity of the data return. You can compare this parameter during integration to verify if it was returned by the platform. Please refer to \"SHA256 Encryption Description\" for verification methods. Returns null if issuance fails.\n\nCheckCode = Hash value calculated by signing InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications\n\nInvoiceTransNo, RandomNum, TotalAmt are not included in this API response. The program must save the InvoiceTransNo, RandomNum, and TotalAmt returned during receipt issuance for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must check for EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a Travel Agency API connection IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied for electronic receipt activation"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection abnormality"},{"code":"ALW10002","reason":"Total allowance amount for this receipt exceeds the issued amount"},{"code":"ALW10003","reason":"Allowance issuance failed"},{"code":"ALW10004","reason":"Failed to trigger allowance status"},{"code":"ALW10005","reason":"Allowance already confirmed, cannot execute cancellation"},{"code":"ALW10006","reason":"Total allowance item names exceed 280 characters"},{"code":"ALW10007","reason":"Allowance item names exceed 7 items"},{"code":"ALW10008","reason":"Allowance item quantity is not numeric"},{"code":"ALW10009","reason":"Allowance item unit characters exceed 2 characters"},{"code":"ALW10010","reason":"Allowance item unit price exceeds 8 digits or is not numeric"},{"code":"ALW10011","reason":"Allowance item subtotal exceeds 8 digits or is not numeric"},{"code":"ALW10012","reason":"Total allowance amount exceeds 8 digits or is not numeric"},{"code":"ALW10013","reason":"Error calculating item subtotal in product information"},{"code":"ALW10014","reason":"Receipt amount verification error"},{"code":"ALW10015","reason":"Trigger allowance status error"},{"code":"ALW10016","reason":"Confirm allowance method error"},{"code":"ALW10017","reason":"Allowance slip number error"}],"versions":[]},

=value2...) で組み合わせます。","enc_step2_title":"AES 暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード (Padding)：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：加盟店に属する Hash Key および Hash IV を使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化後のバイナリデータ (Raw Data) を Hex String (小文字) に変換したものが暗号化文字列です。","enc_sha_title":"SHA256 チェックマック値メカニズム (CheckMacValue)","enc_sha_desc":"SHA256 ハッシュを使用してチェックマックを生成し、リクエストパラメータまたは返却値の完全性を検証できます。","enc_sha_step1_title":"パラメータのソートと組み合わせ","enc_sha_step1_desc":"指定されたパラメータを英名順 (A-Z) にソートし、Query String (key1=val1&key2=val2...) として組み合わせます。","enc_sha_step2_title":"IV と Key の連結","enc_sha_step2_desc":"ソート後の文字列の前後にそれぞれ HashIV と HashKey を連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 暗号化と大文字変換","enc_sha_step3_desc":"連結後の文字列に対して SHA256 暗号化を行い、結果を<strong>大文字<\/strong>に変換します。","res_title":"レスポンスパラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"メソッド","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータ未定義","msg_code_unavailable":"// プログラム例はまだありません","nav_versions":"バージョン記録","versions_title":"バージョン記録","th_ver_version":"バージョン","th_ver_date":"修正日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API 基本情報","field_def_title":"API フィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"発動形態","lbl_field_combo_format":"フィールド組み合わせ形式","lbl_enum_values":"許容値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null 許可","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"送信位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは加盟店側から発動する必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 方式で、パラメータをパッケージ化して <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> に配置して送信してください。","msg_req_format_qs":"このブロックのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わせる必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡す必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で加盟店指定の <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにアクティブプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期返却されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わされます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクトに入れて渡されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前組み合わせ文字列 (String to Hash)","ph_sha_pre_hash":"エンコードボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_2.png"},"meta":{"title":"未確認値引きデータの発行または取消API","subtitle":"値引きデータの発行または取消","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 連携前にカスタマーセンターに連絡し、IP設定を申請してください。設定可能なIP数は10件です。<\/span><\/p><p>2. 未確認の値引きデータを管理します（値引きデータの直接確定、または未確認値引きデータの取り消しなど）。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で値引き領収書データを電子領収書プラットフォームに送信して処理を行います。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字エンコーディングは UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返却します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。全角、半角、数字、記号はいずれも1文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号として使用します。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"運用ルール","desc":"<p>1. 確定済みの値引きデータを再度確定することはできません。<\/p><p>2. 未確認値引きデータの取り消しに期限はありません。<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 値引き待ちとして発行された値引きデータは、プラットフォームに記録されるのみで有効にはならず、また「財政部電子発票統合サービスプラットフォーム」にもアップロードされません。営業人と買受人が確認した後に値引き確定を実行すると、該当期のアップロードスケジュール日（奇数月の1日）に、プラットフォームが値引きデータを「財政部電子発票統合サービスプラットフォーム」にアップロードします。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 値引き待ち伝票の発行後、何らかの理由で値引き待ちを取り消す必要がある場合、営業人は取り消しを実行できます。このとき、プラットフォームは該当する値引き待ちの状態を「取り消し」に変更します。<\/span><\/p>"},{"id":"section-3","title":"用語定義","desc":"<p>値引き伝票：個々の値引き領収書には独立した値引き記録があり、これを値引き伝票または値引きデータと呼びます。<\/p><p>値引き待ち：消費者が値引きに同意するのを待っている間、領収書は依然として有効な状態です。この時点の値引き伝票を値引き待ちと呼びます。<\/p>"},{"id":"section-4","title":"連携前の事前準備","desc":"<p>（プログラムが失敗するため、必ず先に完了させてください）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後にカスタマーセンターへ送信（FAX / メール）<\/p><p>- 最大10件のIPを設定可能<\/p><p>- 提出物：サーバーの外部接続IP（内部IPではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常1-2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共通していません。リリース前に必ず連携URLを本番環境のものに切り替えたか確認してください。<\/p><p><br><\/p><p>4. よくある「事前準備忘れ」のエラー信号<\/p><p>- `KEY10001 旅行社のAPI連携IPではありません` → IPホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データの復号エラー` → HashKey / HashIV が不正確またはサンプルのまま<\/p><p>- `KEY10009 旅行社の統一番号のデータを取得できません` → MerchantID が誤っているか、有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"値引き発行フロー－値引き待ち"}]},"apis":[{"name":"未確認値引きデータの発行または取消API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一番号","example":"54352706","must_return":false,"note":"旅行社の統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"フィールドを組み合わせた後、AES256暗号化を行います。各フィールドの説明は下表の通りです。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"1.0 固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数\\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時刻を入力することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"値引きトリガーステータス","example":"1","must_return":false,"note":"1 = 値引き確定。\\n2 = 値引き取消。","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"値引きシリアル番号","example":"586","must_return":false,"note":"値引き発行時にシステムから返却された値引きシリアル番号。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システムレスポンスメッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 発動に成功した場合は SUCCESS を返却\\n2. 発行失敗の場合はエラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"テキストによる今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社コード","example":"70565326","must_return":false,"note":"旅行社の統一番号","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回無効化された、または無効化待ちの領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"値引きシリアル番号","example":"585","must_return":false,"note":"今回の値引き発行または取り消しに対し、システムから返却された値引きシリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"カスタム番号","example":"Or_5521142","must_return":false,"note":"今回の値引き対象領収書の発行時に提供されたカスタム番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"値引き金額","example":"400","must_return":false,"note":"今回の値引き発行の金額","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"値引き後の領収書残高","example":"600","must_return":false,"note":"値引き確定後の、この領収書の残り金額。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"返却されたデータの妥当性を検証するために使用されます。プラットフォームからの返却であることを確認するために、このパラメータを比較できます。検証方法は「SHA256暗号化の説明」を参照してください。発行失敗時は空値が返却されます。\\n\\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名仕様に基づいて計算したハッシュ値\\n\\nInvoiceTransNo, RandomNum, TotalAmt はこのAPIのレスポンスフィールドには含まれません。領収書発行時に返却された InvoiceTransNo、RandomNum、TotalAmt をプログラム側で保存し、後日の CheckCode 検証に使用する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"## 固定で返却されます。String 方式でデータを受信するユーザーは、データの完全性を確保するために EndStr=## を判定する必要があります。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行社のAPI連携IPではありません"},{"code":"KEY10002","reason":"データの復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データが不完全です"},{"code":"KEY10006","reason":"旅行社が電子領収書の使用を申請していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超えました"},{"code":"KEY10009","reason":"旅行社の統一番号のデータを取得できません"},{"code":"KEY10010","reason":"旅行社の統一番号が空白です"},{"code":"KEY10011","reason":"PostData_フィールドが空白です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空白です"},{"code":"KEY10014","reason":"タイムアウト。通常、I/O上のタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10019","reason":"旅行社の権限が停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"ALW10002","reason":"この領収書番号の値引き合計額が発行額を超えています"},{"code":"ALW10003","reason":"値引きの発行に失敗しました"},{"code":"ALW10004","reason":"値引きステータスのトリガーに失敗しました"},{"code":"ALW10005","reason":"値引き確定済みのため、値引きの取り消しは実行できません"},{"code":"ALW10006","reason":"値引き商品名の合計が280文字を超えています"},{"code":"ALW10007","reason":"値引き商品数が7点を超えています"},{"code":"ALW10008","reason":"値引き商品の数量が数字ではありません"},{"code":"ALW10009","reason":"値引き商品の単位が2文字を超えています"},{"code":"ALW10010","reason":"値引き商品の単価が8桁を超えているか、数字ではありません"},{"code":"ALW10011","reason":"値引き商品の小計が8桁を超えているか、数字ではありません"},{"code":"ALW10012","reason":"値引きの合計金額が8桁を超えているか、数字ではありません"},{"code":"ALW10013","reason":"商品情報の小計計算エラー"},{"code":"ALW10014","reason":"領収書金額の検証エラー"},{"code":"ALW10015","reason":"値引きステータストリガーエラー"},{"code":"ALW10016","reason":"値引き確定方式のエラー"},{"code":"ALW10017","reason":"値引き伝票番号のエラー"}],"versions":[]},

"ko": {"languageName":"한국어","ui":{"head_title":"확인 대기 중인 매출환입 데이터 트리거 또는 취소 API","system_name":"","copyright":"","sidebar_brand":"매출환입 데이터 트리거/취소 API","nav_tool":"암호화 테스트 도구","nav_group_api":"API 규격 상세 설명","nav_apis":"API 규격","nav_encryption":"암호화 규칙 상세 설명","nav_errors":"오류 코드표","nav_example":"예제 소스 코드","tool_title":"암호화 테스트 도구","tool_intro":"이 도구는 암호화 문자열을 생성하거나 반환된 결과를 복호화하는 데 도움을 줍니다.","tool_security_warning":"보안 경고: 본 도구는 연동 테스트용으로만 제공됩니다. 정보 보안을 위해 실제 환경의 Hash Key와 Hash IV를 입력하지 마십시오.","tool_tab_encrypt":"AES 암호화","tool_tab_decrypt":"AES 복호화","tool_tab_sha":"SHA256 암호화","tool_ph_key":"예: AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"예: AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"요청 파라미터 (Query String)","tool_ph_qs":"예: TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"문자열이 http_build_query 또는 urlencode 처리가 되었는지 확인하십시오.","tool_note_sha_sort":"프로그램이 자동으로 아래 필드를 영문 이름순(A-Z)으로 정렬하여 조합하고, 앞뒤로 IV/Key를 연결합니다.","tool_btn_encrypt":"암호화 실행 및 문자열 생성","tool_btn_sha":"SHA256 실행","tool_lbl_hex":"암호화 결과 (Hex String)","tool_lbl_enc_hex":"암호화 문자열 (Hex String)","tool_lbl_sha_res":"SHA256 결과 (Uppercase)","tool_ph_enc_hex":"예: 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"복호화 실행","tool_lbl_decrypt_res":"복호화 결과 (원본 데이터)","tool_alert_missing_key":"Hash Key와 Hash IV를 입력하십시오.","tool_alert_missing_data":"원본 문자열을 입력하십시오.","tool_alert_encrypt_fail":"암호화 실패: ","tool_alert_missing_hex":"암호화된 Hex 문자열을 입력하십시오.","tool_alert_decrypt_fail":"복호화 실패. Key/IV 또는 암호화 문자열 형식을 확인하십시오.","req_title":"요청 파라미터 (Request)","req_api_info":"API 정보","req_url_prod":"URL (실제 운영 환경)","req_url_test":"URL (테스트 환경)","th_param":"파라미터 이름","th_name":"한글 이름","th_required":"필수","th_must_return":"필수 반환","th_type":"타입","th_note":"비고","enc_title":"암호화 규칙 상세 설명","enc_aes_title":"AES 암호화/복호화 메커니즘","enc_aes_desc":"업체에서 제공한 Hash Key 및 Hash IV를 사용하여 AES 알고리즘으로 데이터를 암호화 또는 복호화 처리합니다.","enc_step1_title":"요청 문자열 생성","enc_step1_desc":"모든 파라미터를 <code>http_build_query<\/code> 형식(key=value&key2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체의 Hash Key 및 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 바이너리 데이터(Raw Data)를 소문자 Hex String으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 검증 코드 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 검증 코드를 생성하며, 요청 파라미터 또는 반환 값의 무결성을 검증하는 데 사용됩니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z) 순으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열의 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 소스 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 아직 프로그램 예제가 없습니다","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"플로우차트","lbl_launch_type":"발생 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용 여부","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전송 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점에서 발생시켜야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식으로 파라미터를 패키징하여 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>에 배치하여 전송하십시오.","msg_req_format_qs":"이 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","msg_res_info_webhook":"본 결과는 시스템에서 비동기 형식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"본 결과는 시스템에서 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_res_security":"검증 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 실제로 암호화될 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_3.png"},"meta":{"title":"확인 대기 중인 매출환입 데이터 트리거 또는 취소 API","subtitle":"매출환입 데이터 트리거 또는 취소","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 연동 전 고객센터에 연락하여 IP 설정을 신청해 주시기 바랍니다. 설정 가능한 IP 그룹 수는 10개입니다.<\/span><\/p><p>2. 확인 대기 중인 매출환입 데이터를 관리합니다. 예를 들어 매출환입 데이터를 직접 확인하거나, 이 확인 대기 중인 매출환입 데이터를 취소할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 매출환입 영수증 데이터를 전자 영수증 플랫폼에 전송하여 작업을 진행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자(Character)입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 「&amp;」 기호로 연결하며, 각 필드 내에는 이 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"작업 규정","desc":"<p>1. 이미 확인된 매출환입 데이터는 다시 확인 처리할 수 없습니다.<\/p><p>2. 확인 대기 매출환입 데이터 취소에는 기한 제한이 없습니다.<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 매출환입 대기 건을 발행한 경우, 해당 매출환입 데이터는 플랫폼에만 기록되고 효력이 발생하지 않으며 「재정부 전자발송 통합 서비스 플랫폼」에도 업로드되지 않습니다. 영업자와 구매자가 확인한 후 매출환입 확인을 실행하면, 해당 회차 업로드 일정일(홀수달 1일)에 플랫폼이 매출환입 데이터를 「재정부 전자발송 통합 서비스 플랫폼」으로 업로드합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 매출환입 대기 전표를 발행한 후 사유가 발생하여 취소해야 하는 경우, 영업자는 취소를 실행할 수 있으며 이때 플랫폼은 해당 매출환입 대기 상태를 취소로 변경합니다.<\/span><\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>매출환입 전표(Credit Note): 각 매출환입 영수증마다 독립적인 매출환입 기록이 생성되며, 이를 매출환입 전표 또는 매출환입 데이터라고 합니다.<\/p><p>매출환입 대기: 소비자가 매출환입에 동의하기 전까지 영수증은 여전히 유효한 상태이며, 이때의 매출환입 전표를 매출환입 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 전 준비 작업","desc":"<p>(반드시 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 환경 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 운영 환경 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 양식을 다운로드하여 작성 후 고객센터로 전송(팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제출 내용: 서버 외부 IP (내부 IP가 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 영업일 기준 1-2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 설비이며 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL이 실제 운영 환경 URL로 전환되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 「준비 작업 누락」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 찾을 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"매출환입 발행 프로세스 - 매출환입 대기"}]},"apis":[{"name":"확인 대기 중인 매출환입 데이터 트리거 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화 처리, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 입력할 것을 권장함","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"트리거 매출환입 상태","example":"1","must_return":false,"note":"1 = 매출환입 확인.\n2 = 매출환입 취소.","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"매출환입 일련번호","example":"586","must_return":false,"note":"매출환입 발행 시 시스템이 응답한 매출환입 일련번호.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 트리거 또는 취소 요청 성공 시 SUCCESS 반환\n2. 트리거 또는 취소 실행 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"70565326","must_return":false,"note":"여행사 사업자 등록 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 무효화된 영수증 또는 무효 대기 중인 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"매출환입 일련번호","example":"585","must_return":false,"note":"이번 매출환입 발행 또는 취소 시 시스템이 응답한 매출환입 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"사용자 정의 번호","example":"Or_5521142","must_return":false,"note":"이번에 매출환입 처리된 영수증 발행 시 제공했던 사용자 정의 번호.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"매출환입 금액","example":"400","must_return":false,"note":"이번에 발행된 매출환입 금액","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"매출환입 후 잔여 영수증 금액","example":"600","must_return":false,"note":"매출환입 확인 후, 해당 영수증의 남은 영수증 금액.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"검증 코드","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"이번 데이터 반환의 유효성을 검사하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환한 것인지 검증할 수 있으며, 검증 방법은 \"SHA256 암호화 설명\"을 참조하십시오. 발행 실패 시 빈 값을 반환합니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\nInvoiceTransNo, RandomNum, TotalAmt는 이 API의 응답 필드에 포함되어 있지 않으므로, 영수증 발행 시 반환된 InvoiceTransNo, RandomNum, TotalAmt를 프로그램에서 자체 저장하여 향후 CheckCode 검증에 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"## 고정 반환. String 방식으로 데이터를 수신하는 사용자는 데이터 전송의 무결성을 보장하기 위해 EndStr=## 여부를 추가로 판단해야 합니다.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP가 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불충분"},{"code":"KEY10006","reason":"여행사가 전자 영수증 사용 신청을 하지 않음"},{"code":"KEY10007","reason":"페이지 머무름 시간이 30분을 초과함"},{"code":"KEY10009","reason":"여행사 사업자 번호 데이터를 찾을 수 없음"},{"code":"KEY10010","reason":"여행사 사업자 번호가 비어 있음"},{"code":"KEY10011","reason":"PostData_ 필드가 비어 있음"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터가 비어 있음"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 상의 타임아웃을 의미함"},{"code":"KEY10015","reason":"영수증 금액 형식이 잘못됨"},{"code":"KEY10019","reason":"여행사 권한이 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"ALW10002","reason":"해당 영수증 번호의 매출환입 총액이 발행 금액을 초과함"},{"code":"ALW10003","reason":"매출환입 발행 실패"},{"code":"ALW10004","reason":"트리거 매출환입 상태 실패"},{"code":"ALW10005","reason":"이미 매출환입이 확인되어 매출환입 취소를 실행할 수 없음"},{"code":"ALW10006","reason":"매출환입 상품명 합계가 280자를 초과함"},{"code":"ALW10007","reason":"매출환입 상품 종류가 7개를 초과함"},{"code":"ALW10008","reason":"매출환입 상품 수량이 숫자가 아님"},{"code":"ALW10009","reason":"매출환입 상품 단위 글자 수가 2자를 초과함"},{"code":"ALW10010","reason":"매출환입 상품 단가가 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10011","reason":"매출환입 상품 소계가 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10012","reason":"매출환입 총액이 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10013","reason":"상품 정보의 상품 소계 계산 오류"},{"code":"ALW10014","reason":"영수증 금액 검증 오류"},{"code":"ALW10015","reason":"트리거 매출환입 상태 오류"},{"code":"ALW10016","reason":"확인 매출환입 방식 오류"},{"code":"ALW10017","reason":"매출환입 전표 번호 오류"}],"versions":[]},

atet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_req_security":"Datasäkerhet: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer automatiskt att skickas av systemet i asynkron form till den <span class=\\\"font-bold text-green-700\\\">Webhook<\/span>-mottagningsadress som angetts av butiken.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet i <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"De returnerade fälten kommer att kombineras till ett Query String-format med <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>-symbolen, till exempel <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten kommer att skickas i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt.","msg_res_format_other":"De returnerade fälten kombineras med formatet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_res_security":"Verifiering och dekryptering: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs för specifika data efter mottagande.","lbl_sha_pre_hash":"Kombinerad sträng före kryptering (String to Hash)","ph_sha_pre_hash":"Efter att ha tryckt på krypteringsknappen visas den faktiska fullständiga strängen som krypteras här...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_4.png"},"meta":{"title":"API för aktivering eller avbrytande av väntande avdragsdata","subtitle":"Aktivera eller avbryt avdragsdata","version":"","sections":[{"id":"section-0","title":"Syfte med integration","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Kontakta kundtjänst för att ansöka om IP-inställningar före integration. Upp till 10 IP-adresser kan ställas in.<\/span><\/p><p>2. Hantera väntande avdragsdata, som att direkt bekräfta avdragsdata eller avbryta väntande avdragsdata.<\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittoavdragsdata till den elektroniska kvittoplattformen via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält ansluts med \"&\", och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Operativa regler","desc":"<p>1. Redan bekräftade avdragsdata kan inte bekräftas igen.<\/p><p>2. Det finns ingen tidsgräns för att avbryta väntande avdragsdata.<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. När ett väntande avdrag skapas, registreras avdragsdata endast på plattformen och har inte trätt i kraft, och laddas inte heller upp till den nationella skattemyndighetens tjänsteplattform. Efter att operatören och köparen har bekräftat utförs bekräftelsen, varefter data laddas upp vid nästa schemalagda tillfälle (den första dagen i varje ojämn månad). <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Om ett väntande avdrag behöver avbrytas efter att det skapats, kan operatören utföra en avbrytning, varvid plattformen ändrar status för det väntande avdraget till avbruten.<\/span><\/p>"},{"id":"section-3","title":"Definitioner","desc":"<p>Avdragsnota: Varje kvittoavdrag har en oberoende avdragspost, kallad avdragsnota eller avdragsdata.<\/p><p>Väntande avdrag: Innan konsumenten godkänner avdraget är kvittot fortfarande i giltigt tillstånd, och avdragsnotan kallas då väntande avdrag.<\/p>"},{"id":"section-4","title":"Förberedelser inför integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testmiljöns backoffice → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsmiljöns backoffice → Grunddata → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP (inte internt nätverks-IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika miljöer och data delas inte. Se till att byta till produktions-URL innan driftsättning.<\/p><p><br><\/p><p>4. Vanliga felsignaler för \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en resebyrå API-integrations-IP` → IP-vitlistning är inte inställd eller felaktig<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktig eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller inte aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för att skapa avdrag - Väntande avdrag"}]},"apis":[{"name":"API för aktivering eller avbrytande av väntande avdragsdata","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8) neras SUCCESS\n2. Om aktivering eller avbrytande misslyckas returneras en felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Lyckades","must_return":true,"note":"Textbeskrivning av returstatusen","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyrå-ID","example":"70565326","must_return":false,"note":"Resebyråns organisationsnummer","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret för det kvitto som makulerats eller väntar på makulering.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Löpnummer för avdrag","example":"585","must_return":false,"note":"Det löpnummer för avdraget som returnerades vid skapande eller avbrytande av avdrag.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Anpassat nummer","example":"Or_5521142","must_return":false,"note":"Det anpassade nummer som tillhandahölls när kvittot för detta avdrag skapades.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"Avdragsbelopp","example":"400","must_return":false,"note":"Beloppet för detta avdrag","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Återstående kvitto-belopp efter avdrag","example":"600","must_return":false,"note":"Återstående belopp på detta kvitto efter att avdraget har bekräftats.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Används för att kontrollera giltigheten av de returnerade data. Vid integration kan denna jämföras för att verifiera att den kommer från plattformen. Kontrollmetoden finns i ”SHA256-krypteringsinstruktioner”. Om skapandet misslyckas returneras ett tomt värde.\n\nCheckCode = Hash-värde beräknat enligt SHA256-specifikationen för InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nInvoiceTransNo, RandomNum, TotalAmt ingår inte i detta API-svar. Programmet måste själv spara InvoiceTransNo, RandomNum och TotalAmt som returnerades när kvittot skapades för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data via String-metoden bör kontrollera EndStr=## för att säkerställa fullständig dataöverföring.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en resebyrå API-integrations-IP"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständiga data"},{"code":"KEY10006","reason":"Resebyrån har inte ansökt om att aktivera elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer är tomt"},{"code":"KEY10011","reason":"PostData_-fältet är tomt"},{"code":"KEY10012","reason":"Dataöverföringsfel"},{"code":"KEY10013","reason":"Data saknas"},{"code":"KEY10014","reason":"TimeOut. Avser generellt timeout vid I/O"},{"code":"KEY10015","reason":"Felaktigt format på kvitto-belopp"},{"code":"KEY10019","reason":"Resebyråns rättigheter har dragits in"},{"code":"NOR10001","reason":"Nätverksanslutningsfel"},{"code":"ALW10002","reason":"Totalt av         const globalCodeExamples = {"PHP":"<?php\n/*\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use.\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected.\n */\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature verification\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\ndefine('API_KEY', 'YOUR_AES_KEY_AND_HASH_KEY_HERE');\ndefine('API_IV', 'YOUR_AES_IV_AND_HASH_IV_HERE');\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/allowance_touch_issue');\n\n// Verification gate to prevent execution with default placeholder credentials\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_AES_KEY_AND_HASH_KEY_HERE' || API_IV === 'YOUR_AES_IV_AND_HASH_IV_HERE') {\n    echo '<div style=\"color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 15px; margin: 20px; font-family: sans-serif; border-radius: 4px;\">';\n    echo '<strong>Configuration Error:<\/strong> Please replace the placeholder API credentials (<code>MERCHANT_ID<\/code>, <code>API_KEY<\/code>, <code>API_IV<\/code>) with your actual travel invoice API credentials before proceeding.';\n    echo '<\/div>';\n    exit;\n}\n\n/* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n * Each padding byte value equals paddingLen.\n * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n * to prevent the library from applying its own PKCS7 padding. */\nfunction encrypt_aes_b32($plaintext, $key, $iv) {\n    $blockSize = 32;\n    $plaintextLen = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    // IV must always be 16 bytes because the native AES algorithm block size is fixed to 16 bytes\n    if (strlen($iv) !== 16) {\n        throw new Exception('Initialization Vector (IV) must be exactly 16 bytes.');\n    }\n    \n    if (strlen($key) !== 32) {\n        throw new Exception('Encryption key must be exactly 32 bytes for AES-256.');\n    }\n\n    $encrypted = openssl_encrypt($paddedPlaintext, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed: ' . openssl_error_string());\n    }\n\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Recreates the SHA-256 hash using properties returned in the API response\n * and matching original parameters preserved by the system.\n *\n * @param string $iv The HashIV value used in the transaction\n * @param string $invoiceTransNo Original invoice transaction number (preserved from creation)\n * @param string $merchantId The merchant ID associated with the response\n * @param string $merchantOrderNo The merchant order number returned in the response\n * @param string $randomNum Original invoice random number (preserved from creation)\n * @param string $totalAmt Original invoice total amount (preserved from creation)\n * @param string $key The HashKey value used in the transaction\n * @return string Calculated uppercase SHA256 signature\n */\nfunction verify_response_signature($iv, $invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $key) {\n    $rawString = 'HashIV=' . $iv .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantId .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . $key;\n\n    return strtoupper(hash('sha256', $rawString));\n}\n\n$responseResult = null;\n$errorMsg = null;\n$signatureVerified = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action']) && $_POST['action'] === 'trigger_allowance') {\n    try {\n        $statusInput = isset($_POST['allowance_status']) ? (int)$_POST['allowance_status'] : 1;\n        $allowanceNoInput = isset($_POST['allowance_no']) ? trim($_POST['allowance_no']) : '';\n\n        if (empty($allowanceNoInput)) {\n            throw new Exception('Allowance number (AllowanceNo) is a required parameter.');\n        }\n\n        $postDataPlaintext = 'Version=1.0' .\n                             '&TimeStamp=' . time() .\n                             '&AllowanceStatus=' . $statusInput .\n                             '&AllowanceNo=' . $allowanceNoInput;\n\n        $encryptedPostData = encrypt_aes_b32($postDataPlaintext, API_KEY, API_IV);\n\n        $requestPayload = array(\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        );\n\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($requestPayload));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n        $responseStr = curl_exec($ch);\n\n        if ($responseStr === false) {\n            throw new Exception('Network request failed: ' . curl_error($ch));\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n        \n        if ($httpStatusCode !== 200) {\n            throw new Exception('Remote server returned non-200 HTTP response: ' . $httpStatusCode);\n        }\n\n        parse_str($responseStr, $parsedResponse);\n\n        $responseResult = array(\n            'Status'          => $parsedResponse['Status'] ?? 'UNKNOWN_ERROR',\n            'Message'         => $parsedResponse['Message'] ?? 'No message provided',\n            'MerchantID'      => $parsedResponse['MerchantID'] ?? null,\n            'InvoiceNumber'   => $parsedResponse['InvoiceNumber'] ?? null,\n            'AllowanceNo'     => $parsedResponse['AllowanceNo'] ?? null,\n            'MerchantOrderNo' => $parsedResponse['MerchantOrderNo'] ?? null,\n            'AllowanceAmt'    => $parsedResponse['AllowanceAmt'] ?? null,\n            'RemainAmt'       => $parsedResponse['RemainAmt'] ?? null,\n            'CheckCode'       => $parsedResponse['CheckCode'] ?? null,\n            'EndStr'          => $parsedResponse['EndStr'] ?? null\n        );\n\n        $endStrCheck = $responseResult['EndStr'] ?? '';\n        if (substr($endStrCheck, -2) !== '##' && $endStrCheck !== '##') {\n            throw new Exception('Response data stream corrupted or incomplete (missing termination marker).');\n        }\n\n        if ($responseResult['Status'] === 'SUCCESS') {\n            $origInvoiceTransNo = isset($_POST['orig_trans_no']) ? trim($_POST['orig_trans_no']) : '';\n            $origRandomNum = isset($_POST['orig_random_num']) ? trim($_POST['orig_random_num']) : '';\n            $origTotalAmt = isset($_POST['orig_total_amt']) ? trim($_POST['orig_total_amt']) : '';\n\n            if ($origInvoiceTransNo !== '' && $origRandomNum !== '' && $origTotalAmt !== '') {\n                $expectedCheckCode = verify_response_signature(\n                    API_IV,\n                    $origInvoiceTransNo,\n                    $responseResult['MerchantID'] ?? '',\n                    $responseResult['MerchantOrderNo'] ?? '',\n                    $origRandomNum,\n                    $origTotalAmt,\n                    API_KEY\n                );\n\n                $returnedCheckCode = $responseResult['CheckCode'] ?? '';\n\n                if (hash_equals(strtoupper($returnedCheckCode), strtoupper($expectedCheckCode))) {\n                    $signatureVerified = true;\n                } else {\n                    $signatureVerified = false;\n                }\n            }\n        }\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Allowance Trigger Integration Sandbox<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }\n        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n        h1 { font-size: 24px; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; color: #1a1a1a; }\n        h2 { font-size: 18px; margin-top: 20px; color: #444; }\n        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }\n        .form-group { display: flex; flex-direction: column; }\n        .form-group.full-width { grid-column: span 2; }\n        label { font-weight: 600; margin-bottom: 6px; font-size: 14px; }\n        input[type=\"text\"], select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background-color: #fafafa; }\n        input[type=\"text\"]:focus, select:focus { outline: none; border-color: #0066cc; background-color: #fff; }\n        .btn-submit { background-color: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }\n        .btn-submit:hover { background-color: #0052a3; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }\n        .alert-error { background-color: #fdd; border: 1px solid #fcc; color: #900; }\n        .alert-success { background-color: #dfd; border: 1px solid #cfc; color: #060; }\n        .alert-warning { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }\n        .result-panel { background: #f1f3f5; border: 1px solid #e9ecef; border-radius: 4px; padding: 20px; margin-top: 25px; }\n        table { width: 100%; border-collapse: collapse; margin-top: 10px; }\n        table th, table td { text-align: left; padding: 10px; border-bottom: 1px solid #dee2e6; font-size: 14px; }\n        table th { background-color: #e9ecef; font-weight: 600; width: 35%; }\n        .code-box { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 4px; overflow-x: auto; font-family: \"Courier New\", Courier, monospace; font-size: 13px; line-height: 1.4; margin-top: 10px; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Allowance Trigger API Sandbox (POST)<\/h1>\n\n    <?php if ($errorMsg !== null): ?>\n        <div class=\"alert alert-error\">\n            <strong>System Error:<\/strong> <?php echo htmlspecialchars($errorMsg); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form method=\"POST\" action=\"\">\n        <input type=\"hidden\" name=\"action\" value=\"trigger_allowance\">\n        \n        <h2>1. API Request Parameters<\/h2>\n        <div class=\"form-grid\">\n            <div class=\"form-group\">\n                <label for=\"allowance_no\">Allowance ID (折讓流水號) <span style=\"color:red;\">*<\/span><\/label>\n                <input type=\"text\" id=\"allowance_no\" name=\"allowance_no\" required value=\"<?php echo htmlspecialchars($_POST['allowance_no'] ?? ''); ?>\" placeholder=\"e.g. 586\">\n            <\/div>\n            \n            <div class=\"form-group\">\n                <label for=\"allowance_status\">Action Status (觸發折讓狀態) <span style=\"color:red;\">*<\/sp        <div class=\"result-panel\">\n            <h2>API Response Results<\/h2>\n\n            <?php if ($responseResult['Status'] === 'SUCCESS'): ?>\n                <div class=\"alert alert-success\">\n                    <strong>Success:<\/strong> Allowance process triggered successfully.\n                <\/div>\n            <?php else: ?>\n                <div class=\"alert alert-error\">\n                    <strong>API Exception:<\/strong> Status returned: <?php echo htmlspecialchars($responseResult['Status']); ?>\n                <\/div>\n            <?php endif; ?>\n\n            <?php if ($signatureVerified === true): ?>\n                <div class=\"alert alert-success\" style=\"margin-top: 10px;\">\n                    <strong>Signature Verified:<\/strong> The returned <code>CheckCode<\/code> hash is correct and safe to trust.\n                <\/div>\n            <?php elseif ($signatureVerified === false): ?>\n                <div class=\"alert alert-error\" style=\"margin-top: 10px;\">\n                    <strong>Signature Error:<\/strong> Calculated response signature mismatch. Check matching original state parameters.\n                <\/div>\n            <?php elseif ($responseResult['Status'] === 'SUCCESS'): ?>\n                <div class=\"alert alert-warning\" style=\"margin-top: 10px;\">\n                    <strong>Verification Skipped:<\/strong> Original parameters were omitted. Signature could not be verified.\n                <\/div>\n            <?php endif; ?>\n\n            <table>\n                <tr>\n                    <th>Response Key<\/th>\n                    <th>Value<\/th>\n                <\/tr>\n                <tr>\n                    <td>Status (狀態)<\/td>\n                    <td><strong><?php echo htmlspecialchars($responseResult['Status'] ?? 'N/A'); ?><\/strong><\/td>\n                <\/tr>\n                <tr>\n                    <td>Message (說明)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['Message'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>MerchantID (旅行社代號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['MerchantID'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>InvoiceNumber (收據號碼)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['InvoiceNumber'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>AllowanceNo (折讓流水號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['AllowanceNo'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>MerchantOrderNo (自訂編號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['MerchantOrderNo'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>AllowanceAmt (折讓金額)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['AllowanceAmt'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>RemainAmt (折讓後剩餘收據金額)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['RemainAmt'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>CheckCode (回應安全檢查碼)<\/td>\n                    <td style=\"word-break: break-all; font-family: monospace; font-size: 12px;\"><?php echo htmlspecialchars($responseResult['CheckCode'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>EndStr (結束判定字元)<\/td>\n                    <td><code><?php echo htmlspecialchars($responseResult['EndStr'] ?? 'N/A'); ?><\/code><\/td>\n                <\/tr>\n            <\/table>\n\n            <h2>Raw Server Response String<\/h2>\n            <div class=\"code-box\"><?php echo htmlspecialchars($responseStr); ?><\/div>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {

                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);

                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
