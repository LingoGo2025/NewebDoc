"icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"作業規範","desc":"<p>1.已確認的折讓資料無法再一次確認<\/p><p>2.取消待確認折讓資料沒有期限問題<\/p><p><span style=\"color: rgb(0, 0, 0);\">3.當開立等待折讓後，開立的折讓資料，僅記錄於平台且未生效，也未上傳至「財政 部電子發票整合服務平台」，待營業人與買受人確認後再執行確認折讓，確認後屆 當期上傳排程日(每單月一日)，平台將會把折讓資料上傳至「財政部電子發票整合 服務平台」。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.當開立等待折讓單後，若因故需取消等待折讓，營業人可執行取消，此時平台將該 筆等待折讓狀態變更為取消。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>折讓單：每一次折讓收據，都會有一筆獨立的折讓記錄，稱之為折讓單或是折讓資料<\/p><p>等待折讓：等待消費者同意折讓前，收據仍是有效狀態，此時的折讓單稱為等待折讓<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立折讓流程－等待折讓"}]},"apis":[{"name":"觸發或取消待確認折讓資料API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required" ed string format","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rule Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the merchant to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters according to the <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding Mode: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hex<\/span><br>Key / IV: Please use the Hash Key and Hash IV belonging to the merchant.","enc_step3_title":"Convert to Hex","enc_step3_desc":"Convert the encrypted binary data (Raw Data) to a Hex String (lowercase) to obtain the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a checksum via SHA256 hashing, which can be used to verify the integrity of request parameters or returned values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort the specified parameters by name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Append HashIV at the beginning and HashKey at the end of the sorted string.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Convert to Uppercase","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to <strong>uppercase<\/strong>.","res_title":"Res ctively by the system to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant in an asynchronous manner.","msg_res_info_sync":"This result will be returned synchronously by the system via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification and Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data after receiving.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After clicking the encode button, the full string actually being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_1.png"},"meta":{"title":"Trigger or Cancel Allowance Data API","subtitle":"Trigger or Cancel Allowance Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p>Manage allowance data pending confirmation, such as confirming allowance data directly or cancelling this pending allowance data<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send allowance receipt data to the electronic receipt platform via HTTP POST. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is characters. Chinese, English, numbers, and symbols are all counted as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected by \"&amp;\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Operational Specifications","desc":"<p>1. Confirmed allowance data cannot be re-confirmed.<\/p><p>2. There is no time limit for cancelling pending allowance data.<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. After issuing a pending allowance, the allowance data is recorded on the platform but not yet effective, and has not been uploaded to the \"Ministry of Finance Electronic Invoice Integration Service Platform\". After the business owner and the buyer confirm it, then execute the confirm allowance action. After confirmation, the platform will upload the allowance data to the \"Ministry of Finance Electronic Invoice Integration Service Platform\" on the scheduled upload date of the current period (the first day of every odd month). <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. After issuing a pending allowance note, if it needs to be cancelled for any reason, the business owner can execute the cancellation, and the platform will change the status of that pending allowance to cancelled.<\/span><\/p>"},{"id":"section-3","title":"Terminology Definition","desc":"<p>Allowance Note: For every allowance receipt, there is an independent allowance record, which is called an allowance note or allowance data.<\/p><p>Pending Allowance: Before the consumer agrees to the allowance, the receipt is still in a valid state; at this time, the allowance note is called pending allowance.<\/p>"},{"id":"section-4","title":"Pre-integration Tasks","desc":"<p>(Please complete this first, otherwise the program will definitely fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 sets of IPs can be set<\/p><p>- Required: Server external IP (not internal network IP, can be checked via https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different devices, data is not shared. Please ensure that the integration URL has been switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common error signals for \"forgetting to do pre-integration tasks\"<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Cannot obtain travel agency unified business number data` → MerchantID wrong or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Allowance Issuance Process - Pending Allowance"}]},"apis":[{"name":"Trigger or Cancel Allowance Data API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Unified Business Number","example":"54352706","must_return":false,"note":"Travel agency's unified business number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"After combining string fields, perform AES256 encryption. The field description is shown in the table below","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields contained in PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Program Version","example":"1.0","must_return":false,"note":"Fixed to 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., the number of seconds from 1970-01-01 00:00:00 UTC to now\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to bring in the current time","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"Trigger Allowance Status","example":"1","must_return":false,"note":"1 = Confirm Allowance.\n2 = Cancel Allowance.","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"Allowance Serial Number","example":"586","must_return":false,"note":"The allowance serial number responded by the system when the allowance was issued.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If triggering or cancelling is successful, return SUCCESS\n2. If triggering or cancelling fails, return the error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text, status description of this return","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Code","example":"70565326","must_return":false,"note":"Travel agency's unified business number","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number of this cancelled receipt or pending allowance receipt.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"Allowance Serial Number","example":"585","must_return":false,"note":"The allowance serial number responded by the system for this issuance or cancellation of allowance.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Order Number","example":"Or_5521142","must_return":false,"note":"The custom number provided for the receipt of this allowance issuance when the receipt was issued.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"Allowance Amount","example":"400","must_return":false,"note":"The amount of this allowance issuance","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"Remaining Receipt Amount After Allowance","example":"600","must_return":false,"note":"The remaining receipt amount of this receipt after confirming the allowance.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Used to check the legitimacy of this data return. When integrating, you can compare this parameter data to check if it was returned by the platform. For the verification method, please refer to \"SHA256 Encryption Description\". If the issuance fails, a null value is returned.\n\nCheckCode = The hash value obtained by calculating InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to the SHA256 signature specification\n\nInvoiceTransNo, RandomNum, TotalAmt are not included in this API response field. The program needs to save the InvoiceTransNo, RandomNum, TotalAmt returned when the receipt was issued for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must judge EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page stayed for more than 30 minutes"},{"code":"KEY10009","reason":"Cannot obtain travel agency unified business number data"},{"code":"KEY10010","reason":"Travel agency unified business number is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O time out"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection exception"},{"code":"ALW10002","reason":"The total allowance amount for this receipt number exceeds the issued amount"},{"code":"ALW10003","reason":"Allowance issuance failed"},{"code":"ALW10004","reason":"Trigger allowance status failed"},{"code":"ALW10005","reason":"Allowance already confirmed, cannot execute cancellation"},{"code":"ALW10006","reason":"Total allowance product name exceeds 280 characters"},{"code":"ALW10007","reason":"Allowance product name exceeds 7 products"},{"code":"ALW10008","reason":"Allowance product quantity is not purely numeric"},{"code":"ALW10009","reason":"Allowance product unit length exceeds 2 characters"},{"code":"ALW10010","reason":"Allowance product unit price exceeds 8 digits or is not purely numeric"},{"code":"ALW10011","reason":"Allowance product subtotal exceeds 8 digits or is not purely numeric"},{"code":"ALW10012","reason":"Total allowance amount exceeds 8 digits or is not purely numeric"},{"code":"ALW10013","reason":"Calculation error in product subtotal for product information"},{"code":"ALW10014","reason":"Receipt amount verification error"},{"code":"ALW10015","reason":"Trigger allowance status error"},{"code":"ALW10016","reason":"Confirm allowance method error"},{"code":"ALW10017","reason":"Allowance note number error"}],"versions":[]},

font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信してください。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムより非同期形式にて、商店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLへ自動的にプッシュされます。","msg_res_info_sync":"この結果はシステムより <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式にて <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返信されます。","msg_res_format_qs":"返信されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置されます。","msg_res_format_other":"返信されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行ってください。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、実際に暗号化される完全な文字列がここに表示されます...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_2.png"},"meta":{"title":"待確認値引きデータのトリガーまたはキャンセルAPI","subtitle":"値引きデータのトリガーまたはキャンセル","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p>待確認の値引きデータを管理します。値引きデータの直接確定、または待確認値引きデータのキャンセルを行うことができます<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で値引き領収書データを電子領収書プラットフォームに送信して処理します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中、英、数字、記号はすべて1文字とみなされます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"作業規定","desc":"<p>1.確認済みの値引きデータは再確認できません<\/p><p>2.待確認値引きデータのキャンセルには期限はありません<\/p><p><span style=\"color: rgb(0, 0, 0);\">3.「値引き待ち」の状態で発行された値引きデータは、プラットフォームに記録されるのみで有効化されず、「財政部電子インボイス統合サービスプラットフォーム」にもアップロードされません。営業者と購入者が確認した後に値引き確認を実行すると、次回のアップロード予定日（毎月奇数月の1日）にプラットフォームが「財政部電子インボイス統合サービスプラットフォーム」へ値をアップロードします。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.「値引き待ち」の発行後、何らかの理由でキャンセルが必要な場合、営業者はキャンセルを実行できます。この時点で、プラットフォームは当該の「値引き待ち」状態を「キャンセル」に変更します。<\/span><\/p>"},{"id":"section-3","title":"用語定義","desc":"<p>値引き書：値引き領収書ごとに独立した値引き記録があり、これを値引き書または値引きデータと呼びます<\/p><p>値引き待ち：消費者が値引きに同意する前の、領収書が有効な状態。この時点での値引き書を値引き待ちと呼びます<\/p>"},{"id":"section-4","title":"接続前の作業","desc":"<p>（必ず完了してください。さもないとプログラムは失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIVの取得<\/p><p>- テスト環境：テスト管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番管理画面にログイン → 基本データ → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請書をダウンロードして記入後、カスタマーセンターへ送信（FAX / Email）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 必要事項：サーバーの外部IP（内部IP不可、https://ifconfig.me で確認可能）<\/p><p>- 有効化時間：通常1～2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。本番環境へ移行する前に、必ず接続URLを本番用URLに切り替えてください<\/p><p><br><\/p><p>4. よくある「前置作業忘れ」のエラー信号<\/p><p>- `KEY10001 旅行会社のAPI接続IPではありません` → IPホワイトリスト未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIVが不正、またはサンプル値のまま<\/p><p>- `KEY10009 旅行会社の統一発票番号のデータが見つかりません` → MerchantIDが間違い、または未有効化<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"値引き発行フロー－値引き待ち"}]},"apis":[{"name":"待確認値引きデータのトリガーまたはキャンセルAPI","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Postパラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一発票番号","example":"54352706","must_return":false,"note":"旅行会社の統一発票番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後にAES256で暗号化。フィールド詳細は以下の表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_内包フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"固定で1.0を送信","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTCからの経過秒数。\n例：2014-05-15 15:00:00 の場合、スタンプは 1400137200。現在の時刻を入力することを推奨します","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"値引きステータス","example":"1","must_return":false,"note":"1 = 値引き確定。\n2 = 値引きキャンセル。","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"値引き通し番号","example":"586","must_return":false,"note":"値引き発行時にシステムが応答した値引き通し番号。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返信ステータス","example":"SUCCESS","must_return":true,"note":"1.トリガーまたはキャンセル成功時は SUCCESS を返信\n2.トリガーまたはキャンセル失敗時はエラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返信メッセージ","example":"成功","must_return":true,"note":"文字列、今回の返信ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"70565326","must_return":false,"note":"旅行会社統一発票番号","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回廃棄、または値引き待ちとなった領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"値引き通し番号","example":"585","must_return":false,"note":"今回発行またはキャンセルした、システムが応答した値引き通し番号。","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"独自番号","example":"Or_5521142","must_return":false,"note":"今回の値引き領収書発行時に提供された独自番号。","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"値引き金額","example":"400","must_return":false,"note":"今回の値引き発行金額","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"値引き後の残領収書金額","example":"600","must_return":false,"note":"値引き確定後の、領収書の残高。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"今回のデータ返信の妥当性をチェックするために使用します。接続時にこのパラメータを比較して、プラットフォームからの返信であることを確認してください。確認方法は「SHA256暗号化説明」を参照してください。発行失敗時は空値が返されます。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名仕様に基づいて計算したハッシュ値\n\nInvoiceTransNo, RandomNum, TotalAmt は本APIのレスポンスフィールドには含まれません。領収書発行時に返された InvoiceTransNo, RandomNum, TotalAmt をプログラム側で保持し、後の CheckCode 検証に使用してください。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定で ## を返信。String形式でデータを受信するユーザーは、EndStr=## を判定してデータの完全性を確保する必要があります。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社のAPI接続IPではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行会社が電子領収書の利用申請を行っていません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超過しました"},{"code":"KEY10009","reason":"旅行会社の統一発票番号のデータが見つかりません"},{"code":"KEY10010","reason":"旅行会社統一発票番号が空です"},{"code":"KEY10011","reason":"PostData_フィールドが空です"},{"code":"KEY10012","reason":"データ送信エラー"},{"code":"KEY10013","reason":"データが空です"},{"code":"KEY10014","reason":"TimeOut。通常はI/Oのタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額形式エラー"},{"code":"KEY10019","reason":"旅行会社が利用停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"ALW10002","reason":"当該領収書番号の値引き合計額が発行可能額を超過しています"},{"code":"ALW10003","reason":"値引き発行失敗"},{"code":"ALW10004","reason":"値引きステータス更新失敗"},{"code":"ALW10005","reason":"値引き確定済みのため、キャンセルを実行できません"},{"code":"ALW10006","reason":"値引き商品名の合計が280文字を超過しています"},{"code":"ALW10007","reason":"値引き商品数が7個を超過しています"},{"code":"ALW10008","reason":"値引き商品数量が純粋な数字ではありません"},{"code":"ALW10009","reason":"値引き商品単位が2文字を超過しています"},{"code":"ALW10010","reason":"値引き商品単価が8桁超過または純粋な数字ではありません"},{"code":"ALW10011","reason":"値引き商品小計が8桁超過または純粋な数字ではありません"},{"code":"ALW10012","reason":"値引き総額が8桁超過または純粋な数字ではありません"},{"code":"ALW10013","reason":"商品情報の商品小計計算エラー"},{"code":"ALW10014","reason":"領収書金額検証エラー"},{"code":"ALW10015","reason":"値引きステータス更新エラー"},{"code":"ALW10016","reason":"値引き確定方式エラー"},{"code":"ALW10017","reason":"値引き通し番号エラー"}],"versions":[]},

/code> 형식으로 조합합니다 (key=value&key2=value2...).","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체 소유의 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 바이너리 데이터(Raw Data)를 Hex String(소문자)으로 변환하면 암호화된 문자열이 됩니다.","enc_sha_title":"SHA256 체크섬 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 체크섬을 생성하며, 요청 파라미터나 반환 값의 무결성을 검증하는 데 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름순(A-Z)으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드 표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 코드 예제 없음","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"흐름도","lbl_launch_type":"실행 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전송 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점 측에서 실행해야 하며, <span class=\"font-bold text-blue-700\">{method}<\/span> 방식을 사용하여 파라미터를 패키징한 후 <span class=\"font-bold text-blue-700\">{location}<\/span>을(를) 통해 전송하십시오.","msg_req_format_qs":"이 영역의 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 조합하여 Query String 형식으로 만들어야 합니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 영역의 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체에 넣어 전달해야 합니다.","msg_req_format_other":"이 영역의 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식을 사용하여 조합합니다.","msg_req_security":"데이터 보안: 전송 전 <span class=\"font-bold\">{group_type}<\/span> 처리를 완료해야 합니다.","msg_res_info_webhook":"본 결과는 시스템이 비동기 방식으로 상점이 지정한 <span class=\"font-bold text-green-700\">Webhook<\/span> 수신 주소로 주도적으로 푸시합니다.","msg_res_info_sync":"본 결과는 시스템이 <span class=\"font-bold text-green-700\">{method}<\/span> 방식을 통해 <span class=\"font-bold text-green-700\">{location}<\/span>에서 동기식으로 반환합니다.","msg_res_format_qs":"반환된 필드는 <span class=\"font-mono font-bold text-cyan-700\">&amp;<\/span> 기호로 조합되어 Query String 형식으로 제공됩니다. 예: <span class=\"font-mono text-cyan-700\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환된 필드는 <span class=\"font-bold text-cyan-700\">JSON<\/span> 객체에 넣어 전달됩니다.","msg_res_format_other":"반환된 필드는 <span class=\"font-bold text-cyan-700\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\"font-bold\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 여기에 실제로 암호화되는 전체 문자열이 표시됩니다...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_3.png"},"meta":{"title":"대기 중인 에누리 데이터 트리거 또는 취소 API","subtitle":"에누리 데이터 트리거 또는 취소","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p>확인 대기 중인 에누리 데이터를 관리하며, 에누리 데이터를 직접 확인하거나 대기 중인 에누리 데이터를 취소할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식을 사용하여 에누리 영수증 데이터를 전자 영수증 플랫폼으로 전송합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 중문, 영문, 숫자, 기호는 모두 1문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 필드 내용 내에는 이 기호(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"운영 규정","desc":"<p>1. 이미 확인된 에누리 데이터는 다시 확인할 수 없습니다.<\/p><p>2. 대기 중인 에누리 데이터 취소에는 기한 제한이 없습니다.<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 에누리 대기 상태로 발행된 에누리 데이터는 플랫폼에만 기록되며, 아직 효력이 발생하지 않았고 '재정부 전자세금계산서 통합 서비스 플랫폼'으로 전송되지 않습니다. 영업자와 구매자가 확인한 후 에누리 확인을 실행하면, 확인 후 해당 당기 전송 일정일(매 홀수 달 1일)에 플랫폼이 에누리 데이터를 '재정부 전자세금계산서 통합 서비스 플랫폼'으로 업로드합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 에누리 대기 전표 발행 후, 부득이한 사유로 대기 상태를 취소해야 할 경우 영업자가 취소를 실행할 수 있으며, 이때 플랫폼은 해당 에누리 대기 상태를 취소로 변경합니다.<\/span><\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>에누리 전표: 모든 에누리 영수증마다 독립적인 에누리 기록이 생성되며, 이를 에누리 전표 또는 에누리 데이터라고 합니다.<\/p><p>에누리 대기: 소비자가 에누리에 동의하기 전까지 영수증은 유효 상태이며, 이때의 에누리 전표를 에누리 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 사전 작업","desc":"<p>（진행하지 않을 경우 프로그램이 실패합니다）<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 영역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 영역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청서를 다운로드 및 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필수 제출: 서버 외부 IP (내부망 IP 불가, https://ifconfig.me 에서 확인 가능)<\/p><p>- 효력 발생 시간: 일반적으로 영업일 기준 1-2일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 서비스 오픈 전 반드시 연동 URL이 운영 환경 URL로 설정되어 있는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 '사전 작업 누락' 오류 메시지<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 샘플 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터 획득 실패` → MerchantID가 잘못되었거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"에누리 발행 절차 - 에누리 대기"}]},"apis":[{"name":"대기 중인 에누리 데이터 트리거 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.travelinvoice.com.tw/allowance_touch_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드를 조합한 후 AES256 암호화 처리, 필드 설명은 아래 표 참고","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"고정값 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 넣는 것을 권장합니다.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceStatus","required":"V","type":"int(1)","label":"에누리 트리거 상태","example":"1","must_return":false,"note":"1 = 에누리 확인.\n2 = 에누리 취소.","enum_values":"1,2","default_value":"","nullable":false},{"name":"AllowanceNo","required":"V","type":"string(20)","label":"에누리 일련번호","example":"586","must_return":false,"note":"에누리 발행 시 시스템이 응답한 에누리 일련번호입니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1.트리거 또는 취소 성공 시 SUCCESS 반환\n2.트리거 또는 취소 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"70565326","must_return":false,"note":"여행사 사업자 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 취소된 영수증 또는 에누리 대기 중인 영수증 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceNo","required":"","type":"string(20)","label":"에누리 일련번호","example":"585","must_return":false,"note":"이번 에누리 발행 또는 취소 시 시스템이 응답한 에누리 일련번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"사용자 정의 번호","example":"Or_5521142","must_return":false,"note":"이번 에누리 발행 영수증에 대해, 영수증 발행 시 제공한 사용자 정의 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"AllowanceAmt","required":"","type":"int(10)","label":"에누리 금액","example":"400","must_return":false,"note":"이번에 발행된 에누리 금액","enum_values":"","default_value":"","nullable":false},{"name":"RemainAmt","required":"","type":"int(8)","label":"에누리 후 잔여 영수증 금액","example":"600","must_return":false,"note":"에누리 확인 후 해당 영수증의 잔여 금액입니다.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크 코드","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"이번 데이터 반환의 합법성을 검사하는 데 사용되며, 연동 시 이 파라미터 값을 비교하여 플랫폼에서 반환된 데이터인지 검사할 수 있습니다. 검사 방법은 'SHA256 암호화 설명'을 참고하십시오. 발행 실패 시 빈 값이 반환됩니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\nInvoiceTransNo, RandomNum, TotalAmt는 본 API 응답 필드에 포함되지 않으므로, 영수증 발행 시 반환된 InvoiceTransNo, RandomNum, TotalAmt를 프로그램에서 직접 보관하여 추후 CheckCode 검증에 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"고정적으로 ##를 반환하며, String 방식으로 데이터를 수신하는 사용자는 반드시 EndStr=##를 추가로 판단하여 데이터 전송이 완전한지 확인해야 합니다.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP가 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사가 전자 영수증 사용을 신청하지 않음"},{"code":"KEY10007","reason":"페이지 체류 시간 30분 초과"},{"code":"KEY10009","reason":"여행사 사업자 번호 데이터 획득 실패"},{"code":"KEY10010","reason":"여행사 사업자 번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10019","reason":"여행사 권한 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"ALW10002","reason":"해당 영수증 번호의 에누리 총액이 발행 금액을 초과함"},{"code":"ALW10003","reason":"에누리 발행 실패"},{"code":"ALW10004","reason":"에누리 트리거 상태 실패"},{"code":"ALW10005","reason":"이미 확인된 에누리, 에누리 취소 실행 불가"},{"code":"ALW10006","reason":"에누리 상품명 합계가 280자를 초과함"},{"code":"ALW10007","reason":"에누리 상품이 7개를 초과함"},{"code":"ALW10008","reason":"에누리 상품 수량이 숫자가 아님"},{"code":"ALW10009","reason":"에누리 상품 단위가 2자를 초과함"},{"code":"ALW10010","reason":"에누리 상품 단가가 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10011","reason":"에누리 상품 소계가 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10012","reason":"에누리 총액이 8자리를 초과하거나 숫자가 아님"},{"code":"ALW10013","reason":"상품 정보의 상품 소계 계산 오류"},{"code":"ALW10014","reason":"영수증 금액 검증 오류"},{"code":"ALW10015","reason":"에누리 트리거 상태 오류"},{"code":"ALW10016", n class=\\\"font-bold text-cyan-700\\\">{format}<\/span>-format.","msg_req_security":"Datasäkerhet: <span class=\\\"font-bold\\\">{group_type}<\/span>-behandling krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att pushas asynkront av systemet till den <span class=\\\"font-bold text-green-700\\\">Webhook<\/span>-mottagningsadress som angetts av butiken.","msg_res_info_sync":"Detta resultat kommer att returneras synkront av systemet via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> till <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"Returnerade fält kommer att kombineras till ett Query String-format med <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>-tecknet, till exempel <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returnerade fält kommer att placeras i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt för överföring.","msg_res_format_other":"Returnerade fält använder <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>-format.","msg_res_security":"Verifiering och dekryptering: Efter mottagande krävs <span class=\\\"font-bold\\\">{group_type}<\/span>-behandling för specifik data.","lbl_sha_pre_hash":"Kombinerad sträng före kryptering (String to Hash)","ph_sha_pre_hash":"Efter att ha tryckt på hash-knappen visas den fullständiga strängen som faktiskt krypteras här...","flowchart_0_url":"assets/flowcharts_trigger-cancel-pending-allowance-api/fc_4.png"},"meta":{"title":"API för att trigga eller avbryta väntande kreditnotadata","subtitle":"Trigga eller avbryta kreditnotadata","version":"","sections":[{"id":"section-0","title":"Syfte med integration","desc":"<p>Hantera väntande kreditnotadata, såsom att direkt bekräfta kreditnotadata eller avbryta denna väntande kreditnota<\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kreditnotakvittodata till plattformen för elektroniska kvitton via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen för elektroniska kvitton svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. \"&\" används som separator mellan fält, och inget fält får innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Driftspecifikationer","desc":"<p>1. Redan bekräftad kreditnotadata kan inte bekräftas igen<\/p><p>2. Det finns ingen tidsbegränsning för att avbryta väntande kreditnotadata<\/p><p><span style=\"color: rgb(0, 0, 0);\">3. När en väntande kreditnota skapas, registreras kreditnotadatan endast på plattformen och är ännu inte aktiverad eller uppladdad till \"Finansdepartementets integrerade tjänsteplattform för elektroniska fakturor\". Efter att näringsidkaren och köparen bekräftat den, utförs bekräftelsen. Efter bekräftelse, på schemalagt uppladdningsdatum för den aktuella perioden (den första dagen i varje udda månad), kommer plattformen att ladda upp kreditnotadatan till \"Finansdepartementets integrerade tjänsteplattform för elektroniska fakturor\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Om en väntande kreditnota behöver avbrytas av någon anledning efter att den skapats, kan näringsidkaren utföra en avbokning. Då ändrar plattformen status för den väntande kreditnotan till avbruten.<\/span><\/p>"},{"id":"section-3","title":"Definitioner av termer","desc":"<p>Kreditnota: Varje kreditnotakvitto har en oberoende kreditnotapost, kallad kreditnota eller kreditnotadata<\/p><p>Väntande kreditnota: Innan konsumenten godkänner kreditnotan är kvittot fortfarande i giltigt status. Vid denna tidpunkt kallas kreditnotan för väntande kreditnota<\/p>"},{"id":"section-4","title":"Förberedelser för integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Erhåll HashKey / HashIV<\/p><p>- Testmiljö: Logga in i testmiljöns administratörspanel → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i produktionsmiljöns administratörspanel → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Behöver tillhandahålla: Serverns externa IP (inte internt nätverks-IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Normalt 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöns URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika enheter, data delas inte. Innan driftsättning måste du se till att integrations-URL:en har växlats till produktionsmiljöns URL<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en resebyrås API-integrations-IP` → IP-vitlistning har inte ställts in eller är felaktig<\/p><p>- `KEY10002 Fel vid datadekryptering` → HashKey / HashIV är inte korrekta eller är fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta resebyråns skattenummer (Uniform Business Number)` → MerchantID är felaktigt eller inte aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för utfärdande av kreditnota - Väntande kreditnota"}]},"apis":[{"name":"API för att trigga eller avbryta väntande kreditnotadata","url_test":"https://capi.travelinvoice.com.tw/allowance_touch_issue","url_prod":"https://api.t le":"600","must_return":false,"note":"Det återstående kvittobeloppet efter att kreditnotan bekräftats.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Används för att kontrollera att denna dataretur är legitim. Vid integration kan du jämföra detta parameterdata för att verifiera att det returnerats av plattformen. Metoden för kontroll finns i \"SHA256-krypteringsbeskrivningen\". Om utfärdandet misslyckades returneras ett tomt värde.\n\nCheckCode = Hashvärde beräknat genom SHA256-signaturspecifikationer baserat på InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nInvoiceTransNo, RandomNum, TotalAmt ingår inte i detta API-svarsfält. Programmet måste spara InvoiceTransNo, RandomNum och TotalAmt som returnerades när kvittot utfärdades för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängavslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data via Sträng-format måste kontrollera om EndStr=## för att säkerställa att dataöverföringen är komplett.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en resebyrås API-integrations-IP"},{"code":"KEY10002","reason":"Fel vid datadekryptering"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständig data"},{"code":"KEY10006","reason":"Resebyrån har inte ansökt om aktivering av elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta resebyråns skattenummer (UBN)"},{"code":"KEY10010","reason":"Resebyråns skattenummer (UBN) är tomt"},{"code":"KEY10011","reason":"PostData_-fältet är tomt"},{"code":"KEY1001         const globalCodeExamples = {"PHP":"<?php\n/*\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use.\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected.\n */\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature verification\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\ndefine('API_KEY', 'YOUR_AES_KEY_AND_HASH_KEY_HERE');\ndefine('API_IV', 'YOUR_AES_IV_AND_HASH_IV_HERE');\ndefine('API_URL', 'https://capi.travelinvoice.com.tw/allowance_touch_issue');\n\n// Verification gate to prevent execution with default placeholder credentials\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_AES_KEY_AND_HASH_KEY_HERE' || API_IV === 'YOUR_AES_IV_AND_HASH_IV_HERE') {\n    echo '<div style=\"color: #a94442; background-color: #f2dede; border: 1px solid #ebccd1; padding: 15px; margin: 20px; font-family: sans-serif; border-radius: 4px;\">';\n    echo '<strong>Configuration Error:<\/strong> Please replace the placeholder API credentials (<code>MERCHANT_ID<\/code>, <code>API_KEY<\/code>, <code>API_IV<\/code>) with your actual travel invoice API credentials before proceeding.';\n    echo '<\/div>';\n    exit;\n}\n\n/* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n * Each padding byte value equals paddingLen.\n * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n * to prevent the library from applying its own PKCS7 padding. */\nfunction encrypt_aes_b32($plaintext, $key, $iv) {\n    $blockSize = 32;\n    $plaintextLen = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    // IV must always be 16 bytes because the native AES algorithm block size is fixed to 16 bytes\n    if (strlen($iv) !== 16) {\n        throw new Exception('Initialization Vector (IV) must be exactly 16 bytes.');\n    }\n    \n    if (strlen($key) !== 32) {\n        throw new Exception('Encryption key must be exactly 32 bytes for AES-256.');\n    }\n\n    $encrypted = openssl_encrypt($paddedPlaintext, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed: ' . openssl_error_string());\n    }\n\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Recreates the SHA-256 hash using properties returned in the API response\n * and matching original parameters preserved by the system.\n *\n * @param string $iv The HashIV value used in the transaction\n * @param string $invoiceTransNo Original invoice transaction number (preserved from creation)\n * @param string $merchantId The merchant ID associated with the response\n * @param string $merchantOrderNo The merchant order number returned in the response\n * @param string $randomNum Original invoice random number (preserved from creation)\n * @param string $totalAmt Original invoice total amount (preserved from creation)\n * @param string $key The HashKey value used in the transaction\n * @return string Calculated uppercase SHA256 signature\n */\nfunction verify_response_signature($iv, $invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $key) {\n    $rawString = 'HashIV=' . $iv .\n                 '&InvoiceTransNo=' . $invoiceTransNo .\n                 '&MerchantID=' . $merchantId .\n                 '&MerchantOrderNo=' . $merchantOrderNo .\n                 '&RandomNum=' . $randomNum .\n                 '&TotalAmt=' . $totalAmt .\n                 '&HashKey=' . $key;\n\n    return strtoupper(hash('sha256', $rawString));\n}\n\n$responseResult = null;\n$errorMsg = null;\n$signatureVerified = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action']) && $_POST['action'] === 'trigger_allowance') {\n    try {\n        $statusInput = isset($_POST['allowance_status']) ? (int)$_POST['allowance_status'] : 1;\n        $allowanceNoInput = isset($_POST['allowance_no']) ? trim($_POST['allowance_no']) : '';\n\n        if (empty($allowanceNoInput)) {\n            throw new Exception('Allowance number (AllowanceNo) is a required parameter.');\n        }\n\n        $postDataPlaintext = 'Version=1.0' .\n                             '&TimeStamp=' . time() .\n                             '&AllowanceStatus=' . $statusInput .\n                             '&AllowanceNo=' . $allowanceNoInput;\n\n        $encryptedPostData = encrypt_aes_b32($postDataPlaintext, API_KEY, API_IV);\n\n        $requestPayload = array(\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        );\n\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, API_URL);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($requestPayload));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n        $responseStr = curl_exec($ch);\n\n        if ($responseStr === false) {\n            throw new Exception('Network request failed: ' . curl_error($ch));\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n        \n        if ($httpStatusCode !== 200) {\n            throw new Exception('Remote server returned non-200 HTTP response: ' . $httpStatusCode);\n        }\n\n        parse_str($responseStr, $parsedResponse);\n\n        $responseResult = array(\n            'Status'          => $parsedResponse['Status'] ?? 'UNKNOWN_ERROR',\n            'Message'         => $parsedResponse['Message'] ?? 'No message provided',\n            'MerchantID'      => $parsedResponse['MerchantID'] ?? null,\n            'InvoiceNumber'   => $parsedResponse['InvoiceNumber'] ?? null,\n            'AllowanceNo'     => $parsedResponse['AllowanceNo'] ?? null,\n            'MerchantOrderNo' => $parsedResponse['MerchantOrderNo'] ?? null,\n            'AllowanceAmt'    => $parsedResponse['AllowanceAmt'] ?? null,\n            'RemainAmt'       => $parsedResponse['RemainAmt'] ?? null,\n            'CheckCode'       => $parsedResponse['CheckCode'] ?? null,\n            'EndStr'          => $parsedResponse['EndStr'] ?? null\n        );\n\n        $endStrCheck = $responseResult['EndStr'] ?? '';\n        if (substr($endStrCheck, -2) !== '##' && $endStrCheck !== '##') {\n            throw new Exception('Response data stream corrupted or incomplete (missing termination marker).');\n        }\n\n        if ($responseResult['Status'] === 'SUCCESS') {\n            $origInvoiceTransNo = isset($_POST['orig_trans_no']) ? trim($_POST['orig_trans_no']) : '';\n            $origRandomNum = isset($_POST['orig_random_num']) ? trim($_POST['orig_random_num']) : '';\n            $origTotalAmt = isset($_POST['orig_total_amt']) ? trim($_POST['orig_total_amt']) : '';\n\n            if ($origInvoiceTransNo !== '' && $origRandomNum !== '' && $origTotalAmt !== '') {\n                $expectedCheckCode = verify_response_signature(\n                    API_IV,\n                    $origInvoiceTransNo,\n                    $responseResult['MerchantID'] ?? '',\n                    $responseResult['MerchantOrderNo'] ?? '',\n                    $origRandomNum,\n                    $origTotalAmt,\n                    API_KEY\n                );\n\n                $returnedCheckCode = $responseResult['CheckCode'] ?? '';\n\n                if (hash_equals(strtoupper($returnedCheckCode), strtoupper($expectedCheckCode))) {\n                    $signatureVerified = true;\n                } else {\n                    $signatureVerified = false;\n                }\n            }\n        }\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Allowance Trigger Integration Sandbox<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }\n        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n        h1 { font-size: 24px; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; color: #1a1a1a; }\n        h2 { font-size: 18px; margin-top: 20px; color: #444; }\n        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }\n        .form-group { display: flex; flex-direction: column; }\n        .form-group.full-width { grid-column: span 2; }\n        label { font-weight: 600; margin-bottom: 6px; font-size: 14px; }\n        input[type=\"text\"], select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background-color: #fafafa; }\n        input[type=\"text\"]:focus, select:focus { outline: none; border-color: #0066cc; background-color: #fff; }\n        .btn-submit { background-color: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }\n        .btn-submit:hover { background-color: #0052a3; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }\n        .alert-error { background-color: #fdd; border: 1px solid #fcc; color: #900; }\n        .alert-success { background-color: #dfd; border: 1px solid #cfc; color: #060; }\n        .alert-warning { background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; }\n        .result-panel { background: #f1f3f5; border: 1px solid #e9ecef; border-radius: 4px; padding: 20px; margin-top: 25px; }\n        table { width: 100%; border-collapse: collapse; margin-top: 10px; }\n        table th, table td { text-align: left; padding: 10px; border-bottom: 1px solid #dee2e6; font-size: 14px; }\n        table th { background-color: #e9ecef; font-weight: 600; width: 35%; }\n        .code-box { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 4px; overflow-x: auto; font-family: \"Courier New\", Courier, monospace; font-size: 13px; line-height: 1.4; margin-top: 10px; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Allowance Trigger API Sandbox (POST)<\/h1>\n\n    <?php if ($errorMsg !== null): ?>\n        <div class=\"alert alert-error\">\n            <strong>System Error:<\/strong> <?php echo htmlspecialchars($errorMsg); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form method=\"POST\" action=\"\">\n        <input type=\"hidden\" name=\"action\" value=\"trigger_allowance\">\n        \n        <h2>1. API Request Parameters<\/h2>\n        <div class=\"form-grid\">\n            <div class=\"form-group\">\n                <label for=\"allowance_no\">Allowance ID (折讓流水號) <span style=\"color:red;\">*<\/span><\/label>\n                <input type=\"text\" id=\"allowance_no\" name=\"allowance_no\" required value=\"<?php echo htmlspecialchars($_POST['allowance_no'] ?? ''); ?>\" placeholder=\"e.g. 586\">\n            <\/div>\n            \n            <div class=\"form-group\">\n                <label for=\"allowance_status\">Action Status (觸發折讓狀態) <span style=\"color:red;\">*<\/span><\/label>\n                <select id=\"allowance_status\" name=\"allowance_status\">\n                    <option value=\"1\" <?php echo (($_POST['allowance_status'] ?? '1') === '1') ? 'selected' : ''; ?>>1 = Confirm Allowance<\/option>\n                    <option value=\"2\" <?php echo (($_POST['allowance_status'] ?? '') === '2') ? 'selected' : ''; ?>>2 = Cancel Allowance<\/option>\n                <\/select>\n            <\/div>\n        <\/div>\n\n        <h2>2. Original Invoice Parameters (For Signature Verification Checking)<\/h2>\n        <p style=\"font-size: 12px; margin-top: -10px; color: #666;\">These preserved values are required to calculate and crosscheck the <code>CheckCode<\/code> signature returned by the system response.<\/p>\n        \n        <div class=\"form-grid\">\n            <div class=\"form-group\">\n                <label for=\"orig_trans_no\">Original Invoice Trans No (收據開立流水號)<\/label>\n                <input type=\"text\" id=\"orig_trans_no\" name=\"orig_trans_no\" value=\"<?php echo htmlspecialchars($_POST['orig_trans_no'] ?? ''); ?>\" placeholder=\"e.g. TX1000234\">\n            <\/div>\n\n            <div class=\"form-group\">\n                <label for=\"orig_random_num\">Original Random Number (開立收據隨機碼)<\/label>\n                <input type=\"text\" id=\"orig_random_num\" name=\"orig_random_num\" value=\"<?php echo htmlspecialchars($_POST['orig_random_num'] ?? ''); ?>\" placeholder=\"e.g. 1234\">\n            <\/div>\n\n            <div class=\"form-group\">\n                <label for=\"orig_total_amt\">Original Total Amount (收據總金額)<\/label>\n                <input type=\"text\" id=\"orig_total_amt\" name=\"orig_total_amt\" value=\"<?php echo htmlspecialchars($_POST['orig_total_amt'] ?? ''); ?>\" placeholder=\"e.g. 1000\">\n            <\/div>\n        <\/div>\n\n        <button type=\"submit\" class=\"btn-submit\">Submit Request to Travel Invoice API<\/button>\n    <\/form>\n\n    <?php if ($responseResult !== null): ?>\n        <div class=\"result-panel\">\n            <h2>API Response Results<\/h2>\n\n            <?php if ($responseResult['Status'] === 'SUCCESS'): ?>\n                <div class=\"alert alert-success\">\n                    <strong>Success:<\/strong> Allowance process triggered successfully.\n                <\/div>\n            <?php else: ?>\n                <div class=\"alert alert-error\">\n                    <strong>API Exception:<\/strong> Status returned: <?php echo htmlspecialchars($responseResult['Status']); ?>\n                <\/div>\n            <?php endif; ?>\n\n            <?php if ($signatureVerified === true): ?>\n                <div class=\"alert alert-success\" style=\"margin-top: 10px;\">\n                    <strong>Signature Verified:<\/strong> The returned <code>CheckCode<\/code> hash is correct and safe to trust.\n                <\/div>\n            <?php elseif ($signatureVerified === false): ?>\n                <div class=\"alert alert-error\" style=\"margin-top: 10px;\">\n                    <strong>Signature Error:<\/strong> Calculated response signature mismatch. Check matching original state parameters.\n                <\/div>\n            <?php elseif ($responseResult['Status'] === 'SUCCESS'): ?>\n                <div class=\"alert alert-warning\" style=\"margin-top: 10px;\">\n                    <strong>Verification Skipped:<\/strong> Original parameters were omitted. Signature could not be verified.\n                <\/div>\n            <?php endif; ?>\n\n            <table>\n                <tr>\n                    <th>Response Key<\/th>\n                    <th>Value<\/th>\n                <\/tr>\n                <tr>\n                    <td>Status (狀態)<\/td>\n                    <td><strong><?php echo htmlspecialchars($responseResult['Status'] ?? 'N/A'); ?><\/strong><\/td>\n                <\/tr>\n                <tr>\n                    <td>Message (說明)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['Message'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>MerchantID (旅行社代號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['MerchantID'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>InvoiceNumber (收據號碼)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['InvoiceNumber'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>AllowanceNo (折讓流水號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['AllowanceNo'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>MerchantOrderNo (自訂編號)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['MerchantOrderNo'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>AllowanceAmt (折讓金額)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['AllowanceAmt'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>RemainAmt (折讓後剩餘收據金額)<\/td>\n                    <td><?php echo htmlspecialchars($responseResult['RemainAmt'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>CheckCode (回應安全檢查碼)<\/td>\n                    <td style=\"word-break: break-all; font-family: monospace; font-size: 12px;\"><?php echo htmlspecialchars($responseResult['CheckCode'] ?? 'N/A'); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>EndStr (結束判定字元)<\/td>\n                    <td><code><?php echo htmlspecialchars($responseResult['EndStr'] ?? 'N/A'); ?><\/code><\/td>\n                <\/tr>\n            <\/table>\n\n            <h2>Raw Server Response String<\/h2>\n            <div class=\"code-box\"><?php echo htmlspecialchars($responseStr); ?><\/div>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];
        
        // 在這裡讀取網址參數，若有 lang 參數且存在於設定檔中，則覆蓋預設語系
        const initialUrlParams = new URLSearchParams(window.location.search);
        if (initialUrlParams.has('lang') && docConfig[initialUrlParams.get('lang')]) {
            currentLang = initialUrlParams.get('lang');

        let currentCodeTab = 'php';
        
        // 全域搜尋狀態變數
        let searchMarks = [];
        let currentMarkIndex = -1;

        function getMsg(ui, key, defaultMsg, replacements) {
            var msg = ui[key] || defaultMsg;
            if (replacements) {
                for (var k in replacements) {
                    msg = msg.replace(new RegExp('\\{' + k + '\\}', 'g'), replacements[k]);

        }

        function renderAll() {
            renderMetaInfo();
            renderCustomSections();
            renderFlowcharts();

            renderEncryptionRules();

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

        function renderCustomSections() {
            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';
            
            // 清空容器，確保重新渲染時不會重複疊加
            if (navContainer) navContainer.innerHTML = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId = sec.id || ('custom-section-' + index);
                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';
                var sectionBody = '';
                if (sec.desc && sec.desc.trim() !== '') {
                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base whitespace-pre-line mb-6 last:mb-0">' + sec.desc + '</div>';
                }
                if (sec.images && sec.images.length > 0) {
                    sectionBody += '<div class="space-y-8">' + sec.images.map(function(url) {
                        return '<div class="border rounded-lg overflow-hidden cursor-pointer" onclick="openLightbox(\'' + url + '\')"><img src="' + url + '" class="w-full h-auto hover:opacity-90 transition-opacity"></div>';
                    }).join('') + '</div>';
                }
                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 ' + markerColor + ' mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + sec.title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200">' + sectionBody + '</div></section>';
            });

            if (navContainer) navContainer.innerHTML = navHtml;
            if (contentContainer) {
                contentContainer.innerHTML = contentHtml;
                
                var descImages = contentContainer.querySelectorAll('img');
                descImages.forEach(function(img) {
                    img.classList.add('cursor-pointer', 'hover:opacity-90', 'transition-opacity');
                    img.onclick = function() {
                        openLightbox(this.src);
                    };
                });
            }
        }

        function renderFlowcharts() {
            var meta = docConfig[currentLang].meta;
            var ui = docConfig[currentLang].ui;
            var flowcharts = meta.flowcharts || [];
            
            if (flowcharts.length === 0) return;

            var navContainer = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            
            var navHtml = '';
            var contentHtml = '';

            flowcharts.forEach(function(fc) {
                var sectionId = fc.id; 
                if (!sectionId) return;
                var title = fc.title || '流程圖';
                
                // 將 id 的中線轉換為底線，對應 ui 的 key (例如 flowchart-0 -> flowchart_0_url)
                var urlKey = sectionId.replace(/-/g, '_') + '_url'; 
                var imgUrl = ui[urlKey];

                if (!imgUrl) return; // 如果 ui 中沒有此網址則跳過

                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="fas fa-project-diagram w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + title + '</span></a>';

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 bg-indigo-500 mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200 overflow-x-auto text-center"><img src="' + imgUrl + '" alt="' + title + '" class="inline-block max-w-full h-auto cursor-pointer hover:opacity-90 transition-opacity" onclick="openLightbox(\'' + imgUrl + '\')"></div></section>';
            });

            // 以附加方式將流程圖區域加入現有容器，保留 renderCustomSections 所建立的內容

            if (contentContainer && contentHtml) contentContainer.insertAdjacentHTML('beforeend', contentHtml);
        }

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {

                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden');

        }

                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
