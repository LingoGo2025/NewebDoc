        let currentLang = Object.keys(docConfig)[0];
        let searchMarks = [];
        let currentMarkIndex = -1;

        const initialUrlParams = new URLSearchParams(window.location.search);
        if (initialUrlParams.has('lang')) {
            var reqLang = initialUrlParams.get('lang');
            currentLang = docConfig[reqLang] ? reqLang : 'en';
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderAll() {
            renderMetaInfo();
            renderCustomSections();
            initScrollSpy();
            var langMap = {'zh-TW':'zh-TW','en':'en','ja':'ja','ko':'ko','sv':'sv'};
            document.documentElement.lang = langMap[currentLang] || 'zh-TW';
        }

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function renderMetaInfo() {
            var meta = docConfig[currentLang].meta;
            var ui   = docConfig[currentLang].ui;
            document.getElementById('head-title').textContent           = ui.head_title || meta.title;
            document.getElementById('mobile-header-title').textContent  = ui.head_title || meta.title;
            document.getElementById('sidebar-brand-title').textContent  = ui.sidebar_brand || meta.title;
            document.getElementById('sidebar-subtitle').textContent     = meta.title;
            document.getElementById('sidebar-version').textContent      = meta.version;
            var sysNameEl = document.getElementById('meta-system-name');
            var copyEl    = document.getElementById('meta-copyright');
            if (sysNameEl) sysNameEl.textContent = ui.system_name || '';
            if (copyEl)    copyEl.textContent    = ui.copyright   || '';
        }

        function renderCustomSections() {
            var navContainer     = document.getElementById('dynamic-sidebar-links');
            var contentContainer = document.getElementById('dynamic-content-sections');
            var sections         = docConfig[currentLang].meta.sections || [];
            var navHtml = '', contentHtml = '';

            if (navContainer)     navContainer.innerHTML     = '';
            if (contentContainer) contentContainer.innerHTML = '';

            sections.forEach(function(sec, index) {
                var sectionId   = sec.id || ('custom-section-' + index);
                var iconClass   = sec.icon        || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';

                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';

                var sectionBody = '';
                if (sec.desc && sec.desc.trim() !== '') {
                    var descHtml = sec.desc.replace(/\{\{THE_API_URL\}\}/g, escHtml(THE_API_URL));
                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base">' + descHtml + '</div>';
                }

                contentHtml += '<section id="' + sectionId + '" class="mb-12 scroll-mt-24"><div class="flex items-center mb-6"><div class="w-2 h-8 ' + markerColor + ' mr-4 rounded-sm"></div><h2 class="text-2xl font-bold text-slate-900">' + sec.title + '</h2></div><div class="bg-white p-6 lg:p-8 rounded-xl shadow-sm border border-slate-200">' + sectionBody + '</div></section>';
            });

            if (navContainer) navContainer.innerHTML = navHtml;
            if (contentContainer) {
                var meta    = docConfig[currentLang].meta;
                var introHtml = '<section class="mb-12"><div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-xl p-8 shadow-lg text-white relative overflow-hidden"><i class="fas fa-robot absolute -right-10 -bottom-10 text-9xl text-white opacity-10"></i><h2 class="text-3xl font-extrabold mb-4 relative z-10">' + meta.title + '</h2><p class="text-blue-100 text-lg leading-relaxed max-w-3xl relative z-10">' + meta.subtitle + '</p></div></section>';
                contentContainer.innerHTML = introHtml + contentHtml;
            }
        }

        function initLangDropdown() {
            var select = document.getElementById('lang-select');
            select.innerHTML = '';
            Object.keys(docConfig).forEach(function(langKey) {
                var option = document.createElement('option');
                option.value = langKey;
                option.textContent = docConfig[langKey].languageName;
                if (langKey === currentLang) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeLang(targetLang) {
            if (!docConfig[targetLang]) return;
            currentLang = targetLang;
            var url = new URL(window.location);
            url.searchParams.set('lang', targetLang);
            window.history.replaceState({}, document.title, url);
            renderAll();
        }

        function copyUrl() {
            var btn = document.getElementById('btn-copy-url');
            var t   = docConfig[currentLang].ui;
            executeCopy(THE_API_URL, btn, t.copy_url_btn, t.copied);
        }

        function copyPrompt() {
            var rawPrompt = docConfig[currentLang].ui.raw_prompt.replace(/\{\{THE_API_URL\}\}/g, THE_API_URL);
            var btn = document.getElementById('btn-copy-prompt');
            var t   = docConfig[currentLang].ui;
            executeCopy(rawPrompt, btn, t.copy_prompt_btn, t.copied);
        }

        function executeCopy(text, btnElement, originalText, copiedText) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    btnElement.textContent = copiedText;
                    btnElement.classList.add('bg-emerald-600','hover:bg-emerald-700');
                    setTimeout(function(){
                        btnElement.textContent = originalText;
                        btnElement.classList.remove('bg-emerald-600','hover:bg-emerald-700');
                    }, 2000);
                });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                btnElement.textContent = copiedText;
                btnElement.classList.add('bg-emerald-600','hover:bg-emerald-700');
                setTimeout(function(){
                    btnElement.textContent = originalText;
                    btnElement.classList.remove('bg-emerald-600','hover:bg-emerald-700');
                }, 2000);
            }
        }

        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');
            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                if (parent && typeof parent.closest === 'function') {
                    var isExcluded = parent.closest('script,style,mark,code,pre,textarea') !== null;
                    var isHidden   = (parent.getClientRects().length === 0);
                    if (!isExcluded && !isHidden && node.nodeValue.match(regex)) {
                        textNodes.push(node);
                    }
                }
            }
            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts    = node.nodeValue.split(regex);
                var lower    = keyword.toLowerCase();
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lower) {
                        var mark = document.createElement('mark');
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function injectSearchNavigator() {
            var navHtml = '<div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden"><button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="搜尋頁面內容"><i class="fas fa-search text-xl"></i></button><div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3"><div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full"><i class="fas fa-search text-blue-500 text-sm"></i><input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋..." onkeydown="if(event.key===\'Enter\')executeInlineSearch(this.value)"><div class="h-4 w-[1px] bg-blue-200 mx-1"></div><span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span></div><div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8"><button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button><button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button></div><button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="關閉搜尋"><i class="fas fa-times text-lg"></i></button></div></div>';
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var exp = document.getElementById('search-nav-expanded');
            exp.classList.remove('hidden');
            exp.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        function collapseSearch() {
            var exp = document.getElementById('search-nav-expanded');
            exp.classList.add('hidden');
            exp.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            clearAllHighlights();
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            clearAllHighlights();
            var url = new URL(window.location);
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            var nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                searchMarks[currentMarkIndex].className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            searchMarks[currentMarkIndex].className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            searchMarks[currentMarkIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            renderAll();
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword   = urlParams.get('q');
            var hashId    = window.location.hash ? window.location.hash.substring(1) : null;
            var targetEl  = hashId ? document.getElementById(hashId) : null;

            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) highlightKeywordInElement(mainContent, keyword);
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            setTimeout(function() {
                if (searchMarks.length > 0) {
                    var startIndex = 0;
                    if (targetEl) {
                        var firstMark = targetEl.querySelector('mark.search-highlight');
                        if (firstMark) startIndex = searchMarks.indexOf(firstMark);
                    }
                    goToSearchMark(startIndex);
                } else if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetEl.classList.add('ring-4','ring-blue-300','ring-opacity-50','transition-all','duration-1000','rounded-xl');
                    setTimeout(function() { targetEl.classList.remove('ring-4','ring-blue-300','ring-opacity-50'); }, 2000);
                }
            }, 300);
        };
