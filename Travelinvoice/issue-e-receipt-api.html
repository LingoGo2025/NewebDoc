n sammanfogade strängen med SHA256 och konvertera resultatet till <strong>versaler<\/strong>.","res_title":"Returparametrar (Response)","err_title":"Felkodstabell","err_search_ph":"Sök kod...","th_err_code":"Felkod","th_err_reason":"Felorsak / Anmärkning","example_title":"Exempelkod","lbl_method":"Metod","lbl_encrypted_tag":"AES-256-CBC Krypterad","lbl_api_index":"API","msg_no_params":"Inga parametrar definierade","msg_code_unavailable":"// Inget kodexempel tillgängligt","nav_versions":"Versionslogg","versions_title":"Versionslogg","th_ver_version":"Version","th_ver_date":"Ändringsdatum","th_ver_desc":"Ändringsinnehåll","toc_title":"Innehållsförteckning","api_info_title":"Grundläggande API-information","field_def_title":"Fältdefinitioner för API","doc_desc_title":"Dokumentbeskrivning","doc_flowchart_title":"Flödesschema","lbl_launch_type":"Aktiveringstyp","lbl_field_combo_format":"Fältkombinationsformat","lbl_enum_values":"Tillåtna värden","lbl_default_value":"Standardvärde","lbl_is_nullable":"Kan vara Null","lbl_yes":"Ja","lbl_direction":"Riktning","lbl_group_type":"Krypteringsmetod","lbl_location":"Plats","lbl_belong_to":"Tillhör","msg_req_info":"Denna begäran måste initieras av butiken. Använd metoden <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> för att paketera parametrarna och skicka dem via <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>.","msg_req_format_qs":"Fälten i detta block ska kombineras med <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>-symbolen till ett Query String-format, t.ex. <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"Fälten i detta block ska skickas i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt.","msg_req_format_other":"Fälten i detta block kombineras med formatet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_req_security":"Datasäkerhet: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs före överföring.","msg_res_info_webhook":"Detta resultat kommer att skickas asynkront av systemet via en <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> till butikens angivna URL.","msg_res_info_sync":"Detta resultat returneras synkront av systemet via <span class=\\\"font-bold text-green-700\\\">{method}<\/span> i <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"De returnerade fälten kombineras med <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span>-symbolen till ett Query String-format, t.ex. <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"De returnerade fälten skickas i ett <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span>-objekt.","msg_res_format_other":"De returnerade fälten använder formatet <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span>.","msg_res_security":"Verifiering/Dekryptering: <span class=\\\"font-bold\\\">{group_type}<\/span>-bearbetning krävs för specifik data efter mottagande.","lbl_sha_pre_hash":"Kombinerad sträng före kryptering (String to Hash)","ph_sha_pre_hash":"När du trycker på knappen visas den fullständiga strängen som ska krypteras här...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_8.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_9.png"},"meta":{"title":"API för utfärdande av elektroniska kvitton","subtitle":"Utfärda omedelbara eller schemalagda kvitton","version":"","sections":[{"id":"section-0","title":"Syfte med integrationen","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Tillhandahålla en mekanism för medlemmar i resebranschföreningar att via systemintegration utfärda elektroniska kvitton och ladda upp dem till \"Finansministeriets plattform för integrerade e-fakturatjänster\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Denna plattform tillhandahåller inte mekanismer för medierapportering; resebyråer bör hantera sådana ärenden själva. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kontakta kundtjänst för att ansöka om IP-inställningar före integration. Upp till 10 IP-adresser kan konfigureras.<\/span><\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvitto-data via \"HTTP POST\" till plattformen för utfärdande. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för fält är tecken. Kinesiska, engelska, siffror och symboler räknas som ett tecken vardera. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält separeras med \"&\", och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Validering av kvittoberäkning","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Systemet kontrollerar endast att \"Artikel-delsumma = Antal X Enhetspris\" och \"Kvittobelopp = Försäljningsbelopp\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Bekräfta kvittoberäkningsmetoden med företagets ekonomiavdelning; kvitto-data påverkar företagets beskattning, så hantera detta med försiktighet.<\/span><\/p>"},{"id":"section-3","title":"Process för kvitto - Schemalagt utfärdande","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Om metoden är schemalagt utfärdande lagras datan tillfälligt på plattformen, och systemet utfärdar kvittot automatiskt på det schemalagda datumet. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Om utfärdande krävs före det schemalagda datumet kan \"Trigga utfärdande\" köras för omedelbart utfärdande.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Schemalagda kvitton kan inte avbrytas eller triggas efter kl. 00:00 på det schemalagda datumet.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Efter utfärdande laddas data upp till \"Finansministeriets plattform för integrerade e-fakturatjänster\" vid nästa schemalagda uppladdningstillfälle.<\/span><\/p>"},{"id":"section-4","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa först, annars kommer integrationen att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in i testmiljöns backend → Basdata → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktion: Logga in i produktionsmiljöns backend → Basdata → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökan: Ladda ner formuläret från webbplatsen, fyll i och skicka till kundtjänst (Fax / E-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Krävs: Serverns externa IP (inte internt IP, se https://ifconfig.me)<\/p><p>- Aktivering: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljöns URL<\/p>- Testmiljö och produktionsmiljö är helt separata; data delas inte. Se till att byta till produktions-URL innan lansering.<p><br><\/p><p>4. Vanliga fel vid saknade förberedelser<\/p><p>- `KEY10001 Ej godkänd IP för resebyråns API` → IP-vitlistan är inte inställd eller är felaktig<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktig eller är fortfarande exempelvärden<\/p><p>- `KEY10009 Kunde inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller inte aktiverat<\/p><p><br><\/p>"},{"id":"section-5","title":"Process för kvitto - Omedelbart utfärdande","desc":"<p><span style=\"color: rgb(0, 0, 0);\">Efter utfärdande laddas data upp till \"Finansministeriets plattform för integrerade e-fakturatjänster\" vid nästa schemalagda uppladdningstillfälle.<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för omedelbart kvitto"},{"id":"flowchart-1","title":"Process för schemalagt kvitto"}]},"apis":[{"name":"API för utfärdande av elektroniska kvitton","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Strängfält kombineras och krypteras med AES256. Se fältbeskrivning nedan.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Programversion","example":"1.1","must_return":false,"note":"Fast värde 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: Tidsstämpeln för 2014-05-15 15:00:00 är 1400137200, det rekommenderas att använda aktuell tid","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Anpassat nummer","example":"O_201406010001","must_return":false,"note":"1. Resebyråns eget ordernummer, endast bokstäver, siffror och \"_\".\n2. Kan användas för intern systemmatchning, t.ex. löpnummer eller fakturanummer.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"Utfärdandemetod","example":"1","must_return":false,"note":"1=Omedelbart utfärdande\n2=Schemalagt automatiskt utfärdande (kräver planerat datum)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"Planerat utfärdandedatum","example":"2030-10-05","must_return":false,"note":"1. Obligatoriskt om Status=2.\n2. Format: YYYY-MM-DD.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"Förlängning av planerat datum","example":"2","must_return":false,"note":"1. Gäller endast om planerat datum har ett värde.\n2. Endast siffror.\n3. Antal dagar som utfärdandet ska skjutas upp. T.ex. 2 betyder två dagars fördröjning.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"Kvittotyp","example":"B2B","must_return":false,"note":"B2B=Köpare är ett företag (med org.nr).\nB2C=Köpare är en privatperson.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"Köparens namn","example":"Neweb Technologies","must_return":false,"note":"Köparens namn (personnamn eller företagsnamn). Obligatoriskt om Category=B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"Köparens organisationsnummer","example":"54352706","must_return":false,"note":"1. Köparens (företagets) organisationsnummer, endast siffror.\n2. Behövs inte om köparen är en privatperson.\n3. Obligatoriskt om Category=B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Köparens adress","example":"97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"Köparens kontaktadress.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"Köparens e-post","example":"abc@gmail.com","must_return":false,"note":"1. Köparens e-postadress för kvittoinformation.\n2. För flera adresser, separera med komma.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"Köparens mobilnummer","example":"0922123456","must_return":false,"note":"Köparens mobilnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Handläggarens namn","example":"Säljare 203","must_return":false,"note":"Namn på den som utfärdar kvittot. Endast för loggning, valideras ej. Om det lämnas tomt kan utfärdandet misslyckas.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Kvittobelopp","example":"10000","must_return":false,"note":"1. Endast siffror, totalbelopp för kvittot.\n2. Bekräfta beräkningsmetoden för försäljningsbelopp med ekonomiavdelningen.\n3. Totalbeloppet måste vara summan av alla artiklars delsummor.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"Språk för e-postavisering","example":"0","must_return":false,"note":"Om e-postadress finns skickas avisering. Standardvärde är 0 (kinesiska) om parametern saknas.\n0=Kinesiska\n1=Engelska","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Sammanfattning (Artikelnamn)","example":"Produkt A|Produkt B","must_return":false,"note":"1. Separera flera artiklar med |.\n2. Totalt max 280 tecken för alla artiklar.\n3. Max 160 tecken per artikelnamn.\n4. Max 7 artiklar per kvitto; artiklar minskas om namn överskrider 40 tecken.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Antal","example":"1|20","must_return":false,"note":"1. Separera med |. Måste vara siffror. T.ex.: ItemCount =\"1|2\"\n2. Max 5 siffror per antal.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":         function initScrollSpy() {

                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);

                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;

                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);

        function getKeys() {

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');

            });
            container.innerHTML = html;
        }

            currentCodeTab = lang;

        function loadCode(lang) {

            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }

                    <div class="px-4 py-2 text-xs font-bold text-slate-400 uppercase mt-4" data-i18n="nav_group_api" style="letter-spacing:0.05em;"></div>
                    <div id="sidebar-api-list"></div>
                    <a href="#errors" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group mt-4">
                        <i class="fas fa-exclamation-triangle w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_errors"></span>
                    </a>
                    <a href="#example" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group">
                        <i class="fas fa-code w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_example"></span>
                    </a>
                    <a href="#versions" id="nav-versions-link" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group hidden">
                        <i class="fas fa-history w-6 group-hover:text-blue-500 transition-colors"></i> <span data-i18n="nav_versions"></span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 shrink-0 flex flex-col gap-3">
                <div class="relative group w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400"><i class="fas fa-globe"></i></div>
                    <select id="lang-select" onchange="changeLang(this.value)" class="w-full appearance-none bg-white text-slate-600 font-medium py-2.5 pl-10 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer border border-slate-300 shadow-sm"></select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500"><i class="fas fa-chevron-up text-xs"></i></div>
                </div>
                <div class="text-center text-xs text-slate-500 mt-2">
                    <div id="meta-system-name" class="font-bold text-slate-600"></div>
                    <div id="meta-copyright" class="mt-1"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-72 p-4 lg:p-8 min-w-0 w-full max-w-[1920px] mx-auto">
            <div id="dynamic-content-sections"></div>

            <!-- Tools Section -->
            <section id="tool" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-purple-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="tool_title"></h2>
                </div>
                <div class="bg-white rounded-xl shadow-md border border-purple-100 overflow-hidden">
                    <div class="bg-purple-50 p-4 border-b border-purple-100 flex flex-col gap-2">
                        <p class="text-purple-800 text-sm" data-i18n="tool_intro"></p>
                        <div class="bg-red-50 border border-red-200 rounded p-3 flex items-start shadow-sm">
                            <i class="fas fa-shield-alt text-red-500 mt-0.5 mr-2 text-base"></i>
                            <p class="text-red-700 text-sm font-semibold leading-relaxed" data-i18n="tool_security_warning"></p>
                        </div>
                    </div>
                    <div class="flex border-b border-slate-200" id="tool-tabs-container"></div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 pb-6 border-b border-slate-100">
                            <div>
                                <label id="lbl-tool-key" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolKey" data-i18n-placeholder="tool_ph_key" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                            <div>
                                <label id="lbl-tool-iv" class="block text-xs font-bold text-slate-500 uppercase mb-1"></label>
                                <input type="text" id="toolIv" data-i18n-placeholder="tool_ph_iv" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm bg-slate-50">
                            </div>
                        </div>
                        <!-- SHA Tool -->
                        <div id="tool-sha" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-3" data-i18n="tool_lbl_qs"></label>
                                <div id="sha-inputs-area" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-200"></div>
                                <p class="text-xs text-slate-400 mt-2 text-right" data-i18n="tool_note_sha_sort"></p>
                            </div>
                            <button onclick="runSHA()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-fingerprint mr-1"></i> <span data-i18n="tool_btn_sha"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="lbl_sha_pre_hash"></label>
                                <textarea id="shaPreHashOutput" readonly rows="2" class="w-full p-3 bg-slate-100 text-slate-600 rounded font-mono text-sm border border-slate-200 shadow-inner focus:ring-0 mb-3" data-i18n-placeholder="ph_sha_pre_hash"></textarea>

                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_sha_res"></label>
                                <textarea id="shaOutput" readonly rows="2" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Encrypt -->
                        <div id="tool-aes-encrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_qs"></label>
                                <textarea id="encryptInput" rows="5" data-i18n-placeholder="tool_ph_qs" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                                <p class="text-xs text-slate-400 mt-1 text-right" data-i18n="tool_note_urlencode"></p>
                            </div>
                            <button onclick="runEncrypt()" class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-lock mr-1"></i> <span data-i18n="tool_btn_encrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_hex"></label>
                                <textarea id="encryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                        <!-- AES Decrypt -->
                        <div id="tool-aes-decrypt" class="tool-content hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-bold text-slate-700 mb-2" data-i18n="tool_lbl_enc_hex"></label>
                                <textarea id="decryptInput" rows="4" data-i18n-placeholder="tool_ph_enc_hex" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-purple-500 font-mono text-sm text-slate-600"></textarea>
                            </div>
                            <button onclick="runDecrypt()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition shadow-sm font-bold text-sm w-full md:w-auto">
                                <i class="fas fa-unlock mr-1"></i> <span data-i18n="tool_btn_decrypt"></span>
                            </button>
                            <div class="mt-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1" data-i18n="tool_lbl_decrypt_res"></label>
                                <textarea id="decryptOutput" readonly rows="3" class="w-full p-3 bg-slate-800 text-green-400 rounded font-mono text-sm border-none focus:ring-0"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Encryption Rules Section -->
            <section id="encryption" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="enc_title"></h2>
                </div>
                <div id="enc-rule-aes" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-blue-100 text-blue-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-lock"></i></span>
                        <span data-i18n="enc_aes_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_aes_desc"></p>
                    <div id="enc-rule-aes-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
                <div id="enc-rule-sha" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 hidden">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="w-6 h-6 bg-purple-100 text-purple-600 rounded flex items-center justify-center text-xs mr-2"><i class="fas fa-fingerprint"></i></span>
                        <span data-i18n="enc_sha_title"></span>
                    </h3>
                    <p class="text-slate-600 mb-4" data-i18n="enc_sha_desc"></p>
                    <div id="enc-rule-sha-steps" class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-4">
                        <!-- Javascript 將在這裡動態產生步驟 -->
                    </div>
                </div>
            </section>

            <!-- APIs -->
            <section id="apis" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="nav_apis"></h2>
                </div>
                <div id="api-groups-container"></div>
            </section>

            <!-- Errors -->
            <section id="errors" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="err_title"></h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="errorSearch" data-i18n-placeholder="err_search_ph" class="w-full pl-10 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 max-h-[600px] overflow-y-auto">
                    <table class="w-full text-sm params-table" id="errorTable">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold sticky top-0 border-b border-slate-200 shadow-sm z-10">
                            <tr>
                                <th class="px-6 py-4 w-1/4 text-left" data-i18n="th_err_code"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_err_reason"></th>
                            </tr>
                        </thead>
                        <tbody id="error-table-body" class="divide-y divide-slate-200 font-mono text-slate-700"></tbody>
                    </table>
                </div>
            </section>

            <!-- Example -->
            <section id="example" class="mb-12 scroll-mt-24">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-blue-600 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="example_title"></h2>
                </div>
                <div class="bg-slate-800 rounded-lg shadow-lg overflow-hidden relative">
                    <div class="flex border-b border-slate-600 bg-slate-900 px-2 overflow-x-auto" id="code-tabs-container"></div>
                    <div id="code-container-wrapper" class="h-[600px] overflow-auto scrollable-area">
                        <pre id="code-container"><code id="code-display" class="h-full"></code></pre>
                    </div>
                </div>
            </section>

            <!-- Versions -->
            <section id="versions" class="mb-12 scroll-mt-24 hidden">
                <div class="flex items-center mb-6">
                    <div class="w-2 h-8 bg-slate-500 mr-4 rounded-sm"></div>
                    <h2 class="text-2xl font-bold text-slate-900" data-i18n="versions_title"></h2>
                </div>
                <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm params-table">
                        <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 text-left w-[15%]" data-i18n="th_ver_version"></th>
                                <th class="px-6 py-4 text-left w-[20%]" data-i18n="th_ver_date"></th>
                                <th class="px-6 py-4 text-left" data-i18n="th_ver_desc"></th>
                            </tr>
                        </thead>
                        <tbody id="versions-table-body" class="divide-y divide-slate-100 text-slate-700"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-[100] hidden bg-black/80 overflow-auto" onclick="closeLightbox()">
        <button class="fixed top-6 right-8 text-white text-4xl z-[101] drop-shadow-md hover:text-gray-300" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </button>
        <div class="min-w-full min-h-full flex p-8" style="align-items: center; justify-content: center;">
            <img id="lightbox-image" src="" alt="" class="block rounded shadow-2xl" style="max-width: none; margin: auto;" onclick="event.stopPropagation()">
        </div>
    </div>

</body>
</html>
