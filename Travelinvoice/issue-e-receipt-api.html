<span style=\"color: rgb(0, 0, 0);\">4. 電子收據平台回應格式化的字串。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"收據計算方式檢核","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.電子收據平台系統僅檢核「商品小計=商品數量 X 商品單價」及「收據金額= 銷售額」。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.收據計算方式，請串接人員務必與公司財會人員進行確認，收據資料關係到公司稅務，請謹慎處理。<\/span><\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"開立收據流程-預約開立","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1.當收據開立方式為預約自動開立收據時，收據資料僅暫存於平台，系統於設預計開 立日期自動執行開立收據。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2.於預計開立日期前欲提前開立，則可執行「觸發開立收據」，觸發後會立即開出收據。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3.預約開立收據於預約到期日當天 0 時 0 分後，不可取消或執行觸發。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4.開立收據後，屆當期上傳排程日(每單月一日)，平台將會把開立資料上傳至「財政 部電子發票整合服務平台」。<\/span><\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]},{"id":"section-5","icon":"fas fa-info-circle","markerColor":"bg-blue-600","title":"開立收據流程-立即開立","desc":"<p><span style=\"color: rgb(0, 0, 0);\">開立收據後，屆當期上傳排程日(每單月一日)，平台將會把開立資料上傳至 「財政部電子發票整合服務平台」<\/span><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立收據流程_立即開立"},{"id":"flowchart-1","title":"開立收據流程_預約開立"}]},"apis":[{"name":"開立電子收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.1","must_return":false,"note":"固定帶 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"時間戳記","example":"1400137200","must_return":false,"note":"Unix 時間戳記（秒），即自 1970-01-01 00:00:00 UTC 至今的秒數\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間\n例：2014-05-15 15:00:00 這個時間的時間，戳記為 1400137200，建議帶入當前時間","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"自訂編號","example":"O_201406010001","must_return":false,"note":"1.旅行社自訂訂單編號，限英、數字、”_ ”格式。\n2.可用於與營業人內部系統對應使用，可填入訂單流水號、帳務編號等等，","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"開立收據方式","example":"1","must_return":false,"note":"1=即時開立收據\n2=預約自動開立收據(須指定預計開立日期)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"預計開立日期","example":"2030-10-05","must_return":false,"note":"1.當開立收據方式為預約自動開立收據時(Status=2)，此參數為必填。\n2.格式為 YYYY-MM-DD。","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"預計開立日期延長日","example":"2","must_return":false,"note":"1.當預計開立日期有值時，此參數才有作用。\n2.純數字。\n3.數字表延後開立日期的日數。如 2 代表延後開立日期兩天。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"收據種類","example":"B2B","must_return":false,"note":"B2B=買受人為營利事業單位(有統編)。\nB2C=買受人為個人。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"買受人名稱","example":"藍新科技","must_return":false,"note":"買受人名稱，個人姓名或營利事業單位名稱。當收據種類為 B2B，則此欄位為必填。\nCategory=B2B 時必填","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"買受人統一編號","example":"54352706","must_return":false,"note":"1.買受人(營利事業單位)統編，純數字。\n2.買受人為個人時，則不須填寫。\n3.當收據種類為 B2B，則此欄位為必填。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"買受人地址","example":"台北市南港區南港路二段97號","must_return":false,"note":"買受人的聯絡地址。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"買受人電子信箱","example":"abc@gmail.com","must_return":false,"note":"1.買受人的電子信箱。當收據開立時，寄送收據相關查詢資訊。\n2.若需帶入多個信箱，請以逗號分隔","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"買受人手機","example":"0922123456","must_return":false,"note":"買受人的手機號碼。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"經辦人名稱","example":"業務203","must_return":false,"note":"開立收據人員名稱。純記錄，系統不檢核。如未填寫則無法開立成功，系統回覆錯誤代碼。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"收據金額","example":"10000","must_return":false,"note":"1.純數字，為收據總金額。\n2.銷售額計算方式，請務必與公司財會人員進行確認。\n3.收據總金額需為商品小計的總和。","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"收據通知信語系","example":"0","must_return":false,"note":"如有買受人電子信箱，將寄送收據開立通知信。若未帶此參數，系統預設參數值為 0(使用中文通知信)。\n0=中文通知信\n1=英文通知信","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要（商品名稱）","example":"商品一|商品二","must_return":false,"note":"1.多項商品時，商品名稱以 | 分隔。\n2.全部商品名稱總字數最多 280 個字。\n3.單一品項名稱最多可接受 160 個字,中文、英文、數字符號皆算一個字\n4.單一收據最多可接受 7 個品項，品項名稱每超過 40 個字，可輸入的品項就少一個。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"商品數量","example":"1|20","must_return":false,"note":"1.多項商品時，商品數量以 |分隔。商品數量需為數字。例：ItemCount =”1|2”\n2.每個商品數量最多為 5 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"商品單位","example":"個|本","must_return":false,"note":"1.內容如：個、件、本、張…..。\n2.多項商品時，商品單位以 | 分隔。例：ItemUnit =”個|本”\n3.每個商品單位最多兩個字。例：ItemUnit =”個|公斤”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"商品單價","example":"200|100","must_return":false,"note":"1.多項商品時，商品單價以 | 分隔。純數字。例：ItemPrice =”200|100”\n2.每個商品單價不能超過 8 位數。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"商品小計","example":"200|200","must_return":false,"note":"1.每個小記為純數字。\n2.計算方式為：數量 * 單價 = 小計。平台將會檢查計算結果。\n3.多項商品時，商品小計以 | 分隔。例：ItemAmt =”200|200”\n4.每個商品小計金額計算後不能超過 8位數。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"團名","example":"北海道五日|北海道五日","must_return":false,"note":"1.該張收據的團名\n2.全型/半型中文、英數、符號與空格，都算一個字\n3.不接受斷行，與下列特殊符號 : 雙引號 \" | 單引號 ' | 連結符號 & | 與< >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"團號","example":"X0323|X0323","must_return":false,"note":"1.該張收據的團號\n2.全型/半型中文、英數、符號與空格，都算一個字\n3.不接受斷行，與下列特殊符號 : 雙引號 \" | 單引號 ' | 連結符號 & | 與< >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"預計出團日","example":"2014-10-05","must_return":false,"note":"1.格式為 YYYY-MM-DD。例：2014-10-05\n2.預計出團日不得晚於該收據實際開立日期的兩年後。\n3.出團日當天會寄發出團申報提醒通知至指定信箱(請至 會員專區>電子收據>電子收據通知設定功能，填寫欲收信信箱)","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申報註記","example":"0","must_return":false,"note":"0=未申報\n1=已申報\n留空或無傳送此參數表示未申報。","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"備註","example":"此張收據為北海道專案團","must_return":false,"note":"1.收據備註。\n2.字串支援換行符號（16 進制：0x0A 或0x0D 0x0A）。字串中插入換行符號於列印收據時將會自動換行。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"系統回應訊息","direction":"receive","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"回傳狀態","example":"SUCCESS","must_return":true,"note":"1.開立收據成功，則回傳 SUCCESS\n2.開立收據失敗，則回傳錯誤代碼","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"回傳訊息","example":"成功","must_return":true,"note":"文字，此次回傳狀態說明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社代號","example":"54352706","must_return":false,"note":"旅行社統一編號","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"自訂編號","example":"O_201406010001","must_return":false,"note":"旅行社於開立收據時提供的自訂編號","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"收據金額","example":"20532","must_return":false,"note":"此次開立收據的金額","enum_values":"","d <\/span> URL specified by the merchant.","msg_res_info_sync":"The system will return this result synchronously in <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"Returned fields will be combined using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol into a Query String format, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be placed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification & Decryption: Specific data must undergo <span class=\\\"font-bold\\\">{group_type}<\/span> processing after receipt.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"The actual complete string to be encrypted will be displayed here after clicking the hash button...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_2.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_3.png"},"meta":{"title":"Issue Electronic Receipt API","subtitle":"Issue immediate or scheduled receipts","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide members of various travel industry associations with a mechanism to issue electronic receipts via program integration and provide uploads to the 'Ministry of Finance Electronic Invoice Integrated Service Platform'.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide mechanisms or operations for media reporting; travel agencies should handle relevant matters themselves.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Please contact the customer service center to apply for IP settings before integration. The number of configurable IP sets is: 10.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform via 'HTTP POST' for issuance.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The calculation unit for each field is character. Chinese, English, numbers, and symbols all count as one character.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by '&amp;'; this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Receipt Calculation Validation","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. The electronic receipt platform only validates 'Item Subtotal = Item Quantity X Item Unit Price' and 'Receipt Amount = Sales Amount'.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. For receipt calculation methods, integration personnel must confirm with company accounting staff. Receipt data affects company taxes, please handle with care.<\/span><\/p>"},{"id":"section-3","title":"Receipt Issuance Process - Scheduled Issuance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. When the issuance method is set to scheduled automatic issuance, the data is only temporarily stored. The system automatically issues the receipt on the scheduled date.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. To issue earlier than the scheduled date, 'Trigger Receipt Issuance' can be executed, and the receipt will be issued immediately.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Scheduled receipts cannot be cancelled or triggered after 00:00 on the scheduled date.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. After issuance, on the upload schedule day (the 1st of every odd-numbered month), the platform will upload data to the 'Ministry of Finance Electronic Invoice Integrated Service Platform'.<\/span><\/p>"},{"id":"section-4","title":"Pre-integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Testing: Login to Test Admin → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p>- Production: Login to Production Admin → Basic Info → API Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application: Download form from official website, fill out, and send to customer service (Fax / Email)<\/p><p>- Up to 10 IP sets can be configured<\/p><p>- Required: Server outbound IP (Not internal IP, check via https://ifconfig.me)<\/p><p>- Lead time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- Test and Production environments are completely different; data is not shared. Confirm you have switched the URL to the Production URL before going live.<\/p><p><br><\/p><p>4. Common 'Forgotten Pre-tasks' Error Signals<\/p><p>- `KEY10001 Non-travel agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID wrong or not activated<\/p><p><br><\/p>"},{"id":"section-5","title":"Receipt Issuance Process - Immediate Issuance","desc":"<p><span style=\"color: rgb(0, 0, 0);\">After issuance, on the upload schedule day (the 1st of every odd-numbered month), the platform will upload the data to the 'Ministry of Finance Electronic Invoice Integrated Service Platform'.<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Receipt Process - Immediate Issuance"},{"id":"flowchart-1","title":"Receipt Process - Scheduled Issuance"}]},"apis":[{"name":"Issue Electronic Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Merchant Tax ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encrypted string combined from fields explained in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encrypted String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.1","must_return":false,"note":"Fixed as 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC\nEx: 2014-05-15 15:00:00 timestamp is 1400137200. Current time recommended.\nEx: 2014-05-15 15:00:00 timestamp is 1400137200. Current time recommended.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"Custom Number","example":"O_201406010001","must_return":false,"note":"1. Travel agency custom order number, alphanumeric and '_' only.\n2. Used for mapping with internal systems, can be serial number, accounting number, etc.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"Issuance Method","example":"1","must_return":false,"note":"1=Immediate issuance\n2=Scheduled auto issuance (must specify scheduled date)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"Scheduled Issuance Date","example":"2030-10-05","must_return":false,"note":"1. Required when Status=2 (scheduled auto issuance).\n2. Format: YYYY-MM-DD.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"Extension Days for Scheduled Date","example":"2","must_return":false,"note":"1. Effective only when scheduled date has a value.\n2. Pure number.\n3. Represents days to delay. e.g., 2 means delay issuance by two days.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"Receipt Type","example":"B2B","must_return":false,"note":"B2B=Buyer is a business entity (has Tax ID).\nB2C=Buyer is an individual.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"Buyer Name","example":"Neweb Technologies","must_return":false,"note":"Buyer name, individual name or business entity name. Required if Category=B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"Buyer Tax ID","example":"54352706","must_return":false,"note":"1. Buyer (business entity) Tax ID, numbers only.\n2. Not needed for individuals.\n3. Required if Category=B2B.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"Contact address of the buyer.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"Buyer Email","example":"abc@gmail.com","must_return":false,"note":"1. Buyer's email. Used to send receipt inquiry information.\n2. Separate multiple emails with commas.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"Buyer Mobile","example":"0922123456","must_return":false,"note":"Mobile number of the buyer.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"Processor Name","example":"Sales203","must_return":false,"note":"Name of the person issuing the receipt. For record only, not validated. If empty, issuance fails with an error code.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"Receipt Amount","example":"10000","must_return":false,"note":"1. Pure number, total receipt amount.\n2. Sales amount calculation must be confirmed with accounting.\n3. Total amount must be the sum of item subtotals.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"Notification Email Language","example":"0","must_return":false,"note":"If buyer email exists, a notification will be sent. Default is 0 (Chinese) if parameter is missing.\n0=Chinese\n1=English","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"Summary (Item Name)","example":"Item A|Item B","must_return":false,"note":"1. Separate multiple items with |.\n2. Max total 280 characters for all items.\n3. Max 160 characters per single item name.\n4. Max 7 items per receipt. One less item allowed for every 40 characters exceeding initial limits.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"Item Quantity","example":"1|20","must_return":false,"note":"1. Separate multiple items with |. Must be numbers. e.g., ItemCount =”1|2”\n2. Max 5 digits per item quantity.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"Item Unit","example":"piece|book","must_return":false,"note":"1. Contents like: piece, set, book, ticket...\n2. Separate multiple items with |. e.g., ItemUnit =”piece|book”\n3. Max two characters per unit. e.g., ItemUnit =”piece|kg”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"Item Price","example":"200|100","must_return":false,"note":"1. Separate multiple items with |. Pure numbers. e.g., ItemPrice =”200|100”\n2. Max 8 digits per item price.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"Item Subtotal","example":"200|200","must_return":false,"note":"1. Each subtotal is a pure number.\n2. Calculation: Quantity * Price = Subtotal. Platform will validate this.\n3. Separate multiple items with |. e.g., ItemAmt =”200|200”\n4. Max 8 digits per item subtotal.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5 Days|Hokkaido 5 Days","must_return":false,"note":"1. Tour name for the receipt.\n2. Chinese, alphanumeric, symbols, and spaces count as one character.\n3. Line breaks and symbols like \" ' & < > are not accepted.","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour Number","example":"X0323|X0323","must_return":false,"note":"1. Tour number for the receipt.\n2. Chinese, alphanumeric, symbols, and spaces count as one character.\n3. Line breaks and symbols like \" ' & < > are not accepted.","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Estimated Tour Date","example":"2014-10-05","must_return":false,"note":"1. Format: YYYY-MM-DD. e.g., 2014-10-05\n2. Must not be later than two years after actual issuance date.\n3. A declaration reminder will be sent to the specified email on the tour date.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Declaration Note","example":"0","must_return":false,"note":"0=Not declared\n1=Declared\nEmpty or missing parameter means not declared.","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Remarks","example":"This receipt is for the Hokkaido project tour","must_return":false,"note":"1. Receipt remarks.\n2. Supports line breaks (Hex: 0x0A or 0x0D 0x0A). Line breaks will be processed during printing.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS if issuance is successful\n2. Returns error code if issuance fails","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Merchant ID","example":"54352706","must_return":false,"note":"Travel agency Tax ID","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"Custom Number","example":"O_201406010001","must_return":false,"note":"The custom number provided by the travel agency during issuance","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"Receipt Amount","example":"20532","must_return":false,"note":"The amount of this receipt issuance","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"1. The receipt number issued\n2. Null for scheduled issuance","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"Issuance Serial No","example":"193060","must_return":false,"note":"1. The platform's internal serial number for this issuance.\n2. Required parameter for triggering or cancelling scheduled issuance.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"Random Number","example":"85767715","must_return":false,"note":"1. The 8-digit anti-counterfeit random code generated for this receipt.\n2. Null for scheduled issuance","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"Issuance Time","example":"2014-09-25 12:12:12","must_return":false,"note":"DateTime of the receipt issuance, e.g., 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"Remaining Count","example":"2003","must_return":false,"note":"Remaining available invoice track quota for the travel agency.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check the validity of the data returned. Can be compared to verify platform origin. Refer to 'SHA256 Encryption' for method. Returns null if issuance fails.\n\nCheckCode = SHA256 hash calculated using InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt per signature specs.","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"Data Display URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. A complete URL (including https://)\n2. Accesses official website directly to view receipt data without entering date or random code.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String Terminator","example":"##","must_return":true,"note":"Always returns ##. Users receiving data via String must check EndStr=## to ensure data integrity.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Non-travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not activated electronic receipts"},{"code":"KEY10007","reason":"Page idle for over 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency did not apply for postal printing value-added service"},{"code":"KEY10017","reason":"Insufficient quota for postal printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency account suspended"},{"code":"NOR10001","reason":"Network connection anomaly"},{"code":"INV10003","reason":"Item info format error or missing data"},{"code":"INV10004","reason":"Item subtotal calculation error"},{"code":"INV10012","reason":"Receipt amount validation error"},{"code":"INV10013","reason":"Receipt field data incomplete or format error"},{"code":"INV10014","reason":"Custom number format error"},{"code":"INV10016","reason":"Duplicate custom number"},{"code":"INV20001","reason":"No available invoice track found"},{"code":"INV20002","reason":"Failed to retrieve invoice track"},{"code":"INV20003","reason":"Invoice track exhausted"},{"code":"INV20004","reason":"Receipt issuance failed"},{"code":"INV20005","reason":"Failed to write to receipt item table"},{"code":"INV20006","reason":"Receipt data not found"},{"code":"INV20007","reason":"Scheduled date reached, cannot cancel reservation"},{"code":"INV20008","reason":"Failed to cancel scheduled issuance"},{"code":"INV20010","reason":"Scheduled issuance date is empty"},{"code":"INV20011","reason":"Scheduled issuance date format incorrect"},{"code":"INV20012","reason":"Scheduled date cannot be earlier than current date"},{"code":"INV20013","reason":"Extension days format incorrect"},{"code":"INV20014","reason":"Tax ID input error"},{"code":"INV20015","reason":"Buyer Tax ID not filled"},{"code":"INV20016","reason":"Buyer name not filled"},{"code":"INV20018","reason":"Scheduled tour date format incorrect"},{"code":"INV20100","reason":"Anomaly occurred during data writing"},{"code":"INV70001","reason":"Field data format error"}],"versions":[]},

"ja": {"languageName":"日本語","ui":{"head_title":"電子領収書発行API","system_name":"","copyright":"","sidebar_brand":"電子領収書発行API","nav_tool":"暗号化テストツール","nav_group_api":"API仕様詳細","nav_apis":"API仕様","nav_encryption":"暗号化ルール詳細","nav_errors":"エラーコード表","nav_example":"サンプルコード","tool_title":"暗号化テストツール","tool_intro":"このツールは、暗号化文字列の生成やレスポンス結果の復号を支援します。","tool_security_warning":"安全警告：このツールは連携テスト専用です。情報セキュリティ確保のため、ここには本番環境の Hash Key および Hash IV を入力しないでください。","tool_tab_encrypt":"AES 暗号化","tool_tab_decrypt":"AES 復号","tool_tab_sha":"SHA256 暗号化","tool_ph_key":"例: AAAAvw3YlqoEk6G4HqRKDAYpHKZWxBBB","tool_ph_iv":"例: AAAACC1FplieBBBB","tool_lbl_key":"Hash Key (32 bytes)","tool_lbl_iv":"Hash IV (16 bytes)","tool_lbl_qs":"リクエストパラメータ (Query String)","tool_ph_qs":"例: TimeStamp=1400137200&CardNo=4000...","tool_note_urlencode":"文字列が http_build_query または urlencode で処理されていることを確認してください","tool_note_sha_sort":"プログラムは自動的に以下のフィールドを英名順(A-Z)にソートして結合し、前後に IV/Key を連結します","tool_btn_encrypt":"暗号化を実行して暗号化文字列を生成","tool_btn_sha":"SHA256 を実行","tool_lbl_hex":"暗号化結果 (Hex String)","tool_lbl_enc_hex":"暗号化文字列 (Hex String)","tool_lbl_sha_res":"SHA256 結果 (Uppercase)","tool_ph_enc_hex":"例: 0ef82edabaf8964d09992d7ec8e575f1...","tool_btn_decrypt":"復号を実行","tool_lbl_decrypt_res":"復号結果 (生データ)","tool_alert_missing_key":"Hash Key と Hash IV を入力してください","tool_alert_missing_data":"元の文字列を入力してください","tool_alert_encrypt_fail":"暗号化失敗: ","tool_alert_missing_hex":"暗号化された Hex 文字列を入力してください","tool_alert_decrypt_fail":"復号に失敗しました。Key/IV または暗号化文字列の形式を確認してください","req_title":"リクエストパラメータ (Request)","req_api_info":"API 情報","req_url_prod":"URL (本番環境)","req_url_test":"URL (テスト環境)","th_param":"パラメータ名","th_name":"名称","th_required":"必須","th_must_return":"必須返却","th_type":"型","th_note":"備考","enc_title":"暗号化ルール詳細","enc_aes_title":"AES 暗号化・復号化メカニズム","enc_aes_desc":"ベンダーが提供する Hash Key および Hash IV を使用し、AES アルゴリズムを用いてデータの暗号化または復号処理を行います。","enc_step1_title":"リクエスト文字列の生成","enc_step1_desc":"すべてのパラメータを <code>http_build_query<\/code> 形式 (key=value&key2=value2...) で結合します。","enc_step2_title":"AES 暗号化","enc_step2_desc":"暗号化アルゴリズム：<span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>パディングモード (Padding)：<span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>出力形式：<span class=\"font-bold text-red-600\">Hex 16進数<\/span><br>Key / IV：ベンダー所属の Hash Key および Hash IV を使用してください。","enc_step3_title":"16進数 (Hex) への変換","enc_step3_desc":"暗号化後のバイナリデータ (Raw Data) を Hex String (小文字) に変換したものが暗号化文字列です。","enc_sha_title":"SHA256 チェックマック値メカニズム (CheckMacValue)","enc_sha_desc":"SHA256 ハッシュを通じてチェックコードを生成し、リクエストパラメータまたは戻り値の整合性を検証するために使用できます。","enc_sha_step1_title":"パラメータのソートと結合","enc_sha_step1_desc":"指定されたパラメータを英名 (A-Z) 順にソートし、Query String 形式 (key1=val1&key2=val2...) で結合します。","enc_sha_step2_title":"IV と Key の連結","enc_sha_step2_desc":"ソートされた文字列の前後にそれぞれ HashIV と HashKey を連結します。<br>形式：<code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 暗号化と大文字変換","enc_sha_step3_desc":"連結後の文字列を SHA256 暗号化し、結果を<strong>大文字<\/strong>に変換します。","res_title":"レスポンスパラメータ (Response)","err_title":"エラーコード表","err_search_ph":"コードを検索...","th_err_code":"エラーコード","th_err_reason":"エラー原因 / 備考","example_title":"サンプルコード","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"パラメータ未定義","msg_code_unavailable":"// プログラムサンプルはまだありません","nav_versions":"バージョン履歴","versions_title":"バージョン履歴","th_ver_version":"バージョン番号","th_ver_date":"修正日","th_ver_desc":"変更内容","toc_title":"目次","api_info_title":"API 基本情報","field_def_title":"API フィールド定義","doc_desc_title":"ドキュメント説明","doc_flowchart_title":"フローチャート","lbl_launch_type":"発動形態","lbl_field_combo_format":"フィールド結合形式","lbl_enum_values":"許可値","lbl_default_value":"デフォルト値","lbl_is_nullable":"Null 許可","lbl_yes":"はい","lbl_direction":"方向","lbl_group_type":"暗号化方式","lbl_location":"送信位置","lbl_belong_to":"所属","msg_req_info":"このリクエストは加盟店側から送信される必要があります。<span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 方式で、パラメータをパッキングして <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> に配置して送信してください。","msg_req_format_qs":"このセクションのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で結合する必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果はシステムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信 URL にプッシュされます。","msg_res_info_sync":"この結果はシステムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期して返されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号を使用してクエリ文字列 (Query String) 形式で結合されます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して渡されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で結合されます。","msg_res_security":"検証と復号：受信後に特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前結合文字列 (String to Hash)","ph_sha_pre_hash":"暗号化ボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_4.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_5.png"},"meta":{"title":"電子領収書発行API","subtitle":"即時または予約領収書の発行","version":"","sections":[{"id":"section-0","title":"連携の目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 各旅行業協会の会員がプログラム連携を通じて、電子領収書の発行および「財政部電子発票統合サービスプラットフォーム」へのアップロードメカニズムを提供します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 本プラットフォームは媒体申告に関するメカニズムや作業を提供していません。旅行会社は各自で関連事項を行ってください。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 連携前にカスタマーセンターへ連絡し、IP 設定を申請してください。設定可能な IP 数は 10 個までです。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行会社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信し、発行を行います。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中・英、数字、記号はいずれも 1 文字としてカウントされます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号として使用します。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"領収書計算方式の検証","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 電子領収書プラットフォームシステムは「商品小計 = 商品数量 X 商品単価」および「領収書金額 = 売上額」のみを検証します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 領収書の計算方式については、連携担当者は必ず自社の財務会計担当者と確認してください。領収書データは会社の税務に関わるため、慎重に取り扱ってください。<\/span><\/p>"},{"id":"section-3","title":"領収書発行フロー - 予約発行","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 領収書発行方式が予約自動発行の場合、領収書データはプラットフォームに一時保存され、システムが設定された発行予定日に自動的に領収書を発行します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 発行予定日より前に発行したい場合は、「発行トリガー」を実行することで、直ちに領収書を発行できます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 予約発行された領収書は、予約期限当日の 0 時 0 分以降、キャンセルやトリガーの実行はできません。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 領収書発行後、該当期のアップロードスケジュール日（奇数月の 1 日）に、プラットフォームが発行データを「財政部電子発票統合サービスプラットフォーム」にアップロードします。<\/span><\/p>"},{"id":"section-4","title":"連携前準備作業","desc":"<p>（必ず先に完了させてください。そうしないとプログラムは失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト用バックエンドにログイン → 基本情報 → API 連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番用バックエンドにログイン → 基本情報 → API 連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p> 2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入し、カスタマーセンターへ送信（FAX / メール）<\/p><p>- 最大 10 個の IP を設定可能<\/p><p>- 提供が必要なもの：サーバーの外部 IP（内部 IP ではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常 1-2 営業日<\/p><p><br><\/p><p> 3. 環境 URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共通ではありません。リリース前に必ず連携 URL が本番環境のものに切り替わっているか確認してください。<\/p><p><br><\/p><p> 4. よくある「準備作業忘れ」によるエラー信号<\/p><p>- `KEY10001 旅行会社 API 連携 IP ではない` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号エラー` → HashKey / HashIV が正しくない、またはサンプルのまま<\/p><p>- `KEY10009 旅行会社統一番号のデータが取得できない` → MerchantID が誤っているか、有効化されていない<\/p><p><br><\/p>"},{"id":"section-5","title":"領収書発行フロー - 即時発行","desc":"<p><span style=\"color: rgb(0, 0, 0);\">領収書発行後、該当期のアップロードスケジュール日（奇数月の 1 日）に、プラットフォームが発行データを「財政部電子発票統合サービスプラットフォーム」にアップロードします。<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書発行フロー_即時発行"},{"id":"flowchart-1","title":"領収書発行フロー_予約発行"}]},"apis":[{"name":"電子領収書発行API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一番号","example":"54352706","must_return":false,"note":"旅行会社の統一番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後に AES256 暗号化したもの。フィールド説明は下表参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 内包フィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.1","must_return":false,"note":"1.1 固定","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数\n例：2014-05-15 15:00:00 の場合、タイムスタンプは 1400137200。現在の時間を指定することを推奨\n例：2014-05-15 15:00:00 の場合、タイムスタンプは 1400137200。現在の時間を指定することを推奨","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"カスタム番号","example":"O_201406010001","must_return":false,"note":"1. 旅行会社独自の注文番号。英数字、\"_ \" 形式のみ可。\n2. 営業担当者の内部システムとの紐付けに使用でき、注文シリアル番号や会計番号などを入力可能。","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"領収書発行方式","example":"1","must_return":false,"note":"1=即時発行\n2=予約自動発行 (発行予定日の指定が必要)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"発行予定日","example":"2030-10-05","must_return":false,"note":"1. 領収書発行方式が予約自動発行 (Status=2) の場合、このパラメータは必須。\n2. 形式は YYYY-MM-DD。","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"発行予定日延長日数","example":"2","must_return":false,"note":"1. 発行予定日に値がある場合のみ有効。\n2. 数値のみ。\n3. 発行日を延期する日数。例：2 は発行予定日を 2 日遅らせることを意味する。","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"領収書種類","example":"B2B","must_return":false,"note":"B2B=購入者が営利事業単位 (統一番号あり)。\nB2C=購入者が個人。","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"購入者名","example":"藍新科技","must_return":false,"note":"購入者名。個人の氏名または営利事業単位の名称。領収書種類が B2B の場合、このフィールドは必須。\nCategory=B2B の場合に必須","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"購入者統一番号","example":"54352706","must_return":false,"note":"1. 購入者 (営利事業単位) の統一番号。数値のみ。\n2. 購入者が個人の場合は記入不要。\n3. 領収書種類が B2B の場合、このフィールドは必須。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"購入者住所","example":"台北市南港區南港路二段97號","must_return":false,"note":"購入者の連絡先住所。","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"購入者メールアドレス","example":"abc@gmail.com","must_return":false,"note":"1. 購入者のメールアドレス。領収書発行時に、領収書に関連する照会情報を送信します。\n2. 複数のメールアドレスを指定する場合は、カンマで区切ってください","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"購入者携帯電話","example":"0922123456","must_return":false,"note":"購入者の携帯電話番号。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"担当者名","example":"業務203","must_return":false,"note":"領収書を発行する担当者の名前。記録用であり、システムによる検証は行われません。未記入の場合は発行に失敗し、エラーコードが返されます。","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"領収書金額","example":"10000","must_return":false,"note":"1. 数値のみ、領収書の総額。\n2. 売上額の計算方式については、必ず自社の財務会計担当者と確認してください。\n3. 領収書総額は商品小計の合計と一致する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"通知メール言語","example":"0","must_return":false,"note":"購入者のメールアドレスがある場合、領収書発行通知メールを送信します。このパラメータがない場合、デフォルトは 0 (中国語) となります。\n0=中国語通知\n1=英語通知","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"摘要 (商品名)","example":"商品一|商品二","must_return":false,"note":"1. 複数の商品がある場合、商品名を | で区切ります。\n2. 全商品名の総文字数は最大 280 文字までです。\n3. 1 項目あたりの名称は最大 160 文字まで。全角・半角を問わず 1 文字としてカウントされます。\n4. 1 枚の領収書で最大 7 項目まで受け付け可能。1 項目の名称が 40 文字を超えるごとに、入力可能な項目数が 1 つ減ります。","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"商品数量","example":"1|20","must_return":false,"note":"1. 複数の商品がある場合、数量を | で区切ります。数値である必要があります。例：ItemCount =”1|2”\n2. 各商品の数量は最大 5 桁です。","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"商品単位","example":"個|本","must_return":false,"note":"1. 内容例：個、件、本、枚など。\n2. 複数の商品がある場合、単位を | で区切ります。例：ItemUnit =”個|本”\n3. 各商品の単位は最大 2 文字です。例：ItemUnit =”個|kg”","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"商品単価","example":"200|100","must_return":false,"note":"1. 複数の商品がある場合、単価を | で区切ります。数値のみ。例：ItemPrice =”200|100”\n2. 各商品の単価は 8 桁を超えてはいけません。","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"商品小計","example":"200|200","must_return":false,"note":"1. 各小計は数値のみ。\n2. 計算式：数量 * 単価 = 小計。プラットフォームが計算結果をチェックします。\n3. 複数の商品がある場合、小計を | で区切ります。例：ItemAmt =”200|200”\n4. 各商品の小計金額は計算後 8 桁を超えてはいけません。","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"ツアー名","example":"北海道五日|北海道五日","must_return":false,"note":"1. その領収書のツアー名\n2. 全角/半角の日本語、英数字、記号、スペースはすべて 1 文字としてカウントされます\n3. 改行は不可。また、次の特殊記号は使用できません：二重引用符 \" | 一重引用符 ' | 連結記号 & | および < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"ツアー番号","example":"X0323|X0323","must_return":false,"note":"1. その領収書のツアー番号\n2. 全角/半角の日本語、英数字、記号、スペースはすべて 1 文字としてカウントされます\n3. 改行は不可。また、次の特殊記号は使用できません：二重引用符 \" | 一重引用符 ' | 連結記号 & | および < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"予定出発日","example":"2014-10-05","must_return":false,"note":"1. 形式は YYYY-MM-DD。例：2014-10-05\n2. 予定出発日は、該当領収書の実際の発行日から 2 年後以降に設定することはできません。\n3. 出発日当日に出発申告リマインド通知を指定のメールアドレスに送信します（メンバー専用エリア > 電子領収書 > 電子領収書通知設定機能で、受信したいアドレスを記入してください）","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"申告注記","example":"0","must_return":false,"note":"0=未申告\n1=申告済み\n空欄または未送信の場合は未申告となります。","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"備考","example":"この領収書は北海道プロジェクトツアーのものです","must_return":false,"note":"1. 領収書の備考。\n2. 文字列は改行コード（16 進数：0x0A key2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체의 Hash Key 및 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 이진 데이터(Raw Data)를 소문자 Hex String으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 체크섬 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 검증 코드를 생성하며, 요청 파라미터 또는 반환 값의 무결성을 검증하는 데 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z) 순으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열의 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"메서드","lbl_encrypted_tag":"AES-256-CBC 암호화됨","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 아직 코드 예제가 없습니다.","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"순서도","lbl_launch_type":"실행 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전송 위치","lbl_belong_to":"소속","msg_req_info":"이 요청은 상점 측에서 시작해야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식으로 파라미터를 패키징하여 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>(으)로 전송하십시오.","msg_req_format_qs":"이 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","msg_res_info_webhook":"이 결과는 시스템에 의해 비동기 방식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"이 결과는 시스템에 의해 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환된 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식으로 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 필요합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 버튼을 누르면 실제로 암호화될 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_issue-e-receipt-api/fc_6.png","flowchart_1_url":"assets/flowcharts_issue-e-receipt-api/fc_7.png"},"meta":{"title":"전자 영수증 발급 API","subtitle":"즉시 또는 예약 영수증 발급","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 각 여행업 협회 산하 회원사들이 프로그램을 통해 전자 영수증을 발급하고, 이를 국세청 '홈택스 전자세금계산서 통합 서비스 플랫폼'에 업로드할 수 있는 메커니즘을 제공합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 본 플랫폼은 매체 신고와 관련된 메커니즘 및 작업을 제공하지 않으므로, 여행사는 관련 사항을 직접 처리해야 합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 최대 10개입니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 'HTTP POST' 방식으로 영수증 데이터를 전자 영수증 플랫폼에 전송하여 발급합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 정형화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자(Character)입니다. 한글, 영문, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 간에는 '&amp;'를 연결 기호로 사용하며, 각 필드 내에 이 문자(U+0026)를 포함해서는 안 됩니다.<\/span><\/p>"},{"id":"section-2","title":"영수증 계산 방식 검증","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 전자 영수증 플랫폼 시스템은 '품목 소계 = 품목 수량 X 품목 단가' 및 '영수증 금액 = 매출액' 여부만 검증합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 영수증 계산 방식에 대해서는 연동 담당자가 반드시 회사의 재무 담당자와 확인해야 하며, 영수증 데이터는 회사의 세무와 직결되므로 신중히 처리하시기 바랍니다.<\/span><\/p>"},{"id":"section-3","title":"영수증 발급 프로세스 - 예약 발급","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 영수증 발급 방식이 예약 자동 발급일 경우, 영수증 데이터는 플랫폼에 임시 저장되며 시스템이 설정된 예약 발급일에 자동으로 영수증을 발급합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 예약 발급일 전에 미리 발급하려면 '영수증 발급 실행(트리거)'을 수행할 수 있으며, 실행 즉시 영수증이 발급됩니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 예약 발급 영수증은 예약 만료일 당일 0시 0분 이후에는 취소하거나 실행할 수 없습니다.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 영수증 발급 후, 해당 기수의 업로드 스케줄일(매 홀수월 1일)에 플랫폼은 발급 데이터를 국세청 '홈택스 전자세금계산서 통합 서비스 플랫폼'으로 업로드합니다.<\/span><\/p>"},{"id":"section-4","title":"연동 전 사전 작업","desc":"<p>(반드시 먼저 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 취득<\/p><p>- 테스트 환경: 테스트 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 웹사이트에서 신청 양식을 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제출 내용: 서버 외부 IP (내부 IP가 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 보통 영업일 기준 1-2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 오픈 전에 반드시 연동 URL을 실제 환경 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 자주 발생하는 '사전 작업 누락' 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 올바르지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 찾을 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p><p><br><\/p>"},{"id":"section-5","title":"영수증 발급 프로세스 - 즉시 발급","desc":"<p><span style=\"color: rgb(0, 0, 0);\">영수증 발급 후, 해당 기수의 업로드 스케줄일(매 홀수월 1일)에 플랫폼은 발급 데이터를 '국세청 전자세금계산서 통합 서비스 플랫폼'으로 업로드합니다.<\/span><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 발급 프로세스_즉시 발급"},{"id":"flowchart-1","title":"영수증 발급 프로세스_예약 발급"}]},"apis":[{"name":"전자 영수증 발급 API","url_test":"https://capi.travelinvoice.com.tw/invoice_issue","url_prod":"https://api.travelinvoice.com.tw/invoice_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.1","must_return":false,"note":"1.1로 고정","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC 이후의 경과 초\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 넣는 것을 권장합니다.\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 넣는 것을 권장합니다.","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"V","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"1. 여행사에서 정의한 주문 번호로 영문, 숫자, \"_\" 형식만 가능합니다.\n2. 영업자 내부 시스템과 매칭하기 위해 사용할 수 있으며, 주문 일련번호, 회계 번호 등을 입력할 수 있습니다.","enum_values":"","default_value":"","nullable":false},{"name":"Status","required":"","type":"int(1)","label":"영수증 발급 방식","example":"1","must_return":false,"note":"1=즉시 영수증 발급\n2=예약 자동 영수증 발급(예약 발급일 지정 필요)","enum_values":"1,2","default_value":"","nullable":false},{"name":"CreateStatusTime","required":"+","type":"date","label":"예약 발급일","example":"2030-10-05","must_return":false,"note":"1. 영수증 발급 방식이 예약 자동 발급(Status=2)일 때 필수입니다.\n2. 형식은 YYYY-MM-DD입니다.","enum_values":"","default_value":"","nullable":false},{"name":"CreateStatusadd","required":"","type":"int(5)","label":"예약 발급일 연장 일수","example":"2","must_return":false,"note":"1. 예약 발급일에 값이 있을 때만 작동합니다.\n2. 숫자만 입력 가능합니다.\n3. 숫자는 발급일을 지연시킬 일수를 나타냅니다. 예: 2는 발급일을 이틀 연기함을 의미합니다.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"V","type":"string(5)","label":"영수증 종류","example":"B2B","must_return":false,"note":"B2B=매수인이 영리 사업자(사업자 번호 있음).\nB2C=매수인이 개인.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"+","type":"string(50)","label":"매수인 명칭","example":"Neweb Technologies","must_return":false,"note":"매수인 명칭, 개인 성명 또는 영리 사업자 명칭입니다. 영수증 종류가 B2B인 경우 필수 항목입니다.\nCategory=B2B일 때 필수","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"+","type":"string(8)","label":"매수인 사업자 번호","example":"54352706","must_return":false,"note":"1. 매수인(영리 사업자)의 사업자 등록 번호, 숫자만 가능.\n2. 매수인이 개인일 경우 입력할 필요가 없습니다.\n3. 영수증 종류가 B2B인 경우 필수 항목입니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"매수인 주소","example":"서울특별시 강남구...","must_return":false,"note":"매수인의 연락처 주소입니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerEmail","required":"V","type":"string(50)","label":"매수인 이메일","example":"abc@gmail.com","must_return":false,"note":"1. 매수인의 이메일 주소입니다. 영수증 발급 시 관련 조회 정보가 발송됩니다.\n2. 여러 개의 이메일을 입력해야 할 경우 쉼표로 구분하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"Buyerphone","required":"","type":"string(20)","label":"매수인 휴대폰","example":"01012345678","must_return":false,"note":"매수인의 휴대폰 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"V","type":"string(50)","label":"담당자 이름","example":"영업203","must_return":false,"note":"영수증 발급 담당자 이름입니다. 단순 기록용이며 시스템 검증은 하지 않습니다. 입력하지 않으면 발급에 실패할 수 있으며 시스템 오류 코드가 반환됩니다.","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"V","type":"int(8)","label":"영수증 금액","example":"10000","must_return":false,"note":"1. 숫자만 가능하며, 영수증 총 금액입니다.\n2. 매출액 계산 방식은 반드시 회사의 재무 담당자와 확인하십시오.\n3. 영수증 총 금액은 각 품목 소계의 합계여야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EmailLang","required":"","type":"int(2)","label":"영수증 알림 메일 언어","example":"0","must_return":false,"note":"매수인 이메일이 있는 경우 영수증 발급 알림 메일을 발송합니다. 이 파라미터가 없으면 시스템 기본값은 0(중문 알림 메일)입니다.\n0=중문 알림 메일\n1=영문 알림 메일","enum_values":"0,1","default_value":"0","nullable":false},{"name":"ItemName","required":"V","type":"string(286)","label":"요약 (품목명)","example":"상품1|상품2","must_return":false,"note":"1. 여러 품목일 경우 품목명을 | 로 구분합니다.\n2. 전체 품목명의 총 글자 수는 최대 280자입니다.\n3. 단일 품목명은 최대 160자까지 가능하며, 한글/영문/숫자/기호 모두 한 글자로 계산됩니다.\n4. 단일 영수증은 최대 7개 품목까지 가능하며, 품목명이 40자를 초과할 때마다 입력 가능한 품목 수가 하나씩 줄어듭니다.","enum_values":"","default_value":"","nullable":false},{"name":"ItemCount","required":"V","type":"string(41)","label":"상품 수량","example":"1|20","must_return":false,"note":"1. 여러 품목일 경우 수량을 | 로 구분합니다. 수량은 숫자여야 합니다. 예: ItemCount =\"1|2\"\n2. 각 품목 수량은 최대 5자리입니다.","enum_values":"","default_value":"","nullable":false},{"name":"ItemUnit","required":"V","type":"string(62)","label":"상품 단위","example":"개|권","must_return":false,"note":"1. 내용 예: 개, 건, 권, 장 등.\n2. 여러 품목일 경우 단위를 | 로 구분합니다. 예: ItemUnit =\"개|권\"\n3. 각 상품 단위는 최대 두 글자입니다. 예: ItemUnit =\"개|KG\"","enum_values":"","default_value":"","nullable":false},{"name":"ItemPrice","required":"V","type":"string(62)","label":"상품 단가","example":"200|100","must_return":false,"note":"1. 여러 품목일 경우 단가를 | 로 구분합니다. 숫자만 가능. 예: ItemPrice =\"200|100\"\n2. 각 상품 단가는 8자리를 초과할 수 없습니다.","enum_values":"","default_value":"","nullable":false},{"name":"ItemAmt","required":"V","type":"string(62)","label":"상품 소계","example":"200|200","must_return":false,"note":"1. 각 소계는 숫자만 가능합니다.\n2. 계산 방식은: 수량 * 단가 = 소계입니다. 플랫폼에서 계산 결과를 확인합니다.\n3. 여러 품목일 경우 소계를 | 로 구분합니다. 예: ItemAmt =\"200|200\"\n4. 각 상품 소계 금액은 계산 후 8자리를 초과할 수 없습니다.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"단체명","example":"홋카이도 5일|홋카이도 5일","must_return":false,"note":"1. 해당 영수증의 단체 여행 이름\n2. 전각/반각 한글, 영문, 숫자, 기호 및 공백 모두 한 글자로 계산됩니다.\n3. 줄바꿈은 허용되지 않으며, 다음 특수 기호도 사용할 수 없습니다: 큰따옴표 \" | 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"단체 번호","example":"X0323|X0323","must_return":false,"note":"1. 해당 영수증의 단체 번호\n2. 전각/반각 한글, 영문, 숫자, 기호 및 공백 모두 한 글자로 계산됩니다.\n3. 줄바꿈은 허용되지 않으며, 다음 특수 기호도 사용할 수 없습니다: 큰따옴표 \" | 작은따옴표 ' | 연결 기호 & | < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"출발 예정일","example":"2014-10-05","must_return":false,"note":"1. 형식은 YYYY-MM-DD입니다. 예: 2014-10-05\n2. 출발 예정일은 해당 영수증 실제 발급일로부터 2년 이후일 수 없습니다.\n3. 출발 당일 지정된 이메일로 출발 신고 알림이 발송됩니다. (회원 전용 구역 > 전자 영수증 > 전자 영수증 알림 설정에서 수신 이메일을 작성하십시오)","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 마크","example":"0","must_return":false,"note":"0=미신고\n1=신고 완료\n비워두거나 전송하지 않으면 미신고로 간주됩니다.","enum_values":"0,1","default_value":"0","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"이 영수증은 홋카이도 프로젝트 단체용입니다.","must_return":false,"note":"1. 영수증 비고.\n2. 문자열 내 줄바꿈 기호(16진수: 0x0A 또는 0x0D 0x0A)를 지원합니다. 문자열에 줄바꿈 기호를 삽입하면 영수증 출력 시 자동으로 줄바꿈됩니다.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 영수증 발급 성공 시 SUCCESS 반환\n2. 영수증 발급 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호","enum_values":"","default_value":"","nullable":false},{"name":"MerchantOrderNo","required":"","type":"string(30)","label":"사용자 정의 번호","example":"O_201406010001","must_return":false,"note":"여행사가 영수증 발급 시 제공한 사용자 정의 번호","enum_values":"","default_value":"","nullable":false},{"name":"TotalAmt","required":"","type":"int(8)","label":"영수증 금액","example":"20532","must_return":false,"note":"이번에 발급된 영수증 금액","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"1. 이번에 발급된 영수증 번호\n2. 예약 발급의 경우 빈 값","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceTransNo","required":"","type":"string(20)","label":"발급 일련번호","example":"193060","must_return":false,"note":"1. 이번 영수증 발급의 고유 일련번호입니다.\n2. 예약 발급의 실행 또는 취소 시 필수 파라미터입니다.","enum_values":"","default_value":"","nullable":false},{"name":"RandomNum","required":"","type":"string(8)","label":"랜덤 번호","example":"85767715","must_return":false,"note":"1. 이번 영수증 발급 시 생성된 8자리 위조 방지 랜덤 코드입니다.\n2. 예약 발급의 경우 빈 값","enum_values":"","default_value":"","nullable":false},{"name":"CreateTime","required":"","type":"datetime","label":"영수증 발급 시간","example":"2014-09-25 12:12:12","must_return":false,"note":"CreateTime 영수증 발급 시간 DateTime 이번 영수증이 발급된 시간입니다. 예: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"Surplus","required":"","type":"int(8)","label":"잔여 매수","example":"2003","must_return":false,"note":"여행사가 사용할 수 있는 잔여 영수증 번호 수량입니다.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"검증 코드","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"데이터 반환의 유효성을 검사하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환된 것인지 검증할 수 있습니다. 검증 방법은 \"SHA256 암호화 설명\"을 참조하십시오. 발급 실패 시 빈 값이 반환됩니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값","enum_values":"","default_value":"","nullable":false},{"name":"DisplayURL","required":"","type":"string(300)","label":"데이터 전시 URL","example":"https://cwww.travelinvoice.com.tw/official/Invoice/searchInv?Key=844888dca6084f5394aa6c51c586ed613c2381a47","must_return":false,"note":"1. 이 필드는 전체 URL입니다(https:// 포함).\n2. 해당 URL로 직접 연결하여 발급일, 랜덤 코드 등의 입력 없이 공식 사이트에서 영수증 데이터를 확인할 수 있습니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"##로 고정 반환됩니다. String 방식으로 데이터를 수신하는 사용자는 데이터 전송의 무결성을 보장하기 위해 EndStr=## 여부를 판단해야 합니다.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP가 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사가 전자 영수증 사용을 신청하지 않음"},{"code":"KEY10007","reason":"페이지 머묾 시간이 30분을 초과함"},{"code":"KEY10009","reason":"여행사 사업자 등록 번호 데이터를 찾을 수 없음"},{"code":"KEY10010","reason":"여행사 사업자 등록 번호가 비어 있음"},{"code":"KEY10011","reason":"PostData_ 필드가 비어 있음"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터가 비어 있음"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미함"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10016","reason":"여행사가 우편 출력 부가 서비스를 신청하지 않음"},{"code":"KEY10017","reason":"우편 출력 부가 서비스 잔여 수량 부족"},{"code":"KEY10018","reason":"발급자 필드가 작성되지 않음"},{"code":"KEY10019","reason":"여행사 권한이 정지됨"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV10003","reason":"상품 정보 형식 오류 또는 데이터 누락"},{"code":"INV10004","reason":"상품 정보의 품목 소계 계산 오류"},{"code":"INV10012","reason":"영수증 금액 검증 오류"},{"code":"INV10013","reason":"영수증 필드 데이터가 불완전하거나 형식 오류"},{"code":"INV10014","reason":"사용자 정의 번호 형식 오류"},{"code":"INV10016","reason":"사용자 정의 번호 중복"},{"code":"INV20001","reason":"사용 가능한 영수증 번호 대역을 찾을 수 없음"},{"code":"INV20002","reason":"영수증 번호 가져오기 실패"},{"code":"INV20003","reason":"영수증 번호 대역이 모두 사용됨"},{"code":"INV20004","reason":"영수증 발급 실패"},{"code":"INV20005","reason":"영수증 품목표 쓰기 실패"},{"code":"INV20006","reason":"영수증 데이터를 찾을 수 없음"},{"code":"INV20007","reason":"시스템 날짜가 예약 발급일에 도달하여 예약 발급을 취소할 수 없음"},{"code":"INV20008","reason":"예약 발급 영수증 취소 실패"},{"code":"INV20010","reason":"예약 발급일이 비어 있음"},{"code":"INV20011","reason":"예약 발급일 형식이 올바르지 않음"},{"code":"INV20012","reason":"예약 발급일은 시스템 날짜보다 작을 수 없음"},{"code":"INV20013","reason":"예약 발급 연장 일수 형식이 올바르지 않음"},{"code":"INV20014","reason":"사업자 등록 번호 입력 오류"},{"code":"INV20015","reason":"매수인 사업자 번호가 작성되지 않음"},{"code":"INV20016","reason":"매수인 명칭이 작성되지 않음"},{"code":"INV20018","reason":"출발 예정일 형식이 올바르지 않음"},{"code":"INV20100","reason":"데이터 쓰기 중 이상 발생"},{"code":"INV70001","reason":"필드 데이터 형식 오류"}],"versions":[]
