mp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"作業規範","desc":"<p>1.如收據已經超過可作廢期限（開立後下一個單月15號前），那麼將無法執行直接確認的動作<\/p><p>2.已確認的作廢資料無法再一次確認<\/p><p>3.取消待確認作廢資料沒有期限問題<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>作廢單：每一次作廢收據，都會有一筆獨立的作廢記錄，稱之為作廢單或是作廢資料<\/p><p>等待作廢：等待消費者同意作廢前，收據仍是有效狀態，此時的作廢單稱為等待作廢<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立作廢流程－等待作廢"}]},"apis":[{"name":"觸發或取消作廢資料API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}]," ailed, please check Key/IV or encrypted string format","req_title":"Request Parameters (Request)","req_api_info":"API Information","req_url_prod":"URL (Production)","req_url_test":"URL (Test)","th_param":"Parameter Name","th_name":"Name","th_required":"Required","th_must_return":"Must Return","th_type":"Type","th_note":"Note","enc_title":"Encryption Rules Details","enc_aes_title":"AES Encryption/Decryption Mechanism","enc_aes_desc":"Use the Hash Key and Hash IV provided by the vendor to encrypt or decrypt data using the AES algorithm.","enc_step1_title":"Generate Request String","enc_step1_desc":"Combine all parameters in <code>http_build_query<\/code> format (key=value&key2=value2...).","enc_step2_title":"AES Encryption","enc_step2_desc":"Encryption Algorithm: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>Padding: <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>Output Format: <span class=\"font-bold text-red-600\">Hexadecimal (Hex)<\/span><br>Key / IV: Please use the Hash Key and Hash IV belonging to the vendor.","enc_step3_title":"Hexadecimal Conversion (Hex)","enc_step3_desc":"Convert the encrypted binary data (Raw Data) into a Hex String (lowercase), which is the encrypted string.","enc_sha_title":"SHA256 Checksum Mechanism (CheckMacValue)","enc_sha_desc":"Generate a hash value via SHA256, which can be used to verify the integrity of request parameters or return values.","enc_sha_step1_title":"Parameter Sorting and Combination","enc_sha_step1_desc":"Sort designated parameters by English name (A-Z) and combine them into a Query String (key1=val1&key2=val2...).","enc_sha_step2_title":"Concatenate IV and Key","enc_sha_step2_desc":"Concatenate HashIV and HashKey before and after the sorted string, respectively.<br>Format: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 Encryption and Uppercase Conversion","enc_sha_step3_desc":"Perform SHA256 encryption on the concatenated string and convert the result to mpleted before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system in asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"This result will be returned synchronously by the system in <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"The returned fields will be combined into Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be transmitted within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"The returned fields are combined using the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification & Decryption: After receiving, specific data requires <span class=\\\"font-bold\\\">{group_type}<\/span> processing.","lbl_sha_pre_hash":"String to Hash (Before Encryption)","ph_sha_pre_hash":"After clicking the compression button, the full string actually being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_trigger-cancel-void-data-api/fc_1.png"},"meta":{"title":"Trigger or Cancel Invalid Data API","subtitle":"Trigger or Cancel Invalid Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Before integration, please contact the customer service center to apply for IP settings. Up to 10 IP sets can be configured.<\/span><\/p><p>2. Manage invalid data awaiting confirmation, such as directly confirming invalid data or canceling the pending invalid data.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of calculation for each field is a character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected with \"&amp;\"; this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Operating Standards","desc":"<p>1. If the receipt has exceeded the invalidation deadline (before the 15th of the next odd-numbered month after issuance), direct confirmation cannot be executed.<\/p><p>2. Confirmed invalid data cannot be confirmed again.<\/p><p>3. There is no deadline for canceling pending invalid data.<\/p>"},{"id":"section-3","title":"Term Definitions","desc":"<p>Invalidation Document: Every time a receipt is invalidated, an independent invalidation record is created, referred to as an Invalidation Document or Invalidation Data.<\/p><p>Pending Invalidation: Before the consumer agrees to the invalidation, the receipt remains valid; at this time, the document is called Pending Invalidation.<\/p>"},{"id":"section-4","title":"Pre-integration Preparation","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IP sets can be set<\/p><p>- Required: Server outgoing IP (Not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Activation time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test and production environments are completely different systems; data is not shared. Before going live, ensure the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common Errors for \"Forgetting Pre-preparation\"<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still sample values<\/p><p>- `KEY10009 Unable to retrieve travel agency Tax ID data` → MerchantID wrong or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Invalidation Issuance Flow - Pending Invalidation"}]},"apis":[{"name":"Trigger or Cancel Invalid Data API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel Agency Tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"AES256 encryption performed after field string combination. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix Timestamp (seconds), the number of seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200; it is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"Trigger Invalidation Status","example":"1","must_return":false,"note":"1 = Confirm Invalidation.\n2 = Cancel Invalidation.","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"Invalidation Document Serial Number","example":"586","must_return":false,"note":"The invalidation document serial number returned by the system when issuing pending invalidation.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If invalidation document issuance is successful, returns SUCCESS\n2. If invalidation document issuance fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"成功","must_return":true,"note":"Text, description of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency Code","example":"70565326","must_return":false,"note":"Travel Agency Tax ID","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Invalidation Document Serial Number","example":"8294","must_return":false,"note":"The serial number for this invalidation or cancellation issuance.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for this invalidation or pending invalidation.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Check Code","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Used to check the validity of this data return. During integration, you can compare this data to verify if it was returned by the platform. For verification methods, please refer to \"SHA256 Encryption Instructions\". Returns empty if issuance fails.\n\nCheckCode = Hash value calculated from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications\n\nThe program must save InvoiceTransNo, RandomNum, TotalAmt, and MerchantOrderNo returned when issuing the receipt for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must check for EndStr=## to ensure complete data transfer.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page idle for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency Tax ID data"},{"code":"KEY10010","reason":"Travel agency Tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transfer error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Abnormal network connection"},{"code":"INV10015","reason":"Incorrect field data length"},{"code":"LIB10001","reason":"This receipt is not a successfully issued receipt"},{"code":"LIB10002","reason":"Manager name not filled in"},{"code":"LIB10004","reason":"Incorrect confirmation method for invalidation"},{"code":"LIB10005","reason":"Receipt has already been invalidated"},{"code":"LIB10006","reason":"Incorrect trigger invalidation status"},{"code":"LIB10007","reason":"Receipt allowance has already been executed for this receipt, cannot invalidate"},{"code":"LIB10008","reason":"Invalidation deadline exceeded"},{"code":"LIB10009","reason":"No such invalidation data"},{"code":"LIB10010","reason":"The invalidation data has been canceled"},{"code":"LIB10011","reason":"The invalidation data status is invalidation failed and cannot be invalidated again"}],"versions":[]},

\\\">{location}<\/span> に配置して送信してください。","msg_req_format_qs":"このセクションのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わせる必要があります。例: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このセクションのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信 URL にアクティブにプッシュされます。","msg_res_info_sync":"この結果は、システムによって <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わされます。例: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証・復号：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"ハッシュ前の組み合わせ文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_trigger-cancel-void-data-api/fc_2.png"},"meta":{"title":"無効化データのトリガーまたはキャンセルAPI","subtitle":"無効化データのトリガーまたはキャンセル","version":"","sections":[{"id":"section-0","title":"連携目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 連携前に、カスタマーセンターに連絡して IP 設定を申請してください。設定可能な IP 数は 10 個です。<\/span><\/p><p>2. 確認待ちの無効化データを管理します（例：無効化データを直接確認する、またはこの確認待ちの無効化データをキャンセルするなど）。<\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信して作業を行います。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字コードは UTF-8 です。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。日本語、英語、数字、記号はいずれも 1 文字としてカウントされます。<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号として使用します。各フィールド内にこの文字 (U+0026) を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"作業規範","desc":"<p>1. 領収書の無効化可能期限（発行後の翌奇数月15日前まで）を過ぎている場合、直接確認のアクションを実行することはできません。<\/p><p>2. すでに確認済みの無効化データを再度確認することはできません。<\/p><p>3. 確認待ち無効化データのキャンセルには期限の問題はありません。<\/p>"},{"id":"section-3","title":"用語定義","desc":"<p>無効化伝票：領収書の無効化ごとに独立した無効化記録が作成され、これを無効化伝票または無効化データと呼びます。<\/p><p>無効化待ち：消費者が無効化に同意するまでの間、領収書は依然として有効な状態です。この時点の無効化伝票を無効化待ちと呼びます。<\/p>"},{"id":"section-4","title":"連携前の準備作業","desc":"<p>（事前に完了させてください。そうでない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テストエリア管理画面にログイン → 基本資料 → API 連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番エリア管理画面にログイン → 基本資料 → API 連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーセンターに送信（FAX / メール）<\/p><p>- 最大 10 個の IP を設定可能<\/p><p>- 提供が必要なもの：サーバーの対外 IP（内部ネットワーク IP ではありません。https://ifconfig.me で確認可能）<\/p><p>- 反映時間：通常 1-2 営業日<\/p><p><br><\/p><p>3. 環境 URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。公開前に必ず連携 URL を本番エリアの URL に切り替えたことを確認してください。<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラー信号<\/p><p>- `KEY10001 旅行社の API 連携 IP ではありません` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データの復号エラー` → HashKey / HashIV が正しくない、またはサンプルの値のまま<\/p><p>- `KEY10009 旅行社の統一発行番号データが取得できません` → MerchantID が間違っているか有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"無効化発行プロセス－無効化待ち"}]},"apis":[{"name":"無効化データのトリガーまたはキャンセルAPI","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post パラメータ","direction":"送信","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一発行番号","example":"54352706","must_return":false,"note":"旅行社の統一発行番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを組み合わせた後、AES256 暗号化を行います。フィールドの説明は下表の通りです。","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 内のフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.0","must_return":false,"note":"1.0 固定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数。\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200。現在の時間を設定することを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"無効化トリガーステータス","example":"1","must_return":false,"note":"1 = 無効化を確認。\n2 = 無効化をキャンセル。","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"無効化伝票シリアル番号","example":"586","must_return":false,"note":"無効化待ちの発行時にシステムが返却した無効化伝票シリアル番号。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム返却メッセージ","direction":"受信","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 無効化伝票の発行に成功した場合、SUCCESS を返却\n2. 無効化伝票の発行に失敗した場合、エラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行社コード","example":"70565326","must_return":false,"note":"旅行社の統一発行番号","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"無効化伝票シリアル番号","example":"8294","must_return":false,"note":"今回の無効化発行または無効化キャンセルに対する無効化伝票シリアル番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回の無効化領収書または無効化待ちの領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"今回のデータ返却の正当性をチェックするために使用します。連携時にこのパラメータデータを比較して、プラットフォームから返却されたものかどうかを検証できます。検証方法は「SHA256 暗号化説明」を参照してください。発行に失敗した場合は空値を返します。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名仕様に従って計算して得られたハッシュ値\n\n将来の CheckCode 検証のために、領収書発行時に返却された InvoiceTransNo、RandomNum、TotalAmt、MerchantOrderNo をプログラム自体で保存しておく必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"## 固定で返却されます。String 方式でデータを受信するユーザーは、データの転送が完全であることを保証するために EndStr=## を追加で判断する必要があります。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行社 API 連携 IP ではありません"},{"code":"KEY10002","reason":"データ復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行社が電子領収書の利用申請をしていません"},{"code":"KEY10007","reason":"ページ滞在時間が 30 分を超えました"},{"code":"KEY10009","reason":"旅行社の統一発行番号データが取得できません"},{"code":"KEY10010","reason":"旅行社統一発行番号が空白です"},{"code":"KEY10011","reason":"PostData_ フィールドが空白です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空白です"},{"code":"KEY10014","reason":"タイムアウト。通常、I/O 上のタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10019","reason":"旅行社の権限が停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV10015","reason":"フィールドデータの長さが正しくありません"},{"code":"LIB10001","reason":"該当の領収書は正常に発行された領収書ではありません"},{"code":"LIB10002","reason":"経理担当者名が未記入です"},{"code":"LIB10004","reason":"無効化確認方式が誤っています"},{"code":"LIB10005","reason":"領収書はすでに無効化されています"},{"code":"LIB10006","reason":"無効化トリガーステータスが誤っています"},{"code":"LIB10007","reason":"該当の領収書はすでに値引き処理されており、無効化できません"},{"code":"LIB10008","reason":"無効化可能期限を超過しています"},{"code":"LIB10009","reason":"該当の無効化データは存在しません"},{"code":"LIB10010","reason":"該当の無効化データはすでにキャンセルされています"},{"code":"LIB10011","reason":"該当の無効化データのステータスは無効化失敗であり、再度無効化することはできません"}],"versions":[]},

> 형식(key=value&key2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체 소속의 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 바이너리 데이터(Raw Data)를 소문자 Hex String으로 변환하면 암호화 문자열이 됩니다.","enc_sha_title":"SHA256 체크 코드 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 검증 코드를 생성하며, 요청 파라미터나 반환값의 무결성 검증에 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z) 순으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열의 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화하고 결과를 <strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 제공된 코드 예제 없음","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정 날짜","th_ver_desc":"변경 내용","toc_title":"목록","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"플로우차트","lbl_launch_type":"발동 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용 여부","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전달 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점 측에서 시작해야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식으로 파라미터를 패키징하여 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>에 배치하여 전송하십시오.","msg_req_format_qs":"본 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"본 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"본 결과는 시스템에 의해 비동기 형식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"본 결과는 시스템에 의해 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기식으로 반환됩니다.","msg_res_format_qs":"반환된 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환된 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_res_security":"복호화 검증: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"압축 및 암호화 버튼을 누르면 실제 암호화되는 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_trigger-cancel-void-data-api/fc_3.png"},"meta":{"title":"무효 데이터 트리거 또는 취소 API","subtitle":"무효 데이터 트리거 또는 취소","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 연동 전에 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 10개입니다.<\/span><\/p><p>2. 확인 대기 중인 무효 데이터를 관리합니다. 무효 데이터를 직접 확인하거나, 대기 중인 무효 데이터를 취소할 수 있습니다.<\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 영수증 데이터를 전자 영수증 플랫폼에 전송하여 작업을 수행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 글자(Character)입니다. 한글, 영문, 숫자, 기호 모두 한 글자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이에는 「&amp;」를 연결 기호로 사용하며, 각 필드 내부에는 이 문자(U+0026)가 포함될 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"작업 규범","desc":"<p>1. 영수증의 무효 가능 기한(발행 후 다음 홀수 달 15일 전)이 지난 경우, 직접 확인 동작을 수행할 수 없습니다.<\/p><p>2. 이미 확인된 무효 데이터는 다시 확인을 수행할 수 없습니다.<\/p><p>3. 대기 중인 무효 데이터 취소에는 기한 제한이 없습니다.<\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>무효화 전표: 매 영수증 무효화 시 생성되는 독립적인 무효 기록을 무효화 전표 또는 무효 데이터라고 합니다.<\/p><p>무효화 대기: 소비자가 무효화에 동의하기 전까지 영수증은 유효한 상태이며, 이때의 무효화 전표를 무효화 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 전 사전 작업","desc":"<p>(반드시 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 운영 환경: 운영 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 서식을 다운로드하여 작성 후 고객센터로 전송(팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제공 항목: 서버 외부 IP(내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 영업일 기준 1-2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 서비스 개시 전에 반드시 연동 URL을 운영 구역 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 흔히 발생하는 「사전 작업 누락」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터를 찾을 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"무효 발행 프로세스 - 무효 대기"}]},"apis":[{"name":"무효 데이터 트리거 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC 이후의 경과 시간(초)\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 입력할 것을 권장함","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"무효 상태 트리거","example":"1","must_return":false,"note":"1 = 무효화 확인.\n2 = 무효화 취소.","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"무효화 전표 일련번호","example":"586","must_return":false,"note":"무효화 대기 발행 시 시스템이 응답한 무효화 전표 일련\n번호.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 무효화 전표 발행 성공 시 SUCCESS 반환\n2. 무효화 전표 발행 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"70565326","must_return":false,"note":"여행사 사업자 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"무효화 전표 일련번호","example":"8294","must_return":false,"note":"이번 무효 발행 또는 무효 취소의 무효화 전표 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번 무효 영수증 또는 무효 대기의 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크 코드","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"이번 데이터 반환의 정당성을 확인하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환한 것인지 확인할 수 있습니다. 확인 방법은 ”SHA256 암호화 설명”을 참조하십시오. 발행 실패 시 빈 값을 반환합니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시 값\n\n영수증 발행 시 반환된 InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo를 향후 CheckCode 검증을 위해 프로그램에서 자체적으로 저장해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"## 고정 반환. String 방식으로 데이터를 받는 사용자는 데이터 전달의 완전성을 보장하기 위해 EndStr=##인지 추가로 판단해야 합니다.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP가 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터가 불완전함"},{"code":"KEY10006","reason":"여행사가 전자 영수증 사용을 신청하지 않음"},{"code":"KEY10007","reason":"페이지 체  är: 10 grupper.<\/span><\/p><p>2. Hantera ogiltigförklarad data som väntar på bekräftelse, till exempel att direkt bekräfta ogiltigförklaring eller avbryta väntande ogiltigförklaring.<\/p>"},{"id":"section-1","title":"Datatransfersätt","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittoinformation till den elektroniska kvittoplattformen via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska tecken, engelska bokstäver, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Varje fält separeras med \"&amp;\" som anslutningssymbol. Fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Verksamhetsregler","desc":"<p>1. Om kvittot har överskridit tidsgränsen för ogiltigförklaring (före den 15:e i nästa udda månad efter utfärdandet), kan en direkt bekräftelse inte utföras.<\/p><p>2. Redan bekräftad ogiltigförklarad data kan inte bekräftas igen.<\/p><p>3. Det finns ingen tidsbegränsning för att avbryta väntande ogiltigförklaring.<\/p>"},{"id":"section-3","title":"Definition av termer","desc":"<p>Ogiltigförklaringstalong: Varje gång ett kvitto ogiltigförklaras skapas en oberoende post, kallad ogiltigförklaringstalong eller ogiltigförklaringsdata.<\/p><p>Väntar på ogiltigförklaring: Innan konsumenten godkänner ogiltigförklaringen är kvittot fortfarande giltigt. Vid denna tidpunkt kallas ogiltigförklaringstalongen för \"väntar på ogiltigförklaring\".<\/p>"},{"id":"section-4","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testområdets backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsområdets backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningsfönster: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänst (Fax / E-post)<\/p><p>- Upp till 10 IP-grupper kan ställas in<\/p><p>- Behöver tillhandahållas: Serverns externa IP (inte internt IP, kan kontrolleras på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika system, data delas inte. Innan driftsättning, se till att integrations-URL:en har växlats till produktionsmiljöns URL.<\/p><p><br><\/p><p>4. Vanliga felsignaler för \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en IP för resebyråns API-integration` → IP-vitlistan är inte inställd eller felaktigt inställd<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är inkorrekt eller fortfarande exempelvärden<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller inte aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för utfärdande av ogiltigförklaring - Väntar på ogiltigförklaring"}]},"apis":[{"name":"API för att utlösa eller avbryta ogiltigförklaring av data","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","e  ogiltigförklaringstalongen utfärdats framgångsrikt returneras SUCCESS\n2. Om utfärdandet misslyckas returneras en felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Framgång","must_return":true,"note":"Textbeskrivning av denna returstatus","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyrå-ID","example":"70565326","must_return":false,"note":"Resebyråns organisationsnummer","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Löpnummer för ogiltigförklaringstalong","example":"8294","must_return":false,"note":"Löpnumret för den ogiltigförklaringstalong som denna gång utfärdades eller avbröts.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret för det kvitto som denna gång ogiltigförklarades eller väntar på ogiltigförklaring.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Används för att kontrollera lagligheten i denna dataretur. Vid integration kan denna parameter jämföras för att verifiera att den returnerats av plattformen. För verifieringsmetod, se ”SHA256-krypteringsinstruktioner”. Om utfärdandet misslyckas returneras ett tomt värde.\n\nCheckCode = Hashvärde beräknat enligt SHA256-signaturspecifikationen baserat på InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nProgrammet måste själv spara InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo som returnerades vid utfärdandet av kvittot för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängslut","example":"##","must_return":true,"note":"Returnerar alltid ##. Användare som tar emot data via String-metoden bör kontrollera EndStr=## för att säkerställa att dataöverföringen är fullständig.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en IP för resebyråns API-integration"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständiga data"},{"code":"KEY10006","reason":"Resebyrån har inte ansökt om att aktivera elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer är tomt"},{"code":"KEY10011","reason":"Fältet PostData_ är tomt"},{"code":"KEY10012","reason":"Dataöverföringsfel"},{"code":"KEY10013","reason":"Data är tom"},{"code":"KEY10014","reason":"TimeOut. Avser vanligtvis timeout för I/O"},{"code":"KEY10015","reason":"Fel format på kvittobelopp"},{"code":"KEY10019","reason":"Resebyrån har stängts av"},{"code":"NOR10001","reason":"Nätverksanslutningsfel"},{"code":"INV10015","reason":"Felaktig datalängd i fältet"},{"code":"LIB10001","reason":"Kvittot är inte ett framgångsrikt utfärdat kvitto"},{"code":"LIB10002","reason":"Namn på handläggare ej ifyllt"},{"code":"LIB10004","reason":"Felaktig metod för bekräftelse av ogiltigförklaring"},{"code":"LIB10005","reason":"Kvittot har redan ogiltigförklarats"},{"code":"LIB10006","reason":"Felaktig status för utlöst ogiltigförklaring"},{"code":"LIB10007","reason":"Kvittot har redan krediterats och kan inte ogiltigförklaras"},{"code":"LIB10008","reason":"Tidsgränsen för ogiltigförklaring har överskridits"},{"code":"LIB10009","reason":"Ingen sådan ogiltigförklaringsdata hittades"},{"code":"LIB10010","reason":"Ogiltigförkla         const globalCodeExamples = {"PHP":"<?php\n/*\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n\n// 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('API_KEY', 'YOUR_AES_KEY_32_BYTES_HERE');\n\n// 16 bytes — used for both AES-256 encryption and SHA256 signature\n// IV must be exactly 16 bytes because the block size of the AES algorithm is fixed at 16 bytes (independent of the key length).\ndefine('API_IV', 'YOUR_AES_IV_16_BYTES_HERE');\n\n// Security Gate to block execution if placeholders are left unconfigured\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || API_KEY === 'YOUR_AES_KEY_32_BYTES_HERE' || API_IV === 'YOUR_AES_IV_16_BYTES_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 20px; margin: 20px; font-weight: bold; font-family: sans-serif; border-radius: 5px; max-width: 800px; margin-left: auto; margin-right: auto;\">';\n    echo '<h4>Configuration Error Detected<\/h4>';\n    echo '<p>You must replace the placeholder constants (MERCHANT_ID, API_KEY, and API_IV) with your actual API credentials before executing this script.<\/p>';\n    echo '<\/div>';\n    exit;\n}\n\n// Target API Endpoint (Testing Environment)\n$apiUrl = 'https://capi.travelinvoice.com.tw/invalid_touch_issue';\n\n// API Response Error Codes Dictionary\n$errorMap = [\n    'KEY10001' => 'Non-travel agency API integration connection IP.',\n    'KEY10002' => 'Data decryption error.',\n    'KEY10003' => 'Incorrect integration version.',\n    'KEY10004' => 'Incomplete payload data.',\n    'KEY10006' => 'Travel agency has not applied or enabled electronic receipts.',\n    'KEY10007' => 'Page idle time exceeded 30 minutes.',\n    'KEY10009' => 'Cannot retrieve records matching the travel agency tax ID.',\n    'KEY10010' => 'Travel agency tax ID is blank.',\n    'KEY10011' => 'PostData_ field is blank.',\n    'KEY10012' => 'Data transmission format error.',\n    'KEY10013' => 'Transmitted data payload is empty.',\n    'KEY10014' => 'Connection timed out during processing.',\n    'KEY10015' => 'Incorrect receipt amount formatting.',\n    'KEY10019' => 'Travel agency account has been suspended.',\n    'NOR10001' => 'Network connection abnormality.',\n    'INV10015' => 'Field data length is incorrect.',\n    'LIB10001' => 'The target receipt is not a successfully issued receipt.',\n    'LIB10002' => 'Manager or representative name is missing.',\n    'LIB10004' => 'Incorrect confirmation status parameters.',\n    'LIB10005' => 'The receipt has already been voided previously.',\n    'LIB10006' => 'Invalid status parameter provided.',\n    'LIB10007' => 'Active allowances exist on the receipt; cannot execute void sequence.',\n    'LIB10008' => 'Exceeded the allowable legal timeline for voiding.',\n    'LIB10009' => 'Void processing record not found.',\n    'LIB10010' => 'The void processing request has already been cancelled.',\n    'LIB10011' => 'The void record state is Failed and cannot be updated.'\n];\n\n/**\n * Encrypts data using AES-256-CBC with non-standard PKCS7 block padding of 32 bytes.\n *\n * @param string $plaintext Data payload in key=value format\n * @param string $key Encryption key (32 bytes)\n * @param string $iv Initialization Vector (16 bytes)\n * @return string Hexadecimal-encoded representation of the encrypted payload\n * @throws Exception If encryption fails or input criteria are unmet\n */\nfunction encrypt_aes_256_cbc_b32($plaintext, $key, $iv) {\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLength = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLength % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encrypted = openssl_encrypt($paddedPlaintext, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed in OpenSSL routine.');\n    }\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Reconstructs and verifies the CheckCode signature returned in the API response payload.\n *\n * @param string $invoiceTransNo Invoice internal transaction number from database\n * @param string $merchantId Travel agency tax ID (Merchant ID)\n * @param string $merchantOrderNo Original merchant system order number\n * @param string $randomNum Original random parameter assigned to the transaction\n * @param string $totalAmt Original transaction receipt amount\n * @param string $expectedSignature The CheckCode signature received in the server response\n * @param string $key The HashKey\n * @param string $iv The HashIV\n * @return bool True if verification passes, false otherwise\n */\nfunction verify_response_signature($invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $expectedSignature, $key, $iv) {\n    $raw = 'HashIV=' . $iv . '&InvoiceTransNo=' . $invoiceTransNo . '&MerchantID=' . $merchantId . '&MerchantOrderNo=' . $merchantOrderNo . '&RandomNum=' . $randomNum . '&TotalAmt=' . $totalAmt . '&HashKey=' . $key;\n    $calculated = strtoupper(hash('sha256', $raw));\n    return hash_equals($calculated, $expectedSignature);\n}\n\n// Initialize processing states\n$apiResponse = null;\n$processingError = null;\n$isSignatureValid = null;\n\n// Handle submission requests\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $invalidStatus = isset($_POST['invalid_status']) ? (int)$_POST['invalid_status'] : 1;\n        $invalidNo = isset($_POST['invalid_no']) ? trim((string)$_POST['invalid_no']) : '';\n\n        if ($invalidNo === '') {\n            throw new Exception('The invalidation document flow number (InvalidNo) is a required parameter.');\n        }\n\n        // Construct request payload fields array\n        $postDataParams = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'InvalidStatus' => (string)$invalidStatus,\n            'InvalidNo' => $invalidNo\n        ];\n\n        // Combine into standard raw querystring without URL encoding transformation\n        $plaintextParts = [];\n        foreach ($postDataParams as $key => $value) {\n            $plaintextParts[] = $key . '=' . $value;\n        }\n        $plaintextPayload = implode('&', $plaintextParts);\n\n        // Encrypt the formatted payload\n        $encryptedPostData = encrypt_aes_256_cbc_b32($plaintextPayload, API_KEY, API_IV);\n\n        // Configure network handle for transmission\n        $ch = curl_init($apiUrl);\n        if ($ch === false) {\n            throw new Exception('Could not initialize curl session resource.');\n        }\n\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query([\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        ]));\n\n        $rawResponse = curl_exec($ch);\n        if ($rawResponse === false) {\n            $errorDetail = curl_error($ch);\n            throw new Exception('Connection failed while communicating with the API host: ' . $errorDetail);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpStatusCode !== 200) {\n            throw new Exception('Server returned unfavorable HTTP status code: ' . $httpStatusCode);\n        }\n\n        // Parse response content from API string structure\n        $parsedResponse = [];\n        parse_str($rawResponse, $parsedResponse);\n\n        $apiResponse = [\n            'Status' => $parsedResponse['Status'] ?? '',\n            'Message' => $parsedResponse['Message'] ?? '',\n            'MerchantID' => $parsedResponse['MerchantID'] ?? '',\n            'InvalidNo' => $parsedResponse['InvalidNo'] ?? '',\n            'InvoiceNumber' => $parsedResponse['InvoiceNumber'] ?? '',\n            'CheckCode' => $parsedResponse['CheckCode'] ?? '',\n            'EndStr' => $parsedResponse['EndStr'] ?? ''\n        ];\n\n        // Enforce basic protocol integrity verification\n        $isResponseComplete = (substr($rawResponse, -2) === '##') || ($apiResponse['EndStr'] === '##');\n        if (!$isResponseComplete) {\n            throw new Exception('The received response package was truncated or did not end with the expected EndStr indicator.');\n        }\n\n        // Decode specific code meanings if not SUCCESS\n        if ($apiResponse['Status'] !== 'SUCCESS') {\n            $apiResponse['StatusDescription'] = $errorMap[$apiResponse['Status']] ?? 'Unknown API system error returned.';\n        }\n\n        // Verify CheckCode response signature if matching reference transaction parameters are supplied in user interface\n        $verifyTransNo = isset($_POST['v_invoice_trans_no']) ? trim((string)$_POST['v_invoice_trans_no']) : '';\n        $verifyOrderNo = isset($_POST['v_merchant_order_ onse['Status']); ?><\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($apiResponse['Status']); ?><\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Response Message (Message)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['Message']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Merchant Agency ID (MerchantID)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['MerchantID']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Document Flow Number (InvalidNo)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['InvalidNo']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Target Invoice Number (InvoiceNumber)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['InvoiceNumber']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Integrity Delimiter (EndStr)<\/td>\n                    <td><code><?php echo htmlspecialchars($apiResponse['EndStr']); ?><\/code><\/td>\n                <\/tr>\n                <tr>\n                    <td>Received Signature CheckCode<\/td>\n                    <td><small><code><?php echo htmlspecialchars($apiResponse['CheckCode']); ?><\/code><\/small><\/td>\n                <\/tr>\n                <?php if ($isSignatureValid !== null): ?>\n                <tr>\n                    <td>Signature Verification Result<\/td>\n                    <td>\n                        <?php if ($isSignatureValid): ?>\n                            <span class=\"badge badge-success\">VALID SIGNATURE<\/span>\n                            <span style=\"font-size: 13px; color: #27ae60; margin-left: 10px;\">The returned signature matches calculations and database parameters securely.<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\">SIGNATURE INVALID<\/span>\n                            <span style=\"font-size: 13px; color: #c0392b; margin-left: 10px;\">The returned signature does not match generated validation data. Check parameters.<\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <?php endif; ?>\n            <\/table>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);

            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {

                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);

                                    desc += ' ' + colsHtml;

                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">

                    <i class="fas fa-search text-xl"></i>

                <!-- 展開狀態的完整工具列 -->

                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
