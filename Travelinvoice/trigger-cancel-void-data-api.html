-circle","markerColor":"bg-green-600","title":"作業規範","desc":"<p>1.如收據已經超過可作廢期限（開立後下一個單月15號前），那麼將無法執行直接確認的動作<\/p><p>2.已確認的作廢資料無法再一次確認<\/p><p>3.取消待確認作廢資料沒有期限問題<\/p>","images":[]},{"id":"section-3","icon":"fas fa-info-circle","markerColor":"bg-purple-600","title":"名詞定義","desc":"<p>作廢單：每一次作廢收據，都會有一筆獨立的作廢記錄，稱之為作廢單或是作廢資料<\/p><p>等待作廢：等待消費者同意作廢前，收據仍是有效狀態，此時的作廢單稱為等待作廢<\/p>","images":[]},{"id":"section-4","icon":"fas fa-info-circle","markerColor":"bg-rose-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"開立作廢流程－等待作廢"}]},"apis":[{"name":"觸發或取消作廢資料API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field" _title":"Error Code Table","err_search_ph":"Search code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Note","example_title":"Sample Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code samples available yet","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Date","th_ver_desc":"Description","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definitions","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Launch Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Transmission Location","lbl_belong_to":"Belongs To","msg_req_info":"This request must be initiated by the store. Please pack the parameters and send them using the <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> method to <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>.","msg_req_format_qs":"The fields in this block must be combined as a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, for example <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"The fields in this block must be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_req_format_other":"The fields in this block use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format for combination.","msg_req_security":"Data Security: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required before transmission.","msg_res_info_webhook":"This result will be actively pushed by the system asynchronously to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> URL specified by the store.","msg_res_info_sync":"This result will be returned synchronously by the system using the <span class=\\\"font-bold text-green-700\\\">{method}<\/span> method at <span class=\\\"font-bold text-green-700\\\">{location}<\/span>.","msg_res_format_qs":"The returned fields will be combined as a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, for example <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"The returned fields will be placed in a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object for transmission.","msg_res_format_other":"The returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format for combination.","msg_res_security":"Verification and Decryption: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data after receipt.","lbl_sha_pre_hash":"String to Hash","ph_sha_pre_hash":"After clicking the hashing button, the actual complete string being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_trigger-cancel-void-data-api/fc_1.png"},"meta":{"title":"Trigger or Cancel Void Data API","subtitle":"Trigger or Cancel Void Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p>Manage void data pending confirmation, such as directly confirming void data or canceling pending void data.<\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies transmit receipt data to the e-receipt platform via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The e-receipt platform returns a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field calculation unit is a character. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected by \"&\", and no field may contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Operational Specifications","desc":"<p>1. If the receipt has exceeded the voidable deadline (before the 15th of the month following issuance), direct confirmation cannot be executed.<\/p><p>2. Already confirmed void data cannot be confirmed again.<\/p><p>3. There is no deadline for canceling pending void data.<\/p>"},{"id":"section-3","title":"Terminology Definitions","desc":"<p>Void Form: Each voided receipt has an independent record, referred to as a Void Form or void data.<\/p><p>Pending Void: Before consumer consent for voiding, the receipt remains valid; the void form at this stage is called Pending Void.<\/p>"},{"id":"section-4","title":"Pre-integration Steps","desc":"<p>(Please complete these, otherwise the program will definitely fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Info → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IPs can be set<\/p><p>- Required: Server public IP (not intranet IP, check at https://ifconfig.me)<\/p><p>- Effective time: Usually 1-2 business days<\/p><p><br><\/p><p>3. Environment URLs<\/p><p>- The test environment and production environment are completely different systems; data is not shared. Before going live, ensure the integration URL is switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Steps\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still example values<\/p><p>- `KEY10009 Cannot retrieve travel agency tax ID data` → MerchantID incorrect or not enabled<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Void Issuance Process - Pending Void"}]},"apis":[{"name":"Trigger or Cancel Void Data API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Perform AES256 encryption after combining string fields, field descriptions are in the table below","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fields within PostData_","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed value 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), i.e., seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200, it is recommended to use the current time","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"Trigger Void Status","example":"1","must_return":false,"note":"1 = Confirm void.\n2 = Cancel void.","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"Void Form Sequence Number","example":"586","must_return":false,"note":"Void form sequence number returned by the system when issuing pending void.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. Returns SUCCESS if the void form is successfully issued\n2. Returns error code if void form issuance fails","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text explanation of this return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"70565326","must_return":false,"note":"Travel agency tax ID","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Void Form Sequence Number","example":"8294","must_return":false,"note":"Void form sequence number of this issuance or cancellation.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"Receipt number of this voided receipt or pending void receipt.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Checksum","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Used to verify the legitimacy of the returned data. During integration, you can compare this parameter to verify if the data was returned by the platform. Please refer to \"SHA256 Encryption Description\" for verification methods. Returns empty if issuance fails.\n\nCheckCode = Hash value calculated by SHA256 signature specification from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nYou need to save the InvoiceTransNo, RandomNum, TotalAmt, and MerchantOrderNo returned when the receipt was issued for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"String End","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String method must check if EndStr=## to ensure complete data transmission.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not enabled e-receipts"},{"code":"KEY10007","reason":"Page idle for over 30 minutes"},{"code":"KEY10009","reason":"Cannot retrieve travel agency tax ID data"},{"code":"KEY10010","reason":"Travel agency tax ID is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transmission error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Usually refers to I/O time out"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Network connection exception"},{"code":"INV10015","reason":"Field data length error"},{"code":"LIB10001","reason":"This receipt was not successfully issued"},{"code":"LIB10002","reason":"Business name not filled"},{"code":"LIB10004","reason":"Incorrect void confirmation method"},{"code":"LIB10005","reason":"Receipt already voided"},{"code":"LIB10006","reason":"Incorrect trigger void status"},{"code":"LIB10007","reason":"Receipt allowance has been executed for this receipt, cannot void"},{"code":"LIB10008","reason":"Exceeded voidable deadline"},{"code":"LIB10009","reason":"No such void data"},{"code":"LIB10010","reason":"This void data has already been cancelled"},{"code":"LIB10011","reason":"The status of this void data is void failed, cannot be voided again"}],"versions":[]},

n style=\"color: rgb(0, 0, 0);\">3. エンコーディング形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返信します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。中・英・数字・記号はすべて1文字と数えます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を接続記号とし、各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"作業規定","desc":"<p>1.領収書が無効化可能期限（発行後、翌月の15日まで）を過ぎている場合、直接確認操作を実行することはできません。<\/p><p>2.すでに確認済みの無効データは再度確認することはできません。<\/p><p>3.確認待ち無効データの取り消しには期限の問題はありません。<\/p>"},{"id":"section-3","title":"用語定義","desc":"<p>無効伝票：領収書を無効にするたびに独立した無効記録が作成されます。これを無効伝票または無効データと呼びます。<\/p><p>無効化待ち：消費者が無効化に同意するまで、領収書は有効状態のままです。この時点の無効伝票を「無効化待ち」と呼びます。<\/p>"},{"id":"section-4","title":"接続前の事前準備","desc":"<p>（必ず完了させてください。完了していない場合、プログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIVの取得<\/p><p>- テスト環境：テストエリア管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p>- 本番環境：本番エリア管理画面にログイン → 基本情報 → API接続設定 → HashKeyとHashIVをコピー<\/p><p><br><\/p><p>2. IPホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請書をダウンロードし、記入後、カスタマーセンターへ送信（FAX / Email）<\/p><p>- 最大10組のIPを設定可能<\/p><p>- 提供が必要：サーバーの外部IP（イントラネットIP不可、https://ifconfig.me で確認可能）<\/p><p>- 反映時間：通常1～2営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共有されません。リリース前に必ず接続先URLが本番環境のURLに切り替わっていることを確認してください。<\/p><p><br><\/p><p>4. 「事前準備忘れ」による一般的なエラー信号<\/p><p>- `KEY10001 旅行会社API接続IPではありません` → IPホワイトリストが未設定、または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIVが不正確、またはサンプルのまま<\/p><p>- `KEY10009 旅行会社の統一編番号データが取得できません` → MerchantIDが誤っている、または有効化されていない<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"無効化プロセス－無効化待ち"}]},"apis":[{"name":"無効データトリガーまたはキャンセルAPI","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行会社統一編番号","example":"54352706","must_return":false,"note":"旅行会社統一編番号。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールド結合後にAES256で暗号化。フィールド説明は下表を参照","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_に含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"接続プログラムバージョン","example":"1.0","must_return":false,"note":"固定で1.0を指定","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unixタイムスタンプ（秒）。1970-01-01 00:00:00 UTCからの経過秒数。\n例：2014-05-15 15:00:00 の場合、タイムスタンプは 1400137200。現在時刻を入れることを推奨します。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"無効化トリガー状態","example":"1","must_return":false,"note":"1 = 無効化を確認。\n2 = 無効化を取り消す。","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"無効伝票連番","example":"586","must_return":false,"note":"無効化待ち発行時にシステムが返した無効伝票の連番。","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システム応答メッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"戻り値ステータス","example":"SUCCESS","must_return":true,"note":"1.無効伝票発行成功時、SUCCESSを返信\n2.無効伝票発行失敗時、エラーコードを返信","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"戻り値メッセージ","example":"成功","must_return":true,"note":"テキスト、今回の返信状態の説明","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"旅行会社コード","example":"70565326","must_return":false,"note":"旅行会社統一編番号","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"無効伝票連番","example":"8294","must_return":false,"note":"今回の無効化発行または無効化取り消しの無効伝票連番。","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671008","must_return":false,"note":"今回の無効化領収書または無効化待ち領収書の番号。","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"今回のデータ返信の妥当性チェック用。接続時にこのパラメータを照合してプラットフォームからの返信か確認可能。検証方法は「SHA256暗号化説明」を参照。発行失敗時は空値を返信。\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256署名仕様に基づき計算したハッシュ値\n\n領収書発行時に返される InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo を保存し、後の CheckCode 検証に使用する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定で ## を返信。String方式でデータを受信する場合、EndStr=## を判定してデータの完全性を確保する必要があります。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行会社API接続IPではありません"},{"code":"KEY10002","reason":"データ復号化エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不完全"},{"code":"KEY10006","reason":"旅行会社が電子領収書の利用を申請していません"},{"code":"KEY10007","reason":"ページ滞在時間が30分を超過"},{"code":"KEY10009","reason":"旅行会社統一編番号のデータが取得できません"},{"code":"KEY10010","reason":"旅行会社統一編番号が空です"},{"code":"KEY10011","reason":"PostData_フィールドが空です"},{"code":"KEY10012","reason":"データ送信エラー"},{"code":"KEY10013","reason":"データが空です"},{"code":"KEY10014","reason":"TimeOut。通常はI/Oのタイムアウト"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10019","reason":"旅行会社の権利が停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"INV10015","reason":"フィールドデータ長に誤りがあります"},{"code":"LIB10001","reason":"この領収書は正常に発行されたものではありません"},{"code":"LIB10002","reason":"経辨名称（事業者名）が未入力です"},{"code":"LIB10004","reason":"無効化確認の方法が正しくありません"},{"code":"LIB10005","reason":"領収書はすでに無効化されています"},{"code":"LIB10006","reason":"無効化トリガー状態が正しくありません"},{"code":"LIB10007","reason":"この領収書はすでに領収書値引き（アローワンス）が実行されており、無効化できません"},{"code":"LIB10008","reason":"無効化期限を超過しました"},{"code":"LIB10009","reason":"該当する無効データがありません"},{"code":"LIB10010","reason":"その無効データはすでに取り消されています"},{"code":"LIB10011","reason":"その無効データは状態が無効化失敗のため、再度無効化することはできません"}],"versions":[]},

(key=value&key2=value2...)으로 조합합니다.","enc_step2_title":"AES 암호화","enc_step2_desc":"암호화 알고리즘: <span class=\"font-bold text-red-600\">AES-256-CBC<\/span><br>패딩 모드 (Padding): <span class=\"font-bold text-red-600\">PKCS7 B32<\/span><br>출력 형식: <span class=\"font-bold text-red-600\">Hex 16진수<\/span><br>Key / IV: 업체 소속의 Hash Key와 Hash IV를 사용하십시오.","enc_step3_title":"16진수(Hex) 변환","enc_step3_desc":"암호화된 이진 데이터(Raw Data)를 Hex String(소문자)으로 변환하면 암호화된 문자열이 됩니다.","enc_sha_title":"SHA256 체크섬 메커니즘 (CheckMacValue)","enc_sha_desc":"SHA256 해시를 통해 체크섬을 생성하여 요청 파라미터 또는 반환값의 무결성을 검증하는 데 사용할 수 있습니다.","enc_sha_step1_title":"파라미터 정렬 및 조합","enc_sha_step1_desc":"지정된 파라미터를 영문 이름(A-Z)순으로 정렬하고 Query String(key1=val1&key2=val2...)으로 조합합니다.","enc_sha_step2_title":"IV 및 Key 연결","enc_sha_step2_desc":"정렬된 문자열 앞뒤에 각각 HashIV와 HashKey를 연결합니다.<br>형식: <code>HashIV=...&[SortedParams]&HashKey=...<\/code>","enc_sha_step3_title":"SHA256 암호화 및 대문자 변환","enc_sha_step3_desc":"연결된 문자열을 SHA256으로 암호화한 후, 결과를<strong>대문자<\/strong>로 변환합니다.","res_title":"반환 파라미터 (Response)","err_title":"오류 코드 표","err_search_ph":"코드 검색...","th_err_code":"오류 코드","th_err_reason":"오류 원인 / 비고","example_title":"예제 코드","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"정의된 파라미터 없음","msg_code_unavailable":"// 아직 프로그램 예제 없음","nav_versions":"버전 기록","versions_title":"버전 기록","th_ver_version":"버전 번호","th_ver_date":"수정일","th_ver_desc":"변경 내용","toc_title":"목차","api_info_title":"API 기본 정보","field_def_title":"API 필드 정의","doc_desc_title":"문서 설명","doc_flowchart_title":"플로우차트","lbl_launch_type":"실행 형태","lbl_field_combo_format":"필드 조합 형식","lbl_enum_values":"허용 값","lbl_default_value":"기본값","lbl_is_nullable":"Null 허용 여부","lbl_yes":"예","lbl_direction":"방향","lbl_group_type":"암호화 방식","lbl_location":"전달 위치","lbl_belong_to":"소속","msg_req_info":"본 요청은 상점에서 시작해야 하며, <span class=\\\"font-bold text-blue-700\\\">{method}<\/span> 방식을 사용하여 파라미터를 패키징한 후 <span class=\\\"font-bold text-blue-700\\\">{location}<\/span>으로 ">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열을 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영문, 숫자, 기호 모두 1문자로 계산합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 '&amp;'를 연결 기호로 사용하며, 각 필드 내에는 해당 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"운영 규정","desc":"<p>1. 영수증이 무효화 가능 기간(발행 후 다음 홀수 달 15일 이전)을 초과한 경우, 직접 확정 동작을 실행할 수 없습니다.<\/p><p>2. 이미 확정된 무효 데이터는 다시 확정할 수 없습니다.<\/p><p>3. 무효 확인 대기 데이터 취소는 기간 제한이 없습니다.<\/p>"},{"id":"section-3","title":"용어 정의","desc":"<p>무효 전표: 영수증을 무효화할 때마다 개별 무효 기록이 생성되며, 이를 무효 전표 또는 무효 데이터라고 합니다.<\/p><p>무효 대기: 소비자가 무효화에 동의하기 전까지 영수증은 여전히 유효 상태이며, 이때의 무효 전표를 무효 대기라고 합니다.<\/p>"},{"id":"section-4","title":"연동 사전 작업","desc":"<p>(반드시 완료하십시오. 그렇지 않으면 프로그램 실행이 실패합니다.)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 영역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p>- 운영 환경: 운영 영역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey와 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 양식을 다운로드하여 작성 후 고객센터로 전송 (팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 필요 정보: 서버 외부 IP (내부망 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 보통 1-2 영업일 소요<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 운영 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 상용화 전 반드시 연동 URL이 운영 영역 URL로 전환되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 자주 발생하는 '사전 작업 미수행' 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP 아님` → IP 화이트리스트 미설정 또는 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 부정확하거나 여전히 예제값임<\/p><p>- `KEY10009 여행사 사업자 번호 데이터 획득 불가` → MerchantID 오류 또는 미활성화<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"무효화 발행 절차－무효 대기"}]},"apis":[{"name":"무효 데이터 트리거 또는 취소 API","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 번호","example":"54352706","must_return":false,"note":"여행사 사업자 번호입니다.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 포함 필드","group_type":"AES 암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0으로 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 1970-01-01 00:00:00 UTC부터 현재까지의 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200, 현재 시간을 입력하는 것을 권장","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"무효 상태 트리거","example":"1","must_return":false,"note":"1 = 무효 확정.\n2 = 무효 취소.","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"무효 전표 일련번호","example":"586","must_return":false,"note":"무효 대기 상태 생성 시 시스템이 응답한 무효 전표 일련번호.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 무효 전표 생성 성공 시 SUCCESS 반환\n2. 무효 전표 생성 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"텍스트, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"70565326","must_return":false,"note":"여행사 사업자 번호","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"무효 전표 일련번호","example":"8294","must_return":false,"note":"이번 무효 생성 또는 무효 취소의 무효 전표 일련번호.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 무효화된 영수증 또는 무효 대기 중인 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"체크섬","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"데이터 반환의 적법성 검증용, 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환된 것인지 확인 가능. 검증 방법은 'SHA256 암호화 설명' 참조. 생성 실패 시 빈 값 반환.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\n영수증 발행 시 반환된 InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo는 추후 CheckCode 검증을 위해 프로그램에 직접 저장해야 함.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 끝","example":"##","must_return":true,"note":"##로 고정 반환, String 방식으로 데이터를 수신하는 사용자는 EndStr=##인지 확인하여 데이터 전송이 완전한지 확인해야 함.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"여행사 API 연동 IP 아님"},{"code":"KEY10002","reason":"데이터 복호화 오류"},{"code":"KEY10003","reason":"버전 오류"},{"code":"KEY10004","reason":"데이터 불완전"},{"code":"KEY10006","reason":"여행사 전자 영수증 서비스 미신청"},{"code":"KEY10007","reason":"페이지 체류 시간 30분 초과"},{"code":"KEY10009","reason":"여행사 사업자 번호 데이터 획득 불가"},{"code":"KEY10010","reason":"여행사 사업자 번호 공란"},{"code":"KEY10011","reason":"PostData_ 필드 공란"},{"code":"KEY10012","reason":"데이터 전송 오류"},{"code":"KEY10013","reason":"데이터 공란"},{"code":"KEY10014","reason":"TimeOut. 일반적으로 I/O 타임아웃을 의미"},{"code":"KEY10015","reason":"영수증 금액 형식 오류"},{"code":"KEY10019","reason":"여행사 서비스 이용 정지"},{"code":"NOR10001","reason":"네트워크 연결 이상"},{"code":"INV10015","reason":"필드 데이터 길이 오류"},{"code":"LIB10001","reason":"정상적으로 발행되지 않은 영수증"},{"code":"LIB10002","reason":"영문 이름 미작성"},{"code":"LIB10004","reason":"무효 확정 방식 오류"},{"code":"LIB10005","reason":"이미 무효화된 영수증"},{"code":"LIB10006","reason":"무효 상태 트리거 오류"},{"code":"LIB10007","reason":"이미 에누리(할인) 처리된 영수증, 무효화 불가"},{"code":"LIB10008","reason":"무효화 가능 기간 초과"},{"code":"LIB10009","reason":"해당 무효 데이터 없음"},{"code":"LIB10010","reason":"이미 취소된 무효 데이터"},{"code":"LIB10011","reason":"무효 실패 상태의 데이터, 재무효화 불가"}],"versions":[]},

aväxlingsmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvittoinformation till den elektroniska kvittoplattformen via \"HTTP POST\".<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvittoplattformen svarar med en formaterad sträng.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas som ett tecken.<\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&amp;\", och varje fält får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Arbetsföreskrifter","desc":"<p>1. Om kvittot har passerat tidsfristen för ogiltigförklaring (före den 15:e i månaden efter utfärdandet), kan direkt bekräftelse inte utföras.<\/p><p>2. Redan bekräftad ogiltigförklarad data kan inte bekräftas igen.<\/p><p>3. Det finns ingen tidsfrist för att avbryta väntande ogiltigförklaring.<\/p>"},{"id":"section-3","title":"Definition av begrepp","desc":"<p>Ogiltigförklaringssedel: Varje gång ett kvitto ogiltigförklaras skapas en separat post, kallad ogiltigförklaringssedel eller ogiltigförklarad data.<\/p><p>Väntar på ogiltigförklaring: Innan konsumenten godkänner ogiltigförklaringen är kvittot fortfarande giltigt. Denna ogiltigförklaringssedel kallas \"väntar på ogiltigförklaring\".<\/p>"},{"id":"section-4","title":"Förberedelser för anslutning","desc":"<p>(Vänligen slutför detta först, annars kommer programmet definitivt att misslyckas)<\/p><p><br><\/p><p> 1. Skaffa HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testbackoffice → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsbackoffice → Grundläggande information → API-anslutningsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlista<\/p><p>- Ansökningskanal: Ladda ner formuläret från webbplatsen, fyll i och skicka till kundtjänst (fax / e-post)<\/p><p>- Upp till 10 IP-grupper kan ställas in<\/p><p>- Obligatoriskt: Serverns externa IP (inte internt IP, kan kontrolleras via https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljö och produktionsmiljö är helt olika enheter, data delas inte. Innan driftsättning, se till att anslutnings-URL:en har växlats till produktionsmiljöns URL.<\/p><p><br><\/p><p>4. Vanliga fel på grund av \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte ett IP för resebyråns API-anslutning` → IP-vitlista ej inställd eller felaktig<\/p><p>- `KEY10002 Fel vid datadekryptering` → HashKey / HashIV felaktig eller fortfarande exempelvärde<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID felaktigt eller ej aktiverat<\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Process för ogiltigförklaring - Väntar på ogiltigförklaring"}]},"apis":[{"name":"API för att utlösa eller avbryta ogiltigförklarad data","url_test":"https://capi.travelinvoice.com.tw/invalid_touch_issue","url_prod":"https://api.travelinvoice.com.tw/invalid_touch_issue","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Efter att fälten kombinerats till en sträng utförs AES256-kryptering, fältförklaring enligt tabellen nedan","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"API-programversion","example":"1.0","must_return":false,"note":"Fast värde 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder från 1970-01-01 00:00:00 UTC till nu. Exempel: 2014-05-15 15:00:00 har tidsstämpeln 1400137200, det rekommenderas att använda aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidStatus","required":"V","type":"int(1)","label":"Status för ogiltigförklaring","example":"1","must_return":false,"note":"1 = Bekräfta ogiltigförklaring.\n2 = Avbryt ogiltigförklaring.","enum_values":"1,2","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"Löpnummer för ogiltigförklaring","example":"586","must_return":false,"note":"Löpnumret för ogiltigförklaring som systemet returnerade vid skapande.","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returnerad status","example":"SUCCESS","must_return":true,"note":"1. Om ogiltigförklaringen lyckades returneras SUCCESS\n2. Om ogiltigförklaringen misslyckades returneras felkoden","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returnerat meddelande","example":"Framgång","must_return":true,"note":"Text, förklaring av returstatus","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Resebyråns kod","example":"70565326","must_return":false,"note":"Resebyråns organisationsnummer","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Löpnummer för ogiltigförklaring","example":"8294","must_return":false,"note":"Löpnumret för den aktuella ogiltigförklaringen eller avbrottet.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671008","must_return":false,"note":"Kvittonumret för det ogiltigförklarade kvittot.","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"12C6AC3A3EEDD074B01ECB3D5731579EB75D83FB8A31907F0D1C564468AD8C49","must_return":false,"note":"Används för att kontrollera legitimiteten i den returnerade datan. Vid anslutning kan du jämföra denna parameter för att verifiera om det returnerades av plattformen. Se \"SHA256-krypteringsförklaring\" för kontrollmetod. Om det misslyckas returneras ett tomt värde.\n\nCheckCode = Hash-värdet beräknat enligt SHA256-signeringsspecifikationen från InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt.\n\nDu måste själv spara InvoiceTransNo, RandomNum, TotalAmt, MerchantOrderNo som returnerades vid kvittoutfärdandet för framtida CheckCode-verifiering.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängavslut","example":"##","must_return":true,"note":"Fast värde ##. Användare som tar emot data via sträng måste kontrollera om EndStr=## för att säkerställa att dataöverföringen är komplett.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte ett IP för resebyråns API-anslutning"},{"code":"KEY10002","reason":"Fel vid datadekryptering"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullst Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLength = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLength % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $encrypted = openssl_encrypt($paddedPlaintext, 'AES-256-CBC', $key, OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING, $iv);\n    if ($encrypted === false) {\n        throw new Exception('Encryption operation failed in OpenSSL routine.');\n    }\n    return bin2hex($encrypted);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Reconstructs and verifies the CheckCode signature returned in the API response payload.\n *\n * @param string $invoiceTransNo Invoice internal transaction number from database\n * @param string $merchantId Travel agency tax ID (Merchant ID)\n * @param string $merchantOrderNo Original merchant system order number\n * @param string $randomNum Original random parameter assigned to the transaction\n * @param string $totalAmt Original transaction receipt amount\n * @param string $expectedSignature The CheckCode signature received in the server response\n * @param string $key The HashKey\n * @param string $iv The HashIV\n * @return bool True if verification passes, false otherwise\n */\nfunction verify_response_signature($invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $expectedSignature, $key, $iv) {\n    $raw = 'HashIV=' . $iv . '&InvoiceTransNo=' . $invoiceTransNo . '&MerchantID=' . $merchantId . '&MerchantOrderNo=' . $merchantOrderNo . '&RandomNum=' . $randomNum . '&TotalAmt=' . $totalAmt . '&HashKey=' . $key;\n    $calculated = strtoupper(hash('sha256', $raw));\n    return hash_equals($calculated, $expectedSignature);\n}\n\n// Initialize processing states\n$apiResponse = null;\n$processingError = null;\n$isSignatureValid = null;\n\n// Handle submission requests\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    try {\n        $invalidStatus = isset($_POST['invalid_status']) ? (int)$_POST['invalid_status'] : 1;\n        $invalidNo = isset($_POST['invalid_no']) ? trim((string)$_POST['invalid_no']) : '';\n\n        if ($invalidNo === '') {\n            throw new Exception('The invalidation document flow number (InvalidNo) is a required parameter.');\n        }\n\n        // Construct request payload fields array\n        $postDataParams = [\n            'Version' => '1.0',\n            'TimeStamp' => (string)time(),\n            'InvalidStatus' => (string)$invalidStatus,\n            'InvalidNo' => $invalidNo\n        ];\n\n        // Combine into standard raw querystring without URL encoding transformation\n        $plaintextParts = [];\n        foreach ($postDataParams as $key => $value) {\n            $plaintextParts[] = $key . '=' . $value;\n        }\n        $plaintextPayload = implode('&', $plaintextParts);\n\n        // Encrypt the formatted payload\n        $encryptedPostData = encrypt_aes_256_cbc_b32($plaintextPayload, API_KEY, API_IV);\n\n        // Configure network handle for transmission\n        $ch = curl_init($apiUrl);\n        if ($ch === false) {\n            throw new Exception('Could not initialize curl session resource.');\n        }\n\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query([\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedPostData\n        ]));\n\n        $rawResponse = curl_exec($ch);\n        if ($rawResponse === false) {\n            $errorDetail = curl_error($ch);\n            throw new Exception('Connection failed while communicating with the API host: ' . $errorDetail);\n        }\n\n        $httpStatusCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n        if ($httpStatusCode !== 200) {\n            throw new Exception('Server returned unfavorable HTTP status code: ' . $httpStatusCode);\n        }\n\n        // Parse response content from API string structure\n        $parsedResponse = [];\n        parse_str($rawResponse, $parsedResponse);\n\n        $apiResponse = [\n            'Status' => $parsedResponse['Status'] ?? '',\n            'Message' => $parsedResponse['Message'] ?? '',\n            'MerchantID' => $parsedResponse['MerchantID'] ?? '',\n            'InvalidNo' => $parsedResponse['InvalidNo'] ?? '',\n            'InvoiceNumber' => $parsedResponse['InvoiceNumber'] ?? '',\n            'CheckCode' => $parsedResponse['CheckCode'] ?? '',\n            'EndStr' => $parsedResponse['EndStr'] ?? ''\n        ];\n\n        // Enforce basic protocol integrity verification\n        $isResponseComplete = (substr($rawResponse, -2) === '##') || ($apiResponse['EndStr'] === '##');\n        if (!$isResponseComplete) {\n            throw new Exception('The received response package was truncated or did not end with the expected EndStr indicator.');\n        }\n\n        // Decode specific code meanings if not SUCCESS\n        if ($apiResponse['Status'] !== 'SUCCESS') {\n            $apiResponse['StatusDescription'] = $errorMap[$apiResponse['Status']] ?? 'Unknown API system error returned.';\n        }\n\n        // Verify CheckCode response signature if matching reference transaction parameters are supplied in user interface\n        $verifyTransNo = isset($_POST['v_invoice_trans_no']) ? trim((string)$_POST['v_invoice_trans_no']) : '';\n        $verifyOrderNo = isset($_POST['v_merchant_order_ onse['Status']); ?><\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($apiResponse['Status']); ?><\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <td>Response Message (Message)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['Message']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Merchant Agency ID (MerchantID)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['MerchantID']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Void Document Flow Number (InvalidNo)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['InvalidNo']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Target Invoice Number (InvoiceNumber)<\/td>\n                    <td><?php echo htmlspecialchars($apiResponse['InvoiceNumber']); ?><\/td>\n                <\/tr>\n                <tr>\n                    <td>Integrity Delimiter (EndStr)<\/td>\n                    <td><code><?php echo htmlspecialchars($apiResponse['EndStr']); ?><\/code><\/td>\n                <\/tr>\n                <tr>\n                    <td>Received Signature CheckCode<\/td>\n                    <td><small><code><?php echo htmlspecialchars($apiResponse['CheckCode']); ?><\/code><\/small><\/td>\n                <\/tr>\n                <?php if ($isSignatureValid !== null): ?>\n                <tr>\n                    <td>Signature Verification Result<\/td>\n                    <td>\n                        <?php if ($isSignatureValid): ?>\n                            <span class=\"badge badge-success\">VALID SIGNATURE<\/span>\n                            <span style=\"font-size: 13px; color: #27ae60; margin-left: 10px;\">The returned signature matches calculations and database parameters securely.<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\">SIGNATURE INVALID<\/span>\n                            <span style=\"font-size: 13px; color: #c0392b; margin-left: 10px;\">The returned signature does not match generated validation data. Check parameters.<\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <?php endif; ?>\n            <\/table>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);

            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {

                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);

                                    desc += ' ' + colsHtml;

                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateTableRows(dataArray, ui) {
            var lblEnum = ui.lbl_enum_values || '允許值';

                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');

                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');

                var extraHtml = '';

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>

                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function openLightbox(url) { 
            document.getElementById('lightbox-image').src = url; 
            document.getElementById('lightbox-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        }
        function closeLightbox() { 
            document.getElementById('lightbox-modal').classList.add('hidden'); 
            document.body.style.overflow = ''; 
        }

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
    </script>
