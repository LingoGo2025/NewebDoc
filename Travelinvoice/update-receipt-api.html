(0, 0, 0);\">5. 各欄位計算單位為字元。中、英、數字、符號都算一個字元。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各欄位間以「&amp;」作為連接符號，各欄位內不得含有此字元（U+0026）。<\/span><\/p>","images":[]},{"id":"section-2","icon":"fas fa-info-circle","markerColor":"bg-green-600","title":"串接前置作業","desc":"<p>（請先完成，否則程式必失敗）<\/p><p><br><\/p><p> 1. 取得 HashKey / HashIV<\/p><p>- 測試環境：登入測試區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p>- 正式環境：登入正式區後台 → 基本資料 → API 串接設定 → 複製 HashKey 與 HashIV<\/p><p><br><\/p><p>2. 申請 IP 白名單<\/p><p>- 申請窗口：於官網下載申請表單並填寫後，傳送後客服中心（傳真 / Email）<\/p><p>- 最多可設定 10 組 IP<\/p><p>- 需提供：伺服器對外 IP（非內網 IP，可至 https://ifconfig.me 查詢）<\/p><p>- 生效時間：通常 1-2 個工作天<\/p><p><br><\/p><p>3. 環境網址<\/p><p>-測試環境與正式環境是完全不同的設備，資料不共通，上線前務必要確認已經將串接網址切換至正式區網址<\/p><p><br><\/p><p>4. 常見「忘記做前置作業」的錯誤訊號<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP 白名單未設定或設錯<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV 不正確或仍是範例值<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID 錯或未啟用<\/p><p><br><\/p>","images":[]}],"flowcharts":[{"id":"flowchart-0","title":"變更收據流程"}]},"apis":[{"name":"變更收據API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post 參數","direction":"send","group_type":"無加密","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社統一編號","example":"54352706","must_return":false,"note":"旅行社統一編號。","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"加密資料","example":"","must_return":false,"note":"字串欄位組合後做AES256加密，欄位說明如下表","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_內含欄位","group_type":"AES加密_字串","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"串接程式版本","example":"1.0","must_return":false,"note":"固定帶 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","re se,"note":"用來檢查此次資料回傳的合法性，串接時可以比對此參數資料，來檢核是否為平台所回傳，檢核方法請參考”SHA256加密說明”。如開立失敗則回傳空值。\n\nCheckCode = 將 InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt 依 SHA256 簽章規格計算所得之雜湊值\n\nInvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt不含在此API回應欄位中，需程式自行保存開立收據時回傳的 InvoiceTransNo ,MerchantOrderNo,RandomNum, TotalAmt，供日後 CheckCode 驗證使用。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"字串結尾","example":"##","must_return":true,"note":"固定回傳 ##，使用 String 方式接收資料的用戶，須多判斷 EndStr=##，確保資料傳遞完整。","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"非旅行社 API 串接 IP"},{"code":"KEY10002","reason":"資料解密錯誤"},{"code":"KEY10003","reason":"版本錯誤"},{"code":"KEY10004","reason":"資料不齊全"},{"code":"KEY10006","reason":"旅行社未申請啟用電子收據"},{"code":"KEY10007","reason":"頁面停留超過 30 分鐘"},{"code":"KEY10009","reason":"取不到旅行社統一編號的資料"},{"code":"KEY10010","reason":"旅行社統一編號空白"},{"code":"KEY10011","reason":"PostData_欄位空白"},{"code":"KEY10012","reason":"資料傳遞錯誤"},{"code":"KEY10013","reason":"資料空白"},{"code":"KEY10014","reason":"TimeOut。通常泛指 I/O 上的 time out"},{"code":"KEY10015","reason":"收據金額格式錯誤"},{"code":"KEY10016","reason":"旅行社無申請郵遞列印加值服務"},{"code":"KEY10017","reason":"郵遞列印加值服務可用數不足"},{"code":"KEY10018","reason":"開立人欄位未填寫"},{"code":"KEY10019","reason":"旅行社已被停權"},{"code":"NOR10001","reason":"網路連線異常"},{"code":"INV20014","reason":"統一編號格式有誤"},{"code":"INV20015","reason":"買受人統編未填寫"},{"code":"INV20016","reason":"買受人名稱未填寫"},{"code":"INV20018","reason":"預約出團日期格式不正確"},{"code":"INV20100","reason":"資料庫發生嚴重錯誤"},{"code":"INV20101","reason":"申報註記錯誤"},{"code":"INV20102","reason":"團名欄位超過字數限制，請縮短字數。"},{"code":"INV20103","reason":"團號欄位超過字數限制，請縮短字數。"},{"code":"INV20104","reason":"團名欄位中有特殊符號，如\"\" ' & < >，請移除。"},{"code":"INV20105","reason":"團號欄位中有特殊符號，如\"\" ' & < >，請移除。"},{"code":"ED10001","reason":"預約出團日期格式不正確"},{"code":"ED10002","reason":"申報註記輸入有誤"},{"code":"ED10006","reason":"預計出團日期不可大於兩年"},{"code":"ED tle":"Return Parameters (Response)","err_title":"Error Code Table","err_search_ph":"Search code...","th_err_code":"Error Code","th_err_reason":"Error Reason / Note","example_title":"Example Code","lbl_method":"Method","lbl_encrypted_tag":"AES-256-CBC Encrypted","lbl_api_index":"API","msg_no_params":"No parameters defined","msg_code_unavailable":"// No code example available","nav_versions":"Version History","versions_title":"Version History","th_ver_version":"Version","th_ver_date":"Modified Date","th_ver_desc":"Changes","toc_title":"Table of Contents","api_info_title":"API Basic Information","field_def_title":"API Field Definitions","doc_desc_title":"Document Description","doc_flowchart_title":"Flowchart","lbl_launch_type":"Trigger Type","lbl_field_combo_format":"Field Combination Format","lbl_enum_values":"Allowed Values","lbl_default_value":"Default Value","lbl_is_nullable":"Nullable","lbl_yes":"Yes","lbl_direction":"Direction","lbl_group_type":"Encryption Method","lbl_location":"Location","lbl_belong_to":"Belongs to","msg_req_info":"This request must be initiated by the merchant. Please package the parameters and transmit them to <span class=\\\"font-bold text-blue-700\\\">{location}<\/span> via <span class=\\\"font-bold text-blue-700\\\">{method}<\/span>.","msg_req_format_qs":"Fields in this block need to be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"Fields in this block need to be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_req_format_other":"Fields in this block use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_req_security":"Data Security: <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required before transmission.","msg_res_info_webhook":"The result will be actively pushed by the system in asynchronous form to the <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> receiving URL specified by the merchant.","msg_res_info_sync":"The result will be returned synchronously by the system to <span class=\\\"font-bold text-green-700\\\">{location}<\/span> via <span class=\\\"font-bold text-green-700\\\">{method}<\/span>.","msg_res_format_qs":"Returned fields will be combined into a Query String format using the <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> symbol, e.g., <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"Returned fields will be passed within a <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> object.","msg_res_format_other":"Returned fields use the <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> format.","msg_res_security":"Verification & Decryption: After receipt, <span class=\\\"font-bold\\\">{group_type}<\/span> processing is required for specific data.","lbl_sha_pre_hash":"Combined string before encryption (String to Hash)","ph_sha_pre_hash":"After clicking the hash button, the complete string actually being encrypted will be displayed here...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_1.png"},"meta":{"title":"Modify Receipt API","subtitle":"Modify Receipt Issuance Data","version":"","sections":[{"id":"section-0","title":"Integration Purpose","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Provide a mechanism for members of various travel associations to modify electronic receipts through program integration. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. This platform does not provide media reporting mechanisms or operations; travel agencies should handle relevant matters themselves. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Before integration, please contact the customer service center to apply for IP settings. The number of IP groups that can be set is: 10 groups.<\/span><\/p>"},{"id":"section-1","title":"Data Exchange Method","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Travel agencies send receipt data to the electronic receipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Each field's calculation unit is a character. Chinese, English, numbers, and symbols all count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Each field is connected by \"&\", and fields must not contain this character (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Tasks","desc":"<p>(Please complete these first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test environment: Log in to the test area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production environment: Log in to the production area backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application window: Download the application form from the official website, fill it out, and send it to the customer service center (Fax / Email)<\/p><p>- Up to 10 IP groups can be set<\/p><p>- Required info: Server outgoing IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Processing time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test and production environments are completely different; data is not shared. Before going live, ensure the integration URL has been switched to the production URL.<\/p><p><br><\/p><p>4. Common \"Forgot Pre-integration Tasks\" Error Signals<\/p><p>- `KEY10001 Not a travel agency API integration IP` → IP whitelist not set or incorrect<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV incorrect or still using example values<\/p><p>- `KEY10009 Unable to retrieve travel agency UBN data` → MerchantID wrong or not enabled<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Modify Receipt Flow"}]},"apis":[{"name":"Modify Receipt API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency UBN","example":"54352706","must_return":false,"note":"Travel agency unified business number.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"Field combinations encrypted via AES256. Field descriptions follow in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Content Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.0","must_return":false,"note":"Fixed at 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), the number of seconds since 1970-01-01 00:00:00 UTC.\nExample: For 2014-05-15 15:00:00, the timestamp is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Receipt Number","example":"T13671007","must_return":false,"note":"The receipt number for which the allowance is being issued.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Receipt Category","example":"B2B","must_return":false,"note":"B2B = Buyer is a business entity (UBN required).\nB2C = Buyer is an individual.\n1. Receipt modification is limited to once (Modifiable fields: Category, Buyer Name, Buyer UBN).\n2. Leave blank or omit this field to keep data unchanged.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao-Yi","must_return":false,"note":"1. Buyer name, individual name, or business entity name.\n2. Receipt modification is limited to once (Modifiable fields: Category, Buyer Name, Buyer UBN).\n3. Required and cannot be null when Category changes from B2C to B2B.\n4. Leave blank or omit this field to keep data unchanged.\n5. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. Buyer (business entity) UBN, numbers only.\n2. Not required if the buyer is an individual.\n3. Receipt modification is limited to once (Modifiable fields: Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address).\n4. Required and cannot be null when Category changes from B2C to B2B.\n5. The system clears the original value when Category changes from B2B to B2C.\n6. Leave blank or omit this field to keep data unchanged.\n7. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"1. Buyer's mobile phone number.\n2. Leave blank or omit this field to keep data unchanged.\n3. Receipt modification is limited to once (Modifiable fields: Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address).\n4. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F., No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"1. Buyer's address.\n2. Leave blank or omit this field to keep data unchanged.\n3. Receipt modification is limited to once (Modifiable fields: Category, Buyer Name, Buyer UBN, Buyer Phone, Buyer Address).\n4. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Comment","example":"Flight Ticket","must_return":false,"note":"1. Comments for the receipt.\n2. Leave blank or omit this field to keep data unchanged.\n3. Unlimited modifications.\n4. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"1. Unlimited modifications.\n2. To clear this field, enter *[clean]*\n3. Full-width/half-width Chinese, English, numbers, symbols, and spaces all count as one character.\n4. Line breaks and the following symbols are not accepted: Double quote \"| Single quote ' | Ampersand & | and < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour No","example":"Ba023355","must_return":false,"note":"1. Unlimited modifications.\n2. To clear this field, enter *[clean]*\n3. Line breaks and the following symbols are not accepted: Double quote \"| Single quote ' | Ampersand & | and < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Expected Tour Date","example":"2014-10-05","must_return":false,"note":"1. Format: YYYY-MM-DD. Example: 2014-10-05\n2. The expected tour date must not be more than two years after the actual issuance date of the receipt.\n3. Unlimited modifications.\n4. To clear this field, enter *[clean]*","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Reporting Note","example":"0","must_return":false,"note":"0 = Not reported\n1 = Reported\nLeave blank or omit to keep data unchanged.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"System Response Message","direction":"receive","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Return Status","example":"SUCCESS","must_return":true,"note":"1. If receipt issuance is successful, returns SUCCESS\n2. If issuance fails, returns error code","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Return Message","example":"Success","must_return":true,"note":"Text description of the return status","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"Travel Agency ID","example":"54352706","must_return":false,"note":"Travel agency UBN","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Receipt Number","example":"T13671008","must_return":false,"note":"The receipt number for the issued receipt","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"Buyer Name","example":"Wang Xiao-Yi","must_return":false,"note":"The buyer name at issuance, individual name or business name.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"Buyer UBN","example":"54352706","must_return":false,"note":"1. If B2B receipt, this field is the buyer UBN.\n2. If B2C receipt, this field is null.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"Buyer Phone","example":"0922123456","must_return":false,"note":"Buyer's mobile phone number.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"Buyer Address","example":"8F., No. 97, Sec. 2, Nangang Rd., Nangang Dist., Taipei City","must_return":false,"note":"Buyer's address.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"Comment","example":"Flight Ticket","must_return":false,"note":"Comments for the receipt.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"Tour Name","example":"Hokkaido 5-Day Tour","must_return":false,"note":"Tour name for the receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"Tour No","example":"Ba023355","must_return":false,"note":"Tour number for the receipt","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"Expected Tour Date","example":"2014-10-05","must_return":false,"note":"Tour date for the receipt. A reporting reminder notification will be sent to the designated email on this date.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"Reporting Note","example":"0","must_return":false,"note":"The reporting note field for the receipt.\n0 = Not reported\n1 = Reported","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(50)","label":"Check Code","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Used to check the legality of the returned data. During integration, you can compare this parameter to verify if it was returned by the platform. Please refer to the 'SHA256 Encryption Instructions' for the verification method. Returns null if issuance fails.\n\nCheckCode = Hash value calculated from InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt according to SHA256 signature specifications.\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, and TotalAmt are not included in this API response. The program must store the InvoiceTransNo, MerchantOrderNo, RandomNum, and TotalAmt returned during receipt issuance for future CheckCode verification.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"End of String","example":"##","must_return":true,"note":"Fixed return ##. Users receiving data via String must check EndStr=## to ensure complete data transfer.","enum_values":"##","default_value":"##","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Not a travel agency API integration IP"},{"code":"KEY10002","reason":"Data decryption error"},{"code":"KEY10003","reason":"Version error"},{"code":"KEY10004","reason":"Incomplete data"},{"code":"KEY10006","reason":"Travel agency has not applied to enable electronic receipts"},{"code":"KEY10007","reason":"Page stayed for more than 30 minutes"},{"code":"KEY10009","reason":"Unable to retrieve travel agency UBN data"},{"code":"KEY10010","reason":"Travel agency UBN is blank"},{"code":"KEY10011","reason":"PostData_ field is blank"},{"code":"KEY10012","reason":"Data transfer error"},{"code":"KEY10013","reason":"Data is blank"},{"code":"KEY10014","reason":"TimeOut. Generally refers to I/O timeout"},{"code":"KEY10015","reason":"Receipt amount format error"},{"code":"KEY10016","reason":"Travel agency has not applied for mail printing value-added service"},{"code":"KEY10017","reason":"Insufficient available quantity for mail printing value-added service"},{"code":"KEY10018","reason":"Issuer field not filled"},{"code":"KEY10019","reason":"Travel agency has been suspended"},{"code":"NOR10001","reason":"Abnormal network connection"},{"code":"INV20014","reason":"Unified Business Number format error"},{"code":"INV20015","reason":"Buyer UBN not filled"},{"code":"INV20016","reason":"Buyer Name not filled"},{"code":"INV20018","reason":"Expected tour date format is incorrect"},{"code":"INV20100","reason":"Severe database error"},{"code":"INV20101","reason":"Reporting note error"},{"code":"INV20102","reason":"Tour Name field exceeds character limit. Please shorten the text."},{"code":"INV20103","reason":"Tour No field exceeds character limit. Please shorten the text."},{"code":"INV20104","reason":"Special symbols found in Tour Name field, such as \"\" ' & < >. Please remove them."},{"code":"INV20105","reason":"Special symbols found in Tour No field, such as \"\" ' & < >. Please remove them."},{"code":"ED10001","reason":"Expected tour date format is incorrect"},{"code":"ED10002","reason":"Reporting note entry error"},{"code":"ED10006","reason":"Expected tour date cannot be more than two years away"},{"code":"ED10009","reason":"Data type error"},{"code":"ED10011","reason":"Data not modified"},{"code":"ED10012","reason":"When Category is B2B, Buyer UBN or Buyer Name cannot be empty"},{"code":"ED10013","reason":"This receipt has been uploaded to the Ministry of Finance's Financial Information Center! According to regulations, uploaded receipts cannot be modified."},{"code":"ED10014","reason":"This receipt has exceeded the modification deadline! The deadline for modification is 23:59:59 on the day before the start of the upload operation on the Integrated Service Platform on the 1st of every odd month. Receipts beyond this period cannot be modified as they have entered the upload processing stage."},{"code":"ED10015","reason":"Receipt content has been modified; this operation is legally limited to once. Please refer to the Change History feature above for detailed information."},{"code":"ED10016","reason":"The buyer has already printed this receipt! According to regulations, printed receipts cannot be modified."},{"code":"ED10017","reason":"The receipt status is cancelled or voided and cannot be modified"},{"code":"ED10018","reason":"Buyer Name exceeds character limit"},{"code":"ED10019","reason":"Buyer UBN format error"},{"code":"ED10020","reason":"Buyer Mobile exceeds character limit"},{"code":"ED10021","reason":"Buyer Address exceeds character limit"},{"code":"ED10022","reason":"Failed to add/modify history log"},{"code":"ED10023","reason":"Incorrect invoice type"},{"code":"ED10024","reason":"Comment exceeds character limit"}],"versions":[]},

tion}<\/span> に配置して送信してください。","msg_req_format_qs":"このセクションのフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わせる必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このセクションのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して送信する必要があります。","msg_req_format_other":"このセクションのフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：送信前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了する必要があります。","msg_res_info_webhook":"この結果は、システムから非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信URLにアクティブにプッシュされます。","msg_res_info_sync":"この結果は、システムから <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返されます。","msg_res_format_qs":"返却されるフィールドは、<span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号でクエリ文字列 (Query String) 形式に組み合わされます。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置されます。","msg_res_format_other":"返却されるフィールドは、<span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"検証・復号化：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"暗号化前組み合わせ文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_2.png"},"meta":{"title":"領収書変更API","subtitle":"領収書発行データの変更","version":"","sections":[{"id":"section-0","title":"接続目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 各旅行業協会傘下の会員がプログラム連携を通じて、電子領収書を変更する仕組みを提供します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 本プラットフォームは媒体申告に関連する仕組みや作業は提供していません。旅行社は各自で関連事項を処理してください。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 連携前にカスタマーセンターに連絡して IP 設定を申請してください。設定可能な IP 数は 10 個までです。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信し、発行を行います。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 文字コードは UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字数です。日本語、英語、数字、記号はいずれも1文字としてカウントされます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」を連結記号として使用します。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"接続前準備作業","desc":"<p>（必ず完了させてください。そうしないとプログラムは失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境管理画面にログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードし、記入後カスタマーセンターへ送信（FAX / メール）<\/p><p>- 最大 10 個の IP を設定可能<\/p><p>- 提出物：サーバーの外部 IP（内部 IP ではなく、https://ifconfig.me などで確認可能）<\/p><p>- 反映時間：通常 1-2 営業日<\/p><p><br><\/p><p>3. 環境URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共通していません。リリース前に必ず接続先 URL を本番環境に切り替えているか確認してください。<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラー信号<\/p><p>- `KEY10001 旅行社 API 接続 IP ではありません` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 データ復号化エラー` → HashKey / HashIV が不正確、またはサンプルのまま<\/p><p>- `KEY10009 旅行社統一編号のデータが見つかりません` → MerchantID が誤っているか、未有効化<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"領収書変更フロー"}]},"apis":[{"name":"領収書変更API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","la eq_format_qs":"이 섹션의 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합해야 합니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_req_format_json":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담아 전달해야 합니다.","msg_req_format_other":"이 섹션의 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_req_security":"데이터 보안: 전송 전에 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리가 완료되어야 합니다.","msg_res_info_webhook":"이 결과는 시스템에 의해 비동기식으로 상점이 지정한 <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 수신 URL로 자동 푸시됩니다.","msg_res_info_sync":"이 결과는 시스템에 의해 <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 방식으로 <span class=\\\"font-bold text-green-700\\\">{location}<\/span>에 동기적으로 반환됩니다.","msg_res_format_qs":"반환되는 필드는 <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 기호를 사용하여 쿼리 문자열(Query String) 형식으로 조합됩니다. 예: <span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>.","msg_res_format_json":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> 객체에 담겨 전달됩니다.","msg_res_format_other":"반환되는 필드는 <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 형식을 사용하여 조합됩니다.","msg_res_security":"검증 및 복호화: 수신 후 특정 데이터에 대해 <span class=\\\"font-bold\\\">{group_type}<\/span> 처리를 수행해야 합니다.","lbl_sha_pre_hash":"암호화 전 조합 문자열 (String to Hash)","ph_sha_pre_hash":"암호화 버튼을 누르면 실제 암호화될 전체 문자열이 여기에 표시됩니다...","flowchart_0_url":"assets/flowcharts_update-receipt-api/fc_3.png"},"meta":{"title":"영수증 변경 API","subtitle":"영수증 발행 데이터 변경","version":"","sections":[{"id":"section-0","title":"연동 목적","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 각 여행업 협회 회원사가 프로그램을 통해 전자 영수증을 변경할 수 있는 메커니즘을 제공합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. 본 플랫폼은 매체 신고와 관련된 메커니즘 및 작업을 제공하지 않으므로, 여행사는 직접 관련 사항을 진행해 주시기 바랍니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 연동 전 고객센터에 연락하여 IP 설정을 신청하십시오. 설정 가능한 IP 개수는 10개입니다.<\/span><\/p>"},{"id":"section-1","title":"데이터 교환 방식","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 여행사는 「HTTP POST」 방식으로 영수증 데이터를 전자 영수증 플랫폼으로 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자입니다. 한글, 영어, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이에는 「&amp;」를 연결 기호로 사용하며, 각 필드 내부에는 이 문자(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"연동 사전 작업","desc":"<p>(반드시 먼저 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 구역 백엔드 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 서식을 다운로드하여 작성 후 고객센터로 전송(팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제공 필요 사항: 서버 외부 IP(내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 적용 시간: 통상 영업일 기준 1-2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 오픈 전에 반드시 연동 URL을 실제 구역 URL로 전환했는지 확인하십시오.<\/p><p><br><\/p><p>4. 자주 발생하는 「사전 작업 누락」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 올바르지 않거나 여전히 샘플 값임<\/p><p>- `KEY10009 여행사 사업자 등록번호 데이터를 가져올 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"영수증 변경 프로세스"}]},"apis":[{"name":"영수증 변경 API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post 파라미터","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 등록번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록번호.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"암호화 데이터","example":"","must_return":false,"note":"문자열 필드 조합 후 AES256 암호화, 필드 설명은 아래 표 참조","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 내부 필드","group_type":"AES암호화_문자열","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"연동 프로그램 버전","example":"1.0","must_return":false,"note":"1.0 고정","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"타임스탬프","example":"1400137200","must_return":false,"note":"Unix 타임스탬프(초), 즉 1970-01-01 00:00:00 UTC 이후의 초 수\n예: 2014-05-15 15:00:00의 타임스탬프는 1400137200이며, 현재 시간을 입력할 것을 권장함","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"영수증 번호","example":"T13671007","must_return":false,"note":"이번에 변경할 영수증 번호.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"영수증 종류","example":"B2B","must_return":false,"note":"B2B=매수인이 영리 사업자(사업자 번호 필수).\nB2C=매수인이 개인.\n1. 영수증 변경 작업은 1회로 제한됨(변경 필드 포함: 영수증 종류, 매수인 명칭, 매수인 사업자 번호)\n2. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.","enum_values":"B2B,B2C","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"매수인 명칭","example":"왕소일","must_return":false,"note":"1. 매수인 명칭, 개인 이름 또는 영리 사업자 명칭.\n2. 영수증 변경 작업은 1회로 제한됨(변경 필드 포함: 영수증 종류, 매수인 명칭, 매수인 사업자 번호)\n3. 영수증 종류가 B2C에서 B2B로 변경될 때, 이 필드는 필수이며 비워둘 수 없음.\n4. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.\n5. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"매수인 사업자 번호","example":"54352706","must_return":false,"note":"1. 매수인(영리 사업자) 사업자 번호, 숫자만 입력.\n2. 매수인이 개인일 경우 작성 불필요.\n3. 영수증 변경 작업은 1회로 제한됨(변경 필드 포함: 영수증 종류, 매수인 명칭, 매수인 사업자 번호, 매수인 전화번호, 매수인 주소)\n4. 영수증 종류가 B2C에서 B2B로 변경될 때, 이 필드는 필수이며 비워둘 수 없음.\n5. 영수증 종류가 B2B에서 B2C로 변경될 때, 시스템은 기존 값을 삭제함.\n6. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.\n7. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"매수인 전화번호","example":"0922123456","must_return":false,"note":"1. 매수인의 휴대폰 번호.\n2. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.\n3. 영수증 변경 작업은 1회로 제한됨(변경 필드 포함: 영수증 종류, 매수인 명칭, 매수인 사업자 번호, 매수인 전화번호, 매수인 주소)\n4. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"매수인 주소","example":"타이베이시 난강구 난강로 2단 97호 8층","must_return":false,"note":"1. 매수인의 주소.\n2. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.\n3. 영수증 변경 작업은 1회로 제한됨(변경 필드 포함: 영수증 종류, 매수인 명칭, 매수인 사업자 번호, 매수인 전화번호, 매수인 주소)\n4. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"항공권","must_return":false,"note":"1. 해당 영수증의 비고.\n2. 비워두거나 이 필드가 없으면 데이터를 변경하지 않음을 의미함.\n3. 변경 횟수 제한 없음\n4. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"단체명","example":"홋카이도 5일 여행","must_return":false,"note":"1. 변경 횟수 제한 없음\n2. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.\n3. 전각/반각 한글, 영어, 숫자, 기호 및 공백 모두 한 문자로 계산됨\n4. 줄바꿈 및 다음의 특수 기호는 허용되지 않음: 큰따옴표 \"| 작은따옴표 ' | 연결 기호 & | 및 < >","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"단체 번호","example":"Ba023355","must_return":false,"note":"1. 변경 횟수 제한 없음\n2. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.\n3. 줄바꿈 및 다음의 특수 기호는 허용되지 않음: 큰따옴표 \"| 작은따옴표 ' | 연결 기호 & | 및 < >","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"예정 출발일","example":"2014-10-05","must_return":false,"note":"1. 형식은 YYYY-MM-DD입니다. 예: 2014-10-05\n2. 예정 출발일은 해당 영수증의 실제 발행일로부터 2년 후를 초과할 수 없음.\n3. 변경 횟수 제한 없음\n4. 이 필드의 데이터를 삭제하려면 *[clean]*을 입력하십시오.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 표기","example":"0","must_return":false,"note":"0=미신고\n1=신고됨\n비워두거나 이 파라미터를 전송하지 않으면 데이터를 변경하지 않음을 의미함.","enum_values":"0,1","default_value":"","nullable":false}]}]}],"responses":[{"title":"시스템 응답 메시지","direction":"receive","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"반환 상태","example":"SUCCESS","must_return":true,"note":"1. 영수증 발행 성공 시 SUCCESS 반환\n2. 영수증 발행 실패 시 오류 코드 반환","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"반환 메시지","example":"성공","must_return":true,"note":"문자, 이번 반환 상태에 대한 설명","enum_values":"","default_value":"","nullable":false},{"name":"MerchantID","required":"","type":"string(8)","label":"여행사 코드","example":"54352706","must_return":false,"note":"여행사 사업자 등록번호","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"영수증 번호","example":"T13671008","must_return":false,"note":"이번에 발행된 영수증의 번호","enum_values":"","default_value":"","nullable":false},{"name":"BuyerName","required":"","type":"string(50)","label":"매수인 명칭","example":"왕소일","must_return":false,"note":"영수증 발행 시의 매수인 명칭, 개인 이름 또는 사업자 명칭.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerUBN","required":"","type":"string(8)","label":"매수인 사업자 번호","example":"54352706","must_return":false,"note":"1. B2B 영수증인 경우, 이 필드는 매수인 사업자 번호입니다.\n2. B2C 영수증인 경우, 이 필드는 빈 값입니다.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerMobilePhone","required":"","type":"string(50)","label":"매수인 전화번호","example":"0922123456","must_return":false,"note":"매수인의 휴대폰 번호.","enum_values":"","default_value":"","nullable":false},{"name":"BuyerAddress","required":"","type":"string(100)","label":"매수인 주소","example":"타이베이시 난강구 난강로 2단 97호 8층","must_return":false,"note":"매수인의 주소.","enum_values":"","default_value":"","nullable":false},{"name":"Comment","required":"","type":"string(50)","label":"비고","example":"항공권","must_return":false,"note":"해당 영수증의 비고.","enum_values":"","default_value":"","nullable":false},{"name":"TourName","required":"","type":"string(50)","label":"단체명","example":"홋카이도 5일 여행","must_return":false,"note":"해당 영수증의 단체명","enum_values":"","default_value":"","nullable":false},{"name":"TourNo","required":"","type":"string(20)","label":"단체 번호","example":"Ba023355","must_return":false,"note":"해당 영수증의 단체 번호","enum_values":"","default_value":"","nullable":false},{"name":"TourDate","required":"","type":"date","label":"예정 출발일","example":"2014-10-05","must_return":false,"note":"해당 영수증의 출발일, 출발일 당일에 지정된 이메일로 출발 신고 알림 메일이 발송됩니다.","enum_values":"","default_value":"","nullable":false},{"name":"TaxNoted","required":"","type":"int(1)","label":"신고 표기","example":"0","must_return":false,"note":"해당 영수증의 신고 표기 필드\n0=미신고\n1=신고됨","enum_values":"0,1","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(50)","label":"검증 코드","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"이번 데이터 반환의 정당성을 확인하는 데 사용됩니다. 연동 시 이 파라미터 데이터를 비교하여 플랫폼에서 반환한 것인지 검증할 수 있습니다. 검증 방법은 \"SHA256 암호화 설명\"을 참조하십시오. 발행 실패 시 빈 값을 반환합니다.\n\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt를 SHA256 서명 규격에 따라 계산한 해시값\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt는 이 API 응답 필드에 포함되지 않으므로, 프로그램에서 영수증 발행 시 반환된 해당 값들을 자체 보관하여 추후 CheckCode 검증에 사용해야 합니다.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"문자열 종료","example":"##","must_return":true, , 0, 0);\">3. Kontakta kundtjänst för att ansöka om IP-vitlistning före integration. Upp till 10 IP-adresser kan konfigureras.<\/span><\/p>"},{"id":"section-1","title":"Datautbytesmetod","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvitto-data till plattformen via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Teckenkodningen är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för fält är tecken (kinesiska, engelska, siffror och symboler räknas alla som ett tecken). <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fält separeras med \"&amp;\"; detta tecken (U+0026) får inte förekomma i fältvärden.<\/span><\/p>"},{"id":"section-2","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa steg först, annars kommer integrationen att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in i test-backend → Grundläggande info → API-inställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in i live-backend → Grundläggande info → API-inställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Process: Ladda ner formulär från webbplatsen, fyll i och skicka till kundtjänst (fax/e-post)<\/p><p>- Max 10 IP-adresser<\/p><p>- Krävs: Serverns externa IP (inte internt IP, se https://ifconfig.me)<\/p><p>- Aktivering: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Test och produktion är separata miljöer med olika data. Se till att använda rätt URL före driftsättning.<\/p><p><br><\/p><p>4. Vanliga fel vid saknade förberedelser<\/p><p>- `KEY10001 Inte en IP för resebyråns API-integration` → IP saknas i vitlistan<\/p><p>- `KEY10002 Datadekrypteringsfel` → Felaktig HashKey/HashIV<\/p><p>- `KEY10009 Kan inte hitta data för organisationsnummer` → MerchantID är fel eller inaktivt<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flöde för att ändra kvitto"}]},"apis":[{"name":"Ändra kvitto-API","url_test":"https://capi.travelinvoice.com.tw/invoice_edit","url_prod":"https://api.travelinvoice.com.tw/invoice_edit","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"Fältkombination följt av AES256-kryptering, se tabell nedan för fältbeskrivning","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Version","example":"1.0","must_return":false,"note":"Sätt till 1.0","enum_values":"1.0","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder sedan 1970-01-01 00:00:00 UTC\nEx: 2014-05-15 15:00:00 motsvarar 1400137200. Använd aktuell tid.","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671007","must_return":false,"note":"Numret på det kvitto som ska ändras.","enum_values":"","default_value":"","nullable":false},{"name":"Category","required":"","type":"string(5)","label":"Kvittotyp","example":"B2B","must_return":false,"no         const globalCodeExamples = {"PHP":"<?php\n/*\n * IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected\n */\n\n// API Configuration Constants\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n// 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');\n// 16 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('AES_IV', 'YOUR_AES_IV_HERE');\n\n// Target Endpoints\ndefine('API_URL_TEST', 'https://capi.travelinvoice.com.tw/invoice_edit');\ndefine('API_URL_PROD', 'https://api.travelinvoice.com.tw/invoice_edit');\n\n// Guard check to prevent running with placeholder credentials\n$credentialError = false;\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    $credentialError = true;\n}\n\n/**\n * Encrypts plaintext using AES-256-CBC with manual PKCS7 padding for a 32-byte block size.\n *\n * @param string $plaintext The plaintext query string to encrypt.\n * @param string $key The 32-byte AES key.\n * @param string $iv The 16-byte IV. The IV must be exactly 16 bytes because the AES block size is fixed at 16 bytes, regardless of the key size (128, 192, or 256 bits).\n * @return string Hexadecimal encrypted string.\n * @throws Exception If encryption fails.\n */\nfunction encrypt_aes256_pkcs7_b32($plaintext, $key, $iv) {\n    /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n     * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n     * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n     * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n     * Each padding byte value equals paddingLen.\n     * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n     * to prevent the library from applying its own PKCS7 padding. */\n    $blockSize = 32;\n    $plaintextLen = strlen($plaintext);\n    $paddingLen = $blockSize - ($plaintextLen % $blockSize);\n    $paddedPlaintext = $plaintext . str_repeat(chr($paddingLen), $paddingLen);\n\n    $ciphertext = openssl_encrypt(\n        $paddedPlaintext,\n        'AES-256-CBC',\n        $key,\n        OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n        $iv\n    );\n\n    if ($ciphertext === false) {\n        throw new Exception('AES encryption failed via openssl_encrypt.');\n    }\n\n    return bin2hex($ciphertext);\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Verifies the authenticity of the API response by matching the received CheckCode against a locally calculated hash.\n * This function uses a time-safe comparison method to guard against timing attacks.\n *\n * @param string $iv The 16-byte IV (used as HashIV). The IV must be exactly 16 bytes because the AES block size is fixed at 16 bytes.\n * @param string $key The 32-byte key (used as HashKey).\n * @param string $invoiceTransNo\n * @param string $merchantId\n * @param string $merchantOrderNo\n * @param string $randomNum\n * @param string $totalAmt\n * @param string $receivedCheckCode The check code received from the API response.\n * @return bool True if signature matches, false otherwise.\n */\nfunction verify_response_signature($iv, $key, $invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $receivedCheckCode) {\n    // Exact alphabetical parameter ordering with prefix HashIV and suffix HashKey, built without URL encoding.\n    $raw = 'HashIV=' . $iv .\n           '&InvoiceTransNo=' . $invoiceTransNo .\n           '&MerchantID=' . $merchantId .\n           '&MerchantOrderNo=' . $merchantOrderNo .\n           '&RandomNum=' . $randomNum .\n           '&TotalAmt=' . $totalAmt .\n           '&HashKey=' . $key;\n\n    $computed = strtoupper(hash('sha256', $raw));\n\n    return hash_equals($computed, $receivedCheckCode);\n}\n\n// Processing Form Submission\n$responseResult = null;\n$errorMsg = null;\n$debugData = [];\n$signatureVerificationResult = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && !$credentialError) {\n    try {\n        $env = isset($_POST['environment']) && $_POST['environment'] === 'production' ? 'production' : 'test';\n        $apiUrl = $env === 'production' ? API_URL_PROD : API_URL_TEST;\n\n        // Collect and build variables for PostData_\n        $postDataFields = [\n            'Version' => '1.0', // Mandatory fixed version\n            'TimeStamp' => (string)time(), // Mandatory unix timestamp\n            'InvoiceNumber' => trim($_POST['InvoiceNumber'] ?? ''),\n            'Category' => trim($_POST['Category'] ?? ''),\n            'BuyerName' => trim($_POST['BuyerName'] ?? ''),\n            'BuyerUBN' => trim($_POST['BuyerUBN'] ?? ''),\n            'BuyerMobilePhone' => trim($_POST['BuyerMobilePhone'] ?? ''),\n            'BuyerAddress' => trim($_POST['BuyerAddress'] ?? ''),\n            'Comment' => trim($_POST['Comment'] ?? ''),\n            'TourName' => trim($_POST['TourName'] ?? ''),\n            'TourNo' => trim($_POST['TourNo'] ?? ''),\n            'TourDate' => trim($_POST['TourDate'] ?? ''),\n            'TaxNoted' => trim($_POST['TaxNoted'] ?? '')\n        ];\n\n        // Format query string parameters\n        $keyValuePairs = [];\n        foreach ($postDataFields as $key => $value) {\n            if ($value !== '') {\n                $keyValuePairs[] = $key . '=' . urlencode($value);\n            }\n        }\n        $plaintextString = implode('&', $keyValuePairs);\n        $debugData['plaintext'] = $plaintextString;\n\n        // Perform custom manual padding and AES-256-CBC encryption\n        $encryptedData = encrypt_aes256_pkcs7_b32($plaintextString, AES_KEY, AES_IV);\n        $debugData['encrypted'] = $encryptedData;\n\n        // Execute API Request via CURL\n        $ch = curl_init();\n        curl_setopt($ch, CURLOPT_URL, $apiUrl);\n        curl_setopt($ch, CURLOPT_POST, true);\n        curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query([\n            'MerchantID_' => MERCHANT_ID,\n            'PostData_' => $encryptedData\n        ]));\n        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n        curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n        curl_setopt($ch, CURLOPT_HTTPHEADER, [\n            'Content-Type: application/x-www-form-urlencoded'\n        ]);\n\n        $responseRaw = curl_exec($ch);\n\n        if ($responseRaw === false) {\n            throw new Exception('CURL Request failed: ' . curl_error($ch));\n        }\n\n        // curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n\n        $debugData['raw_response'] = $responseRaw;\n\n        // Parse query-string format response\n        $parsedResponse = [];\n        parse_str($responseRaw, $parsedResponse);\n        $responseResult = $parsedResponse;\n\n        // Check if signature verification fields are provided to perform Verification\n        $savedInvoiceTransNo = trim($_POST['v_InvoiceTransNo'] ?? '');\n        $savedMerchantOrderNo = trim($_POST['v_MerchantOrderNo'] ?? '');\n        $savedRandomNum = trim($_POST['v_RandomNum'] ?? '');\n        $savedTotalAmt = trim($_POST['v_TotalAmt'] ?? '');\n        $receivedCheckCode = $parsedResponse['CheckCode'] ?? '';\n\n        if (!empty($receivedCheckCode) && !empty($savedInvoiceTransNo) && !empty($savedMerchantOrderNo) && !empty($savedRandomNum) && !empty($savedTotalAmt)) {\n            $isSignatureValid = verify_response_signature(\n                AES_IV,\n                AES_KEY,\n                $savedInvoiceTransNo,\n                MERCHANT_ID,\n                $savedMerchantOrderNo,\n                $savedRandomNum,\n                $savedTotalAmt,\n                $receivedCheckCode\n            );\n            $signatureVerificationResult = $isSignatureValid ? 'VALID' : 'INVALID';\n        } else {\n            $signatureVerificationResult = 'INCOMPLETE_DATA';\n        }\n\n    } catch (Exception $e) {\n        $errorMsg = $e->getMessage();\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Receipt Amendment API Integration (變更收據API)<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif; background-color: #f8f9fa; color: #333; line-height: 1.5; padding: 20px; }\n        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }\n        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; color: #0056b3; }\n        .alert { padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid transparent; }\n        .alert-danger { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }\n        .alert-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }\n        .alert-info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }\n        .form-group { margin-bottom: 15px; }\n        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }\n        .form-group label span { color: #dc3545; }\n        .form-control { width: 100%; padding: 8px 12px; font-size: 14px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; }\n        .form-control:focus { border-color: #80bdff; outline: none; }\n        .btn { display: inline-block; background-color: #007bff; color: #fff; padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; width: 100%; box-sizing: border-box; }\n        .btn:hove ' : ''; ?>>0: Unreported<\/option>\n                        <option value=\"1\" <?php echo ($_POST['TaxNoted'] ?? '') === '1' ? 'selected' : ''; ?>>1: Reported<\/option>\n                    <\/select>\n                <\/div>\n                <div class=\"col-12 form-group\">\n                    <p style=\"font-size: 12px; color: #6c757d; margin-top: 5px;\"><em>* Note: Enter <strong>*[clean]*<\/strong> into any field if you wish to wipe the saved database parameter.<\/em><\/p>\n                <\/div>\n            <\/div>\n        <\/fieldset>\n\n        <fieldset>\n            <legend>Verification Context (Optional Verification Fields)<\/legend>\n            <p style=\"font-size: 13px; color: #495057; margin-top: 0;\">To test and verify the integrity of the response's <code>CheckCode<\/code>, supply the initial receipt issuance parameters below. They will be hashed with the return values to check server origin validity.<\/p>\n            <div class=\"row\">\n                <div class=\"col-6 form-group\">\n                    <label for=\"v_InvoiceTransNo\">Saved InvoiceTransNo<\/label>\n                    <input type=\"text\" name=\"v_InvoiceTransNo\" id=\"v_InvoiceTransNo\" class=\"form-control\" placeholder=\"e.g. T21400231920\" value=\"<?php echo htmlspecialchars($_POST['v_InvoiceTransNo'] ?? ''); ?>\" <?php echo $credentialError ? 'disabled' : ''; ?>>\n                <\/div>\n                <div class=\"col-6 form-group\">\n                    <label for=\"v_MerchantOrderNo\">Saved MerchantOrderNo<\/label>\n                    <input type=\"text\" name=\"v_MerchantOrderNo\" id=\"v_MerchantOrderNo\" class=\"form-control\" placeholder=\"e.g. TX20230501\" value=\"<?php echo htmlspecialchars($_POST['v_MerchantOrderNo'] ?? ''); ?>\" <?php echo $credentialError ? 'disabled' : ''; ?>>\n                <\/div>\n                <div class=\"col-6 form-group\">\n                    <label for=\"v_RandomNum\">Saved RandomNum<\/label>\n                    <input type=\"text\" name=\"v_RandomNum\" id=\"v_RandomNum\" class=\"form-control\" placeholder=\"e.g. 1234\" value=\"<?php echo htmlspecialchars($_POST['v_RandomNum'] ?? ''); ?>\" <?php echo $credentialError ? 'disabled' : ''; ?>>\n                <\/div>\n                <div class=\"col-6 form-group\">\n                    <label for=\"v_TotalAmt\">Saved TotalAmt<\/label>\n                    <input type=\"number\" name=\"v_TotalAmt\" id=\"v_TotalAmt\" class=\"form-control\" placeholder=\"e.g. 15000\" value=\"<?php echo htmlspecialchars($_POST['v_TotalAmt'] ?? ''); ?>\" <?php echo $credentialError ? 'disabled' : ''; ?>>\n                <\/div>\n            <\/div>\n        <\/fieldset>\n\n        <button type=\"submit\" class=\"btn\" <?php echo $credentialError ? 'disabled' : ''; ?>>Transmit Receipt Amendment Request<\/button>\n    <\/form>\n\n    <?php if ($responseResult !== null): ?>\n        <hr style=\"border: 0; border-top: 1px solid #dee2e6; margin: 30px 0;\">\n\n        <h2>Transaction Logs & Diagnostics<\/h2>\n\n        <h3>Client Security Hashing Phase (Payload Generation)<\/h3>\n        <p>This is the raw plaintext string before standard/custom manual PKCS7 Block Size 32 padding is appended.<\/p>\n        <div class=\"result-box\"><?php echo htmlspecialchars($debugData['plaintext'] ?? ''); ?><\/div>\n\n        <p>AES-256-CBC Encrypted Ciphertext Hex Payload (sent inside parameter <code>PostData_<\/code>):<\/p>\n        <div class=\"result-box\"><?php echo htmlspecialchars($debugData['encrypted'] ?? ''); ?><\/div>\n\n        <h3>API Server Response Block<\/h3>\n        <p>Actual response body payload received from travelinvoice servers:<\/p>\n        <div class=\"result-box\"><?php echo htmlspecialchars($debugData['raw_response'] ?? ''); ?><\/div>\n\n        <h3>Parsed Structured Output<\/h3>\n        <table style=\"width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;\">\n            <thead>\n                <tr style=\"background: #e9ecef;\">\n                    <th style=\"padding: 10px; border: 1px solid #dee2e6; text-align: left;\">Field Key<\/th>\n                    <th style=\"padding: 10px; border: 1px solid #dee2e6; text-align: left;\">Return Value<\/th>\n                <\/tr>\n            <\/thead>\n            <tbody>\n                <?php foreach ($responseResult as $key => $val): ?>\n                    <tr>\n                        <td style=\"padding: 10px; border: 1px solid #dee2e6; font-weight: bold;\"><?php echo htmlspecialchars($key); ?><\/td>\n                        <td style=\"padding: 10px; border: 1px solid #dee2e6;\"><?php echo htmlspecialchars($val); ?><\/td>\n                    <\/tr>\n                <?php endphp; ?>\n            <\/tbody>\n        <\/table>\n\n        <div style=\"margin-top: 25px;\">\n            <h3>CheckCode Integrity Analysis (SHA-256 Verification Result)<\/h3>\n            <?php if ($signatureVerificationResult === 'VALID'): ?>\n                <div class=\"alert alert-success\">\n                    <span class=\"badge badge-success\">VALIDATED<\/span> Response authenticity is proven. The returned CheckCode matches computed value.\n                <\/div>\n            <?php elseif ($signatureVerificationResult === 'INVALID'): ?>\n                <div class=\"alert alert-danger\">\n                    <span class=\"badge badge-danger\">FAILED<\/span> Response integrity warning. The returned CheckCode does NOT match computed signature. Ensure stored InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, and TotalAmt correspond to initial receipt credentials.\n                <\/div>\n            <?php else: ?>\n                <div class=\"alert alert-info\">\n                    <span class=\"badge badge-warning\">UNVERIFIED<\/span> Verification bypassed. CheckCode validation requires entering the corresponding original transaction details (<code>InvoiceTransNo<\/code>, <code>MerchantOrderNo<\/code>, <code>RandomNum<\/code>, <code>TotalAmt<\/code>) in the verification context block above.\n                <\/div>\n            <?php endif; ?>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        let currentLang = Object.keys(docConfig)[0];

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');

            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {

            });

        function renderEncryptionRules() {

            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-sha-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                shaBlock.classList.add('hidden'); 
            }

            if (hasContent) { 
                section.classList.remove('hidden'); 
                if (navLink) navLink.classList.remove('hidden'); 
            } else { 
                section.classList.add('hidden'); 
                if (navLink) navLink.classList.add('hidden'); 
            }
        }

                    var kLabel = shaConfig.key_label !== undefined ? shaConfig.key_label : 'HashKey';
                    var iLabel = shaConfig.iv_label !== undefined ? shaConfig.iv_label : 'HashIV';

        function getKeys() {
            var ui = docConfig[currentLang].ui;
            var key = document.getElementById('toolKey').value.trim();
            var iv = document.getElementById('toolIv').value.trim();
            if (!key || !iv) { alert(ui.tool_alert_missing_key); return null; }
            return { key: key, iv: iv };
        }

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        function generateTableRows(dataArray, ui) {

                if (item.default_value) extraInfo.push(lblDef + ': <span class="font-mono text-slate-700">' + item.default_value + '</span>');
                if (item.nullable === true || String(item.nullable).toLowerCase() === 'true' || item.nullable === '1' || item.nullable === '是') {
                    extraInfo.push(lblNull + ': <span class="font-bold">' + lblYes + '</span>');

                    extraHtml = '<div class="mt-2 text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-200 block w-fit shadow-sm">' + extraInfo.join(' <span class="text-slate-300 mx-2">|</span> ') + '</div>';

                return '<tr class="align-middle">' +

                    '<td class="px-6 py-4 text-left">' + item.label + '</td>' +
                    '<td class="px-6 py-4 text-center">' + ((item.required === 'V' || item.required === true) ? '<span class="text-green-600 font-bold text-lg">✓</span>' : (item.required === '+' ? '<span class="text-blue-500 font-bold text-base">+</span>' : '<span class="text-slate-300">-</span>')) + '</td>' +

            var ui = docConfig[currentLang].ui;
            var versions = docConfig[currentLang].versions || [];

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
