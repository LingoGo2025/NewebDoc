eipt platform for issuance via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type is application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Encoding format is UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. The electronic receipt platform responds with a formatted string. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. The unit of calculation for each field is a character. Chinese, English, numbers, and symbols each count as one character. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fields are connected with \"&amp;\", and this character (U+0026) must not be contained within any field.<\/span><\/p>"},{"id":"section-2","title":"Pre-integration Preparation","desc":"<p>(Please complete first, otherwise the program will fail)<\/p><p><br><\/p><p> 1. Obtain HashKey / HashIV<\/p><p>- Test Environment: Log in to the test backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p>- Production Environment: Log in to the production backend → Basic Information → API Integration Settings → Copy HashKey and HashIV<\/p><p><br><\/p><p>2. Apply for IP Whitelist<\/p><p>- Application Window: Download the application form from the official website, fill it out, and send it to the Customer Service Center (Fax / Email)<\/p><p>- Up to 10 IP addresses can be set<\/p><p>- Required: Server external IP (not internal IP, can be checked at https://ifconfig.me)<\/p><p>- Effective Time: Usually 1-2 working days<\/p><p><br><\/p><p>3. Environment URL<\/p><p>- The test environment and production environment are completely different systems, and data is not shared. Be sure to confirm that the integration URL has been switched to the production URL before going live.<\/p><p><br><\/p><p>4. Common \"Forgot Preparation\" Error Signals<\/p><p>- `KEY10001 Non-travel agency API integration IP` → IP whitelist not set or set incorrectly<\/p><p>- `KEY10002 Data decryption error` → HashKey / HashIV is incorrect or still uses example values<\/p><p>- `KEY10009 Unable to retrieve data for the travel agency tax ID` → MerchantID is wrong or not activated<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Query Invalidation Process"}]},"apis":[{"name":"Single Query Receipt Invalidation Data API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post Parameters","direction":"send","group_type":"No Encryption","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Travel Agency Tax ID","example":"54352706","must_return":false,"note":"Travel agency tax ID.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Search Type","example":"3","must_return":false,"note":"3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Encrypted Data","example":"","must_return":false,"note":"The AES256 encrypted string formed by combining fields. Field descriptions are in the table below.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ Internal Fields","group_type":"AES Encryption_String","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integration Version","example":"1.1","must_return":false,"note":"Fixed as 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Timestamp","example":"1400137200","must_return":false,"note":"Unix timestamp (seconds), the number of seconds since 1970-01-01 00:00:00 UTC\nExample: The timestamp for 2014-05-15 15:00:00 is 1400137200. It is recommended to use the current time.","enum_values":"","default_value":"","nullable":false},{"name":"I pan> に配置して転送してください。","msg_req_format_qs":"このブロックのフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号で組み合わせたクエリ文字列 (Query String) 形式である必要があります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_req_format_json":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置して転送する必要があります。","msg_req_format_other":"このブロックのフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_req_security":"データセキュリティ：転送前に <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を完了させる必要があります。","msg_res_info_webhook":"この結果はシステムにより非同期形式で、加盟店が指定した <span class=\\\"font-bold text-green-700\\\">Webhook<\/span> 受信 URL に自動的にプッシュされます。","msg_res_info_sync":"この結果はシステムにより <span class=\\\"font-bold text-green-700\\\">{method}<\/span> 方式で <span class=\\\"font-bold text-green-700\\\">{location}<\/span> に同期的に返却されます。","msg_res_format_qs":"返却されるフィールドは <span class=\\\"font-mono font-bold text-cyan-700\\\">&amp;<\/span> 記号で組み合わせたクエリ文字列 (Query String) 形式になります。例：<span class=\\\"font-mono text-cyan-700\\\">key1=val1&amp;key2=val2<\/span>。","msg_res_format_json":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">JSON<\/span> オブジェクト内に配置されます。","msg_res_format_other":"返却されるフィールドは <span class=\\\"font-bold text-cyan-700\\\">{format}<\/span> 形式で組み合わされます。","msg_res_security":"復号検証：受信後、特定のデータに対して <span class=\\\"font-bold\\\">{group_type}<\/span> 処理を行う必要があります。","lbl_sha_pre_hash":"ハッシュ前文字列 (String to Hash)","ph_sha_pre_hash":"ハッシュボタンを押すと、ここに実際に暗号化される完全な文字列が表示されます...","flowchart_0_url":"assets/flowcharts_query-single-voided-receipt-api/fc_2.png"},"meta":{"title":"単一領収書無効化データ照会API","subtitle":"領収書無効化データの照会","version":"","sections":[{"id":"section-0","title":"連携の目的","desc":"<p><span style=\"color: rgb(0, 0, 0);\">電子領収書の発行・無効化データ作成後、パラメータを通じて無効化の進捗やステータスを照会できます。<\/span><\/p>"},{"id":"section-1","title":"データ交換方式","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. 旅行社は「HTTP POST」方式で領収書データを電子領収書プラットフォームに送信し、発行を行います。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type は application/x-www-form-urlencoded です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. エンコード形式は UTF-8 です。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 電子領収書プラットフォームはフォーマットされた文字列を返します。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 各フィールドの計算単位は文字です。全角、半角、数字、記号はいずれも 1 文字として計算されます。 <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 各フィールド間は「&amp;」で連結されます。各フィールド内にこの文字（U+0026）を含めることはできません。<\/span><\/p>"},{"id":"section-2","title":"連携前の準備作業","desc":"<p>（事前に完了させてください。そうしないとプログラムは必ず失敗します）<\/p><p><br><\/p><p> 1. HashKey / HashIV の取得<\/p><p>- テスト環境：テスト環境バックエンドにログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p>- 本番環境：本番環境バックエンドにログイン → 基本資料 → API連携設定 → HashKey と HashIV をコピー<\/p><p><br><\/p><p>2. IP ホワイトリストの申請<\/p><p>- 申請窓口：公式サイトから申請フォームをダウンロードして記入後、カスタマーサービスセンター（FAX / メール）に送信<\/p><p>- 最大 10 セットの IP を設定可能<\/p><p>- 提供が必要なもの：サーバーの外部向け IP（内部ネットワーク IP ではありません。https://ifconfig.me で確認可能）<\/p><p>- 反映時間：通常 1〜2 営業日<\/p><p><br><\/p><p>3. 環境 URL<\/p><p>- テスト環境と本番環境は完全に異なる設備であり、データは共通していません。本番稼働前に必ず連携先 URL を本番環境の URL に切り替えたことを確認してください<\/p><p><br><\/p><p>4. よくある「準備作業忘れ」によるエラーメッセージ<\/p><p>- `KEY10001 非旅行社 API 串接 IP` → IP ホワイトリストが未設定または誤設定<\/p><p>- `KEY10002 資料解密錯誤` → HashKey / HashIV が正しくない、またはサンプルのまま<\/p><p>- `KEY10009 取不到旅行社統一編號的資料` → MerchantID が誤っているか、有効化されていない<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"無効化伝票照会プロセス"}]},"apis":[{"name":"単一領収書無効化データ照会API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post パラメータ","direction":"send","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"旅行社納税者番号","example":"54352706","must_return":false,"note":"旅行社の統一編号（納税者番号）。","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"検索タイプ","example":"3","must_return":false,"note":"3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"暗号化データ","example":"","must_return":false,"note":"文字列フィールドを組み合わせた後、AES256で暗号化します。フィールドの説明は下表の通りです","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"PostData_ 含まれるフィールド","group_type":"AES暗号化_文字列","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"連携プログラムバージョン","example":"1.1","must_return":false,"note":"1.1 固定","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"タイムスタンプ","example":"1400137200","must_return":false,"note":"Unix タイムスタンプ（秒）。1970-01-01 00:00:00 UTC からの経過秒数\\n例：2014-05-15 15:00:00 のタイムスタンプは 1400137200 です。現在の時間を設定することを推奨します","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"領収書番号","example":"T13671005","must_return":false,"note":"今回照会する領収書番号。","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"無効化伝票番号","example":"85512","must_return":false,"note":"無効化伝票発行時にシステムから返却されたシステムシリアル番号","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"システムレスポンスメッセージ","direction":"receive","group_type":"暗号化なし","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"返却ステータス","example":"SUCCESS","must_return":true,"note":"1. 照会成功時は SUCCESS を返却\\n2. 照会失敗時はエラーコードを返却","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"返却メッセージ","example":"領収書発行照会に成功しました","must_return":true,"note":"テキスト、今回の返却ステータスの説明","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"無効化伝票シリアル番号","example":"85512","must_return":false,"note":"今回発行された無効化または無効化待機中のシリアル番号","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"領収書番号","example":"T13671003","must_return":false,"note":"無効化を実行した領収書番号","enum_values":"","default_value":"","nullable":false},{"name":"InvalidType","required":"","type":"int(1)","label":"無効化方式","example":"1","must_return":false,"note":"0=無効化待機。買受人が無効化を確認した後、プラットフォームに対して無効化確定を発信します。\\n1=即時無効化。","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"無効化ステータス","example":"1","must_return":false,"note":"該当する無効化伝票のステータス。\\n0=未確認の無効化伝票\\n1=確認済みの無効化伝票\\n2=キャンセルされた無効化伝票","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"invalidComment","required":"","type":"string(10)","label":"無効化理由","example":"注文キャンセル","must_return":false,"note":"無効化の理由","enum_values":"","default_value":"","nullable":false},{"name":"InvalidCreateTime","required":"","type":"datetime","label":"無効化作成日時","example":"2014-09-25 12:12:12","must_return":false,"note":"該当する無効化の発行時間、例：2014-09-25 12:12:12","enum_values":"","default_value":"","nullable":false},{"name":"InvalidDate","required":"","type":"datetime","label":"無効化確認日時","example":"2014-09-25 12:12:12","must_return":false,"note":"該当する無効化が確定された発行時間、例：2014-09-25 12:12:12。","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"担当者","example":"王小英","must_return":false,"note":"修正伝票を発行した担当者名","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"チェックコード","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"今回のデータ返却の正当性を確認するために使用します。連携時にこのパラメータを比較して、プラットフォームから返却されたものか確認できます。確認方法は「SHA256暗号化説明」を参照してください。発行失敗時は空値を返却します。\\n\\nCheckCode = InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt を SHA256 署名規格に従って計算したハッシュ値\\n\\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt はこの API レスポンスフィールドには含まれません。InvoiceNumber（領収書番号）を使用してデータベースからこれら 4 つのフィールドデータを取得する必要があります。","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"文字列末尾","example":"##","must_return":true,"note":"固定で ## を返却します。String 形式でデータを受信するユーザーは、データの転送が完全であることを保証するために EndStr=## を判定する必要があります。","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"旅行社 API 連携用 IP ではありません"},{"code":"KEY10002","reason":"データの復号エラー"},{"code":"KEY10003","reason":"バージョンエラー"},{"code":"KEY10004","reason":"データ不備"},{"code":"KEY10006","reason":"旅行社が電子領収書の利用申請を行っていません"},{"code":"KEY10007","reason":"ページ滞在時間が 30 分を超えました"},{"code":"KEY10009","reason":"旅行社納税者番号のデータを取得できません"},{"code":"KEY10010","reason":"旅行社納税者番号が空欄です"},{"code":"KEY10011","reason":"PostData_ フィールドが空欄です"},{"code":"KEY10012","reason":"データ転送エラー"},{"code":"KEY10013","reason":"データが空欄です"},{"code":"KEY10014","reason":"タイムアウト。通常、I/O 上のタイムアウトを指します"},{"code":"KEY10015","reason":"領収書金額の形式エラー"},{"code":"KEY10016","reason":"旅行社が郵送印刷付加価値サービスを申請していません"},{"code":"KEY10017","reason":"郵送印刷付加価値サービスの利用可能残数が不足しています"},{"code":"KEY10018","reason":"発行者フィールドが未入力です"},{"code":"KEY10019","reason":"旅行社のアカウントが停止されています"},{"code":"NOR10001","reason":"ネットワーク接続異常"},{"code":"IS10001","reason":"領収書番号が未入力です"},{"code":"IS10002","reason":"領収書偽造防止ランダムコードが未入力です"},{"code":"IS10003","reason":"DisplayFlag に誤りがあります"},{"code":"BS10015","reason":"修正伝票番号が未入力です"},{"code":"BS10016","reason":"無効化伝票番号が未入力です"},{"code":"BS10017","reason":"修正伝票データが見つかりません"},{"code":"BS10018","reason":"無効化伝票データが見つかりません"}],"versions":[]},

 방식으로 전자 영수증 플랫폼에 영수증 데이터를 전송하여 발행합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type은 application/x-www-form-urlencoded입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. 인코딩 형식은 UTF-8입니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. 전자 영수증 플랫폼은 형식화된 문자열로 응답합니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. 각 필드의 계산 단위는 문자(Character)입니다. 한글, 영어, 숫자, 기호 모두 한 문자로 계산됩니다. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. 각 필드 사이는 「&amp;」 기호로 연결하며, 필드 내부에는 이 기호(U+0026)를 포함할 수 없습니다.<\/span><\/p>"},{"id":"section-2","title":"연동 전 사전 작업","desc":"<p>(반드시 먼저 완료해야 하며, 그렇지 않으면 프로그램이 실패합니다)<\/p><p><br><\/p><p> 1. HashKey / HashIV 획득<\/p><p>- 테스트 환경: 테스트 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p>- 실제 환경: 실제 구역 백오피스 로그인 → 기본 정보 → API 연동 설정 → HashKey 및 HashIV 복사<\/p><p><br><\/p><p>2. IP 화이트리스트 신청<\/p><p>- 신청 창구: 공식 홈페이지에서 신청 양식을 다운로드하여 작성 후, 고객 센터로 전송(팩스 / 이메일)<\/p><p>- 최대 10개의 IP 설정 가능<\/p><p>- 제공 항목: 서버의 외부 IP(내부 IP 아님, https://ifconfig.me 에서 확인 가능)<\/p><p>- 반영 시간: 통상 영업일 기준 1~2일<\/p><p><br><\/p><p>3. 환경 URL<\/p><p>- 테스트 환경과 실제 환경은 완전히 다른 장비이며 데이터가 공유되지 않습니다. 오픈 전 반드시 연동 URL이 실제 구역 URL로 전환되었는지 확인하십시오.<\/p><p><br><\/p><p>4. 자주 발생하는 「사전 작업 누락」 오류 신호<\/p><p>- `KEY10001 여행사 API 연동 IP가 아님` → IP 화이트리스트가 설정되지 않았거나 잘못 설정됨<\/p><p>- `KEY10002 데이터 복호화 오류` → HashKey / HashIV가 정확하지 않거나 여전히 예제 값임<\/p><p>- `KEY10009 여행사 사업자 등록 번호 데이터를 찾을 수 없음` → MerchantID가 틀렸거나 활성화되지 않음<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"무효화 전표 조회 프로세스"}]},"apis":[{"name":"영수증 무효화 데이터 단건 조회 API","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post 매개변수","direction":"send","group_type":"암호화 없음","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"여행사 사업자 등록 번호","example":"54352706","must_return":false,"note":"여행사 사업자 등록 번호.","enum_v d","desc":"<p><span style=\"color: rgb(0, 0, 0);\">1. Resebyrån skickar kvitto-data till den elektroniska kvitto-plattformen för utfärdande via \"HTTP POST\". <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">2. Content-Type är application/x-www-form-urlencoded. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">3. Kodningsformatet är UTF-8. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">4. Den elektroniska kvitto-plattformen svarar med en formaterad sträng. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">5. Beräkningsenheten för varje fält är tecken. Kinesiska, engelska, siffror och symboler räknas alla som ett tecken. <\/span><\/p><p><span style=\"color: rgb(0, 0, 0);\">6. Fälten separeras med \"&amp;\", och fälten får inte innehålla detta tecken (U+0026).<\/span><\/p>"},{"id":"section-2","title":"Förberedelser före integration","desc":"<p>(Vänligen slutför dessa först, annars kommer programmet att misslyckas)<\/p><p><br><\/p><p> 1. Hämta HashKey / HashIV<\/p><p>- Testmiljö: Logga in på testmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p>- Produktionsmiljö: Logga in på produktionsmiljöns backend → Grundläggande information → API-integrationsinställningar → Kopiera HashKey och HashIV<\/p><p><br><\/p><p>2. Ansök om IP-vitlistning<\/p><p>- Ansökningskanal: Ladda ner ansökningsformuläret från den officiella webbplatsen, fyll i det och skicka det till kundtjänstcentret (Fax / E-post)<\/p><p>- Upp till 10 IP-adresser kan ställas in<\/p><p>- Behöver tillhandahållas: Serverns externa IP (inte internt IP, kan kontrolleras på https://ifconfig.me)<\/p><p>- Aktiveringstid: Vanligtvis 1-2 arbetsdagar<\/p><p><br><\/p><p>3. Miljö-URL<\/p><p>- Testmiljön och produktionsmiljön är helt olika utrustningar, data delas inte. Se till att växla integrations-URL:en till produktions-URL:en före driftsättning<\/p><p><br><\/p><p>4. Vanliga felmeddelanden vid \"glömda förberedelser\"<\/p><p>- `KEY10001 Inte en resebyrå API-integrations-IP` → IP-vitlistning inte inställd eller felaktigt inställd<\/p><p>- `KEY10002 Datadekrypteringsfel` → HashKey / HashIV är felaktig eller fortfarande ett exempelvärde<\/p><p>- `KEY10009 Kan inte hämta data för resebyråns organisationsnummer` → MerchantID är felaktigt eller inte aktiverat<\/p><p><br><\/p>"}],"flowcharts":[{"id":"flowchart-0","title":"Flödesschema för sökning av makuleringssedel"}]},"apis":[{"name":"API för sökning av makulerade kvitto-data","url_test":"https://capi.travelinvoice.com.tw/invoice_search","url_prod":"https://api.travelinvoice.com.tw/invoice_search","requests":[{"title":"Post-parametrar","direction":"send","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"POST","params":[{"name":"MerchantID_","required":"V","type":"string(8)","label":"Resebyråns organisationsnummer","example":"54352706","must_return":false,"note":"Resebyråns organisationsnummer.","enum_values":"","default_value":"","nullable":false},{"name":"SearchType_","required":"V","type":"int(1)","label":"Söktyp","example":"3","must_return":false,"note":"3","enum_values":"3","default_value":"","nullable":false},{"name":"PostData_","required":"V","type":"array","label":"Krypterad data","example":"","must_return":false,"note":"AES256-kryptering utförd efter kombination av strängfält. Fältbeskrivningar finns i tabellen nedan.","enum_values":"","default_value":"","nullable":false}],"children":[{"title":"Fält i PostData_","group_type":"AES-kryptering_Sträng","param_location":"body","from_field":"PostData_","params":[{"name":"Version","required":"V","type":"string(5)","label":"Integrationsversion","example":"1.1","must_return":false,"note":"Fast värde 1.1","enum_values":"1.1","default_value":"","nullable":false},{"name":"TimeStamp","required":"V","type":"string(30)","label":"Tidsstämpel","example":"1400137200","must_return":false,"note":"Unix-tidsstämpel (sekunder), dvs. antal sekunder sedan 1970-01-01 00:00:00 UTC\nExempel: Tidsstämpeln för 2014-05-15 15:00:00 är 1400137200, det rekommenderas att använda aktuell tid","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"V","type":"string(9)","label":"Kvittonummer","example":"T13671005","must_return":false,"note":"Kvittonummer för denna sökning.","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"V","type":"string(20)","label":"Makuleringsnummer","example":"85512","must_return":false,"note":"Systemets löpnummer som returneras när makuleringssedeln skapas","enum_values":"","default_value":"","nullable":false}]}]}],"responses":[{"title":"Systemsvarsmeddelande","direction":"receive","group_type":"Ingen kryptering","param_location":"body","field_combination_format":"String","method":"","params":[{"name":"Status","required":"","type":"string(10)","label":"Returstatus","example":"SUCCESS","must_return":true,"note":"1. Om sökningen lyckas, returnera SUCCESS\n2. Om sökningen misslyckas, returnera felkod","enum_values":"","default_value":"","nullable":false},{"name":"Message","required":"","type":"string(30)","label":"Returmeddelande","example":"Sökning av utfärdat kvitto lyckades","must_return":true,"note":"Text, beskrivning av denna returstatus","enum_values":"","default_value":"","nullable":false},{"name":"InvalidNo","required":"","type":"string(20)","label":"Löpnummer för makulering","example":"85512","must_return":false,"note":"Löpnummer för den utfärdade makuleringen eller väntande makuleringen","enum_values":"","default_value":"","nullable":false},{"name":"InvoiceNumber","required":"","type":"string(9)","label":"Kvittonummer","example":"T13671003","must_return":false,"note":"Kvittonummer för den utförda makuleringen","enum_values":"","default_value":"","nullable":false},{"name":"InvalidType","required":"","type":"int(1)","label":"Makuleringsmetod","example":"1","must_return":false,"note":"0=Väntar på makulering. Efter att köparen bekräftat makuleringen, initiera bekräftelse på makulering till plattformen.\n1=Omedelbar makulering.","enum_values":"0,1","default_value":"","nullable":false},{"name":"InvalidStatus","required":"","type":"int(1)","label":"Makuleringsstatus","example":"1","must_return":false,"note":"Status för makuleringssedeln.\n0=Ej bekräftad makuleringssedel\n1=Bekräftad makuleringssedel\n2=Avbruten makuleringssedel","enum_values":"0,1,2","default_value":"","nullable":false},{"name":"invalidComment","required":"","type":"string(10)","label":"Makuleringsorsak","example":"Order avbruten","must_return":false,"note":"Orsak till makulering","enum_values":"","default_value":"","nullable":false},{"name":"InvalidCreateTime","required":"","type":"datetime","label":"Skapandedatum för makulering","example":"2014-09-25 12:12:12","must_return":false,"note":"Tidpunkt då makuleringen skapades, t.ex.: 2014-09-25 12:12:12","enum_values":"","default_value":"","nullable":false},{"name":"InvalidDate","required":"","type":"datetime","label":"Bekräftelsedatum för makulering","example":"2014-09-25 12:12:12","must_return":false,"note":"Tidpunkt då makuleringen fastställdes, t.ex.: 2014-09-25 12:12:12.","enum_values":"","default_value":"","nullable":false},{"name":"SellerName","required":"","type":"string(50)","label":"Handläggare","example":"Wang Xiaoying","must_return":false,"note":"Namn på personen som utfärdade kreditnotan","enum_values":"","default_value":"","nullable":false},{"name":"CheckCode","required":"","type":"string(150)","label":"Kontrollkod","example":"0C69DBB83FD36B6A2B2E9E614DAEA3D91D474C2D8A829870CA91511C55AF2AA","must_return":false,"note":"Används för att kontrollera giltigheten av de returnerade uppgifterna. Vid integration kan dessa data jämföras för att verifiera om de returneras av plattformen. Se ”SHA256-krypteringsinstruktioner” för verifieringsmetod. Returnerar tomt värde om utfärdandet misslyckas.\n\nCheckCode = Hash-värde beräknat enligt SHA256-signaturspecifikation för InvoiceTransNo, MerchantID, MerchantOrderNo, RandomNum, TotalAmt\n\nInvoiceTransNo, MerchantOrderNo, RandomNum, TotalAmt ingår inte i detta API-svarsfält. Programmet måste använda InvoiceNumber (kvittonummer) i databasen för att hämta dessa 4 fält.","enum_values":"","default_value":"","nullable":false},{"name":"EndStr","required":"","type":"string(2)","label":"Strängslut","example":"##","must_return":true,"note":"Returnerar fast ##. Användare som tar emot data via String-metoden måste kontrollera EndStr=## för att säkerställa fullständig dataöverföring.","enum_values":"##","default_value":"","nullable":false}],"children":[]}]}],"errors":[{"code":"KEY10001","reason":"Inte en resebyrå API-integrations-IP"},{"code":"KEY10002","reason":"Datadekrypteringsfel"},{"code":"KEY10003","reason":"Versionsfel"},{"code":"KEY10004","reason":"Ofullständig data"},{"code":"KEY10006","reason":"Resebyrån har inte ansökt om att aktivera elektroniska kvitton"},{"code":"KEY10007","reason":"Sidan har varit inaktiv i mer än 30 minuter"},{"code":"KEY10009","reason":"Kan inte hämta data för resebyråns organisationsnummer"},{"code":"KEY10010","reason":"Resebyråns organisationsnummer är tomt"},{"code":"KEY10011","reason":"Fältet PostData_ är tomt"},{"code":"KEY10012","reason":"Dataöverföringsfel"},{"code":"KEY10013","reason":"Tom data"},{"code":"KEY10014","reason":"TimeOut. Avser generellt timeout på I/O"},{"code":"KEY10015","reason":"Felaktigt format på kvitto-belopp"},{"code":"KEY10016","reason":"Resebyrån har inte ansökt om tilläggstjänsten postutskrift"},{"code":"KEY10017","reason":"Otillräckligt antal tillgängliga enheter för tilläggstjänsten postutskrift"},{"code":"KEY10018","reason":"Fältet utfärdare är inte ifyllt"},{"code":"KEY10019","reason":"Resebyråns rättigheter har dragits in"},{"code":"NOR10001","reason":"Nätverksanslutningsfel"},{"code":"IS10001","reason":"Kvittonummer är inte ifyllt"},{"code":"IS10002","reason":"Slumpmässig säkerhetskod för kvitto är inte ifylld"},{"code":"IS10003","reason":"Felaktig DisplayFlag"},{"code":"BS10015","reason":"Kreditnotanummer är inte ifyllt"},{"code":"BS10016","reason":"Makuleringsnummer är inte ifyllt"},{"code":"BS10017","reason":"Inga data för kreditnotan hittades"},{"code":"BS10018","reason":"Inga data för makuleringssedeln hittades"}],"versions":[]},

        const globalToolsConfig = {"sha":{"enabled":true,"params":{"key_label":"HashKey","iv_label":"HashIV","columns":"InvoiceTransNo,MerchantID,MerchantOrderNo,RandomNum,TotalAmt","encrypt_order":"前IV後KEY"}},"aes_encrypt":{"enabled":true},"aes_decrypt":{"enabled":true}};
        const globalCodeExamples = {"PHP":"<?php\n/* IMPORTANT: Key and IV values differ between production and test environments — confirm you have obtained the correct credentials for the target environment before use;\n * Replace all placeholder constants (e.g. YOUR_HASH_KEY_HERE) with real values before running this code — the code will block and display an error if placeholders are detected */\n\n// System configurations\ndefine('MERCHANT_ID', 'YOUR_MERCHANT_ID_HERE');\n// 32 bytes — used for both AES-256 encryption and SHA256 signature\ndefine('AES_KEY', 'YOUR_AES_KEY_HERE');\n// 16 bytes — IV size is 16 bytes because the standard AES block size is 16 bytes\ndefine('AES_IV', 'YOUR_AES_IV_HERE');\n\n// Safety Shield: Halt execution immediately if values remain at default placeholder strings\nif (MERCHANT_ID === 'YOUR_MERCHANT_ID_HERE' || AES_KEY === 'YOUR_AES_KEY_HERE' || AES_IV === 'YOUR_AES_IV_HERE') {\n    header('Content-Type: text/html; charset=utf-8');\n    echo '<div style=\"color: #721c24; background-color: #f8d7da; border: 2px solid #f5c6cb; padding: 20px; border-radius: 5px; font-family: sans-serif; max-width: 600px; margin: 40px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);\">';\n    echo '<h3 style=\"margin-top: 0; border-bottom: 1px solid #f5c6cb; padding-bottom: 10px;\">Configuration Error Required<\/h3>';\n    echo '<p>One or more API credentials are still set to placeholder values. You must supply your actual integration credentials before continuing.<\/p>';\n    echo '<ul>';\n    echo '<li><strong>MERCHANT_ID:<\/strong> ' . htmlspecialchars(MERCHANT_ID) . '<\/li>';\n    echo '<li><strong>AES_KEY:<\/strong> ' . htmlspecialchars(AES_KEY) . '<\/li>';\n    echo '<li><strong>AES_IV:<\/strong> ' . htmlspecialchars(AES_IV) . '<\/li>';\n    echo '<\/ul>';\n    echo '<\/div>';\n    exit;\n}\n\n/**\n * Verification (驗證回應簽章)\n *\n * Checks response authenticity using time-safe cryptographic comparisons.\n *\n * @param string $invoiceTransNo\n * @param string $merchantId\n * @param string $merchantOrderNo\n * @param string $randomNum\n * @param string $totalAmt\n * @param string $receivedCheckCode\n * @return bool\n */\nfunction verifyCheckCode($invoiceTransNo, $merchantId, $merchantOrderNo, $randomNum, $totalAmt, $receivedCheckCode) {\n    // Construct signing string using ordered properties without urlencoding functions to preserve exact raw format\n    $raw = 'HashIV=' . AES_IV . '&InvoiceTransNo=' . $invoiceTransNo . '&MerchantID=' . $merchantId . '&MerchantOrderNo=' . $merchantOrderNo . '&RandomNum=' . $randomNum . '&TotalAmt=' . $totalAmt . '&HashKey=' . AES_KEY;\n    $calculated = strtoupper(hash('sha256', $raw));\n    return hash_equals($calculated, $receivedCheckCode);\n}\n\n/**\n * Simulates local database lookup based on receipt key identifier\n * Required to fetch auxiliary signing factors not included in the response package\n *\n * @param string $invoiceNumber\n * @return array\n */\nfunction mockGetInvoiceDbData($invoiceNumber) {\n    return [\n        'InvoiceTransNo'  => 'TXN' . substr($invoiceNumber, 1),\n        'MerchantOrderNo' => 'ORD20260320001',\n        'RandomNum'       => '4567',\n        'TotalAmt'        => '1500'\n    ];\n}\n\n$errorMsg = null;\n$apiResult = null;\n$signatureVerified = null;\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $invoiceNumber = isset($_POST['InvoiceNumber']) ? trim($_POST['InvoiceNumber']) : '';\n    $invalidNo = isset($_POST['InvalidNo']) ? trim($_POST['InvalidNo']) : '';\n\n    if (empty($invoiceNumber) || empty($invalidNo)) {\n        $errorMsg = \"Both Receipt Invoice Number and Voided No are mandatory fields.\";\n    } else {\n        try {\n            $timestamp = (string)time();\n            $version = '1.1';\n            \n            // Generate non-encoded parameters string for internal data payload\n            $plainText = 'Version=' . $version . '&TimeStamp=' . $timestamp . '&InvoiceNumber=' . $invoiceNumber . '&InvalidNo=' . $invalidNo;\n\n            /* NON-STANDARD AES PADDING: PKCS7 with Block Size 32\n             * Standard AES uses PKCS7 padding aligned to a 16-byte block size (AES native block size).\n             * This API uses a non-standard variant where PKCS7 padding is aligned to 32 bytes.\n             * paddingLen = 32 - (plaintext.length % 32), result is always in range 1–32.\n             * Each padding byte value equals paddingLen.\n             * Apply this padding manually; use the cipher's ZERO_PADDING / no-padding flag\n             * to prevent the library from applying its own PKCS7 padding. */\n            $blockSize = 32;\n            $plaintextLength = strlen($plainText);\n            $paddingLen = $blockSize - ($plaintextLength % $blockSize);\n            $paddedText = $plainText . str_repeat(chr($paddingLen), $paddingLen);\n\n            $encryptedData = openssl_encrypt(\n                $paddedText,\n                'AES-256-CBC',\n                AES_KEY,\n                OPENSSL_RAW_DATA | OPENSSL_ZERO_PADDING,\n                AES_IV\n            );\n\n            if ($encryptedData === false) {\n                throw new Exception('Encryption operation failed in OpenSSL module.');\n            }\n\n            $hexPostData = bin2hex($encryptedData);\n\n            // API Payload formulation\n            $postFields = [\n                'MerchantID_' => MERCHANT_ID,\n                'SearchType_' => 3,\n                'PostData_'   => $hexPostData\n            ];\n\n            // Setup transmission stream\n            $ch = curl_init();\n            curl_setopt($ch, CURLOPT_URL, 'https://capi.travelinvoice.com.tw/invoice_search');\n            curl_setopt($ch, CURLOPT_POST, true);\n            curl_setopt($ch, CURLOPT_POSTFIELDS, http_build_query($postFields));\n            curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n            curl_setopt($ch, CURLOPT_TIMEOUT, 30);\n            curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, true);\n\n            $rawResponse = curl_exec($ch);\n            $httpStatus = curl_getinfo($ch, CURLINFO_HTTP_CODE);\n            \n            // Note: curl_close() has no effect in PHP 8.0+ and is intentionally omitted\n\n            if ($rawResponse === false) {\n                throw new Exception('Network communication failure: ' . curl_error($ch));\n            }\n\n            if ($httpStatus !== 200) {\n                throw new Exception('Inbound connection returned invalid HTTP state: ' . $httpStatus);\n            }\n\n            // Parse system response string query structure\n            $parsedResponse = [];\n            parse_str($rawResponse, $parsedResponse);\n\n            $apiResult = $parsedResponse;\n            $status = $apiResult['Status'] ?? '';\n            $checkCode = $apiResult['CheckCode'] ?? '';\n            $returnedInvoiceNo = $apiResult['InvoiceNumber'] ?? '';\n            $endStr = $apiResult['EndStr'] ?? '';\n\n            // Guard validation: confirm transmission completeness based on trailing boundary marker\n            $hasValidEnding = (substr(trim($rawResponse), -2) === '##') || ($endStr === '##');\n            if (!$hasValidEnding) {\n                throw new Exception('Data packet corrupted: Missing final stream sequence characters ##');\n            }\n\n            if ($status === 'SUCCESS' && !empty($checkCode)) {\n                // Perform DB mapping and security check integrity flow\n                $localData = mockGetInvoiceDbData($returnedInvoiceNo);\n                $signatureVerified = verifyCheckCode(\n                    $localData['InvoiceTransNo'],\n                    MERCHANT_ID,\n                    $localData['MerchantOrderNo'],\n                    $localData['RandomNum'],\n                    $localData['TotalAmt'],\n                    $checkCode\n                );\n            }\n\n        } catch (Exception $e) {\n            $errorMsg = $e->getMessage();\n        }\n    }\n}\n?>\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Voided Receipt Inquiry Client<\/title>\n    <style>\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 20px; }\n        .container { max-width: 800px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }\n        h1 { border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-top: 0; font-size: 24px; color: #111827; }\n        .form-group { margin-bottom: 15px; }\n        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }\n        input[type=\"text\"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 14px; }\n        button { background-color: #2563eb; color: #ffffff; border: none; padding: 10px 20px; font-weight: 600; border-radius: 4px; cursor: pointer; font-size: 14px; }\n        button:hover { background-color: #1d4ed8; }\n        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; }\n        .alert-error { background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }\n        .alert-success { background-color: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; }\n        .card { background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; padding: 20px; margin-top: 20px; }\n        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }\n        table { width: 100%; border-collapse: collapse; font-size: 14px; }\n        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }\n        th { background-color: #f3f4f6; font-weight: 600; width: 35%; }\n        .badge { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600; border-radius: 9999px; }\n        .badge-success { background-color: #10b981; color: #ffffff; }\n        .badge-danger { background-color: #ef4444; color: #ffffff; }\n    <\/style>\n<\/head>\n<body>\n\n<div class=\"container\">\n    <h1>Voided Receipt Inquiry Service<\/h1>\n\n    <?php if ($errorMsg): ?>\n        <div class=\"alert alert-error\">\n            <strong>Execution Error:<\/strong> <?php echo htmlspecialchars($errorMsg); ?>\n        <\/div>\n    <?php endif; ?>\n\n    <form method=\"POST\" action=\"\">\n        <div class=\"form-group\">\n            <label for=\"InvoiceNumber\">Receipt Invoice Number (收據號碼) <span style=\"color:red\">*<\/span><\/label>\n            <input type=\"text\" id=\"InvoiceNumber\" name=\"InvoiceNumber\" value=\"<?php echo isset($_POST['InvoiceNumber']) ? htmlspecialchars($_POST['InvoiceNumber']) : 'T13671005'; ?>\" placeholder=\"e.g. T13671005\" required>\n        <\/div>\n        <div class=\"form-group\">\n            <label for=\"InvalidNo\">Voided Transaction ID (作廢單號) <span style=\"color:red\">*<\/span><\/label>\n            <input type=\"text\" id=\"InvalidNo\" name=\"InvalidNo\" value=\"<?php echo isset($_POST['InvalidNo']) ? htmlspecialchars($_POST['InvalidNo']) : '85512'; ?>\" placeholder=\"e.g. 85512\" required>\n        <\/div>\n        <button type=\"submit\">Submit Inquiry Request<\/button>\n    <\/form>\n\n    <?php if ($apiResult): ?>\n        <div class=\"card\">\n            <h2>Query Execution Results<\/h2>\n            <table>\n                <tr>\n                    <th>Status Flag<\/th>\n                    <td>\n                        <?php \n                        $resStatus = $apiResult['Status'] ?? 'UNKNOWN'; \n                        if ($resStatus === 'SUCCESS'): \n                        ?>\n                            <span class=\"badge badge-success\">SUCCESS<\/span>\n                        <?php else: ?>\n                            <span class=\"badge badge-danger\"><?php echo htmlspecialchars($resStatus); ?><\/span>\n                        <?php endif; ?>\n                    <\/td>\n                <\/tr>\n                <tr>\n                    <th>Response Message<\/th>\n                    <td><?php echo htmlspecialchars($apiResult['Message'] ?? ''); ?><\/td>\n                <\/tr>\n                <?php if ($resStatus === 'SUCCESS'): ?>\n                    <tr>\n                        <th>Voided ID Sequence (作廢單流水號)<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['InvalidNo'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Receipt Invoice No<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['InvoiceNumber'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Voiding Option Category (作廢方式)<\/th>\n                        <td>\n                            <?php \n                            $type = $apiResult['InvalidType'] ?? ''; \n                            if ($type === '0') {\n                                echo '0 (Waiting Confirmation)';\n                            } elseif ($type === '1') {\n                                echo '1 (Instant Void)';\n                            } else {\n                                echo htmlspecialchars($type);\n                            }\n                            ?>\n                        <\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Voiding Process State (作廢狀態)<\/th>\n                        <td>\n                            <?php \n                            $state = $apiResult['InvalidStatus'] ?? '';\n                            if ($state === '0') {\n                                echo '0 (Unconfirmed)';\n                            } elseif ($state === '1') {\n                                echo '1 (Confirmed)';\n                            } elseif ($state === '2') {\n                                echo '2 (Cancelled)';\n                            } else {\n                                echo htmlspecialchars($state);\n                            }\n                            ?>\n                        <\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Invalidation Reasoning<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['invalidComment'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Initiation Record Date<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['InvalidCreateTime'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Void Processing Complete Date<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['InvalidDate'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Authorized Officer<\/th>\n                        <td><?php echo htmlspecialchars($apiResult['SellerName'] ?? ''); ?><\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Inbound Validation Hash (CheckCode)<\/th>\n                        <td>\n                            <code style=\"word-break: break-all;\"><?php echo htmlspecialchars($apiResult['CheckCode'] ?? ''); ?><\/code>\n                        <\/td>\n                    <\/tr>\n                    <tr>\n                        <th>Local Verification Check<\/th>\n                        <td>\n                            <?php if ($signatureVerified === true): ?>\n                                <span class=\"badge badge-success\">Passed (Signature Valid)<\/span>\n                            <?php elseif ($signatureVerified === false): ?>\n                                <span class=\"badge badge-danger\">Failed (Invalid Signature Detection)<\/span>\n                            <?php else: ?>\n                                <span style=\"color:#d97706\">Verification skipped (Data mismatch or omitted DB record)<\/span>\n                            <?php endif; ?>\n                        <\/td>\n                    <\/tr>\n                <?php endif; ?>\n            <\/table>\n        <\/div>\n    <?php endif; ?>\n<\/div>\n\n<\/body>\n<\/html>"};

        function initScrollSpy() {
            var navLinks = document.querySelectorAll('.nav-link');
            var sections = Array.from(document.querySelectorAll('section[id], div.api-section[id]'));
            function onScroll() {
                var currentId = '';
                var scrollPos = window.scrollY || document.documentElement.scrollTop;
                for (var i = 0; i < sections.length; i++) {
                    if (scrollPos >= sections[i].offsetTop - 100) { currentId = sections[i].getAttribute('id'); }
                }
                navLinks.forEach(function(link) {
                    link.classList.remove('sidebar-active');
                    if (link.getAttribute('href') === '#' + currentId) { link.classList.add('sidebar-active'); }
                });
            }
            window.removeEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll);
            setTimeout(onScroll, 100);
        }

        function initSearch() {
            var searchInput = document.getElementById('errorSearch');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    var term = e.target.value.toLowerCase().trim();
                    var allErrors = docConfig[currentLang].errors || [];
                    var filtered = allErrors.filter(function(err) {
                        return err.code.toLowerCase().includes(term) || err.reason.toLowerCase().includes(term);
                    });
                    renderErrorTable(filtered, 'error-table-body');
                });
            }
        }

            // 清空容器，確保重新渲染時不會重複疊加

            sections.forEach(function(sec, index) {

                var iconClass = sec.icon || 'fas fa-bookmark';
                var markerColor = sec.markerColor || 'bg-blue-600';
                navHtml += '<a href="#' + sectionId + '" class="nav-link block px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg transition-colors group"><i class="' + iconClass + ' w-6 group-hover:text-blue-500 transition-colors"></i> <span>' + sec.title + '</span></a>';

                    sectionBody += '<div class="text-slate-700 leading-relaxed text-base whitespace-pre-line mb-6 last:mb-0">' + sec.desc + '</div>';
                }

            // 以附加方式將流程圖區域加入現有容器，保留 renderCustomSections 所建立的內容

        function renderEncryptionRules() {
            var config = globalToolsConfig;
            var ui = docConfig[currentLang].ui;
            var section = document.getElementById('encryption');
            var aesBlock = document.getElementById('enc-rule-aes');
            var shaBlock = document.getElementById('enc-rule-sha');
            var navLink = document.getElementById('nav-encryption-link');
            
            if (!section || !aesBlock || !shaBlock) return;
            
            var hasContent = false;

            if (config.aes_encrypt && config.aes_encrypt.enabled) { 
                aesBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_step' + i + '_title']) {
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + (ui['enc_step' + i + '_desc'] || '') + '</p></div></div>';
                    i++;
                }
                let stepsContainer = document.getElementById('enc-rule-aes-steps');
                if (stepsContainer) stepsContainer.innerHTML = stepHtml;
            } else { 
                aesBlock.classList.add('hidden'); 
            }

            if (config.sha && config.sha.enabled) { 
                shaBlock.classList.remove('hidden'); 
                hasContent = true; 
                let stepHtml = '';
                let i = 1;
                while (ui['enc_sha_step' + i + '_title']) {
                    let desc = ui['enc_sha_step' + i + '_desc'] || '';
                    
                    if (config.sha.params) {
                        let shaConfig = config.sha.params;
                        let columns = shaConfig.columns ? shaConfig.columns.split(',').map(function(s) { return s.trim(); }) : [];
                        let keyLabel = shaConfig.key_label || 'HashKey';
                        let ivLabel = shaConfig.iv_label || 'HashIV';

                        if (columns.length > 0) {
                            if (i === 1) {
                                let actualCols = columns.join(', ');
                                let colsHtml = '<span class="font-mono text-purple-700 font-bold bg-purple-100 px-1.5 py-0.5 rounded border border-purple-200 mx-1">' + actualCols + '</span>';
                                
                                if (desc.includes('指定參數') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('指定參數', '指定參數 ' + colsHtml);
                                } else if (desc.includes('specified parameters') && !desc.includes(colsHtml)) {
                                    desc = desc.replace('specified parameters', 'specified parameters ' + colsHtml);
                                } else if (!desc.includes(colsHtml) && !desc.includes('PostData_')) {
                                    desc += ' ' + colsHtml;
                                }
                            }

                            let sortedCols = columns.slice().sort();
                            let mockQueryString = sortedCols.map(function(col, idx) { return col + '=val' + (idx + 1); }).join('&');

                            if (desc.includes('(key1=val1&key2=val2...)')) {
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded">(' + mockQueryString + ')</span>';
                                desc = desc.replace('(key1=val1&key2=val2...)', replaceStr);
                            }

                            if (desc.includes('HashKey=...&[SortedParams]&HashIV=...')) {
                                let fullMockString = keyLabel + '=[keyval]&' + mockQueryString + '&' + ivLabel + '=[ivval]';
                                let replaceStr = '<span class="font-mono text-blue-700 font-bold bg-blue-50 px-1 rounded break-all">' + fullMockString + '</span>';
                                desc = desc.replace('HashKey=...&[SortedParams]&HashIV=...', replaceStr);
                            }
                        }
                    }
                    
                    stepHtml += '<div class="flex"><div class="flex-shrink-0 w-8 h-8 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold">' + i + '</div><div class="ml-4"><h4 class="font-bold text-slate-800">' + ui['enc_sha_step' + i + '_title'] + '</h4><p class="text-sm text-slate-600 mt-1">' + desc + '</p></div></div>';

                if (navLink) navLink.classList.add('hidden');

        }

        function getKeys() {

        function runEncrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var data = document.getElementById('encryptInput').value.trim();
            if (!data) return alert(ui.tool_alert_missing_data);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encrypted = CryptoJS.AES.encrypt(data, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('encryptOutput').value = encrypted.ciphertext.toString(CryptoJS.enc.Hex);
            } catch (e) { alert(ui.tool_alert_encrypt_fail + e.message); }
        }

        function runDecrypt() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var hexStr = document.getElementById('decryptInput').value.trim();
            if (!hexStr) return alert(ui.tool_alert_missing_hex);
            try {
                var keyHex = CryptoJS.enc.Utf8.parse(keys.key);
                var ivHex = CryptoJS.enc.Utf8.parse(keys.iv);
                var encryptedHex = CryptoJS.enc.Hex.parse(hexStr);
                var encryptedBase64 = CryptoJS.enc.Base64.stringify(encryptedHex);
                var decrypted = CryptoJS.AES.decrypt(encryptedBase64, keyHex, { iv: ivHex, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                document.getElementById('decryptOutput').value = decrypted.toString(CryptoJS.enc.Utf8);
            } catch (e) { alert(ui.tool_alert_decrypt_fail); }
        }

        function runSHA() {
            var ui = docConfig[currentLang].ui;
            var keys = getKeys(); if (!keys) return;
            var config = (globalToolsConfig.sha && globalToolsConfig.sha.params) ? globalToolsConfig.sha.params : {};
            var columns = config.columns ? config.columns.split(',').map(function(s) { return s.trim(); }) : [];
            try {
                var params = {};
                columns.forEach(function(col) {
                    var input = document.getElementById('sha_param_' + col);
                    if (input) params[col] = input.value.trim();
                });
                var sortedKeys = Object.keys(params).sort();
                var sortedString = sortedKeys.map(function(key) { return key + '=' + params[key]; }).join('&');
                
                var keyLabel = config.key_label !== undefined ? config.key_label : 'HashKey';
                var ivLabel = config.iv_label !== undefined ? config.iv_label : 'HashIV';
                
                var finalStringParts = [];
                if (keyLabel && keys.key) finalStringParts.push(keyLabel + '=' + keys.key);
                if (sortedString) finalStringParts.push(sortedString);
                if (ivLabel && keys.iv) finalStringParts.push(ivLabel + '=' + keys.iv);
                
                var finalString = finalStringParts.join('&');
                
                var preHashEl = document.getElementById('shaPreHashOutput');
                if (preHashEl) preHashEl.value = finalString;

                document.getElementById('shaOutput').value = CryptoJS.SHA256(finalString).toString(CryptoJS.enc.Hex).toUpperCase();
            } catch (e) { alert('SHA calculation failed: ' + e.message); }
        }

        // 移除所有的高亮標籤，將內容還原為純文字
        function clearAllHighlights() {
            searchMarks.forEach(function(m) {
                var textNode = document.createTextNode(m.textContent);
                m.parentNode.replaceChild(textNode, m);
            });
            searchMarks = [];
            currentMarkIndex = -1;
        }

        // 安全地高亮元素內的指定文字，並套上識別用的 class
        function highlightKeywordInElement(element, keyword) {
            if (!keyword || !element) return;
            var escapeRegExp = function(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
            var regex = new RegExp('(' + escapeRegExp(keyword) + ')', 'gi');

            var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var node;
            while ((node = walker.nextNode())) {
                var parent = node.parentNode;
                
                // 確保節點具備 closest 方法 (Element)
                if (parent && typeof parent.closest === 'function') {
                    // 使用 closest() 往上層追溯，確保該文字沒有被包在程式碼或不該高亮的標籤內
                    var isExcluded = parent.closest('script, style, mark, code, pre, textarea') !== null;
                    
                    // 判斷該元素的父層是否處於隱藏狀態
                    var isHidden = (parent.getClientRects().length === 0);

                    if (!isExcluded && !isHidden) {
                        if (node.nodeValue.match(regex)) {
                            textNodes.push(node);
                        }
                    }
                }
            }

            textNodes.forEach(function(node) {
                var fragment = document.createDocumentFragment();
                var parts = node.nodeValue.split(regex);
                var lowerKeyword = keyword.toLowerCase();
                
                parts.forEach(function(part) {
                    if (part.toLowerCase() === lowerKeyword) {
                        var mark = document.createElement('mark');
                        // 加入 'search-highlight' 以供導覽列抓取節點
                        mark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
                        mark.textContent = part;
                        fragment.appendChild(mark);
                    } else if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        // 注入預設的常駐搜尋導覽列 (包含摺疊按鈕與展開內容)
        function injectSearchNavigator() {
            var navHtml = `
            <div id="search-navigator" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-[110] bg-white text-slate-700 shadow-2xl border border-slate-200 rounded-full flex items-center transition-all duration-300 overflow-hidden">
                <!-- 摺疊狀態下的單純放大鏡按鈕 -->
                <button id="search-nav-collapsed-btn" onclick="expandSearch()" class="w-14 h-14 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer" title="開啟頁面內搜尋">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- 展開狀態的完整工具列 -->
                <div id="search-nav-expanded" class="hidden items-center px-4 py-2 gap-3">
                    <div class="flex items-center gap-2 bg-blue-50 text-blue-700 pl-3 pr-3 py-1.5 rounded-full">
                        <i class="fas fa-search text-blue-500 text-sm"></i>
                        <input type="text" id="search-nav-input" class="bg-transparent border-none outline-none w-20 sm:w-28 text-sm font-bold text-blue-700 placeholder-blue-300" placeholder="搜尋關鍵字..." onkeydown="if(event.key === 'Enter') executeInlineSearch(this.value)">
                        <div class="h-4 w-[1px] bg-blue-200 mx-1"></div>
                        <span id="search-nav-text" class="min-w-[40px] text-center tracking-wide text-sm font-bold">0 / 0</span>
                    </div>
                    <div class="flex items-center border-l border-r border-slate-200 px-2 gap-1 h-8">
                        <button onclick="navigateSearch(-1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="上一個"><i class="fas fa-arrow-up"></i></button>
                        <button onclick="navigateSearch(1)" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition" title="下一個"><i class="fas fa-arrow-down"></i></button>
                    </div>
                    <button onclick="collapseSearch()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition" title="結束並關閉搜尋"><i class="fas fa-times text-lg"></i></button>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', navHtml);
        }

        // 將搜尋工具列展開
        function expandSearch() {
            document.getElementById('search-nav-collapsed-btn').classList.add('hidden');
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.remove('hidden');
            expandedContent.classList.add('flex');
            document.getElementById('search-nav-input').focus();
        }

        // 結束搜尋並將工具列收合回按鈕
        function collapseSearch() {
            var expandedContent = document.getElementById('search-nav-expanded');
            expandedContent.classList.add('hidden');
            expandedContent.classList.remove('flex');
            document.getElementById('search-nav-collapsed-btn').classList.remove('hidden');
            
            clearAllHighlights();

            // 清除網址上的關鍵字參數與輸入框
            document.getElementById('search-nav-input').value = '';
            document.getElementById('search-nav-text').innerText = '0 / 0';
            var url = new URL(window.location);
            url.searchParams.delete('q');
            window.history.replaceState({}, document.title, url);
        }

        // 執行行內重新搜尋 (透過工具列輸入框觸發)
        function executeInlineSearch(newKeyword) {
            newKeyword = newKeyword.trim();
            
            // 先清除現有高亮
            clearAllHighlights();

            var url = new URL(window.location);
            
            if (!newKeyword) {
                url.searchParams.delete('q');
                window.history.replaceState({}, document.title, url);
                document.getElementById('search-nav-text').innerText = '0 / 0';
                return;
            }

            // 更新網址，不重新整理
            url.searchParams.set('q', newKeyword);
            window.history.replaceState({}, document.title, url);

            // 執行新關鍵字的高亮掃描
            var mainContent = document.querySelector('main');
            if (mainContent) highlightKeywordInElement(mainContent, newKeyword);
            
            searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
            
            if (searchMarks.length > 0) {
                document.getElementById('search-nav-text').innerText = '1 / ' + searchMarks.length;
                goToSearchMark(0);
            } else {
                // 若找不到結果，維持顯示 0/0
                document.getElementById('search-nav-text').innerText = '0 / 0';
            }
        }

        // 上下切換搜尋結果
        function navigateSearch(direction) {
            if (searchMarks.length === 0) return;
            let nextIndex = currentMarkIndex + direction;
            if (nextIndex >= searchMarks.length) nextIndex = 0;
            if (nextIndex < 0) nextIndex = searchMarks.length - 1;
            goToSearchMark(nextIndex);
        }

        // 移動並鎖定到特定的高亮字
        function goToSearchMark(index) {
            if (searchMarks.length === 0) return;
            if (currentMarkIndex >= 0 && currentMarkIndex < searchMarks.length) {
                // 還原前一個高亮字的樣式
                let oldMark = searchMarks[currentMarkIndex];
                oldMark.className = 'search-highlight bg-yellow-200 text-slate-900 rounded px-1 font-bold shadow-sm transition-colors';
            }
            currentMarkIndex = index;
            let newMark = searchMarks[currentMarkIndex];
            
            // 將目前鎖定的字套上橘色顯眼樣式
            newMark.className = 'search-highlight bg-orange-500 text-white rounded px-1 font-bold shadow-md ring-4 ring-orange-300 transition-colors';
            
            // 平滑滾動讓該字對齊畫面中央，不會因為外層區塊太長而失焦
            newMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            document.getElementById('search-nav-text').innerText = (currentMarkIndex + 1) + ' / ' + searchMarks.length;
        }

        window.onload = function() {
            initLangDropdown();
            applyTranslations(currentLang);
            renderAll();
            initSearch();

            // 頁面載入時注入預設的常駐搜尋列
            injectSearchNavigator();

            var urlParams = new URLSearchParams(window.location.search);
            var keyword = urlParams.get('q');
            var hashId = window.location.hash ? window.location.hash.substring(1) : null;
            var targetElement = hashId ? document.getElementById(hashId) : null;

            // 如果有帶關鍵字，先進行文字節點的掃描與高亮，並自動展開搜尋列
            if (keyword) {
                var mainContent = document.querySelector('main');
                if (mainContent) {
                    highlightKeywordInElement(mainContent, keyword);
                }
                searchMarks = Array.from(document.querySelectorAll('mark.search-highlight'));
                
                document.getElementById('search-nav-input').value = keyword;
                expandSearch();
            }

            // 確保所有動態 DOM 產生完畢後，決定跳轉行為
            setTimeout(function() {
                if (searchMarks.length > 0) {
                    let startIndex = 0;
                    if (targetElement) {
                        // 如果有帶錨點，試圖尋找該錨點區塊內的「第一個高亮字」，直接從該字開始
                        let firstMarkInTarget = targetElement.querySelector('mark.search-highlight');
                        if (firstMarkInTarget) {
                            startIndex = searchMarks.indexOf(firstMarkInTarget);
                        }
                    }
                    goToSearchMark(startIndex);
                } else if (targetElement) {
                    // 若沒有搜尋關鍵字 (單純點擊左側選單錨點)，則使用原本的對齊頂部模式
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    targetElement.classList.add('ring-4', 'ring-blue-300', 'ring-opacity-50', 'transition-all', 'duration-1000', 'rounded-xl');
                    setTimeout(function() {
                        targetElement.classList.remove('ring-4', 'ring-blue-300', 'ring-opacity-50');
                    }, 2000);
                }
            }, 300);
        };

        function renderCodeTabs() {
            var container = document.getElementById('code-tabs-container');
            var exampleSection = document.getElementById('example');
            if (!container || !exampleSection) return;
            var availableLangs = Object.keys(globalCodeExamples);
            if (availableLangs.length === 0) { exampleSection.classList.add('hidden'); return; }
            else { exampleSection.classList.remove('hidden'); }
            if (availableLangs.indexOf(currentCodeTab) === -1) { currentCodeTab = availableLangs[0]; }
            var html = '';
            availableLangs.forEach(function(lang) {
                var activeClass = (lang === currentCodeTab) ? 'active' : '';
                html += '<button onclick="switchTab(\'' + lang + '\', event)" class="tab-btn ' + activeClass + ' px-6 py-3 text-sm font-medium text-slate-300 hover:text-white transition-colors whitespace-nowrap">' + lang + '</button>';
            });
            container.innerHTML = html;
        }

        function switchTab(lang, event) {
            currentCodeTab = lang;
            renderCodeTabs();
            loadCode(lang);
        }

        function loadCode(lang) {
            var container = document.getElementById('code-container');
            if (!lang) lang = Object.keys(globalCodeExamples)[0] || 'plaintext';
            var langMap = { 'PHP': 'php', 'Node.js': 'javascript', 'Python': 'python', 'C#(.NET)': 'csharp', 'Java': 'java', 'Go': 'go', 'ASP': 'vbscript', 'ASP.NET': 'csharp' };
            var codeContent = globalCodeExamples[lang] || '// 尚無程式範例';
            container.innerHTML = '<code id="code-display" class="h-full language-' + (langMap[lang] || 'plaintext') + '"></code>';
            var display = document.getElementById('code-display');
            display.textContent = codeContent;
            if (typeof hljs !== 'undefined') {
                hljs.highlightElement(display);
                if (typeof hljs.lineNumbersBlock === 'function') { hljs.lineNumbersBlock(display); }
            }
        }
